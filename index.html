om the route and pushed her way through shrubbery until she reached the hidden entrance to a cave.\nToward the back of the cave, she found the stone pile she had built She moved the stones and then dug a shallow hole where they had stood. When her fingers felt cool metal, she dug around it and pulled out a magic lamp. She rubbed the side, beckoning out the genie.\n\"Hello, again,\" he said. \"I know it's been many years since I last saw you, but that doesn't change the fact that you've already used up your wish.\"\n\"Oh, I'm not here for a new wish,\" Monica said. \"I have a question about my old one.\"\n\"I see,\" the genie said. \"Remind me what I did for you.\"\n\"I wished for you to create a friend for me. You created her and her family, and you made us best friends.\"\n\"Oh, yes, yes. I remember. What's your question?\"\n\"Well, I'm starting to worry about what would happen if I stopped wishing for her to exist. What if I got mad at her, and I wished her away? Would she just vanish?\"\n\"Do you think getting mad at her would actually make you wish that she didn't exist?\" the genie asked.\n\"I don't know. I've always been too afraid to let myself get mad at her. I don't really know what would happen.\"\n\"I'm more of a wish expert than a friendship expert,\" said the genie, \"but I think your current strategy is dangerous. You could easily start resenting her if you keep burying your feelings. That resentment itself may make you wish her away. I think you should just argue respectfully, and you'll find that your love for her won't go away just because you get a little mad.\"\n\"That seems risky,\" Monica answered.\n\"Is it any riskier than never dealing with your conflicts?\"", "Text 1:\nA Painting at the Show\nRochelle carried her painting up to the art teacher, feeling very proud of her work. With a flourish, she held it up in front of Mrs. Jameel's desk.\n\"Oh, Rochelle,\" Mrs. Jameel said with a smile, \"It really is beautiful. I love the way you captured the mist at the foot of the waterfall.\" Rochelle couldn't help smiling. \"I mentioned a few weeks ago that the city is having an art show to display the works of local people with Down Syndrome. Would you like to enter this painting? I think it would be an excellent choice.\"\n\"Yes,\" Rochelle said, \"I was really hoping you would say that. This is the best painting I've ever done, and it means a lot to me. I really want to share it.\"\nMrs. Jameel agreed, and she said she would prepare the paperwork to have Rochelle's painting entered in the show.\nOn the first day of the art show, Rochelle and her family eagerly looked through the display. One painting had attracted quite a few people. As Rochelle approached, she could see why. It was an image of City Hall painted in bright colors. The gorgeous yellows and purples the artist had chosen were rich and vibrant.\nRochelle recognized the artist and walked over to congratulate him. He thanked her. \"The mayor just bought it,\" he said, obviously pleased and surprised. \"She wants to hang it in City Hall!\"\nRochelle was impressed. It had never occurred to her that anyone would buy the paintings in the show. When she reached her own painting, she lingered near it for a few minutes in case anyone asked about buying it. A few people stopped to admire it while she stood there.\n\"Is this Yosemite Falls?\" asked a lady.\n\"Yes, I went hiking there with my family last summer. My mom took a picture of the waterfall, and I liked it so much I wanted to paint it.\" As she looked at the painting again, it filled her with warm memories of telling stories around the campfire and gathering pinecones to drop in the river.\n\"It really turned out beautifully,\" the lady said. \"Yosemite is one of my favorite places in the world. Would you consider selling this?\"\nRochelle looked at the painting again. She smiled at the lady and said, \"Thank you so much. I'm really glad you like it, but I think I want to keep this one. It means a lot to me.\"\n\nText 2:\nRead the two stories.\nCommunications Malfunction\nEight months had passed without event while we slept in the ship's hibernation pods. We had entered the orbit of Mars, and we would be able to initiate landing in a little over two days.\n\"Prepare a transmission for Earth. Send the computer's full report on our ship's condition for analysis,\" I directed. The transmission would reach them in about a day, and their response would take an equal amount of time to reach us. In the meantime, there was little we could do.\nAfter transmitting the report, the crew and I sat down together to eat a celebratory breakfast. \"When I was a little girl, I always wanted to be an astronaut,\" I reflected. \"But I only imagined going to the Moon. This is really the ultimate dream.\" Vera echoed my experience.\n\"I wanted to be a firefighter. I guess I failed,\" laughed our engineer, Francisco.\n\"Don't worry. There's still time,\" Vera assured him with a smile.\nAfter a few days of killing time, a grave Vera alerted me that we had received a response. \"The message appears to have been corrupted during transmission, Captain. Hopefully, more will come through soon. All we have so far is two words: ship and unstable.\"\n\"That's discouraging,\" I said. \"They must have found something in their analysis of our ship's data.\" We let them know what we had received. Hopefully, they would resend the information soon. While we waited, we conducted a thorough examination of the ship.\nAfter a day of searching, our tensions were high. We slept in shifts in case anything went wrong. Twenty-two hours into our wait, the three of us were trying to relax when a new message came through. This one, too, was fragmentary. Three words had been successfully received: for, radio, and transmit.\n\"I think we have to face the possibility that something is wrong with our communications system,\" I said bluntly. \"We don't have the analytical power on-board to ensure the safety of our systems independently. If we can't establish communication with Earth, we'll have to return without landing.\"\nWe agreed that Francisco should carefully examine the hardware of the communications array. He went to work, removing a panel and examining the wiring below. Suddenly, he gave a shout and leapt back. Smoke billowed from the open panel. Francisco grabbed the fire extinguisher and stopped the burn, but the transmitter was completely destroyed.\nWith heavy hearts, we prepared to return to Earth. \"I'm sorry, team,\" I said. \"It looks like our dreams are dead.\"\n\"Well,\" said Vera. \"At least Francisco got to be a firefighter.\"\n\nDrums and a Voice\nShakir looked at his phone again, but there were no new messages. Where was Ramona? He looked nervously at Beatriz. Her drums and his vocals would be pretty weak without Ramona's guitar.\nWhen their turn came to audition, Ramona still hadn't shown up. Shakir and Beatriz took the stage and played their best, but Shakir knew it was futile. This had been their chance to achieve the dream of playing during the summer concert series, and it was already dead. When the winners were announced, Shakir's band was not among them.\nAs his mom was driving Shakir home, his phone rang. \"Hey, Ramona,\" he said, trying not to sound annoyed with her.\n\"I just got your texts!\" she wailed. \"I can't believe I missed the audition! What happened? You just told me last night that they changed the date.\"\n\"What?\" Shakir was shocked. \"I never said that!\"\n\"You did! You sent a message saying the date was postponed until the fifteenth.\"\n\"Oh, no! That was about the research paper for Mrs. McCloskey. She told us in class, and you missed the announcement since you were at the dentist.\"\nBoth of them were quiet for a minute. Ramona broke the silence. \"How did you and Beatriz do?\"\n\"Well, we tried our best,\" he answered. \"Honestly, though, it wasn't much of a performance. And next year, we'll be out of the qualifying age range for the younger acts. Then, we'll be auditioning against professionals.\"\n\"I grew up watching that summer concert series. I've dreamed of playing in it for years,\" she said. \"Just a simple mistake, and—poof!—the dream is gone. And it was so preventable.\"\nShakir sighed. How could a simple miscommunication do so much harm? It felt like he should be able to hit the undo button on the whole day."]}, {"unit": "Comprehension Skills", "topic": "Summaries", "lesson": "Identify an objective summary", "texts": ["Read the excerpt below, keeping in mind how you would summarize the most important parts objectively.\n\nDracula\nBy Bram Stoker\n\n8 May.—I began to fear as I wrote in this book that I was getting too diffuse; but now I am glad that I went into detail from the first, for there is something so strange about this place and all in it that I cannot but feel uneasy. I wish I were safe out of it, or that I had never come. It may be that this strange night-existence is telling on me; but would that that were all! If there were any one to talk to I could bear it, but there is no one. I have only the Count to speak with, and he!—I fear I am myself the only living soul within the place. Let me be prosaic so far as facts can be; it will help me to bear up, and imagination must not run riot with me. If it does I am lost. Let me say at once how I stand—or seem to.\nI only slept a few hours when I went to bed, and feeling that I could not sleep any more, got up. I had hung my shaving glass by the window, and was just beginning to shave. Suddenly I felt a hand on my shoulder, and heard the Count’s voice saying to me, “Good-morning.” I started, for it amazed me that I had not seen him, since the reflection of the glass covered the whole room behind me. In starting I had cut myself slightly, but did not notice it at the moment. Having answered the Count’s salutation, I turned to the glass again to see how I had been mistaken. This time there could be no error, for the man was close to me, and I could see him over my shoulder. But there was no reflection of him in the mirror! The whole room behind me was displayed; but there was no sign of a man in it, except myself. This was startling, and, coming on the top of so many strange things, was beginning to increase that vague feeling of uneasiness which I always have when the Count is near; but at the instant I saw that the cut had bled a little, and the blood was trickling over my chin. I laid down the razor, turning as I did so half round to look for some sticking plaster. When the Count saw my face, his eyes blazed with a sort of demoniac fury, and he suddenly made a grab at my throat. I drew away, and his hand touched the string of beads which held the crucifix. It made an instant change in him, for the fury passed so quickly that I could hardly believe that it was ever there.\n“Take care,” he said, “take care how you cut yourself. It is more dangerous than you think in this country.” Then seizing the shaving glass, he went on: “And this is the wretched thing that has done the mischief. It is a foul bauble of man’s vanity. Away with it!” and opening the heavy window with one wrench of his terrible hand, he flung out the glass, which was shattered into a thousand pieces on the stones of the courtyard far below. Then he withdrew without a word. It is very annoying, for I do not see how I am to shave, unless in my watch-case or the bottom of the shaving-pot, which is fortunately of metal.\nWhen I went into the dining-room, breakfast was prepared; but I could not find the Count anywhere. So I breakfasted alone. It is strange that as yet I have not seen the Count eat or drink. He must be a very peculiar man! After breakfast I did a little exploring in the castle. I went out on the stairs, and found a room looking towards the South. The view was magnificent, and from where I stood there was every opportunity of seeing it.\nThe castle is on the very edge of a terrible precipice. A stone falling from the window would fall a thousand feet without touching anything! As far as the eye can reach is a sea of green tree tops, with occasionally a deep rift where there is a chasm. Here and there are silver threads where the rivers wind in deep gorges through the forests.\nBut I am not in heart to describe beauty, for when I had seen the view I explored further; doors, doors, doors everywhere, and all locked and bolted. In no place save from the windows in the castle walls is there an available exit.\nThe castle is a veritable prison, and I am a prisoner!", "Read the excerpt below, keeping in mind how you would summarize the most important parts objectively.\n\nDracula\nBy Bram Stoker\n\nJONATHAN HARKER’S JOURNAL—continued\n\nWhen I found that I was a prisoner a sort of wild feeling came over me. I rushed up and down the stairs, trying every door and peering out of every window I could find; but after a little the conviction of my helplessness overpowered all other feelings. When I look back after a few hours I think I must have been mad for the time, for I behaved much as a rat does in a trap. When, however, the conviction had come to me that I was helpless I sat down quietly—as quietly as I have ever done anything in my life—and began to think over what was best to be done. I am thinking still, and as yet have come to no definite conclusion. Of one thing only am I certain; that it is no use making my ideas known to the Count. He knows well that I am imprisoned; and as he has done it himself, and has doubtless his own motives for it, he would only deceive me if I trusted him fully with the facts. So far as I can see, my only plan will be to keep my knowledge and my fears to myself, and my eyes open. I am, I know, either being deceived, like a baby, by my own fears, or else I am in desperate straits; and if the latter be so, I need, and shall need, all my brains to get through.\nI had hardly come to this conclusion when I heard the great door below shut, and knew that the Count had returned. He did not come at once into the library, so I went cautiously to my own room and found him making the bed. This was odd, but only confirmed what I had all along thought—that there were no servants in the house. When later I saw him through the chink of the hinges of the door laying the table in the dining-room, I was assured of it; for if he does himself all these menial offices, surely it is proof that there is no one else to do them. This gave me a fright, for if there is no one else in the castle, it must have been the Count himself who was the driver of the coach that brought me here. This is a terrible thought; for if so, what does it mean that he could control the wolves, as he did, by only holding up his hand in silence. How was it that all the people at Bistritz and on the coach had some terrible fear for me? What meant the giving of the crucifix, of the garlic, of the wild rose, of the mountain ash? Bless that good, good woman who hung the crucifix round my neck! for it is a comfort and a strength to me whenever I touch it. It is odd that a thing which I have been taught to regard with disfavour and as idolatrous should in a time of loneliness and trouble be of help. Is it that there is something in the essence of the thing itself, or that it is a medium, a tangible help, in conveying memories of sympathy and comfort? Some time, if it may be, I must examine this matter and try to make up my mind about it. In the meantime I must find out all I can about Count Dracula, as it may help me to understand. To-night he may talk of himself, if I turn the conversation that way. I must be very careful, however, not to awake his suspicion."]}, {"unit": "Comprehension Skills", "topic": "Summaries", "lesson": "Identify an effective summary", "texts": ["Text 1:\nRead the excerpt below, taking note of the central idea and key details of the story.\n\nAladdin and his Wonderful Lamp\nFrom The Blue Fairy Book\nEdited by Andrew Lang\n\nA long, long time ago, in a small village in the Eastern part of the world lived a poor tailor with a son named Aladdin. Aladdin was a careless, idle boy who would do nothing but play ball all day long in the streets with little idle boys like himself. This so grieved the father that he died; yet, in spite of his mother's tears and prayers, Aladdin did not mend his ways. One day, when he was playing in the streets as usual, a stranger asked him his age, and if he was not the son of Mustapha the tailor. \"I am, sir,\" replied Aladdin; \"but he died a long while ago.\" On this the stranger, who was a famous African magician, fell on his neck and kissed him, saying, \"I am your uncle, and knew you from your likeness to my brother. Go to your mother and tell her I am coming.\" Aladdin ran home and told his mother of his newly found uncle. \"Indeed, child,\" she said, \"your father had a brother, but I always thought he was dead.\" However, she prepared supper, and bade Aladdin seek his uncle, who came laden with wine and fruit. He presently fell down and kissed the place where Mustapha used to sit, bidding Aladdin's mother not to be surprised at not having seen him before, as he had been forty years out of the country. He then turned to Aladdin, and asked him his trade, at which the boy hung his head, while his mother burst into tears. On learning that Aladdin was idle and would learn no trade, he offered to take a shop for him and stock it with merchandise. Next day he bought Aladdin a fine suit of clothes and took him all over the city, showing him the sights, and brought him home at nightfall to his mother, who was overjoyed to see her son so fine.\nThe next day the magician led Aladdin into some beautiful gardens a long way outside the city gates. They sat down by a fountain and the magician pulled a cake from his girdle, which he divided between them. They then journeyed onward till they almost reached the mountains. Aladdin was so tired that he begged to go back, but the magician beguiled him with pleasant stories, and led him on in spite of himself. At last they came to two mountains divided by a narrow valley. \"We will go no farther,\" said the false uncle. \"I will show you something wonderful; only do you gather up sticks while I kindle a fire.\" When it was lit the magician threw on it a powder he had about him, at the same time saying some magical words. The earth trembled a little and opened in front of them, disclosing a square flat stone with a brass ring in the middle to raise it by. Aladdin tried to run away, but the magician caught him and gave him a blow that knocked him down. \"What have I done, uncle?\" he said piteously; whereupon the magician said more kindly: \"Fear nothing, but obey me. Beneath this stone lies a treasure which is to be yours, and no one else may touch it, so you must do exactly as I tell you.\" At the word treasure Aladdin forgot his fears, and grasped the ring as he was told, saying the names of his father and grandfather. The stone came up quite easily, and some steps appeared. \"Go down,\" said the magician; \"at the foot of those steps you will find an open door leading into three large halls. Tuck up your gown and go through them without touching anything, or you will die instantly. These halls lead into a garden of fine fruit trees. Walk on until you come to a niche in a terrace where stands a lighted lamp. Pour out the oil it contains, and bring it to me.\" He drew a ring from his finger and gave it to Aladdin, bidding him prosper.\nAladdin found everything as the magician had said, gathered some fruit off the trees, and, having got the lamp, arrived at the mouth of the cave. The magician cried out in a great hurry: \"Make haste and give me the lamp.\" This Aladdin refused to do until he was out of the cave. The magician flew into a terrible passion, and throwing some more powder on to the fire, he said something, and the stone rolled back into its place.\nThe magician left Persia for ever, which plainly showed that he was no uncle of Aladdin's, but a cunning magician, who had read in his magic books of a wonderful lamp, which would make him the most powerful man in the world. Though he alone knew where to find it, he could only receive it from the hand of another. He had picked out the foolish Aladdin for this purpose, intending to get the lamp and kill him afterward.\n\nText 2:\nRead the excerpt below, taking note of the central idea and key ideas of the story.\n\nAladdin and his Wonderful Lamp\nFrom The Blue Fairy Book\nEdited by Andrew Lang\n\nFor two days Aladdin remained in the dark, crying and lamenting. At last he clasped his hands in prayer, and in so doing rubbed the ring, which the magician had forgotten to take from him. Immediately an enormous and frightful genie rose out of the earth, saying: \"What wouldst thou with me? I am the Slave of the Ring, and will obey thee in all things.\" Aladdin fearlessly replied: \"Deliver me from this place!\" whereupon the earth opened, and he found himself outside. As soon as his eyes could bear the light he went home, but fainted on the threshold.\nWhen he came to himself he told his mother what had passed, and showed her the lamp and the fruits he had gathered in the garden, which were, in reality, precious stones. He then asked for some food. \"Alas! child,\" she said, \"I have nothing in the house, but I have spun a little cotton and will go and sell it.\" Aladdin bade her keep her cotton, for he would sell the lamp instead. As it was very dirty she began to rub it, that it might fetch a higher price. Instantly a hideous genie appeared, and asked what she would have. She fainted away, but Aladdin, snatching the lamp, said boldly: \"Fetch me something to eat!\" The genie returned with a silver bowl, twelve silver plates containing rich meats, two silver cups, and two bottles of wine.\nAladdin's mother, when she came to herself, said: \"Whence comes this splendid feast?\" \"Ask not, but eat,\" replied Aladdin. So they sat at breakfast till it was dinner-time, and Aladdin told his mother about the lamp. She begged him to sell it, and have nothing to do with devils. \"No,\" said Aladdin, \"since chance hath made us aware of its virtues, we will use it, and the ring likewise, which I shall always wear on my finger.\" When they had eaten all the genie had brought, Aladdin sold one of the silver plates, and so on until none were left. He then had recourse to the genie, who gave him another set of plates, and thus they lived for many years.", "Text 1:\nRead the excerpt below, taking note of the central idea and key details of the story.\n\nAladdin and his Wonderful Lamp\nFrom The Blue Fairy Book\nEdited by Andrew Lang\n\nA long, long time ago, Aladdin, a poor boy who lived with his mother in a small village in the Eastern part of the world, acquired a magical lamp with a genie that grants him wishes, as well as valuable magical fruits.\n\nOne day the Princess, daughter of the Sultan, left the royal palace for the first time to make a short visit to a neighboring country. Aladdin was seized by a desire to see her face, which was very difficult, as she was always veiled. He hid himself behind a door and peeped through a small hole as the Princess's carriage passed by. At that moment, the Princess, believing herself to be alone with her servants, lifted her veil to observe something in the distance. She looked so beautiful that Aladdin fell in love with her at first sight.\nAladdin went home so changed that his mother was frightened. He told her he loved the Princess so deeply that he could not live without her, and meant to ask for her hand in marriage. His mother, on hearing this, begged him to consider the absurdity of his desire. At last, seeing that he would not relent, Aladdin's mother agreed to go before the Sultan and carry his request. She fetched a napkin and laid in it the magic fruits from the enchanted garden, which sparkled and shone like the most beautiful jewels. She took these with her to please the Sultan, and set out, trusting in the lamp.\nThe Grand Vizier and the lords of council had just gone into the Sultan's throne room. As she entered the hall, she placed herself in front of the Sultan, but he took no notice of her. She went every day for a week and stood in the same place.\nWhen the council finally broke up on the sixth day, the Sultan said to his Vizier, \"I see a certain woman in the audience-chamber every day carrying something in a napkin. Call upon her next time, so that I may find out what she wants.\"\nThe next day, at a sign from the Vizier, she went up to the foot of the throne and remained kneeling till the Sultan said to her: \"Rise, good woman, and tell me what you want.\"\nShe hesitated, so the Sultan sent away all but the Vizier, and bade her speak frankly, promising to forgive her beforehand for anything she might say. She then told him of her son's violent love for the Princess.\n\"I prayed him to forget her, but in vain,\" she said. \"He threatened to do some desperate deed if I refused to go and ask your Majesty for the hand of the Princess. Now I pray you to forgive not me alone, but my son Aladdin.\"\nThe Sultan asked her kindly what she had in the napkin, whereupon she unfolded the jewels and presented them. He was thunderstruck, and turning to the Vizier said, \"What sayest thou? Ought I not to bestow the Princess on one who values her at such a price?\"\nThe Vizier, who wanted the Princess to marry his own son, begged the Sultan to withhold her for three months, in the course of which he hoped his son would contrive to make him a richer present. The Sultan granted this, and told Aladdin's mother that, though he consented to the marriage, she must not appear before him again for three months.\nAladdin waited patiently for over two months. During the third month, his mother went into the city to buy oil and found a population rejoicing. She asked what was going on. \"Do you not know,\" was the answer, \"that the son of the Grand Vizier is to marry the Sultan's daughter tonight?\"\nBreathless, she ran and told Aladdin. The boy was overwhelmed at first, but thought to consult the genie in his lamp. He rubbed it, and the genie appeared, saying, \"What is thy will?\"\nAladdin replied: \"The Sultan, as thou knowest, has broken his promise to me, and the Vizier's son is to have the Princess. My command is that to-night you bring hither the bride and bridegroom.\"\n\"Master, I obey,\" said the genie.\nAladdin then went to his chamber, where, sure enough, at midnight the genie transported the bed containing the Vizier's son and the Princess.\n\"Take this new-married man,\" he said, \"and put him outside in the cold, and return at daybreak.\" Whereupon the genie took the Vizier's son out of bed, leaving Aladdin with the Princess.\n\"Fear nothing,\" Aladdin said to her; \"you are my wife, promised to me by your unjust father, and no harm shall come to you.\"\nThe Princess, too frightened to speak, passed the most miserable night of her life while Aladdin lay down beside her and slept soundly. At the appointed hour the genie fetched in the shivering bridegroom, laid him in his place, and transported the bed back to the palace.\nPresently, the Sultan came to wish his daughter good-morning. The unhappy Vizier's son jumped up and hid himself, while the sorrowful Princess would not say a word.\nThe Sultan sent her mother to her, who said: \"How comes it, child, that you will not speak to your father? What has happened?\"\nThe Princess sighed deeply, and at last told her mother how, during the night, the bed had been carried into some strange house, and what had passed there. Her mother did not believe her in the least, but bade her rise and consider it an idle dream.\nThe following night, the same thing happened. The next morning, on the Princess's refusal to speak, the Sultan threatened to cut off her head. She then confessed all, bidding him to ask the Vizier's son if it were not so. The Sultan told the Vizier to ask his son. His son owned up the truth, adding that, dearly as he loved the Princess, he would rather die than go through another such fearful night.The Sultan granted the son's wish, separating the newly married couple and ending wedding festivities.\n\nText 2:\n\nRead the excerpt below, taking note of the central idea and key details of the story.\n\nAladdin and his Wonderful Lamp\nFrom The Blue Fairy Book\nEdited by Andrew Lang\n\nBecause of the Genie's magic, Aladdin has won the heart of a princess and lives in a magnificent palace with her. While Aladdin is away, the old magician who had once tricked Aladdin approaches the palace, convinces the princess to give him the lamp, and then steals away the palace with the princess inside. Aladdin must now go forth to save the princess and defeat his old enemy.\n\nAladdin saw plainly that all his misfortunes were owing to the loss of the lamp, and he vainly wondered who had robbed him of it.\nThat morning the Princess rose earlier than she had done since she had been carried into Africa by the magician. As she was dressing, one of her women looked out and saw Aladdin. The Princess ran and opened the window, and Aladdin looked up. She called to him to come to her, and great was the joy of these lovers at seeing each other again.\nAfter he had kissed her, Aladdin said, \"I beg of you, Princess, before we speak of anything else, tell me what has become of my old lamp.\"\n\"Alas!\" she said, \"I am the innocent cause of our sorrows,\" and told him of the exchange of the lamp.\n\"Now I know,\" cried Aladdin, \"that we have to thank the African magician for this! Where is the lamp?\"\n\"He carries it about with him,\" said the Princess. \"I know, for he pulled it out of his robe to show me. He wishes me to break my faith with you and marry him, saying that you were beheaded by my father's command. He is for ever speaking ill of you, but I only reply by my tears. If I persist, I do not doubt he will use violence.\"\nAladdin comforted her, and he left her for a while. He changed clothes with the first person he met in the town, and having bought a certain powder, returned to the Princess, who let him in by a little side door. \"Put on your most beautiful dress,\" he said to her, \"and receive the magician with smiles, leading him to believe that you have forgotten me. Invite him to sup with you, and say you wish to taste the wine of his country. He will go for some and while he is gone I will tell you what to do.\"\nShe listened carefully to Aladdin, and when he left she arrayed herself gaily for the first time since she left her country. She put on a girdle and a headdress of diamonds. Seeing in a glass that she was more beautiful than ever, she received the magician, saying (to his great amazement), \"I have made up my mind that Aladdin is dead, and that all my tears will not bring him back to me. I am resolved to mourn no more, and I invite you to sup with me. I am tired of the wines of my home country, however, and desire a taste those of Africa.\"\nThe magician flew to his cellar, and the Princess put the powder Aladdin had given her in her cup. When he returned, she asked him to drink to her health with the wine of Africa, handing him her cup. Before drinking, the magician made her a speech in praise of her beauty, but the Princess cut him short, saying, \"Let us drink first, and you shall say what you will afterward.\" She set her cup to her lips and kept it there, while the magician drained his to the dregs and fell back, lifeless.\nThe Princess then opened the door to Aladdin and flung her arms round his neck. Aladdin bid her to leave him, as he had more to do. He then went to the dead magician, took the lamp out of his vest, and bade the genie carry the palace and all in it back to their home country. As the genie prepared to move the palace, the Princess returned to her bedroom chamber. When she looked out her window after two small shocks, the Princess found herself home again."]}, {"unit": "Comprehension Skills", "topic": "Key Individuals, Events, and Ideas", "lesson": "Use graphic organizers to help determine relationships between individuals, events, and ideas", "texts": []}, {"unit": "Comprehension Skills", "topic": "Key Individuals, Events, and Ideas", "lesson": "Analyze how authors use comparisons to show similarities and differences between individuals, events, and ideas", "texts": []}, {"unit": "Comprehension Skills", "topic": "Key Individuals, Events, and Ideas", "lesson": "Analyze how authors use analogies to show similarities and differences between individuals, events, and ideas", "texts": []}, {"unit": "Comprehension Skills", "topic": "Key Individuals, Events, and Ideas", "lesson": "Analyze how authors use categories to show similarities and differences between individuals, events, and ideas", "texts": []}, {"unit": "Comprehension Skills", "topic": "Dialogue and Incidents as Driving Forces of Plot and Characterization", "lesson": "Analyze how conflict drives plot", "texts": ["Text 1:Read the excerpt and answer the questions that follow.\n\nAn Excerpt from\n20,000 Leagues Under the Sea\nBy Jules Verne\n\nThe year 1866 was marked by a bizarre development, an unexplained and downright inexplicable phenomenon that surely no one has forgotten. Traders, shipowners, captains of vessels, skippers, and master mariners from Europe and America, naval officers from every country, and at their heels the various national governments on these two continents, were all extremely disturbed by the business.\nIn essence, over a period of time several ships had encountered \"an enormous thing\" at sea, a long spindle–shaped object, sometimes giving off a phosphorescent glow, infinitely bigger and faster than any whale.\nStriking an average of observations taken at different times—rejecting those timid estimates that gave the object a length of 200 feet, and ignoring those exaggerated views that saw it as a mile wide and three long—you could still assert that this phenomenal creature greatly exceeded the dimensions of anything then known, if it existed at all.\nNow then, it did exist, this was an undeniable fact; and since the human mind dotes on objects of wonder, you can understand the worldwide excitement caused by this unearthly apparition.\nIn essence, on July 20, 1866, the steamer Governor Higginson, from the Calcutta & Burnach Steam Navigation Co., encountered this moving mass five miles off the eastern shores of Australia.\nCaptain Baker at first thought he was in the presence of an unknown reef when two waterspouts shot out of this inexplicable object and sprang hissing into the air some 150 feet. So, unless this reef was subject to the intermittent eruptions of a geyser, the Governor Higginson had fair and honest dealings with some aquatic mammal, until then unknown, that could spurt from its blowholes waterspouts mixed with air and steam.\nSimilar events were likewise observed in Pacific seas, on July 23 of the same year, by the Christopher Columbus. Consequently, this extraordinary cetacean could transfer itself from one locality to another with startling swiftness, since within an interval of just three days, the Governor Higginson and the Christopher Columbus had observed it at two positions on the charts separated by a distance of more than 700 nautical leagues.\nFifteen days later and 2,000 leagues farther, the Helvetia from the Compagnie Nationale and the Shannon from the Royal Mail line, respectively signaled each other that the monster had been sighted in latitude 42° 15' north and longitude 60° 35' west of the meridian of Greenwich. From their simultaneous observations, they were able to estimate the mammal's minimum length at more than 100 meters. Now then, the biggest whales have never exceeded a length of 56 meters—if they reach even that.\nOne after another, reports arrived that would profoundly affect public opinion. In lighthearted countries, people joked about this phenomenon, but such serious, practical countries as England, America, and Germany were deeply concerned.\nIn every big city the monster was the latest rage; they sang about it in the coffee houses, they ridiculed it in the newspapers, they dramatized it in the theaters. The tabloids found it a fine opportunity for hatching all sorts of hoaxes.\nAn interminable debate then broke out between believers and skeptics in the scholarly societies and scientific journals. The \"monster question\" inflamed all minds. During this memorable campaign, journalists making a profession of science battled with those making a profession of wit, spilling waves of ink and some of them even two or three drops of blood, since they went from sea serpents to the most offensive personal remarks.\n\nText 2:\nThe following excerpt is taken from slightly later in the plot than the first excerpt that you read. An incident involving a ship called the Scotia has taken over the news headlines after the Scotia was punctured and almost sunk by the unidentified object mentioned in the first excerpt. Read the passage and answer the questions that follow.\n\nAdapted from\nTwenty Thousand Leagues Under the Sea\nBy Jules Verne\n\nDuring the period in which these developments were occurring, I had returned from a scientific undertaking organized to explore the Nebraska badlands in the United States. I arrived in New York laden with valuable collections near the end of March. My departure for France was set for early May. In the meantime, then, I was busy classifying my mineralogical, botanical, and zoological treasures when that incident took place with the Scotia.\nI was perfectly abreast of this question, which was the big news of the day, and how could I not have been? I had read and reread every American and European newspaper without being any farther along. Finding it impossible to form any views, I drifted from one extreme to the other. Something was out there, that much was certain.\nWhen I arrived in New York, the question was at the boiling point. The hypothesis of a drifting islet or an elusive reef, put forward by people not quite in their right minds, was completely eliminated.\nAlso discredited was the idea of a floating hull or some other enormous wreckage, and again because of this speed of movement.\nSo only two possible solutions to the question were left, creating two very distinct groups of supporters: on one side, those favoring a monster of colossal strength; on the other, those favoring an \"underwater boat\" of tremendous motor power. But that a private individual had such a mechanism at his disposal was less than probable. Where and when had he built it, and how could he have built it in secret?\nOnly some government could own such an engine of destruction, and in these disaster–filled times, when men tax their ingenuity to build increasingly powerful aggressive weapons, it was possible that, unknown to the rest of the world, some nation could have been testing such a fearsome machine.\nBut this hypothesis of a war machine collapsed in the face of formal denials from the various governments. Since the public interest was at stake and transoceanic travel was suffering, the sincerity of these governments could not be doubted. So, the hypothesis was ultimately rejected.\nAnd so the monster surfaced again, and the human imagination soon got caught up in the most ridiculous fantasies.\nAfter I arrived in New York, several people did me the honor of consulting me on the phenomenon in question. In France I had published a two–volume work, entitled The Mysteries of the Great Ocean Depths. Well received in scholarly circles, this book had established me as a specialist in this pretty obscure field of natural history. My views were in demand. And in this vein, \"the honorable Pierre Aronnax, Professor at the Paris Museum,\" was summoned by The New York Herald to formulate his views no matter what.\nI complied. Since I could no longer hold my tongue, I let it wag. I discussed the question in its every aspect, both political and scientific, and this is an excerpt from the well–padded article I published in the issue of April 30.\n\"Therefore,\" I wrote, \"after examining these different hypotheses one by one, we are forced, every other supposition having been refuted, to accept the existence of an extremely powerful marine animal.\"", "Text 1:\nRead the excerpt and answer the question that follows.\n\nAn excerpt from\nA White Heron\nBy Sarah Orne Jewett\n\nThe woods were already filled with shadows one June evening, just before eight o'clock, though a bright sunset still glimmered faintly among the trunks of the trees. A little girl was driving home her cow, a plodding, dilatory, provoking creature in her behavior, but a valued companion for all that. They were going away from whatever light there was, and striking deep into the woods, but their feet were familiar with the path, and it was no matter whether their eyes could see it or not.\nThere was hardly a night the summer through when the old cow could be found waiting at the pasture bars; on the contrary, it was her greatest pleasure to hide herself away among the huckleberry bushes, and though she wore a loud bell she had made the discovery that if one stood perfectly still it would not ring. So Sylvia had to hunt for her until she found her, and call Co' ! Co' ! with never an answering Moo, until her childish patience was quite spent. If the creature had not given good milk and plenty of it, the case would have seemed very different to her owners. Besides, Sylvia had all the time there was, and very little use to make of it. Sometimes in pleasant weather it was a consolation to look upon the cow's pranks as an intelligent attempt to play hide and seek, and as the child had no playmates she lent herself to this amusement with a good deal of zest. Though this chase had been so long that the wary animal herself had given an unusual signal of her whereabouts, Sylvia had only laughed when she came upon Mistress Moolly at the swamp-side, and urged her affectionately homeward with a twig of birch leaves. The old cow was not inclined to wander farther, she even turned in the right direction for once as they left the pasture, and stepped along the road at a good pace. She was quite ready to be milked now, and seldom stopped to browse. Sylvia wondered what her grandmother would say because they were so late. It was a great while since she had left home at half-past five o'clock, but everybody knew the difficulty of making this errand a short one. Mrs. Tilley had chased the hornéd torment too many summer evenings herself to blame any one else for lingering, and was only thankful as she waited that she had Sylvia, nowadays, to give such valuable assistance. The good woman suspected that Sylvia loitered occasionally on her own account; there never was such a child for straying about out-of-doors since the world was made! Everybody said that it was a good change for a little maid who had tried to grow for eight years in a crowded manufacturing town, but, as for Sylvia herself, it seemed as if she never had been alive at all before she came to live at the farm. She thought often with wistful compassion of a wretched geranium that belonged to a town neighbor.\n\"'Afraid of folks,'\" old Mrs. Tilley said to herself, with a smile, after she had made the unlikely choice of Sylvia from her daughter's houseful of children, and was returning to the farm. \"'Afraid of folks,' they said! I guess she won't be troubled no great with 'em up to the old place!\" When they reached the door of the lonely house and stopped to unlock it, and the cat came to purr loudly, and rub against them. Sylvia whispered that this was a beautiful place to live in, and she never should wish to go home.\nThe companions followed the shady wood-road, the cow taking slow steps and the child very fast ones. The cow stopped long at the brook to drink, as if the pasture were not half a swamp, and Sylvia stood still and waited, letting her bare feet cool themselves in the shoal water, while the great twilight moths struck softly against her. She waded on through the brook as the cow moved away, and listened to the thrushes with a heart that beat fast with pleasure. There was a stirring in the great boughs overhead. They were full of little birds and beasts that seemed to be wide awake, and going about their world, or else saying good-night to each other in sleepy twitters. Sylvia herself felt sleepy as she walked along. However, it was not much farther to the house, and the air was soft and sweet. She was not often in the woods so late as this, and it made her feel as if she were a part of the gray shadows and the moving leaves. She was just thinking how long it seemed since she first came to the farm a year ago, and wondering if everything went on in the noisy town just the same as when she was there, the thought of the great red-faced boy who used to chase and frighten her made her hurry along the path to escape from the shadow of the trees.\nSuddenly this little woods-girl is horror-stricken to hear a clear whistle not very far away. Not a bird's-whistle, which would have a sort of friendliness, but a boy's whistle, determined, and somewhat aggressive. Sylvia left the cow to whatever sad fate might await her, and stepped discreetly aside into the bushes, but she was just too late. The enemy had discovered her, and called out in a very cheerful and persuasive tone, \"Halloa, little girl, how far is it to the road?\" and trembling Sylvia answered almost inaudibly, \"A good ways.\"\nShe did not dare to look boldly at the tall young man, who carried a gun over his shoulder, but she came out of her bush and again followed the cow, while he walked alongside.\n\"I have been hunting for some birds,\" the stranger said kindly, \"and I have lost my way, and need a friend very much. Don't be afraid,\" he added gallantly. \"Speak up and tell me what your name is, and whether you think I can spend the night at your house, and go out gunning early in the morning.\"\nSylvia was more alarmed than before. Would not her grandmother consider her much to blame? But who could have foreseen such an accident as this? It did not seem to be her fault, and she hung her head as if the stem of it were broken, but managed to answer \"Sylvy,\" with much effort when her companion again asked her name.\nMrs. Tilley was standing in the doorway when the trio came into view. The cow gave a loud moo by way of explanation.\n\"Yes, you'd better speak up for yourself, you old trial! Where'd she tucked herself away this time, Sylvy?\" But Sylvia kept an awed silence; she knew by instinct that her grandmother did not comprehend the gravity of the situation. She must be mistaking the stranger for one of the farmer-lads of the region.\nThe young man stood his gun beside the door, and dropped a lumpy game-bag beside it; then he bade Mrs. Tilley good-evening, and repeated his wayfarer's story, and asked if he could have a night's lodging.\n\"Put me anywhere you like,\" he said. \"I must be off early in the morning, before day; but I am very hungry, indeed. You can give me some milk at any rate, that's plain.\"\n\"Dear sakes, yes,\" responded the hostess, whose long slumbering hospitality seemed to be easily awakened. \"You might fare better if you went out to the main road a mile or so, but you're welcome to what we've got. I'll milk right off, and you make yourself at home. You can sleep on husks or feathers,\" she proffered graciously. \"I raised them all myself. There's good pasturing for geese just below here towards the marsh. Now step round and set a plate for the gentleman, Sylvy!\" And Sylvia promptly stepped. She was glad to have something to do, and she was hungry herself.\nIt was a surprise to find so clean and comfortable a little dwelling in this New England wilderness. The young man had known the horrors of its most primitive housekeeping, and the dreary squalor of that level of society which does not rebel at the companionship of hens. This was the best thrift of an old-fashioned farmstead, though on such a small scale that it seemed like a hermitage. He listened eagerly to the old woman's quaint talk and insisted that this was the best supper he had eaten for a month, and afterward the new-made friends sat down in the door-way together while the moon came up.\nSoon it would be berry-time, and Sylvia was a great help at picking. The cow was a good milker, though a plaguy thing to keep track of, the hostess gossiped frankly, adding presently that she had buried four children, so Sylvia's mother, and a son (who might be dead) in California were all the children she had left. \"Dan, my boy, was a great hand to go gunning,\" she explained sadly. \"I never wanted for pa'tridges or gray squer'ls while he was to home. He's been a great wand'rer, I expect, and he's no hand to write letters. There, I don't blame him, I'd ha' seen the world myself if it had been so I could.\n\"Sylvy takes after him,\" the grandmother continued affectionately, after a minute's pause. \"There ain't a foot o' ground she don't know her way over, and the wild creaturs counts her one o' themselves. Squer'ls she'll tame to come an' feed right out o' her hands, and all sorts o' birds. Last winter she got the jay-birds to bangeing here, and I believe she'd 'a' scanted herself of her own meals to have plenty to throw out amongst 'em, if I hadn't kep' watch. Anything but crows, I tell her, I'm willin' to help support — though Dan he had a tamed one o' them that did seem to have reason same as folks. It was round here a good spell after he went away. Dan an' his father they didn't get on, — but he never held up his head ag'in after Dan gone off.\"\nThe guest did not notice this hint of family sorrows in his eager interest in something else.\n\"So Sylvy knows all about birds, does she?\" he exclaimed, as he looked round at the little girl who sat, very demure but increasingly sleepy, in the moonlight. \"I am making a collection of birds myself. I have been at it ever since I was a boy.\" (Mrs. Tilley smiled.) \"There are two or three very rare ones I have been hunting for these five years. I mean to get them on my own ground if they can be found.\"\n\nText 2:\nYou have already read the first part of \"A White Heron\" by Sarah Orne Jewett. Now, read the rest of the story and answer the questions that follow.\n\n\n\"Do you cage 'em up?\" asked Mrs. Tilley doubtfully, in response to this enthusiastic announcement.\n\"Oh no, they're stuffed and preserved, dozens and dozens of them,\" said the ornithologist, \"and I have shot or snared every one myself. I caught a glimpse of a white heron a few miles from here on Saturday, and I have followed it in this direction. They have never been found in this district at all. The little white heron, it is,\" and he turned again to look at Sylvia with the hope of discovering that the rare bird was one of her acquaintances.\nBut Sylvia was watching a hop-toad in the narrow footpath.\n\"You would know the heron if you saw it,\" the stranger continued eagerly. \"A strange tall white bird with soft feathers and long thin legs. And it would have a nest perhaps in the top of a high tree, made of sticks, something like a hawk's nest.\"\nSylvia's heart gave a wild beat; she knew that strange white bird, and had once stolen softly near where it stood in some bright green swamp grass, away over at the other side of the woods. There was an open place where the sunshine always seemed strangely yellow and hot, where tall, nodding rushes grew, and her grandmother had warned her that she might sink in the soft black mud underneath and never be heard of more. Not far beyond were the salt marshes just this side the sea itself, which Sylvia wondered and dreamed much about, but never had seen, whose great voice could sometimes be heard above the noise of the woods on stormy nights.\n\"I can't think of anything I should like so much as to find that heron's nest,\" the handsome stranger was saying. \"I would give ten dollars to anybody who could show it to me,\" he added desperately, \"and I mean to spend my whole vacation hunting for it if need be. Perhaps it was only migrating, or had been chased out of its own region by some bird of prey.\"\nMrs. Tilley gave amazed attention to all this, but Sylvia still watched the toad, not realizing, as she might have done at some calmer time, that the creature wished to get to its hole under the door-step, and was much hindered by the unusual spectators at that hour of the evening. No amount of thought, that night, could decide how many wished-for treasures the ten dollars, so lightly spoken of, would buy.\nThe next day the young sportsman hovered about the woods, and Sylvia kept him company, having lost her first fear of the friendly lad, who proved to be most kind and sympathetic. He told her many things about the birds and what they knew and where they lived and what they did with themselves. And he gave her a jack-knife, which she thought as great a treasure as if she were a desert-islander. All day long he did not once make her troubled or afraid except when he brought down some unsuspecting singing creature from its bough. Sylvia would have liked him vastly better without his gun; she could not understand why he killed the very birds he seemed to like so much. But as the day waned, Sylvia still watched the young man with warm admiration. She had never seen anybody so charming and delightful. They stopped to listen to a bird's song; they pressed forward again eagerly, parting the branches — speaking to each other rarely and in whispers; the young man going first and Sylvia following, fascinated, a few steps behind, with her gray eyes dark with excitement.\nShe grieved because the longed-for white heron was elusive, but she did not lead the guest, she only followed. At last evening began to fall, and they drove the cow home together, and Sylvia smiled when they came to the place where she heard the whistle and was afraid only the night before.\nHalf a mile from home, at the farther edge of the woods, where the land was highest, a great pine-tree stood, the last of its generation. Whether it was left for a boundary mark, or for what reason, no one could say; the woodchoppers who had felled its mates were dead and gone long ago, and a whole forest of sturdy trees, pines and oaks and maples, had grown again. But the stately head of this old pine towered above them all and made a landmark for sea and shore miles and miles away. Sylvia knew it well. She had always believed that whoever climbed to the top of it could see the ocean; and the little girl had often laid her hand on the great rough trunk and looked up wistfully at those dark boughs that the wind always stirred, no matter how hot and still the air might be below. Now she thought of the tree with a new excitement, for why, if one climbed it at break of day, could not one see all the world, and easily discover from whence the white heron flew, and mark the place, and find the hidden nest?\nWhat a spirit of adventure, what wild ambition! What fancied triumph and delight and glory for the later morning when she could make known the secret! It was almost too real and too great for the childish heart to bear.\nAll night the door of the little house stood open and the whippoorwills came and sang upon the very step. The young sportsman and his old hostess were sound asleep, but Sylvia's great design kept her broad awake and watching. She forgot to think of sleep. The short summer night seemed as long as the winter darkness, and at last when the whippoorwills ceased, and she was afraid the morning would after all come too soon, she stole out of the house and followed the pasture path through the woods, hastening toward the open ground beyond, listening with a sense of comfort and companionship to the drowsy twitter of a half-awakened bird, whose perch she had jarred in passing.\nThere was the huge tree asleep yet in the paling moonlight, and small and silly Sylvia began with utmost bravery to mount to the top of it, with tingling, eager blood coursing the channels of her whole frame, with her bare feet and fingers, that pinched and held like bird's claws to the monstrous ladder reaching up, up, almost to the sky itself. First she must mount the white oak tree that grew alongside, where she was almost lost among the dark branches and the green leaves heavy and wet with dew; a bird fluttered off its nest, and a red squirrel ran to and fro and scolded pettishly at the harmless housebreaker. Sylvia felt her way easily. She had often climbed there, and knew that higher still one of the oak's upper branches chafed against the pine trunk, just where its lower boughs were set close together. There, when she made the dangerous pass from one tree to the other, the great enterprise would really begin.\nShe crept out along the swaying oak limb at last, and took the daring step across into the old pine-tree. The way was harder than she thought; she must reach far and hold fast, the sharp dry twigs caught and held her and scratched her like angry talons, the pitch made her thin little fingers clumsy and stiff as she went round and round the tree's great stem, higher and higher upward. The sparrows and robins in the woods below were beginning to wake and twitter to the dawn, and the child knew she must hurry if her project were to be of any use.\nSylvia's face was like a pale star, if one had seen it from the ground, when the last thorny bough was past, and she stood trembling and tired but wholly triumphant, high in the tree-top. Yes, there was the sea with the dawning sun making a golden dazzle over it, and toward that glorious east flew two hawks. How low they looked in the air from that height when one had only seen them before far up, and dark against the blue sky. Their gray feathers were as soft as moths; they seemed only a little way from the tree, and Sylvia felt as if she too could go flying away among the clouds. Westward, the woodlands and farms reached miles and miles into the distance; here and there were church steeples, and white villages, truly it was a vast and awesome world\nThe birds sang louder and louder. At last the sun came up bewilderingly bright. Sylvia could see the white sails of ships out at sea, and the clouds that were purple and rose-colored and yellow at first began to fade away. Where was the white heron's nest in the sea of green branches, and was this wonderful sight and pageant of the world the only reward for having climbed to such a giddy height? Now look down again, Sylvia, where the green marsh is set among the shining birches and dark hemlocks; there where you saw the white heron once you will see him again; look, look! a white spot of him like a single floating feather comes up from the dead hemlock and grows larger, and rises, and comes close at last, and goes by the landmark pine with steady sweep of wing and outstretched slender neck and crested head. And wait! wait! do not move a foot or a finger, little girl, do not send an arrow of light and consciousness from your two eager eyes, for the heron has perched on a pine bough not far beyond yours, and cries back to his mate on the nest and plumes his feathers for the new day!\nThe child gives a long sigh a minute later when a company of shouting cat-birds comes also to the tree, and vexed by their fluttering and lawlessness the solemn heron goes away. She knows his secret now, the wild, light, slender bird that floats and wavers, and goes back like an arrow presently to his home in the green world beneath. Then Sylvia, well satisfied, makes her perilous way down again, not daring to look far below the branch she stands on, ready to cry sometimes because her fingers ache and her lamed feet slip. Wondering over and over again what the stranger would say to her, and what he would think when she told him how to find his way straight to the heron's nest.\n\"Sylvy, Sylvy!\" called the busy old grandmother again and again, but nobody answered, and the small husk bed was empty and Sylvia had disappeared.\nThe guest waked from a dream, and remembering his day's plan, hurried to dress himself that it might sooner begin. He was sure from the way the shy little girl looked once or twice yesterday that she had at least seen the white heron, and now she must really be made to tell. Here she comes now, paler than ever, and her worn old frock is torn and tattered, and smeared with pine pitch. The grandmother and the sportsman stand in the door together and question her, and the splendid moment has come to speak of the dead hemlock-tree by the green marsh.\nBut Sylvia does not speak after all, though the old grandmother fretfully rebukes her, and the young man's kind, appealing eyes are looking straight in her own. He can make them rich with money; he has promised it, and they are poor now. He is so well worth making happy, and he waits to hear the story she can tell.\nNo, she must keep silence! What is it that suddenly forbids her and makes her dumb? Has she been nine years growing and now, when the great world for the first time puts out a hand to her, must she thrust it aside for a bird's sake? The murmur of the pine's green branches is in her ears, she remembers how the white heron came flying through the golden air and how they watched the sea and the morning together, and Sylvia cannot speak; she cannot tell the heron's secret and give its life away."]}, {"unit": "Comprehension Skills", "topic": "Dialogue and Incidents as Driving Forces of Plot and Characterization", "lesson": "Recognize shifts in the pace of a story or drama", "texts": ["Read the play excerpt and answer the questions that follow.\n\nAn excerpt from\nMakers of Madness\nBy Hermann Hagedorn\n\nA room in the Ministry of War in the capital of Iberia.\n\nEvening.\n\nThe Minister of War, a tall, stern, bearded man with deep-set eyes and many furrows, is sitting at a large, mahogany desk-table, Left.\n\nThe Chief of Staff, silent, motionless and watchful, stands beside him with his hands resting on the table-top. He is thin, old and emaciated, clean-shaven, firm-lipped, and looks startlingly like a bird of prey.\n\nMINISTER OF WAR: No, you old hawk, we're not going to do it. We'll be content to settle ourselves in peaceful graves, you and I and the old Chief. No war, no war!\n\nCHIEF OF STAFF: [Calmly.] That is sentiment. Here is fact. We land here and here and here. Then march down here and up there, uniting the armies. Rich country. I've never seen it, but I know it better than any letter-carrier in the district. We live on the land, burning and pillaging if the inhabitants don't give us what we want. A little dose will tame them. We'll sweep all before us in six weeks.\n\nMINISTER OF WAR: [In mock protest.] Stop, man, stop! You make me want to try it.\n\nCHIEF OF STAFF: I can't stop. It's a game with me. I play it all day in my thoughts and all night I direct campaigns in my dreams. A great game. Only sometimes I get tired of playing it on paper, and want to hear the real guns and see the real battalions.\n\n[A secretary enters with a message.]\n\nSECRETARY: [To Minister of War.] A message from the King sent over from the Foreign Office. The Prime Minister was not there.\n\nMINISTER OF WAR: Let me have it.\n\n[He takes the message and glances at it.]\n\nWhat?\n\n[With a gesture to the Secretary.]\n\nThat will do.\n\n[Exit secretary.]\n\nCHIEF OF STAFF: Well?\n\nMINISTER OF WAR: [Flaring up.] Look at this, look at it! The King is sending our national honor to the dogs. He has secretly resumed communication with the Ambassador of the Republic, instead of doing what was natural and constitutional, sending the man to us. He is going to compromise. Pack up your tin soldiers, old man. Take them home for your grandchildren to play with. Our country evidently has no more use for them.\n\nCHIEF OF STAFF: [With compressed lips.] Show me.\n\n[He takes the paper and reads its contents aloud.]\n\n\"The King desires to inform the Foreign Office that, in pursuance of his well-known love of peace, he sent for the Ambassador of the Republic this afternoon and outlined a plan that would satisfy the royal government and at the same time yield certain points to the government of the Republic. The Ambassador was courteous, but, although acknowledging the generosity of the King's offer, regretted that he was unable to consider any compromise before communicating again with his government. The King replied that if his offers were refused he could then have nothing further to say in the matter, but would have to turn it over entirely to his Ministers.\n\nThe King suggests to the Foreign Office that these facts be put before our Ambassadors abroad, and, to pacify the public mind, be given at once to the newspapers.\"\n\nMy God, and you want peace!\n\nMINISTER OF WAR: [Harshly.] Well, how do you like it?\n\nCHIEF OF STAFF: He's backed down, he's backed down. All the world will be shouting tomorrow how our King has backed down. To accept defeat before you've begun to fight!\n\n[He turns again to the map.]\n\nIf this other plan should be frustrated by the enemy's navy, look, we could land here and here and—\n\n[The door opens and the prime minister enters. He is a stern, titanic figure in the sixties, sallow-skinned, gray-haired.\n\nprime minister\n\n[Standing in the doorway.]\n\nGood evening, gentlemen. Counting your battalions?\n\nCHIEF OF STAFF: [Absorbed.] And here, joining our armies at—\n\nMINISTER OF WAR: Thank God, you're here. Where have you been?\n\nPRIME MINISTER: Home on my estates, saying good-bye to my family.\n\n[He smiles grimly, and with his cane makes a thrust as if it is a sword.]\n\nMINISTER OF WAR: You think you are going to war?\n\nPRIME MINISTER: I know.", "Read the excerpt and answer the questions that follow.\n\nAn Excerpt from\nThe Hound of the Baskervilles\nBy Arthur Conan Doyle\n\nDr. Mortimer continued, \"Within the last few months it became increasingly plain to me that Sir Charles's nervous system was strained to the breaking point. He had taken this legend which I have read you exceedingly to heart—so much so that, although he would walk in his own grounds, nothing would induce him to go out upon the moor at night. Incredible as it may appear to you, Mr. Holmes, he was honestly convinced that a dreadful fate overhung his family, and certainly the records which he was able to give of his ancestors were not encouraging. The idea of some ghastly presence constantly haunted him, and on more than one occasion he has asked me whether I had on my medical journeys at night ever seen any strange creature or heard the baying of a hound. The latter question he put to me several times, and always with a voice which vibrated with excitement.\nI can well remember driving up to his house in the evening some three weeks before the fatal event. He chanced to be at his hall door. I had descended from my gig and was standing in front of him, when I saw his eyes fix themselves over my shoulder and stare past me with an expression of the most dreadful horror. I whisked round and had just time to catch a glimpse of something which I took to be a large black calf passing at the head of the drive. So excited and alarmed was he that I was compelled to go down to the spot where the animal had been and look around for it. It was gone, however, and the incident appeared to make the worst impression upon his mind. I stayed with him all the evening, and it was on that occasion, to explain the emotion which he had shown, that he confided to my keeping that narrative which I read to you when first I came. I mention this small episode because it assumes some importance in view of the tragedy which followed, but I was convinced at the time that the matter was entirely trivial and that his excitement had no justification.\nIt was at my advice that Sir Charles was about to go to London. His heart was, I knew, affected, and the constant anxiety in which he lived, however chimerical the cause of it might be, was evidently having a serious effect upon his health. I thought that a few months among the distractions of town would send him back a new man. Mr. Stapleton, a mutual friend who was much concerned at his state of health, was of the same opinion. At the last instant came this terrible catastrophe.\nOn the night of Sir Charles's death Barrymore the butler, who made the discovery, sent Perkins the groom on horseback to me, and as I was sitting up late I was able to reach Baskerville Hall within an hour of the event. I checked and corroborated all the facts which were mentioned at the inquest. I followed the footsteps down the yew alley, I saw the spot at the moor-gate where he seemed to have waited, I remarked the change in the shape of the prints after that point, I noted that there were no other footsteps save those of Barrymore on the soft gravel, and finally I carefully examined the body, which had not been touched until my arrival. Sir Charles lay on his face, his arms out, his fingers dug into the ground, and his features convulsed with some strong emotion to such an extent that I could hardly have sworn to his identity. There was certainly no physical injury of any kind. But one false statement was made by Barrymore at the inquest. He said that there were no traces upon the ground round the body. He did not observe any. But I did—some little distance off, but fresh and clear.\"\n\"Footprints?\"\n\"Footprints.\"\n\"A man's or a woman's?\"\nDr. Mortimer looked strangely at us for an instant, and his voice sank almost to a whisper as he answered.\n\"Mr. Holmes, they were the footprints of a gigantic hound!\"\nI confess at these words a shudder passed through me. There was a thrill in the doctor's voice which showed that he was himself deeply moved by that which he told us. Holmes leaned forward in his excitement and his eyes had the hard, dry glitter which shot from them when he was keenly interested.\n\"You saw this?\"\n\"As clearly as I see you.\"\n\"And you said nothing?\"\n\"What was the use?\"\n\"How was it that no one else saw it?\"\n\"The marks were some twenty yards from the body and no one gave them a thought. I don't suppose I should have done so had I not known this legend.\"\n\"There are many sheep-dogs on the moor?\"\n\"No doubt, but this was no sheep-dog.\"\n\"You say it was large?\"\n\"Enormous.\"\n\"But it had not approached the body?\"\n\"No.\"\n\"What sort of night was it?'\n\"Damp and raw.\"\n\"But not actually raining?\"\n\"No.\"\n\"What is the alley like?\"\n\"There are two lines of old yew hedge, twelve feet high and impenetrable. The walk in the centre is about eight feet across.\"\n\"Is there anything between the hedges and the walk?\"\n\"Yes, there is a strip of grass about six feet broad on either side.\"\n\"I understand that the yew hedge is penetrated at one point by a gate?\"\n\"Yes, the wicket-gate which leads on to the moor.\"\n\"Is there any other opening?\"\n\"None.\"\n\"So that to reach the yew alley one either has to come down it from the house or else to enter it by the moor-gate?\"\n\"There is an exit through a summer-house at the far end.\"\n\"Had Sir Charles reached this?\"\n\"No; he lay about fifty yards from it.\"\n\"Now, tell me, Dr. Mortimer—and this is important—the marks which you saw were on the path and not on the grass?\"\n\"No marks could show on the grass.\"\n\"Were they on the same side of the path as the moor-gate?\"\n\"Yes; they were on the edge of the path on the same side as the moor-gate.\"\n\"You interest me exceedingly. Another point. Was the wicket-gate closed?\"\n\"Closed and padlocked.\"\n\"How high was it?\"\n\"About four feet high.\"\n\"Then anyone could have got over it?\"\n\"Yes.\"\n\"And what marks did you see by the wicket-gate?\"\n\"None in particular.\"\n\"Good heaven! Did no one examine?\"\n\"Yes, I examined, myself.\"\n\"And found nothing?\"\n\"It was all very confused. Sir Charles had evidently stood there for five or ten minutes.\"\n\"How do you know that?\"\n\"Because the ash had twice dropped from his cigar.\"\n\"Excellent! This is a colleague, Watson, after our own heart. But the marks?\"\n\"He had left his own marks all over that small patch of gravel. I could discern no others.\"\nSherlock Holmes struck his hand against his knee with an impatient gesture.\n\"If I had only been there!\" he cried."]}, {"unit": "Comprehension Skills", "topic": "Dialogue and Incidents as Driving Forces of Plot and Characterization", "lesson": "Analyze how dialogue can change the pace of a story or drama", "texts": ["First, read the play, paying attention to how the exchange of dialogue affects the pace of the plot. Then, answer the questions that follow.\n\nThe Reckoning\nBy Percival Wilde\n\nThe scene is a barber shop. At the center is the chair, facing a mirror and washstand at the right. The tiled walls are sprinkled with the usual advertisements. At the rear, a door leads up to the street by a flight of two or three steps. A clock on the left wall indicates three.\n\nAt the rise of curtain, THE BARBER, a man of fifty, is discovered sharpening a razor, and whistling softly to himself. He finishes with the razor; seats himself in the chair, takes up a paper, and reads.\n\nThe door opens, and THE CUSTOMER, a flashily-dressed individual of forty-five, enters the shop.\n\nTHE BARBER: [Rising at once] Good afternoon, sir.\n\nTHE CUSTOMER: [Pulling out his watch] That clock right?\n\nTHE BARBER: Yes, sir; Western Union time. Corrected every hour.\n\nTHE CUSTOMER: My watch has run down. [He sets it.] Now, I've got just five minutes to spare. Can you shave me in that time?\n\nTHE BARBER: Five minutes, sir? Easy! Easy!\n\nTHE CUSTOMER: All right. Go ahead. [He takes off his hat and coat, and moves towards the chair.]\n\nTHE BARBER: Your collar also, sir.\n\nTHE CUSTOMER: [Smiling] Fussy, aren't you?\n\nTHE BARBER: Well, sir, I try to do my work well.\n\nTHE CUSTOMER: [Takes off tie and collar, putting his expensive scarf-pin in the edge of his vest, which he does not remove] Satisfied now?\n\nTHE BARBER: Yes, sir. Thank you, sir. [He gets out sheet, towels, etc.] In a hurry, sir?\n\nTHE CUSTOMER: Yes. Got to attend a meeting at three-ten.\n\nTHE BARBER: Oh! The auction up-stairs?\n\nTHE CUSTOMER: Yes. [He glances at the clock.] You'll have to cut it pretty fine.\n\nTHE BARBER: Don't worry, sir. There's lots of time…. From the country, sir?\n\nTHE CUSTOMER: [Lighting a cigar] Yes. Southerner.\n\nTHE BARBER: [Fastening the sheet] I thought so. I'm from the country myself.\n\nTHE CUSTOMER: What part?\n\nTHE BARBER: Oh, that would be difficult to say. You see, I've moved around so much that I'm neither a Southerner nor a Northerner. I'm just an American. [He mixes the lather.] I lived in a little town near Savannah for a year.\n\nTHE CUSTOMER: Did you? Why, so did I.\n\nTHE BARBER: Yes, indeed. I used to see you—quite frequently— though you never came into my shop. Then I went to Philadelphia.\n\nTHE CUSTOMER: What year?\n\nTHE BARBER: Let me think. It was April, twelve years ago.\n\nTHE CUSTOMER: April, twelve years ago? I went to Philadelphia the same month!\n\nTHE BARBER: I saw you there, too, sir. [He lets down the chair suddenly.]\n\nTHE CUSTOMER: [Startled] What are you doing?\n\nTHE BARBER: I'm hurrying, sir.\n\nTHE CUSTOMER: Well, you needn't break my neck about it.\n\nTHE BARBER: No, sir. [Lathering.] From Philadelphia I went to Newark.\n\nTHE CUSTOMER: To Newark?\n\nTHE BARBER: And from Newark to Indianapolis.\n\nTHE CUSTOMER: [Much surprised] What?\n\nTHE BARBER: And then Muscatine—for a few months—and Chicago— and Louisville.\n\nTHE CUSTOMER: Why, one would think you had been following me about! I've lived in every one of those places.\n\nTHE BARBER: Have you, sir? It's a little world, isn't it?\n\nTHE CUSTOMER: You've been a barber right along?\n\nTHE BARBER: I couldn't do anything else, sir. It's my trade.\n\nTHE CUSTOMER: [Smiling] Well, this is the first time you ever shaved me.\n\nTHE BARBER: Curious, isn't it? But it may be the last.\n\nTHE CUSTOMER: That's so. I'm going to leave town right after the auction.\n\nTHE BARBER: If I may ask, sir, where are you going?\n\nTHE CUSTOMER: I don't know yet. [Jocularly.] Are you going to follow me?\n\nTHE BARBER: Sooner or later, sir. It's going to be a long journey, isn't it?\n\nTHE CUSTOMER: What makes you think so?\n\nTHE BARBER: There's a long journey we all take—sooner or later. Eh?\n\nTHE CUSTOMER: A long journey? But you're wasting time, man!\n\nTHE BARBER: Am I, sir? [He strolls to the clock; looks at it; returns.] Fine weather we're having.\n\nTHE CUSTOMER: [Impatiently] Yes.\n\nTHE BARBER: Though a little more rain would be good for the crops.\n\nTHE CUSTOMER: Um.\n\nTHE BARBER: [Very leisurely] You know, sir, the young man who keeps the shoe store at the corner was saying as I trimmed his hair this morning—\n\nTHE CUSTOMER: [Interrupting] I don't care what he said! I want to get shaved!\n\nTHE BARBER: Yes, sir! Yes, sir! And—and the young lady who runs the news stand up-stairs—right next to the elevator, sir—she was saying that she had never—\n\nTHE CUSTOMER: [Interrupting more violently] I told you once I don't care what your friends were saying! I've got to be at that meeting at three-ten.\n\nTHE BARBER: Yes, sir.\n\nTHE CUSTOMER: My time is almost up. You'll have to hurry.\n\nTHE BARBER: [Slapping on more lather] Don't worry, sir. I always keep my promises. Why, I remember, sir, back in Savannah, when my poor daughter was alive, I promised—\n\nTHE CUSTOMER: [Interrupting angrily] I don't care one bit for your daughter!\n\nTHE BARBER: [Mildly] No, sir. I didn't think you did.\n\nTHE CUSTOMER: And your time is up.\n\nTHE BARBER: [Beginning to shave] Oh, no, sir! It hasn't begun.\n\nTHE CUSTOMER: [Starting] What do you mean?\n\nTHE BARBER: Don't do that again, sir! You don't know how near you came to cutting yourself!\n\nTHE CUSTOMER: You promised to finish with me in five minutes!\n\nTHE BARBER: No, sir, if you will allow me to contradict you, I did not.\n\nTHE CUSTOMER: You said you would shave me in five minutes.\n\nTHE BARBER: Yes, sir. That is correct.\n\nTHE CUSTOMER: And it's—\n\nTHE BARBER: Easy, sir, easy! The razor is sharp! [Shaving.] When I promised to shave you in five minutes, I didn't say anything about lathering. That takes several minutes by itself.\n\nTHE CUSTOMER: What?\n\nTHE BARBER: Now you've done it! [He applies styptic to a cut on THE CUSTOMER's face.] Smarts, doesn't it?\n\nTHE CUSTOMER: [Furious] You clumsy, awkward, conceited galoot!\n\nTHE BARBER: [With sudden and overwhelming rage] Don't talk to a gentleman like that! You cur! [With a sudden resumption of his obsequious manner.] I did it on purpose.\n\nTHE CUSTOMER: [Gasping] Wh-what do you mean?\n\nTHE BARBER: [Respectfully] You really mustn't accuse me of being clumsy, sir. I'm not clumsy. If I cut you, it was quite intentional—like this! [Cutting him a second time.]\n\nTHE CUSTOMER: Are you crazy?\n\nTHE BARBER: [Applying the styptic] No, sir, I'm quite sane. [THE CUSTOMER tries to sit up.] Oh, don't do that, sir! Don't do that! My razor is frightfully sharp!\n\nTHE CUSTOMER: [Panic-stricken] I want to sit up!\n\nTHE BARBER: Don't try it while the razor is at your throat, sir. It is sure to be fatal.\n\nTHE CUSTOMER: Then take it away!\n\nTHE BARBER: Oh, no, no, no! When I am through shaving you—not before. Now take it easy, sir. Lie back quietly! Quietly! That's it.\n\nTHE CUSTOMER: [Controlling himself with an effort, and putting his cigar in his mouth] What are you going to do with me? What's this? A hold-up?\n\nTHE BARBER: What am I— [With a sudden access of rage.] Take that filthy thi
