<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Reading Lessons</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Nunito', sans-serif; background: #fff8f0; color: #1a1a1a; min-height: 100vh; }

  /* ── Header ── */
  header { background: linear-gradient(135deg, #f97316, #ea580c); color: white;
    padding: 16px 24px; display: flex; align-items: center; gap: 14px; }
  header h1 { font-size: 1.5rem; font-weight: 800; letter-spacing: .01em; }

  /* ── Grade bar ── */
  .grade-bar { background: #fff; border-bottom: 2px solid #ffe8d6; padding: 12px 20px;
    display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .grade-bar-label { font-size: .85rem; font-weight: 700; color: #9a6448; margin-right: 4px; }
  .grade-btn { padding: 9px 22px; border-radius: 24px; border: 2px solid #f97316;
    background: white; color: #f97316; font-family: 'Nunito', sans-serif;
    font-size: 1rem; font-weight: 700; cursor: pointer; transition: all .15s; }
  .grade-btn:hover { background: #fff1e6; }
  .grade-btn.active { background: #f97316; color: white; }
  .grade-btn:disabled { opacity: .35; cursor: not-allowed; border-color: #ccc; color: #ccc; }

  /* ── Layout ── */
  .layout { display: flex; height: calc(100vh - 112px); }

  /* ── Sidebar ── */
  .sidebar { width: 320px; min-width: 320px; background: white;
    border-right: 2px solid #ffe8d6; overflow-y: auto; flex-shrink: 0;
    transition: width .2s ease, min-width .2s ease; }
  .sidebar.collapsed { width: 48px; min-width: 48px; overflow: hidden; }
  .sidebar.collapsed .sidebar-label,
  .sidebar.collapsed #lessonList { display: none; }
  .sidebar.collapsed .sidebar-header { justify-content: center; padding: 14px 0; }

  .sidebar-header { padding: 14px 18px; font-size: .85rem; font-weight: 800;
    color: #c2410c; border-bottom: 2px solid #ffe8d6; background: #fff8f0;
    display: flex; align-items: center; justify-content: space-between; white-space: nowrap;
    text-transform: uppercase; letter-spacing: .06em; }
  .toggle-btn { background: none; border: none; cursor: pointer; color: #f97316;
    padding: 4px 6px; font-size: 1.2rem; line-height: 1; border-radius: 6px;
    transition: background .15s; flex-shrink: 0; }
  .toggle-btn:hover { background: #fff1e6; }

  .topic-label { padding: 10px 16px 6px; font-size: .75rem; font-weight: 800; color: #9a6448;
    text-transform: uppercase; letter-spacing: .07em; background: #fff3ea;
    border-top: 1px solid #ffe8d6; }

  .lesson-item { padding: 13px 16px; border-bottom: 1px solid #fff0e6; cursor: pointer;
    display: flex; align-items: center; gap: 10px; transition: background .12s; }
  .lesson-item:hover { background: #fff5ee; }
  .lesson-item.active { background: #fff1e6; border-left: 4px solid #f97316; }
  .lesson-item.no-text { cursor: default; opacity: .4; }
  .lesson-item.no-text:hover { background: white; }
  .lesson-num { font-size: .78rem; color: #ccc; font-weight: 800; min-width: 26px;
    text-align: right; flex-shrink: 0; }
  .lesson-item.active .lesson-num { color: #f97316; }
  .lesson-title { font-size: .98rem; font-weight: 700; color: #1a1a1a; line-height: 1.35; }
  .lesson-item.active .lesson-title { color: #c2410c; }
  .lesson-skill { font-size: .76rem; color: #aaa; margin-top: 2px; font-weight: 400;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; }
  .ab-tag { display: inline-block; margin-top: 4px; font-size: .7rem; font-weight: 800;
    background: #fff1e6; color: #ea580c; border-radius: 8px; padding: 1px 8px;
    text-transform: uppercase; letter-spacing: .04em; }
  .lesson-item.active .ab-tag { background: #f97316; color: white; }
  .no-text-tag { font-size: .72rem; color: #ccc; font-style: italic; }
  .sub-item { padding-left: 28px; }

  /* ── Reader ── */
  .reader { flex: 1; overflow-y: auto; padding: 36px 48px; background: #fff8f0; }
  .reader-empty { display: flex; flex-direction: column; align-items: center;
    justify-content: center; height: 100%; color: #d4a98a; text-align: center; gap: 14px; }
  .reader-empty p { font-size: 1.1rem; font-weight: 600; }

  .lesson-header { margin-bottom: 28px; }
  .lesson-header .topic-tag { font-size: .78rem; font-weight: 800; color: #ea580c;
    text-transform: uppercase; letter-spacing: .08em; margin-bottom: 6px; }
  .lesson-header h2 { font-size: 1.1rem; font-weight: 700; color: #7c4a2d; line-height: 1.4; }
  .ab-header-tag { display: inline-block; margin-top: 8px; font-size: .82rem; font-weight: 800;
    background: #f97316; color: white; border-radius: 14px; padding: 3px 14px; }

  .text-section { background: white; border-radius: 16px; padding: 32px 36px;
    margin-bottom: 28px; border: 2px solid #ffe8d6; max-width: 680px;
    box-shadow: 0 2px 8px rgba(249,115,22,.06); }
  .text-label { font-size: .75rem; font-weight: 800; text-transform: uppercase;
    letter-spacing: .1em; color: #f97316; margin-bottom: 14px; }
  .text-title { font-size: 1.5rem; font-weight: 800; margin-bottom: 4px; color: #1a1a1a;
    line-height: 1.25; font-family: 'Nunito', sans-serif; }
  .text-author { font-size: .9rem; color: #999; margin-bottom: 20px; font-style: italic; }
  .text-body { font-family: Georgia, serif; font-size: 1.15rem; line-height: 2;
    color: #222; }
  .text-body p { margin-bottom: 1.2em; }
  .text-body p:last-child { margin-bottom: 0; }

  .no-text-msg { color: #ccc; font-size: 1rem; margin-top: 40px; text-align: center; font-weight: 600; }

  @media (max-width: 700px) {
    .layout { flex-direction: column; height: auto; }
    .sidebar { width: 100% !important; min-width: 0 !important; height: 280px;
      border-right: none; border-bottom: 2px solid #ffe8d6; }
    .sidebar.collapsed { height: 48px !important; overflow: hidden; }
    .reader { padding: 20px 16px; }
    .text-section { padding: 20px; }
    .text-title { font-size: 1.25rem; }
    .text-body { font-size: 1.05rem; }
  }
</style>
</head>

  <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">

    </div>

</div>

<script>
const DATA = {"3": [{"unit": "Comprehension Skills", "topic": "Pre-Reading Strategies", "lesson": "Establish a purpose for reading texts", "texts": []}, {"unit": "Comprehension Skills", "topic": "Pre-Reading Strategies", "lesson": "Make connections using background knowledge", "texts": []}, {"unit": "Comprehension Skills", "topic": "Key Details", "lesson": "Asking questions while you read", "texts": ["Cliffs of Moher\nWritten by Sean Walker\n\nThese cliffs are famous in Ireland. They are known as the Cliffs of Moher. The cliffs are 390 to 720 feet above the ocean.\nThe cliffs are very popular. More than one million people visit each year. Sometimes people can't see the cliffs when they arrive because it can be very foggy. It is important to check the weather before you make the journey to the cliffs.\nThere are 20 different types of birds that fly around the cliffs. The Atlantic Puffin is one type of bird that you might see if you visit the cliffs. Its red and black beak and orange legs contrast with its feathers.\nIf you want to see the cliffs from another view, you can take a ferry. Ferries can be taken March to November. This trip gives you the best view of wildlife, like the puffin.\nThe cliffs have been used as settings in numerous movies. In 2009, the cliffs were filmed in the movie Harry Potter and the Half-Blood Prince. The rest of the movie was filmed in the United Kingdom.", "Dental Health\nWritten by Dana Burton\n\nVisiting the dentist is important for people's oral health. A dentist helps people keep their teeth and gums healthy. Children and adults should not wait until they have a problem before they see their dentist. They should visit their dentist once every six months.\nWhen people brush their teeth correctly, they are removing the plaque that causes cavities. Plaque is a soft and sticky substance. It sticks on people's teeth. Flossing daily will help remove plaque from in between the teeth that the toothbrush cannot reach. Removing plaque by brushing and flossing also helps to prevent gum disease.\nBrushing and flossing help teeth, but the food people eat matters, too. The sugars from sodas and unhealthy foods mix with the bacteria in mouths. This mixture makes an acid in people's mouths that attack tooth enamel. This can lead to cavities and gum disease. Limiting the amount of sugary beverages and foods can greatly help people's dental health.\nIf someone has any pain in their mouth, they should see a dentist. Cavities get larger if they are not filled properly by a dentist. If it cavity gets big enough, it could reach the nerve in your tooth. If it reaches the nerve, a dentist will have to perform a root canal. A root canal is when the dentist cleans and seals off the space inside a tooth where a nerve used to be.\nSome people are fearful of going to the dentist because they are afraid it might hurt. With today’s technology, dentists are able to make their patients feel comfortable. It is important for people to talk to their dentist and understand any procedures they will have done to their mouth."]}, {"unit": "Comprehension Skills", "topic": "Key Details", "lesson": "Use details from the text to answer questions", "texts": []}, {"unit": "Comprehension Skills", "topic": "Key Details", "lesson": "Use details from the text to infer answers", "texts": []}, {"unit": "Comprehension Skills", "topic": "Key Details", "lesson": "Support conclusions with details from the text", "texts": []}, {"unit": "Comprehension Skills", "topic": "Referencing Key Details", "lesson": "Ask questions about specific key details in a story", "texts": ["The Missing Pet\nWritten by Erica Hayes\n\nChapter 1: Leaving the City\nBrian and his family were moving to a new house in the country. He was not excited about it. What was there to do in the country? It would be so quiet. He would miss his friends. He wouldn't know anyone.\n\"We'll have a nice, big yard,\" his mom said as they drove out of the city. \"Would you like to get a dog?\"\n\"No,\" Brian replied.\nIn the city, he liked going to the dog park and getting to see all the different kinds of dogs. However, he already had a hamster, Zipper, who had been a birthday present last year from his best friend, Abbey.\n\nChapter 2: The Missing Hamster\nThe next morning, when Brian woke up, he knew right away that something was wrong. Usually he awoke to Zipper scampering around on the wood shavings in his cage.\nBrian would get a drink and would begin grooming Zipper's fur. Today, the hamster cage was quiet. The top of the cage was slightly askew.\n\"Oh, no,\" he said.\nHe searched his room until his mother called him down for breakfast.\nAfter breakfast, Brian went back upstairs. There was a small crawlspace in the upstairs hallway. Brian noticed a few shavings near the entrance. He crawled inside on his hands and knees.\n\"Zipper?\" he called.\nHe tried calling Zipper's name again. He made a clucking sound with his tongue. He grabbed a flashlight from the drawer in the kitchen. There was no sign of Zipper anywhere.\n\nChapter 3: Hannah Helps\nBrian hardly slept at all that night. What if Zipper somehow got outside? Brian made up his mind that he would find Zipper tomorrow, no matter what.\nHe spent several hours the next morning trying to devise a plan. He attempted to build a trap out of wood planks and wire mesh. He didn't know how to make it so the door would close when Zipper walked in. At lunchtime, his mom suggested he take a break and get some fresh air outside.\nOut in the backyard, Brian kicked at a clump of grass. He wished they had never moved here in the first place.\nA movement near the woods at the edge of the yard caught his eye. He saw a girl, about his age, wearing a pair of goggles. She was holding what looked like a metal rod with a disk attached to the end.\n\"Oh, hi,\" she said when she saw him. She pushed the goggles up onto her head.\n\"Are you our new neighbor? I'm Hannah.\"\n\"Yeah, my name's Brian. What is that thing?\" he asked.\n\"It's a metal detector. My sister lost an earring. I told her I'd find it. I'm really good at finding stuff.\"\n\"You are?\" asked Brian. A look of excitement flashed in his eyes.\n\"Yeah, did you lose something, too? Want me to find it for you?\" Hannah asked.\n\"Actually... my pet hamster got out of his cage. I've already tried a bunch of things to get him to come out. I guess he's having too much fun,\" Brian said sadly.\n\"I could help you catch him,\" she said.\nBrian looked at her with confusion. \"How would you do that?\"\n\"Follow me. I have the stuff we need at my house,\" she said.\nBrian hesitated, but then followed into her yard. He figured he'd might as well give it a shot.\n\nChapter 4: Setting the Trap\nBack at his house, Brian and Hannah set up a trap using a bucket and two wooden planks. They made a thick layer of cedar shavings in the bucket. Brian brought up some of Zipper's favorite foods: blackberries, strawberries, and a spoonful of peanut butter. Hannah took the smaller plank and laid it across the top of the bucket. They balanced the food on it. Next, she took the wider plank and made a little ramp leading up to the top of the bucket.\n\"This way,\" she said, \"your hamster will be able to climb up to the food. When he tries to walk across the skinny piece of wood, it'll tip, and he'll fall into the bucket. He'll be there waiting for you when you get up in the morning!\"\nBrian smiled. \"I hope this works,\" he said, \"but even if it doesn't, thanks for helping me. That was really nice of you.\"\n\"Of course!\" she said. \"But don't worry. It will work. I promise.\"\nThe next morning, Brian rushed out to check the trap. There was Zipper, in the bottom of the bucket, finishing the last blackberry. He would have to thank Hannah after breakfast.\nBrian was extremely relieved to see Zipper, but he was even more thankful to have found a friend. Maybe moving to the country wasn't such a bad thing after all.", "Twas the Night Before Christmas\nWritten by Clement Clarke Moore\n\nTwas the night before Christmas, when all through the house,\nNot a creature was stirring, not even a mouse.\n\nThe stockings were hung by the chimney with care,\nIn hopes that St. Nicholas soon would be there.\n\nThe children were nestled all snug in their beds,\nWhile visions of sugar plums danced in their heads.\n\nAnd Mamma in her 'kerchief, and I in my cap,\nHad just settled our brains for a long winter's nap.\n\nWhen out on the lawn there arose such a clatter,\nI sprang from the bed to see what was the matter.\n\nAway to the window I flew like a flash,\nTore open the shutters, and threw up the sash.\n\nThe moon on the breast of the new-fallen snow\nGave the luster of midday to objects below,\n\nWhen, what to my wondering eyes should appear,\nBut a miniature sleigh, and eight tiny reindeer.\n\nWith a little old driver, so lively and quick,\nI knew in a moment it must be St. Nick.\n\nMore rapid than eagles his coursers they came,\nAnd he whistled, and shouted, and called them by name!\n\n\"Now Dasher! Now, Dancer! Now, Prancer, and Vixen!\nOn, Comet! On, Cupid! On, Donner and Blitzen!\n\nTo the top of the porch! To the top of the wall!\nNow dash away! Dash away! Dash away all!\"\n\nAs dry leaves that before the wild hurricane fly,\nWhen they meet with an obstacle, mount to the sky.\n\nSo up to the house-top the coursers they flew,\nWith the sleigh full of toys, and St. Nicholas, too.\n\nAnd then, in a twinkling, I heard on the roof,\nThe prancing and pawing of each little hoof.\n\nAs I drew in my head, and was turning around,\nDown the chimney St. Nicholas came with a bound.\n\nHe was dressed all in fur, from his head to his foot,\nAnd his clothes were all tarnished with ashes and soot.\n\nA bundle of toys he had flung on his back,\nAnd he looked like a peddler, just opening his pack.\n\nHis eyes, how they twinkled! His dimples, how merry!\nHis cheeks were like roses, his nose like a cherry!\n\nHis droll little mouth was drawn up like a bow,\nAnd the beard of his chin was as white as the snow.\n\nThe stump of a pipe held tight in his teeth,\nAnd the smoke, it encircled his head like a wreath.\n\nHe had a broad face and a little round belly,\nThat shook when he laughed, like a bowlful of jelly!\n\nHe was chubby and plump, a right jolly old elf.\nAnd I laughed when I saw him, in spite of myself!\n\nA wink of his eye and a twist of his head,\nSoon gave me to know I had nothing to dread.\n\nHe spoke not a word, but went straight to his work,\nAnd filled all the stockings, then turned with a jerk.\n\nAnd laying his finger aside of his nose,\nAnd giving a nod, up the chimney he rose!\n\nHe sprang to his sleigh, to his team gave a whistle,\nAnd away they all flew like the down of a thistle.\n\nBut I heard him exclaim, as he drove out of sight,\n\"Happy Christmas to all, and to all a good night!\"\n\nThe End"]}, {"unit": "Comprehension Skills", "topic": "Referencing Key Details", "lesson": "Answer questions using specific key details in a story", "texts": ["The Missing Pet\nWritten by Erica Hayes\n\nChapter 1: Leaving the City\nBrian and his family were moving to a new house in the country. He was not excited about it. What was there to do in the country? It would be so quiet. He would miss his friends. He wouldn't know anyone.\n\"We'll have a nice, big yard,\" his mom said as they drove out of the city. \"Would you like to get a dog?\"\n\"No,\" Brian replied.\nIn the city, he liked going to the dog park and getting to see all the different kinds of dogs. However, he already had a hamster, Zipper, who had been a birthday present last year from his best friend, Abbey.\n\nChapter 2: The Missing Hamster\nThe next morning, when Brian woke up, he knew right away that something was wrong. Usually he awoke to Zipper scampering around on the wood shavings in his cage.\nBrian would get a drink and would begin grooming Zipper's fur. Today, the hamster cage was quiet. The top of the cage was slightly askew.\n\"Oh, no,\" he said.\nHe searched his room until his mother called him down for breakfast.\nAfter breakfast, Brian went back upstairs. There was a small crawlspace in the upstairs hallway. Brian noticed a few shavings near the entrance. He crawled inside on his hands and knees.\n\"Zipper?\" he called.\nHe tried calling Zipper's name again. He made a clucking sound with his tongue. He grabbed a flashlight from the drawer in the kitchen. There was no sign of Zipper anywhere.\n\nChapter 3: Hannah Helps\nBrian hardly slept at all that night. What if Zipper somehow got outside? Brian made up his mind that he would find Zipper tomorrow, no matter what.\nHe spent several hours the next morning trying to devise a plan. He attempted to build a trap out of wood planks and wire mesh. He didn't know how to make it so the door would close when Zipper walked in. At lunchtime, his mom suggested he take a break and get some fresh air outside.\nOut in the backyard, Brian kicked at a clump of grass. He wished they had never moved here in the first place.\nA movement near the woods at the edge of the yard caught his eye. He saw a girl, about his age, wearing a pair of goggles. She was holding what looked like a metal rod with a disk attached to the end.\n\"Oh, hi,\" she said when she saw him. She pushed the goggles up onto her head.\n\"Are you our new neighbor? I'm Hannah.\"\n\"Yeah, my name's Brian. What is that thing?\" he asked.\n\"It's a metal detector. My sister lost an earring. I told her I'd find it. I'm really good at finding stuff.\"\n\"You are?\" asked Brian. A look of excitement flashed in his eyes.\n\"Yeah, did you lose something, too? Want me to find it for you?\" Hannah asked.\n\"Actually... my pet hamster got out of his cage. I've already tried a bunch of things to get him to come out. I guess he's having too much fun,\" Brian said sadly.\n\"I could help you catch him,\" she said.\nBrian looked at her with confusion. \"How would you do that?\"\n\"Follow me. I have the stuff we need at my house,\" she said.\nBrian hesitated, but then followed into her yard. He figured he'd might as well give it a shot.\n\nChapter 4: Setting the Trap\nBack at his house, Brian and Hannah set up a trap using a bucket and two wooden planks. They made a thick layer of cedar shavings in the bucket. Brian brought up some of Zipper's favorite foods: blackberries, strawberries, and a spoonful of peanut butter. Hannah took the smaller plank and laid it across the top of the bucket. They balanced the food on it. Next, she took the wider plank and made a little ramp leading up to the top of the bucket.\n\"This way,\" she said, \"your hamster will be able to climb up to the food. When he tries to walk across the skinny piece of wood, it'll tip, and he'll fall into the bucket. He'll be there waiting for you when you get up in the morning!\"\nBrian smiled. \"I hope this works,\" he said, \"but even if it doesn't, thanks for helping me. That was really nice of you.\"\n\"Of course!\" she said. \"But don't worry. It will work. I promise.\"\nThe next morning, Brian rushed out to check the trap. There was Zipper, in the bottom of the bucket, finishing the last blackberry. He would have to thank Hannah after breakfast.\nBrian was extremely relieved to see Zipper, but he was even more thankful to have found a friend. Maybe moving to the country wasn't such a bad thing after all.", "Twas the Night Before Christmas\nWritten by Clement Clarke Moore\n\nTwas the night before Christmas, when all through the house,\nNot a creature was stirring, not even a mouse.\n\nThe stockings were hung by the chimney with care,\nIn hopes that St. Nicholas soon would be there.\n\nThe children were nestled all snug in their beds,\nWhile visions of sugar plums danced in their heads.\n\nAnd Mamma in her 'kerchief, and I in my cap,\nHad just settled our brains for a long winter's nap.\n\nWhen out on the lawn there arose such a clatter,\nI sprang from the bed to see what was the matter.\n\nAway to the window I flew like a flash,\nTore open the shutters, and threw up the sash.\n\nThe moon on the breast of the new-fallen snow\nGave the luster of midday to objects below,\n\nWhen, what to my wondering eyes should appear,\nBut a miniature sleigh, and eight tiny reindeer.\n\nWith a little old driver, so lively and quick,\nI knew in a moment it must be St. Nick.\n\nMore rapid than eagles his coursers they came,\nAnd he whistled, and shouted, and called them by name!\n\n\"Now Dasher! Now, Dancer! Now, Prancer, and Vixen!\nOn, Comet! On, Cupid! On, Donner and Blitzen!\n\nTo the top of the porch! To the top of the wall!\nNow dash away! Dash away! Dash away all!\"\n\nAs dry leaves that before the wild hurricane fly,\nWhen they meet with an obstacle, mount to the sky.\n\nSo up to the house-top the coursers they flew,\nWith the sleigh full of toys, and St. Nicholas, too.\n\nAnd then, in a twinkling, I heard on the roof,\nThe prancing and pawing of each little hoof.\n\nAs I drew in my head, and was turning around,\nDown the chimney St. Nicholas came with a bound.\n\nHe was dressed all in fur, from his head to his foot,\nAnd his clothes were all tarnished with ashes and soot.\n\nA bundle of toys he had flung on his back,\nAnd he looked like a peddler, just opening his pack.\n\nHis eyes, how they twinkled! His dimples, how merry!\nHis cheeks were like roses, his nose like a cherry!\n\nHis droll little mouth was drawn up like a bow,\nAnd the beard of his chin was as white as the snow.\n\nThe stump of a pipe held tight in his teeth,\nAnd the smoke, it encircled his head like a wreath.\n\nHe had a broad face and a little round belly,\nThat shook when he laughed, like a bowlful of jelly!\n\nHe was chubby and plump, a right jolly old elf.\nAnd I laughed when I saw him, in spite of myself!\n\nA wink of his eye and a twist of his head,\nSoon gave me to know I had nothing to dread.\n\nHe spoke not a word, but went straight to his work,\nAnd filled all the stockings, then turned with a jerk.\n\nAnd laying his finger aside of his nose,\nAnd giving a nod, up the chimney he rose!\n\nHe sprang to his sleigh, to his team gave a whistle,\nAnd away they all flew like the down of a thistle.\n\nBut I heard him exclaim, as he drove out of sight,\n\"Happy Christmas to all, and to all a good night!\"\n\nThe End"]}, {"unit": "Comprehension Skills", "topic": "Referencing Key Details", "lesson": "Use key details from a story to support answers", "texts": ["Riding the Rails\nWritten by Joy Kita\n\nChapter 1: Running Away\n\nWhen Samuel’s mom was sick, he thought his world would end. She was all he had. He was only seven when she died, and he was sent to live with his uncle in Iowa. Life with his uncle was not terrible, but it was not home.\nNow he was stuck out in nowhere land on an isolated farm. He was expected to do chores and mind his manners. His aunt even wanted him to take a bath every night. When his mom was alive, she worked too much to care if he had dirt behind his ears.\nThe decision to run away and find his father was an easy one. He had been sorting through some of his mother’s belongings one rainy afternoon when he’d found a letter.\n\nDear Marylou,\nI hope this letter finds you well. I have been able to land myself a job here in Detroit, Michigan, at a factory building cars. I want you and Samuel to come as soon as possible. I’ll send money.\nYours Forever,\nEdward\n\nWhen he asked his uncle about the letter, his answer had been vague.\n“He never sent money,” he said with a shrug.\nSamuel told his aunt and uncle that night that he wanted to find his father. They had not been happy about it. They told him Samuel’s mother never heard from his father after he left.\n\nChapter 2: The Train\n\nHe may not have had his aunt and uncle’s support, but it didn’t mean he would stay with them. He had to find his father. It was only a half a day’s hike to the railroad track. He packed light with only a change of clothes and a picture of his mother and father in an old locket that his mother used to wear.\nThe railroad yard came into view. He knew that the northbound train left after midday. The closer he got, the more he began to sweat. Worry wormed its way into the core of his resolve. It was like a caterpillar boring through an apple. If he was caught, he’d be sent back to the farm.\nI’m not going to get caught, he thought. He patted the letter in his pocket and allowed himself to be buoyed by its presence.\nThere was a blast of steam, a piercing horn, and the metal screech of steel rubbing steel. When the train began to move, Samuel started to jog. He heard a cry behind him and realized that he had been seen. He ran faster to keep pace with his chosen boxcar.\n“Don’t do it, son. It’s too dangerous!” a man yelled, while trying to catch up to him.\nSamuel reached and leapt at the same time. His hand brushed the hot metal door and he lunged forward, landing in a tangled heap on the rough planks with his feet dangling off the edge.\nHe had done it! Scrambling to a standing position, he braced his legs to adapt to the motion and peeked out. Three men were shaking their fists at him. He couldn’t hear what they said, but if their faces were any indication, it wasn’t good.\n\nChapter 3: Traveling Companions\n\nHe heard a noise from the shadows and knew he wasn’t alone. Someone else was in his boxcar.\n“Hello?” His voice sounded young. “I can hear you.”\n“Never seen such determination. Thought you might not make it,” a soft, southern voice drawled.\nSamuel peered into the shadows but couldn’t see anyone. It was as though he was talking to a ghost. He swallowed hard, but before he could say something really dumb, the shadow moved.\n“Name’s Willy,” the man said, offering out a hand. Samuel just kept staring at him.\n“Never seen a hobo before, boy?”\nSamuel shook his head and continued to stare. The man was dirty and very gaunt. His clothes were more tattered than his aunt’s cleaning rags.\n“Nice to meet you,” Samuel said.\n“Where you headed, Samuel?” Willy asked.\n“Michigan. My father’s there. How about you?”\nWilly scratched at the grey stubble on his face and shrugged.\n“Anywhere but here.”\nWilly told him about the depression the country was in. He said Samuel was lucky to live on a farm with people who could feed him. He told him there was no work and that he’d been riding the rails for months without luck.\n\nChapter 4: Family Ties\n\n“How old are you, son?”\n“Fourteen,” Samuel said.\n“When did your Pa leave?”\nSamuel hung his head, feeling the familiar wave of sadness overcome him. “I don’t remember him at all.”\nWilly nodded, his face thoughtful. “And your relatives, when did they take you in?”\n“When my mother died five years ago,” he said, frowning. He felt very lonely thinking of his uncle and aunt. In that moment, all he wanted to do was go back home.\n“Family isn’t about names, son. It’s about loving,” Willy stared off into the distance, lost in his own painful memory.\nAt the next stop, Samuel said goodbye.\n“Thanks for helping me to see,” he said with a smile.\nHe was headed home, but he didn’t have to go far. His uncle was waiting for him on the platform.\n“I was going to wait at every station from here to Detroit,” his uncle said with a shaky smile. “Don’t you know how much we love you, Samuel?”\nSamuel walked over to his uncle and allowed himself to be embraced. “I’m beginning to understand.”", "No More Lies\nWritten by Courtney Courtnage\n\nChapter 1: Bored\n\n\"Oh, man! This is so boring!\" Billy said to himself. He was lying on the bed staring at his ceiling, and he desperately wanted some excitement. He rolled off the bed and wandered into his little sister's room. Billy watched Crystal playing with her toy bear, and he got an idea.\n\"Hey, Crystal, did you hear about the raccoon that is on the loose?\" he asked.\n\"I don't like raccoons. They are scary,\" said Crystal.\n\"This one is extra terrifying. It's so scary that we all have to stay inside,\" said Billy. \"Be sure all the windows and doors are latched—we wouldn't want it in the house!\"\n\"Okay, Billy,\" said Crystal. She seemed unaffected by his warning and went back to playing with her bear.\nBilly rummaged and rooted until he found an old scarf that looked like a tail, and then he waited. Crystal left her room and Billy positioned the scarf so it peeked out from under Crystal's bed.\nCrystal came back to her room and played quietly. Then Billy started to yell, \"It's in the house! Run for your lives!\" The cruel boy then pulled Crystal's door closed. \"It's in your room, and I can't get the door open!\"\n\"Look under your bed!\" he yelled, trying hard not to laugh. He could hear his sister crying as she pounded on the door. When he finally let it open, Crystal fled. She ran right out into the yard and told their mother what had happened.\n\"I didn't do it!\" cried Billy to his mom.\n\"You shouldn't tell lies, Billy,\" his mother began. \"If you tell lies, people will stop believing what you have to say. So even when you tell the truth, no one will believe you.\"\n\"I am telling the truth,\" said Billy.\nBilly hopped on his bike and coasted around for a bit. \"Borrrrring,\" he sang aloud. As Billy was putting his bike back in the garage, he accidentally scraped the side of his dad's car, leaving a long, deep scratch.\nJust then, Billy heard his dad call out, \"I'm going to the store to get some juice.\" Billy heard the jingle of car keys and started to panic. He knew he would be in big trouble for scratching the car. He ran up to his room and pretended to read a book.\n\"Billy!\" his dad yelled.\n\"I'm in my room reading,\" Billy called back.\nDad came into the room and asked, \"Billy, did you scratch my car?\"\n\"No, Dad, I swear it wasn't me,\" Billy said.\n\"The paint that was left on the car is the same color as your bike,\" said Dad. \"You shouldn't lie, Billy. If you ever do tell the truth, no one is going to believe you!\"\n\nChapter 2: Snicker\n\nDad left with heavy footsteps, and Billy just sat there. Suddenly, outside his window a spinning disc covered in colorful lights appeared. Billy opened his window to get a better look. The disc flew in and landed on his desk. As it landed, Billy realized it wasn't just a disc, it was a spaceship. Billy saw a little green creature walk out of the ship.\n\"Hi, my name is Snicker,\" said the creature. \"I traveled here from Jupiter to find some excitement.\"\nBilly ran and hid in his closet. Snicker giggled, tore up Billy's homework, and threw the paper all over Billy's bedroom.\n\"Why did you do that?\" Billy cried.\n\"Why not?\" said Snicker with a shrug. \"That was awesome.\"\n\"Look at the mess you made!\" yelled Billy.\n\"No look at the mess you made,\" Snicker replied with a laugh.\n\"I didn't do this. Don't lie!\" Billy yelled even louder.\n\"I'm not lying,\" retorted Snicker.\n\"If you lie, no one will ever believe you,\" Billy said. \"Whoa, I sound just like my parents.\"\n\nChapter 3: Trouble\n\nSnicker got into his ship and soared off. When his mom came through the door, Billy froze. \"I know how this looks!\" said Billy.\n\"YOU ARE GROUNDED!\" his mom screamed.\n\"I really didn't—\" Billy started.\n\"Billy, I have had enough,\" his mom said. \"You need to stop lying.\"\nBilly told his mother the truth about his sister and his father's car. \"But I didn't make this mess,\" he finished.\nBilly spent the rest of the day cleaning up. He hung up every picture, and he even wiped the scuff marks off the walls. However, Billy could not fix his homework and had no time to redo it.\n\nChapter 4: School\n\nThe next day the teacher asked, \"Billy, where is your homework?\" Billy told his teacher the story about Snicker.\n\"Really? Last week you said your homework was taken by goblins, and before that, you were sparring with ninjas for it. If you keep lying, no one will believe you when you are being truthful,\" said his flustered teacher.\nBilly sat in detention for his entire lunch hour. The window was ajar and in flew Snicker's flying saucer.\n\"You got me in trouble!\" shrieked Billy. \"Get out of here!\" Snicker sat down and crossed his legs.\n\"They got mad at me back home, too,\" he said. \"I did things I knew were bad. Then, I lied about them, so I would not get in trouble.\"\n\"Is that why you are here?\" Billy asked softly.\n\"I had to leave to find my dad. When I told the others that my dad had run out of gas in his ship, nobody believed me. Now I'm on my own because the others think my dad is okay,\" Snicker said, holding back tears.\n\"That's a sad story,\" Billy said. \"I hope you find your dad.\"\n\"I'm sorry for causing trouble,\" replied Snicker. Then he got in his ship and left for good.\nAt home that night, Billy hugged his mom and dad. \"I promise to never lie again!\" he said to them."]}, {"unit": "Comprehension Skills", "topic": "Referencing Key Details", "lesson": "Refer to specific key details to make inferences about a story", "texts": ["Colin's Closet\nWritten by Merridith Townsend\n\nChapter 1: The Day That Started It All\nColin's terrible day started when he couldn't wear his favorite shirt because it was in the laundry. It continued when there was no syrup, and he had to eat a dry waffle for breakfast. When he was walking to school, the neighbor's car drove through a puddle and splashed him. When he walked home, he was splashed again by the same car.\n\"What's for dinner?\" he grumbled as he walked in the door. A good dinner full of his favorite foods would have made his day all better.\n\"For dinner, we are having vegetables and quinoa,\" his mother replied cheerfully.\nThat was too much for Colin. He started yelling. He knew he was acting like a baby, but he didn't care.\n\"I don't even know what quinoa is, but I hate it!\" he shouted. \"I hate this shirt, and I hate puddles.\" Then he said the worst possible thing.\nHe was so full of anger he couldn't stop himself. \"I hate you, too.\"\nHis mom's eyes narrowed. There was silence.\n\"Go to your room,\" she hissed, \"and don't come out until you've gotten rid of all that hate.\" Colin burst into tears and ran all the way up the stairs, slamming the door behind him.\n\nChapter 2: Wishing His Life Away\nLying in his bed, Colin tried to stop hating, but he couldn't. He closed his eyes, and he wished that he lived somewhere with no school. He wished that he was in a world without any parents or anyone telling him what to do.\nHe wished so hard that he didn't notice a light under his closet door starting to glow. It wasn't until his closet door started to rattle that Colin noticed. Had his wishes created this magic light? Colin got up and made his way to the closet.\n\nChapter 3: Behind the Closet Door\nWhen he opened it, he couldn't believe his eyes. Inside was an exact copy of his bedroom, but it was so much better. It was filled with everything he had ever asked for but never received.\nThere was the action figure he had begged for when he was four years old. He even saw the army tank his mother refused to buy. There was a new video game system. Breathless, he stepped into the room. He never wanted to leave.\nIn fact, he was so excited by all of the forbidden treasure that he didn't even notice that the door had disappeared behind him. Hours passed as Colin played with every toy and every game in his new room. He played until his head started to spin. He tried to close his eyes to take a break, but that only made him dizzier. He tried to take a deep breath, but his stomach felt sour. He needed to get out of the room.\nWhen Colin turned to leave, his heart started to pound. The door was gone. What was he going to do? He shut his eyes and tried wishing. After all, wishing had worked the first time.\n\nChapter 4: The Bogey Lady\nHe opened his eyes. The door had returned, but there was a strange woman standing in front of it.\n\"What's wrong, sweetie?\" the woman asked.\n\"Who are you?\" Colin backed up against the far wall.\n\"You must be starving,\" she continued.\n\"No, I'm not hungry. I just want to go home,\" he told her.\nShe frowned, but it didn't look like a real frown to Colin. It looked like she was making fun of him.\n\"But I thought that you hated your home. You will be happy here because you have everything that you've ever wanted. You can stay here with us,\" she said.\n\"What do you mean? Who is us?\" Colin grew more and more afraid as she spoke.\n\"Where do you think monsters in the closet come from?\" she said. \"We were all once kids like you. We hated everything, too.\" Her face was changing with every step she took. \"Sure some of us were a little mad when we first realized we were stuck here. But don't worry, we still get out at night.\"\nShe had gotten very close, and Colin saw that she wasn't a woman at all. She was a monster with a mouth full of the sharpest teeth he had ever seen.\n\"I'll never stay here,\" Colin said. He could see the darkness of his room through the open door. He made a quick decision, ducked past the beastly woman, and ran out.\nWhen he slammed the door behind him, it silenced the disappointed roar of the monster in the closet.\n\"Colin?\" his mother called from the hallway. Colin had never been happier to see her.\n\"What are you doing? Why are you standing against the wall?\"\n\"It's not the wall, it's the—\" Colin blinked and spun around. There was no door behind him. \"It's gone!\" he cried in astonishment.\n\"What's gone, sweetheart?\" his mother asked.\n\"The door, my closet door...it's gone!\" he tried to explain.\nHis mother turned on the light. His room was lit up, and Colin remembered that he didn't have a closet. This room had never had one. He ran to his mother's arms with such force that she gasped and then laughed.\n\"Oh honey,\" she said, kissing his head, \"you really did have a bad day didn't you?\"\nThey sat together in the dining room and ate dinner. Colin apologized and told his mother that he didn't hate her. She assured him that she knew that all along.\n\"Things get rough sometimes,\" she said, spooning some quinoa on his plate. It was actually much tastier than he imagined. \"Things get rough even for grown-ups. But if things weren't hard, we wouldn't know how to appreciate the good things that we have.\"\n\"Be careful what you wish for, right?\" Colin said, chewing on a big mouthful of his quinoa.\n\"You're right about that, son,\" she said. \"After dinner, make sure to put your jacket and your bag away in the closet. You dropped them on the floor when you came in.\" Colin's stomach dropped.\n\"How about I do the dishes instead?\" he suggested.\nShe raised and eyebrow and shrugged. \"Alright, you got a deal,\" she said with a smile.", "The Twist of Nature\nGood Guys of the Badlands Series\nWritten by Joy Kita\n\nChapter 1: Badlands\nI am not very good at being a superhero. I may fight for the good guys, but I struggle with keeping myself in check. It's not easy harnessing so much power. It takes a loose grip with a tight mindset.\nThey call me Twist. I live in the Badlands. There are no adults here. We are taken at six and left to fend for ourselves. Some of us make it, and some of us don't. I've been one of the lucky ones. For three years, this place has been my home.\nThe Badlands have never seen an escape. No one knows the way out. The council has made sure of that. No one even knows where we are. What kind of place has no beginning or end?\nMost of us don't remember our parents. We wake up in the Badlands and soon grow to forget our former lives. They say there is no way out. Once we turn eighteen, it's over. Whatever it is that keeps us ticking until then stops. It's like our lives are on a timer.\n\nChapter 2: Heroes\nSome of us are growing stronger. We have special gifts. Whether given to us by the monsters that put us here or manifested by our own desperation—I don't know. Why do some of us turn and not others?\nNot all of the children in the Badlands use their gifts for good. Most of them, faced with the reality of their dismal existence, choose to side with evil.\nI have joined with others like me. We are the good guys of the Badlands. The job is not easy. Most of us are only eleven or twelve. Some of us are even younger, but when much is given, much is expected.\n\nChapter 3: Methane\nMy room is lit with only a battery operated light in the shape of an old lantern. The battery never dies. My light never fades. It is one more mystery of this place we're in. I live in an abandoned building. I think it must have been used for some kind of research.\nThere are hospital beds and rusty equipment that scares me. I know there have been generations of children here in the Badlands. Their names and the years they were here are carved everywhere.\nI live in this terrifying, haunting place because I'm being hunted. I've made a lot of people angry with me. My superpowers cause a lot of damage. The other good guys and I are trying to stop a violent plot against the current Elect.\n\"Twist,\" my friend calls from another room.\nI pick my way across the rubble that we haven't bothered to clean up and find him sitting cross-legged, a computer propped on his lap.\n\nChapter 4: Sidekicks\n\"I'm tracking Methane now. It looks like he is headed to the school.\"\nI sigh and tap my foot against the cracked concrete floor. \"Are you coming with me?\" I ask, even though I know he wants me to check it out.\n\"I'm sending Watts with you,\" he says with a smile.\nMy friend's name is Jackhammer. His left arm can stop a moving train, and he wants me to face Methane with Watts?\n\"So she has electricity flowing through her fingers! It doesn't mean I want her as my sidekick,\" I say, frowning.\n\"What makes you think that you are not my sidekick?\" Watts asks and taps me on my shoulder.\nWe tend to disagree, but since we're on the same team we pretend to like each other and head out to stop Methane. There have been attacks on the four schools in the Badlands. No one knows why or who would try and hurt the little ones.\n\"Stop right there, Methane!\" I shout when we round the corner of the schoolhouse and see him at the faded red door.\n\"Well if it isn't my good friend, Twist. I heard you have a warrant on your head. What did you do, break the law?\"\n\nChapter 5: Poison\nI sneer at him and say, \"Law in the Badlands is as foul as you smell.\"\n\"Take off, Methane. Leave the kids alone,\" Watts says as she rubs her hands together. Sparks shoot from her fingertips and sizzle into the air.\nMethane doesn't hesitate. He opens his mouth. I dive out of the way. Watts is too late. A green cloud of gas covers her face and in seconds, she falls in a heap on the ground.\nI hold out my hands. Small funnel clouds shoot up from my palms like miniature tornadoes. Methane tries to bolt away. I thrust out one hand, then the other, karate style, and the tornadoes become massive cyclones that chew up the ground at Methane's feet.\nHe runs away screaming about revenge, but I've heard it all before. He and the rest of his friends will try harder to stop me next time. I'm really good at making enemies. I help Watts recover, and we check on the little ones. It's just another day of havoc in the Badlands."]}, {"unit": "Comprehension Skills", "topic": "Recounting and Main Events", "lesson": "Identify main events in a story", "texts": ["Grandfather's Hugs\nWritten By Meredith Townsend\n\nChapter One: Grandfather\nLiam’s grandfather always hugged him. He scooped him up and wrapped his arms around him. His skin smelled like sweet sawdust. When his grandfather hugged him, Liam felt like he was flying. He loved his grandfather very much.\n   Liam's grandfather lived close to the park and the shops downtown. Liam could take the bus there after school. There were always people around, laughing and talking, shopping and playing. Liam loved to watch all the people when he went to his grandfather's house.\n   After school, Liam and his grandfather would build in his workshop. They built birdhouses and towel racks, tall shelves and toolboxes. They hammered nails. They sanded. They painted. When they were done, they would drink hot cocoa together. They would listen to all the people outside, the cars in the street, the chime of bicycle bells.\n   At his grandfather's house, Liam felt safe. He felt happy and loved.\n\nChapter Two: The News\nOne day, Liam’s grandfather told him something very sad. He told Liam he was moving.\n   “Your grandmother and I are old,” he said. “We picked a smaller house. We want a quiet life.”\n   Liam’s stomach hurt. He didn’t want his grandfather to leave. Liam didn’t understand. Why was a quiet life important? Why did they need a small house? What would Liam do after school without his grandfather?\n   A few days later, Liam's dad said they were going to visit his grandfather in his new house. Liam decided he was going to hate the small house. He decided he was going to hate the quiet. He decided he was going to hate his grandfather.\n   Liam went to the car, but when his dad came out, he smiled at Liam. “I have a surprise for you,” he said. He took Liam's hand and they walked down the driveway. They walked across the street and down the block. When they turned the corner, Liam saw his grandfather outside, watering the lawn in front of a small house.\n   When he saw his grandfather, Liam forgot to hate. His grandfather picked him up in his big arms. He squeezed all the anger right out of him. “Hello, neighbor!” his grandfather said.\n   They went inside and downstairs to Liam's grandfather's new workshop. They hammered nails. They sanded. They painted. When they were done, his grandmother had hot cocoa waiting for them. Liam could hear birds chirping outside. A soft wind blew a wind chime next door. Leaves skittered across the driveway.\n   Liam felt safe. He felt happy and loved.\n   “I love your small house,” said Liam, licking the marshmallow fuzz from his upper lip. “I love the quiet.”\n   His grandfather said, “I love the quiet, too, but I love you more.”", "Mom Gives Up\nWritten by Meredith Townsend\n\nChapter One\n   It was time for lunch. I was starving. I went downstairs to find Mom in the kitchen. My brother Charlie came down, too. “What's for lunch?” he asked.\n   I knew what I wanted. “Mom,” I said, “will you make us pancakes and bacon for lunch?”\n   Mom was in the middle of paying bills, but she smiled. “Sure. Just give me a few minutes.”\n   Charlie and I waited, but not very patiently. He poked me. I pushed him. We knocked over a stack of mail mom had been sorting. We heard Mom sigh in the kitchen. We looked at each other. Mom's sighs were never a good sign. We picked up all the mail and sat at the table.\n   When Mom finally brought us lunch, I looked down at the bacon. “This is too crispy,” I said.\n   Charlie took a bite of the pancakes. “These don't taste like they usually do,” he said.\n   “This isn't the syrup I like,” I said.\n   Mom sighed. She made us macaroni and cheese instead.\n   “This isn't what I wanted,” Charlie whispered. But Mom heard him. She sighed even louder, but ignored us. She went back to paying the bills.\n\nChapter Two\n   The next day, I went downstairs for lunch again. Mom was scrubbing the floor. “I'm hungry,” I told her.\n   Charlie was behind me. “Can we have spaghetti?” he asked.\n   Mom sighed. “I'm not going to spend an hour cooking you a lunch you will just complain about. You boys can cook for yourselves.”\n   Charlie was angry. “But I'm in the middle of a really good chapter in my book,” he said.\n   “I hate cooking!” I said. “I'd rather do anything than cook!”\n   Mom sighed. “I know how you feel,” she said. Then she went back to scrubbing the floor.\n   Charlie and I went to the fridge. We stared inside. We didn't know how to make anything Mom usually cooked. We weren't supposed to use the stove. We still didn't have the good syrup. I frowned at Charlie.\n   We ended up at the kitchen table with a box of cereal.\n   When it was time for dinner, I slowly walked into the kitchen. “Mom?” I called. She was sitting in a chair knitting. Charlie came into the kitchen, too.\n   “Do we have to cook ourselves dinner?” I asked. Mom sighed.\n   “We're sorry we didn't like your pancakes yesterday,” Charlie said.\n   “We'll help you clean up tonight,” I said.\n   “We'll never complain again,” Charlie said. “Just please don't make us eat cereal for dinner!”\n   Mom laughed. “Well, I guess you've learned your lesson,” she said. “Are you still in the mood for spaghetti?”"]}, {"unit": "Comprehension Skills", "topic": "Recounting and Main Events", "lesson": "Identify key details in a story", "texts": ["\"Grandfather's Hugs\nWritten By Meredith Townsend\n\nChapter One: Grandfather\nLiam’s grandfather always hugged him. He scooped him up and wrapped his arms around him. His skin smelled like sweet sawdust. When his grandfather hugged him, Liam felt like he was flying. He loved his grandfather very much.\n   Liam's grandfather lived close to the park and the shops downtown. Liam could take the bus there after school. There were always people around, laughing and talking, shopping and playing. Liam loved to watch all the people when he went to his grandfather's house.\n   After school, Liam and his grandfather would build in his workshop. They built birdhouses and towel racks, tall shelves and toolboxes. They hammered nails. They sanded. They painted. When they were done, they would drink hot cocoa together. They would listen to all the people outside, the cars in the street, the chime of bicycle bells.\n   At his grandfather's house, Liam felt safe. He felt happy and loved.\n\nChapter Two: The News\nOne day, Liam’s grandfather told him something very sad. He told Liam he was moving.\n   “Your grandmother and I are old,” he said. “We picked a smaller house. We want a quiet life.”\n   Liam’s stomach hurt. He didn’t want his grandfather to leave. Liam didn’t understand. Why was a quiet life important? Why did they need a small house? What would Liam do after school without his grandfather?\n   A few days later, Liam's dad said they were going to visit his grandfather in his new house. Liam decided he was going to hate the small house. He decided he was going to hate the quiet. He decided he was going to hate his grandfather.\n   Liam went to the car, but when his dad came out, he smiled at Liam. “I have a surprise for you,” he said. He took Liam's hand and they walked down the driveway. They walked across the street and down the block. When they turned the corner, Liam saw his grandfather outside, watering the lawn in front of a small house.\n   When he saw his grandfather, Liam forgot to hate. His grandfather picked him up in his big arms. He squeezed all the anger right out of him. “Hello, neighbor!” his grandfather said.\n   They went inside and downstairs to Liam's grandfather's new workshop. They hammered nails. They sanded. They painted. When they were done, his grandmother had hot cocoa waiting for them. Liam could hear birds chirping outside. A soft wind blew a wind chime next door. Leaves skittered across the driveway.\n   Liam felt safe. He felt happy and loved.\n   “I love your small house,” said Liam, licking the marshmallow fuzz from his upper lip. “I love the quiet.”\n   His grandfather said, “I love the quiet, too, but I love you more.”\"", "\"Mom Gives Up\nWritten by Meredith Townsend\n\nChapter One\n   It was time for lunch. I was starving. I went downstairs to find Mom in the kitchen. My brother Charlie came down, too. “What's for lunch?” he asked.\n   I knew what I wanted. “Mom,” I said, “will you make us pancakes and bacon for lunch?”\n   Mom was in the middle of paying bills, but she smiled. “Sure. Just give me a few minutes.”\n   Charlie and I waited, but not very patiently. He poked me. I pushed him. We knocked over a stack of mail mom had been sorting. We heard Mom sigh in the kitchen. We looked at each other. Mom's sighs were never a good sign. We picked up all the mail and sat at the table.\n   When Mom finally brought us lunch, I looked down at the bacon. “This is too crispy,” I said.\n   Charlie took a bite of the pancakes. “These don't taste like they usually do,” he said.\n   “This isn't the syrup I like,” I said.\n   Mom sighed. She made us macaroni and cheese instead.\n   “This isn't what I wanted,” Charlie whispered. But Mom heard him. She sighed even louder, but ignored us. She went back to paying the bills.\n\nChapter Two\n   The next day, I went downstairs for lunch again. Mom was scrubbing the floor. “I'm hungry,” I told her.\n   Charlie was behind me. “Can we have spaghetti?” he asked.\n   Mom sighed. “I'm not going to spend an hour cooking you a lunch you will just complain about. You boys can cook for yourselves.”\n   Charlie was angry. “But I'm in the middle of a really good chapter in my book,” he said.\n   “I hate cooking!” I said. “I'd rather do anything than cook!”\n   Mom sighed. “I know how you feel,” she said. Then she went back to scrubbing the floor.\n   Charlie and I went to the fridge. We stared inside. We didn't know how to make anything Mom usually cooked. We weren't supposed to use the stove. We still didn't have the good syrup. I frowned at Charlie.\n   We ended up at the kitchen table with a box of cereal.\n   When it was time for dinner, I slowly walked into the kitchen. “Mom?” I called. She was sitting in a chair knitting. Charlie came into the kitchen, too.\n   “Do we have to cook ourselves dinner?” I asked. Mom sighed.\n   “We're sorry we didn't like your pancakes yesterday,” Charlie said.\n   “We'll help you clean up tonight,” I said.\n   “We'll never complain again,” Charlie said. “Just please don't make us eat cereal for dinner!”\n   Mom laughed. “Well, I guess you've learned your lesson,” she said. “Are you still in the mood for spaghetti?”\""]}, {"unit": "Comprehension Skills", "topic": "Recounting and Main Events", "lesson": "Recount a story", "texts": ["Big Bend\nWritten by Juliana Sartor\n\nChapter 1: On the Road\nJenny climbed in the front seat as Aunt Cindy closed the trunk of the car. Jenny looked down at her tennis shoes and excitedly tapped them against the floor.\n“Ready to go?” Aunt Cindy asked as she got into the driver's seat.\n“You bet!” Jenny said. They were going camping at Big Bend Campground, where Jenny's dad and Aunt Cindy used to go when they were kids.\nJenny's dad had promised they would all go there together. But Jenny's dad was in the Army. A few months ago, he had to move to a new Army base. Jenny decided to live with Aunt Cindy until school was out so she didn't have to switch schools again. Jenny missed her dad, but Aunt Cindy was wonderful. She had decided to keep Jenny's dad's promise and take Jenny to Big Bend, even if her dad couldn't be there, too.\nThey drove for hours. They stopped at gas stations and got snacks for the road. They passed fields of corn and cows. They listened to funny radio stations and laughed together.\n\nChapter 2: Making Camp\nFinally, with the sun shining in their eyes, they pulled into Big Bend. A large river ran along the campground, surrounded by big green trees. There was a barn and a playground. There were fire pits at every campsite. They stopped by the office to get their site number, and then they drove down the gravel road to their spot.\n“This is the site we always stayed on,” Aunt Cindy said, smiling as they got out of the car. “Your dad and I always wanted to go play in the river, but Grandpa put us to work instead!”\nJenny laughed. “What kind of work do we have to do?” she asked.\n\"First, we need to pitch our tent,” Aunt Cindy said. They pulled the tent out of the back of the car. Jenny put the poles together, and Aunt Cindy picked a shady spot. Together, they set up the tent. They hammered the stakes into the soft earth.\n“Next,” Aunt Cindy said, brushing off her hands, “We need to start a fire. I'll go buy some firewood. Why don't you put the sleeping bags in the tent?”\nWhen Aunt Cindy returned, she showed Jenny how to set up the logs like a teepee to start a fire. She put crumbled dry leaves and twigs beneath the logs. “This is called kindling,” she explained. She lit it with a long match. Jenny watched as the logs slowly started to burn.\n“And now, dinner!” Aunt Cindy pulled a pack of hot dogs and buns from the cooler. They roasted the hot dogs on sticks over the fire.\n\nChapter 3: The Best Part About Camping\nThe sun set as they ate, and Jenny started to feel a little sad. “Aunt Cindy,” she said slowly, “I miss Dad. I really wish he could have come with us.”\nAunt Cindy put her arm around Jenny. “Me too, kiddo. It doesn't feel quite right without him.” She paused. “But you know what?”\n“What?”\n“I'm really thankful to be here with you,” Aunt Cindy said.\nJenny smiled. “Me, too.” She turned toward Aunt Cindy. “And I bet Dad is really jealous that we get to have all this fun together.”\nAunt Cindy laughed. “I know something that will make him really jealous.” She pulled a grocery bag out from behind the cooler. Inside were graham crackers, marshmallows, and chocolate bars.\n“S'mores!” Jenny said.\nAunt Cindy grinned. “The best part about camping!”", "Not-So-Imaginary Friends\nBy Juliana Sartor\n\nChapter 1: The Leprechaun\nNathan was sitting on the swings during recess. He looked around and watched a group of boys playing soccer. Nathan didn't really like any sports. Nathan wanted to play anything but sports. He wanted to play space explorers or mountain climbers or cowboys. He liked using his imagination. But he didn't really have anyone else to play with. All the other boys would laugh at him if he asked them to play make believe. From the swing where he sat, he wished he would find a new friend to play with.\nThen, out of the corner of his eye, he saw a small flash of silver. He turned around quickly and saw a tiny person disappear into the bushes.\n“A leprechaun!” he whispered excitedly. He stood up and cautiously approached the bush. He bent down and peered between its branches. There was a little path covered in tiny footprints!\n“Wow,” he whispered. He crawled into the bushes and squeezed his way through the trees to follow the path. He came to a clearing in the trees. He gasped—the trees all had little doors on them! But then, the recess bell rang. He hurried to get back to the playground to go inside. He would be back tomorrow.\nBut as he crawled out from the bushes, he heard a small laugh. He looked up to see a girl sitting on top of the jungle gym. She jumped down when she saw him looking at her and ran inside. He scowled. Who was she to watch and laugh at him?\n\nChapter 2: Clara\nThe next day, Nathan tried to be more careful. He didn't see the girl anywhere as he walked back to the clump of bushes. But just as he was about to squeeze through them, she appeared.\n“What's back there?” she whispered. She was very quiet. Nathan knew she was in the other third grade class, but he didn't know her name.\n“Nothing,” Nathan said suspiciously.\n“I'm Clara,” she whispered.\n“I'm... Nathan,” he said.\n“I saw you back here yesterday. I saw you go through the bushes and then come out. I see you playing alone sometimes. What were you playing yesterday?”\nNathan wasn't sure he liked Clara. “Why were you watching me?” he asked.\nShe shrugged and looked embarrassed. Then she looked back at the bushes. “Sometimes I pretend there are fairies in the woods,” she said. “Sometimes I pretend I find their homes and that they talk to me.” She kicked the dirt around her feet. “I know it's stupid, but I don't have a lot of friends to play with.”\n“Fairies?” Nathan asked. “What about leprechauns?”\nClara smiled. “Is that what you were looking for yesterday?”\nNathan paused. “Yes,” he finally said. “I pretended I saw one. So I went to look for him.”\nClara smiled wider. “I bet he is friends with my fairies. Why don't we go look for them together?”\nThen, Nathan also smiled. “If the leprechaun is friends with your fairies, I'd like to be your friend, too.”"]}, {"unit": "Comprehension Skills", "topic": "Recounting and Main Events", "lesson": "Use a sequence chart to recount a story in order", "texts": ["Another Try\nWritten by Ginger Henderson\n\n“This is too hard,” said Sam as he threw down his bat. “I just keep swinging and swinging, and I never hit it.” Sam had been trying all afternoon to hit the ball. So far, all he’d done was hurt his arm.\n“Don’t give up,” said Tommy, walking over. He leaned down and picked up the ball. “It took me a long time to get it right.”\n“Really?” asked Sam. “It looks so easy when you do it.”\n“Yeah, really. I’m older than you, remember? I’ve had a lot more time to practice.”\nSam laughed. How could he forget? He’d looked up to his big brother Tommy his whole life. Tommy was always better at everything.\n“Just give it a little time,” said Tommy. “You just need a little more practice.”\nSam rubbed his sore elbow. “My arm hurts. I don’t want to try any more today.”\n“Okay, fair enough,” said Tommy. “Let’s head home.”\nSam and Tommy walked back toward their house.\n“I don’t know why everything has to be so hard for me,” said Sam. He kicked a stone in the path and watched as it bounced down the road.\nTommy stopped. “Hmm,” he said.\n“What?” asked Sam.\n“I just had an idea,” said Tommy with a smile.\n“What?” asked Sam. “What’s your idea?”\n“You’ll see,” said Tommy. He winked at his little brother. “Come on.”\nTommy and Sam walked up the driveway to their garage.\n“Wait here,” said Tommy. He hurried into the garage. A few minutes later, he came out holding a soccer ball.\n“Maybe we’ve been practicing the wrong sport,” he said, grinning. “Try this.”\nHe rolled the ball toward Sam. Sam stopped the ball with the tip of his shoe and looked back at Tommy.\n“Go ahead,” said Tommy. “Give it a try.”\nSam pulled his foot back and kicked. Wham! The ball sailed toward Tommy. Tommy rushed toward it and missed. The ball rolled into the garage.\n“Come on, Sam,” said Tommy. “This is what you need to be working on.”\nSam smiled and followed Tommy back toward the park.", "The Last Branch\nWritten by Ginger Henderson\n\nChomp, chomp, chomp. Buddy the beaver chewed away at the thick branch. Cutting wood for his family’s dam was hard work!\nBuddy leaned back on his tail. He was ready to take a break. He’d been gnawing at this branch for what seemed like forever. But when he looked closely at the branch, it looked like he’d only begun.\nBuddy crossed his arms over his chest. He turned his back to the branch. “I’ll never get this cut,” he said with a huff. He pounded his flat tail against the ground. Slap!\nHis dad heard the sound. He stopped and looked at Buddy.\n“Sorry,” Buddy called.\n“Buddy,” said his dad as he walked closer. “What’s going on?”\n“Nothing, Dad,” said Buddy.\n“You know the rules,” said his dad, looking down at him. “Don’t you?”\n“Yes,” said Buddy with a sigh. “Only slap my tail if there’s danger.”\n“That’s right,” said his dad. “Now, want to tell me what’s going on?”\n“It’s just hard,” he said. “My teeth aren’t sharp enough yet. I’ll never get through this branch.”\nBuddy’s dad smiled.\n“I used to feel like that, too,” he said.\n“Really?” asked Buddy.\n“Yep,” said his dad. “Just keep at it. You’ll get through that branch. I just know it.”\n“Okay, Dad.”\nBuddy got back to work, steadily chewing away. Later, his dad carried the final log to the dam. He put it on top of the others.\nBut then, a small trickle of water burst through. His dad’s eyes widened. Without something to plug that hole, the entire dam could break.\nHis dad banged his tail against the ground—slap, slap, slap!\n“I’m coming, Dad,” called Buddy. In his teeth he carried his branch, loose at last! He slipped it over the hole and spread thick mud over it to hold it in place.\n“I knew you could do it,” said his dad with a smile. “And you saved the day.”"]}, {"unit": "Comprehension Skills", "topic": "Main Idea and Supporting Details", "lesson": "Determine main topics", "texts": []}, {"unit": "Comprehension Skills", "topic": "Main Idea and Supporting Details", "lesson": "Identify main ideas of paragraphs", "texts": ["Your Body's Building Plans\nWritten by Juliana Sartor\n\nIn order for your body to work and grow, it needs instructions. These instructions come from genes. Genes tell your cells what to do and when to do it. They determine everything from the color of your eyes to the beat of your heart. These are also know as genetic traits. Your genes play an important role in your body's development.\n\nOne reason genes play a big role in your development is because they have been with you forever. Your genes are passed down to you from your parents. Half of your genes come from your mom. The other half come from your dad.\n\nGenes also play a big role in making you who you are. This is because everyone's genes are unique. There are many possible combinations. If you have a brother or sister, they also got their genes from your parents. However, they received a different combination. That is why they look and act different from you!\n\nGenes also make sure you don't become someone else. This is because most genetic traits cannot be changed easily. Think about your hair color. This is a genetic trait. You might be able to dye your hair, but you can't force it to grow in a different color. This is because of your genes. They can only give one set of instructions.\n\nStudying genes can help us find cures to diseases. By studying your genetic traits, doctors can see how your body reacts to certain medicines. Knowing how someone's body reacts to medicines can allow doctors to cure them of diseases.\n\nThe study of genes, or genetics, is still a pretty new science. There are still many discoveries to be made. Would you like to study genetics?", "A Helper for a Healthy Mind\nWritten by Juliana Sartor\n\nYour mind does a lot of things for you. It helps you think in school. It helps you solve problems with your friends. It helps you feel love for your family. But your mind, including your thoughts and feelings, isn't always perfect. A therapist is a type of person who helps to keep your mind healthy. They are like a doctor for your mind! They might also be called a counselor or psychologist.\n\nOne way therapists help you stay healthy is by helping you work through your bad feelings. When you are feeling extra sad, nervous, angry, or uncomfortable for a long period of time, a therapist can help you figure out how to fix it.\n\nAnother way therapists can help is by making you feel comfortable expressing yourself. Sometimes you feel bad for a reason, like after the death of a loved one. Sometimes, you aren't sure why you feel bad. Either way, working with a therapist gives you a safe place to express your emotions for any reason.\n\nTherapists also try to make therapy sessions enjoyable. Depending on what you want, your counselor might just talk with you. They might give you mental exercises to practice. Some therapists even use games or pets to make therapy fun!\n\nSome people are afraid that going to therapy makes them seem \"crazy.\" Unfortunately, this fear means that a lot of people don't get help when they need it. There is nothing wrong with going to a therapist, even if you don't feel bad! After all, we go to the doctor for check-ups when nothing is wrong with us. A therapist is just another person who can make sure you stay as healthy as you can be."]}, {"unit": "Comprehension Skills", "topic": "Main Idea and Supporting Details", "lesson": "Identify supporting details within paragraphs", "texts": []}, {"unit": "Comprehension Skills", "topic": "Main Idea and Supporting Details", "lesson": "Explain how main ideas and details support the main topic", "texts": []}, {"unit": "Comprehension Skills", "topic": "Main Idea and Supporting Details", "lesson": "Recount informational text", "texts": ["Mystery Over Roswell\nWritten by Matty Layne\n\nNearly everyone has seen a plane or a hot air balloon fly overhead. Imagine, however, looking up at the sky and seeing something like never before—a large disc spinning with blinking lights. This was the scene near Roswell, New Mexico, on July 7th, 1947. The event remains a mystery to this day.\nOn July 7th, 1947, William Brazel found strange debris, or wreckage, on his ranch near Roswell. Several people told Brazel they had seen strange flying discs with blinking lights that week. He called the sheriff and reported the wreckage on his land. Government officials looked closely at the debris. They informed the public it was just the remains of a weather balloon that had crashed on Brazel's property. The mystery appeared to be solved.\nThen, during the 1940s and 50s, more Americans reported seeing these strange flying discs, from New Mexico all the way to New Jersey. Rumors were started that these discs were alien spacecrafts. The military even began using the term UFOs, which stands for unidentified flying objects, to describe the objects in these sightings.\nToday, those who believe in alien UFOs claim the government purposely hid the truth from the people in a conspiracy. A conspiracy is a plan to cover up something awful that has happened. Whether or not you choose to believe these ideas, one thing remains certain: we may never truly know what happened in Roswell in the summer of 1947.", "A View from the Clouds\nWritten by Elizabeth Baker with Laura Kachelmeyer\n\nHave you ever looked out your window and seen clouds all around you? You must have been up in an airplane! Airplanes make traveling and shipping very easy and fast, but we didn’t always have the ability to fly. It has taken humans a long time to understand how to create the complicated structure known as the airplane.\nHumans have dreamed of soaring through the clouds for centuries. Even people in Ancient Greece and China tried to invent ways for people to fly in the sky thousands of years ago. It wasn't until the 1900s that more modern airplanes like those we use today were invented. Many engineers and designers, like the Wright brothers, spent years testing different kinds of airplane engines, wings, and controls. They finally figured out how to make airplanes fly through the air!\nAirplanes can fly because they generate a force called lift. Lift begins to happen when the airplane’s engines roar into life. The strong engines push the airplane forward. The wheels on the plane help it move faster. As the plane's engines push the wings forward, air moves over and under them. The air moving under the wings is strong enough to hold the plane up. If you cut a slice across an airplane wing, you see it is curved over the top and flat on the bottom. This difference creates a stronger force of air underneath the wing, which pushes it upward.\nSince The early 1900s, engineers have designed planes to be used in wars, for shipping goods, and to help people travel long distances in less time. Today, over 100,000 planes take flight around the world. That means that there are thousands of people soaring through the clouds at this very moment!"]}, {"unit": "Comprehension Skills", "topic": "Comparing and Contrasting Main Ideas and Supporting Details", "lesson": "Determine the main idea", "texts": ["The Rain and Water Cycle\nWritten by Krista Garver\n\nWhere does rain come from? And where does all the water go? Let’s say that one day a huge downpour soaks everything. Water runs down the streets, and fields turn to mud. The next day, the sun shines, and everything is dry. What happened? Rain doesn’t just make puddles and cancel baseball games; it also helps move water around the Earth. The movement of water is called the water cycle.\nThe Earth has a set amount of water, so the water must be constantly recycled. The water you drink today may have been in George Washington’s glass 250 years ago. It might even have been lapped up by a thirsty dinosaur millions of years ago! The same water has been recycled on Earth for more than 3.5 billion years.\n\nThe water cycle has four main parts:\n\n1. The sun heats up water in rivers, lakes, and oceans. It turns the water into vapor, or steam. The steam rises into the air. This is called evaporation. Look for steam coming from the ground after it rains. That is evaporation.\n\n2. When the steam cools down, it turns back into liquid and forms clouds. This is called condensation. On a hot day, drops of water form on your water glass. That is condensation.\n\n3. When a lot of steam has condensed, the clouds get really heavy. Then the water falls back to Earth. This is called precipitation. Rain and snow are both forms of precipitation.\n\n4. The water soaks into the ground and flows into oceans and lakes. This is called collection. Then the sun comes out, and the cycle starts all over again.\n\nSo you see, rain plays a very important role on Earth. It feeds rivers, lakes, and oceans and provides us with fresh water to drink. Without rain, all of the water on Earth would evaporate into clouds!", "Squirrels and Chipmunks\nWritten by Elizabeth Baker\n\nSquirrels and chipmunks look sort of similar. They are furry rodents. They both have fur, tails, and ears that stick up.\nHow can you tell them apart? What are the differences between squirrels and chipmunks?\nTo start, they look a little different. Chipmunks have stripes on their heads. They also have stripes on their backs. Squirrels have big bushy tails. Chipmunks are also usually smaller than squirrels.\nChipmunks and squirrels both eat nuts and berries. However, they keep their food in different places. Chipmunks store their food in pouches. These pouches are inside their cheeks. Squirrels do not have pouches. They hide their food at their nests. They also bury nuts in the ground.\nChipmunks and squirrels also have different homes. Chipmunks live in the forest. They like to live in trees. Trees give chipmunks seeds and fruit to eat. Squirrels live in grassy places. Squirrels love to live in parks. Sometimes squirrels try to get people to give them food.\nEven though chipmunks and squirrels are very different, they do have one thing in common: they’re both pretty cute!"]}, {"unit": "Comprehension Skills", "topic": "Comparing and Contrasting Main Ideas and Supporting Details", "lesson": "Identify supporting details in paragraphs", "texts": ["Life in the Country\nWritten by Krista Garver\n\nDo you live in a city or out in the country? Chances are you live in a city. Only 20% of people in the United States live in the country. Two hundred years ago almost everyone lived in the country.\nPeople in the country live in different types of houses than people in the city. City people usually live in apartments or busy neighborhoods. Country people often live on farms or in houses that are far away from other houses. Sometimes they can't even see their neighbors. The communities are small and intimate.\nIn the country, people keep all kinds of animals. In cities, people have pets like cats, dogs, and fish. People in the country have cats and dogs too, but also horses, cows, pigs, chickens, and sheep. People in the country often spend a lot of time taking care of their animals.\nCities have a lot of stores and restaurants, but in the country, many people grow their own food. They grow fruits and nuts on trees and vegetables in gardens. Some people keep hens for eggs, and pigs, chickens, and cows for meat. Have you ever grown your own food?\nKids everywhere have chores, but in the country their chores are a little different. They might pick vegetables and feed the animals. They might have to help their parents chop wood for the fire. Would you like to do these chores?\nThe country has many more places to play than the city. In cities, kids typically play in backyards and parks. In the country, there are open areas for running and trees for climbing. There are lakes and ponds for swimming. There are empty dirt roads for
