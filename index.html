ed away. After going a short distance, he came upon a faint path which led across a meadow in the direction of a grove of pretty trees, and thinking this circle of evergreens must surround a house where perhaps he would be kindly received, he decided to follow the path. And by and by he came to the trees, which were set close together, and pushing aside some branches he found no house inside the circle, but instead a very beautiful pond of clear water.\nNow the Frogman, although he was so big and well educated and now aped the ways and customs of human beings, was still a frog. As he gazed at this solitary, deserted pond, his love for water returned to him with irresistible force. \"If I cannot get a breakfast, I may at least have a fine swim,\" said he, and pushing his way between the trees, he reached the bank. There he took off his fine clothing, laying his shiny purple hat and his gold-headed cane beside it. A moment later, he sprang with one leap into the water and dived to the very bottom of the pond.\nThe water was deliciously cool and grateful to his thick, rough skin, and the Frogman swam around the pond several times before he stopped to rest. Then he floated upon the surface and examined the pond. The bottom and sides were all lined with glossy tiles of a light pink color; just one place in the bottom where the water bubbled up from a hidden spring had been left free. On the banks, the green grass grew to the edge of the pink tiling. And now, as the Frogman examined the place, he found that on one side of the pool, just above the water line, had been set a golden plate on which some words were deeply engraved. He swam toward this plate, and on reaching it read the following inscription:\n\nThis is THE TRUTH POND\nWhoever bathes in this water must always\nafterward tell THE TRUTH.\n\nThis statement startled the Frogman. It even worried him, so that he leaped upon the bank and hurriedly began to dress himself. \"A great misfortune has befallen me,\" he told himself, \"for hereafter I cannot tell people I am wise, since it is not the truth. The truth is that my boasted wisdom is all a sham, assumed by me to deceive people and make them defer to me. In truth, no living creature can know much more than his fellows, for one may know one thing, and another know another thing, so that wisdom is evenly scattered throughout the world. But—ah me!—what a terrible fate will now be mine. Even Cayke the Cookie Cook will soon discover that my knowledge is no greater than her own, for having bathed in the enchanted water of the Truth Pond, I can no longer deceive her or tell a lie.\"\nMore humbled than he had been for many years, the Frogman went back to the grove where he had left Cayke and found the woman now awake and washing her face in a tiny brook. \"Where has Your Honor been?\" she asked.\n\"To a farmhouse to ask for something to eat,\" said he, \"but the woman refused me.\"\n\"How dreadful!\" she exclaimed. \"But never mind, there are other houses where the people will be glad to feed the Wisest Creature in all the World.\"\n\"Do you mean yourself?\" he asked.\n\"No, I mean you.\"\nThe Frogman felt strongly impelled to tell the truth, but struggled hard against it. His reason told him there was no use in letting Cayke know he was not wise, for then she would lose much respect for him, but each time he opened his mouth to speak, he realized he was about to tell the truth and shut it again as quickly as possible. He tried to talk about something else, but the words necessary to undeceive the woman would force themselves to his lips in spite of all his struggles. Finally, knowing that he must either remain dumb or let the truth prevail, he gave a low groan of despair and said, \"Cayke, I am NOT the Wisest Creature in all the World; I am not wise at all.\"\n\"Oh, you must be!\" she protested. \"You told me so yourself, only last evening.\"\n\"Then last evening I failed to tell you the truth,\" he admitted, looking very shamefaced for a frog. \"I am sorry I told you this lie, my good Cayke, but if you must know the truth, the whole truth and nothing but the truth, I am not really as wise as you are.\"\nThe Cookie Cook was greatly shocked to hear this, for it shattered one of her most pleasing illusions. She looked at the gorgeously dressed Frogman in amazement. \"What has caused you to change your mind so suddenly?\" she inquired.\n\"I have bathed in the Truth Pond,\" he said, \"and whoever bathes in that water is ever afterward obliged to tell the truth.\"\n\"You were foolish to do that,\" declared the woman.\n\"It is often very embarrassing to tell the truth. I'm glad I didn't bathe in that dreadful water!\"\nThe Frogman looked at his companion thoughtfully. \"Cayke,\" said he, \"I want you to go to the Truth Pond and take a bath in its water. For if we are to travel together and encounter unknown adventures, it would not be fair that I alone must always tell you the truth, while you could tell me whatever you pleased. If we both dip in the enchanted water, there will be no chance in the future of our deceiving one another.\"\n\"No,\" she asserted, shaking her head positively, \"I won't do it, Your Honor. For if I told you the truth, I'm sure you wouldn't like me. No Truth Pond for me. I'll be just as I am, an honest woman who can say what she wants to without hurting anyone's feelings.\"\nWith this decision the Frogman was forced to be content, although he was sorry the Cookie Cook would not listen to his advice."]}, {"unit": "Comprehension Skills", "topic": "Summaries", "lesson": "Differentiate between key ideas and supporting details", "texts": []}, {"unit": "Comprehension Skills", "topic": "Summaries", "lesson": "Write an objective summary", "texts": []}, {"unit": "Comprehension Skills", "topic": "Summaries", "lesson": "Identify internal and external conflicts", "texts": []}, {"unit": "Comprehension Skills", "topic": "Summaries", "lesson": "Differentiate between static/dynamic and fla let currentGrade = null;
let currentIdx   = null;

function parseText(raw) {
  const lines = raw.split('\n');
  let i = 0;
  let textLabel = '', title = '', subtitle = '', author = '';

  // Optional "Text N:" label (for compare-contrast lessons)
  if (lines[i] && /^Text \d+:?\s*$/i.test(lines[i].trim())) {
    textLabel = lines[i++].trim().replace(/:$/, '');
  }

  // Title
  while (i < lines.length && !lines[i].trim()) i++;
  if (i < lines.length) title = lines[i++];

  // Subtitle/series — a non-author line immediately before the author line or a blank line
  if (i < lines.length && lines[i].trim() && !/^(written by|by )\s/i.test(lines[i].trim())) {
    const next = lines[i + 1] || '';
    if (/^(written by|by )\s/i.test(next.trim()) || !next.trim()) {
      subtitle = lines[i++];
    }
  }

  // Author: handles "Written by", "Written By", "By "
  if (i < lines.length && /^(written by|by )\s/i.test(lines[i].trim())) {
    author = lines[i++];
  }

  // Combine subtitle into author display
  if (subtitle) author = subtitle + (author ? ' — ' + author : '');

  // Skip blank lines before body
  while (i < lines.length && !lines[i].trim()) i++;

  const body = lines.slice(i).join('\n').trim();
  return { textLabel, title, author, body };
}

function renderGrades() {
  const bar = document.getElementById('gradeBar');
  bar.innerHTML = '';
  const grades = Object.keys(DATA);
  grades.forEach(g => {
    const hasText = DATA[g].some(l => l.texts.length > 0);
    const btn = document.createElement('button');
    btn.className = 'grade-btn' + (g === currentGrade ? ' active' : '');
    btn.textContent = 'Grade ' + g;
    btn.disabled = !hasText;
    btn.onclick = () => selectGrade(g);
    bar.appendChild(btn);
  });
}

function selectGrade(g) {
  currentGrade = g;
  currentIdx   = null;
  // Choosing a grade means "show me this grade", so a live search is dropped
  // rather than silently ignored while the list keeps showing other grades.
  if (searchQuery.trim()) {
    searchQuery = '';
    const box = document.getElementById('searchInput');
    if (box) box.value = '';
    const clr = document.getElementById('searchClear');
    if (clr) clr.style.display = 'none';
  }
  renderGrades();
  renderList();
  document.getElementById('reader').innerHTML = `
    <div class="reader-empty">
      <svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="#f97316" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity=".4">
        <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
      </svg>
      <p>Pick a story from the list!</p>
    </div>`;
}

// Split a cell that holds more than one reading into separate readings.
//
// The marker is written inconsistently in the source sheet — "Text 1:",
// "Text1:", "Text1 :", "text 2;:", and "Text 2" with no colon at all — and the
// story title sometimes follows on the same line and sometimes on the next.
// Matching only "\n\nText 2:" missed 7 of the 25 dual-text cells, which then
// rendered as one run-on entry. The marker is stripped from the returned text
// so it never leaks into a story title.
// "tex[t]?" because one cell is typed "Tex 1:". The optional t costs nothing
// and "Texas 1" style false positives cannot match — a digit 1 or 2 must follow.
const TEXT_MARKER = /^[ \t]*tex[t]?[ \t]*([12])[ \t]*[;:.]*[ \t]*/gim;

function splitRawTexts(raw) {
  if (!raw) return [];
  const re = new RegExp(TEXT_MARKER.source, 'gim');
  const marks = [];
  let m;
  while ((m = re.exec(raw)) !== null) {
    const after = raw.slice(m.index + m[0].length);
    const nl = after.indexOf('\n');
    const restOfLine = nl < 0 ? after : after.slice(0, nl);
    // Accept the label alone on its line, or punctuated with the title beside
    // it. Anything else is prose that happens to begin "Text 2 …".
    if (restOfLine.trim() === '' || /[;:.]/.test(m[0])) {
      marks.push({ start: m.index, end: m.index + m[0].length, n: m[1] });
    }
    if (re.lastIndex === m.index) re.lastIndex++;
  }
  if (!marks.length) return raw.trim() ? [raw.trim()] : [];

  const preamble = raw.slice(0, marks[0].start).trim();
  const parts = [];
  // Text before the first marker is an instruction belonging to reading 1
  // ("Read the two stories.") — unless the first marker is Text 2, in which
  // case reading 1 simply was not labelled and the preamble *is* that reading.
  const preambleIsOwnReading = preamble && marks[0].n === '2';
  if (preambleIsOwnReading) parts.push(preamble);
  marks.forEach((mk, i) => {
    const end = i + 1 < marks.length ? marks[i + 1].start : raw.length;
    let seg = raw.slice(mk.end, end).trim();
    if (i === 0 && preamble && !preambleIsOwnReading) seg = preamble + '\n\n' + seg;
    if (seg) parts.push(seg);
  });
  return parts.length ? parts : [raw.trim()];
}

// Every reading a lesson holds, flattened: both problem-set cells, each of
// which may itself contain two readings.
function lessonReadings(l) {
  const out = [];
  (l.texts || []).forEach(raw => splitRawTexts(raw).forEach(t => out.push(t)));
  return out;
}

// Extract the main story title from a raw text entry
function getStoryTitle(raw) {
  if (!raw) return '';
  const lines = raw.split('\n');
  // Skip "Text N:" label line if present
  let i = /^Text \d+:?\s*$/i.test(lines[0] ? lines[0].trim() : '') ? 1 : 0;
  const titleLine = lines[i] || '';
  // Strip inline "Text N: " prefix
  return titleLine.replace(/^Text \d+:\s*/i, '').trim();
}

// Build flat item list for the sidebar — dual-text lessons become two entries
const AB_LETTERS = 'ABCDEFGH';

function buildItems(grade) {
  const items = [];
  let lessonNum = 0;
  DATA[grade].forEach((l, li) => {
    lessonNum++;
    const readings = lessonReadings(l);
    if (readings.length > 1) {
      // One sidebar entry per reading, so Text 2 sits beside Text 1 rather
      // than being buried inside the same entry.
      readings.forEach((raw, ri) => items.push({
        lesson: l, li, ri, raw,
        ab: 'Lesson ' + AB_LETTERS[ri],
        num: lessonNum + AB_LETTERS[ri],
        storyTitle: getStoryTitle(raw),
      }));
    } else {
      const raw = readings[0] || null;
      items.push({ lesson: l, li, ri: 0, raw, ab: null, num: lessonNum,
        storyTitle: raw ? getStoryTitle(raw) : '' });
    }
  });
  return items;
}

let currentItems = [];
let searchQuery = '';

// buildItems re-splits every cell, so cache per grade: the search runs over all
// six grades on each keystroke and there is no reason to redo that work.
const _itemCache = {};
function itemsFor(grade) {
  if (!_itemCache[grade]) _itemCache[grade] = buildItems(grade);
  return _itemCache[grade];
}

function esc(t) {
  return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// Search spans every grade, not just the one selected. Someone looking for a
// story usually remembers the story, not which grade it sits in — and half the
// readings live under a lesson name that never mentions them.
function searchResults(q) {
  const needle = q.trim().toLowerCase();
  if (!needle) return [];
  const out = [];
  Object.keys(DATA).forEach(g => {
    itemsFor(g).forEach(item => {
      if (!item.raw) return;               // nothing to read, nothing to find
      const hay = [item.storyTitle, item.lesson.lesson, item.lesson.topic, item.raw]
        .filter(Boolean).join(' \n ').toLowerCase();
      if (hay.includes(needle)) out.push({ ...item, grade: g });
    });
  });
  return out;
}

function onSearch(v) {
  searchQuery = v;
  document.getElementById('searchClear').style.display = v.trim() ? '' : 'none';
  currentIdx = null;
  renderList();
}

function clearSearch() {
  const box = document.getElementById('searchInput');
  box.value = '';
  onSearch('');
  box.focus();
}

function renderList() {
  const list = document.getElementById('lessonList');
  list.innerHTML = '';
  const searching = !!searchQuery.trim();
  if (!searching && !currentGrade) return;

  if (searching) {
    currentItems = searchResults(searchQuery);
    const n = currentItems.length;
    const count = document.createElement('div');
    count.className = 'search-count';
    count.textContent = n === 1 ? '1 story found' : `${n} stories found`;
    list.appendChild(count);
    if (!n) {
      const none = document.createElement('div');
      none.className = 'search-none';
      none.textContent = 'No story matches that. Try part of a title, an author, or a few words from the text.';
      list.appendChild(none);
      return;
    }
  } else {
    currentItems = itemsFor(currentGrade);
  }

  let lastTopic = null;
  currentItems.forEach((item, flatIdx) => {
    const l = item.lesson;
    // Topic headings only make sense in grade order; a result list is not
    // grouped that way, so each row carries its own grade badge instead.
    if (!searching && l.topic !== lastTopic) {
      const tl = document.createElement('div');
      tl.className = 'topic-label';
      tl.textContent = l.topic;
      list.appendChild(tl);
      lastTopic = l.topic;
    }
    const el = document.createElement('div');
    const hasText = !!item.raw;
    el.className = 'lesson-item' + (hasText ? '' : ' no-text') + (flatIdx === currentIdx ? ' active' : '') + (item.ab && !searching ? ' sub-item' : '');
    el.innerHTML = searching
      ? `<span class="lesson-num">${esc(item.num)}</span>
         <div style="min-width:0">
           <div class="lesson-title">${esc(item.storyTitle || l.lesson)}</div>
           <div class="lesson-skill">${esc(l.lesson)}</div>
           <span class="result-grade">Grade ${esc(item.grade)}</span>
         </div>`
      : `<span class="lesson-num">${item.num}</span>
         <div style="min-width:0">
           <div class="lesson-title">${l.lesson}</div>
           ${item.ab ? `<span class="ab-tag">${item.ab}</span>` : (!hasText ? '<div class="lesson-skill">coming soon</div>' : '')}
         </div>`;
    if (hasText) el.onclick = () => selectLesson(flatIdx);
    list.appendChild(el);
  });
}

function renderTextBlock(raw, blockLabel) {
  const { title, author, body } = parseText(raw);
  return `
    <div class="text-section">
      <div class="text-label">${blockLabel}</div>
      ${title ? `<div class="text-title">${title}</div>` : ''}
      ${author ? `<div class="text-author">${author}</div>` : ''}
      <div class="text-body">${body.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>`<p>${l.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</p>`).join('')}</div>
    </div>`;
}

function selectLesson(flatIdx) {
  currentIdx = flatIdx;
  renderList();
  const item = currentItems[flatIdx];
  const { lesson: l, ab, raw } = item;
  const reader = document.getElementById('reader');

  const hasText = !!raw;
  let html = `
    <div class="lesson-header">
      <div class="lesson-header-main">
        <div class="topic-tag">${l.topic}</div>
        <h2>${l.lesson}</h2>
        ${ab ? `<div class="ab-header-tag">${ab}</div>` : ''}
      </div>
      ${hasText ? `<button class="print-btn" onclick="printLesson()" title="Print this story">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 6 2 18 2 18 9"/>
          <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
          <rect x="6" y="14" width="12" height="8"/>
        </svg>Print</button>` : ''}
    </div>`;

  if (!hasText) {
    html += `<p class="no-text-msg">No reading text available for this lesson yet.</p>`;
  } else {
    html += renderTextBlock(raw, ab ? ab : 'Reading');
  }

  reader.innerHTML = html;
  reader.scrollTop = 0;
}

// Print the open story. The document title becomes the story name first, because
// that is what the browser stamps in the page header and offers as the filename
// when the teacher chooses "Save as PDF" — "Reading Lessons" for every story is
// useless once a few are saved in a folder.
function printLesson() {
  const item = currentItems[currentIdx];
  if (!item) { window.print(); return; }
  const original = document.title;
  const name = item.storyTitle || item.lesson.lesson || 'Reading';
  document.title = item.ab ? `${name} (${item.ab})` : name;
  const restore = () => { document.title = original; };
  window.addEventListener('afterprint', restore, { once: true });
  // Safari does not always fire afterprint; restore on a timer as well.
  setTimeout(restore, 8000);
  window.print();
}

function toggleSidebar() {
  const sidebar = document.getElementById('sidebar');
  const toggleBtn = document.getElementById('toggleBtn');
  const collapsed = sidebar.classList.toggle('collapsed');
  toggleBtn.innerHTML = collapsed ? '&#x2192;' : '&#x2190;';
  toggleBtn.title = collapsed ? 'Show lessons' : 'Hide lessons';
}

// Init — default to grade 3
renderGrades();
selectGrade('3');
</script>
</body>
</html>
