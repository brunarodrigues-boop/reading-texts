e warmth. The man wore motley. He had on a tight-fitting parti-striped dress, and his head was surmounted by the conical cap and bells. I was so pleased to see him, that I thought I should never have done wringing his hand.\nI said to him—\"My dear Fortunato, you are luckily met. How remarkably well you are looking to-day! But I have received a barrel of what passes for Amontillado, and I have my doubts.\"\n\"How?\" said he. \"Amontillado? A barrel? Impossible! And in the middle of the carnival!\"\n\"I have my doubts,\" I replied; \"and I was silly enough to pay the full Amontillado price without consulting you in the matter. You were not to be found, and I was fearful of losing a bargain.\"\n\"Amontillado!\"\n\"I have my doubts.\"\n\"Amontillado!\"\n\"And I must satisfy them.\"\n\"Amontillado!\"\n\"As you are engaged, I am on my way to Luchesi. If any one has a critical turn, it is he. He will tell me—\"\n\"Luchesi cannot tell Amontillado from Sherry.\"\n\"And yet some fools will have it that his taste is a match for your own.\"\n\"Come, let us go.\"\n\"Whither?\"\n\"To your vaults.\"\n\"My friend, no; I will not impose upon your good nature. I perceive you have an engagement. Luchesi—\"\n\"I have no engagement;—come.\"\n\"My friend, no. It is not the engagement, but the severe cold with which I perceive you are afflicted. The vaults are insufferably damp. They are encrusted with nitre.\"\n\"Let us go, nevertheless. The cold is merely nothing. Amontillado! You have been imposed upon. And as for Luchesi, he cannot distinguish Sherry from Amontillado.\"\nThus speaking, Fortunato possessed himself of my arm. Putting on a mask of black silk, and drawing a roquelaire* closely about my person, I suffered him to hurry me to my palazzo.\nThere were no attendants at home; they had absconded* to make merry in honour of the time. I had told them that I should not return until the morning, and had given them explicit orders not to stir from the house. These orders were sufficient, I well knew, to insure their immediate disappearance, one and all, as soon as my back was turned.\nI took from their sconces two torches, and giving one to Fortunato, bowed him through several suites of rooms to the archway that led into the vaults. I passed down a long and winding staircase, requesting him to be cautious as he followed. We came at length to the foot of the descent, and stood together on the damp ground of the catacombs* of the Montresors.\n\n*immolation: destruction\n*roquelaire: a cloak\n*absconded: to go away, usually with an effort at secrecy\n*catacombs: underground tombs and passageways", "Read the excerpt and answer the questions that follow.\n\nAdapted from\nPride and Prejudice\nBy Jane Austen\n\nMr. Bingley had soon made himself acquainted with all the principal people in the room; he was lively and unreserved, danced every dance, was angry that the ball closed so early, and talked of giving one himself at Netherfield. Such amiable qualities must speak for themselves. What a contrast between him and his friend! Mr. Darcy danced only once with Mrs. Hurst and once with Miss Bingley, declined being introduced to any other lady, and spent the rest of the evening in walking about the room, speaking occasionally to one of his own party. His character was decided. He was the proudest, most disagreeable man in the world, and everybody hoped that he would never come there again. Amongst the most violent against him was Mrs. Bennet, whose dislike of his general behaviour was sharpened into particular resentment by his having slighted one of her daughters.\nElizabeth Bennet had been obliged, by the scarcity of gentlemen, to sit down for two dances; and during part of that time, Mr. Darcy had been standing near enough for her to hear a conversation between him and Mr. Bingley, who came from the dance for a few minutes, to press his friend to join it.\n\"Come, Darcy,\" said he, \"I must have you dance. I hate to see you standing about by yourself in this stupid manner. You had much better dance.\"\n\"I certainly shall not. You know how I detest it, unless I am particularly acquainted with my partner. At such an assembly as this it would be insupportable. Your sisters are engaged, and there is not another woman in the room whom it would not be a punishment to me to stand up with.\"\n\"I would not be so fastidious as you are,\" cried Mr. Bingley, \"for a kingdom! Upon my honour, I never met with so many pleasant girls in my life as I have this evening; and there are several of them you see uncommonly pretty.\"\n\"You are dancing with the only handsome girl in the room,\" said Mr. Darcy, looking at the eldest Miss Bennet.\n\"Oh! She is the most beautiful creature I ever beheld! But there is one of her sisters sitting down just behind you, who is very pretty, and I dare say very agreeable. Do let me ask my partner to introduce you.\"\n\"Which do you mean?\" and turning round he looked for a moment at Elizabeth, till catching her eye, he withdrew his own and coldly said: \"She is tolerable, but not handsome enough to tempt me; I am in no humour at present to give consequence to young ladies who are slighted by other men. You had better return to your partner and enjoy her smiles, for you are wasting your time with me.\"\nMr. Bingley followed his advice. Mr. Darcy walked off; and Elizabeth remained with no very cordial feelings toward him. She told the story, however, with great spirit among her friends; for she had a lively, playful disposition, which delighted in anything ridiculous.\nThe evening altogether passed off pleasantly to the whole family. Mrs. Bennet had seen her eldest daughter much admired by the Netherfield party. Mr. Bingley had danced with her twice, and she had been distinguished by his sisters. Jane was as much gratified by this as her mother could be, though in a quieter way. Elizabeth felt Jane's pleasure. Mary had heard herself mentioned to Miss Bingley as the most accomplished girl in the neighbourhood; and Catherine and Lydia had been fortunate enough never to be without partners, which was all that they had yet learnt to care for at a ball. They returned, therefore, in good spirits to Longbourn, the village where they lived, and of which they were the principal inhabitants. They found Mr. Bennet still up. With a book he was regardless of time; and on the present occasion he had a good deal of curiosity as to the event of an evening which had raised such splendid expectations. He had rather hoped that his wife's views on the stranger would be disappointed; but he soon found out that he had a different story to hear.\n\"Oh! My dear Mr. Bennet,\" as she entered the room, \"we have had a most delightful evening, a most excellent ball. I wish you had been there. Jane was so admired, nothing could be like it. Everybody said how well she looked; and Mr. Bingley thought her quite beautiful, and danced with her twice! Only think of that, my dear; he actually danced with her twice! And she was the only creature in the room that he asked a second time. First of all, he asked Miss Lucas. I was so vexed to see him stand up with her! But, however, he did not admire her at all; indeed, nobody can, you know; and he seemed quite struck with Jane as she was going down the dance. So he inquired who she was, and got introduced, and asked her for the two next. Then the two third he danced with Miss King, and the two fourth with Maria Lucas, and the two fifth with Jane again, and the two sixth with Lizzy, and—\"\n\"If he had had any compassion for me,\" cried her husband impatiently, \"he would not have danced half so much! For God's sake, say no more of his partners. Oh that he had sprained his ankle in the first dance!\"\n\"Oh! My dear, I am quite delighted with him. He is so excessively handsome! And his sisters are charming women. I never in my life saw anything more elegant than their dresses. I dare say the lace upon Mrs. Hurst's gown—\"\nHere she was interrupted again. Mr. Bennet protested against any description of finery. She was therefore obliged to seek another branch of the subject, and related, with much bitterness of spirit and some exaggeration, the shocking rudeness of Mr. Darcy.\n\"But I can assure you,\" she added, \"that Lizzy does not lose much by not suiting his fancy; for he is a most disagreeable, horrid man, not at all worth pleasing. So high and so conceited that there was no enduring him! He walked here, and he walked there, fancying himself so very great! Not handsome enough to dance with! I wish you had been there, my dear, to have given him one of your set-downs. I quite detest the man.\""]}, {"unit": "Comprehension Skills", "topic": "Interactive Elements of Stories", "lesson": "Understand how the protagonist and antagonist drive action", "texts": ["Read the story and answer the questions that follow.\n\nAdapted from\nThe Gorgon's Head\nfrom A Wonder-Book for Girls and Boys\nBy Nathaniel Hawthorne\n\nPerseus was the son of Danaë, who was the daughter of a king. And when Perseus was a very little boy, some wicked people put his mother and himself into a chest, and set them afloat upon the sea. The chest sailed on, and neither sank nor was upset; until, when night was coming, it floated so near an island that it got entangled in a fisherman's nets and was drawn out high and dry upon the sand. The island was called Seriphus, and it was reigned over by King Polydectes, who happened to be the fisherman's brother.\nThe kind fisherman cared for Perseus and his mother. As Perseus grew into a strong and handsome youth, King Polydectes grew jealous of him, and plotted to have him killed. He devised a plan to send Perseus on a quest to kill the Gorgon Medusa and bring back her head. This was such a dangerous task that the king believed it would surely end Perseus’s life.\nNow, there were three Gorgons alive at that period; and they were the most strange and terrible monsters that had ever been since the world was made, or that have been seen in after days, or that are likely to be seen in all time to come. They were three sisters, and seem to have borne some distant resemblance to women, but were really a very frightful and mischievous species of dragon. Instead of locks of hair, they had each of them a hundred enormous snakes growing on their heads, all alive, twisting, wriggling, curling, and thrusting out their venomous tongues, with forked stings at the end! The teeth of the Gorgons were terribly long tusks; their hands were made of brass; and their bodies were all over scales, which, if not iron, were something as hard and impenetrable. They had wings, too, and exceedingly splendid ones; for every feather in them was pure, bright, glittering, burnished gold, and they looked very dazzlingly, no doubt, when the Gorgons were flying about in the sunshine.\nBut when people happened to catch a glimpse of their glittering brightness, aloft in the air, they seldom stopped to gaze, but ran and hid themselves as speedily as they could. For the worst thing about these abominable Gorgons was that if once a poor mortal fixed his eyes full upon one of their faces, he was certain, that very instant, to be changed from warm flesh and blood into cold and lifeless stone!\nThus it was a very dangerous adventure that the wicked King Polydectes had contrived for this innocent young man. Perseus himself, when he had thought over the matter, could not help seeing that he had very little chance of coming safely through it, and that he was far more likely to become a stone image than to bring back the head of Medusa with the snaky locks.\nHe therefore took his shield, girded on his sword, and crossed over from the island to the mainland, where he sat down in a solitary place, and hardly refrained from shedding tears.\nBut, while he was in this sorrowful mood, he heard a voice close beside him. \"Perseus,\" said the voice, \"why are you sad?\"\nHe lifted his head from his hands, in which he had hidden it, and, behold! there was a stranger in the solitary place. It was a brisk, intelligent, and remarkably shrewd-looking young man, with a cloak over his shoulders, an odd sort of cap on his head, a strangely twisted staff in his hand, and a short and very crooked sword hanging by his side. The stranger had such a cheerful, knowing, and helpful aspect, that Perseus could not help feeling his spirits grow livelier as he gazed at him. So Perseus wiped his eyes, and answered the stranger pretty briskly, putting on as brave a look as he could.\n\"I am not so very sad,\" said he, \"only thoughtful about an adventure that I have undertaken.\"\n\"Oho!\" answered the stranger. \"Well, tell me all about it, and possibly I may be of service to you. I have helped a good many young men through adventures that looked difficult enough beforehand. Perhaps you may have heard of me. I have more names than one; but the name of Quicksilver suits me as well as any other. Tell me what the trouble is, and we will talk the matter over, and see what can be done.\"\nThe stranger's words and manner put Perseus into quite a different mood from his former one. He let the stranger know, in few words, precisely what the case was, and how he was afraid of being turned into stone.\n\"And that would be a great pity,\" said Quicksilver, with his mischievous smile. \"You would make a very handsome marble statue, it is true, and it would be a considerable number of centuries before you crumbled away; but, on the whole, one would rather be a young man for a few years than a stone image for a great many. Now, before we go any farther on this quest, give way to pause and polish your tarnished shield until you can see your own handsome face gazing back at you.\"\nThis seemed to Perseus rather an odd beginning of the adventure; for he thought it of far more consequence that the shield should be strong enough to defend him from the Gorgon's brazen claws, than that it should be bright enough to show him the reflection of his face. However, he immediately set to work, and scrubbed the shield with so much diligence and good-will, Quicksilver looked at it with a smile. Then, taking off his own short and crooked sword, he girded it about Perseus, instead of the one which he had before worn.\n\"No sword but mine will answer your purpose,\" observed he; \"the blade has a most excellent temper, and will cut through iron and brass as easily as through the slenderest twig.\"\nThen, Quicksilver also bestowed a helmet with a dark tuft of waving plumes upon Perseus. And now there happened about as wonderful an incident as anything that I have yet told you. The instant before the helmet was put on, there stood Perseus, a beautiful young man, with golden ringlets and rosy cheeks, the crooked sword by his side, and the brightly polished shield upon his arm—a figure that seemed all made up of courage, sprightliness, and glorious light. But when the helmet had descended over his white brow, there was no longer any Perseus to be seen! Nothing but empty air! Even the helmet, that covered him with its invisibility, had vanished!\n\"Where are you, Perseus?\" asked Quicksilver.\n\"Why, here, to be sure!\" answered Perseus, very quietly, although his voice seemed to come out of the transparent atmosphere. \"Just where I was a moment ago. Don't you see me?\"\n\"No, indeed!\" answered his friend. \"You are hidden under the helmet. But, if I cannot see you, neither can the Gorgons. Follow me.\"\nPerseus and Quicksilver traveled by air to the island where the Gorgon Medusa lived with her sisters. Straight downward, two or three thousand feet below him, Perseus perceived a small island, with the sea breaking into white foam all around its rocky shore, except on one side, where there was a beach of snowy sand. Behold, there were the terrible Gorgons!\nThey lay fast asleep, soothed by the thunder of the sea, dreaming of tearing some poor mortal all to pieces. The snakes that served them instead of hair seemed likewise to be asleep; although, now and then, one would writhe, and lift its head, and thrust out its forked tongue and emit a drowsy hiss.\n\"Now,\" whispered Quicksilver, as he hovered by the side of Perseus, \"now is your time to do the deed! Be quick; for, if one of the Gorgons should awake, you are too late!\"\n\"Which shall I strike at?\" asked Perseus, drawing his sword and descending a little lower. \"They all three look alike.\"\n\"One of the Gorgons is stirring in her sleep, and is just about to turn over. That is Medusa. Do not look at her! The sight would turn you to stone! Look at the reflection of her face and figure in the bright mirror of your shield.\"\nPerseus now understood Quicksilver's motive for so earnestly exhorting him to polish his shield. In its surface he could safely look at the reflection of the Gorgon's face. And there it was—that terrible countenance—mirrored in the brightness of the shield, with the moonlight falling over it, and displaying all its horror. It was the fiercest and most horrible face that ever was seen or imagined, and yet with a strange, fearful, and savage kind of beauty in it. The eyes were closed, and the Gorgon was still in a deep slumber; but there was an unquiet expression disturbing her features, as if the monster was troubled with an ugly dream.\nThe snakes, too, seemed to feel Medusa's dream, and to be made more restless by it. They twined themselves into tumultuous knots, writhed fiercely, and uplifted a hundred hissing heads, without opening their eyes.\n\"Now, now!\" whispered Quicksilver, who was growing impatient. \"Make a dash at the monster!\"\nPerseus flew cautiously downward, still keeping his eyes on Medusa's face, as reflected in his shield. At last, when he found himself hovering over her within arm's length, Perseus uplifted his sword, while, at the same instant, each separate snake upon the Gorgon's head stretched threateningly upward, and Medusa unclosed her eyes. But she awoke too late. The sword was sharp; the stroke fell like a lightning-flash; and the head of the wicked Medusa tumbled from her body! As quick as thought, he snatched up the head, with the snakes still writhing upon it, and thrust it into a magic bag that Quicksilver had given to him.\nPerseus went straight to the palace, and was immediately ushered into the presence of the king. Polydectes was by no means rejoiced to see him; for he had felt almost certain, in his own evil mind, that the Gorgons would have torn the poor young man to pieces, and have eaten him up, out of the way. However, seeing him safely returned, he put the best face he could upon the matter and asked Perseus how he had succeeded.\n\"Have you performed your promise?\" inquired he. \"Have you brought me the head of Medusa with the snaky locks?\n\"Yes, please your Majesty,\" answered Perseus.\n\"Indeed! Pray let me see it,\" quoth King Polydectes. \"It must be a very curious spectacle, if all that travelers tell about it be true!\"\n\"Your Majesty is in the right,\" replied Perseus. \"It is really an object that will be pretty certain to fix the regards of all who look at it. And, if your Majesty think fit, I would suggest that a holiday be proclaimed, and that all your Majesty's subjects be summoned to behold this wonderful curiosity. Few of them, I imagine, have seen a Gorgon's head before, and perhaps never may again!\"\nOn a platform, within full view of the balcony, sat the mighty King Polydectes, amid his evil counselors, and with his flattering courtiers in a semicircle round about him.\n\"Show us the head! Show us the head!\" shouted the people; and there was a fierceness in their cry as if they would tear Perseus to pieces, unless he should satisfy them with what he had to show. \"Show us the head of Medusa with the snaky locks!\"\nA feeling of sorrow and pity came over the youthful Perseus. \"O King Polydectes,\" cried he, \"and ye many people, I am very loath to show you the Gorgon's head!\"\n\"Ah, the villain and coward!\" yelled the people, more fiercely than before. \"He is making game of us! He has no Gorgon's head! Show us the head, if you have it, or we will take your own head for a football!\"\nThe great King Polydectes himself waved his hand, and ordered him, with the stern, deep voice of authority, on his peril, to produce the head.\n\"Show me the Gorgon's head, or I will cut off your own!\"\nAnd Perseus sighed.\n\"Behold it, then!\" cried Perseus, in a voice like the blast of a trumpet.\nAnd, suddenly holding up the head, not an eyelid had time to wink before the wicked King Polydectes, his evil counselors, and all his fierce subjects were no longer anything but the mere images of a monarch and his people. At the first glimpse of the terrible head of Medusa, they whitened into marble! And Perseus thrust the head back into his bag, and went to tell his dear mother that she need no longer be afraid of the wicked King Polydectes.", "Read the story and answer the questions that follow.\n\nAdapted from\n\"To Build a Fire\"\nBy Jack London\n\nDay had broken cold and gray, exceedingly cold and gray, when the man turned aside from the main Yukon trail and climbed the high earth-bank. It was nine o'clock. There was no sun, nor hint of sun. The Yukon lay a mile wide and hidden under three feet of ice. On top of this ice were as many feet of snow. As far as his eye could see, it was unbroken white, save for a curved and twisted dark hair-line. This dark hair-line was the trail.\nBut all this—the mysterious, far-reaching hair-line trail, the absence of sun from the sky, the tremendous cold, and the strangeness and weirdness of it all—made no impression on the man. It was not because he was long used to it. He was a newcomer in the land and this was his first winter. The trouble with him was that he was without imagination. Fifty degrees below zero impressed him as being cold and uncomfortable, and that was all. It did not lead him to meditate upon man's frailty, able only to live within certain narrow limits of heat and cold; and from there on it did not lead him to consider man's place in the universe. Fifty degrees below zero was to him just precisely fifty degrees below zero.\nHe would be in to camp by six o'clock; a bit after dark, it was true, but the boys would be there, a fire would be going, and a hot supper would be ready.\nHe plunged in among the big spruce trees. He was glad he was traveling light. In fact, he carried nothing but his lunch wrapped in a handkerchief. He was surprised, however, at the cold. It certainly was cold, he concluded, as he rubbed his numb nose and cheek-bones with his mittened hand.\nAt the man's heels trotted a dog, a big native husky, the proper wolf-dog. The animal was depressed by the tremendous cold. It knew that it was no time for traveling. It experienced a vague but menacing apprehension that made it slink along at the man's heels, and that made it question eagerly every movement of the man as if expecting him to go into camp or to seek shelter somewhere and build a fire. The dog had learned fire, and it wanted fire.\nThe man held steadily on. He was not much given to thinking, and just then particularly he had nothing to think about save that at six o'clock he would be in camp with the boys. Once in a while the thought reiterated itself that it was very cold and that he had never experienced such cold. As he walked along he rubbed his cheekbones and nose with the back of his mittened hand. But rub as he would, the instant he stopped his cheekbones went numb, and the following instant the end of his nose went numb. He was sure to frost his cheeks; he knew that, but it didn't matter much, after all. What were frosted cheeks? A bit painful, that was all; they were never serious.\nEmpty as the man's mind was of thoughts, he was keenly observant, and always he sharply noted where he placed his feet. The creek he knew was frozen clear to the bottom, but he knew also that there were springs that bubbled out from the hillsides and ran along under the snow and on top the ice of the creek. They were traps. They hid pools of water under the snow that might be three inches deep, or three feet.\nTo get his feet wet in such a temperature meant trouble and danger. At the very least it meant delay, for he would be forced to stop and build a fire, and under its protection to bare his feet while he dried his socks and moccasins.\nThe man was pleased at the speed he was making. He unbuttoned his jacket and shirt and drew forth his lunch. The action consumed no more than a quarter of a minute, yet in that brief moment the numbness laid hold of the exposed fingers.\nHe pulled the mitten on hurriedly. He was a bit frightened. He stamped up and down until the stinging returned into the feet. That man from Sulphur Creek had spoken the truth when telling how cold it sometimes got in the country. And he had laughed at him at the time!\nWhen the man had finished his lunch, he pulled on his mittens, settled the ear-flaps of his cap firmly about his ears, and took the creek trail up the left fork. The dog was disappointed. This man did not know cold. But the dog knew, and it knew that it was not good to walk abroad in such fearful cold. It was the time to lie snug in a hole in the snow and wait for a curtain of cloud to be drawn across the face of outer space whence this cold came. But the man whistled, and the dog followed after.\nFor half an hour the man saw no signs of any springs. And then it happened. At a place where there were no signs, the man broke through. He wet himself halfway to the knees before he floundered out to the firm crust. He was angry, and cursed his luck aloud. This would delay him an hour, for he would have to build a fire.\nHe threw down several large pieces of wood on top of the snow as a foundation. The flame he got by touching a match to a small shred of birch-bark that he took from his pocket. Placing it on the foundation, he fed the young flame with wisps of dry grass and with the tiniest dry twigs.\nHe worked slowly and carefully, keenly aware of his danger. He knew there must be no failure. When it is seventy-five below zero, a man must not fail in his first attempt to build a fire—that is, if his feet are wet. Already all sensation had gone out of his feet.\nBut he was safe, for the fire was beginning to burn with strength. He was safe. The old-timer had been very serious in laying down the law that no man must travel alone in the Klondike after fifty below. Well, here he was; he had had the accident; he was alone; and he had saved himself. But it was surprising, the rapidity with which his cheeks and nose were freezing.\nBut before he could remove his moccasins, it happened. It was his own fault or, rather, his mistake. He should not have built the fire under the spruce tree. He should have built it in the open. High up in the tree, one bough capsized its load of snow. This fell on the boughs beneath, capsizing them. It grew like an avalanche, and it descended without warning upon the man and the fire, and the fire was blotted out!\nThe man was shocked. It was as though he had just heard his own sentence of death. Well, it was up to him to build the fire over again, and this second time there must be no failure. Even if he succeeded, he would most likely lose some toes.\nHe made a new foundation for a fire, this time in the open. Next, he gathered dry grasses and tiny twigs. He could not bring his fingers together to grasp them, but he was able to gather them by the handful. All the while the dog sat and watched him, for the fire was slow in coming.\nNext, the man brought out his bunch of sulphur matches. In his effort to separate one match from the others, the whole bunch fell in the snow. He tried to pick it out of the snow, but failed. The dead fingers could neither touch nor clutch. He drove the thought of his freezing feet, and nose, and cheeks, out of his mind, devoting his whole soul to the matches.\nHe bared both hands, removing the mittens with his teeth. After some manipulation he caught the whole bunch between the heels of his hands. He scratched the bunch along his leg. It flared into flame, seventy sulfur matches at once! He held the blazing bunch to the birch-bark. As he so held it, he became aware of sensation in his hand. His flesh was burning.\nAt last, when he could endure no more, he jerked his hands apart. The blazing matches fell sizzling into the snow, but the birch-bark was alight. He began laying dry grasses and the tiniest twigs on the flame. He could not pick and choose; small pieces of rotten wood and green moss clung to the twigs, and he bit them off as well as he could with his teeth. He cherished the flame carefully and awkwardly. It meant life, and it must not perish. A large piece of green moss fell squarely on the little fire. He tried to poke it out with his fingers, but his shivering frame made him poke too far, and he disrupted the nucleus of the little fire. He tried to poke it together again, but the twigs were hopelessly scattered. Each twig gushed a puff of smoke and went out. The fire-provider had failed.\nThe man sat up in the snow for a moment and struggled for calmness. Then he pulled on his mittens, by means of his teeth, and got upon his feet. The man looked down at his hands in order to locate them, and found them hanging on the ends of his arms. It struck him as curious that one should have to use his eyes in order to find out where his hands were.\nA certain fear of death, dull and oppressive, came to him. In a panic, he turned and ran up the creek-bed along the old, dim trail. The dog joined in behind and kept up with him. He ran blindly, without intention, in fear such as he had never known in his life. Maybe, if he ran on, his feet would thaw out; and, anyway, if he ran far enough, he would reach camp and the boys. Without doubt he would lose some fingers and toes and some of his face; but the boys would take care of him, and save the rest of him when he got there. And at the same time there was another thought in his mind that said he would never get to the camp and the boys; that it was too many miles away.\nIt struck him as curious that he could run at all on feet so frozen that he could not feel them when they struck the earth. Several times he stumbled, and finally he tottered, crumpled up, and fell. When he tried to rise, he failed. He must sit and rest, he decided. As he sat and regained his breath, he noted that he was feeling quite warm and comfortable. And yet, when he touched his nose or cheeks, there was no sensation.\nHe was losing in his battle with the frost. It was creeping into his body from all sides. The thought of it drove him on, but he ran no more than a hundred feet, when he staggered and pitched headlong. It was his last panic. He sat up and entertained in his mind the conception of meeting death with dignity. Well, he was bound to freeze anyway, and he might as well take it decently. With this new-found peace of mind came the first glimmerings of drowsiness. A good idea, he thought, to sleep off to death.\nHe pictured the boys finding his body next day. Suddenly he found himself with them, coming along the trail and looking for himself. It certainly was cold, was his thought. When he got back to the States he could tell the folks what real cold was. He drifted on from this to a vision of the old-timer on Sulphur Creek.\n\"You were right, old hoss; you were right,\" the man mumbled to the old-timer of Sulphur Creek.\nThen the man drowsed off into what seemed to him the most comfortable and satisfying sleep he had ever known. The dog sat facing him and waiting. There were no signs of a fire to be made, and, besides, never in the dog's experience had it known a man to sit like that in the snow and make no fire. Later, the dog crept close to the man and caught the scent of death. This made the animal bristle and back away. A little longer it delayed, howling under the stars that leaped and danced and shone brightly in the cold sky. Then it turned and trotted up the trail in the direction of the camp it knew, where were the other food-providers and fire-providers."]}, {"unit": "Comprehension Skills", "topic": "Interactive Elements of Stories", "lesson": "Analyze how characters affect plot", "texts": ["Read the passage and answer the questions that follow.\n\nAn Excerpt from\nThe Count of Monte Cristo\nBy Alexandre Dumas\n\nA note before reading: The Count of Monte Cristo tells the story of Edmond Dantes, an innocent man who is wrongly imprisoned. This portion of the plot occurs after Dantes has been in prison for over a year without learning what crime he has been charged with. A government prison inspector is making his rounds through the jail and meets Dantes. The opening dialogue is between the inspector and the governor of the prison.\n\n\"I do not know what reason government can assign for these useless visits; when you see one prisoner, you see all,—always the same thing,—ill fed and innocent. Are there any others?\"\n\"Yes; the dangerous and mad prisoners are in the dungeons.\"\n\"Let us visit them,\" said the inspector with an air of fatigue.\n\"Let us first send for two soldiers,\" said the governor. \"The prisoners sometimes, through mere uneasiness of life, and in order to be sentenced to death, commit acts of useless violence, and you might fall a victim.\"\n\"Take all needful precautions,\" replied the inspector.\nTwo soldiers were accordingly sent for, and the inspector descended a stairway, so foul, so humid, so dark, as to be loathsome to sight, smell, and respiration.\n\"Oh,\" cried the inspector, \"who can live here?\"\n\"A most dangerous conspirator, a man we are ordered to keep the most strict watch over, as he is daring and resolute.\"\n\"He is alone?\"\n\"Certainly.\"\n\"How long has he been there?\"\n\"Nearly a year.\"\n\"Was he placed here when he first arrived?\"\n\"No; not until he attempted to kill the turnkey, who took his food to him.\"\n\"To kill the turnkey?\"\n\"Yes, the very one who is showing us the way now. Is it not true, Antoine?\" asked the governor.\n\"True enough; he wanted to kill me!\" returned the turnkey.\n\"He must be mad,\" said the inspector.\n\"He is worse than that,—he is a devil!\" returned the turnkey.\n\"Shall I complain of him?\" demanded the inspector.\n\"Oh, no; it is useless. Besides, he is almost mad now, and in another year he will be quite so.\"\n\"So much the better for him,—he will suffer less,\" said the inspector. He was, as this remark shows, a man full of philanthropy, and in every way fit for his office. \"Let us visit this one first,\" added he.\n\"By all means,\" replied the governor, and he signed to the turnkey to open the door. At the sound of the key turning in the lock, and the creaking of the hinges, Dantes, who was crouched in a corner of the dungeon, whence he could see the ray of light that came through a narrow iron grating above, raised his head. Seeing a stranger, escorted by two turnkeys holding torches and accompanied by two soldiers, and to whom the governor spoke bareheaded, Dantes, who guessed the truth, and that the moment to address himself to the superior authorities was come, sprang forward with clasped hands.\nThe soldiers interposed their bayonets, for they thought that he was about to attack the inspector, and the latter recoiled two or three steps. Dantes saw that he was looked upon as dangerous. Then, infusing all the humility he possessed into his eyes and voice, he addressed the inspector, and sought to inspire him with pity.\nThe inspector listened attentively; then, turning to the governor, observed, \"He is afraid, and retreated before the bayonets—madmen are not afraid of anything.\" Then, turning to the prisoner, \"What is it you want?\" said he.\n\"I want to know what crime I have committed—to be tried; and if I am guilty, to be shot; if innocent, to be set at liberty.\"\n\"Are you well fed?\" said the inspector.\n\"I believe so; I don't know; it's of no consequence. What matters really, not only to me, but to officers of justice and the king, is that an innocent man should languish in prison, to die here, cursing his executioners.\"\n\"You are very humble to-day,\" remarked the governor; \"you are not so always; the other day, for instance, when you tried to kill the turnkey.\"\n\"It is true, sir, and I beg his pardon, for he his always been very good to me, but I was mad.\"\n\"And you are not so any longer?\"\n\"No; captivity has subdued me—I have been here so long.\"\n\"So long?—when were you arrested, then?\" asked the inspector.\n\"The 28th of February, 1815, at half-past two in the afternoon.\"\n\"Today is the 30th of July, 1816,—why it is but seventeen months.\"\n\"Only seventeen months,\" replied Dantes. \"Oh, you do not know what is seventeen months in prison!—seventeen ages rather, especially to a man who, like me, had arrived at the summit of his ambition—to a man, who, like me, was on the point of marrying a woman he adored, who saw an honorable career opened before him, and who loses all in an instant—who sees his prospects destroyed! Have pity on me, then, and ask for me, not intelligence, but a trial; not pardon, but a verdict—a trial, sir, I ask only for a trial; that, surely, cannot be denied to one who is accused!\"\n\"We shall see,\" said the inspector; then, turning to the governor, \"On my word, the poor devil touches me. You must show me the evidence against him.\"\n\"Certainly; but you will find terrible charges.\"\n\"Monsieur,\" continued Dantes, \"I know it is not in your power to release me; but you can plead for me—you can have me tried—and that is all I ask. Let me know my crime, and the reason why I was condemned. Uncertainty is worse than all.\"\n\"Go on with the lights,\" said the inspector.\n\"Monsieur,\" cried Dantes, \"I can tell by your voice you are touched with pity; tell me at least to hope.\"\n\"I cannot tell you that,\" replied the inspector; \"I can only promise to examine into your case.\"", "Read the passage and answer the questions that follow.\n\nAn Excerpt from\nJane Eyre\nBy Charlotte Brontë\n\nJohn had not much affection for his mother and sisters, and an antipathy to me. He bullied and punished me; not two or three times in the week, nor once or twice in the day, but continually: every nerve I had feared him, and every morsel of flesh in my bones shrank when he came near. There were moments when I was bewildered by the terror he inspired, because I had no appeal whatever against either his menaces or his inflictions; the servants did not like to offend their young master by taking my part against him, and Mrs. Reed was blind and deaf on the subject: she never saw him strike or heard him abuse me, though he did both now and then in her very presence, more frequently, however, behind her back.\nHabitually obedient to John, I came up to his chair: he spent some three minutes in thrusting out his tongue at me as far as he could without damaging the roots: I knew he would soon strike, and while dreading the blow, I mused on the disgusting and ugly appearance of him who would presently deal it. I wonder if he read that notion in my face; for, all at once, without speaking, he struck suddenly and strongly. I tottered, and on regaining my equilibrium retired back a step or two from his chair.\n“That is for your impudence in answering mama awhile since,” said he, “and for your sneaking way of getting behind curtains, and for the look you had in your eyes two minutes since, you rat!”\nAccustomed to John Reed’s abuse, I never had an idea of replying to it; my care was how to endure the blow which would certainly follow the insult.\n“What were you doing behind the curtain?” he asked.\n“I was reading.”\n“Show the book.”\nI returned to the window and fetched it thence.\n“You have no business to take our books; you are a dependent, mama says; you have no money; your father left you none; you ought to beg, and not to live here with gentlemen’s children like us, and eat the same meals we do, and wear clothes at our mama’s expense. Now, I’ll teach you to rummage my bookshelves: for they are mine; all the house belongs to me, or will do in a few years. Go and stand by the door, out of the way of the mirror and the windows.”\nI did so, not at first aware what was his intention; but when I saw him lift and poise the book and stand in act to hurl it, I instinctively started aside with a cry of alarm: not soon enough, however; the volume was flung, it hit me, and I fell, striking my head against the door and cutting it. The cut bled, the pain was sharp: my terror had passed its climax; other feelings succeeded.\n“Wicked and cruel boy!” I said. “You are like a murderer—you are like a slave-driver—you are like the Roman emperors!”\nI had read Goldsmith’s History of Rome, and had formed my opinion of Nero, Caligula, etc. Also I had drawn parallels in silence, which I never thought thus to have declared aloud."]}, {"unit": "Comprehension Skills", "topic": "Interactive Elements of Stories", "lesson": "Analyze how plot affects characters", "texts": ["Read the story and answer the questions that follow.\n\nAdapted from\nRip Van Winkle\nBy Washington Irving\n\nWhoever has made a voyage up the Hudson must remember the Kaatskill mountains. They are seen away to the west of the river, swelling up to a noble height. Every change of season, every change of weather, indeed, every hour of the day, produces some change in the magical hues and shapes of these mountains.\nAt the foot of these fairy mountains, the voyager may have descried the light smoke curling up from a village whose shingle-roofs gleam among the trees. It is a little village of great antiquity, having been founded by some of the Dutch colonists.\nIn that same village, and in one of these very houses, there lived many years since, while the country was yet a province of Great Britain, a simple good-natured fellow of the name of Rip Van Winkle. I have observed that he was a simple good-natured man; he was, moreover, a kind neighbor, and an obedient hen-pecked husband.\nCertain it is, that he was a great favorite among all the good wives of the village, who took his part in all family squabbles; and never failed, whenever they talked those matters over in their evening gossipings, to lay all the blame on Dame Van Winkle. The children of the village, too, would shout with joy whenever he approached. He assisted at their sports, made their playthings, taught them to fly kites and shoot marbles, and told them long stories. Whenever he went dodging about the village, he was surrounded by a troop of them, and not a dog would bark at him throughout the neighborhood.\nThe great error in Rip's composition was an insuperable aversion to all kinds of profitable labor. He would never refuse to assist a neighbor even in the roughest toil, and the women of the village, too, used to employ him to run their errands, and to do such little odd jobs as their less obliging husbands would not do for them. In a word, Rip was ready to attend to anybody's business but his own; but as to doing family duty, and keeping his farm in order, he found it impossible.\nIn fact, he declared it was of no use to work on his farm; it was the most pestilent little piece of ground in the whole country; everything about it went wrong, and would go wrong, in spite of him. His fences were continually falling to pieces; his cow would either go astray or get among the cabbages; weeds were sure to grow quicker in his fields than anywhere else; the rain always made a point of setting in just as he had some out-door work to do, so that his patrimonial estate had dwindled away under his management, acre by acre.\nHis children, too, were as ragged and wild as if they belonged to nobody. His son Rip promised to inherit the habits and old clothes of his father.\nRip Van Winkle, however, was one of those happy mortals, of foolish, well-oiled dispositions, who take the world easy, eat white bread or brown, whichever can be got with least thought or trouble, and would rather starve on a penny than work for a pound. If left to himself, he would have whistled life away in perfect contentment; but his wife kept continually dinning in his ears about the ruin he was bringing on his family. Morning, noon, and night, her tongue was incessantly going.\nRip's sole ally was his dog Wolf, who was as much hen-pecked as his master; for Dame Van Winkle regarded them as companions in idleness. The moment Wolf entered the house his crest fell, his tail drooped to the ground, or curled between his legs, he sneaked about, casting many a sidelong glance at Dame Van Winkle, and at the least flourish of a broom-stick or ladle, he would fly to the door, yelping.\nTimes grew worse and worse with Rip Van Winkle as years of matrimony rolled on. For a long while he used to console himself by frequenting a kind of perpetual club of the sages, philosophers, and other idle personages of the village; which held its sessions on a bench before a small inn. Here they used to sit in the shade through a long lazy summer's day, talking listlessly over village gossip, or telling endless sleepy stories about nothing.\nBu at last, Poor Rip was reduced almost to despair; and his only alternative, to escape from the labor of the farm and clamor of his wife, was to take gun in hand and stroll away into the woods. Here he would sometimes seat himself at the foot of a tree, and share the contents of his lunch with Wolf, with whom he sympathized as a fellow-sufferer in persecution. \"Poor Wolf,\" he would say, \"never mind, my lad, whilst I live thou shalt never want a friend to stand by thee!\" Wolf would wag his tail and look wistfully in his master's face.\nIn a long ramble of the kind on a fine autumnal day, Rip had unconsciously scrambled to one of the highest parts of the Kaatskill mountains. Panting and fatigued, he threw himself on a green knoll. He saw at a distance the lordly Hudson, far, far below him, moving on its silent but majestic course.\nFor some time Rip lay musing on this scene; evening was gradually advancing; the mountains began to throw their long blue shadows over the valleys; he saw that it would be dark long before he could reach the village, and he heaved a heavy sigh when he thought of encountering the terrors of Dame Van Winkle.\nAs he was about to descend, he heard a voice from a distance, hallooing, \"Rip Van Winkle! Rip Van Winkle!\" He looked round, but could see nothing. He thought his fancy must have deceived him, and turned again to descend, when he heard the same cry ring through the still evening air: \"Rip Van Winkle! Rip Van Winkle!\"—at the same time Wolf bristled up his back, and giving a low growl, skulked to his master's side, looking fearfully down into the glen. Rip now felt a vague apprehension stealing over him; he looked anxiously in the same direction, and perceived a strange figure slowly toiling up the rocks, and bending under the weight of something he carried on his back. He was surprised to see any human being in this lonely and unfrequented place, but supposing it to be someone of the neighborhood in need of his assistance, he hastened down to give it.\nOn nearer approach he was still more surprised at the singularity of the stranger's appearance. His dress was of the antique Dutch fashion, decorated with rows of buttons down the sides and bunches at the knees. He made signs for Rip to approach and assist him with the load. Though rather shy and distrustful of this new acquaintance, Rip complied, and they clambered up a narrow gully. As they ascended, Rip every now and then heard long rolling peals, like distant thunder, that seemed to issue out of a deep ravine toward which their rugged path conducted. Passing through the ravine, they came to a hollow surrounded by perpendicular cliffs that created an amphitheatre. During the whole time Rip and his companion had labored on in silence.\nOn entering the amphitheatre, new objects of wonder presented themselves. On a level spot in the centre was a company of odd-looking personages playing at nine-pins. They were dressed in a quaint outlandish fashion, of similar style with that of the guide's, and they all had beards, of various shapes and colors.\nWhat seemed particularly odd to Rip was, that though these folks were evidently amusing themselves, they maintained the gravest faces and the most mysterious silence that he had ever witnessed. Nothing interrupted the stillness of the scene but the noise of the balls, which, whenever they were rolled, echoed along the mountains like rumbling peals of thunder.\nAs Rip and his companion approached them, they suddenly stared at him with such fixed statue-like gazes that his heart turned within him, and his knees trembled. His companion now made signs to Rip to wait upon the company. He obeyed with fear; they ate and drank in profound silence, and then returned to their game.\nBy degrees Rip's awe and apprehension subsided. He even ventured, when no eye was fixed upon him, to taste the beverage in his companion's keg. One taste provoked another, and soon his eyes swam in his head, his head gradually declined, and he fell into a deep sleep.\nOn waking, he found himself on the green knoll whence he had first seen the old man of the glen. He rubbed his eyes—it was a bright sunny morning, and the birds were hopping and twittering among the bushes. \"Surely,\" thought Rip, \"I have not slept here all night.\" He recalled the occurrences before he fell asleep. \"Oh!\" thought Rip—\"what excuse shall I make to Dame Van Winkle!\"\nHe looked round for his gun, but in place of the clean well-oiled fowling-piece, he found an old firelock lying by him, the barrel encrusted with rust, the lock falling off, and the stock worm-eaten. He now suspected that the grave inhabitants of the mountain had put a trick upon him, and had robbed him of his gun. Wolf, too, had disappeared, but he might have strayed away after a squirrel or partridge. He whistled after him and shouted his name, but all in vain; the echoes repeated his whistle and shout, but no dog was to be seen.\nHe determined to revisit the scene of the last evening, and if he met with any of the party, to demand his dog and gun. As he rose to walk, he found himself stiff in the joints. \"These mountain beds do not agree with me,\" thought Rip. With some difficulty he got down into the glen: he found the gully up which he and his companion had ascended the preceding evening; but to his astonishment a mountain stream was now foaming down it. He, however, made shift to scramble up its sides, working his toilsome way through thickets, and was sometimes entangled by the wild grapevines that twisted their coils or tendrils from tree to tree, and spread a kind of net in his path.\nAt length he reached where the ravine had opened through the cliffs to the amphitheatre; but no traces of such opening remained. The rocks presented a high impenetrable wall. Here, then, poor Rip was brought to a stand. What was to be done? The morning was passing away, and Rip felt famished for want of his breakfast. He grieved to give up his dog and gun; he dreaded to meet his wife; but it would not do to starve among the mountains. He shook his head, shouldered the rusty firelock, and, with a heart full of trouble and anxiety, turned his steps homeward.\nAs he approached the village he met a number of people, but none whom he knew. Their dress, too, was of a different fashion from that to which he was accustomed. They all stared at him with equal marks of surprise, and whenever they cast their eyes upon him, invariably stroked their chins. The constant recurrence of this gesture induced Rip, involuntarily, to do the same, when, to his astonishment, he found his beard had grown a foot long!\nHe had now entered the skirts of the village. A troop of strange children ran at his heels, hooting after him, and pointing at his gray beard. The dogs, too, not one of which he recognized for an old acquaintance, barked at him as he passed. The very village was altered; it was larger and more populous. There were rows of houses which he had never seen before, and those which had been his familiar haunts had disappeared. Strange names were over the doors—strange faces at the windows—everything was strange. He began to doubt whether both he and the world around him were not bewitched. Surely this was his native village, which he had left but the day before!\nIt was with some difficulty that he found the way to his own house, which he approached with silent awe, expecting every moment to hear the shrill voice of Dame Van Winkle. He found the house gone to decay—the roof fallen in, the windows shattered, and the doors off the hinges. A half-starved dog that looked like Wolf was skulking about it. Rip called him by name, but the cur snarled, showed his teeth, and passed on. This was an unkind cut indeed—\"My very dog,\" sighed poor Rip, \"has forgotten me!\"\nHe entered the house, which, to tell the truth, Dame Van Winkle had always kept in neat order. It was empty, forlorn, and apparently abandoned. This desolateness overcame all his fears—he called loudly for his wife and children—the lonely chambers rang for a moment with his voice, and then all again was silence.\nHe now hurried forth, and hastened to his old resort, the village inn—but it too was gone. A large rickety wooden building stood in its place. Instead of the great tree that used to shelter the quiet little Dutch inn of yore, there now was reared a tall naked pole, and from it was fluttering a flag, on which was a singular assemblage of stars and stripes.\nThere was, as usual, a crowd of folk about the door, but none that Rip recollected. The very character of the people seemed changed. There was a busy, bustling tone about them, instead of the accustomed drowsy tranquility. He looked in vain for his old acquaintances. In place of these, a fellow with his pockets full of handbills was haranguing vehemently about rights of citizens—elections—members of congress—liberty—and other words, which were a perfect nonsense to the bewildered Van Winkle.\nThe appearance of Rip soon attracted the attention of the tavern politicians. They crowded round him, eying him from head to foot with great curiosity. The orator bustled up to him, and, drawing him partly aside, inquired \"on which side he voted?\" Rip stared in vacant stupidity. Rip was at a loss to comprehend the question; when a knowing, self-important old gentleman, in a sharp cocked hat, made his way through the crowd, planted himself before Van Winkle, and demanded in an austere tone, \"what brought him to the election with a gun on his shoulder, and a mob at his heels, and whether he meant to breed a riot in the village?\"\n\"Alas! gentlemen,\" cried Rip, somewhat dismayed, \"I am a poor quiet man, a native of the place, and a loyal subject of the king!\"\nHere a general shout burst from the by-standers—\"A tory! A tory! A spy! A refugee! Hustle him! Away with him!\" It was with great difficulty that the man in the cocked hat restored order; and demanded again of the unknown culprit, what he came there for, and whom he was seeking? The poor man humbly assured him that he meant no harm, but merely came there in search of some of his neighbors, who used to keep about the tavern.\n\"Well—who are they?—name them.\"\nRip bethought himself a moment, and inquired, \"Where's Nicholas Vedder?\"\nThere was a silence for a little while, when an old man replied, in a thin piping voice, \"Nicholas Vedder! Why, he is dead and gone these eighteen years! There was a wooden tombstone in the church-yard that used to tell all about him, but that's rotten and gone too.\"\n\"Where's Brom Dutcher?\"\n\"Oh, he went off to the army in the beginning of the war; some say he was killed at the storming of Stony Point. I don't know—he never came back again.\"\n\"Where's Van Bummel, the schoolmaster?\"\n\"He went off to the wars too, was a great militia general, and is now in congress.\"\nRip's heart died away at hearing of these sad changes in his home and friends, and finding himself thus alone in the world. Every answer puzzled him, too, by implying such enormous lapses of time, and of matters which he could not understand: war—congress—Stony Point;—he had no courage to ask after any more friends, but cried out in despair, \"Does nobody here know Rip Van Winkle?\"\n\"Oh, Rip Van Winkle!\" exclaimed two or three. \"Oh, to be sure! that's Rip Van Winkle yonder, leaning against the tree.\"\nRip looked, and beheld a precise replica of himself as he had looked when he went up the mountain; apparently as lazy, and certainly as ragged. The poor fellow was now completely confounded. He doubted his own identity. In the midst of his bewilderment, the man in the cocked hat demanded who he was, and what was his name?\n\"God knows,\" exclaimed he, at his wit's end; \"I'm not myself—I'm somebody else—that's me yonder—no—that's somebody else got into my shoes—I was myself last night, but I fell asleep on the mountain, and they've changed my gun, and everything's changed, and I can't tell what's my name, or who I am!\"\nThe bystanders began now to look at each other, nod, wink significantly, and tap their fingers against their foreheads. There was a whisper, also, about securing the gun, and keeping the old fellow from doing mischief. At this critical moment a young woman pressed through the throng to get a peep at the gray-bearded man. She had a chubby child in her arms, which, frightened at his looks, began to cry. \"Hush, Rip,\" cried she, \"hush, you little fool; the old man won't hurt you.\" The name of the child, the air of the mother, the tone of her voice, all awakened a train of recollections in his mind.\n\"What is your name, my good woman?\" asked he.\n\"Judith Gardenier.\"\n\"And your father's name?\"\n\"Ah, poor man, Rip Van Winkle was his name, but it's twenty years since he went away from home with his gun, and never has been heard of since—his dog came home without him. I was then but a little girl.\"\nRip had but one question more to ask; but he put it with a faltering voice:\n\"Where's your mother?\"\n\"Oh, she too died but a short time since; she broke a blood-vessel in a fit of rage at a New-England peddler.\"\nThere was a drop of comfort, at least, in this intelligence. The honest man could contain himself no longer. He caught his daughter and her child in his arms. \"I am your father!\" cried he—\"Young Rip Van Winkle once—old Rip Van Winkle now!—Does nobody know poor Rip Van Winkle?\"\nAll stood amazed, until an old woman, tottering out from among the crowd, put her hand to her brow, and peering under it in his face for a moment, exclaimed, \"Sure enough! it is Rip Van Winkle—it is himself! Welcome home, again, old neighbor—Why, where have you been these twenty long years?\"\nRip's story was soon told, for the whole twenty years had been to him but as one night. The neighbors stared when they heard it; some were seen to wink at each other, and put their tongues in their cheeks.\nIt was determined, however, to take the opinion of old Peter Vanderdonk, who was a descendant of the historian of that name, who wrote one of the earliest accounts of the province. Peter was the most ancient inhabitant of the village, and well versed in all the wonderful events and traditions of the neighborhood. He recollected Rip at once, and corroborated his story in the most satisfactory manner. He assured the company that it was a fact, handed down from his ancestor the historian, that the Kaatskill mountains had always been haunted by strange beings. That it was affirmed that the great Hendrick Hudson, the first discoverer of the river and country, kept a kind of vigil there every twenty years with his crew; being permitted in this way to keep a guardian eye upon the river. That his father had once seen them in their old Dutch dresses playing at nine-pins in a hollow of the mountain; and that he himself had heard, one summer afternoon, the sound of their balls, like distant peals of thunder.\nTo make a long story short, the company broke up, and returned to the more important concerns of the election. Rip's daughter took him home to live with her; she had a snug, well-furnished house, and a stout cheery farmer for a husband, whom Rip recollected as one of the urchins that used to climb upon his back. As to Rip's son and heir, who was the ditto of himself, seen leaning against the tree, he was employed to work on the farm; but evinced an hereditary disposition to attend to anything else but his business.\nRip now resumed his old walks and habits. Having nothing to do at home, and being arrived at that happy age when a man can be idle with impunity, he took his place once more on the bench at the inn door. It was some time before he could get into the regular track of gossip, or could be made to comprehend the strange events that had taken place during his sleep. How that there had been a revolutionary war, and that instead of being a subject of his Majesty George the Third, he was now a free citizen of the United States. Rip, in fact, was no politician, but he was pleased that he could go in and out whenever he wished, without dreading the tyranny of Dame Van Winkle.\nHe used to tell his story to every stranger that arrived at the hotel. At last, there was not a man, woman, or child in the neighborhood, but knew it by heart. Some always pretended to doubt the reality of it, and insisted that Rip had been out of his head. The old Dutch inhabitants, however, almost universally gave it full credit. Even to this day they never hear a thunderstorm of a summer afternoon about the Kaatskill, but they say Hendrick Hudson and his crew are at their game of nine-pins; and it is a common wish of all hen-pecked husbands in the neighborhood, when life hangs heavy on their hands, that they might have a quieting drink out of Rip Van Winkle's flagon.", "Read the excerpt and answer the questions that follow.\n\nAn excerpt from\nDracula's Guest\nBy Bram Stoker\n\nWith a light heart I turned down the side road through the deepening valley to which Johann had objected. There was not the slightest reason, that I could see, for his objection; and I daresay I tramped for a couple of hours without thinking of time or distance and certainly without seeing a person or a house. So far as the place was concerned, it was desolation itself. But I did not notice this particularly till, on turning a bend in the road, I came upon a scattered fringe of wood; then I recognized that I had been impressed unconsciously by the desolation of the region through which I had passed.\nI sat down to rest myself and began to look around. It struck me that it was considerably colder than it had been at the commencement of my walk—a sort of sighing sound seemed to be around me with, now and then, high overhead, a sort of muffled roar. Looking upwards I noticed that great thick clouds were drafting rapidly across the sky from north to south at a great height. There were signs of a coming storm in some lofty stratum of the air. I was a little chilly, and, thinking that it was the sitting still after the exercise of walking, I resumed my journey.\nThe ground I passed over was now much more picturesque. There were no striking objects that the eye might single out, but in all there was a charm of beauty. I took little heed of time, and it was only when the deepening twilight forced itself upon me that I began to think of how I should find my way home. The air was cold, and the drifting of clouds high overhead was more marked. They were accompanied by a sort of far away rushing sound, through which seemed to come at intervals that mysterious cry which the driver had said came from a wolf. For a while I hesitated. I had said I would see the deserted village, so on I went and presently came on a wide stretch of open country, shut in by hills all around. Their sides were covered with trees which spread down to the plain, dotting in clumps the gentler slopes and hollows which showed here and there. I followed with my eye the winding of the road and saw that it curved close to one of the densest of these clumps and was lost behind it.\nAs I looked there came a cold shiver in the air, and the snow began to fall. I thought of the miles and miles of bleak country I had passed, and then hurried on to seek shelter of the wood in front. Darker and darker grew the sky, and faster and heavier fell the snow, till the earth before and around me was a glistening white carpet the further edge of which was lost in misty vagueness. The road was here but crude, and when on the level its boundaries were not so marked as when it passed through the cuttings; and in a little while I found that I must have strayed from it, for I missed underfoot the hard surface, and my feet sank deeper in the grass and moss. Then the wind grew stronger and blew with ever increasing force, till I was fain to run before it. The air became icy-cold, and in spite of my exercise I began to suffer. The snow was now falling so thickly and whirling around me in such rapid eddies that I could hardly keep my eyes open. Every now and then the heavens were torn asunder by vivid lightning, and in the flashes I could see ahead of me a great mass of trees, chiefly yew and cypress all heavily coated with snow.\nI was soon amongst the shelter of the trees, and there in comparative silence I could hear the rush of the wind high overhead. Presently the blackness of the storm had become merged in the darkness of the night. By-and-by the storm seemed to be passing away, it now only came in fierce puffs or blasts. At such moments the weird sound of the wolf appeared to be echoed by many similar sounds around me.\nNow and again, through the black mass of drifting cloud, came a straggling ray of moonlight which lit up the expanse and showed me that I was at the edge of a dense mass of cypress and yew trees. As the snow had ceased to fall, I walked out from the shelter and began to investigate more closely. It appeared to me that, amongst so many old foundations as I had passed, there might be still standing a house in which, though in ruins, I could find some sort of shelter for a while. As I skirted the edge of the copse, I found that a low wall encircled it, and following this I presently found an opening. Here the cypresses formed an alley leading up to a square mass of some kind of building. Just as I caught sight of this, however, the drifting clouds obscured the moon, and I passed up the path in darkness. The wind must have grown colder, for I felt myself shiver as I walked; but there was hope of shelter, and I groped my way blindly on.\nI stopped, for there was a sudden stillness. The storm had passed; and, perhaps in sympathy with nature's silence, my heart seemed to cease to beat. But this was only momentarily; for suddenly the moonlight broke through the clouds showing me that I was in a graveyard and that the square object before me was a great massive tomb of marble, as white as the snow that lay on and all around it. With the moonlight there came a fierce sigh of the storm which appeared to resume its course with a long, low howl, as of many dogs or wolves. I was awed and shocked, and I felt the cold perceptibly grow upon me till it seemed to grip me by the heart. Then while the flood of moonlight still fell on the marble tomb, the storm gave further evidence of renewing, as though it were returning on its track. Impelled by some sort of fascination, I approached the tomb to see what it was and why such a thing stood alone in such a place. I walked around it and read, over the Doric door, in German—\n\nCOUNTESS DOLINGEN OF GRATZ\nIN STYRIA\nSOUGHT AND FOUND DEATH\n1801\n\n\nOn the top of the tomb, seemingly driven through the solid marble—for the structure was composed of a few vast blocks of stone—was a great iron spike or stake. On going to the back I saw, graven in great Russian letters:\n\n\"The dead travel fast\"\n\n\nThere was something so weird and uncanny about the whole thing that it gave me a turn and made me feel quite faint. I began to wish, for the first time, that I had taken Johann's advice. Here a thought struck me, which came under almost mysterious circumstances and with a terrible shock. This was Walpurgis Night!*\n\n* An annual holiday when witches and spirits are said to congregate"]}, {"unit": "Comprehension Skills", "topic": "Interactive Elements of Stories", "lesson": "Analyze setting as a shaping force", "texts": []}, {"unit": "Comprehension Skills", "topic": "Interactive Elements of Stories", "lesson": "Analyze how shifts in setting affect plot and character", "texts": []}, {"unit": "Comprehension Skills", "topic": "Interactive Elements of Stories", "lesson": "Analyze the effects of hypothetical plot and setting changes", "texts": ["Read the passage and answer the questions that follow.\n\nAn excerpt adapted from\nAround the World in 80 Days\nBy Jules Verne\n\nThe perusal of the Times absorbed Phileas Fogg until a quarter before four, whilst the Standard, his next task, occupied him till the dinner hour. Dinner passed as breakfast had done, and Mr. Fogg reappeared in the reading-room and sat down to the Pall Mall at twenty minutes before six. Half an hour later several members of the Reform came in and drew up to the fireplace, where a coal fire was steadily burning. They were Mr. Fogg's usual partners at whist: Andrew Stuart, an engineer; John Sullivan and Samuel Fallentin, bankers; Thomas Flanagan, a brewer; and Gauthier Ralph, one of the Directors of the Bank of England—all rich and highly respectable personages, even in a club which comprises the princes of English trade and finance.\n\"Well, Ralph,\" said Thomas Flanagan, \"what about that robbery?\"\n\"Oh,\" replied Stuart, \"the Bank will lose the money.\"\n\"On the contrary,\" broke in Ralph, \"I hope we may put our hands on the robber. Skilful detectives have been sent to all the principal ports of America and the Continent, and he'll be a clever fellow if he slips through their fingers.\"\n\"But have you got the robber's description?\" asked Stuart.\n\"In the first place, he is no robber at all,\" returned Ralph, positively.\n\"What! a fellow who makes off with fifty-five thousand pounds, no robber?\"\n\"No.\"\n\"Perhaps he's a manufacturer, then.\"\n\"The Daily Telegraph says that he is a gentleman.\"\nIt was Phileas Fogg, whose head now emerged from behind his newspapers, who made this remark. He bowed to his friends, and entered into the conversation. The affair which formed its subject, and which was town talk, had occurred three days before at the Bank of England. A package of banknotes, to the value of fifty-five thousand pounds, had been taken from the principal cashier's table, that functionary being at the moment engaged in registering the receipt of three shillings and sixpence. Of course, he could not have his eyes everywhere. Let it be observed that the Bank of England demonstrates a touching confidence in the honesty of the public. There are neither guards nor gratings to protect its treasures; gold, silver, banknotes are freely exposed, at the mercy of the first comer.\nAs soon as the robbery was discovered, picked detectives hastened off to Liverpool, Glasgow, Havre, Suez, Brindisi, New York, and other ports, inspired by the proffered reward of two thousand pounds, and five percent on the sum that might be recovered. Detectives were also charged with narrowly watching those who arrived at or left London by rail, and a judicial examination was at once entered upon. The papers and clubs were full of the affair, and everywhere people were discussing the probabilities of a successful pursuit.\nRalph would not concede that the work of the detectives was likely to be in vain, for he thought that the prize offered would greatly stimulate their zeal and activity. But Stuart was far from sharing this confidence; and, as they placed themselves at the whist table, they continued to argue the matter.\n\"I maintain,\" said Stuart, \"that the chances are in favour of the thief, who must be a shrewd fellow.\"\n\"Well, but where can he fly to?\" asked Ralph. \"No country is safe for him.\"\n\"Pshaw!\"\n\"Where could he go, then?\"\n\"Oh, I don't know that. The world is big enough.\"\n\"It was once,\" said Phileas Fogg, in a low tone. \"Cut, sir,\" he added, handing the cards to Thomas Flanagan.\nThe discussion fell during the rubber, after which Stuart took up its thread.\n\"What do you mean by 'once'? Has the world grown smaller?\"\n\"Certainly,\" returned Ralph. \"I agree with Mr. Fogg. The world has grown smaller, since a man can now go round it ten times more quickly than a hundred years ago. And that is why the search for this thief will be more likely to succeed.\"\n\"And also why the thief can get away more easily.\"\n\"Be so good as to play, Mr. Stuart,\" said Phileas Fogg.\nBut the incredulous Stuart was not convinced, and when the hand was finished, said eagerly: \"You have a strange way, Ralph, of proving that the world has grown smaller. So, because you can go round it in three months—\"\n\"In eighty days,\" interrupted Phileas Fogg.\n\"That is true, gentlemen,\" added John Sullivan. \"Only eighty days, now that the section between Rothal and Allahabad, on the Great Indian Peninsula Railway, has been opened. Here is the estimate made by the Daily Telegraph:\n\nFrom London to Suez via Mont Cenis and\nBrindisi, by rail and steamboats .............................. 7 days\nFrom Suez to Bombay, by steamer ............................ 13 \"\nFrom Bombay to Calcutta, by rail ................................ 3 \"\nFrom Calcutta to Hong Kong, by steamer .................... 13 \"\nFrom Hong Kong to Yokohama (Japan), by steamer ....... 6 \"\nFrom Yokohama to San Francisco, by steamer ............. 22 \"\nFrom San Francisco to New York, by rail ....................... 7 \"\nFrom New York to London, by steamer and rail .............. 9 \"\n-------\nTotal .................................................................. 80 days.\"\n\n\"Yes, in eighty days!\" exclaimed Stuart, \"But that doesn't take into account bad weather, contrary winds, shipwrecks, railway accidents, and so on.\"\n\"All included,\" returned Phileas Fogg, continuing to play despite the discussion.\n\"But suppose the locals pull up the rails,\" replied Stuart; \"suppose they stop the trains, pillage the luggage-vans, and rob the passengers!\"\n\"All included,\" calmly retorted Fogg; adding, as he threw down the cards, \"Two trumps.\"\nStuart, whose turn it was to deal, gathered them up, and went on: \"You are right, theoretically, Mr. Fogg, but practically—\"\n\"Practically also, Mr. Stuart.\"\n\"I'd like to see you do it in eighty days.\"\n\"It depends on you. Shall we go?\"\n\"Heaven preserve me! But I would wager four thousand pounds that such a journey, made under these conditions, is impossible.\"\n\"Quite possible, on the contrary,\" returned Mr. Fogg.\n\"Well, make it, then!\"\n\"The journey round the world in eighty days?\"\n\"Yes.\"\n\"I should like nothing better.\"\n\"When?\"\n\"At once. Only I warn you that I shall do it at your expense.\"\n\"It's absurd!\" cried Stuart, who was beginning to be annoyed at the persistency of his friend. \"Come, let's go on with the game.\"\nStuart took up the pack with a feverish hand; then suddenly put them down again.\n\"Well, Mr. Fogg,\" said he, \"it shall be so: I will wager the four thousand on it.\"\n\"Calm yourself, my dear Stuart,\" said Fallentin. \"It's only a joke.\"\n\"When I say I'll wager,\" returned Stuart, \"I mean it.\"\n\"All right,\" said Mr. Fogg; and, turning to the others, he continued: \"I have a deposit of twenty thousand at Baring's which I will willingly risk upon it.\"\n\"Twenty thousand pounds!\" cried Sullivan. \"Twenty thousand pounds, which you would lose by a single accidental delay!\"\n\"The unforeseen does not exist,\" quietly replied Phileas Fogg.\n\"But, Mr. Fogg, eighty days are only the estimate of the least possible time in which the journey can be made.\"\n\"A well-used minimum suffices for everything.\"\n\"But, in order not to exceed it, you must jump mathematically from the trains upon the steamers, and from the steamers upon the trains again.\"\n\"I will jump—mathematically.\"\n\"You are joking.\"\n\"A true Englishman doesn't joke when he is talking about so serious a thing as a wager,\" replied Phileas Fogg, solemnly. \"I will bet twenty thousand pounds against anyone who wishes that I will make the tour of the world in eighty days or less; in nineteen hundred and twenty hours, or a hundred and fifteen thousand two hundred minutes. Do you accept?\"\n\"We accept,\" replied Messrs. Stuart, Fallentin, Sullivan, Flanagan, and Ralph, after consulting each other.\n\"Good,\" said Mr. Fogg. \"The train leaves for Dover at a quarter before nine. I will take it.\"\n\"This very evening?\" asked Stuart.\n\"This very evening,\" returned Phileas Fogg. He took out and consulted a pocket almanac, and added, \"As today is Wednesday, the 2nd of October, I shall be due in London in this very room of the Reform Club, on Saturday, the 21st of December, at a quarter before nine p.m.; or else the twenty thousand pounds, now deposited in my name at Baring's, will belong to you, in fact and in right, gentlemen. Here is a cheque for the amount.\"\nThe clock struck seven, and the party offered to suspend the game so that Mr. Fogg might make his preparations for departure.\n\"I am quite ready now,\" was his tranquil response. \"Diamonds are trumps: be so good as to play, gentlemen.\"", "Read the passage and answer the questions that follow.\n\nAn excerpt adapted from\nThe Merry Adventures of Robin Hood\nBy Howard Pyle\n\nIn merry England in the time of old, when good King Henry the Second ruled the land, there lived within the green glades of Sherwood Forest, near Nottingham Town, a famous outlaw whose name was Robin Hood. No archer ever lived that could speed a gray goose shaft with such skill and cunning as his, nor were there ever such men as the sevenscore merry men that roamed with him through the greenwood shades. Right merrily they dwelled within the depths of Sherwood Forest, suffering neither care nor want, but passing the time in merry games of archery, living upon venison from the King's deer.\nNot only Robin himself but all the band were outlaws and dwelled apart from other men, yet they were beloved by the country people round about, for no one ever came to jolly Robin for help in time of need and went away again with an empty fist.\nAnd now I will tell how it came about that Robin Hood fell afoul of the law.\nWhen Robin was a bold hearted youth of eighteen, the Sheriff of Nottingham proclaimed a shooting match and offered a prize to whosoever should shoot the best arrow in Nottinghamshire. \"Now,\" said Robin, \"will I go too, for I would like to impress the bright eyes of my lass and win the King's prize.\" So up he got and took his good stout bow and a score or more of arrows, and started off from Locksley Town through Sherwood Forest to Nottingham.\nIt was at the dawn of day in the merry Maytime, when apple buds blossom and sweet birds sing, and cheerfully Robin whistled as he trudged along, thinking of Maid Marian and her bright eyes, for at such times a youth's thoughts often turn pleasantly upon the lass that he loves the best.\nAs thus he walked along with a brisk step and a merry whistle, he came suddenly upon some foresters seated beneath a great oak tree. Fifteen there were in all, making themselves merry with feasting and drinking. Then one of them, with his mouth full, call
