een lying awake ever since the first slight noise, when he had turned in the bed.\nHis fears had been ever since growing upon him. He had been trying to fancy them causeless, but could not. He had been saying to himself, \"It is nothing but the wind in the chimney—it is only a mouse crossing the floor,\" or \"It is merely a cricket which has made a single chirp.\" Yes, he had been trying to comfort himself with these suppositions, but he had found all in vain. All in vain, because Death, in approaching him had stalked with his black shadow before him, and enveloped the victim. And it was the mournful influence of the unperceived shadow that caused him to feel—although he neither saw nor heard—to feel the presence of my head within the room.\nWhen I had waited a long time, very patiently, without hearing him lie down, I resolved to open a little—a very, very little crevice in the lantern. So I opened it—you cannot imagine how stealthily, stealthily—until, at length a simple dim ray, like the thread of the spider, shot from out the crevice and fell full upon the vulture eye.\nIt was open—wide, wide open—and I grew furious as I gazed upon it. I saw it with perfect distinctness—all a dull blue, with a hideous veil over it that chilled the very marrow in my bones, but I could see nothing else of the old man's face or person, for I had directed the ray as if by instinct, precisely upon the terrible spot.\nAnd have I not told you that what you mistake for madness is but over-acuteness of the sense? Now, I say, there came to my ears a low, dull, quick sound, such as a watch makes when enveloped in cotton. I knew that sound well, too. It was the beating of the old man's heart. It increased my fury, as the beating of a drum stimulates the soldier into courage.\nBut even yet I refrained and kept still. I scarcely breathed. I held the lantern motionless. I tried how steadily I could maintain the ray upon the eye. Meantime the hellish pulsation of the heart increased. It grew quicker and quicker, and louder and louder every instant. The old man's terror must have been extreme! It grew louder, I say, louder every moment! Do you mark me well I have told you that I am nervous, so I am. And now at the dead hour of the night, amid the dreadful silence of that old house, so strange a noise as this excited me to uncontrollable terror. Yet, for some minutes longer I refrained and stood still.\nBut the beating grew louder, louder! I thought the heart must burst. And now a new anxiety seized me—the sound would be heard by a neighbor! The old man's hour had come! With a loud yell, I threw open the lantern and leaped into the room. He shrieked once—once only. In an instant I dragged him to the floor, and pulled the heavy bed over him. I then smiled gaily, to find the deed so far done.\nBut, for many minutes, the heart beat on with a muffled sound. This, however, did not vex me; it would not be heard through the wall. At length it ceased. The old man was dead. I removed the bed and examined the corpse. Yes, he was stone, stone dead. I placed my hand upon the heart and held it there many minutes. There was no pulsation. He was stone dead. His eye would trouble me no more.\nIf still you think me mad, you will think so no longer when I describe the wise precautions I took for the concealment of the body. The night waned, and I worked hastily, but in silence.\nI took up three planks from the flooring of the chamber, and deposited the body between the scantlings. I then replaced the boards so cleverly, so cunningly, that no human eye—not even his—could have detected any thing wrong. There was nothing to wash out—no stain of any kind—no blood-spot whatever. I had been too wary for that.\nWhen I had made an end of these labors, it was four o'clock—still dark as midnight. As the bell sounded the hour, there came a knocking at the street door. I went down to open it with a light heart,—for what had I now to fear? There entered three men, who introduced themselves, with perfect suavity, as officers of the police. A shriek had been heard by a neighbor during the night, suspicion of foul play had been aroused, information had been lodged at the police office, and they (the officers) had been deputed to search the premises.\nI smiled,—for what had I to fear? I bade the gentlemen welcome. The shriek, I said, was my own in a dream. The old man, I mentioned, was absent in the country. I took my visitors all over the house. I bade them search—search well. I led them, at length, to his chamber. I showed them his treasures, secure, undisturbed. In the enthusiasm of my confidence, I brought chairs into the room, and desired them here to rest from their fatigues, while I myself, in the wild audacity of my perfect triumph, placed my own seat upon the very spot beneath which reposed the corpse of the victim.\nThe officers were satisfied. My manner had convinced them. I was singularly at ease. They sat, and while I answered cheerily, they chatted of familiar things. But, ere long, I felt myself getting pale and wished them gone. My head ached, and I fancied a ringing in my ears, but still they sat and still chatted. The ringing became more distinct. It continued and became more distinct. I talked more freely to get rid of the feeling, but it continued and gained definiteness—until, at length, I found that the noise was not within my ears.\nNo doubt I now grew very pale, but I talked more fluently, and with a heightened voice. Yet the sound increased—and what could I do? It was a low, dull, quick sound—much such a sound as a watch makes when enveloped in cotton. I gasped for breath—and yet the officers heard it not. I talked more quickly, more vehemently, but the noise steadily increased.\nI arose and argued about trifles, in a high key and with violent gesticulations, but the noise steadily increased. Why would they not be gone? I paced the floor to and fro with heavy strides, as if excited to fury by the observations of the men, but the noise steadily increased. Oh God! What could I do? I foamed, I raved, I swore! I swung the chair upon which I had been sitting, and grated it upon the boards, but the noise arose over all and continually increased.\nIt grew louder—louder—louder! And still the men chatted pleasantly, and smiled. Was it possible they heard not? Almighty God!—no, no! They heard! They suspected! They knew! They were making a mockery of my horror! This I thought, and this I think. But anything was better than this agony! Anything was more tolerable than this derision! I could bear those hypocritical smiles no longer! I felt that I must scream or die! And now—again!—hark! louder! louder! louder! louder!\n\"Villains!\" I shrieked, \"dissemble no more! I admit the deed!—tear up the planks! Here, here!—It is the beating of his hideous heart!\""]}, {"unit": "Comprehension Skills", "topic": "Citing Textual Evidence", "lesson": "Determine the strongest support for a claim", "texts": ["Read the following passage, which continues the story from the lesson.\n\nDon't Get Technatal\nBy Ray Bradbury\n\n\"What can you mean?\" Bella asked, tilting her head back and thinking. \"Why can't you write? There are just oodles of things I can think of that are readable.\"\nSomething like a tear rolled down Samuel's cheek. \"No more gangsters, no more bank robberies, no more holdups, no more good, old-fashioned burglaries, no more vice gangs!\" His voice grew lachrymose* as he proceeded down an infinite line of 'no mores'. \"No more sadness,\" he almost sobbed. \"Everybody's happy, contented. No more strife and hard work. Oh, for the days when a gangland massacre was headline scoop for me!\"\n\"Tush!\" sniffed Bella. \"Have you been drinking again, Samuel?\"\nHe hiccoughed gently.\n\"I thought so,\" she said.\n\"I had to do something,\" he declared. \"I'm going nuts for want of a plot.\"\nBella Stern laid her knitting aside and walked to the balcony, then looked meditatively down into the yawning canyon of the New York street fifty stories below. She turned back to Sam with a reminiscent smile.\n\"Why not write a love story?\"\n\"WHAT!\" Stern shot out of his chair like a hooked eel.\n\"Why, yes,\" she concluded. \"A nice love story would be very enjoyable.\"\n\"LOVE!\" Stern's voice was thick with sarcasm. \"Why, we don't even have decent love these days. A man can't marry a woman for her money, and vice-versa. Everyone under Technocracy gets the same amount of credit. No more Reno, no more alimony, no more breach of promise, or law suits! Everything is cut and dried. The days of society weddings and coming out parties are gone—cause everyone is equal. I can't write political criticisms about graft in the government, about slums and terrible living conditions, about poor starving mothers and their babies. Everything is okay—okay—okay—\" his voice sobbed off into silence.\n\"Which should make you very happy,\" countered his wife.\n\"Which makes me very sick,\" growled Samuel Stern. \"Look, Bell, all my life I wanted to be a writer. Okay. I'm writing for the pulp magazines for a couple years. Right? Okay. Then I'm writing sea stories, gangsters, political views, first class-bump-offs. I'm happy.... I'm in my element. Then—bingo!—in comes Technocracy, makes everyone happy—bump! out goes me! I just can't stand writing the stuff the people read today. Everything is science and education.\" He ruffled his thick black hair with his fingers and glared.\n\"You should be joyful that the population is at work doing what they want to do,\" Bella beamed.\nSam continued muttering to himself. \"They took all the magazines off the market first thing, all of the gangster, murder and detective publications. They been educating the children and making model citizens out of them.\"\n\"Which is as it should be,\" finished Bella.\n\"Do you realize,\" he blazed, whipping his finger at her, \"that for two years there hasn't been more than a dozen murders in the city? Not one suicide or gang war—or—\"\n\"Heavens!\" sighed Bella. \"Don't be prehistoric, Sam. There hasn't been anything really criminal for twenty years now. This is 1975 you know.\" She came over and patted him gently on the shoulder. \"Why don't you write something science-fictional?\"\n\"I don't like science,\" he spat.\n\"Then your only alternative is love,\" she declared firmly.\nHe formed the despicable word with his lips, then: \"No, I want something new and different.\" He got up and strode to the window. In the penthouse below he saw half a dozen robots moving about speedily, working. His face lit up suddenly, like that of a tiger spying his prey. \"Jumping Jigwheels!\" he cried. \"Why didn't I think of it before! Robots! I'll write a love story about two robots.\"\nBella squelched him. \"Be sensible,\" she said.\n\"It might happen someday,\" he argued. \"Just think. Love oiled, welded, built of metal, wired for sound!\" He laughed triumphantly, but it was a low laugh, a strange little sound. Bella expected him to beat his chest next. \"Robots fall in love at first sight,\" he announced, \"and blow an audio tube!\"\nBella smiled tolerantly. \"You're such a child, Sam, I sometimes wonder why I married you.\"\nStern sank down, burning slowly, a crimson flush rising in his face. Only half a dozen murders in two years, he thought. No more politics, no more to write about. He had to have a story, just had to have one. He'd go crazy if something didn't happen soon.\n\n*lachrymose means mournful and is often used to describe weeping people", "Read the following passage:\n\nWhite Fang\nThe Grey Cub\nby Jack London\n\nHe was different from his brothers and sisters. Their hair already betrayed the reddish hue inherited from their mother, the she-wolf; while he alone, in this particular, took after his father. He was the one little grey cub of the litter. He had bred true to the straight wolf-stock—in fact, he had bred true to old One Eye himself, physically, with but a single exception, and that was he had two eyes to his father's one.\nThe grey cub's eyes had not been open long, yet already he could see with steady clearness. And while his eyes were still closed, he had felt, tasted, and smelled. He knew his two brothers and his two sisters very well. He had begun to romp with them in a feeble, awkward way, and even to squabble, his little throat vibrating with a queer rasping noise (the forerunner of the growl), as he worked himself into a passion. And long before his eyes had opened he had learned by touch, taste, and smell to know his mother—a fount of warmth and liquid food and tenderness. She possessed a gentle, caressing tongue that soothed him when it passed over his soft little body, and that impelled him to snuggle close against her and to doze off to sleep.\nMost of the first month of his life had been passed thus in sleeping; but now he could see quite well, and he stayed awake for longer periods of time, and he was coming to learn his world quite well. His world was gloomy; but he did not know that, for he knew no other world. It was dim-lighted; but his eyes had never had to adjust themselves to any other light. His world was very small. Its limits were the walls of the lair; but as he had no knowledge of the wide world outside, he was never oppressed by the narrow confines of his existence.\nBut he had early discovered that one wall of his world was different from the rest. This was the mouth of the cave and the source of light. He had discovered that it was different from the other walls long before he had any thoughts of his own, any conscious volitions. It had been an irresistible attraction before ever his eyes opened and looked upon it. The light from it had beat upon his sealed lids, and the eyes and the optic nerves had pulsated to little, spark-like flashes, warm-colored and strangely pleasing. The life of his body, and of every fiber of his body, the life that was the very substance of his body and that was apart from his own personal life, had yearned toward this light and urged his body toward it in the same way that the cunning chemistry of a plant urges it toward the sun.\nAlways, in the beginning, before his conscious life dawned, he had crawled toward the mouth of the cave. And in this his brothers and sisters were one with him. Never, in that period, did any of them crawl toward the dark corners of the back-wall. The light drew them as if they were plants; the chemistry of the life that composed them demanded the light as a necessity of being; and their little puppet-bodies crawled blindly and chemically, like the tendrils of a vine. Later on, when each developed individuality and became personally conscious of impulses and desires, the attraction of the light increased. They were always crawling and sprawling toward it, and being driven back from it by their mother.\nIt was in this way that the grey cub learned other attributes of his mother than the soft, soothing, tongue. In his insistent crawling toward the light, he discovered in her a nose that with a sharp nudge administered rebuke, and later, a paw, that crushed him down and rolled him over and over with a swift, calculating stroke. Thus he learned hurt; and on top of it he learned to avoid hurt, first, by not incurring the risk of it; and second, when he had incurred the risk, by dodging and by retreating. These were conscious actions, and were the results of his first generalizations upon the world. Before that he had recoiled automatically from hurt, as he had crawled automatically toward the light. After that he recoiled from hurt because he knew that it was hurt.\nHe was a fierce little cub. So were his brothers and sisters. It was to be expected. He was a carnivorous animal. He came of a breed of meat-killers and meat-eaters. His father and mother lived wholly upon meat. The milk he had sucked with his first flickering life, was milk transformed directly from meat, and now, at a month old, when his eyes had been open for but a week, he was beginning himself to eat meat—meat half-digested by the she-wolf and disgorged for the five growing cubs that already made too great demand upon her milk.\nBut he was, further, the fiercest of the litter. He could make a louder rasping growl than any of them. His tiny rages were much more terrible than theirs. It was he that first learned the trick of rolling a fellow-cub over with a cunning paw-stroke. And it was he that first gripped another cub by the ear and pulled and tugged and growled through jaws tight-clenched. And certainly it was he that caused the mother the most trouble in keeping her litter from the mouth of the cave and the perils beyond."]}, {"unit": "Comprehension Skills", "topic": "Citing Textual Evidence", "lesson": "Use evidence to analyze a text", "texts": ["Read the following passage, which continues and completes the story from the lesson.\n\nThe Storyteller\nBy H. H. Munro (Saki)\n\n\"Come over here and listen to a story,\" said the aunt, when the bachelor had looked twice at her and once at the communication cord.\nThe children moved listlessly towards the aunt's end of the carriage. Evidently her reputation as a storyteller did not rank high in their estimation.\nIn a low, confidential voice, interrupted at frequent intervals by loud, petulant questionings from her listeners, she began an unenterprising and deplorably uninteresting story about a little girl who was good, and made friends with everyone on account of her goodness, and was finally saved from a mad bull by a number of rescuers who admired her moral character.\n\"Wouldn't they have saved her if she hadn't been good?\" demanded the bigger of the small girls. It was exactly the question that the bachelor had wanted to ask.\n\"Well, yes,\" admitted the aunt lamely, \"but I don't think they would have run quite so fast to her help if they had not liked her so much.\"\n\"It's the stupidest story I've ever heard,\" said the bigger of the small girls, with immense conviction.\n\"I didn't listen after the first bit, it was so stupid,\" said Cyril.\nThe smaller girl made no actual comment on the story, but she had long ago recommenced a murmured repetition of her favorite line.\n\"You don't seem to be a success as a storyteller,\" said the bachelor suddenly from his corner.\nThe aunt bristled at this unexpected attack.\n\"It's a very difficult thing to tell stories that children can both understand and appreciate,\" she said stiffly.\n\"I don't agree with you,\" said the bachelor.\n\"Perhaps you would like to tell them a story,\" was the aunt's retort.\n\"Tell us a story,\" demanded the bigger of the small girls.\n\"Once upon a time,\" began the bachelor, \"there was a little girl called Bertha, who was extra-ordinarily good.\"\nThe children's momentarily-aroused interest began at once to flicker; all stories seemed dreadfully alike, no matter who told them.\n\"She did all that she was told, she was always truthful, she kept her clothes clean, ate milk puddings as though they were jam tarts, learned her lessons perfectly, and was polite in her manners.\"\n\"Was she pretty?\" asked the bigger of the small girls.\n\"Not as pretty as any of you,\" said the bachelor, \"but she was horribly good.\"\nThere was a wave of reaction in favor of the story; the word horrible in connection with goodness was a novelty that commended itself. It seemed to introduce a ring of truth that was absent from the aunt's tales of infant life.\n\"She was so good,\" continued the bachelor, \"that she won several medals for goodness, which she always wore, pinned on to her dress. There was a medal for obedience, another medal for punctuality, and a third for good behavior. They were large metal medals and they clicked against one another as she walked. No other child in the town where she lived had as many as three medals, so everybody knew that she must be an extra good child.\"\n\"Horribly good,\" quoted Cyril.\n\"Everybody talked about her goodness, and the Prince of the country got to hear about it, and he said that as she was so very good she might be allowed once a week to walk in his park, which was just outside the town. It was a beautiful park, and no children were ever allowed in it, so it was a great honor for Bertha to be allowed to go there.\"\n\"Were there any sheep in the park?\" demanded Cyril.\n\"No;\" said the bachelor, \"there were no sheep.\"\n\"Why weren't there any sheep?\" came the inevitable question arising out of that answer.\nThe aunt permitted herself a smile, which might almost have been described as a grin.\n\"There were no sheep in the park,\" said the bachelor, \"because the Prince's mother had once had a dream that her son would either be killed by a sheep or else by a clock falling on him. For that reason the Prince never kept a sheep in his park or a clock in his palace.\"\nThe aunt suppressed a gasp of admiration.\n\"Was the Prince killed by a sheep or by a clock?\" asked Cyril.\n\"He is still alive, so we can't tell whether the dream will come true,\" said the bachelor unconcernedly; \"anyway, there were no sheep in the park, but there were lots of little pigs running all over the place.\"\n\"What color were they?\"\n\"Black with white faces, white with black spots, black all over, grey with white patches, and some were white all over.\"\nThe storyteller paused to let a full idea of the park's treasures sink into the children's imaginations; then he resumed:\n\"Bertha was rather sorry to find that there were no flowers in the park. She had promised her aunts, with tears in her eyes, that she would not pick any of the kind Prince's flowers, and she had meant to keep her promise, so of course it made her feel silly to find that there were no flowers to pick.\"\n\"Why weren't there any flowers?\"\n\"Because the pigs had eaten them all,\" said the bachelor promptly. \"The gardeners had told the Prince that you couldn't have pigs and flowers, so he decided to have pigs and no flowers.\"\nThere was a murmur of approval at the excellence of the Prince's decision; so many people would have decided the other way.\n\"There were lots of other delightful things in the park. There were ponds with gold and blue and green fish in them, and trees with beautiful parrots that said clever things at a moment's notice, and humming birds that hummed all the popular tunes of the day. Bertha walked up and down and enjoyed herself immensely, and thought to herself: 'If I were not so extraordinarily good I should not have been allowed to come into this beautiful park and enjoy all that there is to be seen in it,' and her three medals clinked against one another as she walked and helped to remind her how very good she really was. Just then an enormous wolf came prowling into the park to see if it could catch a fat little pig for its supper.\"\n\"What color was it?\" asked the children, amid an immediate quickening of interest.\n\"Mud-color all over, with a black tongue and pale grey eyes that gleamed with unspeakable ferocity. The first thing that it saw in the park was Bertha; her pinafore was so spotlessly white and clean that it could be seen from a great distance. Bertha saw the wolf and saw that it was stealing towards her, and she began to wish that she had never been allowed to come into the park. She ran as hard as she could, and the wolf came after her with huge leaps and bounds. She managed to reach a shrubbery of myrtle bushes and she hid herself in one of the thickest of the bushes. The wolf came sniffing among the branches, its black tongue lolling out of its mouth and its pale grey eyes glaring with rage. Bertha was terribly frightened, and thought to herself: 'If I had not been so extraordinarily good I should have been safe in the town at this moment.' However, the scent of the myrtle was so strong that the wolf could not sniff out where Bertha was hiding, and the bushes were so thick that he might have hunted about in them for a long time without catching sight of her, so he thought he might as well go off and catch a little pig instead. Bertha was trembling very much at having the wolf prowling and sniffing so near her, and as she trembled the medal for obedience clinked against the medals for good conduct and punctuality. The wolf was just moving away when he heard the sound of the medals clinking and stopped to listen; they clinked again in a bush quite near him. He dashed into the bush, his pale grey eyes gleaming with ferocity and triumph, and dragged Bertha out and devoured her to the last morsel. All that was left of her were her shoes, bits of clothing, and the three medals for goodness.\"\n\"Were any of the little pigs killed?\"\n\"No, they all escaped.\"\n\"The story began badly,\" said the smaller of the small girls, \"but it had a beautiful ending.\"\n\"It is the most beautiful story that I ever heard,\" said the bigger of the small girls, with immense decision.\n\"It is the only beautiful story I have ever heard,\" said Cyril.\nA dissenting opinion came from the aunt.\n\"A most improper story to tell to young children! You have undermined the effect of years of careful teaching.\"\n\"At any rate,\" said the bachelor, collecting his belongings preparatory to leaving the carriage, \"I kept them quiet for ten minutes, which was more than you were able to do.\"\n\"Unhappy woman!\" he observed to himself as he walked down the platform of Templecombe station; \"for the next six months or so those children will assail her in public with demands for an improper story!\"", "Read the following passage.\n\nThe Diamond Necklace\nBy Guy de Maupassant\n\nThe girl was one of those pretty and charming young creatures who sometimes are born, as if by a slip of fate, into a family of clerks. She had no dowry, no expectations, no way of being known, understood, loved, married by any rich and distinguished man; so she let herself be married to a little clerk of the Ministry of Public Instruction.\nShe dressed plainly because she could not dress well, but she was unhappy as if she had really fallen from a higher station; since with women there is neither caste nor rank, for beauty, grace and charm take the place of family and birth. Natural ingenuity, instinct for what is elegant, a supple mind are their sole hierarchy, and often make of women of the people the equals of the very greatest ladies.\nMathilde suffered ceaselessly, feeling herself born to enjoy all delicacies and all luxuries. She was distressed at the poverty of her dwelling, at the bareness of the walls, at the shabby chairs, the ugliness of the curtains. All those things, of which another woman of her rank would never even have been conscious, tortured her and made her angry. The sight of the little Breton peasant who did her humble housework aroused in her despairing regrets and bewildering dreams. She thought of silent antechambers hung with Oriental tapestry, illumined by tall bronze candelabra, and of two great footmen in knee breeches who sleep in the big armchairs, made drowsy by the oppressive heat of the stove. She thought of long reception halls hung with ancient silk, of the dainty cabinets containing priceless curiosities and of the little coquettish perfumed reception rooms made for chatting at five o'clock with intimate friends, with men famous and sought after, whom all women envy and whose attention they all desire.\nWhen she sat down to dinner, before the round table covered with a tablecloth in use three days, opposite her husband, who uncovered the soup tureen and declared with a delighted air, \"Ah, the good soup! I don't know anything better than that,\" she thought of dainty dinners, of shining silverware, of tapestry that peopled the walls with ancient personages and with strange birds flying in the midst of a fairy forest; and she thought of delicious dishes served on marvellous plates and of the whispered gallantries to which you listen with a sphinxlike smile while you are eating the pink meat of a trout or the wings of a quail.\nShe had no gowns, no jewels, nothing. And she loved nothing but that. She felt made for that. She would have liked so much to please, to be envied, to be charming, to be sought after.\nShe had a friend, a former schoolmate at the convent, who was rich, and whom she did not like to go to see any more because she felt so sad when she came home.\nBut one evening her husband reached home with a triumphant air and holding a large envelope in his hand.\n\"There,\" said he, \"there is something for you.\"\nShe tore the paper quickly and drew out a printed card which bore these words:\n\nThe Minister of Public Instruction and Madame Georges Ramponneau request the honor of M. and Madame Loisel's company at the palace of the Ministry on Monday evening, January 18th.\n\nInstead of being delighted, as her husband had hoped, she threw the invitation on the table crossly, muttering:\n\"What do you wish me to do with that?\"\n\"Why, my dear, I thought you would be glad. You never go out, and this is such a fine opportunity. I had great trouble to get it. Every one wants to go; it is very select, and they are not giving many invitations to clerks. The whole official world will be there.\"\nShe looked at him with an irritated glance and said impatiently:\n\"And what do you wish me to put on my back?\"\nHe had not thought of that. He stammered:\n\"Why, the gown you go to the theatre in. It looks very well to me.\"\nHe stopped, distracted, seeing that his wife was weeping. Two great tears ran slowly from the corners of her eyes toward the corners of her mouth.\n\"What's the matter? What's the matter?\" he answered.\nBy a violent effort she conquered her grief and replied in a calm voice, while she wiped her wet cheeks:\n\"Nothing. Only I have no gown, and, therefore, I can't go to this ball. Give your card to some colleague whose wife is better equipped than I am.\"\nHe was in despair. He resumed:\n\"Come, let us see, Mathilde. How much would it cost, a suitable gown, which you could use on other occasions—something very simple?\"\nShe reflected several seconds, making her calculations and wondering also what sum she could ask without drawing on herself an immediate refusal and a frightened exclamation from the economical clerk.\nFinally she replied hesitating:\n\"I don't know exactly, but I think I could manage it with four hundred francs.\"\nHe grew a little pale, because he was laying aside just that amount to buy a gun and treat himself to a little shooting next summer on the plain of Nanterre, with several friends who went to shoot larks there of a Sunday.\nBut he said:\n\"Very well. I will give you four hundred francs. And try to have a pretty gown.\"\nThe day of the ball drew near and Madame Loisel seemed sad, uneasy, anxious. Her frock was ready, however. Her husband said to her one evening:\n\"What is the matter? Come, you have seemed very strange these last three days.\"\nAnd she answered:\n\"It annoys me not to have a single piece of jewelry, not a single ornament, nothing to put on. I shall look poverty-stricken. I would almost rather not go at all.\"\n\"You might wear natural flowers,\" said her husband. \"They're very stylish at this time of year. For ten francs you can get two or three magnificent roses.\"\nShe was not convinced.\n\"No; there's nothing more humiliating than to look poor among other women who are rich.\"\n\"How stupid you are!\" her husband cried. \"Go look up your friend, Madame Forestier, and ask her to lend you some jewels. You're intimate enough with her to do that.\"\nShe uttered a cry of joy:\n\"True! I never thought of it.\"\nThe next day she went to her friend and told her of her distress.\nMadame Forestier went to a wardrobe with a mirror, took out a large jewel box, brought it back, opened it and said to Madame Loisel:\n\"Choose, my dear.\"\nShe saw first some bracelets, then a pearl necklace, then a Venetian gold cross set with precious stones, of admirable workmanship. She tried on the ornaments before the mirror, hesitated and could not make up her mind to part with them, to give them back. She kept asking:\n\"Haven't you any more?\"\n\"Why, yes. Look further; I don't know what you like.\"\nSuddenly she discovered, in a black satin box, a superb diamond necklace, and her heart throbbed with an immoderate desire. Her hands trembled as she took it. She fastened it round her throat, outside her high-necked waist, and was lost in ecstasy at her reflection in the mirror.\nThen she asked, hesitating, filled with anxious doubt:\n\"Will you lend me this, only this?\"\n\"Why, yes, certainly.\"\nShe threw her arms round her friend's neck, kissed her passionately, then fled with her treasure.\nThe night of the ball arrived. Madame Loisel was a great success. She was prettier than any other woman present, elegant, graceful, smiling and wild with joy. All the men looked at her, asked her name, sought to be introduced. All the attaches of the Cabinet wished to waltz with her. She was remarked by the minister himself.\nShe danced with rapture, with passion, intoxicated by pleasure, forgetting all in the triumph of her beauty, in the glory of her success, in a sort of cloud of happiness comprised of all this homage, admiration, these awakened desires and of that sense of triumph which is so sweet to woman's heart.\nShe left the ball about four o'clock in the morning. Her husband had been sleeping since midnight in a little deserted anteroom with three other gentlemen whose wives were enjoying the ball.\nHe threw over her shoulders the wraps he had brought, the modest wraps of common life, the poverty of which contrasted with the elegance of the ball dress. She felt this and wished to escape so as not to be remarked by the other women, who were enveloping themselves in costly furs.\nLoisel held her back, saying: \"Wait a bit. You will catch cold outside. I will call a cab.\"\nBut she did not listen to him and rapidly descended the stairs. When they reached the street they could not find a carriage and began to look for one, shouting after the cabmen passing at a distance.\nThey went toward the Seine in despair, shivering with cold. At last they found on the quay one of those ancient night cabs which, as though they were ashamed to show their shabbiness during the day, are never seen round Paris until after dark.\nIt took them to their dwelling in the Rue des Martyrs, and sadly they mounted the stairs to their flat. All was ended for her. As to him, he reflected that he must be at the ministry at ten o'clock that morning.\nShe removed her wraps before the glass so as to see herself once more in all her glory. But suddenly she uttered a cry. She no longer had the necklace around her neck!\n\"What is the matter with you?\" demanded her husband, already half undressed.\nShe turned distractedly toward him.\n\"I have—I have—I've lost Madame Forestier's necklace,\" she cried.\nHe stood up, bewildered.\n\"What!—how? Impossible!\"\nThey looked among the folds of her skirt, of her cloak, in her pockets, everywhere, but did not find it.\n\"You're sure you had it on when you left the ball?\" he asked.\n\"Yes, I felt it in the vestibule of the minister's house.\"\n\"But if you had lost it in the street we should have heard it fall. It must be in the cab.\"\n\"Yes, probably. Did you take his number?\"\n\"No. And you—didn't you notice it?\"\n\"No.\"\nThey looked, thunderstruck, at each other. At last Loisel put on his clothes.\n\"I shall go back on foot,\" said he, \"over the whole route, to see whether I can find it.\"\nHe went out. She sat waiting on a chair in her ball dress, without strength to go to bed, overwhelmed, without any fire, without a thought.\nHer husband returned about seven o'clock. He had found nothing.\nHe went to police headquarters, to the newspaper offices to offer a reward; he went to the cab companies—everywhere, in fact, whither he was urged by the least spark of hope.\nShe waited all day, in the same condition of mad fear before this terrible calamity.\nLoisel returned at night with a hollow, pale face. He had discovered nothing.\n\"You must write to your friend,\" said he, \"that you have broken the clasp of her necklace and that you are having it mended. That will give us time to turn round.\"\nShe wrote at his dictation.\nAt the end of a week they had lost all hope. Loisel, who had aged five years, declared:\n\"We must consider how to replace that ornament.\"\nThe next day they took the box that had contained it and went to the jeweler whose name was found within. He consulted his books.\n\"It was not I, madame, who sold that necklace; I must simply have furnished the case.\"\nThen they went from jeweler to jeweler, searching for a necklace like the other, trying to recall it, both sick with chagrin and grief.\nThey found, in a shop at the Palais Royal, a string of diamonds that seemed to them exactly like the one they had lost. It was worth forty thousand francs. They could have it for thirty-six.\nSo they begged the jeweler not to sell it for three days yet. And they made a bargain that he should buy it back for thirty-four thousand francs, in case they should find the lost necklace before the end of February.\nLoisel possessed eighteen thousand francs which his father had left him. He would borrow the rest.\nHe did borrow, asking a thousand francs of one, five hundred of another, five louis here, three louis there. He gave notes, took up ruinous obligations, dealt with usurers and all the race of lenders. He compromised all the rest of his life, risked signing a note without even knowing whether he could meet it; and, frightened by the trouble yet to come, by the black misery that was about to fall upon him, by the prospect of all the physical privations and moral tortures that he was to suffer, he went to get the new necklace, laying upon the jeweler's counter thirty-six thousand francs.\nWhen Madame Loisel took back the necklace Madame Forestier said to her with a chilly manner:\n\"You should have returned it sooner; I might have needed it.\"\nShe did not open the case, as her friend had so much feared. If she had detected the substitution, what would she have thought, what would she have said? Would she not have taken Madame Loisel for a thief?\nThereafter Madame Loisel knew the horrible existence of the needy. She bore her part, however, with sudden heroism. That dreadful debt must be paid. She would pay it. They dismissed their servant; they changed their lodgings; they rented a garret under the roof.\nShe came to know what heavy housework meant and the odious cares of the kitchen. She washed the dishes, using her dainty fingers and rosy nails on greasy pots and pans. She washed the soiled linen, the shirts and the dishcloths, which she dried upon a line; she carried the slops down to the street every morning and carried up the water, stopping for breath at every landing. And dressed like a woman of the people, she went to the fruiterer, the grocer, the butcher, a basket on her arm, bargaining, meeting with impertinence, defending her miserable money, sou by sou.\nEvery month they had to meet some notes, renew others, obtain more time.\nHer husband worked evenings, making up a tradesman's accounts, and late at night he often copied manuscript for five sous a page.\nThis life lasted ten years.\nAt the end of ten years they had paid everything, everything, with the rates of usury and the accumulations of the compound interest.\nMadame Loisel looked old now. She had become the woman of impoverished households—strong and hard and rough. With frowsy hair, skirts askew and red hands, she talked loud while washing the floor with great swishes of water. But sometimes, when her husband was at the office, she sat down near the window and she thought of that gay evening of long ago, of that ball where she had been so beautiful and so admired.\nWhat would have happened if she had not lost that necklace? Who knows? who knows? How strange and changeful is life! How small a thing is needed to make or ruin us!\nBut one Sunday, having gone to take a walk in the Champs Elysees to refresh herself after the labors of the week, she suddenly perceived a woman who was leading a child. It was Madame Forestier, still young, still beautiful, still charming.\nMadame Loisel felt moved. Should she speak to her? Yes, certainly. And now that she had paid, she would tell her all about it. Why not?\nShe went up.\n\"Good-day, Jeanne.\"\nThe other, astonished to be familiarly addressed by this plain good-wife, did not recognize her at all and stammered:\n\"But—madame!—I do not know—You must have mistaken.\"\n\"No. I am Mathilde Loisel.\"\nHer friend uttered a cry.\n\"Oh, my poor Mathilde! How you are changed!\"\n\"Yes, I have had a pretty hard life, since I last saw you, and great poverty—and that because of you!\"\n\"Of me! How so?\"\n\"Do you remember that diamond necklace you lent me to wear at the ministerial ball?\"\n\"Yes. Well?\"\n\"Well, I lost it.\"\n\"What do you mean? You brought it back.\"\n\"I brought you back another exactly like it. And it has taken us ten years to pay for it. You can understand that it was not easy for us, for us who had nothing. At last it is ended, and I am very glad.\"\nMadame Forestier had stopped.\n\"You say that you bought a necklace of diamonds to replace mine?\"\n\"Yes. You never noticed it, then! They were very similar.\"\nAnd she smiled with a joy that was at once proud and ingenuous.\nMadame Forestier, deeply moved, took her hands.\n\"Oh, my poor Mathilde! Why, my necklace was paste! It was worth at most only five hundred francs!\""]}, {"unit": "Comprehension Skills", "topic": "Analyzing Text", "lesson": "Identify explicit and implicit Information", "texts": []}, {"unit": "Comprehension Skills", "topic": "Analyzing Text", "lesson": "Cite textual evidence to support a claim", "texts": []}, {"unit": "Comprehension Skills", "topic": "Analyzing Text", "lesson": "Make an inference", "texts": []}, {"unit": "Comprehension Skills", "topic": "Analyzing Text", "lesson": "Cite textual evidence to support an inference", "texts": []}, {"unit": "Comprehension Skills", "topic": "Analyzing Text", "lesson": "Identify weak evidence", "texts": []}, {"unit": "Comprehension Skills", "topic": "Analyzing Text", "lesson": "Evaluate sources", "texts": []}, {"unit": "Comprehension Skills", "topic": "Analyzing Text", "lesson": "Choose the strongest evidence", "texts": []}, {"unit": "Comprehension Skills", "topic": "Analyzing Text", "lesson": "Evaluate credibility of sources", "texts": []}, {"unit": "Comprehension Skills", "topic": "Analyzing Text", "lesson": "Use evidence to analyze a text", "texts": []}, {"unit": "Comprehension Skills", "topic": "Themes", "lesson": "Distinguish between theme and topic", "texts": []}, {"unit": "Comprehension Skills", "topic": "Themes", "lesson": "Analyze how characters develop theme", "texts": ["Read the story. Then answer the questions that follow.\n\nThe Lottery Ticket\nBy Anton Chekhov\n\nIvan Dmitritch, a middle class man who lived with his family on an income of twelve hundred a year and was very well satisfied with his lot, sat down on the sofa after supper and began reading the newspaper.\n\"I forgot to look at the newspaper today,\" his wife said to him as she cleared the table. \"Look and see whether the list of drawings is there.\"\n\"Yes, it is,\" said Ivan Dmitritch, \"but hasn't your ticket lapsed?\"\n\"No, I took the interest on Tuesday.\"\n\"What is the number?\"\n\"Series 9,499, number 26.\"\n\"All right, we will look… 9,499 and 26.\"\nIvan Dmitritch had no faith in lottery luck, and would not, as a rule, have consented to look at the lists of winning numbers, but now, as he had nothing else to do and as the newspaper was before his eyes, he passed his finger downwards along the column of numbers. And immediately, as though in mockery of his skepticism, no further than the second line from the top, his eye was caught by the figure 9,499! Unable to believe his eyes, he hurriedly dropped the paper on his knees without looking to see the number of the ticket, and, just as though someone had doused him in cold water, he felt an agreeable chill in the pit of the stomach; tingling and terrible and sweet!\n\"Masha, 9,499 is there!\" he said in a hollow voice.\nHis wife looked at his astonished and panic-stricken face, and realized that he was not joking. \"9,499?\" she asked, turning pale and dropping the folded tablecloth on the table.\n\"Yes, yes… it really is there!\"\n\"And the number of the ticket?\"\n\"Oh, yes! There's the number of the ticket too. But stay… wait! No, I say! Anyway, the number of our series is there! Anyway, you understand…\"\nLooking at his wife, Ivan Dmitritch gave a broad, senseless smile, like a baby when a bright object is shown it. His wife smiled too; it was as pleasant to her as to him that he only mentioned the series, and did not try to find out the number of the winning ticket. To torment and tantalize oneself with hopes of possible fortune is so sweet, so thrilling!\n\"It is our series,\" said Ivan Dmitritch, after a long silence. \"So there is a probability that we have won. It's only a probability, but there it is!\"\n\"Well, now look!\"\n\"Wait a little. We have plenty of time to be disappointed. It's on the second line from the top, so the prize is seventy-five thousand. That's not money, but power, capital!\nAnd in a minute I shall look at the list, and there—26! Eh? I say, what if we really have won?\"\nThe husband and wife began laughing and staring at one another in silence. The possibility of winning bewildered them; they could not have said, could not have dreamed, what they both needed that seventy-five thousand for, what they would buy, where they would go. They thought only of the figures 9,499 and 75,000 and pictured them in their imagination, while somehow they could not think of the happiness itself, which was so possible.\nIvan Dmitritch, holding the paper in his hand, walked several times from corner to corner, and only when he had recovered from the first impression began dreaming a little.\n\"And if we have won,\" he said, \"why, it will be a new life, it will be a transformation!\nThe ticket is yours, but if it were mine I should, first of all, of course, spend twenty-five thousand on real property in the shape of an estate; ten thousand on immediate expenses, new furnishing… travelling… paying debts, and so on… The other forty thousand I would put in the bank and get interest on it.\"\n\"Yes, an estate, that would be nice,\" said his wife, sitting down and dropping her hands in her lap.\n\"Somewhere in the Tula or Oryol provinces… In the first place we shouldn't need a summer villa, and besides, it would always bring in an income.\"\nAnd pictures came crowding on his imagination, each more gracious and poetical than the last. And in all these pictures he saw himself well-fed, serene, healthy, felt warm, even hot! Here, after eating a summer soup, cold as ice, he lay on his back on the burning sand close to a stream or in the garden under a lime-tree… It is hot… His little boy and girl are crawling about near him, digging in the sand or catching ladybirds in the grass. He dozes sweetly, thinking of nothing, and feeling all over that he need not go to the office today, tomorrow, or the day after. Or, tired of lying still, he goes to the hayfield, or to the forest for mushrooms, or watches the peasants catching fish with a net. When the sun sets he takes a towel and soap and saunters to the bathing-shed, where he undresses at his leisure, slowly rubs his bare chest with his hands, and goes into the water. And in the water, near the opaque soapy circles, little fish flit to and fro and green waterweeds nod their heads. After bathing there is tea with cream and milk rolls. In the evening, a walk with the neighbors.\n\"Yes, it would be nice to buy an estate,\" said his wife, also dreaming, and from her face it was evident that she was enchanted by her thoughts.\nIvan Dmitritch pictured to himself autumn with its rains, its cold evenings, and its St. Martin's summer. At that season he would have to take longer walks about the garden and beside the river, so as to get thoroughly chilled, and then drink a big glass of vodka and eat a salted mushroom or a soused cucumber, and then, drink another…\nThe children would come running from the kitchen-garden, bringing a carrot and a radish smelling of fresh earth… And then, he would lie stretched full length on the sofa, and in leisurely fashion turn over the pages of some illustrated magazine, or, covering his face with it and unbuttoning his waistcoat, give himself up to slumber.\nThe St. Martin's summer is followed by cloudy, gloomy weather. It rains day and night, the bare trees weep, and the wind is damp and cold. The dogs, the horses, the fowls—all are wet, depressed, downcast. There is nowhere to walk; one can't go out for days together; one has to pace up and down the room, looking despondently at the grey window. It is dreary!\nIvan Dmitritch stopped and looked at his wife. \"I should go abroad, you know, Masha,\" he said.\nAnd he began thinking how nice it would be in late autumn to go abroad somewhere to the South of France… to Italy… to India!\n\"I should certainly go abroad too,\" his wife said. \"But look at the number of the ticket!\"\n\"Wait, wait!\"\nHe walked about the room and went on thinking. It occurred to him: what if his wife really did go abroad? It is pleasant to travel alone, or in the society of light, careless women who live in the present, and not such as think and talk all the journey about nothing but their children, sigh, and tremble with dismay over every farthing. Ivan Dmitritch imagined his wife in the train with a multitude of parcels, baskets, and bags; she would be sighing over something, complaining that the train made her head ache, that she had spent so much money. At the stations he would continually be having to run for boiling water, bread and butter… She wouldn't have dinner because of its being too dear… She would begrudge me every farthing, he thought, with a glance at his wife.\nThe lottery ticket is hers, not mine! Besides, what is the use of her going abroad? What does she want there? She would shut herself up in the hotel, and not let me out of her sight. I know!\nAnd for the first time in his life his mind dwelt on the fact that his wife had grown elderly and plain, and that she was saturated through and through with the smell of cooking, while he was still young, fresh, and healthy, and might well have got married again.\nOf course, all that is silly nonsense, he thought, but, why should she go abroad?\nWhat would she make of it? And yet she would go, of course. I can fancy… In reality it is all one to her, whether it is Naples or Klin. She would only be in my way. I should be dependent upon her. I can fancy how, like a regular woman, she will lock the money up as soon as she gets it. She will hide it from me! She will look after her relations and grudge me every farthing.\nIvan Dmitritch thought of her relations. All those wretched brothers and sisters and aunts and uncles would come crawling about as soon as they heard of the winning ticket, would begin whining like beggars, and fawning upon them with oily, hypocritical smiles. Wretched, detestable people! If they were given anything, they would ask for more; while if they were refused, they would swear at them, slander them, and wish them every kind of misfortune.\nIvan Dmitritch remembered his own relations, and their faces, at which he had looked impartially in the past, struck him now as repulsive and hateful. They are such reptiles! he thought.\nAnd his wife's face, too, struck him as repulsive and hateful. Anger surged up in his heart against her, and he thought malignantly: She knows nothing about money, and so she is stingy. If she won it she would give me a hundred roubles, and put the rest away under lock and key.\nAnd he looked at his wife, not with a smile now, but with hatred. She glanced at him too, and also with hatred and anger. She had her own daydreams, her own plans, her own reflections; she understood perfectly well what her husband's dreams were.\nShe knew who would be the first to try and grab her winnings. It's very nice making daydreams at other people's expense! is what her eyes expressed. No, don't you dare!\nHer husband understood her look; hatred began stirring again in his breast, and in order to annoy his wife he glanced quickly, to spite her at the fourth page on the newspaper and read out triumphantly:\n\"Series 9,499, number 46! Not 26!\"\nHatred and hope both disappeared at once, and it began immediately to seem to Ivan Dmitritch and his wife that their rooms were dark and small and low-pitched, that the supper they had been eating was not doing them good, but lying heavy on their stomachs, that the evenings were long and wearisome…\n\"What the devil's the meaning of it?\" said Ivan Dmitritch, beginning to be ill humored. \"Wherever one steps there are bits of paper under one's feet, crumbs, husks. The rooms are never swept! One is simply forced to go out. Oh, take my soul entirely! I wish to live no more!\"", "Read the story below. Then, answer the questions that follow.\n\nThe Tell-Tale Heart\nBy Edgar Allan Poe\n\nTrue!—nervous—very, very dreadfully nervous I had been and am; but why will you say that I am mad? The disease had sharpened my senses—not destroyed—not dulled them. Above all was the sense of hearing acute. I heard all things in the heaven and in the earth. I heard many things in hell. How, then, am I mad? Hearken! and observe how healthily—how calmly I can tell you the whole story.\nIt is impossible to say how first the idea entered my brain; but once conceived, it haunted me day and night. Object there was none. Passion there was none. I loved the old man. He had never wronged me. He had never given me insult. For his gold I had no desire. I think it was his eye! yes, it was this! He had the eye of a vulture—a pale blue eye, with a film over it. Whenever it fell upon me, my blood ran cold; and so by degrees—very gradually—I made up my mind to take the life of the old man, and thus rid myself of the eye forever.\nNow this is the point. You fancy me mad. Madmen know nothing. But you should have seen me. You should have seen how wisely I proceeded—with what caution—with what foresight—with what dissimulation I went to work! I was never kinder to the old man than during the whole week before I killed him. And every night, about midnight, I turned the latch of his door and opened it—oh so gently! And then, when I had made an opening sufficient for my head, I put in a dark lantern, all closed, closed, that no light shone out, and then I thrust in my head. Oh, you would have laughed to see how cunningly I thrust it in! I moved it slowly—very, very slowly, so that I might not disturb the old man's sleep. It took me an hour to place my whole head within the opening so far that I could see him as he lay upon his bed. Ha! would a madman have been so wise as this? And then, when my head was well in the room, I undid the lantern cautiously—oh, so cautiously—cautiously (for the hinges creaked)—I undid it just so much that a single thin ray fell upon the vulture eye. And this I did for seven long nights—every night just at midnight—but I found the eye always closed; and so it was impossible to do the work; for it was not the old man who vexed me, but his Evil Eye. And every morning, when the day broke, I went boldly into the chamber, and spoke courageously to him, calling him by name in a hearty tone, and inquiring how he has passed the night. So you see he would have been a very profound old man, indeed, to suspect that every night, just at twelve, I looked in upon him while he slept.\nUpon the eighth night I was more than usually cautious in opening the door. A watch's minute hand moves more quickly than did mine. Never before that night had I felt the extent of my own powers—of my sagacity. I could scarcely contain my feelings of triumph. To think that there I was, opening the door, little by little, and he not even to dream of my secret deeds or thoughts. I fairly chuckled at the idea; and perhaps he heard me; for he moved on the bed suddenly, as if startled. Now you may think that I drew back—but no. His room was as black as pitch with the thick darkness, (for the shutters were close fastened, through fear of robbers,) and so I knew that he could not see the opening of the door, and I kept pushing it on steadily, steadily.\nI had my head in, and was about to open the lantern, when my thumb slipped upon the tin fastening, and the old man sprang up in bed, crying out—\"Who's there?\"\nI kept quite still and said nothing. For a whole hour I did not move a muscle, and in the meantime I did not hear him lie down. He was still sitting up in the bed listening;—just as I have done, night after night, hearkening to the death watches in the wall.\nPresently I heard a slight groan, and I knew it was the groan of mortal terror. It was not a groan of pain or of grief—oh, no!—it was the low stifled sound that arises from the bottom of the soul when overcharged with awe. I knew the sound well. Many a night, just at midnight, when all the world slept, it has welled up from my own bosom, deepening, with its dreadful echo, the terrors that distracted me. I say I knew it well. I knew what the old man felt, and pitied him, although I chuckled at heart. I knew that he had been lying awake ever since the first slight noise, when he had turned in the bed. His fears had been ever since growing upon him. He had been trying to fancy them causeless, but could not. He had been saying to himself—\"It is nothing but the wind in the chimney—it is only a mouse crossing the floor,\" or \"It is merely a cricket which has made a single chirp.\" Yes, he had been trying to comfort himself with these suppositions: but he had found all in vain. All in vain; because Death, in approaching him had stalked with his black shadow before him, and enveloped the victim. And it was the mournful influence of the unperceived shadow that caused him to feel—although he neither saw nor heard—to feel the presence of my head within the room.\nWhen I had waited a long time, very patiently, without hearing him lie down, I resolved to open a little—a very, very little crevice in the lantern. So I opened it—you cannot imagine how stealthily, stealthily—until, at length a simple dim ray, like the thread of the spider, shot from out the crevice and fell full upon the vulture eye.\nIt was open—wide, wide open—and I grew furious as I gazed upon it. I saw it with perfect distinctness—all a dull blue, with a hideous veil over it that chilled the very marrow in my bones; but I could see nothing else of the old man's face or person: for I had directed the ray as if by instinct, precisely upon the spot.\nAnd have I not told you that what you mistake for madness is but over-acuteness of the sense?—now, I say, there came to my ears a low, dull, quick sound, such as a watch makes when enveloped in cotton. I knew that sound well, too. It was the beating of the old man's heart. It increased my fury, as the beating of a drum stimulates the soldier into courage.\nBut even yet I refrained and kept still. I scarcely breathed. I held the lantern motionless. I tried how steadily I could maintain the ray upon the eye. Meantime the hellish tattoo of the heart increased. It grew quicker and quicker, and louder and louder every instant. The old man's terror must have been extreme! It grew louder, I say, louder every moment!—do you mark me well I have told you that I am nervous: so I am. And now at the dead hour of the night, amid the dreadful silence of that old house, so strange a noise as this excited me to uncontrollable terror. Yet, for some minutes longer I refrained and stood still. But the beating grew louder, louder! I thought the heart must burst. And now a new anxiety seized me—the sound would be heard by a neighbour! The old man's hour had come! With a loud yell, I threw open the lantern and leaped into the room. He shrieked once—once only. In an instant I dragged him to the floor, and pulled the heavy bed over him. I then smiled gaily, to find the deed so far done. But, for many minutes, the heart beat on with a muffled sound. This, however, did not vex me; it would not be heard through the wall. At length it ceased. The old man was dead. I removed the bed and examined the corpse. Yes, he was stone, stone dead. I placed my hand upon the heart and held it there many minutes. There was no pulsation. He was stone dead. His eye would trouble me no more.\nIf still you think me mad, you will think so no longer when I describe the wise precautions I took for the concealment of the body. I took up three planks from the flooring of the chamber, and deposited all between the scantlings. I then replaced the boards so cleverly, so cunningly, that no human eye—not even his—could have detected any thing wrong. There was nothing to wash out—no stain of any kind—no blood-spot whatever. I had been too wary for that.\nWhen I had made an end of these labors, it was four o'clock—still dark as midnight. As the bell sounded the hour, there came a knocking at the street door. I went down to open it with a light heart,—for what had I now to fear? There entered three men, who introduced themselves, with perfect suavity, as officers of the police. A shriek had been heard by a neighbour during the night; suspicion of foul play had been aroused; information had been lodged at the police office, and they (the officers) had been deputed to search the premises.\nI smiled—for what had I to fear? I bade the gentlemen welcome. The shriek, I said, was my own in a dream. The old man, I mentioned, was absent in the country. I took my visitors all over the house. I bade them search—search well. I led them, at length, to his chamber. I showed them his treasures, secure, undisturbed. In the enthusiasm of my confidence, I brought chairs into the room, and desired them here to rest from their fatigues, while I myself, in the wild audacity of my perfect triumph, placed my own seat upon the very spot beneath which reposed the corpse of the victim.\nThe officers were satisfied. My manner had convinced them. I was singularly at ease. They sat, and while I answered cheerily, they chatted of familiar things. But, ere long, I felt myself getting pale and wished them gone. My head ached, and I fancied a ringing in my ears: but still they sat and still chatted. The ringing became more distinct:—It continued and became more distinct: I talked more freely to get rid of the feeling: but it continued and gained definiteness—until, at length, I found that the noise was not within my ears.\nNo doubt I now grew very pale;—but I talked more fluently, and with a heightened voice. Yet the sound increased—and what could I do? It was a low, dull, quick sound—much such a sound as a watch makes when enveloped in cotton. I gasped for breath—and yet the officers heard it not. I talked more quickly—more vehemently; but the noise steadily increased. I arose and argued about trifles, in a high key and with violent gesticulations; but the noise steadily increased. Why would they not be gone? I paced the floor to and fro with heavy strides, as if excited to fury by the observations of the men—but the noise steadily increased. Oh God! what could I do? I foamed—I raved—I swore! I swung the chair upon which I had been sitting, and grated it upon the boards, but the noise arose over all and continually increased. It grew louder—louder—louder! And still the men chatted pleasantly, and smiled. Was it possible they heard not? Almighty God!—no, no! They heard!—they suspected!—they knew!—they were making a mockery of my horror!-this I thought, and this I think. But anything was better than this agony! Anything was more tolerable than this derision! I could bear those hypocritical smiles no longer! I felt that I must scream or die! and now—again!—hark! louder! louder! louder! louder!\n\"Villains!\" I shrieked, \"dissemble no more! I admit the deed!—tear up the planks! here, here!—It is the beating of his hideous heart!\""]}, {"unit": "Comprehension Skills", "topic": "Themes", "lesson": "Compare internal and external conflict", "texts": ["Read the excerpt below, paying attention to conflict of the story. Then, answer the questions that follow.\n\nThe Call of the Wild\nBy Jack London\n\nThe Judge was at a meeting of the Raisin Growers' Association, and the boys were busy organizing an athletic club, on the memorable night of Manuel's treachery. No one saw him and Buck, judge's dog, go off through the orchard on what Buck imagined was merely a stroll. And with the exception of a solitary man, no one saw them arrive at the little flag station known as College Park. This man talked with Manuel, and money chinked between them.\n\"You might wrap up the goods before you deliver 'm,\" the stranger said gruffly, and Manuel doubled a piece of stout rope around Buck's neck under the collar.\n\"Twist it, an' you'll choke 'm plentee,\" said Manuel, and the stranger grunted a ready affirmative.\nBuck had accepted the rope with quiet dignity. To be sure, it was an unwonted performance: but he had learned to trust in men he knew, and to give them credit for a wisdom that outreached his own. But when the ends of the rope were placed in the stranger's hands, he growled menacingly. He had merely intimated his displeasure, in his pride believing that to intimate was to command. But to his surprise the rope tightened around his neck, shutting off his breath. In quick rage he sprang at the man, who met him halfway, grappled him close by the throat, and with a deft twist threw him over on his back. Then the rope tightened mercilessly, while Buck struggled in a fury, his tongue lolling out of his mouth and his great chest panting futilely. Never in all his life had he been so vilely treated, and never in all his life had he been so angry. But his strength ebbed, his eyes glazed, and he knew nothing when the train was flagged and the two men threw him into the baggage car.\nThe next he knew, he was dimly aware that his tongue was hurting and that he was being jolted along in some kind of a conveyance. The hoarse shriek of a locomotive whistling a crossing told him where he was. He had travelled too often with the Judge not to know the sensation of riding in a baggage car. He opened his eyes, and into them came the unbridled anger of a kidnapped king. The man sprang for his throat, but Buck was too quick for him. His jaws closed on the hand, nor did they relax till his senses were choked out of him once more.", "Read the excerpt below, paying attention to conflict of the story. Then, answer the questions that follow.\n\nWhite Fang\nBy Jack London\n\nBut at front and rear, unawed and indomitable, toiled the two men who were not yet dead. Their bodies were covered with fur and soft-tanned leather. Eyelashes and cheeks and lips were so coated with the crystals from their frozen breath that their faces were not discernible. This gave them the seeming of ghostly masques, undertakers in a spectral world at the funeral of some ghost. But under it all they were men, penetrating the land of desolation and mockery and silence, puny adventurers bent on colossal adventure, pitting themselves against the might of a world as remote and alien and pulseless as the abysses of space. They travelled on without speech, saving their breath for the work of their bodies.\nAn hour went by, and a second hour. The pale light of the short sunless day was beginning to fade, when a faint far cry arose on the still air. It soared upward with a swift rush, till it reached its topmost note, where it persisted, palpitant and tense, and then slowly died away. It might have been a lost soul wailing, had it not been invested with a certain sad fierceness and hungry eagerness. The front man turned his head until his eyes met the eyes of the man behind. And then, across the narrow oblong box, each nodded to the other.\nA second cry arose, piercing the silence with needle-like shrillness. Both men located the sound. It was to the rear, somewhere in the snow expanse they had just traversed. A third and answering cry arose, also to the rear and to the left of the second cry.\n“They’re after us, Bill,” said the man at the front.\nHis voice sounded hoarse and unreal, and he had spoken with apparent effort.\n“Meat is scarce,” answered his comrade. “I ain’t seen a rabbit sign for days.”\nThereafter they spoke no more, though their ears were keen for the hunting-cries that continued to rise behind them."]}, {"unit": "Comprehension Skills", "topic": "Themes", "lesson": "Determine the theme by analyzing the conflict of a story", "texts": []}, {"unit": "Comprehension Skills", "topic": "Themes", "lesson": "Analyze how setting develops theme", "texts": []}, {"unit": "Comprehension Skills", "topic": "Themes", "lesson": "Analyze how plot develops theme", "texts": ["Read the excerpt below, paying attention to how the plot events and topic communicate the theme of the story.\n\nThe Story of My Life\nBy Helen Keller\n\nThey tell me I walked the day I was a year old. My mother had just taken me out of the bath-tub and was holding me in her lap, when I was suddenly attracted by the flickering shadows of leaves that danced in the sunlight on the smooth floor. I slipped from my mother's lap and almost ran toward them. The impulse gone, I fell down and cried for her to take me up in her arms.\nThese happy days did not last long. One brief spring, musical with the song of robin and mocking-bird, one summer rich in fruit and roses, one autumn of gold and crimson sped by and left their gifts at the feet of an eager, delighted child. Then, in the dreary month of February, came the illness which closed my eyes and ears and plunged me into the unconsciousness of a new-born baby. They called it acute congestion of the stomach and brain. The doctor thought I could not live. Early one morning, however, the fever left me as suddenly and mysteriously as it had come. There was great rejoicing in the family that morning, but no one, not even the doctor, knew that I should never see or hear again.\nI fancy I still have confused recollections of that illness. I especially remember the tenderness with which my mother tried to soothe me in my waking hours of fret and pain, and the agony and bewilderment with which I awoke after a tossing half sleep, and turned my eyes, so dry and hot, to the wall away from the once-loved light, which came to me dim and yet more dim each day. But, except for these fleeting memories, if, indeed, they be memories, it all seems very unreal, like a nightmare. Gradually I got used to the silence and darkness that surrounded me and forgot that it had ever been different, until she came—my teacher—who was to set my spirit free. But during the first nineteen months of my life I had caught glimpses of broad, green fields, a luminous sky, trees and flowers which the darkness that followed could not wholly blot out. If we have once seen, \"the day is ours, and what the day has shown.\"", "Read the excerpt below, paying attention to how the plot events and topic communicate the theme of the story.\n\nThe Story of My Life\nBy Helen Keller\n\nOn the afternoon of that eventful day, I stood on the porch, dumb, expectant. I guessed vaguely from my mother's signs and from the hurrying to and fro in the house that something unusual was about to happen, so I went to the door and waited on the steps. The afternoon sun penetrated the mass of honeysuckle that covered the porch, and fell on my upturned face. My fingers lingered almost unconsciously on the familiar leaves and blossoms which had just come forth to greet the sweet southern spring. I did not know what the future held of marvel or surprise for me. Anger and bitterness had preyed upon me continually for weeks and a deep languor had succeeded this passionate struggle.\nI felt approaching footsteps, I stretched out my hand as I supposed to my mother. Someone took it, and I was caught up and held close in the arms of her who had come to reveal all things to me, and, more than all things else, to love me.\nThe morning after my teacher came she led me into her room and gave me a doll. The little blind children at the Perkins Institution had sent it and Laura Bridgman had dressed it, but I did not know this until afterward. When I had played with it a little while, Miss Sullivan slowly spelled into my hand the word \"d-o-l-l.\" I was at once interested in this finger play and tried to imitate it. When I finally succeeded in making the letters correctly I was flushed with childish pleasure and pride. Running downstairs to my mother I held up my hand and made the letters for doll. I did not know that I was spelling a word or even that words existed; I was simply making my fingers go in monkey-like imitation. In the days that followed I learned to spell in this uncomprehending way a great many words, among them pin, hat, cup and a few verbs like sit, stand and walk, but my teacher had been with me several weeks before I understood that everything has a name.\nWe walked down the path to the well-house, attracted by the fragrance of the honeysuckle with which it was covered. Someone was drawing water and my teacher placed my hand under the spout. As the cool stream gushed over one hand she spelled into the other the word water, first slowly, then rapidly. I stood still, my whole attention fixed upon the motions of her fingers. Suddenly I felt a misty consciousness as of something forgotten—a thrill of returning thought, and somehow the mystery of language was revealed to me. I knew then that \"w-a-t-e-r\" meant the wonderful cool something that was flowing over my hand. That living word awakened my soul, gave it light, hope, joy, set it free! There were barriers still, it is true, but barriers that could in time be swept away."]}, {"unit": "Comprehension Skills", "topic": "Themes", "lesson": "Determine the theme by analyzing symbols in a story", "texts": []}, {"unit": "Comprehension Skills", "topic": "Themes", "lesson": "Identify multiple themes in one or more story", "texts": ["Text 1: A Member of the Council\nI approached the meeting hall with a grave heart. Our leader was stepping down from his position and passing the mantle of authority on. As a member of the Council, I would be among those voting on his replacement, and I knew what was coming.\nThe vote was a long-standing tradition, but it was purely ceremonial. The Council always voted unanimously for the oldest son of the leader. It was how it had always been.\nI watched Igor, the leader's eldest son, pass me with his head held high. He knew that he would soon be enthroned. His days of receiving constant discipline from the Council were coming to an end. What was certainly not ending were his casual disregard for the well-being of others, his tendency to sudden flashes of unreasonable violence, and his contempt for the traditions of our people.\nAs we took our places around the meeting hall, Igor found his seat beside his father. His younger brother, Vikram, sat on his right.\nThe ceremony began with an elaborate speech from the leader, after which he handed his scepter to the Head of the Council. It was as it had always been.\nThe Head stood and said, \"To whom does the Council offer this scepter?\" She sat, holding the scepter. It was as it had always been.\nThe oldest member of the Council stood and spoke. \"I nominate the leader's eldest son, Igor.\" It was as it had always been.\nI saw smug satisfaction cross Igor's face, and I suddenly stood. \"I nominate the leader's second son, Vikram.\" It was as it had never been before. Not as far as anyone could remember.\nA stir of uncomfortable fidgeting spread through the meeting hall. I knew that every member of that Council was as sick at the idea of Igor sitting on the throne as I was, but I did not know if that would be enough to turn them against the tradition. That did not matter. I had done what I had to do.\n\"Let us vote,\" the Head finally said. The vote was counted immediately: eleven to one. Igor had won. The ceremonies went on as they had always done, ending in a feast where Igor presided from the highest seat.\nAs we all left the hall, I felt a hand on my shoulder and turned to see Vikram. He said, \"I want to thank you for your vote of confidence in me. I also want to warn you: you should leave. Go to another land, far from my brother. He is a dangerous man, and he will never forgive you for voting against him.\" I thanked him for the warning and went home. I had already been thinking through a plan to prepare my family for an immediate departure.\n\nText 2:\nRead the two stories.\nNew School\nWhen she had finished eating, Amber stood up from the cafeteria table and said goodbye. She felt a lingering sense of discomfort as she processed the conversation she had just had. Grateful to have made some friends at her new school, she resisted the uncomfortable sense that their conversation had been a little unkind.\nShifting her focus, she glanced at her schedule and started looking for the right classroom. After a few minutes, a girl she had seen earlier approached her. \"Amber, right?\" the girl said. \"I'm Grace. We have homeroom together. Can I help you find your class?\"\nAmber recognized the name. The kids at the lunch table had talked about Grace and some of the other students—people they said Amber should avoid. Still, Amber didn't want to be rude. She figured she would just keep their conversation short. She showed her schedule to Grace.\n\"Oh, that's in the other main corridor. My class is over there too. I'd be happy to show you the way!\" Grace smiled. Amber didn't see any chance to get away, especially considering that she really did need help finding the right place. She agreed, but she made an effort to keep a little distance.\nThey walked along together, and Grace tried to make small talk even though Amber avoided responding with more than a few words. Grace didn't seem offended by her silence. In fact, she seemed very nice. Soon, they reached the classroom, and Grace said goodbye. She gave a kind smile as she left, saying, \"Don't worry—soon you'll know your way around this place perfectly. I hope you settle in soon!\"\nAfter entering the room, Amber sat heavily at a desk in the front row. Her mind was reeling. Grace had seemed really nice, despite what the kids at lunch had said. Amber already felt some loyalty to them since they had invited her to sit with them. However, if Amber was honest with herself, Grace had actually seemed a lot nicer than those kids.\nHad Amber just alienated a better friend based on bad advice? Trying to figure out a new school was so hard.\n\nThe Wish\nWhen the phone conversation with her best friend started to grow argumentative, Monica got concerned. \"Sarah, I'm sorry,\" she said. \"I didn't mean to offend you. Please forgive me—let's not fight about it.\" They reconciled. Before long, the conversation ended naturally.\nThese near-fights were happening more and more, and Monica was not exactly sure what to do about it. It didn't seem healthy to refuse to talk things over with her best friend, but Monica wasn't sure what would happen if she actually got mad at Sarah. She might lose her friend forever.\nMonica lay in bed that night wondering what she should do. Ironically, their friendship was starting to grow strained from not fighting. Finally, she made up her mind.\nThe next day was Saturday, so she was free to go to the beautiful walking trail near her home. Eventually, she departed fr
