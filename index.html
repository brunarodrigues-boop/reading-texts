he back bedroom looked out on small, sooty, flagged yards, where thin cats quarreled. The front rooms looked over the noisy road, and through their windows came the roar and rattle of it. It was shabby and cheerless on the brightest days, and on foggy or rainy ones it was the most forlorn place in London.\n\nText 2: \nadapted from Yankee Boys in Japan\nby Henry Harrison Lewis\nIt was early in the afternoon of a July day. A warm sun beaming down with almost tropical strength glinted through the open windows of an office in the foreign settlement of Yokohama, Japan. The room, a large one, furnished with desks and chairs, and the various equipment of such an apartment, contained a single occupant.\nA stranger entering from the teeming street would have noted something amiss in this office. He would have seen that the half-dozen desks, with the exception of that being used by the single occupant, were thickly covered with dust.\nA delicate lace of cobwebs held in its bondage the majority of the chairs. There were others decorating the row of books and pasteboard files upon a number of shelves lining the walls. Over in one corner was an open fireplace, looking grim and rusted, and above a lacquered side table swung a parrot cage, desolate and empty. It was a scene of disuse, and it had its meaning.\nIt was the counting-room of John Manning, \"Importer and Trader,\" as a tarnished gilt sign over the outer door informed the passerby. But the master of it, and of the huge warehouse back on the bay, had gone to his last rest many months before."]}, {"unit": "Comprehension Skills", "topic": "Describing Characters, Settings, and Events in Stories and Dramas", "lesson": "Describe events in stories", "texts": ["The Cleansing Storm\nWritten by Kelly Weaver\n\nChapter 1: Olga’s Problem\n\nOlga flew down the path to her grandmother's house almost blind from the tears in her eyes. She reached the gate, but once inside she tripped and fell down on the steps. The girl screamed when she hit her chin and started to cry even louder.\n\"What is all that noise for?\" the elderly lady asked. She walked out on the porch and looked at her granddaughter. \"Get up! Stop that noise at once!\"\nOlga got back on her feet and rubbed at her wet eyes with a dirty hand. \"Babushka! I didn't do it, I swear!\"\n\"Didn't do what?\" her grandmother asked.\n\"I didn't tip over Boris' kvas cart!\" The girl's eyes filled with tears.\n\"Olga, no one has said anything to me about Boris or his kvas cart. Come inside, wash your face and hands, and tell me what happened. It's too hot and sticky to stand out here.\" She took her granddaughter's hand and led her indoors where it was much cooler.\nOlga and her grandmother went inside the house. Babushka's house always smelled wonderful because she always made delicious food. The house still smelled of ginger and honey from the pryaniki she had made that morning. Olga watched her grandmother put two cookies on a plate and bring it to her with a glass of milk.\n\nChapter 2: The Explanation\n\n\"You eat this and tell me what happened to Boris and his kvas cart,\" Babushka said. She poured a cup of tea from the samovar on the table and sat down.\nOlga drank some milk. \"I was walking through town on my way to your house. I was passing the meat shop and Boris had his cart parked outside, but I saw him in the meat shop talking to the butcher. That was when I saw Pavel and Hedy sneak up and try to steal some kvas.\"\n\"Oh dear, not those two. Always getting into trouble,\" Babushka said with a scolding tone. \"How did Boris' cart get knocked over?”\n\"Hedy tried to get some first, but Pavel pushed her out of the way. She pushed him back and knocked him into the cart. That's when the cart fell over.\"\n\"So you saw Pavel and Hedy knock over the cart?\" Olga's grandmother asked.\n\"I did, but they ran away and Boris and the butcher ran out and Boris looked at me and started yelling at me! He said I knocked it over and he would make sure I was punished!\" Olga blurted out. \"So I ran away as fast as I could.\" The girl sniffed again and looked at the pryaniki on the plate.\n\nChapter 3: The Storm\n\nA low rumble of thunder outside made both of them look out the window. \"It's getting dark. A storm is coming,\" Babushka replied. She sipped her tea. \"Do you know the story of Perun and Veles?\"\nOlga put down the cookie that she had just bitten into. \"Perun is the thunder god.\"\n\"That's right, and Veles is the god of the underworld. Sometimes Veles tries to leave the underworld and rise above.” Babushka added, “Perun comes to battle Veles and send him back to Earth where he belongs.\"\nThere was a bright flash of light followed by a louder crack of thunder. Olga finished eating her pyraniki and watched the storm move in. The next thunderclap was very loud and made her jump.\nHer grandmother laughed. \"Now that Perun is here he will battle Veles and make him return to the underworld where he belongs. Once Veles is defeated, the thunder and lightning will stop, and there will just be rain. That is Veles returning to the Earth.\"\n\"I understand, Babushka. Gradually everything returns back to normal,\" Olga replied. The wind began to blow. She rose from her seat to close the window.\n\"Thank you, dear,\" her grandmother said. She sat with her tea and watched the lightning light up the sky. Gradually, the lightning flashes came less and the thunder grew more quiet and distant.\nOlga watched the rain come down. Once again, Veles had been sent back to Earth. She saw someone walking in the rain and cried out when she recognized Boris coming up to her grandmother's house.\n\nChapter 4: Boris’ Apology\n\n\"Babushka! He's coming to get me!\" Olga cried, running away from the window.\n\"Hmm, someone is coming here in the rain?\" she asked as she saw Boris come through her gate.\nSoon there was a polite knock at the door. \"Go and answer it, Olga,\" Babushka said.\nOlga walked to the door and opened it. She looked up at Boris, who had water dripping from his hat.\n\"Hello, Olga. Is your grandmother here?\" Boris asked.\nThe girl nodded. \"Yes, she is.\" She let Boris in, who took off his dripping hat.\nBoris smiled at Babushka. \"I came here because I owe Olga an apology.\"\nBabushka smiled at Boris. \"You do? What happened?\"\n\"Someone knocked my cart down, and I saw Olga and thought it was her. In fact it was two other children who knocked the cart over. The butcher saw them through the window of his shop. We have already talked to their parents about it.\" Boris turned to Olga. \"I am very sorry I accused you of tipping over my cart.\"\nOlga gave Boris a shy smile. \"Thank you.\"\nBoris looked pleased. \"Well, that is all I wanted to say, so good afternoon.\"\n\"Good afternoon, Boris,\" Babushka replied.\nOlga opened the door for Boris and he walked away. The clouds broke, and the sun began to peek through. The sun made her feel happy, because now Boris knew she hadn't knocked over his cart.\n\"When the storm is over is the best part,\" Olga replied.\n\"Storms are good, because they give us rain, and they wash away all our cares and make everything new again,\" her grandmother added. \"Now, why don't you finish your cookie and milk and we can have a nice visit.\"\nOlga came back to the table and finished her pryaniki and milk. Babushka made another cup of tea with the samovar and they spent the rest of the afternoon enjoying the sunshine.\n\nGlossary of Terms\n\nBabushka - Grandmother\nPryaniki - cookies made with ginger and honey\nKvas - a brewed drink made from rye bread\nPerun - Slavic God of thunder\nVeles - Slavic God of the underworld.", "The Big Secret\nWritten by Jessica Tyner\n\nChapter 1: The Secret’s Out\n\n“Do you want to know a secret?” Hayley whispered to Emily.\nEmily nodded using her serious face. She hoped that this was going to be a juicy secret.\n“Last night, my dad moved out and my mom cried all night,” Hayley confided in her friend.\n\nWhat’s the big deal? Emily thought. Emily’s parents had been divorced ever since she was a baby, and she couldn’t even remember when they all lived in the same house.\n“That’s too bad,” she said, trying to sound interested.\n“You can’t tell anyone. My mom said it’s family business,\" Hayley said.\n\nHayley’s disappointing news flew in one of Emily’s ears and out the other. Emily was disappointed, as she had been hoping for something genuinely exciting.\nSometimes gossip is so overrated! Emily thought.\n\nIt wasn’t until she was sitting at dinner with her dad and sister that evening that she remembered Hayley’s news.\n“Mrs. Holton’s getting a divorce and has to move, so we get a brand new teacher,” her sister Ada said, and the word “divorce” perked up Emily.\n“Hayley’s parents are getting divorced, too,” Emily volunteered. She had completely forgotten Hayley’s warning about not sharing the secret.\n\nAda sighed dramatically. “Everyone gets divorced,” she said. “It’s the nature of the world.” Ada was two years older and already in her “tween years,” according to their mom.\n“Yeah, well, I guess if they get divorced it means Hayley doesn’t have a bedtime at all anymore,” Emily said, trying to make her story more interesting. Ada didn’t seem very interested in this detail.\n“Can we please talk about something else,” her dad stated. The way he said it told everyone at the table that it wasn’t a question. It meant, “This discussion is over!”\n\nChapter 2: The Snowball Effect\n\nBy the time lunch rolled around the next day, Emily had forgotten all about sharing Hayley’s secret. That was about to change.\n“I can’t believe you told my secret!” Hayley yelled at her, suddenly appearing in the bustling cafeteria.\n“What do you mean? Told what secret?” Emily said with a look of confusion on her face.\n“You told the deep dark secret that I shared with you yesterday!” Hayley screamed, already starting to cry.\nHow did she find out? Emily wondered. “I only told Ada and my dad,” Emily said sheepishly, her face turning beet read. Everyone was starting to stare at them.\n“Yeah, well, Ada told her entire class and now the whole school knows!” Hayley said, as she turned and dashed out of the cafeteria.\n\n“Hey, Emily! Emily!” Bryan yelled, tugging at her shirt. “Did the cops really come to Hayley’s house this weekend because her parents were fighting?” Bryan was in a different class and had never spoken to her before. He was popular and maybe a tiny bit cute.\n“Well,” she began, “maybe. I mean, that’s what I heard, but you never know.” His eyes lit up at the sound of the exciting gossip.\n\nThat’s how the whole day went. It was like a game of telephone, and Emily couldn’t help herself from confirming the stories as they got crazier and crazier.\nBy the end of the day, the story had twisted and the rumor had completely changed. Haley’s mom had fallen in love with a king in some faraway land, and her dad had been arrested.\n\nEmily didn’t see Hayley the rest of the day. They were not scheduled to be in any of the same classes until gym at the end of the day, but Hayley wasn’t in gym. Emily noticed that Hayley wasn’t there, but she didn’t think much of it.\n\nChapter 3: A Slippery Slope\n\nHayley wasn’t in class at all the next day. Everyone else was bored with the dramatics of the story, and Emily was no longer looked to as the expert of Hayley’s parents’ divorce.\nThe whole situation was boring, and Emily started to worry about Hayley. Where was she?\n\nHayley didn’t come back to school for the rest of the week, but Emily didn’t have the guts to call her.\nShe knew she’d made a huge mistake, and she didn’t want to lose her friend.\n“You’re such a blabbermouth!” Emily yelled at Ada, bursting into her room.\nAda just shrugged and said, “You never said it was a secret.”\n\nWhen the weekend rolled around, Emily couldn’t take it anymore. She had to talk to Hayley, but what would she say?\n\nShe couldn’t come up with a single good excuse for what she had done. Emily was going to have to confess and apologize. She had no idea what Hayley’s reaction would be. Monday, she told herself. She planned on apologizing on Monday.\n\nChapter 4: The Two Hardest Words\n\nThe weekend flew by. Emily’s heart was thundering in her chest as she rode the bus to school. She tried practicing what she’d say in her head, but it was difficult because she didn’t know how Hayley would react.\nShe had fifteen minutes to find Hayley before the bell rang.\nIt didn’t take long to find Hayley at her private place in the quiet section of the playground. She was alone and seemed normal. Maybe it was all okay, and Emily wouldn’t have to apologize after all.\n“Hey,” she said carefully, walking up to Hayley. Hayley didn’t reply. This was going to be tougher than she imagined, but at least she wasn’t being yelled at yet. “I’m sorry,” she said.\nFinally, Hayley looked at her. “Sorry is not good enough,” she said.\n“I don’t know what else to say,” Emily said, just wanting things to go back to normal.\n“Apologize like you mean it,” Hayley said. “You embarrassed me, and everyone was talking about my parents and making fun of me.”\n“I’m sorry,” Emily said. Tears welled up in her eyes. “I wasn’t thinking. I didn’t realize how important it was.”\nHayley smiled. “Don’t be such a cry baby, Emily,” she said. “Just promise that you won’t do it again!”\nThat was one promise Emily could keep. \"I promise!\" she said with a grin."]}, {"unit": "Comprehension Skills", "topic": "Describing Characters, Settings, and Events in Stories and Dramas", "lesson": "Describe events in dramas", "texts": ["Text 1: The Shepherd Boy who Called Wolf\nWritten by Augusta Stevenson\n\nSCENE I\n\nTIME: middle of the afternoon.\nPLACE: a hillside near the village.\n\nCharacters\nSHEPHERD BOY\nMASTER\nPASTOR\nMERCHANT\nBAKER\nBUTCHER\n\n[The SHEPHERD BOY watches a flock of sheep.]\nBOY: I am tired of watching sheep! I will play a joke on someone! I will play a joke on every one!\nShepherd Boy:\n(He calls in a loud voice.)\nWolf! Wolf! Wolf! Wolf!\n[Enter the VILLAGERS with clubs.]\nMASTER: Where is the Wolf?\nBOY: Ha, ha, ha! There is no wolf!\nPASTOR: I do not like to leave my church!\nMERCHANT: I do not like to leave my store!\nBAKER: I do not like to leave my dough!\nBUTCHER: I do not like to leave my ox!\nBOY: Ha, ha, ha! There is no wolf! Ha, ha, ha!\nMASTER: You must not play that joke again! Do you hear? You must never play that joke again!\n\nSCENE II\n\nTIME: a week later.\nPLACE: same as in Scene I.\n\nCharacters\nBOY\nVILLAGERS\n\n[The BOY watches his sheep.]\nBOY: I will play that joke again. I like to see them come running.\n(He calls in a loud voice.)\nWolf! Wolf! Wolf! Wolf!\n[The VILLAGERS come with clubs.]\nMASTER: Where is the wolf?\nBOY: Ha, ha, ha! There is no wolf!\nPASTOR: I do not like to leave my church!\nMERCHANT: I do not like to leave my store!\nBAKER: I do not like to leave my dough!\nBUTCHER: I do not like to leave my ox!\nBOY: Ha, ha, ha! There is no wolf! Ha, ha, ha!\nMASTER: Boy, boy, you must not joke about a wolf! Do you hear? You must never joke about a wolf!\n\nSCENE III\n\nTIME: a week later.\nPLACE: same as Scene II.\n\nCharacter\nBOY\n[The BOY watches the sheep. A wolf comes and begins to kill the sheep.]\nBOY: Wolf! Wolf! Wolf!\n(No one comes or answers.)\nMaster! Pastor! Merchant! Baker! Butcher! Come! Come! Wolf! Wolf! Wolf! Wolf!\n(No one comes or answers.)\nWhat shall I do? They think I am playing a joke again. What shall I do? I cannot save my sheep! I must run to save myself!\n\nText2:\nThe Stag and the Fawn\nSCENE II\n\n\nTIME: an hour later\nPLACE: another part of the forest\n\nCharacters\nTHE STAG\nTHE FAWN\nTHE HUNTER\n\n[The STAG is caught in a thicket. The FAWN looks at him pityingly.]\nFAWN: A man is near! I hear him running!\nSTAG: I cannot free myself!\nFAWN: Ah, if you only had no horns!\nSTAG: Or if they were only not so strong and not so grand!\nFAWN: Your feet could save you then, dear father.\nSTAG: Go, child, and let your feet save you.\nFAWN: I cannot bear to leave you, father!\nSTAG: Go save yourself! Go, go!\n[The FAWN goes. The HUNTER enters.]\nHUNTER: Aha! I have you now!", "Text1: THE ENDLESS TALE\n\nTIME: a long time ago\nPLACE: the King's palace\n\nCharacters\nKING\nPRINCESS\nFIRST STORYTELLER\n\n[The KING sits on a cushion in the great hall. The PRINCESS sits on a cushion by him. In front of them sits the FIRST STORY-TELLER. The LORDS and LADIES sit near by.]\n\nSTORYTELLER: Then the prince married the princess and they were happy forever and ever.\n[There is a pause.]\nKING: Go on!\n(The Story-Teller hangs his head.)\nKING: Go on, I say!\nSTORYTELLER: That is all, your Majesty.\nKING: All!\nSTORYTELLER: The prince married the princess. There is nothing more to tell.\nKING: I cannot bear so short a story!\nPRINCESS: Why, father; for three months we have listened to it!\nKING: 'Tis short, I say! I bid you make it longer, sir!\nSTORYTELLER: I cannot, Sire. The prince married the princess. There is nothing—\nKING: Throw him out of the palace, guards!\n\nText 2:\nThe Wise CrowWritten by Augusta Stevenson\n\nTime: last summer\nPlace: a meadow\n\nCharacters\nThe CROW\nThe SPARROW\n\n[The CROW and the SPARROW meet at a spring.]\nSPARROW: What shall we do?\nCROW: There may be water in this pitcher. I will see. Aha! Here is water! Come and drink.\nSPARROW: I cannot reach it. It is too low.\nCROW: Stretch your neck!\nSPARROW: I stretch and stretch—I cannot reach it.\nCROW: Why, neither can I! Stretch as I will, I cannot reach it.\nSPARROW: What shall we do?\nCROW: We will break the pitcher. Come, now!\nSPARROW: I strike and strike.\nCROW: I strike and strike.\nSPARROW: We cannot break it.\nCROW: No, we cannot break it.\nSPARROW: What shall we do?\nCROW: Let us try to overturn it. Come, now!\nSPARROW: I push and push.\nCROW: I push and push.\nSPARROW: We cannot overturn it.\nCROW: No, we cannot overturn it.\nSPARROW: We must have water! What shall we do?\nCROW: Ah, I know the way to get the water!\n(He drops pebbles in the pitcher.)\nSPARROW: Why do you drop pebbles in the pitcher?\n(He drops in more pebbles; the water rises.)\nSPARROW: Please tell me why you do that.\nCROW: Now come and drink, Miss Sparrow!\nSPARROW: Why, I can reach the water. How strange! How very strange!"]}, {"unit": "Comprehension Skills", "topic": "Making Connections", "lesson": "Make connections between causes and effects in historical texts", "texts": []}, {"unit": "Comprehension Skills", "topic": "Making Connections", "lesson": "Make connections between causes and effects in scientific texts", "texts": []}, {"unit": "Comprehension Skills", "topic": "Making Connections", "lesson": "Make connections between steps in technical procedures", "texts": []}], "5": [{"unit": "Comprehension Skills", "topic": "Setting a Purpose and Asking Questions", "lesson": "Establish a purpose for reading a text", "texts": []}, {"unit": "Comprehension Skills", "topic": "Setting a Purpose and Asking Questions", "lesson": "Asking questions while you read", "texts": []}, {"unit": "Comprehension Skills", "topic": "Main Topic and Summarizing", "lesson": "Identify fiction and nonfiction", "texts": []}, {"unit": "Comprehension Skills", "topic": "Main Topic and Summarizing", "lesson": "Determine the main topic of a text", "texts": []}, {"unit": "Comprehension Skills", "topic": "Main Topic and Summarizing", "lesson": "Determine the main idea of a paragraph", "texts": []}, {"unit": "Comprehension Skills", "topic": "Main Topic and Summarizing", "lesson": "Understand how main topics, main ideas, and supporting details fit together", "texts": []}, {"unit": "Comprehension Skills", "topic": "Main Topic and Summarizing", "lesson": "Determine the main topic of a text using the 5Ws and an H", "texts": []}, {"unit": "Comprehension Skills", "topic": "Main Topic and Summarizing", "lesson": "Summarize texts", "texts": []}, {"unit": "Comprehension Skills", "topic": "Key Individuals, Events, and Ideas", "lesson": "Identify key individuals, events, and ideas in an informational text", "texts": []}, {"unit": "Comprehension Skills", "topic": "Key Individuals, Events, and Ideas", "lesson": "Analyze chronological relationships", "texts": []}, {"unit": "Comprehension Skills", "topic": "Key Individuals, Events, and Ideas", "lesson": "Analyze cause and effect relationships", "texts": []}, {"unit": "Comprehension Skills", "topic": "Key Individuals, Events, and Ideas", "lesson": "Analyze compare and contrast relationships", "texts": []}, {"unit": "Comprehension Skills", "topic": "Key Individuals, Events, and Ideas", "lesson": "Understand how transition words and phrases signal relationships or interactions between key individuals, events, and ideas", "texts": []}, {"unit": "Comprehension Skills", "topic": "Key Individuals, Events, and Ideas", "lesson": "Explain the relationship between two or more individuals, events, or ideas", "texts": []}, {"unit": "Comprehension Skills", "topic": "Key Individuals, Events, and Ideas", "lesson": "Use specific textual evidence to support an explanation of a relationship between two or more individuals, events, or ideas", "texts": []}, {"unit": "Comprehension Skills", "topic": "Themes", "lesson": "Identify the directly stated theme of a literary text", "texts": []}, {"unit": "Comprehension Skills", "topic": "Themes", "lesson": "Use characters' development to determine the theme", "texts": ["Read the story. Then answer the questions that follow.\n\nTanisha's Shoe\nby Heather Henderson\n\nTanisha sat in her room, putting the finishing touches on a going-away card she was making for her grandma, who she and her mom would be driving to the Louis Armstrong International Airport in a few minutes. \nTanisha and her grandma had always been close. Now, her grandma would be moving away from New Orleans to take care of Tanisha’s great grandma, Nanna, who lived all the way in Colorado. As her grandma’s departure date neared, Tanisha had grown sadder. It just didn’t seem fair that she wouldn’t get to see her grandma every day as she had her entire life!\nAs she contemplated all this, a framed picture of her and her grandma holding a glittering shoe caught her eye. The picture was from the Muses parade at last year's Mardi Gras. The Muses were an all-women’s Mardi Gras society, and the most sought-after \"throw\" from their parade was a glittery, specially decorated women’s heeled shoe. Tanisha remembered how much fun they had catching beads, moonpies, and Mardi Gras medallions. As the end of the parade neared, a glittering shoe came flying from one of the floats. Tanisha jumped way up in the air and caught it! Tanisha was so excited she jumped around and threw her hands up in the air, dancing to the beat of the marching bands.\nLater, when Tanisha and her grandma walked back to the car, Tanisha was still glowing over her prized shoe. Suddenly, Tanisha heard the sound of a little girl crying. “I’m sorry, Toni,” the woman next to her was saying. “I don’t know what happened to it. Someone must have snatched it when I wasn’t looking.”  \nThe little girl, who couldn’t have been older than four years old, continued to cry. “I wanted the shoe, Mommy!” she said between sobs. “It’s not fair.” \nTanisha walked up to the little girl. “Hey!” she said. “You know, I have an extra shoe I can give you!” she handed it to the little girl, whose face immediately lit up. \nAfter several “thank you’s” and “are you sure’s?” from Toni's mother, Tanisha and her grandma continued to their car. Her grandma put her hand on her shoulder. “That was a wonderful thing you did back there,” she said. \n“Yeah,” said Tanisha. “I figured she needed it more than me.” She sighed. “But now, I still don't have a Muses shoe!\"\n“Do you remember what it looked like?” Her grandma asked.\n\"Sure!” answered Tanisha. “It was purple and gold and glittery, with red and blue designs!”\n“Well,” said her grandmother, “as long as you can think of it and see it in your mind, it will always be there, that beautiful shoe. But now it’s with someone who needed it even more than you. and that makes its glow even more beautiful.”\nAs Tanisha remembered that night, she thought about her grandma’s words, and pictured her smiling face. “That’s right,” she thought. “Right now, Nanna needs Grandma more than I do. But I can still think about her, and even call and visit her! She’s not really gone, just in a different place with someone who needs her.”\nAnd with that thought, she took one last look at the parade picture and then headed to the door. She didn’t want to miss the chance to give her grandma extra hugs before she left.", "Read the story. Then answer the questions that follow.\n\nHow the Camel Got His Humps\nby Rudyard Kipling\n\nIn the beginning of years, when the world was new and the Animals were just beginning to work for Man, there was a Camel, and he lived in the middle of a Howling Desert because he did not want to work. When anybody spoke to him he said “Humph!” Just “Humph!” and no more.\nPresently the Horse came to him on Monday morning, with a saddle on his back and a bit in his mouth, and said, “Camel, O Camel, come out and trot like the rest of us.”\n“Humph!” said the Camel; and the Horse went away and told the Man.\nPresently the Dog came to him, with a stick in his mouth, and said, “Camel, O Camel, come and fetch and carry like the rest of us.”\n“Humph!” said the Camel; and the Dog went away and told the Man.\nPresently the Ox came to him, with the yoke on his neck and said, “Camel, O Camel, come and plough like the rest of us.”\n“Humph!” said the Camel; and the Ox went away and told the Man.\nAt the end of the day the Man called the Horse and the Dog and the Ox together.\nHe said, “Three, O Three, I’m very sorry for you (with the world so new-and-all); but that Humph-thing in the Desert can’t work, or he would have been here by now, so I am going to leave him alone, and you must work double-time to make up for it.”\nThat made the Three very angry, and they held a meeting on the edge of the Desert; and the Camel came, chewing on milkweed and laughing at them. Then he said “Humph!” and went away again.\nPresently there came along the Magician in charge of All Deserts, rolling in a cloud of dust, and he stopped to talk with the Three.\n“Magician of All Deserts,” said the Horse, “is it right for any one to be idle, with the world so new-and-all?”\n“Certainly not,” said the Magician.\n“Well,” said the Horse, “there’s a thing in the middle of your Howling Desert with a long neck and long legs, and he hasn’t done a stroke of work since Monday morning. He won’t trot.”\n“Whew!” said the Magician, whistling, “that’s my Camel, I’d bet my gold on it! What does he say about it?”\n“He says “Humph!” said the Dog; “and he won’t fetch and carry.”\n“Does he say anything else?”\n“Only ‘Humph!’, and he won’t plough,” said the Ox.\n“Very good,” said the Magician. “Kindly wait a minute.”\nThe Magician rolled himself up in his dust-cloak, and took a bearing across the desert, and found the Camel most ‘scruciatingly idle, looking at his own reflection in a pool of water.\n“My long and bubbling friend,” said the Magician, “what’s this I hear of your doing no work?”\n“Humph!” said the Camel.\nThe Magician sat down, with his chin in his hand, and began to think of a Great Magic. The Camel looked at his own reflection in the pool of water.\n“You’ve given the Three extra work ever since Monday morning, all on account of your idleness,” said the Magician.\n“Humph!” said the Camel.\n“I shouldn’t say that again if I were you,” said the Magician. “You might say it once too often.”\nAnd the Camel said “Humph!” again; but no sooner had he said it than he saw his back, that he was so proud of, puffing up and puffing up into a great big lolloping ‘humph.’\n“Do you see that?” said the Magician. “That’s your very own humph that you’ve brought upon your very own self by not working. Today is Thursday, and you’ve done no work since Monday, when the work began. Now you are going to work.”\n“How can I,” said the Camel, “with this ‘humph’ on my back?”\n“That’s made a-purpose,” said the Magician, “all because you missed those three days. You will be able to work now for three days without eating, because you can live on your ‘humph’; and don’t you ever say I never did anything for you. Come out of the Desert and go to the Three.”\nThen the Camel went away to join the Three, becoming as hard a worker as any. And from that day to this, the Camel always wears a humph (we call it “hump” now, not to hurt his feelings); but he has never yet caught up with the three days that he missed at the beginning of the world, and he is careful never to say “humph” (though he’s known to spit sometimes)."]}, {"unit": "Comprehension Skills", "topic": "Themes", "lesson": "Use characters' responses to challenges to determine the theme", "texts": ["Read this story. As you read, pay attention to how the main character responds to challenges. Use her responses to help you determine the theme.\n\nSushi\nBy Peter Rhomberg\n\nIt was my first day at the new school, and I was about as nervous as I could be. My mom had to move a lot for her work, so my dad and I ended up following her all over the world. On the one hand, it was cool that I was usually the only person in my class to have seen the Louvre in Paris and Mt. Fuji in Japan. But on the other hand, having to move every few months and never being able to make friends was really difficult.\nMy teacher, an old man named Mr. Kropp, welcomed me warmly. Mr. Kropp asked me to introduce myself to the class.\n“Hello. Um.” I paused as the eyes of my new classmates stared at me. How long would I even know these people for? Could I even become friends with any of them? “Um, so my name’s Kendra. I just moved here from Okinawa, Japan. But I was born in St. Louis. My favorite color is green, and my favorite food is sushi… I guess that’s it.”\nA kid in the back of the class with the largest afro I had ever seen raised his hand. “What’s sushi?”\n“Raw fish.”\nThe entire class made a noise of disgust. At lunchtime, though, a few of the kids sat with me and asked me about the other weird foods I had tried.\nThat night I had an idea.\n“Hey, Dad? Can we make sushi for my lunch tomorrow? I met some kids at school who might try some.”\nMy dad raised his eyebrow. He always did this when something interested him. He ran his hand over his shaved head. “Well, well, well. Made some friends already, have you? I’m proud of you! Took you long enough at your last school!”\n“Dad!”\nHe laughed. “Sure, we can make some sushi for you tomorrow.\"\nThe next day at lunch, Jayson, Cara, and Eric sat with me.\n“What the heck are those?” asked Eric when he saw the tightly wrapped sushi rolls in my lunch box.\n“This is… sushi. And I brought enough to share.”\nI spent the rest of lunch convincing them to try a piece. I taught them how to dip it in the soy sauce and—if they were brave—how to put the tiniest bit of wasabi on the top of the roll before they popped the sushi into their mouths.\n“Wow, it’s actually really good. You know, for raw fish,” said Jayson right before he popped another roll into his mouth.\nAs I walked home that afternoon, I realized something. I had made some new friends.", "Read this story. As you read, pay attention to how the main character responds to challenges. Use his responses to help you determine the theme.\n\nA Heap of Work\nOld Uncle Samuel… he was my great-uncle, I think. Well, that man could do a heap of work. He would hitch the plow to his old mule Penny and make dark, rich furrows in the soil out back on his property. It was not out back of much—just a little shack where he lived with a wood-burning stove, a few blankets, and a little chest of clothes. He would put his clothes through every abuse that could be visited on them in the course of ordinary farm labor. Once a week, a sister of his threw his clothes in with her own family's laundry. Otherwise, I hardly like to think what state they would have been in. That man—he could work!\nWell, he was not only a hardworking soul, but also a generous one. He gave away everything he did not strictly need. So, there were plenty of folks that wanted to help out Old Samuel. When the tractors came around, all those folks wanted real bad to introduce that man to \"modern farming.\" They thought it would make his life easier, and ease was something Old Samuel had never known. They liked ease, all those well-meaning folks. But, as much as they thought they knew best, Old Samuel had little interest in ease. They suggested tractors, and they offered tractors. They started to nag him, and they would not let up. This went on for a few seasons, troubling Old Samuel to no end. They insisted, they pressed, and they pestered. Old Samuel got to where he had had enough.\nFinally, Cassandra from up the dirt road sent her grown son Neville out Samuel's way with their tractor. \"Don't you come back until you've helped him plow that field,\" she told him. \"That fellow ought to finally get a bit of rest at his age, whether he wants it or not. Don't take no for an answer!\"\nSo, Neville knocked on the door of Old Samuel's shack and said, \"I brought the tractor up to plow your field.\" Well, Samuel politely said he did not hardly need it, as he had said so many times before. He had his mule and his plow, and he knew his own field.\n\"Mama's insisting,\" said Neville apologetically. \"I can't say it's any of my business, but you know Mama.\" Well, Old Samuel did know Cassandra. He stood there in the doorway for a moment, thinking. At last, he shrugged and offered Neville a drink of water before the younger man started.\nNeville told me later that while he worked that tractor, he saw Old Samuel glancing out at him from time to time. At the end of the plowing, Samuel came out and stooped down at the edge of the field. He took a handful of turned-up earth and let it crumble through his fingers, looking strangely sad. He rose and walked Neville back to the house.\n\"Well, I thank you kindly, Neville,\" he said, putting another cool glass of water in the young man's hand.\nNeville felt a bit proud of how quick the tractor's work was done, and he went fishing for a compliment. \"It does fast work, doesn't it?\"\n\"That it does,\" Samuel said with a distracted air. He was looking over the field like it was a stranger squatting on his property. Samuel thanked him again and sent him back to Cassandra.\nNeville passed that way a few days later and saw Old Samuel plowing with his mule. Neville felt irritated at Samuel's awful stubbornness. He stopped and walked over to the field.\n\"Any trouble, Samuel?\" asked Neville.\n\"My boy,\" he said, \"I thank you kindly for your efforts, but that tractor of yours just don't know the land the way Penny and I do.\"\nNow, Neville was a farmer, and he knew his business. But he had never really stopped to look at the furrows of a mule compared to ones made by a machine. That day, he did. And, boy, did he see! A feeling of awe crept all over him as he studied Samuel's furrows, mapping the curves and flows that this patch of earth seemed to crave. The plow had cut a giant fingerprint that matched the lay of the land, allowing rainfall to move right where it was needed, managing the slight tilt of the ground in a way that made the sunshine land just right, allowing the earth to stretch out comfortably somehow. These were the furrows the land wanted.\nNow, for Neville it was just a glimpse, but he said it felt like he was seeing for a moment what Old Samuel saw every time he looked out at that beloved field. Suddenly, Neville remembered with a shudder the aggressive, oblivious furrows his tractor had plowed heedlessly into that beautiful patch of earth. Old Samuel looked at Neville and seemed to know what he was thinking. \"Young folks always want to go fast,\" Samuel said quietly. \"Too fast to really see anything.\""]}, {"unit": "Comprehension Skills", "topic": "Themes", "lesson": "Identify the theme of a drama", "texts": ["Read the play below.\n\nThe Selfish Woman\nby Augusta Stevenson\n\nTIME: yesterday\nPLACE: the village\n\nWOMAN\nBEGGAR\n\n[The SELFISH WOMAN is taking cakes from her oven. There is a knock at the door.]\n\nWOMAN. Enter!\n\n[The BEGGAR enters. She wears a long cloak.]\n\nBEGGAR. I am hungry, good woman. Will you give me a cake?\n\nWOMAN. The cakes are too large to give away. I will make a cake for you.\n\n[She makes a very small cake and puts it in the oven.]\n\nBEGGAR. I thank you, good woman.\n\n[The woman takes the cake from the oven.]\n\nWOMAN. This cake is too large to give away. I will make another cake for you.\n\n[She makes a very, very small cake and puts it in the oven.]\n\nBEGGAR. I thank you, good woman.\n\n[The woman takes the cake from the oven.]\n\nWOMAN. This cake is too large to give away. I will give you a slice of bread.\n\n[She cuts a slice from a loaf of bread.]\n\nBEGGAR. I thank you—\n\nWOMAN. A slice is too much to give away. Here is a crust for you.\n\n[The beggar shakes her head.]\n\nBEGGAR. May you never taste cake again! May the very cake in your mouth seem to be crust! If you will not give, you shall not have!\n\nWOMAN. Go, go!\n\n[The beggar throws off her cloak; a FAIRY is seen.]\n\nWOMAN. A Fairy! You are a Fairy?\n\nFAIRY. I am the Fairy of Good Deeds. You would not give—you shall not have!\n\n[The Fairy goes.]\n\nWOMAN. As if cake could ever taste like bread! 'Tis impossible—impossible!\n\n(She eats a cake.)\n\nWhat is this? I seem to be eating crust, dry crust. I'll try another cake.\n\n(She eats another cake.)\n\nWhy, this too changes to crust! Ah me! The Fairy's words were true. I would not give, I cannot have. Ah me! Ah me!", "Read the play below.\n\nThe Blind Men\nby Augusta Stevenson\n\n\nTIME: a year ago.\nPLACE: India.\n\nTHE DRIVER.\nTHE SIX BLIND MEN.\n\n[The SIX BLIND MEN stand by the roadside, begging. The DRIVER comes with his elephant.]\n\nBLIND MEN. A penny, sir! A penny!\n\nDRIVER (throwing pennies). There, and there, and there! Now out of the way with you! I must take my elephant by.\n\nFIRST BLIND MAN. I have never seen an elephant, sir.\n\nOTHER BLIND MEN. Nor I! Nor I!\n\nDRIVER. Do you know what he is like?\n\nBLIND MEN. No, sir! No, sir!\n\nDRIVER. Would you like to touch him?\n\nBLIND MEN. Yes! Yes!\n\nDRIVER. Come, then, and stand by him.\n\nFIRST BLIND MAN (placing hand on elephant's side). Well, well! Now I know all about him! He is exactly like a wall!\n\nSECOND BLIND MAN (feeling the tusk). He is not like a wall! He is round and smooth and sharp. He is like a spear.\n\nTHIRD BLIND MAN (feeling the trunk). Both of you are wrong. He is like a snake.\n\nFOURTH BLIND MAN (feeling a leg). Oh, how blind you are! He is round and tall like a tree!\n\nFIFTH BLIND MAN (feeling an ear). Why, he is exactly like a great fan!\n\nSIXTH BLIND MAN (feeling the tail). This elephant is not like a wall, or a spear, or a snake, or a tree, or a fan. He is exactly like a rope.\n\nDRIVER. Ha, ha, ha!\n\n[He goes, driving elephant and laughing.]\n\nFIRST BLIND MAN. Ha, ha, ha! Hear how he laughs at you!\n\nSECOND BLIND MAN. He laughs at you and the others.\n\nTHIRD BLIND MAN. He does not laugh at me!\n\nFOURTH BLIND MAN. I say he laughs at you and the others.\n\nFIFTH BLIND MAN. You cannot say he laughs at me!\n\nSIXTH BLIND MAN. He laughs at all of you! He knows I spoke the truth.\n\n[He goes.]\n\nOTHER BLIND MEN. Hear him! Hear him!\n\n[They go their different ways, shaking their fingers angrily at each other.]"]}, {"unit": "Comprehension Skills", "topic": "Themes", "lesson": "Identify the theme of a poem", "texts": []}, {"unit": "Comprehension Skills", "topic": "Themes", "lesson": "Identify multiple themes in one or more story", "texts": ["Text 1:Maria's Quinceañera\nMaria looked at herself in the mirror. She felt uncomfortable. Her sleeves were too puffy. Her face looked unnatural in all her makeup. Lupita, her sister, saw Maria's sour expression. Lupita signed with her hands, \"What's wrong, Maria? You look beautiful.\"\nMaria's face melted into a sort of smile. She signed back, \"Thank you. I just feel strange. Did you feel like you became an adult at your quinceañera?\"\nLupita smiled, \"Oh, is that what you're worried about? You know, it's not really about becoming an adult. That's just what an old, traditional quinceañera was. These days, it's just a celebration that girls have on their fifteenth birthdays. You won't be expected to act like an adult right away!\"\n\"No, it's not that,\" signed Maria. \"It's just that I've felt grown up for a long time. It feels silly to have everyone gather around to celebrate something that I feel already happened.\"\nLupita laughed. \"Typical Maria! It's true—you are an old soul. Old enough to realize that Mamá and Papi might need this party even if you don't.\"\nMaria nodded thoughtfully. She looked at herself in the mirror. Unnatural, maybe, but she did look pretty. Her sister had worked so hard on her makeup. \"Lupita,\" she signed, \"you're right—I look amazing.\" Lupita smiled broadly at her sister.\n\ntext 2:\nRead the two stories.\nThe Art Show\nWhen I first saw the newspaper advertisement about the community painting competition, I was so excited. Yet, now that I had submitted my work, I felt silly. My age group spanned from zero- to thirteen-year-olds. That meant that some of my competition could be as much as two years older than me! I stood no chance.\nThe day of the art show arrived, and my family and I went to see it after school. We walked slowly through the art display area for fourteen- to twenty-year-olds on our way to my section. The paintings were beautiful. Some were full of bright colors. Others were subdued and sad. Every painting made me feel like I knew the artist. I felt that I could have matched each painting with its maker if I had both in front of me. I could almost feel them becoming my friends.\nWhen I entered the room for my age group, my jaw dropped. I walked by painting after painting. Finger-paintings made in bright primary colors. Watercolors with dogs bigger than houses. \"Oh, no,\" I said, blushing deeply. Every painting but my own was by a small child.\nDying of embarrassment, I whispered, \"Let's just leave!\"\nMy mother said, \"Let's go see your painting anyway. At least you're sure to have the blue ribbon.\"\nI groaned. Nothing could be worse than winning a competition against a bunch of little kids' paintings.\nAt that moment, I saw my own painting: a gentle waterfall slipping motionless into a river below. Despite my mood, it was soothing to see the water's beautiful reflections of the trees. Seeing my artwork was like glimpsing an old friend, ready to comfort me.\nHowever, there was no blue ribbon on my painting. Instead, one had been attached to the next painting over: a smeary blue donkey or rabbit of some kind, hovering in the middle of a white page with no background. I pitied my little snubbed waterfall for having to sit there, ignored and misplaced.\nSeized by a sudden thought, I carefully took it down from the wall and brought it into the room for the older kids' work. I found a blank area on the wall and hung it up.\n\"I think you'll be happier here,\" I told the painting. \"These are our friends.\"\n\nAuction\nIn the auction house, Mr. Alex Polinski sat on the edge of his seat. Whether he won the bidding or not, he was about to see a sketch by Rembrandt in person. He hoped he would win. He had loved Rembrandt as long as he could remember.\nAlex almost felt like they were friends. The dark spaces that surrounded Rembrandt's subjects reminded Alex of the times of sadness in his life. The bright light directly on the faces reminded him of how things always got better.\nAnd now, he just might bring home one of this great man's own sketches!\nAlex craned his neck to see the sketch when they brought it out. It was everything he'd hoped for. The bidding started low, but it rose quickly. Soon, it was only Alex and a sharply dressed man in stylish sunglasses. Each of them raised the bid again and again. Alex started to sweat. They were about to hit the limit of his funds.\nHe heard himself call out the last number—all of the money he could spend. The other man's voice answered coldly with a higher bid. It was over. Alex had lost.\nAlex sat in shock for a few minutes. The other pieces of art each sold, one by one. Finally, the auction ended.\nAlex wandered over to the sketch to get one last look. Its new owner was standing in front of it. The man was telling his assistant, \"I'll call my driver, and then you can carry that other one and this Rember or whoever it was out to the van.\"\nAs they walked away, Alex stepped closer to see the sketch. He could hardly believe the injustice of that man bringing home Rembrandt's work when he didn't even know his name. Yet, as he looked at the sketch, Alex's imagination filled in the gaps in the unfinished work. From familiarity, he could tell what Rembrandt had been planning. He could almost see the darkness and light. As always, it soothed him to imagine that brightness popping out of the shadow.", "Text 1:\nFiona's Move\nAs Fiona walked past Marco's lawn, he didn't want to notice that her face was covered in tears. But he noticed. He glanced up and down their street. No one else was around to help her.\nMarco sighed silently. Feelings were not exactly his strength. He got off the porch swing and ran down to the sidewalk. \"Wait, Fiona!\" Marco called out. \"What's going on?\"\nWith a few breaks in her voice, Fiona answered, \"My family is moving.\"\nMarco nodded. \"Where are you going?\"\n\"The Sea of Tranquility,\" she answered. The Moon, then. With the colonies on the Moon and Mars becoming so popular, it was hardly surprising. \"I won't even be able to call anyone on Earth,\" she said. \"Even letters will take weeks to reach me. And no one will ever visit me.\"\n\"Sounds lonely,\" Marco admitted. He wasn't really sure what to say. Then, he had an idea. \"You know, I can see the Moon from here. How about this: on the night of every full Moon, I'll come outside at nine and wave to you. You won't be able to see me, but you'll know I'm waving. And you can wave back.\"\nA little smile flicked across Fiona's face, but she said, \"It won't be the same.\"\n\"Maybe doing things the same is kind of overrated,\" Marco said. \"I mean, you'll probably be the first kid in history to have someone wave at you from like 200 thousand miles away. You don't get that by staying the same.\"\nFiona smiled, \"Well, that's true. I guess there will be a lot of firsts for me.\"\n\"Right,\" Marco said. \"It's all in how you look at it.\"\n\"You know, I think it will be less lonely,\" she admitted, \"knowing that someone down here is waving at me.\"\n\ntext 2;:\nRead the two stories.\nAn Old Friend\nNadir and his mother were walking down an aisle at the grocery store when his mother started waving at another woman.\n\"Nadir,\" his mother said, \"Look who it is!\" Nadir looked at the young woman. He had a faint sense that he knew her eyes.\n\"Oh, Mrs. Hadi, he won't remember me!\" she laughed.\n\"He should, after all you did for him!\" replied Mrs. Hadi.\n\"Nadir,\" said the woman. \"I'm Christina. I used to babysit you a long time ago.\"\n\"Not just babysit!\" Mrs. Hadi said. Nadir looked at Christina's face and thought of rushing rain. \"Oh, Nadir, she was watching you one night, and the most awful storm blew into town. Winds and rain you wouldn't believe. Your father and I couldn't leave the restaurant. I was going mad, worried about my little baby! Power lines fell, and we couldn't get home! The power went out. Christina lit candles and cuddled you close for hours while the house got colder and colder around her. She didn't sleep all night, just held onto you and kept you warm.\"\nChristina said, \"Oh, please don't, Mrs. Hadi. You're making him uncomfortable. He can't remember!\"\nNadir could almost hear the sound of rain when she spoke. Nadir said, \"It's true, I can't really remember.\" He felt self-conscious and strange, greeted by this person who had once sacrificed so much to keep him warm and healthy. This person whom he had casually forgotten about. Or had he?\n\"How could you forget her?\" His mother was mystified. \"She did so much for you.\"\n\"Don't worry about it,\" Christina said. \"You were such a little thing then. You couldn't possibly remember. It's just nice to see you safe and sound and looking so grown up.\"\nHer voice brought back the feeling of being wrapped in blankets and breathing cool air. Was he remembering? Or, was it just his imagination? He reached out to shake her hand, saying, \"I'll remember you from now on. Thank you.\"\n\nFamily Memories\nLeo yawned as his uncle brought out another box of old pictures. When Leo's parents had told him about the family trip to California, he had imagined something very different from this. Beaches, theme parks, movie stars. Now, here he was, looking over family photos with Uncle Sergio.\nHis uncle pulled out one of a woman whom Leo had never seen before. \"Oh, here's your great-aunt Catalina,\" said his uncle. \"Boy, what an amazing person she was. She moved from her old, failing farm in Nebraska out to California. She was sure she could make a better life here, but it was hard going. She barely scraped by for years and years. Every penny she could spare, she sent back to take care of her parents' family. She was the oldest, and her parents and younger siblings weren't in great shape. They wouldn't have made it without her help. And then, neither of us would be here!\"\nLeo shrugged, \"I've never heard of her.\"\n\"Funny how these great things we do just get forgotten, isn't it?\" Uncle Sergio said, slowly. He looked thoughtfully at the picture. \"Just think about it: someone can give up all those years, and nobody remembers.\"\nLeo yawned a second time. He knew that Uncle Sergio expected him to feel grateful. He didn't. He had never met this great-aunt, and looking at pictures wouldn't change that. \"I think I'll call it a night,\" Leo said. Sadness and surprise spread over his uncle's face. Leo shrugged it off and walked away."]}, {"unit": "Comprehension Skills", "topic": "Themes", "lesson": "Differentiate between main ideas and supporting details", "texts": []}, {"unit": "Comprehension Skills", "topic": "Themes", "lesson": "Identify who, what, where, when, why and how in a story", "texts": ["Read the story and ask yourself the questions who, what, where, when, why and how.\n\nAdapted from \"The Mad Scientist\"\nBy Joy Kita\n\nThe mad scientist's house was at the end of a long road lined with alternating red and yellow maple trees. Matt Nelson rode in the front with his mom and couldn’t help but feel a strange sense of unease as they drove up the sweeping driveway.\nMatt stepped from the car and stared up at the white colonial house that would be his prison for the next two hours.\n“I’m telling you, Mom, something just doesn’t feel right.”\n“Matty,” she said, “you are suspicious of everything.\"\nIt was all so unfair. Just because he had an off-the-charts IQ and a penchant for finding trouble did not mean he should be shipped off for some mad scientist to study his brain.\nMatt entered the mad scientist's house and found another boy waiting in the hallway.\n\"I'm Jay, and my IQ is higher than my combined classmates',\" the boy said.\nMatt nodded and explained that he also had a high IQ. Matt was used to being the smartest person in any room.\nSoon the mad scientist joined them.\n\"Hello boys,\" he said. \"Let's get this test started.\"\nMatt and Jay both stood up, but before they could follow the mad scientist out of the room, a giant spider came crawling towards them.\nMatt didn't like spiders, and he quickly ran as far away from the giant beast as possible. The spider followed.\n\"Don't move,\" Jay yelled. \"Spiders can sense motion. If we don't move, he won't be able to find us.\"\nMatt and Jay froze. The spider crept along the wall, searching for prey to eat. Finally, the spider wandered out of the same door that the mad scientist had walked through.\n\"Thanks,\" Matt told his new friend. \"I didn't know spiders could only see motion. I thought I knew everything, but you taught me something new today.\"", "Read the story and ask yourself the questions who, what, where, when, why and how.\n\nAdapted from \"Arctic Adventure\"\nBy Joy Kita\n\nAnguta had been born to an Inuit family in the Arctic. He was born in 1957. It was a time of great change. His ancestors had always lived in small communities and survived by hunting, fishing, and working together. Anguta was part of a new generation, though. He was going to go to the white man's school.\nIn 1964, when he was 7 years old, Anguta begged his father to let him go to school. He assumed that having an education would help him in the future. He wanted to become a veterinarian so that he could learn how to take care of the animals his family depended on.\nAnguta was so excited for his first day of school. He couldn't wait to write on a chalkboard, open up fresh new books, and learn to read and write.\nBut on the first day of school, Anguta felt very out of place. All the other children were white. They stared at his clothes. They whispered about him and giggled when he walked by. Anguta missed his family. They were only a few hours away, but it felt like another world.\nLunch time was even worse. The foods the lunch ladies served were so bland and mushy. Anguta missed the rich caribou meat that his mother usually served for the midday meal.\nFor several days, Anguta struggled to get used to all the new things at school. For several nights, he cried himself to sleep in the dormitory.\nThen, at the start of his second week, Anguta realized that he needed to make a choice. He could choose to be a veterinarian and focus on his education, even if it meant leaving his old life behind. Or he could return home to the familiar sights, sounds, and tastes of his childhood and let go of his dream.\nIn the end, Anguta chose his education. He missed his family and friends from home and visited as often as possible. The longer he stayed at school, though, the less homesick he felt. By the end of the school year, he was proud of himself for having made such a tough decision. He was on his way to becoming a veterinarian."]}, {"unit": "Comprehension Skills", "topic": "Quoting Text", "lesson": "Use quotes to answer questions", "texts": []}, {"unit": "Comprehension Skills", "topic": "Quoting Text", "lesson": "Make inferences about a text", "texts": []}, {"unit": "Comprehension Skills", "topic": "Cite Quoted Evidence", "lesson": "Quote explicit textual evidence to support answer", "texts": []}, {"unit": "Comprehension Skills", "topic": "Cite Quoted Evidence", "lesson": "Make an inference", "texts": []}, {"unit": "Comprehension Skills", "topic": "Cite Quoted Evidence", "lesson": "Quote textual evidence to support an inference", "texts": []}, {"unit": "Comprehension Skills", "topic": "Cite Quoted Evidence", "lesson": "Recognize weak evidence", "texts": []}, {"unit": "Comprehension Skills", "topic": "Characters, Settings, and Main Events", "lesson": "Identify character traits", "texts": ["Read this excerpt and then answer the questions that follow.\n\nAn Excerpt from The Secret Garden\nby Frances Hodgson Burnett\n\nShe walked back into the first kitchen-garden she had entered and found the old man digging there. She went and stood beside him and watched him a few moments in her cold little way. He took no notice of her and so at last she spoke to him.\n\"I have been into the other gardens,\" she said.\n\"There was nothin' to prevent thee,\" he answered crustily.\n\"I went into the orchard.\"\n\"there was no dog at th' door to bite thee,\" he answered.\nThere was no door there into the other garden,\" said Mary.\n\"What garden? He said in a rough voice, stopping his digging for a moment.\n\"The one on the other side of the wall,\" answered Mistress Mary. \"There are trees there—I saw the tops of them. A bird with a red breast was sitting on one of them and he sang.\"\nTo her surprise the surly old weather-beaten face actually changed its expression. A slow smile spread over it and the gardener looked quite different. It made her think that it was curious how much nicer a person looked when he smiled. She had not thought of it before.\nHe turned about to the orchard-side of his garden and began to whistle—a low soft whistle. She did not understand how such a surly man could make such a coaxing sound. Almost the next moment a wonderful thing happened. She heard a soft little rushing flight through the air—and it was the bird with the red breast flying to them, and he actually alighted on the big clod of earth quite near to the gardener's foot.\n\"Here he is,\" chuckled the old man, and then he spoke to the bird as if he were speaking to a child.", "Re-read this excerpt and then answer the questions that follow.\n\nAn Excerpt from The Secret Garden\nby Frances Hodgson Burnett\n\nShe walked back into the first kitchen-garden she had entered and found the old man digging there. She went and stood beside him and watched him a few moments in her cold little way. He took no notice of her and so at last she spoke to him.\n\"I have been into the other gardens,\" she said.\n\"There was nothin' to prevent thee,\" he answered crustily.\n\"I went into the orchard.\"\n\"there was no dog at th' door to bite thee,\" he answered.\nThere was no door there into the other garden,\" said Mary.\n\"What garden? He said in a rough voice, stopping his digging for a moment.\n\"The one on the other side of the wall,\" answered Mistress Mary. \"There are trees there—I saw the tops of them. A bird with a red breast was sitting on one of them and he sang.\"\nTo her surprise the surly old weather-beaten face actually changed its expression. A slow smile spread over it and the gardener looked quite different. It made her think that it was curious how much nicer a person looked when he smiled. She had not thought of it before.\nHe turned about to the orchard-side of his garden and began to whistle—a low soft whistle. She did not understand how such a surly man could make such a coaxing sound. Almost the next moment a wonderful thing happened. She heard a soft little rushing flight through the air—and it was the bird with the red breast flying to them, and he actually alighted on the big clod of earth quite near to the gardener's foot.\n\"Here he is,\" chuckled the old man, and then he spoke to the bird as if he were speaking to a child."]}, {"unit": "Comprehension Skills", "topic": "Characters, Settings, and Main Events", "lesson": "Compare and contrast characters", "texts": ["Read the passage and answer the questions that follow.\n\nLillian Parker was the meanest girl in the entire fifth grade at Bayview Elementary School. She and her group of friends found every opportunity to terrorize classmates with mean comments. Somehow, a teacher was never within hearing distance, so Lillian's victims were on their own.\nI'd never been one of Lillian's regular targets. We didn't sit near one another in class, and I only rarely saw her. But one day, we had a showdown in the hallway.\nAmy Rosa was a quiet girl who kept to herself most of the time. I was in a group with her in science class one day, and I could tell that she was really smart.\nLillian had cornered Amy at her locker, and I overheard her saying that Amy would never have any friends besides her books. Amy started to respond, but Lillian just talked over her. \"Oh, you have something to say? That's new.\" Suddenly, I knew that I had to say something.\n\"Actually, Lillian, I am Amy's friend. As for you, are you sure that your friends aren't just your friends so that you won't bully them like everyone else?\"\n\"Wh...wh...what? Of course not,\" Lillian stuttered.\n\"Being mean to people doesn't make you look cool. Lillian, it makes you look like a mean person. Let's go, Amy.\"\nAs we walked away, I looked back and saw Lillian with surprise and confusion still on her face.", "Read the excerpt and answer the questions that follow.\n\nAn Excerpt from \"How the Whale Got His Throat\"\nby Rudyard Kipling\n\nIn the sea, once upon a time, O my Best Beloved, there was a Whale, and he ate fishes. He ate the starfish and the garfish, and the crab and the dab, and the plaice and the dace, and the skate and his mate, and the mackereel and the pickereel, and the really truly twirly-whirly eel. All the fishes he could find in the sea he ate with his mouth—so! Till at last there was only one small fish left in all the sea.\nHe swam a little behind the Whale's right ear, so as to be out of harm's way.\nThen the Whale stood up on his tail and said, \"I'm hungry.\"\nAnd the small 'Stute Fish said in a small 'stute voice, \"Noble and generous Cetacean, have you ever tasted Man?\"\n\"No,\" said the Whale. \"What is it like?\"\n\"Nice,\" said the small 'Stute fish. \"Nice, but nubbly.\"\n\"Then fetch me some,\" said the Whale, and he made the sea froth up with his tail."]}, {"unit": "Comprehension Skills", "topic": "Characters, Settings, and Main Events", "lesson": "Identify how protagonists and antagonists contribute to a story", "texts": ["Tex 1:The Space Child\nFiona sat down beside Argothon on the playground bench and put her arm around his feathery shoulders. \"I'm sorry about what Avalyn said,\" Fiona told him. \"She just doesn't understand.\" Fiona knew it wasn't just Avalyn. Most of the human kids in her school were either scared of or mean to the children from space. Since Argothon was the only space child in Fiona's class, it was especially hard for him.\n\"I wish my parent didn't make me go to this school,\" Argothon murmured. His eyes and gills looked shrunken, which Fiona knew was the alien equivalent of crying.\nAs Fiona was trying to think of a response, Avalyn walked by the two of them. \"Really, Fiona,\" Avalyn said, \"aren't you afraid of getting space germs?\"\nFiona stood up and looked at the other girl gravely. \"Avalyn, that isn’t funny. You need to stop. Argothon has feelings, just like you and me—why can't you understand that?\"\nFiona's response took Avalyn off guard. The girl was obviously a little surprised to be confronted, and she had nothing to say. She shuffled off to another group of kids.\nFiona settled in beside Argothon again. After a few moments of silence, the space child said, \"Thank you, friend.\"\n\nText2:\nCompetition\nFor years, Mrs. Gersche had been selling old-fashioned cameos, silhouettes cut from black paper. She had perfected her art over the decades, and she had reached the point where she cut four or five people's cameos every day in a little studio.\nThat was all before Head over Heels came to theaters. The big romantic finale of the movie featured a couple getting cameos made together. The movie had been wildly popular, and now every couple wanted a cameo of themselves. Date nights, anniversaries, engagements, birthdays. And she was the only one around who made them. Mrs. Gersche was suddenly cutting fifteen to twenty cameos a day, and she found it exhausting.\nThen, just as suddenly as it had begun, the rush eased. She was cutting ten a day now, which she loved. After a little poking around, Mrs. Gersche learned that someone else in the city had begun cutting cameos, easing the rush on her own business.\nMrs. Gersche decided to visit her new colleague. When she reached the little office, she was greeted by a young woman. \"Hi, I'm Angela,\" the young woman said, coldly accepting a handshake. She looked hard at Mrs. Gersche. \"So, you're the competition.\"\n\"Oh, hardly—I'm grateful that you've opened your business,\" said Mrs. Gersche, a warm smile filling her wrinkled face. \"It was getting too busy for me alone.\" The other woman's face revealed doubt and suspicion. Surprised, Mrs. Gersche stammered out, \"I just wanted to thank you for relieving the madness and ask if I can help you at all with getting your business started. I've been doing this a long time, and I'd be delighted to help you.\"\n\"I see what you're doing: coming here to point out how new I am to this business,\" Angela snapped. \"Flaunting your experience.\"\nMrs. Gersche answered, \"I'm sorry. I think you've misunderstood.\"\nAngela pointed a finger at her. \"You need to understand who you're up against. I never, ever give up. There is no way you're going to win, no matter how many years of experience you have on me!\"\nMrs. Gersche was absolutely dumbfounded. She excused herself uncomfortably and left.\nShe wasn't entirely surprised as her number of customers increased again over the next few months. Many referred to bad reviews about the other cameo artist's attitude.", "Text1:\nSecret Ingredient\n\"Have you identified any items that are missing?\" Officer Martinez asked with his pen hovering over his paper. Only half of the bakery's lights were on. The owner had only gotten that far before realizing that a burglary had occurred.\n\"Oh, yes,\" the baker, a man named Abram, answered with a regretful shake of his head. \"Someone's taken the entire supply of the secret ingredient for our Pumpkin Surprise Loaf.\"\nThe police officer's pen just lingered in the air. \"And…what is that?\"\nThe baker was aghast. \"Oh, I can't tell you! I can't tell anyone the secret ingredient. We're all sworn to secrecy.\"\nMartinez's eyes flicked up to the man's face. Was the baker serious? \"I promise I won't tell anyone that it's the secret ingredient, but it's going to be impossible to investigate the theft of some mysterious, unnamed…thing.\"\nAbram's eyebrows knit suddenly, and he growled out, \"Not so hard as you might think! The Red Ribbon Bakery has been after that recipe for years. They'd love nothing more than to find out what's inside and sell their own version! I'm sure they're behind this. I just know it!\"\nFrustration bloomed in Officer Martinez's soul. Did this man know nothing about search warrants? Arrest warrants? Probable cause? The officer let out an even breath. Where to begin? \"Well, we can open the investigation based on other thefts. Was anything else stolen?\"\n\"No,\" the baker answered. \"They didn't touch the cash register or the safe. We haven't discovered anything else out of place.\"\nMartinez nodded. \"Then you've got two options: you can tell me specifically what was stolen, or you can accept that there will be no investigation.\"\nAbram looked absolutely dumbfounded. \"I told you who did it, though! If we go search Red Ribbon right now, I'm sure we'll find—\"\n\"We can't. I can't even begin the paperwork to search a private business if you can't report what was stolen.\"\nAbram's lips drew into a tight frown. \"So, you're going to let them get away with it?\"\n\"I'm trying to help you,\" Officer Martinez sighed. \"Just tell me what was stolen, and we'll try to see justice done.\"\nThe baker gave a proud shake of his head, and that was that. The officer left the bakery with a blank notepad in hand.\n\nText 2:\nHibernation\nAsha looked over the report that had just been handed to her. The search team of the Starship Galileo, on which she lived and worked, had discovered an abandoned settlement on a new planet. This was nothing unusual: the mission of the Starship Galileo was to find extinct or abandoned settlements in order to harvest materials that had been left behind. Asha's job was to go into such settlements to direct the extraction of materials.\nJust a few days later, Asha and her team prepared themselves to shuttle down to the planet in a small star craft. She sat down beside the co-leader of the team, Martin, and began to input the flight codes. Soon, they were on their way to the settlement.\nWhen they landed, everyone sprang to their usual jobs. But as Asha began to walk the halls, she noticed strange pods along the walls. \"Martin, come here,\" she said. \"Look at these. They look like hibernation pods.\"\nWithout much attention, Martin glanced at the long row of pods. \"I don't think we need to harvest any materials from those.\"\n\"We can't harvest anything. If there are hibernation pods, there might still be people living here,\" Asha said, rubbing dust from a transparent pane on the front of a pod. Through it, she could see the outline of a face within.\n\"The scans didn't reveal any life forms,\" Martin said dismissively. \"They may be failed hibernation pods. I'm sure that happens sometimes.\"\nAsha shook her head. \"Martin, I think these people are sleeping. We need to leave everything the way we found it. All of these things belong to them.\"\n\"You're being over-cautious,\" Martin said. \"There hasn't been activity here in a hundred years. We can't just turn around and leave for no reason. It isn't fair to our team. It isn't fair to the crew of the Galileo.\"\nAsha stared into the pod, trying to determine whether or not she was looking at a living face. Her lack of familiarity with this kind of alien made it impossible. She finally said, \"I'm not comfortable with this. Our mission requires us only to take materials that are unneeded. These people may still be planning to use everything here.\"\nMartin huffed, \"Well, I'm not willing to sign off on abandoning the mission.\"\nAsha was shocked at Martin's refusal. She fumbled over her words: \"If we can't agree, we need to contact the captain of the Galileo. She is the final authority over this team.\"\nTwenty minutes later, Asha breathed a sigh of relief as they signed off the call with Captain Hamill. She had instructed them to leave everything untouched. The Galileo would be moving on."]}, {"unit": "Comprehension Skills", "topic": "Characters, Settings, and Main Events", "lesson": "Identify setting", "texts": ["Read the passage and answer the questions that follow.\n\nAn Excerpt from \"The Pirate's Predicament\"\nby Kimberly Myers\n\nThe pirate ship glided through the water. Small waves lapped against the hull, but the water was calm. It gave the crew time to think about what might lie ahead on the sandy beaches they were approaching.\nKillian's thoughts drifted back to the day he became a pirate. Even though he now considered the men aboard the Jolly Roger his family, he hadn't joined them of his own free will. He'd been taken from a merchant ship. He had been hiding below deck, but one of the men, the one he now knew as \"Bones,\" scooped him up and carried him to the Jolly Roger.\nFrom Killian's right, Bones said, \"We're about to make landfall, kid.\" Killian looked up and saw that the boat was now in the shallows just off the island.\nMoments later, Killian splashed onto the beach. He paused a moment and waited for his shipmates and their captain to assemble. The sun shone brightly, and the jungle at the boundary of the beach promised adventure for Killian and his pirate family."]}, {"unit": "Comprehension Skills", "topic": "Characters, Settings, and Main Events", "lesson": "Compare and contrast settings", "texts": ["Text 1:\nRead the excerpt and answer the questions that follow.\n\nAn Excerpt from \"Snow Battle\"\nby Daniel C. Beard\n\nPassage 1\nIt was a year when the Indian-summer had been prolonged into the winter. Christmas had come and gone and a new year begun, but no snow had fallen on the riverbank or neighboring hills.\nSuch was the condition of things one January morning, in a Kentucky town, upon the banks of the Ohio river, where I and some sixty other boys were gathered in a little frame schoolhouse.\nWe had made up our minds that old Jack Frost was a humbug, and winter a myth; but when the bell tapped for recess, the first boy out gave a shout which passed from mouth to mouth, until it became a universal cheer as we reached the playground, for, floating airily down from a dull, gray sky came myriads of white snowflakes!\nWinter had come! Jack Frost was no longer a humbug! Before the bell again recalled us to our study, the ground was whitened with snow, and the school divided into two opposing armies. That night was a busy one. All hands set to work manufacturing ammunition sleds and shields for the coming battle. There was not a boy late next morning—in fact, when the teachers arrived to open the school, they found all the scholars upon the playgrounds, rolling huge snowballs. All night the snow had continued to fall, and it was now quite deep. When we went out at noon, a beautifully modeled fort of snowy whiteness stood ready for us, and from a mound in the center floated the battle flag.\nOur company took their places inside the fortifications. We could see the enemy gathered around their captain at their camp, some two hundred yards distant, their ammunition sleds loaded with snowballs. The lieutenant bore their battle flag.\nOur teachers showed their interest by standing shivering with wet feet in the deep snow to watch the battle. At a blast from a tin horn, on rushed the foe! They separated, and came in two divisions, approaching us from the left and right.\n“Now, boys!” cried our captain. Don’t throw a ball until they’re within range.”\n\nPassage 2\nThe school-bell called us, fresh and glowing with exercise and healthful excitement, to our lessons. The battle was left undecided, and our fort was soon captured by a force stronger than any our companions were able to bring against it, for a warm south wind sprang up from the lowlands down the river, our fortification quickly yielded to its attack and the snow campaign was over.\n\nText 2:\nRead the passage and answer the questions that follow.\n\nAn Excerpt from \"The Expedition\"\nby Kimberly Myers\n\n“Dad. Dad!” Christopher hissed through the darkness. He could barely make out the form of his father already sitting up at the rough table on the other side of the tent. “Is it time to go?”\n“Not yet, Chris. The sun hasn’t even peeked over the canopy yet.”\nChristopher sighed and rolled lazily out of bed. A moment before, he had been poised to spring out of bed at one word from his father.\nThe inside of the tent was gradually becoming lighter as the minutes ticked by. Christopher glanced around at the surroundings that had been their home for the last week of preparation. The small cots pushed off to the sides were the sole furnishings, save for the table and single chair.\nThe inside of the tent was still, but outside, the campsite was already in motion, with people setting up or breaking down camp. The pair of Christopher and his father had been at the base of the rainforest assembling the necessary supplies and waiting for the ideal weather conditions before beginning their month-long trip into the thick of the jungle.\nAn hour later, Christopher looked back at the empty patch of ground where the tent had been. One backward glance, and then they were off.\nTwo steps in and the stillness of the jungle closed around them, erasing any memory of the campsite. The tendrils of the vines trailed down, beckoning Christopher further into the rainforest. The campsite had been open and sun-filled. Now, barely a ray of sunlight filtered down to the forest floor. As they continued, Christopher knew they were only yards away, but he felt miles away from the bustling energy of the camp.", "Text1 :\nRead the excerpt and answer the questions that follow.\n\nAn Excerpt from \"The Quest for the Golden Horn\"\nby Joy Kita\n\nJairus stood at the entrance to the Diamond Forest. The path was wide and clear from brush, and wild flowers grew along its border. Nothing had ever looked so welcoming, yet great fear stewed inside of him. His hands shook and his feet refused to move. He gripped the satchel tied to his waist and thought about the items inside. Mint, flower, and meat...he supposed he would just know what to do with them.\n“Stand aside, boy, before you get trampled.”\nA man dressed in animal hides and layered with weapons gave him a shove. Jairus managed to remain on his feet, but barely caught himself before he fell headlong into the Diamond Forest.\nHe watched as man after man jogged into the forest before deciding on taking the risk himself. So far, no rogue fairy had taken anyone out yet. Perhaps it was safe. He ran down the path and soon came upon the other men who had gone before him. Some had fallen and lay gasping for breath on the ground, while others were only beginning to shake and twist.\nIt was as if a voice spoke directly into his ear and told him what to do. Jairus opened his satchel and pulled out the mint leaves. Holding them up to his nose, he continued running. Some of the men reached out to him, but he continued on without stopping. They all had murderous looks in their eyes that frightened Jairus and pushed him faster down the path. He breathed in the spicy scent of mint and didn’t think of what was poisoning the others.\nThe landscape changed as Jairus rounded a corner. Instead of the tall warrior-like trees that guarded the entrance, these trees were wide and blocked out the sky. Jairus heard a loud buzz and saw a cloud of insects flying his way. The bright yellow jackets stood out against the dark backdrop of the Diamond Forest. He wasn’t sure what to do, wasn’t sure what they would do, so he stood and waited. The insects stopped in front of him and formed a barrier, a formidable wall that appeared impenetrable.\nJairus remembered the flower in his bag. He pulled it out and threw it over his shoulder. The insects zoomed away after the morsel and left the path free and clear. He wondered at this strange quest, wondered at the king’s motives, and why the old woman was helping him. Before he could think on it any more, he heard a ragged roar filled with rage. All around him the trees were blackened, scorched by fire.\nThe dragon was close.\n\n\ntext2:\nRead the two excerpts from the same story and answer the questions that follow.\n\n\nAn Excerpt from “The Time Shop”\nby John Kendrick Bangs\n\nPassage 1\nOf course it was an extraordinary thing for a clock to do, especially a parlor clock, which one would expect to be particularly dignified and well-behaved, but there was no denying the fact that the clock did it. With his own eyes, Bobby saw it wink, beckon to him with its hands. To be sure, he had never noticed before that the Clock had eyes, or that it had any fingers on its hands to beckon with, but the thing happened in spite of all that, and as a result Bobby became curious. He was stretched along the rug in front of the great open fireplace, where he had been drowsily gazing at the blazing log for a half an hour or more, and looking curiously up at the Clock’s now smiling face, he whispered to it.\n“Are you beckoning to me?” he asked, rising up on his hands and knees.\n“Of course I am,” replied the Clock in a soft, silvery tone, just like a bell, in fact. “You didn’t think I was beckoning to the piano, did you?”\n\nPassage 2\n“Close your eyes, count seventeen backward, then open your eyes again and you’ll see what you will see.”\nBobby’s eyes shut; I was going to say with a snap. He counted from seventeen back to one with a rapidity that would have surprised even his school-teacher, opened his eyes again and looked around, and what he saw—well, that was more extraordinary than ever! Instead of standing on the parlor rug before the fireplace, he found himself in the broad aisle of the ground floor of a huge department store, infinitely larger than any store he had ever seen in his life before, and oh, dear me, how dreadfully crowded it was! The crowd of Christmas shoppers that Bobby remembered to have seen last year when he had gone out to buy a lead-pencil to put into his father’s stocking was as of nothing to that which thronged this wonderful place."]}, {"unit": "Comprehension
