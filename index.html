lids just as well. She looked perplexed for a moment, and then said, not fiercely, but still loud enough for the furniture to hear:\n\"Well, I lay if I get hold of you I'll—\"\nShe did not finish, for by this time she was bending down and punching under the bed with the broom, and so she needed breath to punctuate the punches with. She resurrected nothing but the cat.\n\"I never did see the beat of that boy!\"\nShe went to the open door and stood in it and looked out among the tomato vines and \"jimpson\" weeds that constituted the garden. No Tom. So she lifted up her voice at an angle calculated for distance and shouted:\n\"Y-o-u-u TOM!\"\nThere was a slight noise behind her and she turned just in time to seize a small boy by the slack of his roundabout and arrest his flight.\n\"There! I might 'a' thought of that closet. What you been doing in there?\"\n\"Nothing.\"\n\"Nothing! Look at your hands. And look at your mouth. What IS that truck?\"\n\"I don't know, aunt.\"\n\"Well, I know. It's jam—that's what it is. Forty times I've said if you didn't let that jam alone I'd skin you. Hand me that switch.\"\nThe switch hovered in the air—the peril was desperate—\n\"My! Look behind you, aunt!\"\nThe old lady whirled round, and snatched her skirts out of danger. The lad fled on the instant, scrambled up the high board-fence, and disappeared over it.\nHis Aunt Polly stood surprised a moment, and then broke into a gentle laugh.\n\"Hang the boy, can't I never learn anything? Ain't he played me tricks enough like that for me to be looking out for him by this time? But old fools is the biggest fools there is. Can't learn an old dog new tricks, as the saying is. But my goodness, he never plays them alike, two days, and how is a body to know what's coming? He 'pears to know just how long he can torment me before I get my dander up, and he knows if he can make out to put me off for a minute or make me laugh, it's all down again and I can't hit him a lick. I ain't doing my duty by that boy, and that's the Lord's truth, goodness knows. Spare the rod and spoil the child, as the Good Book says. I'm a laying up sin and suffering for us both, I know, but laws-a-me! He's my own dead sister's boy, poor thing, and I ain't got the heart to lash him, somehow. Every time I let him off, my conscience does hurt me so, and every time I hit him my old heart most breaks. Well-a-well, man that is born of woman is of few days and full of trouble, as the Scripture says, and I reckon it's so. He'll play hookey this evening, and I'll just be obleeged to make him work, tomorrow, to punish him. It's mighty hard to make him work Saturdays, when all the boys is having holiday, but he hates work more than he hates anything else, and I've GOT to do some of my duty by him, or I'll be the ruination of the child.\"\nTom did play hookey, and he had a very good time.", "Read the following excerpt and pay attention to the key ideas in the text.\nAdapted from\nPandora\nBy Nathaniel Hawthorne\n\nLong, long ago, when this old world was in its tender infancy, there was a child, named Epimetheus, who never had either father or mother; and, that he might not be lonely, another child, fatherless and motherless like himself, was sent from a far country, to live with him, and be his playfellow and helpmate. Her name was Pandora.\nIt is thousands of years since Epimetheus and Pandora were alive; and the world, nowadays, is a very different sort of thing from what it was in their time. Then, everybody was a child. They needed no fathers and mothers to take care of the children; because there was no danger, nor trouble of any kind, and no clothes to be mended, and there was always plenty to eat and drink. Whenever a child wanted his dinner, he found it growing on a tree. No labor to be done, no tasks to be studied; nothing but sports and dances, and sweet voices of children talking or gushing out in merry laughter throughout the livelong day. It was a pleasant life indeed.\nThe first thing that Pandora saw, when she entered the cottage where Epimetheus dwelt, was a great box. The edges and corners of the box were carved with most wonderful skill. Around the margin there were figures of graceful men and women, and the prettiest children ever seen, reclining or sporting amid a profusion of flowers and foliage; and these various objects were so exquisitely represented, and were wrought together in such harmony, that flowers, foliage, and human beings seemed to combine into a wreath of mingled beauty. But here and there, peeping forth from behind the carved foliage, Pandora once or twice fancied that she saw a face not so lovely, or something or other that was disagreeable, and which stole the beauty out of all the rest. Nevertheless, on looking more closely, and touching the spot with her finger, she could discover nothing of the kind. Some face, that was really beautiful, had been made to look ugly by her catching a sideways glimpse at it.\nAlmost the first question that Pandora put to Epimetheus, after crossing the threshold, was this: \"Epimetheus, what have you in that box?\"\n\"My dear little Pandora,\" answered Epimetheus, \"that is a secret, and you must be kind enough not to ask any questions about it. The box was left here to be kept safely, and I do not myself know what it contains.\"\n\"But who gave it to you?\" asked Pandora. \"And where did it come from?\"\n\"That is a secret, too,\" replied Epimetheus.\n\"How provoking!\" exclaimed Pandora, pouting her lip. \"I wish the great ugly box were out of the way!\"\n\"Oh come, don't think of it any more,\" cried Epimetheus. \"Let us run out of doors, and have some nice play with the other children.\"\n\"You might open it,\" said Pandora, looking sideways at Epimetheus, \"and then we could see for ourselves.\"\n\"Pandora, what are you thinking of?\" exclaimed Epimetheus.\nPandora stood gazing at the box. It was fastened; not by a lock, nor by any other such contrivance, but by a very intricate knot of gold cord. There appeared to be no end to this knot, and no beginning. Never was a knot so cunningly twisted, nor with so many ins and outs, which roguishly defied the skillfulest fingers to disentangle them. And yet, by the very difficulty that there was in it, Pandora was the more tempted to examine the knot, and just see how it was made.\n\"What can it be?\" thought Pandora. \"Is there something alive in the box? Well!—yes!—I am resolved to take just one peep! Only one peep; and then the lid shall be shut down as safely as ever! There cannot possibly be any harm in just one little peep!\"\nEpimetheus himself, although he said very little about it, had his own share of curiosity to know what was inside. Perceiving that Pandora was resolved to find out the secret, he determined that his playfellow should not be the only wise person in the cottage.\nAs Pandora raised the lid, the cottage grew very dark and dismal for the black cloud had now swept quite over the sun, and seemed to have buried it alive. There had, for a little while past, been a low growling and muttering, which all at once broke into a heavy peal of thunder. But Pandora, heeding nothing of all this, lifted the lid nearly upright, and looked inside. It seemed as if a sudden swarm of winged creatures brushed past her, taking flight out of the box, while, at the same instant, she heard the voice of Epimetheus, with a lamentable tone, as if he were in pain.\n\"Oh, I am stung!\" cried he. \"I am stung! Naughty Pandora! Why have you opened this wicked box?\"\nPandora let the lid fall, and, starting up, looked about her, to see what had befallen Epimetheus. The thundercloud had so darkened the room that she could not very clearly discern what was in it. But she heard a disagreeable buzzing, as if a great many huge flies, or gigantic mosquitoes were darting about. And, as her eyes grew more accustomed to the imperfect light, she saw a crowd of ugly little shapes, with bats' wings, looking abominably spiteful, and armed with terribly long stings in their tails. It was one of these that had stung Epimetheus. Nor was it a great while before Pandora herself began to scream, in no less pain and fright than her playfellow, and making a vast deal more hubbub about it. An odious little monster had settled on her forehead, and would have stung her, I know not how deeply, if Epimetheus had not run and brushed it away.\nNow, if you wish to know what these ugly things might be, which had made their escape out of the box, I must tell you that they were the whole family of earthly Troubles. There were evil Passions; there were a great many species of Cares; there were more than a hundred and fifty Sorrows; there were Diseases, in a vast number of miserable and painful shapes; there were more kinds of Naughtiness than it would be of any use to talk about. In short, everything that has since afflicted the souls and bodies of mankind had been shut up in the mysterious box, and given to Epimetheus and Pandora to be kept safely, in order that the happy children of the world might never be afflicted by them. Had they been faithful to their trust, all would have gone well. No grown person would ever have been sad, nor any child have had cause to shed a single tear, from that hour until this moment.\nAll the flowers and dewy blossoms on earth, not one of which had hitherto faded, now began to droop and shed their leaves after a day or two. The children, moreover, who before seemed immortal in their childhood, now grew older, day by day, and came soon to be youths and maidens, and men and women by and by, and aged people, before they dreamed of such a thing.\nMeanwhile, the naughty Pandora, and hardly less naughty Epimetheus, remained in their cottage. Both of them had been grievously stung, and were in a good deal of pain, which seemed the more intolerable to them, because it was the very first pain that had ever been felt since the world began. Of course, they were entirely unaccustomed to it and could have no idea what it meant. Besides all this, they were in exceedingly bad humor, both with themselves and with one another. In order to indulge it to the utmost, Epimetheus sat down sullenly in a corner with his back towards Pandora; while Pandora flung herself upon the floor and rested her head on the fatal and abominable box. She was crying bitterly and sobbing as if her heart would break.\nSuddenly there was a gentle little tap on the inside of the lid.\n\"What can that be?\" cried Pandora, lifting her head.\nBut either Epimetheus had not heard the tap, or was too much out of humor to notice it. At any rate, he made no answer.\n\"You are very unkind,\" said Pandora, sobbing anew, \"not to speak to me!\"\nAgain the tap! It sounded like the tiny knuckles of a fairy's hand, knocking lightly and playfully on the inside of the box.\n\"Who are you?\" asked Pandora, with a little of her former curiosity. \"Who are you, inside of this naughty box?\"\nA sweet little voice spoke from within: \"Only lift the lid, and you shall see.\"\n\"No, no,\" answered Pandora, again beginning to sob, \"I have had enough of lifting the lid! You are inside of the box, naughty creature, and there you shall stay! There are plenty of your ugly brothers and sisters already flying about the world. You need never think that I shall be so foolish as to let you out!\"\nShe looked towards Epimetheus, as she spoke, perhaps expecting that he would commend her for her wisdom. But the sullen boy only muttered that she was wise a little too late.\n\"Ah,\" said the sweet little voice again, \"you had much better let me out. I am not like those naughty creatures that have stings in their tails. They are no brothers and sisters of mine, as you would see at once, if you were only to get a glimpse of me. Come, come, my pretty Pandora! I am sure you will let me out!\"\nSo, with one consent, the two children again lifted the lid. Out flew a sunny and smiling little personage, and hovered about the room, throwing a light wherever she went. Have you never made the sunshine dance into dark corners, by reflecting it from a bit of looking-glass? Well, so looked the winged cheerfulness of this fairy-like stranger, amid the gloom of the cottage. She flew to Epimetheus, and laid the least touch of her finger on the inflamed spot where the Trouble had stung him, and immediately the anguish of it was gone. Then she kissed Pandora on the forehead, and her hurt was cured likewise.\nAfter performing these good offices, the bright stranger fluttered sportively over the children's heads, and looked so sweetly at them, that they both began to think it not so very much amiss to have opened the box, since, otherwise, their cheery guest must have been kept a prisoner among those naughty imps with stings in their tails.\n\"Pray, who are you, beautiful creature?\" inquired Pandora.\n\"I am to be called Hope!\" answered the sunshiny figure. \"And because I am such a cheery little body, I was packed into the box, to make amends to the human race for that swarm of ugly Troubles, which was destined to be let loose among them. Never fear! We shall do pretty well in spite of them all.\"\n\"Your wings are colored like the rainbow!\" exclaimed Pandora. \"How very beautiful!\"\n\"Yes, they are like the rainbow,\" said Hope, \"because, glad as my nature is, I am partly made of tears as well as smiles.\"\n\"And will you stay with us,\" asked Epimetheus, \"forever and ever?\"\n\"As long as you need me,\" said Hope, with her pleasant smile, \"and that will be as long as you live in the world—I promise never to desert you. There may come times and seasons, now and then, when you will think that I have utterly vanished. But again, and again, and again, when perhaps you least dream of it, you shall see the glimmer of my wings on the ceiling of your cottage. Yes, my dear children, and I know something very good and beautiful that is to be given you hereafter!\"\n\"Oh tell us,\" they exclaimed, \"tell us what it is!\"\n\"Do not ask me,\" replied Hope, putting her finger on her rosy mouth. \"But do not despair, even if it should never happen while you live on this earth. Trust in my promise, for it is true.\"\n\"We do trust you!\" cried Epimetheus and Pandora, both in one breath.\nAnd so they did; and not only they, but so has everybody trusted Hope, that has since been alive. And to tell you the truth, I cannot help being glad—(though, to be sure, it was an uncommonly naughty thing for her to do)—but I cannot help being glad that our foolish Pandora peeped into the box. No doubt—no doubt—the Troubles are still flying about the world, and have increased in multitude, rather than lessened, and are a very ugly set of imps, and carry most venomous stings in their tails. I have felt them already, and expect to feel them more, as I grow older. But then that lovely and lightsome little figure of Hope! What in the world could we do without her? Hope spiritualizes the earth; Hope makes it always new; and, even in the earth's best and brightest aspect, Hope shows it to be only the shadow of an infinite bliss hereafter!"]}, {"unit": "Comprehension Skills", "topic": "Summaries", "lesson": "Write an objective summary", "texts": []}, {"unit": "Comprehension Skills", "topic": "Analyzing Texts", "lesson": "Identify explicit and implicit information", "texts": []}, {"unit": "Comprehension Skills", "topic": "Analyzing Texts", "lesson": "Cite textual evidence to support a claim", "texts": []}, {"unit": "Comprehension Skills", "topic": "Analyzing Texts", "lesson": "Make an inference", "texts": []}, {"unit": "Comprehension Skills", "topic": "Analyzing Texts", "lesson": "Cite textual evidence to support an inference", "texts": []}, {"unit": "Comprehension Skills", "topic": "Analyzing Texts", "lesson": "Identify weak evidence", "texts": []}, {"unit": "Comprehension Skills", "topic": "Analyzing Texts", "lesson": "Evaluate sources", "texts": []}, {"unit": "Comprehension Skills", "topic": "Analyzing Texts", "lesson": "Choose the strongest evidence to support an idea", "texts": []}, {"unit": "Comprehension Skills", "topic": "Analyzing Texts", "lesson": "Use evidence to analyze a text", "texts": []}], "8": [{"unit": "Comprehension Skills", "topic": "Setting a Purpose and Asking Questions", "lesson": "Establish a purpose for reading a text", "texts": []}, {"unit": "Comprehension Skills", "topic": "Setting a Purpose and Asking Questions", "lesson": "Generate questions about texts to deepen understanding", "texts": []}, {"unit": "Comprehension Skills", "topic": "Central Ideas and Summaries", "lesson": "Determine the main idea using the 5Ws and an H", "texts": []}, {"unit": "Comprehension Skills", "topic": "Central Ideas and Summaries", "lesson": "Determine the central idea by analyzing the ideas in each paragraph.", "texts": []}, {"unit": "Comprehension Skills", "topic": "Central Ideas and Summaries", "lesson": "Determine the central idea of a text", "texts": []}, {"unit": "Comprehension Skills", "topic": "Central Ideas and Summaries", "lesson": "Paraphrase central ideas and significant supporting information in a text", "texts": []}, {"unit": "Comprehension Skills", "topic": "Central Ideas and Summaries", "lesson": "Use a variety of transition words to convey relationships between and among ideas", "texts": []}, {"unit": "Comprehension Skills", "topic": "Central Ideas and Summaries", "lesson": "Write an objective summary", "texts": []}, {"unit": "Comprehension Skills", "topic": "Citing Textual Evidence", "lesson": "Cite textual evidence to support a claim", "texts": ["Read the following passage, which continues the story from the lesson.\n\nAdapted from\nDavid Copperfield\nBy Charles Dickens\n\nMy mother knew that evening that the time had come for my birth and immediately dispatched a loyal servant to fetch the nurse and doctor.\nThe nurse and the doctor were considerably astonished, when they arrived within a few minutes of each other, to find an unknown lady of portentous1 appearance, sitting before the fire, with her bonnet tied over her left arm, stopping her ears with cotton. Miss Betsey did not introduce herself, so she was quite a mystery in the parlor; and the cotton in her ears did not detract from the solemnity of her presence.\nThe doctor, Mr. Chillip, having been upstairs and come down again, and having satisfied himself, I suppose, that there was a probability of this unknown lady and himself having to sit there, face to face, for some hours, laid himself out to be polite and social. He was the meekest of his sex, the mildest of little men. He sidled in and out of a room, to take up the less space. He walked as softly as the Ghost in Hamlet, and more slowly. It is nothing to say that he hadn't a word to throw at a dog. He couldn't have thrown a word at a mad dog. He might have offered him one gently, or half a one, or a fragment of one; for he spoke as slowly as he walked; but he wouldn't have been rude to him, and he couldn't have been quick with him, for any earthly consideration.\nMr. Chillip, looking mildly at my aunt with his head on one side, and making her a little bow, said, in allusion to the cotton, as he softly touched his left ear:\n“Some hurt or irritation, ma'am?”\n“What!” replied my aunt, Miss Betsey, pulling the cotton out of one ear like a cork.\nMr. Chillip was so alarmed by her abruptness—as he told my mother afterwards—that it was a mercy he didn't lose his presence of mind. But he repeated sweetly:\n“Some irritation, ma'am?”\n“Nonsense!” replied my aunt, and corked herself again, at one blow.\nMr. Chillip could do nothing after this, but sit and look at her feebly, as she sat and looked at the fire, until he was called upstairs again. After some quarter of an hour's absence, he returned.\n“Well?” said my aunt, taking the cotton out of the ear nearest to him.\n“Well, ma'am,” returned Mr. Chillip, “we are—we are progressing slowly, ma'am.”\n“Ba—a—ah!” said my aunt, with a perfect shake on the contemptuous interjection. And she corked her ears up as before to drown out any noise.\nReally—really—as Mr. Chillip told my mother, he was almost shocked; speaking in a professional point of view alone, he was almost shocked. But he sat and looked at her, notwithstanding, for nearly two hours, as she sat looking at the fire, until he was again called out. After another absence, he again returned.\n“Well?” said my aunt, taking out the cotton on that side again.\n“Well, ma'am,” returned Mr. Chillip, “we are—we are progressing slowly, ma'am.”\n“Ya—a—ah!” said my aunt with such a snarl at him that Mr. Chillip absolutely could not bear it. It was really calculated to break his spirit, he said afterwards. He preferred to go and sit upon the stairs, in the dark, until he was again sent for.\nThe mild Mr. Chillip was glad to finally the deliver the child that he had come to deliver. He sidled into the parlor as soon as he was at liberty, and said to my aunt in his meekest manner:\n“Well, ma'am, I am happy to congratulate you.”\n“What upon?” said my aunt, sharply.\nMr. Chillip was fluttered again, by the extreme severity of my aunt's manner; so he made her a little bow and gave her a little smile, to mollify2 her.\n“Mercy on the man, what's he doing!” cried my aunt, impatiently. “Can't he speak?”\n“Be calm, my dear ma'am,” said Mr. Chillip, in his softest accents.\n“There is no longer any occasion for uneasiness, ma'am. Be calm.”\nIt has since been considered almost a miracle that my aunt didn't shake him, and shake what he had to say, out of him. She only shook her own head at him, rather violently.\n“Well, ma'am,” resumed Mr. Chillip, as soon as he had courage, “I am happy to congratulate you. All is now over, ma'am, and well over.”\nDuring the five minutes or so that Mr. Chillip devoted to the delivery of this oration3, my aunt eyed him narrowly.\n“How is she?” said my aunt, folding her arms with her bonnet still tied on one of them.\n“Well, ma'am, she will soon be quite comfortable, I hope,” returned Mr. Chillip. “Quite as comfortable as we can expect a young mother to be, under these circumstances. There cannot be any objection to your seeing her presently, ma'am. It may do her good.”\n“And SHE. How is SHE?” said my aunt, sharply.\nMr. Chillip tilted his head a little, and looked at my aunt like an amiable bird.\n“The baby,” said my aunt. “How is she?”\n“Ma'am,” returned Mr. Chillip, “I thought you had known. It's a boy.”\nMy aunt said never a word, but took her bonnet by the strings, in the manner of a sling, aimed a blow at Mr. Chillip's head with it, put it on bent, walked out, and never came back. She vanished like a discontented fairy, and never came back any more.\n\n1. portentous means serious or impressive\n2. mollify means to calm\n3. oration means speech", "Read the following passage, which is an excerpt of a novel.\n\nHeidi\nBy Johanna Spyri\n\nHeidi lived with her grandfather in a hut on the side of a mountain where she tended goats. She never went to school or left the mountain. One day, before the dinner bowls had been cleared away in the hut, a visitor arrived: Aunt Dete. She had a fine feathered hat on her head, and a long trailing skirt to her dress which swept the floor, and on the floor of a goatherd's1 hut there are all sorts of things that do not belong to a dress.\nThe grandfather looked her up and down without uttering a word. But Dete was prepared with an exceedingly amiable speech and began at once to praise the looks of the child. Heidi was looking so well she should hardly have known her again, and it was evident that she had been happy and well-cared for with her grandfather; but her aunt had never lost sight of the idea of taking the child back again, for she well understood that the child must be much in his way, but she had not been able to do it at first. Day and night, however, she had thought over the means of placing the child somewhere, and that was why she had come today, for she had just heard of something that would be a lucky chance for Heidi beyond her most ambitious hopes. Some immensely wealthy relatives of the people she was serving, who had the most splendid house almost in Frankfurt, had an only daughter, young and an invalid, who was always obliged to go about in a wheeled chair; she was very much alone and had no one to share her lessons, and so the little girl seemed sad. Her father had spoken to Dete's employer about finding a companion for her, and her employer was anxious to help in the matter, as she felt so sympathetic about it. The lady-housekeeper had described the sort of child they wanted, simple-minded and unspoilt, and not like most of the children that one saw now-a-days. Dete had thought at once of Heidi and had gone off without delay to see the lady-housekeeper, and after Dete had given her a description of Heidi, she had immediately agreed to take her. And no one could tell what good fortune there might not be in store for Heidi, for if she was once with these people and they took a fancy to her, and anything happened to their own daughter—one could never tell, the child was so weakly—and they did not feel they could live without a child, why then the most unheard of luck—\n\"Have you nearly finished what you had to say?\" broke in the grandfather, who had allowed her to talk on uninterruptedly so far.\n\"Ugh!\" exclaimed Dete, throwing up her head in disgust, \"One would think I had been talking to you about the most ordinary matter; why there is not one person in all Prattigau who would not be grateful if I were to bring them such a piece of news as I am bringing you.\"\n\"You may take your news to anybody you like, I will have nothing to do with it.\"\nBut now Dete leaped up from her seat like a rocket and cried, \"If that is all you have to say about it, why then I will give you a bit of my mind. The child is now eight years old and knows nothing, and you will not let her learn. You will not send her to school, as I was told down in Dorfli, and she is my own sister's child. I am responsible for what happens to her, and when there is such a good opening for a child, as this which offers for Heidi, only a person who cares for nobody and never wishes good to any one would think of not jumping at it. But I am not going to give in, and that I tell you; I have everybody in Dorfli on my side; there is not one person there who will not take my part against you; and I advise you to think well before bringing it into court, if that is your intention; there are certain things which might be brought up against you which you would not care to hear, for when one has to do with law-courts there is a great deal raked up that had been forgotten.\"\n\"Be silent!\" thundered the grandfather, and his eyes flashed with anger. \"Go and be done with you! And never let me see you again with your hat and feather, and such words on your tongue as you come with today!\" And with that he strode out of the hut.\n\n1. A goatherd is someone who looks after goats, just as a shepherd is someone who looks after sheep. The herd of goats does not live in the hut."]}, {"unit": "Comprehension Skills", "topic": "Citing Textual Evidence", "lesson": "Make inferences", "texts": ["Read the following passage, which continues the story from the lesson.\n\nThe Time Machine\nBy H. G. Wells\n\nThe thing the Time Traveler showed us in his hand was a glittering metallic framework, scarcely larger than a small clock, and very delicately made. There was ivory in it, and some transparent crystalline substance. And now I must be explicit, for this that follows—unless his explanation is to be accepted—is an absolutely unaccountable thing. He took one of the small octagonal tables that were scattered about the room, and set it in front of the fire, with two legs on the hearthrug. On this table he placed the mechanism. Then he drew up a chair, and sat down. The only other object on the table was a small shaded lamp, the bright light of which fell upon the model. There were also perhaps a dozen candles about, two in brass candlesticks upon the mantel and several in sconces, so that the room was brilliantly illuminated. I sat in a low arm-chair nearest the fire, and I drew this forward so as to be almost between the Time Traveler and the fireplace. Filby sat behind him, looking over his shoulder. The Medical Man and the Provincial Mayor watched him in profile from the right, the Psychologist from the left. The Very Young Man stood behind the Psychologist. We were all on the alert. It appears incredible to me that any kind of trick, however subtly conceived and however adroitly done, could have been played upon us under these conditions.\nThe Time Traveler looked at us, and then at the mechanism.\n\"Well?\" said the Psychologist.\n\"This little affair,\" said the Time Traveler, resting his elbows upon the table and pressing his hands together above the apparatus, \"is only a model. It is my plan for a machine to travel through time. You will notice that it looks singularly askew, and that there is an odd twinkling appearance about this bar, as though it was in some way unreal.\" He pointed to the part with his finger. \"Also, here is one little white lever, and here is another.\"\nThe Medical Man got up out of his chair and peered into the thing.\n\"It's beautifully made,\" he said.\n\"It took two years to make,\" retorted the Time Traveler. Then, when we had all imitated the action of the Medical Man, he said: \"Now I want you clearly to understand that this lever, being pressed over, sends the machine gliding into the future, and this other reverses the motion. This saddle represents the seat of a time traveler. Presently I am going to press the lever, and off the machine will go. It will vanish, pass into future Time, and disappear. Have a good look at the thing. Look at the table too, and satisfy yourselves there is no trickery. I don't want to waste this model, and then be told I'm a quack.\"\nThere was a minute's pause perhaps. The Psychologist seemed about to speak to me, but changed his mind. Then the Time Traveler put forth his finger towards the lever. \"No,\" he said suddenly. \"Lend me your hand.\" And turning to the Psychologist, he took that individual's hand in his own and told him to put out his forefinger. So that it was the Psychologist himself who sent forth the model Time Machine on its interminable voyage. We all saw the lever turn. I am absolutely certain there was no trickery. There was a breath of wind, and the lamp flame jumped. One of the candles on the mantel was blown out, and the little machine suddenly swung round, became indistinct, was seen as a ghost for a second perhaps, as an eddy of faintly glittering brass and ivory; and it was gone—vanished! Save for the lamp the table was bare.\nEveryone was silent for a minute. Then Filby said an oath under his breath.\nThe Psychologist recovered from his stupor, and suddenly looked under the table. At that the Time Traveler laughed cheerfully. \"Well?\" Then, getting up, he went to the tobacco jar on the mantel, and with his back to us began to fill his pipe.\nWe stared at each other. \"Look here,\" said the Medical Man, \"are you in earnest about this? Do you seriously believe that that machine has traveled into time?\"\n\"Certainly,\" said the Time Traveler, stooping to light a spill at the fire. Then he turned, lighting his pipe, to look at the Psychologist's face. (The Psychologist, to show that he was not unhinged, helped himself to a cigar and tried to light it uncut.) \"What is more, I have a big machine nearly finished in there\"—he indicated the laboratory—\"and when that is put together I mean to have a journey on my own account.\"\n\"You mean to say that that machine has traveled into the future?\" said Filby.\n\"Into the future or the past—I don't, for certain, know which.\"\nWe sat and stared at the vacant table for a minute or so. Then the Time Traveler asked us what we thought of it all.\n\"It sounds plausible enough tonight,\" said the Medical Man; \"but wait until tomorrow. Wait for the common sense of the morning.\"\n\"Would you like to see the Time Machine itself?\" asked the Time Traveler. And therewith, taking the lamp in his hand, he led the way down the long, draughty corridor to his laboratory. I remember vividly the flickering light, his odd, broad head in silhouette, the dance of the shadows, how we all followed him, puzzled but incredulous, and how there in the laboratory we beheld a larger edition of the little mechanism which we had seen vanish from before our eyes. Parts were of nickel, parts of ivory, parts had certainly been filed or sawn out of rock crystal. The thing was generally complete, but the twisted crystalline bars lay unfinished upon the bench beside some sheets of drawings, and I took one up for a better look at it. Quartz it seemed to be.\n\"Look here,\" said the Medical Man, \"are you perfectly serious? Or is this a trick—like that ghost you showed us last Christmas?\"\n\"Upon that machine,\" said the Time Traveler, holding the lamp aloft, \"I intend to explore time. Is that plain? I was never more serious in my life.\"\nNone of us quite knew how to take it.\nI caught Filby's eye over the shoulder of the Medical Man, and he winked at me solemnly.", "Read the following passage, which continues the story of the Time Traveler.\n\nThe Time Machine\nBy H. G. Wells\n\nThe next Thursday I went again to Richmond—I suppose I was one of the Time Traveler’s most constant guests—and, arriving late, found four or five men already assembled in his drawing-room. The Medical Man was standing before the fire with a sheet of paper in one hand and his watch in the other. I looked round for the Time Traveler, and—\n\"It's half-past seven now,\" said the Medical Man. \"I suppose we'd better have dinner?\"\n\"Where's—?\" said I, naming our host.\n\"You've just come? It's rather odd. He's unavoidably detained. He asks me in this note to lead off with dinner at seven if he's not back. Says he'll explain when he comes.\"\n\"It seems a pity to let the dinner spoil,\" said the Editor of a well-known daily paper; and thereupon the Doctor rang the bell.\nThe Psychologist was the only person besides the Doctor and myself who had attended the previous dinner. The other men were Blank, the Editor aforementioned, a certain journalist, and another—a quiet, shy man with a beard—whom I didn't know, and who, as far as my observation went, never opened his mouth all the evening. There was some speculation at the dinner-table about the Time Traveler’s absence, and I suggested time traveling, in a half-jocular spirit. The Editor wanted that explained to him, and the Psychologist volunteered a wooden account of the \"ingenious paradox and trick\" we had witnessed last time we came to the Time Traveler’s house. He was in the midst of his exposition when the door from the corridor opened slowly and without noise. I was facing the door, and saw it first.\n\"Hallo!\" I said. \"At last!\" And the door opened wider, and the Time Traveler stood before us. I gave a cry of surprise.\n\"Good heavens! What's the matter?\" cried the Medical Man, who saw him next. And the whole tableful turned towards the door.\nHe was in an amazing plight. His coat was dusty and dirty, and smeared with green down the sleeves; his hair disordered, and as it seemed to me grayer—either with dust and dirt or because its color had actually faded. His face was ghastly pale; his chin had a brown cut on it—a cut half healed; his expression was haggard and drawn, as by intense suffering. For a moment he hesitated in the doorway, as if he had been dazzled by the light. Then he came into the room. He walked with just such a limp as I have seen in footsore tramps. We stared at him in silence, expecting him to speak.\nHe said not a word, but came painfully to the table, and made a motion towards the wine. The Editor filled a glass of champagne, and pushed it towards him. He drained it, and it seemed to do him good: for he looked round the table, and the ghost of his old smile flickered across his face.\n\"What on earth have you been up to, man?\" said the Doctor.\nThe Time Traveler did not seem to hear. \"Don't let me disturb you,\" he said, with a certain faltering articulation. \"I'm all right.\" He stopped, held out his glass for more, and took it off at a draught. \"That's good,\" he said. His eyes grew brighter, and a faint color came into his cheeks. His glance flickered over our faces with a certain dull approval, and then went round the warm and comfortable room. Then he spoke again, still as if he were feeling his way among his words. \"I'm going to wash and dress, and then I'll come down and explain things…. Save me some of that mutton. I'm starving for a bit of meat.\"\nHe looked across at the Editor, who was a rare visitor, and hoped he was all right. The Editor began a question. \"Tell you presently,\" said the Time Traveler. \"I'm—funny! Be all right in a minute.\"\nHe put down his glass, and walked towards the staircase door. Again I remarked his lameness and the soft padding sound of his footfall, and standing up in my place, I saw his feet as he went out. He had nothing on them but a pair of tattered, blood-stained socks. Then the door closed upon him. I had half a mind to follow, till I remembered how he detested any fuss about himself. For a minute, perhaps, my mind was wool-gathering. Then, \"Remarkable Behavior of an Eminent Scientist,\" I heard the Editor say, thinking (after his wont) in headlines. And this brought my attention back to the bright dinner-table.\n\"What's the game?\" said the Journalist. \"Has he been doing amateur acting? I don't follow.\" I met the eye of the Psychologist, and read my own interpretation in his face. I thought of the Time Traveler limping painfully upstairs. I don't think any one else had noticed his lameness.\nThe first to recover completely from this surprise was the Medical Man, who rang the bell—the Time Traveler hated to have servants waiting at dinner—for a hot plate. At that the Editor turned to his knife and fork with a grunt, and the Silent Man followed suit. The dinner was resumed. Conversation was exclamatory for a little while, with gaps of wonderment; and then the Editor got fervent in his curiosity. \"Does our friend eke out his modest income with a crossing? Or has he his Nebuchadnezzar* crazy phases?\" he inquired. \"I feel assured it's this business of the Time Machine,\" I said, and took up the Psychologist's account of our previous meeting. The new guests were frankly incredulous. The Editor raised objections. \"What was this time traveling? A man couldn't cover himself with dust by rolling in a paradox, could he?\" And then, as the idea came home to him, he resorted to caricature. Hadn't they any clothes-brushes in the Future? The Journalist too, would not believe at any price, and joined the Editor in the easy work of heaping ridicule on the whole thing. They were both the new kind of journalist—very joyous, irreverent young men. \"Our Special Correspondent in the Day after Tomorrow reports,\" the Journalist was saying—or rather shouting—when the Time Traveler came back. He was dressed in ordinary evening clothes, and nothing save his haggard look remained of the change that had startled me.\n\"I say,\" said the Editor hilariously, \"these chaps here say you have been traveling into the middle of next week! Tell us all about it, will you? What will you take for the lot?\"\nThe Time Traveler came to the place reserved for him without a word. He smiled quietly, in his old way. \"Where's my mutton?\" he said. \"What a treat it is to stick a fork into meat again!\"\n\"Story!\" cried the Editor.\n\"Who cares about the story!\" said the Time Traveler. \"I want something to eat. I won't say a word until I get some peptone into my arteries. Thanks. And the salt.\"\n\"One word,\" said I. \"Have you been time traveling?\"\n\"Yes,\" said the Time Traveler, with his mouth full, nodding his head.\n\"I'd give a shilling a line for a verbatim note,\" said the Editor. The Time Traveler pushed his glass towards the Silent Man and rang it with his fingernail; at which the Silent Man, who had been staring at his face, started convulsively, and poured him wine. The rest of the dinner was uncomfortable. For my own part, sudden questions kept on rising to my lips, and I dare say it was the same with the others. The Journalist tried to relieve the tension by telling anecdotes of Hettie Potter. The Time Traveler devoted his attention to his dinner, and displayed the appetite of a tramp. The Medical Man smoked a cigarette, and watched the Time Traveler through his eyelashes. The Silent Man seemed even more clumsy than usual, and drank champagne with regularity and determination out of sheer nervousness. At last the Time Traveler pushed his plate away, and looked round us. \"I suppose I must apologize,\" he said. \"I was simply starving. I've had a most amazing time.\" He reached out his hand for a cigar, and cut the end. \"But come into the smoking-room. It's too long a story to tell over greasy plates.\" And ringing the bell in passing, he led the way into the adjoining room.\n\"You have told Blank, and Dash, and Other Guy about the machine?\" he said to me, leaning back in his easy-chair and naming the three new guests.\n\"But the thing's a mere paradox,\" said the Editor.\n\"I can't argue tonight. I don't mind telling you the story, but I can't argue. I will,\" he went on, \"tell you the story of what has happened to me, if you like, but you must refrain from interruptions. I want to tell it. Badly. Most of it will sound like lying. So be it! It's true—every word of it, all the same. I was in my laboratory at four o'clock, and since then… I've lived eight days… such days as no human being ever lived before! I'm nearly worn out, but I shan't sleep till I've told this thing over to you. Then I shall go to bed. But no interruptions! Is it agreed?\"\n\n* This is a biblical allusion to King Nebuchadnezzar who was punished for his pride by a bout of insanity that lasted seven years."]}, {"unit": "Comprehension Skills", "topic": "Citing Textual Evidence", "lesson": "Support inferences with evidence", "texts": ["Read the following passage, which continues the story from the lesson.\n\nAdapted from\nTarzan of the Apes\nBy Edgar Rice Burroughs\n\nTarzan crept into the cabin that held his precious treasures. For a moment longer he watched while a number of boxes and bundles were lowered from the large boat into the little boat, then, the ape-man snatched up a piece of paper and with a pencil printed on it for a few moments, until it bore several lines of strong, well-made, almost letter-perfect characters.\nThis notice he stuck upon the door with a small sharp splinter of wood. Then gathering up his precious tin box, his arrows, and as many bows and spears as he could carry, he hastened through the door and disappeared into the forest.\nThe people who exited the boat were a strange assortment of humanity. Villainous looking seamen comprised most of the party, but there was also an elderly gentleman and a girl of about nineteen.\nThe men put down their burdens, and then one caught sight of the notice which Tarzan had posted.\n\"Hi, perfesser,\" he called, \"step for'rd and read the bloomin' notis.\"\nThus addressed, the old man came slowly to where the sailors stood, followed by the other members of his party. Adjusting his spectacles he looked for a moment at the placard and then, turning away, strolled off muttering to himself: \"Most remarkable—most remarkable!\"\n\"Hi, old fossil,\" cried the man who had first called on him for assistance, \"did ye think we wanted of you to read the bloomin' notis to yourself? Come back here and read it out loud, you old barnacle.\"\nThe old man stopped and, turning back, said: \"Oh, yes, my dear sir, a thousand pardons. It was quite thoughtless of me, yes—very thoughtless. Most remarkable—most remarkable!\"\nAgain he faced the notice and read it through, and doubtless would have turned off again to ruminate upon it had not the sailor grasped him roughly by the collar and howled into his ear.\n\"Read it out loud, you blithering old idiot.\"\n\"Ah, yes indeed, yes indeed,\" replied the professor softly, and adjusting his spectacles once more he read aloud:\n\nTHIS IS THE HOUSE OF TARZAN, THE\nKILLER OF BEASTS. DO NOT HARM THE THINGS WHICH\nARE TARZAN'S. TARZAN WATCHES.\nTARZAN OF THE APES.\n\n\"Who the devil is Tarzan?\" cried the sailor who had before spoken.\n\"He evidently speaks English,\" said a young man.\n\"But what does 'Tarzan of the Apes' mean?\" cried the girl.\n\"I do not know, Miss Porter,\" replied the young man, \"unless we have discovered a runaway simian1 from the London Zoo who has brought back a European education to his jungle home. \"What do you make of it, Professor Porter?\" he added, turning to the old man.\nProfessor Archimedes Q. Porter adjusted his spectacles.\n\"Ah, yes, indeed; yes indeed—most remarkable, most remarkable!\" said the professor; \"but I can add nothing further to what I have already remarked in elucidation2 of this truly momentous occurrence,\" and the professor turned slowly in the direction of the jungle.\n\"But, papa,\" cried the girl, \"you haven't said anything about it yet.\"\n\"Tut, tut, child; tut, tut,\" responded Professor Porter, in a kindly and indulgent tone, \"do not trouble your pretty head with such weighty and abstruse3 problems,\" and again he wandered slowly off in still another direction, his eyes bent upon the ground at his feet, his hands clasped behind him beneath the flowing tails of his coat.\n\"I reckon the daffy old bounder don't know no more'n we do about it,\" growled a rat-faced sailor.\n\"Keep a civil tongue in your head,\" cried the young man, his face paling in anger, at the insulting tone of the sailor. \"You've murdered our officers and robbed us. We are absolutely in your power, but you'll treat Professor Porter and Miss Porter with respect or I'll break that vile neck of yours with my bare hands—guns or no guns,\" and the young fellow stepped so close to the rat-faced sailor that the latter, though he bore two revolvers and a villainous looking knife in his belt, slunk back abashed.\n\"You coward,\" cried the young man. \"You'd never dare shoot a man until his back was turned. You don't dare shoot me even then,\" and he deliberately turned his back full upon the sailor and walked nonchalantly away as if to put him to the test.\nThe sailor's hand crept slyly to the butt of one of his revolvers; his wicked eyes glared vengefully at the retreating form of the young Englishman. The gaze of his fellows was upon him, but still he hesitated. At heart he was even a greater coward than Mr. William Cecil Clayton had imagined.\nTwo keen eyes had watched every move of the party from the foliage of a nearby tree. Tarzan had seen the surprise caused by his notice, and while he could understand nothing of the spoken language of these strange people, their gestures and facial expressions told him much.\n\n1. The word simian is a scientific word for a monkey.\n2. Elucidation is making something clear or understandable.\n3. Abstruse means difficult to understand.", "Read the following passage, which continues the story about Tarzan.\n\nAdapted from\nTarzan of the Apes\nBy Edgar Rice Burroughs\n\nThe sailors had to deliberate about the strange note on the door of the cabin. It did not take long for Professor Porter to wander off into the jungle.\n\"What's to be done, Miss Porter?\" asked young Clayton, his face clouded by a frown of worry and indecision.\n\"I can't leave you here alone with these cutthroats, and you certainly can't venture into the jungle with me; yet someone must go in search of your father. He is more than apt to wandering off aimlessly, regardless of danger or direction. You will pardon my bluntness, but our lives are all in jeopardy here, and when we get your father back something must be done to impress upon him the dangers to which he exposes you as well as himself by his absent-mindedness.\"\n\"I quite agree with you,\" replied the girl, \"and I am not offended at all. Dear old papa would sacrifice his life for me without an instant's hesitation, provided one could keep his mind on so frivolous a matter for an entire instant. There is only one way to keep him in safety, and that is to chain him to a tree. The poor dear is SO impractical.\"\n\"I have it!\" suddenly exclaimed Clayton. \"You will be comparatively safe in the cabin if you stay with the other women and do not touch anything. Call the others to move into the cabin while the sailors are distracted.\"\nJane did as he suggested and, when he saw the door close safely behind them, Clayton turned toward the jungle.\nThe rat-faced sailor stopped Clayton as he went and fired a volley of oaths at him for the stupidity of his fellow travelers in wandering into an unknown jungle. Nevertheless, Clayton persisted in looking for the old man. Every few moments, he called aloud the name of the wanderer, as he traversed the tangled labyrinth of the matted jungle.\n\n* * *\n\nSo much had Tarzan seen that day that his head was in a whirl of wonder. He wondered why the two men had gone into the jungle, nor did it ever occur to him that one could become lost in that maze of undergrowth that to him was as simple as is the main street of your own home town to you. Tarzan decided to follow the young man into the jungle and learn what his errand might be. He swung off rapidly in the direction taken by Clayton, and in a short time heard faintly in the distance the now only occasional calls of the Englishman to his friend.\nPresently Tarzan came up with the white man, who, almost exhausted, was leaning against a tree wiping the perspiration from his forehead. The ape-man, hiding safe behind a screen of foliage, sat watching this new specimen of his own race intently.\nAt intervals Clayton called aloud and finally it came to Tarzan that he was searching for the old man.\nTarzan was on the point of going off to look for the old man, when he caught the yellow glint of a sleek hide moving cautiously through the jungle toward Clayton.\nIt was Sheeta, the leopard. Now, Tarzan heard the soft bending of grasses and wondered why the young white man was not warned. Could it be he had failed to note the loud warning? Never before had Tarzan known Sheeta to be so clumsy.\nNo, the white man did not hear. Sheeta was crouching for the spring, and then, shrill and horrible, there rose from the stillness of the jungle the awful cry of the challenging ape, and Sheeta turned, crashing into the underbrush.\n\n* * *\n\nClayton came to his feet with a start. His blood ran cold. Never in all his life had so fearful a sound smote upon his ears. He was no coward; but if ever man felt the icy fingers of fear upon his heart, William Cecil Clayton did that day in the African jungle.\nThe noise of some great body crashing through the underbrush so close beside him, and the sound of that bloodcurdling shriek from above, tested Clayton's courage to the limit; but he could not know that it was to that very voice he owed his life, nor that the creature who hurled it forth was much like himself.\nThe afternoon was drawing to a close, and Clayton, disheartened and discouraged, was in a terrible quandary as to the proper course to pursue; whether to keep on in search of Professor Porter, at the almost certain risk of his own death in the jungle by night, or to return to the cabin where he might at least serve to protect Jane Porter from the perils which confronted her on all sides.\nHe did not wish to return to camp without her father; still more, he shrank from the thought of leaving her alone and unprotected in the hands of the mutineers of the ship, or to the hundred unknown dangers of the jungle.\nPossibly, too, he thought, the professor might have returned to camp. Yes, that was more than likely. At least he would return and see, before he continued what seemed to be a most fruitless quest. And so he started, stumbling back through the thick and matted underbrush in the direction that he thought the cabin lay.\n\n* * *\n\nTo Tarzan's surprise the young man was heading further into the jungle.\nTarzan was perplexed. The fierce jungle would make easy prey of this unprotected stranger in a very short time if he were not guided quickly to the beach.\nYes, there was Numa, the lion, even now, stalking the white man a dozen paces to the right.\n\n* * *\n\nClayton heard the great body of the lion paralleling his course, and now there rose upon the evening air the beast's thunderous roar. He stopped and faced the brush from which issued the awful sound. The shadows were deepening, darkness was settling in.\nFor a moment all was still. Clayton stood rigid. Presently a faint rustling of the bush apprised him of the stealthy creeping of the thing behind. It was gathering for the spring. At last he saw it, not twenty feet away—the long, lithe, muscular body and tawny head of a huge black-maned lion.\nThe beast was upon its belly, moving forward very slowly. As its eyes met Clayton's it stopped, and deliberately, cautiously gathered its hind quarters behind it.\nIn agony the man watched, fearful but powerless to fly.\nHe heard a noise in the tree above him. Some new danger, he thought, but he dared not take his eyes from the yellow green orbs before him. There was a sharp twang as of a broken banjo-string, and at the same instant an arrow appeared in the yellow hide of the crouching lion.\nWith a roar of pain and anger the beast sprang; but, somehow, Clayton stumbled to one side, and as he turned again to face the infuriated king of beasts, he was shocked at the sight which confronted him. Almost simultaneously with the lion's turning to renew the attack, a half-naked man dropped from the tree above squarely on to the brute's back.\nWith lightning speed, an arm of iron muscle encircled the huge neck, and the great beast was raised from behind, roaring and pawing the air—raised as easily as Clayton would have lifted a pet dog. The strong man’s right arm encircled the lion's neck, while the left hand plunged his knife into the unprotected side behind the lion’s left shoulder. The infuriated beast, pulled up and backwards until he stood upon his hind legs, struggled impotently in this unnatural position.\nHad the battle been of a few seconds' longer duration the outcome might have been different, but it was all accomplished so quickly that the lion had scarce time to recover from the confusion of its surprise before it sank lifeless to the ground.\nThen the strange figure which had vanquished it gave out the fearsome cry which a few moments earlier had so startled Clayton. Before him stood the figure of a young man in a loin cloth with a few barbaric ornaments about his arms and legs and, bizarrely, a diamond locket around his neck.\nThe hunting knife had been returned to its homely sheath, and the man was gathering up his bow and quiver from where he had tossed them when he leaped to attack the lion.\nClayton spoke to the stranger in English, thanking him for his brave rescue and complimenting him on the wondrous strength and dexterity he had displayed, but the only answer was a steady stare and a faint shrug of the mighty shoulders, which might betoken either disparagement of the service rendered, or ignorance of Clayton's language.\nClayton watched the stranger carefully, and presently there dawned upon him the conviction that this was Tarzan of the Apes, whose notice he had seen posted upon the cabin door that morning.\nIf so he must speak English.\nAgain Clayton attempted speech with the ape-man; but the replies, now vocal, were in a strange tongue, which resembled the chattering of monkeys mingled with the growling of some wild beast.\nNo, this could not be Tarzan of the Apes, for it was very evident that he was an utter stranger to English."]}, {"unit": "Comprehension Skills", "topic": "Citing Textual Evidence", "lesson": "Distinguish between explicit and implicit information", "texts": ["Read the following passage, which continues the story from the lesson after an interval of time.\n\nAdapted from\nOtto of the Silver Hand\nBy Howard Pyle\n\nMany years later, Otto, the son of the Barron and the Baroness, returned to Drachenhausen.\nOld Ursela, the nurse, seemed nearer to the boy than anyone else about the castle, except his father, and it was a delight to Otto to sit beside her and listen to her quaint stories, so different from the monkish tales that he had heard and read while growing up at the monastery.\nBut one day it was a tale of a different sort that she told him, and one that opened his eyes to what he had never dreamed of before.\nThe mellow sunlight fell through the window upon old Ursela, as she sat in the warmth with her distaff in her hands while Otto lay close to her feet upon a bear skin, silently thinking over the strange story of a brave knight and a fiery dragon that she had just told him. Suddenly Ursela broke the silence.\n\"Little one,\" said she, \"thou art wondrously like thy own dear mother; didst ever hear how she died?\"\n\"Nay,\" said Otto, \"but tell me, Ursela, how it was.\"\n\"Tis strange,\" said the old woman, \"that no one should have told thee in all this time.\" And then, in her own fashion she related to him the story of how his father had set forth upon that expedition in spite of all that Otto's mother had said, beseeching him to abide at home; how he had been foully wounded, and how the poor lady had died from her fright and grief.\nOtto listened with eyes that grew wider and wider, though not all with wonder; he no longer lay upon the bear skin, but sat up with his hands clasped. For a moment or two after the old woman had ended her story, he sat staring silently at her. Then he cried out, in a sharp voice, \"And is this truth that you tell me, Ursela? And did my father seek to rob the towns people of their goods?\"\nOld Ursela laughed. \"Aye,\" said she, \"that he did and many times. Ah me, those day's are all gone now.\" And she fetched a deep sigh. \"Then we lived in plenty and had both silks and linens and velvets besides in the store closets and were able to buy good wines and live in plenty upon the best. Now we dress in frieze* and live upon what we can get and sometimes that is little enough, with nothing better than sour beer to drink. But there is one comfort in it all, and that is that our good Baron paid back the score he owed the Trutz-Drachen people not only for the terrible wound they gave him, but for all that they had done.\"\nThereupon she went on to tell Otto how Baron Conrad had fulfilled the pledge of revenge that he had made, how he had watched day after day until one time he had caught the Trutz-Drachen folk, with Baron Frederick at their head, in a narrow mountainous trail; of the fierce fight that was there fought; of how the Trutz-Drachens at last fled, leaving Baron Frederick behind them wounded; of how he had kneeled before the Baron Conrad, asking for mercy, and of how Baron Conrad had answered, \"Aye, thou shalt have such mercy as thou deserve,\" and had therewith raised his great two-handed sword and laid his kneeling enemy dead at one blow.\nPoor little Otto had never dreamed that such cruelty and wickedness could be. He listened to the old woman's story with gaping horror, and when the last came and she told him, with a smack of her lips, how his father had killed his enemy with his own hand, he gave a gasping cry and sprang to his feet. Just then the door at the other end of the chamber was noisily opened, and Baron Conrad himself strode into the room. Otto turned his head, and seeing who it was, gave another cry, loud and quavering, and ran to his father and caught him by the hand.\n\"Oh, father!\" he cried, \"Oh, father! Is it true that thou hast killed a man with thy own hand?\"\n\"Aye,\" said the Baron, grimly, \"it is true enough, and I think me I have killed many more than one. But what of that, Otto? Thou must get out of those foolish notions that the old monks have taught thee. Here in the world it is different from what it is at St. Michaelsburg; here a man must either slay or be slain.\"\nBut poor little Otto, with his face hidden in his father's robe, cried as though his heart would break. \"Oh, father!\" he said, again and again, \"it cannot be—it cannot be that thou who art so kind to me should have killed a man with thine own hands.\" Then: \"I wish that I were back in the monastery again; I am afraid out here in the great wide world; perhaps somebody may kill me, for I am only a weak little boy and could not save my own life if they chose to take it from me.\"\nBaron Conrad looked down upon Otto all this while, drawing his bushy eyebrows together. Once he reached out his hand as though to stroke the boy's hair, but drew it back again.\nTurning angrily upon the old woman, \"Ursela,\" said he, \"thou must tell the child no more such stories as these; he know not at all of such things as yet. Keep thy tongue busy with the old woman's tales that he loves to hear thee tell, and leave it with me to teach him what he should be: a true knight.\"\nThat night the father and son sat together beside the roaring fire in the great hall. \"Tell me, Otto,\" said the Baron, \"dost thou hate me for having done what Ursela told thee today that I did?\"\nOtto looked for a while into his father's face. \"I know not,\" said he at last, in his quaint, quiet voice, \"but methinks that I do not hate thee.\"\n\n*Frieze is a heavy, rough wool.", "Read the following passage, which continues the story about Otto.\nAdapted from\nOtto of the Silver Hand\nBy Howard Pyle\n\nThere was a new emperor in Germany who had come from a far away Swiss castle; Count Rudolph of Hapsburg, a good, honest man with a good, honest, homely face, but bringing with him a stern sense of justice and of right, and a determination to put down the lawlessness of the savage German barons among whom he had come as Emperor.\nOne day two strangers came galloping up the winding path to the gates of the Dragon's house. A horn sounded thin and clear, a parley was held across the chasm in the road between the two strangers and the porter who appeared at the little wicket. Then a messenger was sent running to the Baron, who presently came striding across the open court-yard to the gateway to parley with the strangers.\nThe two bore with them a folded parchment with a great red seal hanging from it like a clot of blood; it was a message from the Emperor demanding that the Baron should come to the Imperial Court to answer certain charges that had been brought against him, and to give his bond to maintain the peace of the empire.\nOne by one those barons who had been carrying on their private wars, or had been despoiling* the village folk in their traffic from town to town, and against whom complaint had been lodged, were summoned to the Imperial Court, where they were compelled to promise peace and to swear allegiance to the new order of things. All those who came willingly were allowed to return home again after giving security for maintaining the peace; all those who came not willingly were either brought in chains or rooted out of their strongholds with fire and sword, and their roofs burned over their heads.\nNow it was Baron Conrad's turn to be summoned to the Imperial Court, for complaint had been lodged against him by his old enemy of Trutz-Drachen—Baron Henry—the nephew of the old Baron Frederick who had been slain while kneeling in the dust of the mountain road.\nNo one at Drachenhausen could read but the steward, who was nearly blind, and little Otto. So the boy read the summons to his father, while the grim Baron sat silent with his chin resting upon his clenched fist and his eyebrows drawn together into a thoughtful frown as he gazed into the pale face of his son, who sat by the rude oaken table with the great parchment spread out before him.\nShould he answer the summons, or scorn it as he would have done under the old emperors? Baron Conrad knew not which to do; pride said one thing and policy another. The Emperor was a man with an iron hand, and Baron Conrad knew what had happened to those who had refused to obey the imperial commands. So at last he decided that he would go to the court, taking with him a suitable escort to support his dignity.\nIt was with nearly a hundred armed men clattering behind him that Baron Conrad rode away to court to answer the imperial summons. The castle was stripped of its fighting men, and only eight remained behind to guard the great stone fortress and the little simple-witted boy.\nIt was a sad mistake.\nThree days had passed since the Baron had left the castle, and now the third night had come. The moon was hanging midway in the sky, white and full, for it was barely past midnight.\nThe high banks of the rocky road threw a dense black shadow into the gully below, and in that crooked inky line that scarred the white face of the moonlit rocks, a band of some thirty men were creeping slowly and stealthily nearer and nearer to Castle Drachenhausen. At the head of them was a tall, slender knight clad in light chain armor, his head covered only by a steel cap or bascinet.\nAlong the shadow they crept, with only now and then a faint clink or jingle of armor to break the stillness, for most of those who followed the armed knight were clad in leathern jerkins; only one or two wearing even so much as a steel breast-plate by way of armor.\nSo at last they reached the chasm that yawned beneath the roadway, and there they stopped, for they had reached the spot toward which they had been journeying. It was Baron Henry of Trutz-Drachen who had thus come in the silence of the night time to the Dragon's house, and his visit boded no good to those within.\n\n*Despoiling means robbing."]}, {"unit": "Comprehension Skills", "topic": "Citing Textual Evidence", "lesson": "Provide multiple pieces of evidence to support analysis", "texts": ["Read the following passage, which continues and completes the story from the lesson.\n\nThe Tell-Tale Heart\nBy Edgar Allan Poe\n\nNow this is the point. You fancy me mad. Madmen know nothing. But you should have seen me. You should have seen how wisely I proceeded—with what caution, with what foresight, with what dissimulation I went to work! I was never kinder to the old man than during the whole week before I killed him. And every night, about midnight, I turned the latch of his door and opened it—oh so gently! And then, when I had made an opening sufficient for my head, I put in a dark lantern, all closed, closed, that no light shone out, and then I thrust in my head.\nOh, you would have laughed to see how cunningly I thrust it in! I moved it slowly—very, very slowly, so that I might not disturb the old man's sleep. It took me an hour to place my whole head within the opening so far that I could see him as he lay upon his bed. Ha! Would a madman have been so wise as this? And then, when my head was well in the room, I undid the lantern cautiously—oh, so cautiously—cautiously (for the hinges creaked)—I undid it just so much that a single thin ray fell upon the vulture eye.\nAnd this I did for seven long nights—every night just at midnight—but I found the eye always closed, and so it was impossible to do the work; for it was not the old man who vexed me, but his Evil Eye. And every morning, when the day broke, I went boldly into the chamber, and spoke courageously to him, calling him by name in a hearty tone, and inquiring how he has passed the night. So you see he would have been a very profound old man, indeed, to suspect that every night, just at twelve, I looked in upon him while he slept.\nUpon the eighth night I was more than usually cautious in opening the door. A watch's minute hand moves more quickly than did mine. Never before that night had I felt the extent of my own powers of my sagacity. I could scarcely contain my feelings of triumph. To think that there I was, opening the door, little by little, and he not even to dream of my secret deeds or thoughts. I fairly chuckled at the idea, and perhaps he heard me, for he moved on the bed suddenly, as if startled. Now you may think that I drew back—but no. His room was as black as pitch with the thick darkness, (for the shutters were close fastened, through fear of robbers) and so I knew that he could not see the opening of the door, and I kept pushing it on steadily, steadily.\nI had my head in, and was about to open the lantern, when my thumb slipped upon the tin fastening, and the old man sprang up in bed, crying out, “Who’s there?\"\nI kept quite still and said nothing. For a whole hour I did not move a muscle, and in the meantime I did not hear him lie down. He was still sitting up in the bed listening, just as I have done, night after night, hearkening to the death watches in the wall.\nPresently I heard a slight groan, and I knew it was the groan of mortal terror. It was not a groan of pain or of grief—oh, no!—it was the low stifled sound that arises from the bottom of the soul when overcharged with awe. I knew the sound well. Many a night, just at midnight, when all the world slept, it has welled up from my own bosom, deepening, with its dreadful echo, the terrors that distracted me. I say I knew it well. I knew what the old man felt, and pitied him, although I chuckled at heart. I knew that he had been lying awake ever since the first slight noise, when he had turned in the bed.\nHis fears had been ever since growing upon him. He had been trying to fancy them causeless, but could not. He had been saying to himself, \"It is nothing but the wind in the chimney—it is only a mouse crossing the floor,\" or \"It is merely a cricket which has made a single chirp.\" Yes, he had been trying to comfort himself with these suppositions, but he had found all in vain. All in vain, because Death, in approaching him had stalked with his black shadow before him, and enveloped the victim. And it was the mournful influence of the unperceived shadow that caused him to feel—although he neither saw nor heard—to feel the presence of my head within the room.\nWhen I had waited a long time, very patiently, without hearing him lie down, I resolved to open a little—a very, very little crevice in the lantern. So I opened it—you cannot imagine how stealthily, stealthily—until, at length a simple dim ray, like the thread of the spider, shot from out the crevice and fell full upon the vulture eye.\nIt was open—wide, wide open—and I grew furious as I gazed upon it. I saw it with perfect distinctness—all a dull blue, with a hideous veil over it that chilled the very marrow in my bones, but I could see nothing else of the old man's face or person, for I had directed the ray as if by instinct, precisely upon the terrible spot.\nAnd have I not told you that what you mistake for madness is but over-acuteness of the sense? Now, I say, there came to my ears a low, dull, quick sound, such as a watch makes when enveloped in cotton. I knew that sound well, too. It was the beating of the old man's heart. It increased my fury, as the beating of a drum stimulates the soldier into courage.\nBut even yet I refrained and kept still. I scarcely breathed. I held the lantern motionless. I tried how steadily I could maintain the ray upon the eye. Meantime the hellish pulsation of the heart increased. It grew quicker and quicker, and louder and louder every instant. The old man's terror must have been extreme! It grew louder, I say, louder every moment! Do you mark me well I have told you that I am nervous, so I am. And now at the dead hour of the night, amid the dreadful silence of that old house, so strange a noise as this excited me to uncontrollable terror. Yet, for some minutes longer I refrained and stood still.\nBut the beating grew louder, louder! I thought the heart must burst. And now a new anxiety seized me—the sound would be heard by a neighbor! The old man's hour had come! With a loud yell, I threw open the lantern and leaped into the room. He shrieked once—once only. In an instant I dragged him to the floor, and pulled the heavy bed over him. I then smiled gaily, to find the deed so far done.\nBut, for many minutes, the heart beat on with a muffled sound. This, however, did not vex me; it would not be heard through the wall. At length it ceased. The old man was dead. I removed the bed and examined the corpse. Yes, he was stone, stone dead. I placed my hand upon the heart and held it there many minutes. There was no pulsation. He was stone dead. His eye would trouble me no more.\nIf still you think me mad, you will think so no longer when I describe the wise precautions I took for the concealment of the body. The night waned, and I worked hastily, but in silence.\nI took up three planks from the flooring of the chamber, and deposited the body between the scantlings. I then replaced the boards so cleverly, so cunningly, that no human eye—not even his—could have detected any thing wrong. There was nothing to wash out—no stain of any kind—no blood-spot whatever. I had been too wary for that.\nWhen I had made an end of these labors, it was four o'clock—still dark as midnight. As the bell sounded the hour, there came a knocking at the street door. I went down to open it with a light heart,—for what had I now to fear? There entered three men, who introduced themselves, with perfect suavity, as officers of the police. A shriek had been heard by a neighbor during the night, suspicion of foul play had been aroused, information had been lodged at the police office, and they (the officers) had been deputed to search the premises.\nI smiled,—for what had I to fear? I bade the gentlemen welcome. The shriek, I said, was my own in a dream. The old man, I mentioned, was absent in the country. I took my visitors all over the house. I bade them search—search well. I led them, at length, to his chamber. I showed them his treasures, secure, undisturbed. In the enthusiasm of my confidence, I brought chairs into the room, and desired them here to rest from their fatigues, while I myself, in the wild audacity of my perfect triumph, placed my own seat upon the very spot beneath which reposed the corpse of the victim.\nThe officers were satisfied. My manner had convinced them. I was singularly at ease. They sat, and while I answered cheerily, they chatted of familiar things. But, ere long, I felt myself getting pale and wished them gone. My head ached, and I fancied a ringing in my ears, but still they sat and still chatted. The ringing became more distinct. It continued and became more distinct. I talked more freely to get rid of the feeling, but it continued and gained definiteness—until, at length, I found that the noise was not within my ears.\nNo doubt I now grew very pale, but I talked more fluently, and with a heightened voice. Yet the sound increased—and what could I do? It was a low, dull, quick sound—much such a sound as a watch makes when enveloped in cotton. I gasped for breath—and yet the officers heard it not. I talked more quickly, more vehemently, but the noise steadily increased.\nI arose and argued about trifles, in a high key and with violent gesticulations, but the noise steadily increased. Why would they not be gone? I paced the floor to and fro with heavy strides, as if excited to fury by the observations of the men, but the noise steadily increased. Oh God! What could I do? I foamed, I raved, I swore! I swung the chair upon which I had been sitting, and grated it upon the boards, but the noise arose over all and continually increased.\nIt grew louder—louder—louder! And still the men chatted pleasantly, and smiled. Was it possible they heard not? Almighty God!—no, no! They heard! They suspected! They knew! They were making a mockery of my horror! This I thought, and this I think. But anything was better than this agony! Anything was more tolerable than this derision! I could bear those hypocritical smiles no longer! I felt that I must scream or die! And now—again!—hark! louder! louder! louder! louder!\n\"Villains!\" I shrieked, \"dissemble no more! I admit the deed!—tear up the planks! Here, here!—It is the beating of his hideous heart!\"", "Review the story you just read if you need help remembering the details.\n\nThe Tell-Tale Heart\nBy Edgar Allan Poe\n\nNow this is the point. You fancy me mad. Madmen know nothing. But you should have seen me. You should have seen how wisely I proceeded—with what caution, with what foresight, with what dissimulation I went to work! I was never kinder to the old man than during the whole week before I killed him. And every night, about midnight, I turned the latch of his door and opened it—oh so gently! And then, when I had made an opening sufficient for my head, I put in a dark lantern, all closed, closed, that no light shone out, and then I thrust in my head.\nOh, you would have laughed to see how cunningly I thrust it in! I moved it slowly—very, very slowly, so that I might not disturb the old man's sleep. It took me an hour to place my whole head within the opening so far that I could see him as he lay upon his bed. Ha! Would a madman have been so wise as this? And then, when my head was well in the room, I undid the lantern cautiously—oh, so cautiously—cautiously (for the hinges creaked)—I undid it just so much that a single thin ray fell upon the vulture eye.\nAnd this I did for seven long nights—every night just at midnight—but I found the eye always closed, and so it was impossible to do the work; for it was not the old man who vexed me, but his Evil Eye. And every morning, when the day broke, I went boldly into the chamber, and spoke courageously to him, calling him by name in a hearty tone, and inquiring how he has passed the night. So you see he would have been a very profound old man, indeed, to suspect that every night, just at twelve, I looked in upon him while he slept.\nUpon the eighth night I was more than usually cautious in opening the door. A watch's minute hand moves more quickly than did mine. Never before that night had I felt the extent of my own powers of my sagacity. I could scarcely contain my feelings of triumph. To think that there I was, opening the door, little by little, and he not even to dream of my secret deeds or thoughts. I fairly chuckled at the idea, and perhaps he heard me, for he moved on the bed suddenly, as if startled. Now you may think that I drew back—but no. His room was as black as pitch with the thick darkness, (for the shutters were close fastened, through fear of robbers) and so I knew that he could not see the opening of the door, and I kept pushing it on steadily, steadily.\nI had my head in, and was about to open the lantern, when my thumb slipped upon the tin fastening, and the old man sprang up in bed, crying out, “Who’s there?\"\nI kept quite still and said nothing. For a whole hour I did not move a muscle, and in the meantime I did not hear him lie down. He was still sitting up in the bed listening, just as I have done, night after night, hearkening to the death watches in the wall.\nPresently I heard a slight groan, and I knew it was the groan of mortal terror. It was not a groan of pain or of grief—oh, no!—it was the low stifled sound that arises from the bottom of the soul when overcharged with awe. I knew the sound well. Many a night, just at midnight, when all the world slept, it has welled up from my own bosom, deepening, with its dreadful echo, the terrors that distracted me. I say I knew it well. I knew what the old man felt, and pitied him, although I chuckled at heart. I knew that he had b
