ook her morning meal.\n\"For goodness sake!\" she exclaimed on seeing the Frogman. \"What are you doing out of your frog-pond?\"\n\"I am traveling in search of a jeweled gold dishpan, my good woman,\" he replied with an air of great dignity.\n\"You won't find it here, then,\" said she. \"Our dishpans are tin, and they're good enough for anybody. So go back to your pond and leave me alone.\" She spoke rather crossly and with a lack of respect that greatly annoyed the Frogman.\n\"Allow me to tell you, madam,\" said he, \"that although I am a frog, I am the Greatest and Wisest Frog in all the world. I may add that I possess much more wisdom than any Winkie—man or woman—in this land. Wherever I go, people fall on their knees before me and render homage to the Great Frogman! No one else knows so much as I; no one else is so grand, so magnificent!\"\n\"If you know so much,\" she retorted, \"why don't you know where your dishpan is instead of chasing around the country after it?\"\n\"Presently,\" he answered, \"I am going where it is, but just now I am traveling and have had no breakfast. Therefore I honor you by asking you for something to eat.\"\n\"Oho! The Great Frogman is hungry as any tramp, is he? Then pick up these sticks and help me to build the fire,\" said the woman contemptuously.\n\"Me! The Great Frogman pick up sticks?\" he exclaimed in horror. \"In the Yip Country where I am more honored and powerful than any King could be, people weep with joy when I ask them to feed me.\"\n\"Then that's the place to go for your breakfast,\" declared the woman.\n\"I fear you do not realize my importance,\" urged the Frogman. \"Exceeding wisdom renders me superior to menial duties.\"\n\"It's a great wonder to me,\" remarked the woman, carrying her sticks to the house, \"that your wisdom doesn't inform you that you'll get no breakfast here.\" And she went in and slammed the door behind her.\nThe Frogman felt he had been insulted, so he gave a loud croak of indignation and turned away. After going a short distance, he came upon a faint path which led across a meadow in the direction of a grove of pretty trees, and thinking this circle of evergreens must surround a house where perhaps he would be kindly received, he decided to follow the path. And by and by he came to the trees, which were set close together, and pushing aside some branches he found no house inside the circle, but instead a very beautiful pond of clear water.\nNow the Frogman, although he was so big and well educated and now aped the ways and customs of human beings, was still a frog. As he gazed at this solitary, deserted pond, his love for water returned to him with irresistible force. \"If I cannot get a breakfast, I may at least have a fine swim,\" said he, and pushing his way between the trees, he reached the bank. There he took off his fine clothing, laying his shiny purple hat and his gold-headed cane beside it. A moment later, he sprang with one leap into the water and dived to the very bottom of the pond.\nThe water was deliciously cool and grateful to his thick, rough skin, and the Frogman swam around the pond several times before he stopped to rest. Then he floated upon the surface and examined the pond. The bottom and sides were all lined with glossy tiles of a light pink color; just one place in the bottom where the water bubbled up from a hidden spring had been left free. On the banks, the green grass grew to the edge of the pink tiling. And now, as the Frogman examined the place, he found that on one side of the pool, just above the water line, had been set a golden plate on which some words were deeply engraved. He swam toward this plate, and on reaching it read the following inscription:\n\nThis is THE TRUTH POND\nWhoever bathes in this water must always\nafterward tell THE TRUTH.\n\nThis statement startled the Frogman. It even worried him, so that he leaped upon the bank and hurriedly began to dress himself. \"A great misfortune has befallen me,\" he told himself, \"for hereafter I cannot tell people I am wise, since it is not the truth. The truth is that my boasted wisdom is all a sham, assumed by me to deceive people and make them defer to me. In truth, no living creature can know much more than his fellows, for one may know one thing, and another know another thing, so that wisdom is evenly scattered throughout the world. But—ah me!—what a terrible fate will now be mine. Even Cayke the Cookie Cook will soon discover that my knowledge is no greater than her own, for having bathed in the enchanted water of the Truth Pond, I can no longer deceive her or tell a lie.\"\nMore humbled than he had been for many years, the Frogman went back to the grove where he had left Cayke and found the woman now awake and washing her face in a tiny brook. \"Where has Your Honor been?\" she asked.\n\"To a farmhouse to ask for something to eat,\" said he, \"but the woman refused me.\"\n\"How dreadful!\" she exclaimed. \"But never mind, there are other houses where the people will be glad to feed the Wisest Creature in all the World.\"\n\"Do you mean yourself?\" he asked.\n\"No, I mean you.\"\nThe Frogman felt strongly impelled to tell the truth, but struggled hard against it. His reason told him there was no use in letting Cayke know he was not wise, for then she would lose much respect for him, but each time he opened his mouth to speak, he realized he was about to tell the truth and shut it again as quickly as possible. He tried to talk about something else, but the words necessary to undeceive the woman would force themselves to his lips in spite of all his struggles. Finally, knowing that he must either remain dumb or let the truth prevail, he gave a low groan of despair and said, \"Cayke, I am NOT the Wisest Creature in all the World; I am not wise at all.\"\n\"Oh, you must be!\" she protested. \"You told me so yourself, only last evening.\"\n\"Then last evening I failed to tell you the truth,\" he admitted, looking very shamefaced for a frog. \"I am sorry I told you this lie, my good Cayke, but if you must know the truth, the whole truth and nothing but the truth, I am not really as wise as you are.\"\nThe Cookie Cook was greatly shocked to hear this, for it shattered one of her most pleasing illusions. She looked at the gorgeously dressed Frogman in amazement. \"What has caused you to change your mind so suddenly?\" she inquired.\n\"I have bathed in the Truth Pond,\" he said, \"and whoever bathes in that water is ever afterward obliged to tell the truth.\"\n\"You were foolish to do that,\" declared the woman.\n\"It is often very embarrassing to tell the truth. I'm glad I didn't bathe in that dreadful water!\"\nThe Frogman looked at his companion thoughtfully. \"Cayke,\" said he, \"I want you to go to the Truth Pond and take a bath in its water. For if we are to travel together and encounter unknown adventures, it would not be fair that I alone must always tell you the truth, while you could tell me whatever you pleased. If we both dip in the enchanted water, there will be no chance in the future of our deceiving one another.\"\n\"No,\" she asserted, shaking her head positively, \"I won't do it, Your Honor. For if I told you the truth, I'm sure you wouldn't like me. No Truth Pond for me. I'll be just as I am, an honest woman who can say what she wants to without hurting anyone's feelings.\"\nWith this decision the Frogman was forced to be content, although he was sorry the Cookie Cook would not listen to his advice."]}, {"unit": "Comprehension Skills", "topic": "Summaries", "lesson": "Differentiate between key ideas and supporting details", "texts": ["Read the excerpt from The Emerald City of Oz by Frank L. Baum. Then answer the questions that follow.\n\nHow Uncle Henry Got Into Trouble\n\nDorothy Gale lived on a farm in Kansas with her Aunt Em and her Uncle Henry. It was not a big farm, nor a very good one, because sometimes the rain did not come when the crops needed it, and then everything withered and dried up. Once a cyclone had carried away Uncle Henry's house, so that he was obliged to build another; and as he was a poor man he had to mortgage his farm to get the money to pay for the new house. Then his health became bad and he was too feeble to work. The doctor ordered him to take a sea voyage and he went to Australia and took Dorothy with him. That cost a lot of money, too.\nUncle Henry grew poorer every year, and the crops raised on the farm only bought food for the family. Therefore the mortgage could not be paid. At last the banker who had loaned him the money said that if he did not pay on a certain day, his farm would be taken away from him.\nThis worried Uncle Henry a good deal, for without the farm he would have no way to earn a living. He was a good man, and worked in the field as hard as he could; and Aunt Em did all the housework, with Dorothy's help. Yet they did not seem to get along.\nThis little girl, Dorothy, was like dozens of little girls you know. She was loving and usually sweet-tempered, and had a round rosy face and earnest eyes. Life was a serious thing to Dorothy, and a wonderful thing, too, for she had encountered more strange adventures in her short life than many other girls of her age.\nAunt Em once said she thought the fairies must have marked Dorothy at her birth, because she had wandered into strange places and had always been protected by some unseen power. As for Uncle Henry, he thought his little niece merely a dreamer, as her dead mother had been, for he could not quite believe all the curious stories Dorothy told them of the Land of Oz, which she had several times visited. He did not think that she tried to deceive her uncle and aunt, but he imagined that she had dreamed all of those astonishing adventures, and that the dreams had been so real to her that she had come to believe them true.\nWhatever the explanation might be, it was certain that Dorothy had been absent from her Kansas home for several long periods, always disappearing unexpectedly, yet always coming back safe and sound, with amazing tales of where she had been and the unusual people she had met. Her uncle and aunt listened to her stories eagerly and in spite of their doubts began to feel that the little girl had gained a lot of experience and wisdom that were unaccountable in this age, when fairies are supposed no longer to exist.\nMost of Dorothy's stories were about the Land of Oz, with its beautiful Emerald City and a lovely girl Ruler named Ozma, who was the most faithful friend of the little Kansas girl. When Dorothy told about the riches of this fairy country Uncle Henry would sigh, for he knew that a single one of the great emeralds that were so common there would pay all his debts and leave his farm free. But Dorothy never brought any jewels home with her, so their poverty became greater every year.\nWhen the banker told Uncle Henry that he must pay the money in thirty days or leave the farm, the poor man was in despair, as he knew he could not possibly get the money. So he told his wife, Aunt Em, of his trouble, and she first cried a little and then said that they must be brave and do the best they could, and go away somewhere and try to earn an honest living. But they were getting old and feeble and she feared that they could not take care of Dorothy as well as they had formerly done. Probably the little girl would also be obliged to go to work.\nThey did not tell their niece the sad news for several days, not wishing to make her unhappy; but one morning the little girl found Aunt Em softly crying while Uncle Henry tried to comfort her. Then Dorothy asked them to tell her what was the matter.\n\"We must give up the farm, my dear,\" replied her uncle sadly, \"and wander away into the world to work for our living.\"\nThe girl listened quite seriously, for she had not known before how desperately poor they were.\n\"We don't mind for ourselves,\" said her aunt, stroking the little girl's head tenderly; \"but we love you as if you were our own child, and we are heart-broken to think that you must also endure poverty, and work for a living before you have grown big and strong.\"\n\"What could I do to earn money?\" asked Dorothy.\n\"You might do housework for someone, dear, you are so handy; or perhaps you could be a nurse-maid to little children. I'm sure I don't know exactly what you CAN do to earn money, but if your uncle and I are able to support you we will do it willingly, and send you to school. We fear, though, that we shall have much trouble in earning a living for ourselves. No one wants to employ old people who are broken down in health, as we are.\"\nDorothy smiled. \"Wouldn't it be funny,\" she said, \"for me to do housework in Kansas, when I'm a Princess in the Land of Oz?\"\n\"A Princess!\" they both exclaimed, astonished.\n\"Yes; Ozma made me a Princess some time ago, and she has often begged me to come and live always in the Emerald City,\" said the child.\nHer uncle and aunt looked at her in amazement. Then the man said: \"Do you suppose you could manage to return to your fairyland, my dear?\"\n\"Oh yes,\" replied Dorothy; \"I could do that easily.\"\n\"How?\" asked Aunt Em.\n\"Ozma sees me every day at four o'clock, in her Magic Picture. She can see me wherever I am, no matter what I am doing. And at that time, if I make a certain secret sign, she will send for me by means of the Magic Belt, which I once captured from the Nome King. Then, in the wink of an eye, I shall be with Ozma in her palace.\"\nThe elder people remained silent for some time after Dorothy had spoken. Finally, Aunt Em said, with another sigh of regret: \"If that is the case, Dorothy, perhaps you'd better go and live in the Emerald City. It will break our hearts to lose you from our lives, but you will be so much better off with your fairy friends that it seems wisest and best for you to go.\"\n\"I'm not so sure about that,\" remarked Uncle Henry, shaking his gray head doubtfully. \"These things all seem real to Dorothy, I know; but I'm afraid our little girl won't find her fairyland just what she had dreamed it to be. It would make me very unhappy to think that she was wandering among strangers who might be unkind to her.\"\nDorothy laughed merrily at this speech, and then she became very sober again, for she could see how all this trouble was worrying her aunt and uncle, and knew that unless she found a way to help them their future lives would be quite miserable and unhappy. She knew that she COULD help them. She had thought of a way already. Yet she did not tell them at once what it was, because she must ask Ozma's consent before she would be able to carry out her plans.\nSo she only said: \"If you will promise not to worry a bit about me, I'll go to the Land of Oz this very afternoon. And I'll make a promise, too; that you shall both see me again before the day comes when you must leave this farm.\"\n\"The day isn't far away, now,\" her uncle sadly replied. \"I did not tell you of our trouble until I was obliged to, dear Dorothy, so the evil time is near at hand. But if you are quite sure your fairy friends will give you a home, it will be best for you to go to them, as your aunt says.\"\nThat was why Dorothy went to her little room in the attic that afternoon, taking with her a small dog named Toto. The dog had curly black hair and big brown eyes and loved Dorothy very dearly.\nThe child had kissed her uncle and aunt affectionately before she went upstairs, and now she looked around her little room rather wistfully, gazing at the simple trinkets and worn calico and gingham dresses, as if they were old friends. She was tempted at first to make a bundle of them, yet she knew very well that they would be of no use to her in her future life.\nShe sat down upon a broken-backed chair—the only one the room contained—and holding Toto in her arms waited patiently until the clock struck four.\nThen she made the secret signal that had been agreed upon between her and Ozma.\nUncle Henry and Aunt Em waited downstairs. They were uneasy and a good deal excited, for this is a practical humdrum world, and it seemed to them quite impossible that their little niece could vanish from her home and travel instantly to fairyland.\nSo they watched the stairs, which seemed to be the only way that Dorothy could get out of the farmhouse, and they watched them a long time. They heard the clock strike four but there was no sound from above.\nHalf-past four came, and now they were too impatient to wait any longer. Softly, they crept up the stairs to the door of the little girl's room.\n\"Dorothy! Dorothy!\" they called.\nThere was no answer. They opened the door and looked in.\nThe room was empty.", "Read the passage below. Then, answer the question that follows.\n\nHow Dorothy Became a Princess\n\nWhen the people of the Emerald City heard that Dorothy had returned to them, everyone was eager to see her, for the little girl was a general favorite in the Land of Oz.\nNow she received a joyful welcome, although no one except Ozma knew at first that she had finally come to stay for good and all.\nToto, Dorothy's little black dog, also met with a cordial reception. Toto was an especial friend of the Shaggy Man, and he knew everyone else. Being the only dog in the Land of Oz, he was highly respected by the people, who believed animals were entitled to every consideration if they behaved themselves properly.\nDorothy had four lovely rooms in the palace, which were always reserved for her use and were called \"Dorothy's rooms.\" These consisted of a beautiful sitting room, a dressing room, a dainty bedchamber and a big marble bathroom. And in these rooms were everything that heart could desire, placed there with loving thoughtfulness by Ozma for her little friend's use. The royal dressmakers had the little girl's measure, so they kept the closets in her dressing room filled with lovely dresses of every description and suitable for every occasion. No wonder Dorothy had refrained from bringing with her her old calico and gingham dresses! Here everything that was dear to a little girl's heart was supplied in profusion, and nothing so rich and beautiful could ever have been found in the biggest department stores in America. Of course Dorothy enjoyed all these luxuries, and the only reason she had heretofore preferred to live in Kansas was because her uncle and aunt loved her and needed her with them.\nNow, however, all was to be changed, and Dorothy was really more delighted to know that her dear relatives were to share in her good fortune and enjoy the delights of the Land of Oz, than she was to possess such luxury for herself.\nNext morning, at Ozma's request, Dorothy dressed herself in a pretty sky-blue gown of rich silk, trimmed with real pearls. The buckles of her shoes were set with pearls, too, and more of these priceless gems were on a lovely coronet which she wore upon her forehead. \"For,\" said her friend Ozma, \"from this time forth, my dear, you must assume your rightful rank as a Princess of Oz, and being my chosen companion you must dress in a way befitting the dignity of your position.\"\nDorothy agreed to this, although she knew that neither gowns nor jewels could make her anything else than the simple, unaffected little girl she had always been.\nAs soon as they had breakfasted—the girls eating together in Ozma's pretty boudoir—the Ruler of Oz said: \"Now, dear friend, we will use the Magic Belt to transport your uncle and aunt from Kansas to the Emerald City. But I think it would be fitting, in receiving such distinguished guests, for us to sit in my Throne Room.\"\n\"Oh, they're not very 'stinguished, Ozma,\" said Dorothy. \"They're just plain people, like me.\"\n\"Being your friends and relatives, Princess Dorothy, they are certainly distinguished,\" replied the Ruler, with a smile.\n\"They—they won't hardly know what to make of all your splendid furniture and things,\" protested Dorothy, gravely. \"It may scare 'em to see your grand Throne Room, an' p'raps we'd better go into the back yard, Ozma, where the cabbages grow an' the chickens are playing. Then it would seem more natural to Uncle Henry and Aunt Em.\"\n\"No; they shall first see me in my Throne Room,\" replied Ozma, decidedly; and when she spoke in that tone Dorothy knew it was not wise to oppose her, for Ozma was accustomed to having her own way.\nSo together they went to the Throne Room, an immense domed chamber in the center of the palace. Here stood the royal throne, made of solid gold and encrusted with enough precious stones to stock a dozen jewelry stores in our country.\nOzma, who was wearing the Magic Belt, seated herself in the throne, and Dorothy sat at her feet. In the room were assembled many ladies and gentlemen of the court, clothed in rich apparel and wearing fine jewelry. Two immense animals squatted, one on each side of the throne— the Cowardly Lion and the Hungry Tiger. In a balcony high up in the dome an orchestra played sweet music, and beneath the dome two electric fountains sent sprays of colored perfumed water shooting up nearly as high as the arched ceiling.\n\"Are you ready, Dorothy?\" asked the Ruler.\n\"I am,\" replied Dorothy; \"but I don't know whether Aunt Em and Uncle Henry are ready.\"\n\"That won't matter,\" declared Ozma. \"The old life can have very little to interest them, and the sooner they begin the new life here the happier they will be. Here they come, my dear!\"\nAs she spoke, there before the throne appeared Uncle Henry and Aunt Em, who for a moment stood motionless, glaring with white and startled faces at the scene that confronted them. If the ladies and gentlemen present had not been so polite, I am sure they would have laughed at the two strangers.\nAunt Em had her calico dress skirt \"tucked up,\" and she wore a faded, blue-checked apron. Her hair was rather straggly and she had on a pair of Uncle Henry's old slippers. In one hand she held a dish-towel and in the other a cracked earthenware plate, which she had been engaged in wiping when so suddenly transported to the Land of Oz.\nUncle Henry, when the summons came, had been out in the barn \"doin' chores.\" He wore a ragged and much soiled straw hat, a checked shirt without any collar and blue overalls tucked into the tops of his old cowhide boots.\n\"By gum!\" gasped Uncle Henry, looking around as if bewildered.\n\"Well, I swan!\" gurgled Aunt Em in a hoarse, frightened voice. Then her eyes fell upon Dorothy, and she said: \"D-d-d-don't that look like our little girl—our Dorothy, Henry?\"\n\"Hi, there—look out, Em!\" exclaimed the old man, as Aunt Em advanced a step; \"take care o' the wild beasties, or you're a goner!\"\nBut now Dorothy sprang forward and embraced and kissed her aunt and uncle affectionately, afterward taking their hands in her own.\n\"Don't be afraid,\" she said to them. \"You are now in the Land of Oz, where you are to live always, and be comfer'ble an' happy. You'll never have to worry over anything again, 'cause there won't be anything to worry about. And you owe it all to the kindness of my friend Princess Ozma.\"\nHere she led them before the throne and continued: \"Your Highness, this is Uncle Henry. And this is Aunt Em. They want to thank you for bringing them here from Kansas.\"\nAunt Em tried to \"slick\" her hair, and she hid the dish-towel and dish under her apron while she bowed to the lovely Ozma. Uncle Henry took off his straw hat and held it awkwardly in his hands.\nBut the Ruler of Oz rose and came from her throne to greet her newly arrived guests, and she smiled as sweetly upon them as if they had been a king and queen.\n\"You are very welcome here, where I have brought you for Princess Dorothy's sake,\" she said, graciously, \"and I hope you will be quite happy in your new home.\" Then she turned to her courtiers, who were silently and gravely regarding the scene, and added: \"I present to my people our Princess Dorothy's beloved Uncle Henry and Aunt Em, who will hereafter be subjects of our kingdom. It will please me to have you show them every kindness and honor in your power, and to join me in making them happy and contented.\"\nHearing this, all those assembled bowed low and respectfully to the old farmer and his wife, who bobbed their own heads in return.\n\"And now,\" said Ozma to them, \"Dorothy will show you the rooms prepared for you. I hope you will like them, and shall expect you to join me at luncheon.\"\nSo Dorothy led her relatives away, and as soon as they were out of the Throne Room and alone in the corridor, Aunt Em squeezed Dorothy's hand and said: \"Child, child! How in the world did we ever get here so quick? And is it all real? And are we to stay here, as she says? And what does it all mean, anyhow?\"\nDorothy laughed.\n\"Why didn't you tell us what you were goin' to do?\" inquired Uncle Henry, reproachfully. \"If I'd known about it, I'd 'a put on my Sunday clothes.\"\n\"I'll 'splain ever'thing as soon as we get to your rooms,\" promised Dorothy. \"You're in great luck, Uncle Henry and Aunt Em; an' so am I! And oh! I'm so happy to have got you here, at last!\"\nAs he walked by the little girl's side, Uncle Henry stroked his whiskers thoughtfully. \"'Pears to me, Dorothy, we won't make bang-up fairies,\" he remarked.\n\"An' my back hair looks like a fright!\" wailed Aunt Em.\n\"Never mind,\" returned the little girl, reassuringly. \"You won't have anything to do now but to look pretty, Aunt Em; an' Uncle Henry won't have to work till his back aches, that's certain.\"\n\"Sure?\" they asked, wonderingly, and in the same breath.\n\"Course I'm sure,\" said Dorothy. \"You're in the Fairyland of Oz, now; an' what's more, you belong to it!\""]}, {"unit": "Comprehension Skills", "topic": "Summaries", "lesson": "Write an objective summary", "texts": []}, {"unit": "Comprehension Skills", "topic": "Summaries", "lesson": "Identify internal and external conflicts", "texts": []}, {"unit": "Comprehension Skills", "topic": "Summaries", "lesson": "Differentiate between static/dynamic and flat/round characters", "texts": []}, {"unit": "Comprehension Skills", "topic": "Summaries", "lesson": "Analyze changes within a character", "texts": ["The following excerpt has two passages from the same story. The first passage is from the beginning of the plot, and the second passage is from the end. In the story, a cyclone transports a young girl named Dorothy from her aunt and uncle's quiet farm in Kansas to the strange and exciting land of Oz.\n\nRead the excerpt and answer the questions that follow.\n\nAn Excerpt Adapted from The Wonderful Wizard of Oz\nby Frank L. Baum\n\nPassage 1\nDorothy lived in the midst of the great Kansas prairies, with Uncle Henry, who was a farmer, and Aunt Em, who was the farmer's wife. Their house was small, for the lumber to build it had to be carried by wagon many miles. There were four walls, a floor and a roof, which made one room; and this room contained a rusty looking cookstove, a cupboard for the dishes, a table, three or four chairs, and the beds. Uncle Henry and Aunt Em had a big bed in one corner, and Dorothy a little bed in another corner.\nWhen Dorothy stood in the doorway and looked around, she could see nothing but the great gray prairie on every side. Not a tree nor a house broke the broad sweep of flat country that reached to the edge of the sky in all directions. The sun had baked the plowed land into a gray mass, with little cracks running through it. Even the grass was not green, for the sun had burned the tops of the long blades until they were the same gray color to be seen everywhere. Once the house had been painted, but the sun blistered the paint and the rains washed it away, and now the house was as dull and gray as everything else.\nWhen Aunt Em came there to live she was a young, pretty wife. The sun and wind had changed her, too. They had taken the sparkle from her eyes and left them a sober gray; they had taken the red from her cheeks and lips, and they were gray also. She was thin and gaunt, and never smiled now. When Dorothy, who was an orphan, first came to her, Aunt Em had been so startled by the child's laughter that she would scream and press her hand upon her heart whenever Dorothy's merry voice reached her ears; and she still looked at the little girl with wonder that she could find anything to laugh at.\nUncle Henry never laughed. He worked hard from morning till night and did not know what joy was. He was gray also, from his long beard to his rough boots, and he looked stern and solemn, and rarely spoke.\nIt was Toto that made Dorothy laugh, and saved her from growing as gray as her other surroundings. Toto was not gray; he was a little black dog, with long silky hair and small black eyes that twinkled merrily on either side of his funny, wee nose. Toto played all day long, and Dorothy played with him, and loved him dearly.\n\nPassage 2\nWhen they were all quite presentable they followed the soldier girl into a big room where the Witch Glinda sat upon a throne of rubies.\n\"What can I do for you, my child?\" she asked.\nDorothy told the Witch all her story: how the cyclone had brought her to the Land of Oz, how she had found her companions, and of the wonderful adventures they had met with.\n\"My greatest wish now,\" she added, \"is to get back to Kansas, for Aunt Em will surely think something dreadful has happened to me, and that will make her put on mourning; and unless the crops are better this year than they were last, I am sure Uncle Henry cannot afford it.\"\nGlinda leaned forward and kissed the sweet, upturned face of the loving little girl.\n\"Bless your dear heart,\" she said, \"I am sure I can tell you of a way to get back to Kansas. Your Silver Shoes will carry you over the desert,\" replied Glinda. \"If you had known their power you could have gone back to your Aunt Em the very first day you came to this country.\"\n\"But then I should not have had my wonderful brains!\" cried the Scarecrow. \"I might have passed my whole life in the farmer's cornfield.\"\n\"And I should not have had my lovely heart,\" said the Tin Woodman. \"I might have stood and rusted in the forest till the end of the world.\"\n\"And I should have lived a coward forever,\" declared the Lion, \"and no beast in all the forest would have had a good word to say to me.\"\n\"This is all true,\" said Dorothy, \"and I am glad I was of use to these good friends. But now that each of them has had what he most desired, and each is happy in having a kingdom to rule besides, I think I should like to go back to Kansas.\"\nShe threw her arms around the Lion's neck and kissed him, patting his big head tenderly. Then she kissed the Tin Woodman, who was weeping in a way most dangerous to his joints. But she hugged the soft, stuffed body of the Scarecrow in her arms instead of kissing his painted face, and found she was crying herself at this sorrowful parting from her loving comrades.", "The following excerpt has two passages from the same story. The first passage is from earlier in the plot when Mary, the main character, meets Colin, her sickly cousin who never leaves his room. The second passage is from later in the plot when Mary and her friend Dickon take Colin out into the secret garden that Mary has discovered.\n\nRead the excerpt and answer the questions that follow.\n\nAn Excerpt Adapted from The Secret Garden\nby Frances Hodgson Burnett\n\nPassage 1\nMary followed the sound until she stood in a corridor she'd never been in before, just outside a room. The Someone was crying in that room, and it was quite a young Someone.\nSo she walked to the door and pushed it open, and there she was standing in the room!\nIt was a big room with ancient, handsome furniture in it. There was a low fire glowing faintly on the hearth and a night light burning by the side of a carved four-posted bed hung with brocade, and on the bed was lying a boy, crying fretfully.\nThe boy had a sharp, delicate face the color of ivory and he seemed to have eyes too big for it. He had also a lot of hair which tumbled over his forehead in heavy locks and made his thin face seem smaller. He looked like a boy who had been ill, but he was crying more as if he were tired and cross than as if he were in pain.\nMary stood near the door with her candle in her hand, holding her breath. Then she crept across the room, and as she drew nearer the light attracted the boy's attention and he turned his head on his pillow and stared at her, his gray eyes opening so wide that they seemed immense.\n\"Where did you come from?\" he asked.\n\"From my own room. I heard someone crying and wanted to find out who it was. What were you crying for?\"\n\"Because I couldn't go to sleep either and my head ached. What is your name?\"\n\"Mary Lennox. Did no one ever tell you I had come to live here?\"\n\"No,\" he answered. \"They wouldn't dare.\"\n\"Why?\" asked Mary.\n\"Because I should have been afraid you would see me. I won't let people see me and talk me over.\"\n\"Why?\" Mary asked again, feeling more mystified every moment.\n\"Because I am like this always, ill and having to lie down. The servants are not allowed to speak about me. I stay in this room because I don't want to be moved out of it. It tires me too much.\"\n\nPassage 2\n\"What big eyes you've got, Colin,\" Mary said. \"When you are thinking they get as big as saucers. What are you thinking about now?\"\n\"I can't help thinking about what it will look like,\" he answered.\n\"The garden?\" asked Mary.\n\"The springtime,\" he said. \"I was thinking that I've really never seen it before. I scarcely ever went out and when I did go I never looked at it. I didn't even think about it.\"\nA short while later, Mary, Dickon, and Colin were just outside the secret garden, with Dickon pushing Colin in his chair. The air was thick with anticipation when Mary whispered urged, \"And here is the handle, and here is the door. Dickon push him in—push him in quickly!\"\nAnd Dickon did it with one strong, steady, splendid push.\nBut Colin had actually dropped back against his cushions, even though he gasped with delight, and he had covered his eyes with his hands and held them there shutting out everything until they were inside and the chair stopped as if by magic and the door was closed. Not till then did he take them away and look round and round and round as Dickon and Mary had done. And over walls and earth and trees and swinging sprays and tendrils the fair green veil of tender little leaves had crept, and in the grass under the trees and the gray urns in the alcoves and here and there everywhere were touches or splashes of gold and purple and white and the trees were showing pink and snow above his head and there were fluttering of wings and faint sweet pipes and humming and scents and scents. And the sun fell warm upon his face like a hand with a lovely touch. And in wonder Mary and Dickon stood and stared at him. He looked so strange and different because a pink glow of color had actually crept all over him—ivory face and neck and hands and all.\n\"I shall get well! I shall get well!\" he cried out. \"Mary! Dickon! I shall get well! And I shall live forever and ever and ever!\""]}, {"unit": "Comprehension Skills", "topic": "Summaries", "lesson": "Analyze how character interactions develop plot", "texts": ["Text 1:\nShoveling Snow\nGeorgia's father had tried to call or email or text a business to plow the snow from their driveway, but the electricity and cell service were out. It was all up to them. Georgia shuddered as questions plagued her: Why had he tried so hard? Why had he seemed so upset not to find anyone?\n\"This will be good for us!\" Georgia's dad said with false enthusiasm as they stepped outside. \"We do too little with our hands. I mean, I just click away at a computer all day, and you do your schoolwork. We sit too much!\"\nGeorgia smiled nervously. She knew perfectly well that her father was trying very hard to sound positive. Does he think we won't make it? she wondered, fear filling her heart. Does he think we're completely stuck? She was afraid to ask. Without electricity, the house would slowly get colder and colder.\nGeorgia's father used the snow shovel, and Georgia used a big bucket to gather snow and throw it to the side. Soon, the muscles of her arms were burning, but she would not stop. She was growing more and more afraid. Puffing from the strain, she continued. Glancing up at her father's face, she saw a grimace. She could tell that he was having a hard time too. Georgia picked up the pace.\nSuddenly, she felt her father's hand on her shoulder. \"Are you all right?\" he asked. Both of them breathed out white mist.\n\"I won't give up, Dad! I know we can do this—we can survive this!\" The words tumbled out as she held back tears.\nHis face filled with confusion. \"Of course we'll survive. Why wouldn't we? The house has great insulation to keep us warm. We just need to get the car out for a few groceries and some water.\"\nThe fear she had been holding back suddenly broke like a dam, and tears poured out and froze to her face. Georgia's father walked her back to the doorstep to sit down. After a few minutes, she calmed down and asked why he had seemed so upset and why he had been disguising his true feelings.\n\"Honestly,\" Georgia's father said, \"I'm just really lazy. I hate this kind of thing—shoveling snow, using power tools. I like computers. When I realized we had to do the shoveling, there didn't seem to be any point in complaining. I just wanted to put a positive spin on it.\"\n\"That was what really scared me,\" she said with a relieved smile. \"I could tell that you were keeping something from me, but I didn't know what.\"\nHe apologized. They returned to shoveling snow, but they worked more slowly and easily. After some time, he asked her, \"What should I have said?\"\nShe gave it a moment's thought before suggesting, \"How about 'Georgia, if you'd rather shovel snow than brush your teeth with apple juice, let's get the driveway clear so we can go buy some water.'\"\n\nText 2:\n\nA Princess in the Woods\nMounting her horse, Princess Mari looked at her bodyguard. The princess said, \"We must make it from here to the castle before nightfall, safe and unnoticed. Is it even possible, Lucia?\"\n\"Remember why your parents hired me. I know these forests like you know the inside of a castle. Nothing will go wrong.\" Lucia's confidence reassured Mari, and the two set out. Lucia walked in front, leading the horse by the reins.\nThe two friends did not speak as they walked the winding path through the forest. Lucia kept her attention on every sight and sound. After a few hours, Lucia suddenly stopped and stood still. She looked up at Mari and gave a head movement that signaled to get off of the horse. They walked a short distance like that.\nSuddenly, a small group of travelers came into view from behind some trees. Lucia raised a hand and waved casually, obviously hoping to just pass by without a word.\n\"Hello, there!\" said one of the travelers. \"Take care—a band of robbers has been spotted on this road.\"\n\"Thank you!\" Lucia replied sincerely. The princess kept her cloak low over her face, but she gave a nod to the travelers.\nAs they walked farther, Lucia noticed small sounds in the woods near the path. Footsteps, branches snapping. She could tell the robbers were near.\nSuddenly, she turned to the princess and said in an excited voice, \"Can you believe we just saw Princess Mari and her guards?\"\nThe princess gave her a puzzled look for a moment, and then answered, \"No… I can't believe it.\"\n\"I wonder if we'll see them again on the road. They all had horses, so they're bound to catch up once their rest is over,\" Lucia said.\nPrincess Mari began to catch on, \"I could hardly believe she traveled with so few guards, and so lightly defended! Especially given all of the gold and jewels she wore.\"\nThe two carried on talking this way for some time. Lucia noticed that the sounds in the woods died down. She could just imagine the robbers preparing to wait for the royal targets who had actually already passed them by.", "Text 1: \nGrandpa's Strategy\nThe whole crowd could see that Pedro's chess opponent was sweating. Pedro would win in just three more turns, and both of them knew it. Finally, the opponent made his move. One, two, three turns followed, and Pedro said, \"Checkmate.\" The game was over. Pedro had made it to the finals!\nAs the crowd left, Pedro rose. His grandfather made his way to him. \"Like I keep telling you, you've got to watch your knights more carefully,\" he said. \"Your risk-taking paid off this time, but it won't always.\"\nPedro gave a grin and nodded. His grandfather saw the smile and coughed briefly before saying, \"And congratulations. It was a good match against a tough opponent. I'm proud of you.\"\nPedro and his grandfather decided to find something to eat before the finals. As they ate, they talked about chess strategy.\nAfter they returned from lunch, Pedro sat down to play against the other finalist, Kamara. She had won more tournaments than him, but he still felt hopeful.\nThe match began slowly. He took the first pawn. She took one of his on the next turn. It was clear she knew just what she was doing. He tried to craft his strategy at the same time as he figured out hers. Eventually, he found himself about to sacrifice a knight, but he remembered what his grandfather had said. He made a different move.\nSurprise flashed on her face. He realized that she had been watching his earlier games and had learned his habits. She had expected him to sacrifice that knight. Now, she began trying to change her plan quickly.\nHe made a bold, surprising move to further disrupt her strategy. After a few more turns, he was able to take her queen. She continued to put up a good fight, but both of them knew she would not recover. A few minutes later, he said, \"Checkmate.\" Pedro was the champion!\nThe two shook hands. \"That was a good game,\" she said. \"Well played!\"\nPedro complimented her back, and then he scanned the crowd until he saw his grandfather. Grinning, his grandfather looked him in the eyes and mouthed the word, \"Knight!\"\n\nText 2:\nTough Luck\nJuanita began to pack her bags and prepare to leave yet another town. Her aunt came into the room. \"Juanita, don't go,\" she said. \"The flooded basement—it wasn't your fault. You can't control the weather. This isn't about your bad luck!\"\n\"I know you don't believe me,\" Juanita replied. It had been three years since she had broken that mirror at her college, and bad luck had followed her ever since. No one ever understood. \"Having me under your roof will only lead to trouble. I can't do that to you.\"\nHer aunt looked at her with pity and concern. She asked, \"Is there any way I can convince you that you aren't cursed?\" Juanita shook her head. Her aunt sighed and then said, \"Well, you don't have anywhere to go yet. Just stay here until you have a new place lined up.\" Juanita agreed to stay until she could find her own apartment.\nAfter a few days, Juanita's aunt sat her down for a serious talk. \"I have an idea,\" her aunt told her. \"I'm going to make a deal with you. This Saturday, the city council is putting on a raffle to raise money for the community center. I want you to enter your name in the raffle. You'd have to be pretty lucky to win, right? So, if you win, you won't move away.\" Juanita agreed. With her luck, she would definitely lose.\nOn Saturday, Juanita and her aunt stood in front of city hall, surrounded by a crowd of people waiting for the raffle drawing. The mayor herself drew the name out of a large bin.\n\"Juanita Sanchez!\" shouted the mayor. Juanita's jaw dropped. She went forward to claim her prize.\nAs she stepped down from the stage, her aunt smiled and said, \"See? You're not so unlucky after all!\"\nAs they began to walk away, the mayor approached them. She shook the aunt's hand and said, \"I really appreciated your contribution to the community center. Five hundred tickets! I wanted to thank you personally.\"\nShocked, Juanita looked at her aunt. \"You spent five hundred dollars to put my name in that raffle five hundred times, didn't you?\" Her aunt looked at her in silence for a moment, but she knew there was no denying it. Juanita smiled and gave her aunt a hug, \"I guess you're right. To have somebody care for me like that, I must be pretty lucky.\""]}, {"unit": "Comprehension Skills", "topic": "Summaries", "lesson": "Identify how setting contributes to a story", "texts": ["Text 1:\nOn a beautiful evening, many hundred years ago, a worthy old fisherman sat mending his nets. The spot where he dwelt was exceedingly picturesque. The green turf on which he had built his cottage ran far out into a great lake; and this slip of verdure appeared to stretch into it as much through love of its clear waters as the lake, moved by a like impulse, strove to fold the meadow, with its waving grass and flowers, and the cooling shade of the trees, in its embrace of love. They seemed to be drawn toward each other, and the one to be visiting the other as a guest.\nWith respect to human beings, indeed, in this pleasant spot, excepting the fisherman and his family, there were few, or rather none, to be met with. For as in the background of the scene, toward the west and north-west, lay a forest of extraordinary wildness, which, owing to its sunless gloom and almost impassable recesses, as well as to fear of the strange creatures and visionary illusions to be encountered in it, most people avoided entering, unless in cases of extreme necessity. The pious old fisherman, however, many times passed through it without harm, when he carried the fine fish which he caught by his beautiful strip of land to a great city lying only a short distance beyond the forest.\n— from Undine by Friedrich de la Motte Fouque\n\nText 2:\nWhat became of my companions in the boat, as well as of those who escaped on the rock, or were left in the vessel, I cannot tell. For my own part, I swam as fortune directed me, and was pushed forward by wind and tide. When I was almost gone, and able to struggle no longer, I found my feet could touch the ocean floor. I walked near a mile before I got to the shore, which I conjectured was about eight o’clock in the evening. I then advanced forward near half a mile, but could not discover any sign of houses or inhabitants; at least I was in so weak a condition, that I did not observe them. I lay down on the grass, which was very short and soft, where I slept sounder than ever I remembered to have done in my life.\n— adapted from Gulliver's Travels by Jonathan Swift", "Text 1:\nIn the time of Harun-Er-Rashid there was, in Baghdad, a rich merchant named Sindbad the Sailor, the source of whose wealth was a mystery. It seemed to be inexhaustible. For long seasons he kept open house, and his entertainments were the most magnificent of all save only those of Er-Rashid himself. All that riches could buy seemed at his disposal, and he lavished the good things of this life upon his guests. Pages, slaves and attendants there were in great number; his garden was spacious and beautiful, and his house was filled with every costly luxury.\n— from One Thousand and One Arabian Nights by multiple authors\n\nText 2:\nLast Monday (July 31st) we were nearly surrounded by ice, which closed in the ship on all sides, scarcely leaving her the sea-room in which she floated. Our situation was somewhat dangerous, especially as we were compassed round by a very thick fog. We accordingly lay to, hoping that some change would take place in the atmosphere and weather. About two o’clock the mist cleared away, and we beheld, stretched out in every direction, vast and irregular plains of ice, which seemed to have no end. Some of my comrades groaned, and my own mind began to grow watchful with anxious thoughts, when a strange sight suddenly attracted our attention and diverted our solicitude from our own situation. We perceived a low carriage, fixed on a sledge and drawn by dogs, pass on towards the north, at the distance of half a mile; a being which had the shape of a man, but apparently of gigantic stature, sat in the sledge and guided the dogs. We watched the rapid progress of the traveller with our telescopes until he was lost among the distant inequalities of the ice.\n— from Frankenstein by Mary Wollstonecraft Shelley"]}, {"unit": "Comprehension Skills", "topic": "Summaries", "lesson": "Make plot predictions using textual details", "texts": ["Read the passage and answer the questions that follow.\n\nAn Excerpt Adapted from \"Plan for Saratoga\"\nby Kelly Weaver\n\n\"We are going to be very busy tomorrow,\" George said, grinning at Samuel.\n\"More fighting?\" Samuel asked.\n\"It's war; there's always more fighting,\" George said. \"I heard we're building defenses tomorrow. A new officer is helping General Gates with a plan to keep the British from attacking Albany.\"\nThe next morning after breakfast, the soldiers formed ranks and marched to the bank of the Hudson River to be introduced to the new officer and receive their orders. Colonel Thaddeus Kosciusko spoke with a strange accent, but gave orders like a commander. Soon, the soldiers were put into groups. Two groups would build fortifications near the river by making walls out of logs and piling dirt in front of them, while the other group would move cannons to the heights above the river and build more defensive walls. The idea was to gain the advantage by positioning artillery behind these fortifications and to prevent the British from being able to sail down the river to Albany.\nSamuel hoped the colonel's plan would be successful, or else the British would sail down the river to Albany and attack.\nThomas continued complaining, \"We're doing all of this work and we don't know if it will even stop the British from coming through.\"\n\"I've heard this colonel is good at what he does. We should at least give his fortifications a try,\" George replied. \"What we've been doing hasn't worked very well, so maybe this is the strategy we need.\"\n\"Seems like a lot of hard work just to have to retreat again.\" Thomas scowled.\nGeorge chuckled. \"Maybe we won't this time.\"\nThey didn't stop working until all of the sunlight was gone from the sky. Samuel fell into his tent and went to sleep right away. They still had more work to do before the British arrived, and more of the men complained the longer they labored on the plan to stop the British and build Colonel Kosciusko's defenses. He heard Thomas and some of the other men standing outside talking about the reinforcements they had toiled all day to build, and the work they would have to do for days to come.\n\"It's folly! The redoubts and walls are too close together. We'll be flanked and surrounded in no time!\"\n\"We're wasting our time with this. The British army could be here any day, and we've done all this work for nothing! We will have to retreat again!\"", "Read the passage and answer the questions that follow.\n\nAn Excerpt Adapted from \"Callie Gets Her Wish\"\nby Jane Moon\n\nCallie placed her elbow onto her desk, propped her chin up with her hand, and looked across the classroom. She gazed as Sandra showed off her new diamond earrings to the tight circle of girls around her.\n“My dad brought them from Italy,” Sandra said. The girls surrounding her oohed and aahed.\nCallie gave a deep sigh. “I wish I was Sandra.”\nEmma, Callie’s best friend, looked up from the math problem she was working on. “Why?” she asked.\n“She’s rich, she’s pretty, and she’s popular. She has everything, and everyone wants to be her friend.” Callie sighed again.\nEmma shook her head and went back to her homework. “I wouldn’t want to be Sandra,” she said, “even if it meant having all the money in the world.”\nCallie ignored Emma and spent the next ten minutes until class started admiring Sandra’s designer messenger bag.\nCallie usually walked home with Emma, but today she went alone. A glint at the edge of the grass caught her eye. Callie bent down and a tiny charm, one that could have fallen off a necklace, glittered in the sun. She looked closer and realized it was a little unicorn with wings. The body was enameled in white, with golden horns and hooves. The mane and the tail, a fiery red, were extended out as though the unicorn had been caught in mid-flight.\nMaybe someone from school lost it, Callie thought. I’ll bring it with me tomorrow to see if it belongs to anyone. Callie put the charm in her pocket and continued on home.\nLater that evening, Callie remembered the unicorn charm and pulled it out of her pocket. There was a tiny smudge of dirt on the unicorn’s nose. When Callie rubbed it with her thumb, a tiny pop sounded with a puff of smoke. Callie let out a little shriek.\n“You have freed me!” a deep voice said. Callie couldn't believe what she was seeing. The charm had turned into a small winged unicorn, about the size of a dragonfly, that flitted in the air in front of her. Callie gasped and sat for several seconds, unable to speak. The unicorn flew back up until he was at eye level with Callie and said, “So you freed me. What is your wish?”"]}, {"unit": "Comprehension Skills", "topic": "Asking Questions", "lesson": "Ask questions about specific key details in a story", "texts": ["The Missing Pet\nWritten by Erica Hayes\n\nChapter 1: Leaving the City\nBrian and his family were moving to a new house in the country. He was not excited about it. What was there to do in the country? It would be so quiet. He would miss his friends. He wouldn't know anyone.\n\"We'll have a nice, big yard,\" his mom said as they drove out of the city. \"Would you like to get a dog?\"\n\"No,\" Brian replied.\nIn the city, he liked going to the dog park and getting to see all the different kinds of dogs. However, he already had a hamster, Zipper, who had been a birthday present last year from his best friend, Abbey.\n\nChapter 2: The Missing Hamster\nThe next morning, when Brian woke up, he knew right away that something was wrong. Usually he awoke to Zipper scampering around on the wood shavings in his cage.\nBrian would get a drink and would begin grooming Zipper's fur. Today, the hamster cage was quiet. The top of the cage was slightly askew.\n\"Oh, no,\" he said.\nHe searched his room until his mother called him down for breakfast.\nAfter breakfast, Brian went back upstairs. There was a small crawlspace in the upstairs hallway. Brian noticed a few shavings near the entrance. He crawled inside on his hands and knees.\n\"Zipper?\" he called.\nHe tried calling Zipper's name again. He made a clucking sound with his tongue. He grabbed a flashlight from the drawer in the kitchen. There was no sign of Zipper anywhere.\n\nChapter 3: Hannah Helps\nBrian hardly slept at all that night. What if Zipper somehow got outside? Brian made up his mind that he would find Zipper tomorrow, no matter what.\nHe spent several hours the next morning trying to devise a plan. He attempted to build a trap out of wood planks and wire mesh. He didn't know how to make it so the door would close when Zipper walked in. At lunchtime, his mom suggested he take a break and get some fresh air outside.\nOut in the backyard, Brian kicked at a clump of grass. He wished they had never moved here in the first place.\nA movement near the woods at the edge of the yard caught his eye. He saw a girl, about his age, wearing a pair goggles. She was holding what looked like a metal rod with a disk attached to the end.\n\"Oh, hi,\" she said when she saw him. She pushed the goggles up onto her head.\n\"Are you our new neighbor? I'm Hannah.\"\n\"Yeah, my name's Brian. What is that thing?\" he asked.\n\"It's a metal detector. My sister lost an earring. I told her I'd find it. I'm really good at finding stuff.\"\n\"You are?\" asked Brian. A look of excitement flashed in his eyes.\n\"Yeah, did you lose something, too? Want me to find it for you?\" Hannah asked.\n\"Actually... my pet hamster got out of his cage. I've already tried a bunch of things to get him to come out. I guess he's having too much fun,\" Brian said sadly.\n\"I could help you catch him,\" she said.\nBrian looked at her with confusion. \"How would you do that?\"\n\"Follow me. I have the stuff we need at my house,\" she said.\nBrian hesitated, but then followed into her yard. He figured he'd might as well give it a shot.\n\nChapter 4: Setting the Trap\nBack at his house, Brian and Hannah set up a trap using a bucket and two wooden planks. They made a thick layer of cedar shavings in the bucket. Brian brought up some of Zipper's favorite foods: blackberries, strawberries, and a spoonful of peanut butter. Hannah took the smaller plank and laid it across the top of the bucket. They balanced the food on it. Next, she took the wider plank and made a little ramp leading up to the top of the bucket.\n\"This way,\" she said, \"your hamster will be able to climb up to the food. When he tries to walk across the skinny piece of wood, it'll tip, and he'll fall into the bucket. He'll be there waiting for you when you get up in the morning!\"\nBrian smiled. \"I hope this works,\" he said, \"but even if it doesn't, thanks for helping me. That was really nice of you.\"\n\"Of course!\" she said. \"But don't worry. It will work. I promise.\"\nThe next morning, Brian rushed out to check the trap. There was Zipper, in the bottom of the bucket, finishing the last blackberry. He would have to thank Hannah after breakfast.\nBrian was extremely relieved to see Zipper, but he was even more thankful to have found a friend. Maybe moving to the country wasn’t such a bad thing after all.", "Twas the Night Before Christmas\nWritten by Clement Clarke Moore\n\nTwas the night before Christmas, when all through the house,\nNot a creature was stirring, not even a mouse.\n\nThe stockings were hung by the chimney with care,\nIn hopes that St. Nicholas soon would be there.\n\nThe children were nestled all snug in their beds,\nWhile visions of sugar plums danced in their heads.\n\nAnd mamma in her 'kerchief, and I in my cap,\nHad just settled our brains for a long winter's nap.\n\nWhen out on the lawn there arose such a clatter,\nI sprang from the bed to see what was the matter.\n\nAway to the window I flew like a flash,\nTore open the shutters, and threw up the sash.\n\nThe moon of the breast of the new-fallen snow\nGave the luster of midday to objects below,\n\nWhen, what to my wondering eyes should appear,\nBut a miniature sleigh, and eight reindeer.\n\nWith a little old driver, so lively and quick,\nI knew in a moment it must be St. Nick.\n\nMore rapid than eagles his coursers they came,\nAnd he whistled, and shouted, and called them by name!\n\n\"Now Dasher! Now, Dancer! Now, Prancer, and Vixen!\nOn, Comet! On, Cupid! On, Donner and Blitzen!\n\nTo the top of the porch! To the top of the wall!\nNow dash away! Dash away! Dash away all!\"\n\nAs dry leaves that before the wild hurricane fly,\nWhen they meet with an obstacle, mount to the sky.\n\nSo up to the house-top the coursers they flew,\nWith the sleigh full of toys, and St. Nicholas, too.\n\nAnd then, in a twinkling, I heard on the roof,\nThe prancing and pawing of each little hoof.\n\nAs I drew in my head, and was turning around,\nDown the chimney St. Nicholas came with a bound.\n\nHe was dressed all in fur, from his head to his foot,\nAnd his clothes were all tarnished with ashes and soot.\n\nA bundle of toys he had flung on his back,\nAnd he looked like a peddler, just opening his pack.\n\nHis eyes, how they twinkled! His dimples, how merry!\nHis cheeks were like roses, his nose like a cherry!\n\nHis droll little mouth was drawn up like a bow,\nAnd the beard of his chin was as white as the snow.\n\nThe stump of a pipe held tight in his teeth,\nAnd the smoke, it encircled his head like a wreath.\n\nHe had a broad face and a little round belly,\nThat shook when he laughed, like a bowlful of jelly!\n\nHe was chubby and plump, a right jolly old elf.\nAnd I laughed when I saw him, in spite of myself!\n\nA wink of his eye and a twist of his head,\nSoon gave me to know I had nothing to dread.\n\nHe spoke not a word, but went straight to his work,\nAnd filled all the stockings, then turned with a jerk.\n\nAnd laying his finger aside of his nose,\nAnd giving a nod, up the chimney he rose!\n\nHe sprang to his sleigh, to his team gave a whistle,\nAnd away they all flew like the down of a thistle.\n\nBut I heard him exclaim, as he drove out of sight,\n\"Happy Christmas to all, and to all a good night!\"\n\nThe End"]}, {"unit": "Comprehension Skills", "topic": "Analyzing and Citing Evidence", "lesson": "Identify explicit and implicit information", "texts": []}, {"unit": "Comprehension Skills", "topic": "Analyzing and Citing Evidence", "lesson": "Cite textual evidence to support a claim", "texts": []}, {"unit": "Comprehension Skills", "topic": "Analyzing and Citing Evidence", "lesson": "Make an inference", "texts": []}, {"unit": "Comprehension Skills", "topic": "Analyzing and Citing Evidence", "lesson": "Cite textual evidence to support an inference", "texts": []}, {"unit": "Comprehension Skills", "topic": "Analyzing and Citing Evidence", "lesson": "Identify weak evidence", "texts": []}, {"unit": "Comprehension Skills", "topic": "Analyzing and Citing Evidence", "lesson": "Use evidence to analyze a text", "texts": []}, {"unit": "Comprehension Skills", "topic": "Key Individuals, Events, and Ideas", "lesson": "Determine an author's purpose and intended audience", "texts": []}, {"unit": "Comprehension Skills", "topic": "Key Individuals, Events, and Ideas", "lesson": "Analyze how key individuals, events, and ideas are introduced in various texts", "texts": []}, {"unit": "Comprehension Skills", "topic": "Key Individuals, Events, and Ideas", "lesson": "Analyze how key individuals, events, and ideas are explained and elaborated in various texts", "texts": []}, {"unit": "Comprehension Skills", "topic": "Key Individuals, Events, and Ideas", "lesson": "Analyze differences in how ideas are introduced and elaborated", "texts": []}], "7": [{"unit": "Comprehension Skills", "topic": "Setting a Purpose, Making Predictions, and Asking Questions", "lesson": "Establish a purpose for reading a text", "texts": []}, {"unit": "Comprehension Skills", "topic": "Central Ideas and Summaries", "lesson": "Distinguish between types of supporting details", "texts": []}, {"unit": "Comprehension Skills", "topic": "Central Ideas and Summaries", "lesson": "Understand how evidence supports the main idea of a text", "texts": []}, {"unit": "Comprehension Skills", "topic": "Central Ideas and Summaries", "lesson": "Determine the central idea by analyzing the main idea of each paragraph", "texts": []}, {"unit": "Comprehension Skills", "topic": "Central Ideas and Summaries", "lesson": "Determine the central idea of a text using the 5Ws and an H", "texts": []}, {"unit": "Comprehension Skills", "topic": "Central Ideas and Summaries", "lesson": "Use a variety of transition words to convey relationships between and among ideas", "texts": []}, {"unit": "Comprehension Skills", "topic": "Central Ideas and Summaries", "lesson": "Identify an effective summary of a text", "texts": []}, {"unit": "Comprehension Skills", "topic": "Central Ideas and Summaries", "lesson": "Identify an objective summary of a text", "texts": []}, {"unit": "Comprehension Skills", "topic": "Citing Textual Evidence", "lesson": "Cite textual evidence to support a claim", "texts": ["Read the following passage, which continues the story about Sara.\n\nA Little Princess\nBy Frances Hodgson Burnett\n\nIf Sara had been older or less punctilious about being quite polite to people, she could have explained herself in very few words. But, as it was, she felt a flush rising on her cheeks. Miss Minchin was a very severe and imposing person, and she seemed so absolutely sure that Sara knew nothing whatever of French that she felt as if it would be almost rude to correct her. The truth was that Sara could not remember the time when she had not seemed to know French. Her father had often spoken it to her when she had been a baby. Her mother had been a French woman, and Captain Crewe had loved her language, so it happened that Sara had always heard and been familiar with it.\n\"I—I have never really learned French, but—but—\" she began, trying shyly to make herself clear.\nOne of Miss Minchin's chief secret annoyances was that she did not speak French herself and was desirous of concealing this irritating fact. She, therefore, had no intention of discussing the matter and laying herself open to innocent questioning by a new little pupil.\n\"That is enough,\" she said with polite tartness. \"If you have not learned, you must begin at once. The French master, Monsieur Dufarge, will be here in a few minutes. Take this book and look at it until he arrives.\"\nSara's cheeks felt warm. She went back to her seat and opened the book. She looked at the first page with a grave face. She knew it would be rude to smile, and she was very determined not to be rude. But it was very odd to find herself expected to study a page which told her that \"le pere\" meant \"the father,\" and \"la mere\" meant \"the mother.\"\nMiss Minchin glanced toward her scrutinizingly.\n\"You look rather cross, Sara,\" she said. \"I am sorry you do not like the idea of learning French.\"\n\"I am very fond of it,\" answered Sara, thinking she would try again; \"but—\"\n\"You must not say 'but' when you are told to do things,\" said Miss Minchin. \"Look at your book again.\"\nAnd Sara did so, and did not smile, even when she found that \"le fils\" meant \"the son,\" and \"le frere\" meant \"the brother.\"\n\"When Monsieur Dufarge comes,\" she thought, \"I can make him understand.\"\nMonsieur Dufarge arrived very shortly afterward. He was a very nice, intelligent, middle-aged Frenchman, and he looked interested when his eyes fell upon Sara trying politely to seem absorbed in her little book of phrases.\n\"Is this a new pupil for me, madame?\" he said to Miss Minchin. \"I hope that is my good fortune.\"\n\"Her papa—Captain Crewe—is very anxious that she should begin the French language. But I am afraid she has a childish prejudice against it. She does not seem to wish to learn,\" said Miss Minchin.\n\"I am sorry of that, mademoiselle,\" he said kindly to Sara. \"Perhaps, when we begin to study together, I may show you that it is a charming tongue.\"\nLittle Sara rose in her seat. She was beginning to feel rather desperate, as if she were almost in disgrace. She looked up into Monsieur Dufarge's face with her big, green-gray eyes, and they were quite innocently appealing. She knew that he would understand as soon as she spoke. She began to explain quite simply in pretty and fluent French. Madame had not understood. She had not learned French exactly—not out of books—but her papa and other people had always spoken it to her, and she had read it and written it as she had read and written English. Her papa loved it, and she loved it because he did. Her dear mamma, who had died when she was born, had been French. She would be glad to learn anything monsieur would teach her, but what she had tried to explain to madame was that she already knew the words in this book—and she held out the little book of phrases.\nWhen she began to speak Miss Minchin started quite violently and sat staring at her over her eyeglasses, almost indignantly, until she had finished. Monsieur Dufarge began to smile, and his smile was one of great pleasure. To hear this pretty childish voice speaking his own language so simply and charmingly made him feel almost as if he were in his native land—which in dark, foggy days in London sometimes seemed worlds away. When she had finished, he took the phrase book from her, with a look almost affectionate. But he spoke to Miss Minchin.\n\"Ah, madame,\" he said, \"there is not much I can teach her. She has not learned French; she is French. Her accent is exquisite.\"", "Read the following passage, which is an excerpt from a novel.\n\nThe Voyages of Doctor Dolittle\nBy Hugh Lofting\n\nDuring those quiet peaceful days, I improved my reading and writing a great deal with the Doctor's help. I got on so well that he let me keep the ship's log. This is a big book kept on every ship, a kind of diary, in which the number of miles run, the direction of your course, and everything else that happens is written down.\nThe Doctor too, in what spare time he had, was nearly always writing—in his notebooks. I used to peep into these sometimes, now that I could read, but I found it hard work to make out the Doctor's handwriting. Many of these notebooks seemed to be about sea things. There were six thick ones filled full with notes and sketches of different seaweeds, and there were others on sea birds, others on sea worms, others on seashells. They were all someday to be rewritten, printed and bound like regular books.\nOne afternoon we saw, floating around us, great quantities of stuff that looked like dead grass. The Doctor told me this was gulf-weed. A little further on it became so thick that it covered all the water as far as the eye could reach; it made the Curlew look as though she were moving across a meadow instead of sailing the Atlantic.\nCrawling about upon this weed, many crabs were to be seen. The sight of them reminded the Doctor of his dream of learning the language of the shellfish. He fished several of these crabs up with a net and put them in his listening-tank to see if he could understand them. Among the crabs he also caught a strange-looking, chubby, little fish which he told me was called a Silver Fidgit.\nAfter he had listened to the crabs for a while with no success, he put the fidgit into the tank and began to listen to that. I had to leave him at this moment to go and attend to some duties on the deck, but presently I heard him below shouting for me to come down again.\n\"Stubbins,\" he cried as soon as he saw me—\"a most extraordinary thing—Quite unbelievable—I'm not sure whether I'm dreaming—Can't believe my own senses. I—I—I—\"\n\"Why, Doctor,\" I said, \"what is it?—What's the matter?\"\n\"The fidgit,\" he whispered, pointing with a trembling finger to the listening-tank in which the little round fish was still swimming quietly, \"he talks English! And—and—and HE WHISTLES TUNES—English tunes!\"\n\"Talks English!\" I cried—\"Whistles!—Why, it's impossible.\"\n\"It's a fact,\" said the Doctor, white in the face with excitement. \"It's only a few words, scattered, with no particular sense to them—all mixed up with his own language which I can't make out yet. But they're English words, unless there's something very wrong with my hearing—And the tune he whistles, it's as plain as anything—always, the same tune. Now you listen and tell me what you make of it. Tell me everything you hear. Don't miss a word.\"\nI went to the glass tank upon the table while the Doctor grabbed a notebook and a pencil. Undoing my collar, I stood upon the empty packing-case he had been using for a stand and put my right ear down under the water.\nFor some moments I detected nothing at all—except, with my dry ear, the heavy breathing of the Doctor as he waited, all stiff and anxious, for me to say something. At last from within the water, sounding like a child singing miles and miles away, I heard an unbelievably thin, small voice.\n\"Ah!\" I said.\n\"What is it?\" asked the Doctor in a hoarse, trembly whisper. \"What does he say?\"\n\"I can't quite make it out,\" I said. \"It's mostly in some strange fish language—Oh, but wait a minute!—Yes, now I get it—'No smoking'.... 'My, here's a strange one!' 'Popcorn and picture postcards here.... This way out.... Don't spit'—What funny things to say, Doctor!—Oh, but wait!—Now he's whistling the tune.\""]}, {"unit": "Comprehension Skills", "topic": "Citing Textual Evidence", "lesson": "Make inferences", "texts": []}, {"unit": "Comprehension Skills", "topic": "Citing Textual Evidence", "lesson": "Distinguish between explicit and implicit information", "texts": []}, {"unit": "Comprehension Skills", "topic": "Citing Textual Evidence", "lesson": "Provide multiple pieces of evidence to support analysis", "texts": ["Read the following excerpt, which continues the story from the lesson.\n\nThe Great Quest\nBy Charles Boardman Hawes\n\nPerceiving that the entire village was quiet from a distance, I was frankly puzzled; and as I approached, I cast about with lively curiosity to see what could cause so strange a state of affairs. It was only when I had gone past the smithy, that I saw the smith and his customers and his habitual guests gathered on the other side of the building, where I had not been able to see them before. They were staring at the old village tavern, which stood some distance away on a gentle rise of land.\nMy curiosity so prevailed over my sense of duty that I turned from the road through the tall grass, temporarily abandoning my errand, and picked my way among some old wheels and scrap iron to join the men.\nTheir talk only aggravated my wonder.\nClearing his throat, the smith gruffly muttered, \"It does act like him, and yet I can't believe it'll be him.\"\n\"Why shouldn't he come back?\" one of the farmers asked in a louder voice. \"Things done twenty years ago will never be dragged up to face him, and he'd know that.\"\nThe smith grunted. \"Where would Neil Gleazen find the money to buy a suit of good clothes and a beaver hat?\"\n\"That's easy answered,\" a third speaker put in. And they all exchanged significant glances.\nIn the silence that followed I made bold to put a question for myself. \"Of whom are you talking?\" I asked.\nThey looked closely at me and again exchanged glances.\n\"There's someone up yonder at the inn, Joe,\" the smith said kindly; \"and Ben, here, getting sight of him last night and again this morning, has took a notion that it's a fellow who used to live here years ago and who left town—well, in a hurry. As to that, I can't be sure, but I'd not be surprised if it was Neil Gleazen after all.\"", "Read the following excerpt, which continues the story from the lesson.\n\nThe Great Quest\nBy Charles Boardman Hawes\n\nI now discerned in one of the rocking-chairs on the porch the figure of a stranger, well dressed so far as we could see at that distance, who wore a big beaver hat set rakishly a trifle forward. He had thrust his thumbs into the armholes of his waistcoat, and as he leaned back, with his feet raised against one of the columns that supported the porch-roof, he sent clouds of white cigar-smoke eddying up and away.\nThe others were so intent on their random speculations that, when I asked more about who and what Neil Gleazen was, they ignored my question, and continued to exchange observations in low voices.\nI could hear little of their talk without forcing myself into their very midst, and of what little I heard I made still less, for it was full of unfamiliar names and reminiscences that meant nothing to me.\nWhen someone spoke of Seth Upham, my mother's brother, I was all ears on the instant; but I saw the smith glance at me, and probably he nudged the speaker, for, after a moment's pause, they went on about indifferent matters. I then perceived that I was unlikely to learn more, so I returned to the road and continued on my way.\nAs I passed the tavern I took occasion to see what I could, in courtesy, of the stranger; but he looked so hard at me while I was passing that I could steal only glances at him, unless I gave him stare for stare, which I did not wish to do. So I got only a brief glimpse of tall hat, bold dark eyes under bushy brows, big nose, smooth-shaven chin, and smiling mouth, all of which a heavy stock and voluminous coat seemed to support. I thought that I caught the flash of a jeweled pin in the man's stock and of a ring on his finger, but of that I was not sure until later. Pushing on, I left him in the old inn chair, as proud as a sultan, puffing clouds of white smoke from a long cigar and surveying the village as grandly as if he owned it, while I went about my uncle's business at the other end of the town.\nBut when I had gone far on my way, his dark face and arrogant manner were still in my mind. While I was arguing with surly old Dan Mackay about whale-oil and horses and sugar and lumber, I was thinking of those proud, keen eyes and that smiling, scornful mouth; while I was bargaining with Mrs. Mackay for eggs and early peas, I was thinking of the beaver that the man had worn and the big ring on his finger; and while I was walking back over two miles of country road, on which the sun was now pouring down with ever-increasing heat, I was thinking of how my uncle's name had popped out in the conversation beside the smithy—and how it had popped, so to speak, discreetly back again.\nI was all eagerness, now, for another and better look at the stranger, and was resolved to stare him out of countenance, if need be, to get it. Imagine, then, my disappointment when, hot and sweaty, I once more came in sight of the tavern and saw the unmistakable figure under the beaver hat walk jauntily down the steps, pause a moment in the road, and, turning in the opposite direction, go rapidly away from me.\nThe stranger should not escape me like that, I thought with a grim chuckle; and warm though I was, I lengthened my stride and drew slowly up on him.\nAs he passed the smithy, he looked to neither right nor left, yet I was by no means sure that he did not see the curious faces that filled the door when he went by. A man can see so much without turning his head!"]}, {"unit": "Comprehension Skills", "topic": "Generating Questions and Making Predictions", "lesson": "Generate questions before, during, and after reading", "texts": []}, {"unit": "Comprehension Skills", "topic": "Interactive Elements of Stories", "lesson": "Analyze how conflict drives plot", "texts": ["Read the excerpt and answer the questions that follow.\n\nAdapted from\nThe Cask of Amontillado\nBy Edgar Allan Poe\n\nThe thousand injuries of Fortunato I had borne as I best could, but when he ventured upon insult, I vowed revenge. You, who so well know the nature of my soul, will not suppose, however, that I gave utterance to a threat. At length I would be avenged; this was a point definitely settled—but the very definitiveness with which it was resolved, precluded the idea of risk. I must not only punish, but punish with impunity. A wrong is unredressed when retribution overtakes its redresser. It is equally unredressed when the avenger fails to make himself felt as such to him who has done the wrong.\nIt must be understood that neither by word nor deed had I given Fortunato cause to doubt my good will. I continued, as was my wont, to smile in his face, and he did not perceive that my smile now was at the thought of his immolation.*\nHe had a weak point—this Fortunato—although in other regards he was a man to be respected and even feared. He prided himself on his connoisseurship in wine. Few Italians have the true virtuoso spirit. For the most part their enthusiasm is adopted to suit the time and opportunity—to practise imposture upon the British and Austrian millionaires. In painting and gemmary, Fortunato, like his countrymen, was a quack—but in the matter of old wines he was sincere. In this respect I did not differ from him materially: I was skillful in the Italian vintages myself, and bought largely whenever I could.\nIt was about dusk, one evening during the supreme madness of the carnival season, that I encountered my friend. He accosted me with excessiv
