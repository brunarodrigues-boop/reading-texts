ed out to Robin, \"Hulloa, where goest thou, little lad, with thy one-penny bow and thy farthing shafts?\"\nThen Robin grew angry, for no young man likes to be taunted for his youth.\n\"Now,\" quoth he, \"my bow and mine arrows are as good as any; and moreover, I go to the shooting match at Nottingham Town; there I will shoot with other stout yeomen, for a prize has been offered.\"\nThen one said, \"Ho! listen to the lad! Why, boy, you are hardly out of the cradle, and yet you speak of standing up with good stout men at Nottingham, you who are scarcely able to draw back a string on a bow.\"\nAt this Robin grew right mad. \"Listen,\" said he, \"yonder, at the glade's end, I see a herd of deer. I'll bet you twenty marks that from this distance, I cause the noblest among them to die.\"\n\"Now done!\" cried he who had spoken first. \"And here are twenty marks.\"\nThen Robin took his good yew bow in his hand, and he strung it right deftly; then he nocked an arrow and, raising the bow, drew the gray goose feather to his ear; the next moment the bowstring rang and the arrow sped down the glade as a sparrowhawk skims in a northern wind. High leaped the noblest heart of all the herd, only to fall dead, reddening the green path with his blood.\n\"Ha!\" cried Robin, \"how do you like that shot, good fellow?\"\nThen all the foresters were filled with rage, and he who had spoken the first and had lost the wager was more angry than all.\n\"Nay,\" cried he, \"the wager is nothing, and be gone, straightway, or, by all the saints of heaven, I'll baste your sides until you'll ne'er be able to walk again.\"\n\"Don't you know,\" said another, \"that you have killed the King's deer, and, by the laws of our gracious lord and sovereign King Harry, your ears should be shaven close to your head?\"\n\"Catch him!\" cried a third.\n\"Nay,\" said a fourth, \"let him go because of his tender years.\"\nNever a word said Robin Hood, but he looked at the foresters with a grim face; then, turning on his heel, strode away from them down the forest glade. But his heart was bitterly angry, for his blood was hot and youthful and prone to boil.\nNow, well would it have been for him who had first spoken had he left Robin Hood alone; but his anger was hot because the youth had gotten the better of him. So, all of a sudden, without any warning, he sprang to his feet, and seized upon his bow and fitted it to a shaft. \"Ay,\" cried he, \"and I'll hurry you away.\" And he sent the arrow whistling after Robin.\nThe arrow whistled within three inches of Robin's head. Then he turned around and quickly drew his own bow, and sent an arrow back in return.\n\"You said I was no archer,\" cried he aloud, \"but say so now again!\"\nThe shaft flew straight; the archer fell forward with a cry, and lay on his face upon the ground. Then, before the others could gather their wits about them, Robin Hood was gone into the depths of the greenwood. Some started after him, but not with much heart, for each feared to suffer the death of his fellow; so presently they all came and lifted the dead man up and bore him away to Nottingham Town.\nMeanwhile Robin Hood ran through the greenwood. Gone was all the joy and brightness from everything, for his heart was sick within him, and it weighed upon his soul that he had slain a man.\n\"Alas!\" cried he, \"I wish that you had never said one word to me, or that I had never passed your way, or even that my right forefinger had been stricken off before this had happened!\"\nAnd so he came to dwell in the greenwood that was to be his home for many a year to come, never again to see the happy days with the lads and lasses of sweet Locksley Town; for he was outlawed, not only because he had killed a man, but also because he had poached upon the King's deer, and two hundred pounds were set upon his head, as a reward for whoever would bring him to the court of the King."]}, {"unit": "Comprehension Skills", "topic": "Interactive Elements of Stories", "lesson": "Analyze the effects of hypothetical character changes", "texts": []}, {"unit": "Comprehension Skills", "topic": "Interactions Between Individuals, Events, and Ideas", "lesson": "Analyze how an event affects an individual, subsequent event, or idea", "texts": []}, {"unit": "Comprehension Skills", "topic": "Interactions Between Individuals, Events, and Ideas", "lesson": "Analyze how individuals’ actions or ideas can influence others", "texts": []}, {"unit": "Comprehension Skills", "topic": "Interactions Between Individuals, Events, and Ideas", "lesson": "Analyze how individuals influence the way that events happen", "texts": []}, {"unit": "Comprehension Skills", "topic": "Interactions Between Individuals, Events, and Ideas", "lesson": "Identify and describe the interactions between key individuals, events, and ideas", "texts": []}, {"unit": "Comprehension Skills", "topic": "Interactions Between Individuals, Events, and Ideas", "lesson": "Analyze how authors strategically introduce individuals, events, and ideas to make a larger point", "texts": []}, {"unit": "Comprehension Skills", "topic": "Themes", "lesson": "Distinguish between theme and main idea", "texts": []}, {"unit": "Comprehension Skills", "topic": "Themes", "lesson": "Identify stated and unstated theme", "texts": []}, {"unit": "Comprehension Skills", "topic": "Themes", "lesson": "Recognize how different elements develop theme", "texts": []}, {"unit": "Comprehension Skills", "topic": "Themes", "lesson": "Identify the theme of an image", "texts": []}, {"unit": "Comprehension Skills", "topic": "Themes", "lesson": "Identify the theme by analyzing character quotes, actions and traits", "texts": ["Read the story below, paying close attention to how the characters develop the theme.\n\nThe Cowardly Lion and the Hungry Tiger\nBy L. Frank Baum\n\nIn the splendid palace of the Emerald City, which is in the center of the fairy Land of Oz, is a great Throne Room, where Princess Ozma, the Ruler, for an hour each day sits in a throne of glistening emeralds and listens to all the troubles of her people, which they are sure to tell her about. Crouched on either side the throne are two enormous beasts known as the Hungry Tiger and the Cowardly Lion.\nThese two beasts are Ozma's chief guardians, but as everyone loves the beautiful girl Princess there has never been any disturbance in the great Throne Room, or anything for the guardians to do but look fierce and solemn and keep quiet until the Royal Audience is over and the people go away to their homes.\nOf course no one would dare be naughty while the huge Lion and Tiger crouched beside the throne; but the fact is, the people of Oz are very seldom naughty. So Ozma's big guards are more ornamental than useful, and no one realizes that better than the beasts themselves.\nOne day, after everybody had left the Throne Room except the Cowardly Lion and the Hungry Tiger, the Lion yawned and said to his friend:\n\"I'm getting tired of this job. No one is afraid of us and no one pays any attention to us.\"\n\"That is true,\" replied the big Tiger, purring softly. \"We might as well be in the thick jungles where we were born, as trying to protect Ozma when she needs no protection. And I'm dreadfully hungry all the time.\"\n\"You have enough to eat, I'm sure,\" said the Lion, swaying his tail slowly back and forth.\n\"Enough, perhaps; but not the kind of food I long for,\" answered the Tiger. \"What I'm hungry for is fat babies. I have a great desire to eat a few fat babies. Then, perhaps, the people of Oz would fear me and I'd become more important.\"\n\"True,\" agreed the Lion. \"It would stir up quite a rumpus if you ate but one fat baby. As for myself; my claws are sharp as needles and strong as crowbars, while my teeth are powerful enough to tear a person to pieces in a few seconds. If I should spring upon a man and make chop suey of him, there would be wild excitement in the Emerald City and the people would fall upon their knees and beg me for mercy. That, in my opinion, would render me of considerable importance.\"\n\"After you had torn the person to pieces, what would you do next?\" asked the Tiger sleepily.\n\"Then I would roar so loudly it would shake the earth and stalk away to the jungle to hide myself, before anyone could attack me or kill me for what I had done.\"\n\"I see,\" nodded the Tiger. \"You are really cowardly.\"\n\"To be sure. That is why I am named the Cowardly Lion. That is why I have always been so tame and peaceable. But I'm awfully tired of being tame,\" added the Lion, with a sigh, \"and it would be fun to raise a row and show people what a terrible beast I really am.\"\nThe Tiger remained silent for several minutes, thinking deeply as he slowly washed his face with his left paw. Then he said: \"I'm getting old, and it would please me to eat at least one fat baby before I die. Suppose we surprise these people of Oz and prove our power. What do you say? We will walk out of here just as usual and the first baby we meet I'll eat in a jiffy, and the first man or woman you meet you will tear to pieces. Then we will both run out of the city gates and gallop across the country and hide in the jungle before anyone can stop us.\"\n\"All right; I'm game,\" said the Lion, yawning again so that he showed two rows of dreadfully sharp teeth.\nThe Tiger got up and stretched his great, sleek body.\n\"Come on,\" he said. The Lion stood up and proved he was the larger of the two, for he was almost as big as a small horse.\nOut of the palace they walked, and met no one. They passed through the beautiful grounds, past fountains and beds of lovely flowers, and met no one. Then they unlatched a gate and entered a street of the city, and met no one.\n\"I wonder how a fat baby will taste,\" remarked the Tiger, as they stalked majestically along, side by side.\n\"I imagine it will taste like nutmegs,\" said the Lion.\n\"No,\" said the Tiger, \"I've an idea it will taste like gumdrops.\"\nThey turned a corner, but met no one, for the people of the Emerald City were accustomed to take their naps at this hour of the afternoon.\n\"I wonder how many pieces I ought to tear a person into,\" said the Lion, in a thoughtful voice.\n\"Sixty would be about right,\" suggested the Tiger.\n\"Would that hurt any more than to tear one into about a dozen pieces?\" inquired the Lion, with a little shudder.\n\"Who cares whether it hurts or not?\" growled the Tiger.\nThe Lion did not reply. They entered a side street, but met no one.\nSuddenly they heard a child crying.\n\"Aha!\" exclaimed the Tiger. \"There is my meat.\"\nHe rushed around a corner, the Lion following, and came upon a nice fat baby sitting in the middle of the street and crying as if in great distress.\n\"What's the matter?\" asked the Tiger, crouching before the baby.\n\"I—I—I-lost my m-m-mamma!\" wailed the baby.\n\"Why, you poor little thing,\" said the great beast, softly stroking the child's head with its paw. \"Don't cry, my dear, for mamma can't be far away and I'll help you to find her.\"\n\"Go on,\" said the Lion, who stood by.\n\"Go on where?\" asked the Tiger, looking up.\n\"Go on and eat your fat baby.\"\n\"Why, you dreadful creature!\" said the Tiger reproachfully; \"would you want me to eat a poor little lost baby, that doesn't know where its mother is?\" And the beast gathered the little one into its strong, hairy arms and tried to comfort it by rocking it gently back and forth.\nThe Lion growled low in his throat and seemed very much disappointed; but at that moment a scream reached their ears and a woman came bounding out of a house and into the street. Seeing her baby in the embrace of the monster Tiger the woman screamed again and rushed forward to rescue it, but in her haste she caught her foot in her skirt and tumbled head over heels and heels over head, stopping with such a bump that she saw many stars in the heavens, although it was broad daylight. And there she lay, in a helpless manner, all tangled up and unable to stir.\nWith one bound and a roar like thunder the huge Lion was beside her. With his strong jaws he grasped her dress and raised her into an upright position.\n\"Poor thing! Are you hurt?\" he gently asked.\nGasping for breath the woman struggled to free herself and tried to walk, but she limped badly and tumbled down again.\n\"My baby!\" she said pleadingly.\n\"The baby is all right; don't worry,\" replied the Lion; and then he added: \"Keep quiet, now, and I'll carry you back to your house, and the Hungry Tiger will carry your baby.\"\nThe Tiger, who had approached the place with the child in its arms, asked in astonishment:\n\"Aren't you going to tear her into sixty pieces?\"\n\"No, nor into six pieces,\" answered the Lion indignantly. \"I'm not such a brute as to destroy a poor woman who has hurt herself trying to save her lost baby. If you are so ferocious and cruel and bloodthirsty, you may leave me and go away, for I do not care to associate with you.\"\n\"That's all right,\" answered the Tiger. \"I'm not cruel—not in the least—I'm only hungry. But I thought you were cruel.\"\n\"Thank heaven I'm respectable,\" said the Lion, with dignity. He then raised the woman and with much gentleness carried her into her house, where he laid her upon a sofa. The Tiger followed with the baby, which he safely deposited beside its mother. The little one liked the Hungry Tiger and grasping the enormous beast by both ears the baby kissed the beast's nose to show he was grateful and happy.\n\"Thank you very much,\" said the woman. \"I've often heard what good beasts you are, in spite of your power to do mischief to mankind, and now I know that the stories are true. I do not think either of you have ever had an evil thought.\"\nThe Hungry Tiger and the Cowardly Lion hung their heads and did not look into each other's eyes, for both were shamed and humbled. They crept away and stalked back through the streets until they again entered the palace grounds, where they retreated to the pretty, comfortable rooms they occupied at the back of the palace. There they silently crouched in their usual corners to think over their adventure.\nAfter a while the Tiger said sleepily:\n\"I don't believe fat babies taste like gumdrops. I'm quite sure they have the flavor of raspberry tarts. My, how hungry I am for fat babies!\"\nThe Lion grunted disdainfully.\n\"You're a humbug,\" said he.\n\"Am I?\" retorted the Tiger, with a sneer. \"Tell me, then, into how many pieces you usually tear your victims, my bold Lion?\"\nThe Lion impatiently thumped the floor with his tail.\n\"To tear anyone into pieces would soil my claws and blunt my teeth,\" he said. \"I'm glad I didn't muss myself up this afternoon by hurting that poor mother.\"\nThe Tiger looked at him steadily and then yawned a wide, wide yawn.\n\"You're a coward,\" he remarked.\n\"Well,\" said the Lion, \"it's better to be a coward than to do wrong.\"\n\"To be sure,\" answered the other. \"And that reminds me that I nearly lost my own reputation. For, had I eaten that fat baby I would not now be the Hungry Tiger. It's better to go hungry, seems to me, than to be cruel to a little child.\"\nAnd then they dropped their heads on their paws and went to sleep.", "Read the passage below, paying close attention to how the characters develop the theme.\n\nThe Magic Bon Bons\nBy L. Frank Baum\n\nThere lived in Boston a wise and ancient chemist by the name of Dr. Daws, who dabbled somewhat in magic. There also lived in Boston a young lady by the name of Claribel Sudds, who was possessed of much money, little wit and an intense desire to go upon the stage.\nSo Claribel went to Dr. Daws and said:\n\"I can neither sing nor dance; I cannot recite verse nor play upon the piano; I am no acrobat nor leaper nor high kicker; yet I wish to go upon the stage. What shall I do?\"\n\"Are you willing to pay for such accomplishments?\" asked the wise chemist.\n\"Certainly,\" answered Claribel, jingling her purse.\n\"Then come to me tomorrow at two o'clock,\" said he.\nAll that night he practiced what is known as chemical sorcery; so that when Claribel Sudds came next day at two o'clock he showed her a small box filled with compounds that closely resembled French bonbons.\n\"This is a progressive age,\" said the old man, \"and I flatter myself your Uncle Daws keeps right along with the procession. Now, one of your old-fashioned sorcerers would have made you some nasty, bitter pills to swallow; but I have consulted your taste and convenience. Here are some magic bonbons. If you eat this one with the lavender color you can dance thereafter as lightly and gracefully as if you had been trained a lifetime. After you consume the pink confection you will sing like a nightingale. Eating the white one will enable you to become the finest elocutionist in the land. The chocolate piece will charm you into playing the piano better than Rubenstein, while after eating you lemon-yellow bonbon you can easily kick six feet above your head.\"\n\"How delightful!\" exclaimed Claribel, who was truly enraptured. \"You are certainly a most clever sorcerer as well as a considerate compounder,\" and she held out her hand for the box.\n\"Ahem!\" said the wise one; \"a check, please.\"\n\"Oh, yes; to be sure! How stupid of me to forget it,\" she returned.\nHe considerately retained the box in his own hand while she signed a check for a large amount of money, after which he allowed her to hold the box herself.\n\"Are you sure you have made them strong enough?\" she inquired, anxiously; \"it usually takes a great deal to affect me.\"\n\"My only fear,\" replied Dr. Daws, \"is that I have made them too strong. For this is the first time I have ever been called upon to prepare these wonderful confections.\"\n\"Don't worry,\" said Claribel; \"the stronger they act the better I shall act myself.\"\nShe went away, after saying this, but stopping in at a dry goods store to shop, she forgot the precious box in her new interest and left it lying on the ribbon counter.\nThen little Bessie Bostwick came to the counter to buy a hair ribbon and laid her parcels beside the box. When she went away she gathered up the box with her other bundles and trotted off home with it.\nBessie never knew, until after she had hung her coat in the hall closet and counted up her parcels, that she had one too many. Then she opened it and exclaimed:\n\"Why, it's a box of candy! Someone must have mislaid it. But it is too small a matter to worry about; there are only a few pieces.\" So she dumped the contents of the box into a bonbon dish that stood upon the hall table and picking out the chocolate piece—she was fond of chocolates—ate it daintily while she examined her purchases.\nThese were not many, for Bessie was only twelve years old and was not yet trusted by her parents to expend much money at the stores. But while she tried on the hair ribbon she suddenly felt a great desire to play upon the piano, and the desire at last became so overpowering that she went into the parlor and opened the instrument.\nThe little girl had, with infinite pains, contrived to learn two \"pieces\" which she usually executed with a jerky movement of her right hand and a left hand that forgot to keep up and so made dreadful discords. But under the influence of the chocolate bonbon she sat down and ran her fingers lightly over the keys producing such exquisite harmony that she was filled with amazement at her own performance.\nThat was the prelude, however. The next moment she dashed into Beethoven's seventh sonata and played it magnificently.\nHer mother, hearing the unusual burst of melody, came downstairs to see what musical guest had arrived; but when she discovered it was her own little daughter who was playing so divinely she had an attack of palpitation of the heart (to which she was subject) and sat down upon a sofa until it should pass away.\nMeanwhile Bessie played one piece after another with untiring energy. She loved music, and now found that all she need do was to sit at the piano and listen and watch her hands twinkle over the keyboard.\nTwilight deepened in the room and Bessie's father came home and hung up his hat and overcoat and placed his umbrella in the rack. Then he peeped into the parlor to see who was playing.\n\"Great Caesar!\" he exclaimed. But the mother came to him softly with her finger on her lips and whispered: \"Don't interrupt her, John. Our child seems to be in a trance. Did you ever hear such superb music?\"\n\"Why, she's an infant prodigy!\" gasped the astounded father. \"Beats Blind Tom all hollow! It's—it's wonderful!\"\nAs they stood listening the senator arrived, having been invited to dine with them that evening. And before he had taken off his coat the Yale professor—a man of deep learning and scholarly attainments—joined the party.\nBessie played on; and the four elders stood in a huddled but silent and amazed group, listening to the music and waiting for the sound of the dinner gong.\nMr. Bostwick, who was hungry, picked up the bonbon dish that lay on the table beside him and ate the pink confection. The professor was watching him, so Mr. Bostwick courteously held the dish toward him. The professor ate the lemon-yellow piece and the senator reached out his hand and took the lavender piece. He did not eat it, however, for, chancing to remember that it might spoil his dinner, he put it in his vest pocket. Mrs. Bostwick, still intently listening to her precocious daughter, without thinking what she did, took the remaining piece, which was the white one, and slowly devoured it.\nThe dish was now empty, and Claribel Sudds' precious bonbons had passed from her possession forever!\nSuddenly Mr. Bostwick, who was a big man, began to sing in a shrill, tremolo soprano voice. It was not the same song Bessie was playing, and the discord was shocking that the professor smiled, the senator put his hands to his ears and Mrs. Bostwick cried in a horrified voice:\n\"William!\"\nHer husband continued to sing as if endeavoring to emulate the famous Christine Nillson, and paid no attention whatever to his wife or his guests.\nFortunately the dinner gong now sounded, and Mrs. Bostwick dragged Bessie from the piano and ushered her guests into the dining-room. Mr. Bostwick followed, singing \"The Last Rose of Summer\" as if it had been an encore demanded by a thousand delighted hearers.\nThe poor woman was in despair at witnessing her husband's undignified actions and wondered what she might do to control him. The professor seemed more grave than usual; the senator's face wore an offended expression, and Bessie kept moving her fingers as if she still wanted to play the piano.\nMrs. Bostwick managed to get them all seated, although her husband had broken into another aria; and then the maid brought in the soup.\nWhen she carried a plate to the professor, he cried, in an excited voice:\n\"Hold it higher! Higher—I say!\" And springing up he gave it a sudden kick that sent it nearly to the ceiling, from whence the dish descended to scatter soup over Bessie and the maid and to smash in pieces upon the crown of the professor's bald head.\nAt this atrocious act the senator rose from his seat with an exclamation of horror and glanced at his hostess.\nFor some time Mrs. Bostwick had been staring straight ahead, with a dazed expression; but now, catching the senator's eye, she bowed gracefully and began reciting \"The Charge of the Light Brigade\" in forceful tones.\nThe senator shuddered. Such disgraceful rioting he had never seen nor heard before in a decent private family. He felt that his reputation was at stake, and, being the only sane person, apparently, in the room, there was no one to whom he might appeal.\nThe maid had run away to cry hysterically in the kitchen; Mr. Bostwick was singing \"O Promise Me;\" the professor was trying to kick the globes off the chandelier; Mrs. Bostwick had switched her recitation to \"The Boy Stood on the Burning Deck,\" and Bessie had stolen into the parlor and was pounding out the overture from the \"Flying Dutchman.\"\nThe senator was not at all sure he would not go crazy himself, presently; so he slipped away from the turmoil, and, catching up his had and coat in the hall, hurried from the house.\nThat night he sat up late writing a political speech he was to deliver the next afternoon at Faneuil hall, but his experiences at the Bostwicks' had so unnerved him that he could scarcely collect his thoughts, and often he would pause and shake his head pityingly as he remembered the strange things he had seen in that usually respectable home.\nThe next day he met Mr. Bostwick in the street, but passed him by with a stony glare of oblivion. He felt he really could not afford to know this gentleman in the future. Mr. Bostwick was naturally indignant at the direct snub; yet in his mind lingered a faint memory of some quite unusual occurrences at his dinner party the evening before, and he hardly knew whether he dared resent the senator's treatment or not.\nThe political meeting was the feature of the day, for the senator's eloquence was well known in Boston. So the big hall was crowded with people, and in one of the front rows sat the Bostwick family, with the learned Yale professor beside them. They all looked tired and pale, as if they had passed a rather dissipated evening, and the senator was rendered so nervous by seeing them that he refused to look in their direction a second time.\nWhile the mayor was introducing him the great man sat fidgeting in his chair; and, happening to put his thumb and finger into his vest pocket, he found the lavender-colored bonbon he had placed there the evening before.\n\"This may clear my throat,\" thought the senator, and slipped the bonbon into his mouth.\nA few minutes afterwards he arose before the vast audience, which greeted him with enthusiastic plaudits.\n\"My friends,\" began the senator, in a grave voice, \"this is a most impressive and important occasion.\"\nThen he paused, balanced himself upon his left foot, and kicked his right leg into the air in the way favored by ballet-dancers!\nThere was a hum of amazement and horror from the spectators, but the senator appeared not to notice it. He whirled around upon the tips of his toes, kicked right and left in a graceful manner, and startled a bald-headed man in the front row by casting a languishing glance in his direction.\nSuddenly Claribel Sudds, who happened to be present, uttered a scream and sprang to her feet. Pointing an accusing finger at the dancing senator, she cried in a loud voice:\n\"That's the man who stole my bonbons! Seize him! Arrest him! Don't let him escape!\"\nBut the ushers rushed her out of the hall, thinking she had gone suddenly insane; and the senator's friends seized him firmly and carried him out the stage entrance to the street, where they put him into an open carriage and instructed the driver to take him home.\nThe effect of the magic bonbon was still powerful enough to control the poor senator, who stood upon the rear seat of the carriage and danced energetically all the way home, to the delight of the crowd of small boys who followed the carriage and the grief of the sober-minded citizens, who shook their heads sadly and whispered that \"another good man had gone wrong.\"\nIt took the senator several months to recover from the shame and humiliation of this escapade; and, curiously enough, he never had the slightest idea what had induced him to act in so extraordinary a manner. Perhaps it was fortunate the last bonbon had now been eaten, for they might easily have caused considerably more trouble than they did.\nOf course Claribel went again to the wise chemist and signed a check for another box of magic bonbons; but she must have taken better care of these, for she is now a famous vaudeville actress."]}, {"unit": "Comprehension Skills", "topic": "Themes", "lesson": "Compare internal and external conflict", "texts": ["Read the story. Then, answer the questions that follow.\n\nRikki Tikki Tavi\nBy Rudyard Kipling\n\nThis is an excerpt from The Jungle Book, a book of fables that uses animals to relay important moral messages.\n\nHe was a mongoose, rather like a little cat in his fur and his tail, but quite like a weasel in his head and his habits. His eyes and the end of his restless nose were pink. He could scratch himself anywhere he pleased with any leg, front or back, that he chose to use. He could fluff up his tail till it looked like a bottle brush, and his war cry as he scuttled through the long grass was: “Rikk-tikk-tikki-tikki-tchk!”\nRikki-tikki went out into the garden to see what was to be seen. It was a large garden, only half cultivated, with bushes, as big as summer-houses, of Marshal Niel roses, lime and orange trees, clumps of bamboos, and thickets of high grass.\nRikki-tikki licked his lips. “This is a splendid hunting-ground,\" he said, and his tail grew bottle-brushy at the thought of it, and he scuttled up and down the garden, snuffing here and there till he heard very sorrowful voices in a thorn-bush.\nIt was Darzee, the Tailorbird, and his wife. They had made a beautiful nest by pulling two big leaves together and stitching them up the edges with fibers, and had filled the hollow with cotton and downy fluff. The nest swayed to and fro, as they sat on the rim and cried.\n“What is the matter?” asked Rikki-tikki.\n“We are very miserable,” said Darzee. “One of our babies fell out of the nest yesterday and Nag ate him.”\n“H’m!” said Rikki-tikki, “that is very sad–but I am a stranger here. Who is Nag?”\nDarzee and his wife only cowered down in the nest without answering, for from the thick grass at the foot of the bush there came a low hiss–a horrid cold sound that made Rikki-tikki jump back two clear feet. Then inch by inch out of the grass rose up the head and spread hood of Nag, the big black cobra, and he was five feet long from tongue to tail. When he had lifted one-third of himself clear of the ground, he stayed balancing to and fro exactly as a dandelion tuft balances in the wind, and he looked at Rikki-tikki with the wicked snake’s eyes that never change their expression, whatever the snake may be thinking of.\n“Who is Nag?” said he. “I am Nag. The great god Brahm* put his mark upon all our people, when the first cobra spread his hood to keep the sun off Brahm as he slept. Look, and be afraid!”\nHe spread out his hood more than ever, and Rikki-tikki saw the spectacle-mark on the back of it that looks exactly like the eye part of a hook-and-eye fastening. He was afraid for the minute, but it is impossible for a mongoose to stay frightened for any length of time, and though Rikki-tikki had never met a live cobra before, his mother had fed him on dead ones, and he knew that all a grown mongoose’s business in life was to fight and eat snakes. Nag knew that too and, at the bottom of his cold heart, he was afraid.\n“Well,” said Rikki-tikki, and his tail began to fluff up again, “marks or no marks, do you think it is right for you to eat fledglings out of a nest?”\nNag was thinking to himself, and watching the least little movement in the grass behind Rikki-tikki. He knew that mongooses in the garden meant death sooner or later for him and his family, but he wanted to get Rikki-tikki off his guard. So he dropped his head a little, and put it on one side.\n“Let us talk,” he said. “You eat eggs. Why should not I eat birds?”\n“Behind you! Look behind you!” sang Darzee.\nRikki-tikki knew better than to waste time in staring. He jumped up in the air as high as he could go, and just under him whizzed by the head of Nagaina, Nag’s wicked wife. She had crept up behind him as he was talking, to make an end of him. He heard her savage hiss as the stroke missed. He came down almost across her back, and if he had been an old mongoose he would have known that then was the time to break her back with one bite; but he was afraid of the terrible lashing return stroke of the cobra. He bit, indeed, but did not bite long enough, and he jumped clear of the whisking tail, leaving Nagaina torn and angry.", "Read the story below. Then, use the story to answer the questions that follow.\n\nThe Life and Adventures of Santa Claus\nBy L. Frank Baum\n\n\nOne day, as the Toymaker sat before his door to enjoy the sunshine while he busily carved the head and horns of a toy deer, he looked up and discovered a glittering gang of horsemen approaching through the Valley.\nWhen they drew nearer he saw that the band consisted of a score of men-at-arms, clad in bright armor and bearing in their hands spears and battle-axes. In front of these rode little Bessie Blithesome, the pretty daughter of that proud Lord of Lerd who had once driven the kind Toymaker from his palace. Her horse was pure white, its bridle was covered with glittering gems, and its saddle draped with a rich cloth of gold. The soldiers were sent to protect her from harm while she journeyed.\nThe Toymaker was surprised, but he continued to whittle and to sing until the cavalcade drew up before him. Then the little girl leaned over the neck of her horse and said: “Please, Mr. Toymaker, I want a toy!”\nHer voice was so pleading that the Toymaker jumped up at once and stood beside her. But he was puzzled how to answer her request.\n“You are a rich lord’s daughter,” said he, “and have all that you desire.”\n“Except toys,” Bessie said. “There are no toys in the world but yours.”\n“And I make them for the poor children, who have nothing else to amuse them,” continued the Toymaker.\n“Do poor children love to play with toys more than rich ones?” asked Bessie.\n“I suppose not,” said the Toymaker, thoughtfully.\n“Am I to blame because my father is a lord? Must I be denied the toys I long for because other children are poorer?” she inquired earnestly.\n“I’m afraid you must, dear,” he answered; “for the poor have nothing else with which to amuse themselves. You have your pony to ride, your servants to wait on you, and every comfort that money can procure.”\n“But I want toys!” cried Bessie, wiping away the tears that forced themselves into her eyes. “If I cannot have them, I shall be unhappy.”\nThe Toymaker was troubled, for her grief recalled to him the thought that his desire was to make all children happy, without regard to their condition in life. Yet, while so many poor children were clamoring for his toys he could not bear to give one to them to Bessie Blithesome, who had so much already to make her happy.\n“Listen, my child,” said he, gently; “all the toys I am now making are promised to others. But the next shall be yours, since your heart so longs for it. Come to me again in two days and it shall be ready for you.”\nBessie gave a cry of delight, and kissed the Toymaker upon his forehead, then rode gaily away, leaving him to his work.\n“If I am to supply the rich children as well as the poor ones,” he thought, “I shall not have a spare moment in the whole year! But is it right I should give to the rich? Surely I must go to Necile and talk with her about this matter.”\nSo when he had finished the toy deer,he walked into Burzee and made his way to the bower of the beautiful Nymph Necile, who had been his foster mother. She greeted him tenderly and lovingly, listening with interest to his story of the visit of Bessie Blithesome.\n“And now tell me,” said he, “shall I give toys to rich children?”\n“We of the Forest know nothing of riches,” she replied. “It seems to me that one child is like another child, since they are all made of the same clay, and that riches are like a gown, which may be put on or taken away, leaving the child unchanged. But the Fairies are guardians of mankind, and know mortal children better. Let us call the Fairy Queen.”\nThis was done, and the Queen of the Fairies sat beside them and heard the magical Toymaker relate his reasons for thinking the rich children could get along without his toys, and also what the Nymph had said.\n“Necile is right,” declared the Queen; “for, whether it be rich or poor, a child’s longings for pretty playthings are but natural. Rich Bessie’s heart may suffer as much grief as poor Mayrie’s; she can be just as lonely and discontented, and just as happy. I think, friend, it is your duty to make all little ones glad, whether they chance to live in palaces or in cottages.”\n“Your words are wise, fair Queen,” replied the Toymaker, “and my heart tells me they are as just as they are wise. Hereafter all children may claim my services.”\nThen he bowed before the gracious Fairy, kissed his mother on the cheek, and went back into his Valley."]}, {"unit": "Comprehension Skills", "topic": "Themes", "lesson": "Identify theme by analyzing conflicts in a text", "texts": ["Read the story below, paying attention to the main conflict of the story.\n\nThe Cowardly Lion and the Hungry Tiger\nBy L. Frank Baum\n\nIn the splendid palace of the Emerald City in the fairy Land of Oz is a great Throne Room. Here Princess Ozma, the Ruler, sits for an hour each day in a throne of glistening emeralds, listening to all the troubles of her people. Crouched on either side the throne are two enormous beasts known as the Hungry Tiger and the Cowardly Lion. These two beasts are Ozma's chief guardians, but as everyone loves the beautiful girl Princess, there has never been any disturbance in the great Throne Room. The fact is, the people of Oz are very seldom naughty, so Ozma's big guards are more ornamental than useful. No one realizes that better than the beasts themselves.\nOne day, the Lion yawned and said to his friend, \"I'm getting tired of this job. No one is afraid of us and no one pays any attention to us.\"\n\"That is true,\" replied the big Tiger, purring softly. \"We might as well be in the thick jungles where we were born, as trying to protect Ozma when she needs no protection. And I'm dreadfully hungry all the time.\"\n\"You have enough to eat, I'm sure,\" said the Lion, swaying his tail slowly back and forth.\n\"Enough, perhaps, but not the kind of food I long for,\" answered the Tiger. \"What I'm hungry for is fat babies. Then, perhaps, the people of Oz would fear me and I'd become more important.\"\n\"True,\" agreed the Lion. \"As for myself; my claws are sharp as needles and strong as crowbars, while my teeth are powerful enough to tear a person to pieces in a few seconds. If I should spring upon a man and make chop suey of him, there would be wild excitement in the Emerald City and the people would fall upon their knees and beg me for mercy. That, in my opinion, would render me of considerable importance.\"\n\"After you had torn the person to pieces, what would you do next?\" asked the Tiger sleepily.\n\"Then I would roar so loudly it would shake the earth and stalk away to the jungle to hide myself, before anyone could attack me or kill me for what I had done.\"\n\"I see,\" nodded the Tiger. \"You are really cowardly.\"\n\"To be sure. That is why I am named the Cowardly Lion. But I'm awfully tired of being tame,\" added the Lion, with a sigh.\nThe Tiger remained silent for several minutes, thinking deeply as he slowly washed his face with his left paw. Then he said,\n\"I'm getting old, and it would please me to eat at least one fat baby before I die. Suppose we surprise these people of Oz and prove our power. We will walk out of here just as usual and the first baby we meet I'll eat in a jiffy, and the first man or woman you meet you will tear to pieces.\"\n\"All right; I'm game,\" said the Lion, yawning again so that he showed two rows of dreadfully sharp teeth.\nThe Tiger got up and stretched his great, sleek body. \"Come on,\" he said. The Lion stood up and proved he was the larger of the two, for he was almost as big as a small horse.\nOut of the palace they walked, and met no one. They passed fountains and beds of lovely flowers, and met no one. Then they entered a street of the city, and met no one.\n\"I wonder how a fat baby will taste,\" remarked the Tiger.\n\"I imagine it will taste like nutmeg,\" said the Lion.\n\"No,\" said the Tiger, \"I've an idea it will taste like gumdrops.\"\nThey turned a corner, but met no one.\n\"I wonder how many pieces I ought to tear a person into,\" said the Lion, in a thoughtful voice.\n\"Sixty would be about right,\" suggested the Tiger.\nThey entered a side street, but met no one.\nSuddenly they heard a child crying.\n\"Aha!\" exclaimed the Tiger. \"There is my meat.\"\nHe rushed around a corner and came upon a nice fat baby sitting in the middle of the street and crying as if in great distress.\n\"What's the matter?\" asked the Tiger, crouching before the baby.\n\"I—I—I-lost my m-m-mamma!\" wailed the baby.\n\"Why, you poor little thing,\" said the great beast, softly stroking the child's head with its paw. \"Don't cry, my dear, for mamma can't be far away and I'll help you to find her.\"\n\"Go on and eat your fat baby,\" said the Lion, who stood by.\n\"Why, you dreadful creature!\" said the Tiger reproachfully. \"You would want me to eat a poor little lost baby, that doesn't know where its mother is?\" The Tiger gathered the little one into its strong arms and tried to comfort it by rocking it gently.\nThe Lion seemed very much disappointed, but at that moment a scream reached their ears, and a woman came bounding out of a house and into the street. Seeing her baby in the embrace of the Tiger, the woman screamed again and rushed forward to rescue it. In her haste, however, she tumbled head over heels. There she lay, helplessly tangled up.\nWith one bound, the huge Lion was beside her. With his strong jaws he raised her into an upright position.\n\"Poor thing! Are you hurt?\" he gently asked.\n\"My baby!\" she said pleadingly.\n\"The baby is all right; don't worry,\" replied the Lion. Then he added, \"Keep quiet, now, and I'll carry you back to your house, and the Hungry Tiger will carry your baby.\"\nThe Tiger, who had approached the place with the child in its arms, asked in astonishment:\n\"Aren't you going to tear her into sixty pieces?\"\n\"No, nor into six pieces,\" answered the Lion indignantly. \"I'm not such a brute as to destroy a poor woman who has hurt herself trying to save her lost baby. If you are so cruel, I do not care to associate with you.\"\n\"That's all right,\" answered the Tiger. \"I'm not cruel—not in the least—I'm only hungry. But I thought you were cruel.\"\nThe Lion then raised the woman and with much gentleness carried her into her house.\nThe Tiger followed with the baby, which he safely deposited beside its mother. The little one liked the Hungry Tiger and grasping the enormous beast by both ears, the baby kissed the beast's nose to show he was grateful and happy.\n\"Thank you very much,\" said the woman. \"I've often heard what good beasts you are, and now I know that the stories are true. I do not think either of you have ever had an evil thought.\"\nThe Hungry Tiger and the Cowardly Lion hung their heads and did not look into each other's eyes, for both were shamed and humbled. They crept away to the palace grounds. There they silently crouched in their usual corners to think over their adventure.\nAfter a while the Tiger said sleepily: \"I'm quite sure that fat babies must have the flavor of raspberry tarts. My, how hungry I am for fat babies!\"\nThe Lion grunted disdainfully. \"You're a humbug,\" said he.\n\"Am I?\" retorted the Tiger, with a sneer. \"Tell me, then, into how many pieces you usually tear your victims, my bold Lion?\"\n\"To tear anyone into pieces would soil my claws and blunt my teeth,\" he said. \"I'm glad I didn't muss myself up this afternoon by hurting that poor mother.\"\nThe Tiger looked at him steadily and then yawned a wide, wide yawn. \"You're a coward,\" he remarked.\n\"Well,\" said the Lion, \"it's better to be a coward than to do wrong.\"\n\"To be sure,\" answered the other. \"And that reminds me that I nearly lost my own reputation. For, had I eaten that fat baby I would not now be the Hungry Tiger. It's better to go hungry, seems to me, than to be cruel to a little child.\"\nAnd then they dropped their heads on their paws and went to sleep.", "Read the story below, paying attention to the main conflict of the story.\n\nAdapted from\nThe Magic Bon-Bons\nFrom American Fairy Tales\nBy L. Frank Baum\n\nThere lived in Boston a wise and ancient chemist by the name of Dr. Daws, who dabbled somewhat in magic. There also lived in Boston a young lady by the name of Claribel Sudds, who was possessed of much money, little wit, and an intense desire to go upon the stage.\nSo Claribel went to Dr. Daws and said, \"I can neither sing nor dance; I cannot recite verse nor play upon the piano; yet I wish to go upon the stage. What shall I do?\"\n\"Are you willing to pay for such accomplishments?\" asked the wise chemist.\n\"Certainly,\" answered Claribel, jingling her purse.\n\"Then come to me to-morrow at two o'clock,\" said he.\nAll that night he practiced what is known as chemical sorcery; so that when Claribel Sudds came next day at two o'clock he showed her a small box filled with compounds that closely resembled French bonbons.\n\"Here are some magic bonbons. If you eat this one with the lavender color you can dance thereafter as lightly and gracefully as if you had been trained a lifetime. After you consume the pink confection you will sing like a nightingale. Eating the white one will enable you to become the finest elocutionist in the land. The chocolate piece will charm you into playing the piano better than Rubenstein.\"\n\"How delightful!\" exclaimed Claribel, who paid the chemist and happily took the box.\nShe went away, but stopping in at a store to shop, she forgot the precious box and left it lying on the ribbon counter.\nThen little Bessie Bostwick came to the counter to buy a hair ribbon and laid her parcels beside the box. When she went away she gathered up the box with her other bundles and trotted off home with it.\nAt home, Bessie opened the extra parcel and exclaimed, \"Why, it's a box of candy! Someone must have mislaid it.\" She dumped the contents of the box into a bonbon dish that stood upon the hall table and daintily ate the chocolate piece.\nWhile she tried on the hair ribbon the sudden desire to play upon the piano became so overpowering that she went into the parlor and opened the instrument.\nThe little girl had, with infinite pains, contrived to learn two \"pieces\" which she usually executed with a jerky movement of her right hand and a left hand that forgot to keep up and so made dreadful discords. But under the influence of the chocolate bonbon she sat down and ran her fingers lightly over the keys producing such exquisite harmony that she was filled with amazement at her own performance.\nHer mother, hearing the unusual burst of melody, came downstairs to see what musical guest had arrived; but when she discovered it was her own little daughter who was playing so divinely she had an attack of palpitation of the heart and sat down upon a sofa.\nMeanwhile Bessie played one piece after another with untiring energy.\nTwilight deepened in the room and Bessie's father came home and peeped into the parlor to see who was playing.\n\"Great Caesar!\" he exclaimed.\nBut the mother whispered, \"Don't interrupt her, John. Our child seems to be in a trance. Did you ever hear such superb music?\"\n\"Why, she's an infant prodigy!\" gasped the astounded father.\nAs they stood listening the senator arrived, having been invited to dine with them that evening.\nBessie played on; and the three elders stood in a huddled but silent and amazed group, listening to the music.\nMr. Bostwick, who was hungry, picked up the bonbon dish that lay on the table beside him and ate the pink confection. The senator reached out his hand and took the lavender piece. He did not eat it, however, for, chancing to remember that it might spoil his dinner, he put it in his vest pocket. Mrs. Bostwick took the remaining piece, the white one, and slowly devoured it.\nSuddenly Mr. Bostwick, who was a big man, began to sing in a shrill, tremolo soprano voice, and Mrs. Bostwick cried in a horrified voice: \"William!\"\nHer husband continued to sing and paid no attention whatever to his wife or his guest. Mrs. Bostwick dragged Bessie from the piano and ushered her guest into the dining-room. Mr. Bostwick followed, singing \"The Last Rose of Summer\" as if it had been an encore demanded by a thousand delighted hearers.\nThe poor woman was in despair at witnessing her husband's undignified actions and wondered what she might do to control him. The senator's face wore an offended expression, and Bessie kept moving her fingers as if she still wanted to play the piano.\nFor some time Mrs. Bostwick had been staring straight ahead, with a dazed expression; but now, catching the senator's eye, she bowed gracefully and began reciting \"The Charge of the Light Brigade\" in forceful tones. Just then, her husband broke into another aria, and Bessie stole away into the parlor and began pounding out the overture from the “Flying Dutchman.”\nThe senator shuddered. Such disgraceful rioting he had never seen nor heard before in a decent private family. He felt that his reputation was at stake, and, that he was the only sane person in the room. He slipped away from the turmoil, and, catching up his had and coat in the hall, hurried from the house.\nThat night he sat up late writing a political speech he was to deliver the next afternoon at Faneuil hall, but his experiences at the Bostwicks' had so unnerved him that he could scarcely collect his thoughts.\nThe next day he met Mr. Bostwick in the street, but passed him by with a stony glare of oblivion. He felt he really could not afford to know this gentleman in the future.\nThe political meeting was the feature of the day, for the senator's eloquence was well known in Boston. So the big hall was crowded with people.\nWhile the mayor was introducing him, the great man sat fidgeting in his chair; and, happening to put his thumb and finger into his vest pocket, he found the lavender-colored bonbon he had placed there the evening before.\n\"This may clear my throat,\" thought the senator, and slipped the bonbon into his mouth.\nA few minutes afterwards he arose before the vast audience. \"My friends,\" began the senator, in a grave voice, \"this is a most impressive and important occasion.\"\nThen he paused, balanced himself upon his left foot, and kicked his right leg into the air in the way favored by ballet-dancers!\nThere was a hum of amazement and horror from the spectators, but the senator appeared not to notice it. He continued whirling around upon the tips of his toes, kicking right and left in a graceful and most startling manner.\nSuddenly Claribel Sudds, who happened to be present, uttered a scream and sprang to her feet. Pointing an accusing finger, she cried in a loud voice:\n\"That's the man who stole my bonbons! Seize him! Arrest him! Don't let him escape!\"\nBut the ushers rushed her out of the hall, thinking she had gone suddenly insane; and the senator's friends seized him firmly and carried him out the stage entrance to the street, where they put him into an open carriage and instructed the driver to take him home.\nThe poor senator stood upon the rear seat of the carriage and danced energetically all the way home. Some of the more sober-minded citizens shook their heads sadly and whispered that \"another good man had gone wrong.\"\nIt took the senator several months to recover from the shame and humiliation of this escapade. Perhaps it was fortunate the last bonbon had now been eaten, for they might easily have caused considerably more trouble than they did.\nOf course Claribel went again to the wise chemist and signed a check for another box of magic bonbons; but she must have taken better care of these, for she is now a famous vaudeville actress."]}, {"unit": "Comprehension Skills", "topic": "Themes", "lesson": "Identify common literary symbols", "texts": []}, {"unit": "Comprehension Skills", "topic": "Themes", "lesson": "Identify theme by analyzing literary symbols", "texts": []}, {"unit": "Comprehension Skills", "topic": "Themes", "lesson": "Identify the theme of a literary text", "texts": ["Read the story below. Then, answer the questions that follow.\n\nThe Emperor's New Suit\nBy Hans Christian Anderson\n\nMany, many years ago lived an emperor, who thought so much of new clothes that he spent all his money in order to obtain them; his only ambition was to be always well dressed. He did not care for his soldiers, and theatre did not amuse him; the only thing, in fact, he thought anything of was to drive out and show a new suit of clothes.\nOne day two swindlers came to this city. They made people believe that they were weavers, and declared they could manufacture the finest cloth to be imagined. Their colours and patterns, they said, were not only exceptionally beautiful, but made of material that was invisible to any man who was unfit for his office or unpardonably stupid.\n\"That must be wonderful cloth,\" thought the emperor. \"If I were to be dressed in a suit made of this cloth I should be able to find out which men in my empire were unfit for their places, and I could distinguish the clever from the stupid. I must have this cloth woven for me without delay.\"\nAnd he gave a large sum of money to the swindlers, in advance, that they should set to work without any loss of time. They set up two looms, and pretended to be very hard at work, but they did nothing on the looms. They asked for the finest silk and most precious gold-cloth; all they got they did away with, and worked at the empty looms till late at night.\n\"I should very much like to know how they are getting on with the cloth,\" thought the emperor. But he felt rather uneasy when he remembered that he who was not fit for his office could not see it. Personally, he was of opinion that he had nothing to fear, yet he thought it advisable to send somebody else first to see how matters stood. All the the town knew what a remarkable quality the stuff possessed, and all were anxious to see how bad or stupid their neighbours were.\n\"I shall send my honest old minister to the weavers,\" thought the emperor. \"He can judge best how the stuff looks, for he is intelligent, and nobody understands his office better than he.\"\nThe good old minister went into the room where the swindlers sat before the empty looms. \"Heaven preserve us!\" he thought, and opened his eyes wide, \"I cannot see anything at all,\" but he did not say so. Both swindlers requested him to come near, and asked him if he did not admire the exquisite pattern and the beautiful colours, pointing to the empty looms. The poor old minister tried his very best, but he could see nothing, for there was nothing to be seen.\n\"Now, have you got nothing to say?\" said one of the swindlers, while he pretended to be busily weaving.\n\"Oh, it is very pretty, exceedingly beautiful,\" replied the old minister looking through his glasses. \"What a beautiful pattern, what brilliant colours! I shall tell the emperor that I like the cloth very much.\"\n\"We are pleased to hear that,\" said the two weavers, and described to him the colours and explained the curious pattern. The minister listened attentively, that he might relate to the emperor what they said; and so he did. Now the swindlers asked for more money, silk and gold-cloth, which they required for weaving. They kept everything for themselves, and not a thread came near the loom, but they continued to work at empty looms.\nEverybody in the whole town talked about the precious cloth. At last the emperor wished to see it himself, while it was still on the loom. With a number of courtiers, including the two who had already been there, he went to the two clever swindlers, who now worked as hard as they could, but without using any thread.\n\"Is it not magnificent?\" said the two old statesmen who had been there before. \"Your Majesty must admire the colours and the pattern.\" They pointed to the empty looms that imagined the others could see.\n\"What is this?\" thought the emperor, \"I do not see anything at all. That is terrible! Am I stupid? Am I unfit to be emperor? That would indeed be the most dreadful thing that could happen to me.\"\n\"Really,\" he said, turning to the weavers, \"your cloth has our most gracious approval;\" and nodding contentedly he looked at the empty loom, for he did not like to say that he saw nothing.\nAll his attendants, who were with him, looked and looked, and although they could not see anything more than the others, they said, like the emperor, \"It is very beautiful.\" And all advised him to wear the new magnificent clothes at a great procession which was soon to take place. \"It is magnificent, beautiful, excellent,\" one heard them say; everybody seemed to be delighted, and the emperor appointed the two swindlers \"Imperial Court weavers.\"\nThe whole night previous to the day on which the procession was to take place, the swindlers pretended to work, and burned more than 16 candles.People should see that they were busy to finish the emperor's new suit. They pretended to take the cloth from the loom, and worked about in the air with big scissors, and sewed with needles without thread, and said at last: \"The emperor's new suit is ready now.\"\nThe emperor and all his barons then came to the hall; the swindlers held their arms up as if they held something in their hands and said: \"These are the trousers!\" \"This is the coat!\" and \"Here is the cloak!\" and so on. \"They are all as light as a cobweb, and one must feel as if one had nothing at all upon the body; but that is just the beauty of them.\"\n\"Indeed!\" said all the courtiers; but they could not see anything, for there was nothing to be seen.\n\"Does it please your Majesty now to graciously undress,\" said the swindlers, \"that we may assist your Majesty in putting on the new suit before the large looking-glass?\" The emperor undressed, and the swindlers pretended to put the new suit upon him, one piece after another; and the emperor looked at himself in the glass from every side. \"How well they look! How well they fit!\" said all. \"What beautiful patterns! What fine colors! A magnificent set of clothes!\"\nThe master of the ceremonies announced that the bearers of the canopy, which was to be carried in the procession, were ready.\n\"I am ready,\" said the emperor. \"Does not my suit fit me marvellously?\" Then he turned once more to the looking-glass, that people should think he admired his garments.\nThe chamberlains, who were to carry the train, stretched their hands to the ground as if they lifted up a train, and pretended to hold something in their hands; they didn't want people to know they could not see anything.\nThe emperor marched in the procession under the beautiful canopy, and all who saw him in the street and out of the windows exclaimed: \"Indeed, the emperor's new suit is incomparable! A long train he has, how well it fits him!\" No one wished to let others know he saw nothing, for then he would have been unfit for his office or too stupid. Never emperor's clothes were more admired.\n\"But he has nothing on at all,\" said a little child at last.\n\"Good heavens! listen to the voice of an innocent child,\" said the father, and one whispered to the other what the child had said.\n\"But he has nothing on at all,\" cried at last the whole people. That made a deep impression upon the emperor, for it seemed to him that they were right; but he thought to himself, \"Now I must bear up to the end.\"\nAnd the chamberlains walked with still greater dignity, as if they carried the train which did not exist.", "Read the story below. Then, answer the questions that follow.\n\nThe Conceited Apple Branch\nby Hans Christian Anderson\n\nIt was the month of May. The wind still blew cold; but from bush and tree, field and flower, came the welcome sound, \"Spring is come.\" Under the little apple-tree, Spring seemed busy, and told his tale from one of the branches which hung fresh and blooming, and covered with delicate pink blossoms that were just ready to open. The branch well knew how beautiful it was; this knowledge exists as much in the leaf as in the blood; I was therefore not surprised when a nobleman's carriage, in which sat the young countess, stopped in the road just by. She said that an apple-branch was a most lovely object, and an emblem of spring. Then the branch was broken off for her, and she held it in her delicate hand, and sheltered it with her silk parasol. Then they drove to the castle, in which were lofty halls and splendid drawing-rooms. Pure white curtains fluttered before the open windows, and beautiful flowers stood in shining, transparent vases; and in one of them, which looked as if it had been cut out of newly fallen snow, the apple-branch was placed, among some fresh, light twigs of beech. It was a charming sight. Then the branch became proud, which was very much like human nature.\nSo thought the apple-branch, as he stood before the open window, from which he could see out over gardens and fields, where there were flowers and plants enough for him to think and reflect upon; some rich and beautiful, some poor and humble indeed.\n\"Poor, despised herbs,\" said the apple-branch; \"there is really a difference between them and such as I am. How unhappy they must be, if they can feel as those in my position do! There is a difference indeed, and so there ought to be, or we should all be equals.\"\nAnd the apple-branch looked with a sort of pity upon them, especially on a certain little flower that is found in fields and in ditches. No one bound these flowers together; they were too common. They were even known to grow between the paving-stones, shooting up everywhere, like bad weeds; and they bore the very ugly name of \"dog-flowers\" or \"dandelions.\"\n\"Poor, despised plants,\" said the apple-bough, \"it is not your fault that you are so ugly, and that you have such an ugly name; but it is with plants as with men,—there must be a difference.\"\n\"A difference!\" cried the sunbeam, as he kissed the blooming apple- branch, and then kissed the yellow dandelion out in the fields. All were brothers, and the sunbeam kissed them—the poor flowers and the rich.\nThe apple-bough had never thought of the good and beautiful which are often hidden, but can never remain forgotten. The sunbeam knew better.\n\"You do not see very far, nor very clearly,\" he said to the apple-branch. \"Which is the despised plant you so specially pity?\"\n\"The dandelion,\" he replied. \"It is often trodden under foot, there are so many of them; and when they run to seed, they have flowers like wool, which fly away in little pieces over the roads, and cling to the dresses of the people. They are only weeds; but of course there must be weeds. O, I am really very thankful that I was not made like one of these flowers.\"\nThere came presently across the fields a whole group of children, the youngest of whom was so small that it had to be carried by the others; and when he was seated on the grass, among the yellow flowers, he laughed aloud with joy, kicked out his little legs, rolled about, plucked the yellow flowers, and kissed them in childlike innocence. The elder children broke off the flowers with long stems, bent the stalks one round the other, to form links, and made first a chain for the neck, then one to go across the shoulders, and hang down to the waist, and at last a wreath to wear round the head, so that they looked quite splendid in their garlands of green stems and golden flowers.\nThen some people came into the room, and, among them, the young countess,—the lady who had placed the apple-bough in the transparent vase, so pleasantly beneath the rays of the sunlight. She carried in her hand something that seemed like a flower. The object was hidden by two or three great leaves, which covered it like a shield, so that no draught or gust of wind could injure it, and it was carried more carefully than the apple-branch had ever been. Very cautiously the large leaves were removed, and there appeared the feathery seed-crown of the despised dandelion. This was what the lady had so carefully plucked, and carried home so safely covered, so that not one of the delicate feathery arrows of which its mist-like shape was so lightly formed, should flutter away. She now drew it forth, and wondered at its beautiful form, and airy lightness, and singular construction, so soon to be blown away by the wind.\n\"I see,\" said the apple bough, \"how wonderfully has this little flower been made. Every one admires the beauty of the apple-bough; but this humble flower has been endowed with another kind of loveliness; and although we differ in appearance, both are the children of the realms of beauty.\""]}, {"unit": "Comprehension Skills", "topic": "Summaries", "lesson": "Differentiate between key ideas and supporting details", "texts": ["Text 1:\nRead the excerpt below, taking note of the key ideas and supporting details of the story. Then, answer the questions that follow.\n\nFrom\nThe Wizard of Oz\nBy L. Frank Baum\n\nDorothy lived in the midst of the great Kansas prairies, with Uncle Henry, who was a farmer, and Aunt Em, who was the farmer's wife. Uncle Henry never laughed. He worked hard from morning till night and did not know what joy was. He was gray from his long beard to his rough boots, and he looked stern and solemn, and rarely spoke.\nIt was Toto that made Dorothy laugh, and saved her from growing as gray as her other surroundings. Toto was not gray; he was a little black dog, with long silky hair and small black eyes that twinkled merrily on either side of his funny, wee nose. Toto played all day long, and Dorothy played with him, and loved him dearly.\nToday, however, they were not playing. Uncle Henry sat upon the doorstep and looked anxiously at the sky, which was even grayer than usual. Dorothy stood in the door with Toto in her arms, and looked at the sky too. Aunt Em was washing the dishes. From the far north they heard a low wail of the wind, and Uncle Henry and Dorothy could see where the long grass bowed in waves before the coming storm. There now came a sharp whistling in the air from the south, and as they turned their eyes that way they saw ripples in the grass coming from that direction also.\nSuddenly Uncle Henry stood up.\n\"There's a cyclone coming, Em,\" he called to his wife. \"I'll go look after the stock.\" Then he ran toward the sheds where the cows and horses were kept.\nAunt Em dropped her work and came to the door. One glance told her of the danger close at hand.\n\"Quick, Dorothy!\" she screamed. \"Run for the cellar!\"\nToto jumped out of Dorothy's arms and hid under the bed, and the girl started to get him. Aunt Em, badly frightened, threw open the trap door in the floor and climbed down the ladder into the small, dark hole. Dorothy caught Toto at last and started to follow her aunt. When she was halfway across the room there came a great shriek from the wind, and the house shook so hard that she lost her footing and sat down suddenly upon the floor.\nThen a strange thing happened.\nThe house whirled around two or three times and rose slowly through the air. Dorothy felt as if she were going up in a balloon.\nThe north and south winds met where the house stood, and made it the exact center of the cyclone. In the middle of a cyclone the air is generally still, but the great pressure of the wind on every side of the house raised it up higher and higher, until it was at the very top of the cyclone; and there it remained and was carried miles and miles away as easily as you could carry a feather.\nToto did not like it. He ran about the room, now here, now there, barking loudly; but Dorothy sat quite still on the floor and waited to see what would happen.\nAt last she crawled over the swaying floor to her bed, and lay down upon it; and Toto followed and lay down beside her. In spite of the swaying of the house and the wailing of the wind, Dorothy soon closed her eyes and fell fast asleep.\n\nText 2:\nRead the excerpt below, taking note of the key ideas and supporting details of the story. Then, answer the questions that follow.\n\nFrom\nThe Wizard of Oz\nBy L. Frank Baum\n\nShe was awakened by a shock. Dorothy sat up and noticed that the house was not moving; nor was it dark, for the bright sunshine came in at the window, flooding the little room. She sprang from her bed and with Toto at her heels ran and opened the door.\nThe little girl gave a cry of amazement and looked about her, her eyes growing bigger and bigger at the wonderful sights she saw. The cyclone had set the house down very gently—for a cyclone—in the midst of a country of marvelous beauty. There were lovely patches of greensward all about, with stately trees bearing rich and luscious fruits. Banks of gorgeous flowers were on every hand, and birds with rare and brilliant plumage sang and fluttered in the trees and bushes. A little way off was a small brook, rushing and sparkling along between green banks, and murmuring in a voice very grateful to a little girl who had lived so long on the dry, gray prairies.\nWhile she stood looking eagerly at the strange and beautiful sights, she noticed coming toward her a group of the queerest people she had ever seen. They were not as big as the grown folk she had always been used to; but neither were they very small. In fact, they seemed about as tall as Dorothy, who was a well-grown child for her age, although they were, so far as looks go, many years older.\nThree were men and one a woman, and all were oddly dressed. They wore round hats that rose to a small point a foot above their heads, with little bells around the brims that tinkled sweetly as they moved. The hats of the men were blue; the little woman's hat was white, and she wore a white gown that hung in pleats from her shoulders. Over it were sprinkled little stars that glistened in the sun like diamonds. The men were dressed in blue, of the same shade as their hats, and wore well-polished boots with a deep roll of blue at the tops. The men, Dorothy thought, were about as old as Uncle Henry, for two of them had beards. But the little woman was doubtless much older. Her face was covered with wrinkles, her hair was nearly white, and she walked rather stiffly.\nWhen these people drew near the house where Dorothy was standing in the doorway, they paused and whispered among themselves, as if afraid to come farther. But the little old woman walked up to Dorothy, made a low bow and said, in a sweet voice: \"You are welcome, most noble Sorceress, to the land of the Munchkins. We are so grateful to you for having killed the Wicked Witch of the East, and for setting our people free from bondage.\"\nDorothy listened to this speech with wonder. What could the little woman possibly mean by calling her a sorceress, and saying she had killed the Wicked Witch of the East? Dorothy was an innocent, harmless little girl, who had been carried by a cyclone many miles from home; and she had never killed anything in all her life.\nBut the little woman evidently expected her to answer; so Dorothy said, with hesitation, \"You are very kind, but there must be some mistake. I have not killed anything.\"\n\"Your house did, anyway,\" replied the little old woman, with a laugh, \"and that is the same thing. See!\" she continued, pointing to the corner of the house. \"There are her two feet, still sticking out from under a block of wood.\"\nDorothy looked, and gave a little cry of fright. There, indeed, just under the corner of the great beam the house rested on, two feet were sticking out, shod in silver shoes with pointed toes.\n\"Oh, dear! Oh, dear!\" cried Dorothy, clasping her hands together in dismay. \"The house must have fallen on her. Whatever shall we do?\"\n\"There is nothing to be done,\" said the little woman calmly.\n\"But who was she?\" asked Dorothy.\n\"She was the Wicked Witch of the East, as I said,\" answered the little woman. \"She has held all the Munchkins in bondage for many years, making them slave for her night and day. Now they are all set free, and are grateful to you for the favor.\"", "Text 1:\nRead the passage below. Then, answer the question that follows.\nThe Wonderful Wizard of Oz\nBy L. Frank Baum\n\n\"Who are the Munchkins?\" inquired Dorothy.\n\"They are the people who live in this land of the East where the Wicked Witch ruled.\"\n\"Are you a Munchkin?\" asked Dorothy.\n\"No, but I am their friend, although I live in the land of the North. When they saw the Witch of the East was dead the Munchkins sent a swift messenger to me, and I came at once. I am the Witch of the North.\"\n\"Oh, gracious!\" cried Dorothy. \"Are you a real witch?\"\n\"Yes, indeed,\" answered the little woman. \"But I am a good witch, and the people love me. I am not as powerful as the Wicked Witch was who ruled here, or I should have set the people free myself.\"\n\"But I thought all witches were wicked,\" said the girl, who was half frightened at facing a real witch.\n\"Oh, no, that is a great mistake. There were only four witches in all the Land of Oz, and two of them, those who live in the North and the South, are good witches. I know this is true, for I am one of them myself, and cannot be mistaken. Those who dwelt in the East and the West were, indeed, wicked witches; but now that you have killed one of them, there is but one Wicked Witch in all the Land of Oz—the one who lives in the West.\"\n\"But,\" said Dorothy, after a moment's thought, \"Aunt Em has told me that the witches were all dead—years and years ago.\"\n\"Who is Aunt Em?\" inquired the little old woman.\n\"She is my aunt who lives in Kansas, where I came from.\"\nThe Witch of the North seemed to think for a time, with her head bowed and her eyes upon the ground. Then she looked up and said, \"I do not know where Kansas is, for I have never heard that country mentioned before. But tell me, is it a civilized country?\"\n\"Oh, yes,\" replied Dorothy.\n\"Then that accounts for it. In the civilized countries I believe there are no witches left, nor wizards, nor sorceresses, nor magicians. But, you see, the Land of Oz has never been civilized, for we are cut off from all the rest of the world. Therefore we still have witches and wizards amongst us.\"\n\"Who are the wizards?\" asked Dorothy.\n\"Oz himself is the Great Wizard,\" answered the Witch, sinking her voice to a whisper. \"He is more powerful than all the rest of us together. He lives in the City of Emeralds.\"\nDorothy was going to ask another question, but just then the Munchkins, who had been standing silently by, gave a loud shout and pointed to the corner of the house where the Wicked Witch had been lying.\n\"What is it?\" asked the little old woman, and looked, and began to laugh. The feet of the dead Witch had disappeared entirely, and nothing was left but the silver shoes.\n\"She was so old,\" explained the Witch of the North, \"that she dried up quickly in the sun. That is the end of her. But the silver shoes are yours, and you shall have them to wear.\" She reached down and picked up the shoes, and after shaking the dust out of them handed them to Dorothy.\n\"The Witch of the East was proud of those silver shoes,\" said one of the Munchkins, \"and there is some charm connected with them; but what it is we never knew.\"\n\nText 2:\nRead the excerpt below, taking note of the key ideas and supporting details of the story. Then, answer the questions that follow.\nFrom\nThe Wizard of Oz\nBy L. Frank Baum\n\nDorothy carried the shoes into the house and placed them on the table. Then she came out again to the Munchkins and said: \"I am anxious to get back to my aunt and uncle, for I am sure they will worry about me. Can you help me find my way?\"\nThe Munchkins and the Witch first looked at one another, and then at Dorothy, and then shook their heads.\n\"At the East, not far from here,\" said one, \"there is a great desert, and none could live to cross it.\"\n\"It is the same at the South,\" said another, \"for I have been there and seen it. The South is the country of the Quadlings.\"\n\"I am told,\" said the third man, \"that it is the same at the West. And that country, where the Winkies live, is ruled by the Wicked Witch of the West, who would make you her slave if you passed her way.\"\n\"The North is my home,\" said the old lady, \"and at its edge is the same great desert that surrounds this Land of Oz. I'm afraid, my dear, you will have to live with us.\"\nDorothy began to sob at this, for she felt lonely among all these strange people. Her tears seemed to grieve the kind-hearted Munchkins, for they immediately took out their handkerchiefs and began to weep also.\nAs for the little old woman, she took off her cap and balanced the point on the end of her nose, while she counted \"One, two, three\" in a solemn voice. At once the cap changed to a slate, on which was written in big, white chalk marks:\n\n\"LET DOROTHY GO TO THE CITY OF EMERALDS\"\n\nThe little old woman took the slate from her nose, and having read the words on it, asked, \"Is your name Dorothy, my dear?\"\n\"Yes,\" answered the child, looking up and drying her tears.\n\"Then you must go to the City of Emeralds. Perhaps Oz will help you.\"\n\"Where is this city?\" asked Dorothy.\n\"It is exactly in the center of the country, and is ruled by Oz, the Great Wizard I told you of.\"\n\"Is he a good man?\" inquired the girl anxiously.\n\"He is a good Wizard. Whether he is a man or not I cannot tell, for I have never seen him.\"\n\"How can I get there?\" asked Dorothy.\n\"You must walk. It is a long journey, through a country that is sometimes pleasant and sometimes dark and terrible. However, I will use all the magic arts I know of to keep you from harm.\"\n\"Won't you go with me?\" pleaded the girl, who had begun to look upon the little old woman as her only friend.\n\"No, I cannot do that,\" she replied, \"but I will give you my kiss, and no one will dare injure a person who has been kissed by the Witch of the North.\"\nShe came close to Dorothy and kissed her gently on the forehead. Where her lips touched the girl they left a round, shining mark, as Dorothy found out soon after.\n\"The road to the City of Emeralds is paved with yellow brick,\" said the Witch, \"so you cannot miss it. When you get to Oz do not be afraid of him, but tell your story and ask him to help you. Good-bye, my dear.\"\nThe three Munchkins bowed low to her and wished her a pleasant journey, after which they walked away through the trees. The Witch gave Dorothy a friendly little nod, whirled around on her left heel three times, and straightway disappeared, much to the surprise of little Toto, who barked after her loudly enough when she had gone, because he had been afraid even to growl while she stood by.\nBut Dorothy, knowing her to be a witch, had expected her to disappear in just that way, and was not surprised in the least."]}, {"unit": "Comprehension Skills", "topic": "Summaries", "lesson": "Write an effective summary", "texts": ["Read this excerpt from The Adventures of Tom Sawyer by Mark Twain, paying close attention to the key ideas of the story.\n\nChapter 1\n\n\"TOM!\"\nNo answer.\n\"TOM!\"\nNo answer.\n\"What's gone with that boy, I wonder? You TOM!\"\nNo answer.\nThe old lady pulled her spectacles down and looked over them about the room; then she put them up and looked out under them. She seldom or never looked THROUGH them for so small a thing as a boy; they were her state pair, the pride of her heart, and were built for \"style,\" not service—she could have seen through a pair of stove-
