g as myself.\" He said this to frighten the little insect, who seemed to him to have lost his senses.\nBut the firefly replied, \"I shall not need any companions. I shall come alone.\"\nThe ape then called together his whole company of apes and told them of the fight. The next evening, just before six o'clock, they all assembled on the plaza and found the firefly already waiting for them.\nHe gave the signal that he was ready. The ape drew his company up in line, with himself at the head. Suddenly the firefly landed on the ape's nose.\nThe ape, next in line, struck at the firefly. He missed the insect, but dealt his captain such a blow on the nose that the leader fell senseless to the ground.\nThe firefly, when he saw the blow coming, jumped on the nose of the next ape. The third ape struck at the firefly on the second ape's nose, but missed the insect and dealt his companion such a blow on the nose that he, too, fell senseless on the ground. The firefly, meanwhile, had flown to the nose of the third ape. But the third ape met the same fate as the others. And so on down the line, until not one ape was left standing.\nThe firefly flew triumphantly over them. \"Spare our lives!\" they pleaded, as they threw down their clubs.\n\"Who now can say that the firefly is a coward?\" the firefly asked.\nThe apes all hung their heads in shame. The firefly graciously spared their lives. But from that day forward, the firefly became the mortal enemy of the ape.\n\nText 2:\nJackrabbit's Wisdom Spot\nAn African Myth\n\nJackrabbit was a very wise fellow, but he wanted to be wiser. So he went to the animal wizard, Muzimu, and begged for more wisdom. \"Great wizard of the woods, please make me wiser,\" said he.\n“You are wise already, little fellow,\" replied Muzimu.\n\"But not wise enough, great one,\" said the rabbit.\n\"Then bring me a live snake and I will see what I can do for you.\"\nThe rabbit picked up a long stick and went to the house of the snake. There he found that crawling creature coiled upon a log. \"Good day, friend snake,\" said the rabbit.\n\"Good day, little one, what have you there?\"\n\"A stick which is longer than you are.\"\n\"Nonsense, boy.\"\n\"Let us measure and see,\" said the cunning rabbit. The snake stretched himself along the log. The rabbit put his stick near the snake, as if to measure him. Then, quick as a wink, he slipped a string round the snake's neck and held him fast to the end of the stick.\nThe rabbit ran quickly with him to Muzimu. The wizard could not believe his eyes when he saw the wiggling snake on the end of the rabbit's stick. \"How did you catch him alive?\" he exclaimed. The rabbit smiled, but said not a word.\n\"Little fellow,\" said Muzimu, \"since you are clever enough to fool the snake, you have all the sense you need.\"\n\"No, no, mighty Muzimu, give me more sense.\"\n\"Go, then, and bring me a swarm of bees, and then I will give you all the sense you want.\"\nThe little rabbit ran off and found a big gourd. He cut a hole in the bottom and cleaned it out. Then he put some honey in it and tied the gourd to a long pole. He found a bee's nest and left the gourd nearby. The bees soon smelled the honey and flew around the opening. Then they crawled into the gourd to taste the sweet food. When the gourd was full, the rabbit slipped up, covered the hole, and carried the gourd to Muzimu.\nAgain was the animal wizard surprised. \"Brother Rabbit, you are indeed a wise little creature, and you shall become wiser every day, because you use your wits.\" As he said this, he touched the rabbit's head between the ears and the hair became white. \"You shall always wear this white spot,\" he continued, \"as a mark of your wisdom.\" And to this day, all jackrabbits wear this white wisdom spot between the ears."]}, {"unit": "Comprehension Skills", "topic": "Messages, Lessons, and Morals", "lesson": "Identify and differentiate between topics and themes", "texts": ["A Breath of Fresh Air\n\nMiguel closed his laptop and flopped down on the couch. The numbers just were not working, and if the numbers were not working, neither would the rockets. Sure, he was only one part of the team programming the whole system, but his part was the only part that was failing.\nHis roommate Dwayne rolled his eyes at him. \"What has you acting so dramatic?\"\n\"The numbers,\" Miguel answered, still on his back. \"I just can't make them do what they need to.\"\n\"Oh, you'll figure it out. You've always found numbers pretty easy,\" said Dwayne. \"After all, it's not rocket science.\"\n\"It is rocket science!\" Miguel snapped. \"I just have to quit. I cannot keep up with the challenges of this job.\"\n\"Do yourself a favor: Take a walk, and leave your phone behind. Then, get a nap. You have to get away from the numbers for a little.\"\nHow desperately Miguel wanted to stay at his computer and force those numbers into place! Nothing he did was working, though. Maybe Dwayne was right. Reluctantly, Miguel rose and walked out the door, abandoning all electronic devices. Immediately, the sun cheered his heart, and the fresh air filled him with a sense of peace. It felt as though he had been in a dark prison and had finally burst out into joyful freedom. The trees' leaves fluttered gentle hellos to him. He walked around the block twice.\nWhen he got back inside, he felt less rushed. He went ahead and took a nap. It felt luxurious. After the sun had set, he opened his computer again. As he looked over his work with a new sense of calm, little mistakes jumped out at him. How had he missed them before? Now, he rapidly eliminated the stray errors. Now, the numbers were on his side again.", "An Extra-Curricular Conclusion\n\n\"Wow, Orson, I don't think we will ever find that ball again.\"\n\"Way to go, Phillips! Who knew you could hit like that?\"\n\"Orson, you have got to join the baseball team!\"\nOrson Phillips stood awkwardly on home plate, letting the bat he had just swung drop to his side. He trudged along the bases as the P.E. teacher, Mrs. Glass, cheered him on. When he finally made it back around, he was swarmed by his classmates.\n\"Who taught you to hit like that?\" Barry Simpson asked.\n\"My grandpa. He played baseball in college,\" Orson said.\n\"So why aren't you on the team already?\" Mike DeShaw demanded.\nOrson shrugged. \"I just don't really like playing baseball,\" he said.\n\"But you're so good!\" Kenny Banks gushed.\nOrson took a drink of water to avoid the conversation. It was true that Orson was a good hitter. His grandpa had taught him how to swing a bat when he was four years old. Orson had even played Little League for a year or two when he was younger. Still, he had never found much joy in the game.\n\"They're right, you know,\" Mrs. Glass, who had just walked over, said. \"You'd be a great addition to our school team. Plus, who doesn't love doing the things they're best at?\"\nLuckily for Orson, the bell rang at that moment, saving him from being pestered any further. As he walked back into school, he thought about what Mrs. Glass had said. It was true that there were some things that Orson enjoyed doing that he was good at, like reading chapter books and drawing. But he also enjoyed being challenged, like in his computer programming class. He couldn't even count the number of times his code had been incomplete or he had gotten worse grades than his neighbor. In fact, one of his failed websites was an ongoing joke in class. However, that just made him want to try harder.\nA week later, Kenny Banks found Orson in the hallway and waved a flyer in his face. \"Baseball tryouts start next week!\" Kenny said, breathlessly. \"Mrs. Glass is the coach, you know, and she basically said you had a spot on the team!\"\nOrson pretended to be interested in the flyer and said he would let Kenny know later. But as Kenny ran off to class, Orson dropped the baseball flyer in the recycling bin. As he looked up at the bulletin board hanging over the bin, he saw another flyer, one for a new school coding club. He read that the club's first meeting was next Monday, the same day as baseball tryouts. Orson put the coding club flyer in his bag before going to class.\nAs he sat down at his desk, Orson pulled out his math notebook, and the coding club flyer came with it. Kenny Banks, who sat nearby, saw the flyer and laughed. \"Are you thinking about doing coding club instead of baseball?\" he smirked. \"Why waste your time? Why not do something you'll actually be good at?\"\n\"I just don't like baseball very much,\" Orson mumbled, but their teacher, Ms. Jones, began her lesson before Kenny could respond.\nThe next Monday, Orson was careful to avoid Kenny and the other baseball team hopefuls in the hallways. As the school day ended, he watched Kenny, Barry, and Mike make their way to the locker room before tryouts. When they had disappeared behind the locker room door, Orson walked in the opposite direction, toward the computer lab, clutching the coding club flyer in his hand."]}, {"unit": "Comprehension Skills", "topic": "Prereading Strategies", "lesson": "Make, confirm, and revise predictions", "texts": []}, {"unit": "Comprehension Skills", "topic": "Determining the Meaning of Unknown Words", "lesson": "Use context clues to determine the meaning of unknown words", "texts": []}, {"unit": "Comprehension Skills", "topic": "Determining the Meaning of Unknown Words", "lesson": "Identify prefixes, suffixes, and root words", "texts": []}, {"unit": "Comprehension Skills", "topic": "Determining the Meaning of Unknown Words", "lesson": "Use prefixes to determine word meaning", "texts": []}, {"unit": "Comprehension Skills", "topic": "Determining the Meaning of Unknown Words", "lesson": "Use suffixes to determine word meaning", "texts": []}], "4": [{"unit": "Comprehension Skills", "topic": "Setting a Purpose and Asking Questions", "lesson": "Establish a purpose for reading a text", "texts": []}, {"unit": "Comprehension Skills", "topic": let currentGrade = null;
let currentIdx   = null;

function parseText(raw) {
  const lines = raw.split('\n');
  let i = 0;
  let textLabel = '', title = '', subtitle = '', author = '';

  // Optional "Text N:" label (for compare-contrast lessons)
  if (lines[i] && /^Text \d+:?\s*$/i.test(lines[i].trim())) {
    textLabel = lines[i++].trim().replace(/:$/, '');
  }

  // Title
  while (i < lines.length && !lines[i].trim()) i++;
  if (i < lines.length) title = lines[i++];

  // Subtitle/series — a non-author line immediately before the author line or a blank line
  if (i < lines.length && lines[i].trim() && !/^(written by|by )\s/i.test(lines[i].trim())) {
    const next = lines[i + 1] || '';
    if (/^(written by|by )\s/i.test(next.trim()) || !next.trim()) {
      subtitle = lines[i++];
    }
  }

  // Author: handles "Written by", "Written By", "By "
  if (i < lines.length && /^(written by|by )\s/i.test(lines[i].trim())) {
    author = lines[i++];
  }

  // Combine subtitle into author display
  if (subtitle) author = subtitle + (author ? ' — ' + author : '');

  // Skip blank lines before body
  while (i < lines.length && !lines[i].trim()) i++;

  const body = lines.slice(i).join('\n').trim();
  return { textLabel, title, author, body };
}

function renderGrades() {
  const bar = document.getElementById('gradeBar');
  bar.innerHTML = '';
  const grades = Object.keys(DATA);
  grades.forEach(g => {
    const hasText = DATA[g].some(l => l.texts.length > 0);
    const btn = document.createElement('button');
    btn.className = 'grade-btn' + (g === currentGrade ? ' active' : '');
    btn.textContent = 'Grade ' + g;
    btn.disabled = !hasText;
    btn.onclick = () => selectGrade(g);
    bar.appendChild(btn);
  });
}

function selectGrade(g) {
  currentGrade = g;
  currentIdx   = null;
  renderGrades();
  renderList();
  document.getElementById('reader').innerHTML = `
    <div class="reader-empty">
      <svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="#f97316" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity=".4">
        <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
      </svg>
      <p>Pick a story from the list!</p>
    </div>`;
}

// Split a raw text string on embedded "Text 2:" into separate readings
function splitRawTexts(raw) {
  const idx = raw.search(/\n\nText 2:/i);
  if (idx >= 0) {
    return [raw.slice(0, idx).trim(), raw.slice(idx + 2).trim()];
  }
  return [raw];
}

// Extract the main story title from a raw text entry
function getStoryTitle(raw) {
  if (!raw) return '';
  const lines = raw.split('\n');
  // Skip "Text N:" label line if present
  let i = /^Text \d+:?\s*$/i.test(lines[0] ? lines[0].trim() : '') ? 1 : 0;
  const titleLine = lines[i] || '';
  // Strip inline "Text N: " prefix
  return titleLine.replace(/^Text \d+:\s*/i, '').trim();
}

// Build flat item list for the sidebar — dual-text lessons become two entries
function buildItems(grade) {
  const items = [];
  let lessonNum = 0;
  DATA[grade].forEach((l, li) => {
    lessonNum++;
    if (l.texts.length === 2) {
      items.push({ lesson: l, li, ti: 0, ab: 'Lesson A', num: lessonNum + 'A',
        storyTitle: getStoryTitle(l.texts[0]) });
      items.push({ lesson: l, li, ti: 1, ab: 'Lesson B', num: lessonNum + 'B',
        storyTitle: getStoryTitle(l.texts[1]) });
    } else {
      const title = l.texts.length > 0 ? getStoryTitle(l.texts[0]) : '';
      items.push({ lesson: l, li, ti: 0, ab: null, num: lessonNum, storyTitle: title });
    }
  });
  return items;
}

let currentItems = [];

function renderList() {
  const list = document.getElementById('lessonList');
  list.innerHTML = '';
  if (!currentGrade) return;
  currentItems = buildItems(currentGrade);
  let lastTopic = null;
  currentItems.forEach((item, flatIdx) => {
    const l = item.lesson;
    if (l.topic !== lastTopic) {
      const tl = document.createElement('div');
      tl.className = 'topic-label';
      tl.textContent = l.topic;
      list.appendChild(tl);
      lastTopic = l.topic;
    }
    const el = document.createElement('div');
    const hasText = l.texts.length > 0;
    el.className = 'lesson-item' + (hasText ? '' : ' no-text') + (flatIdx === currentIdx ? ' active' : '') + (item.ab ? ' sub-item' : '');
    el.innerHTML = `
      <span class="lesson-num">${item.num}</span>
      <div style="min-width:0">
        <div class="lesson-title">${l.lesson}</div>
        ${item.ab ? `<span class="ab-tag">${item.ab}</span>` : (!hasText ? '<div class="lesson-skill">coming soon</div>' : '')}
      </div>`;
    if (hasText) el.onclick = () => selectLesson(flatIdx);
    list.appendChild(el);
  });
}

function renderTextBlock(raw, blockLabel) {
  const { title, author, body } = parseText(raw);
  return `
    <div class="text-section">
      <div class="text-label">${blockLabel}</div>
      ${title ? `<div class="text-title">${title}</div>` : ''}
      ${author ? `<div class="text-author">${author}</div>` : ''}
      <div class="text-body">${body.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>`<p>${l.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</p>`).join('')}</div>
    </div>`;
}

function selectLesson(flatIdx) {
  currentIdx = flatIdx;
  renderList();
  const { lesson: l, ti, ab } = currentItems[flatIdx];
  const reader = document.getElementById('reader');

  let html = `
    <div class="lesson-header">
      <div class="topic-tag">${l.topic}</div>
      <h2>${l.lesson}</h2>
      ${ab ? `<div class="ab-header-tag">${ab}</div>` : ''}
    </div>`;

  if (l.texts.length === 0) {
    html += `<p class="no-text-msg">No reading text available for this lesson yet.</p>`;
  } else {
    const raw = l.texts[ti];
    const parts = splitRawTexts(raw);
    if (parts.length === 2) {
      // Cell had Text 1 + Text 2 embedded — show as two blocks
      html += renderTextBlock(parts[0], 'Text 1');
      html += renderTextBlock(parts[1], 'Text 2');
    } else {
      // Single reading
      const label = ab ? ab : 'Reading';
      html += renderTextBlock(raw, label);
    }
  }

  reader.innerHTML = html;
  reader.scrollTop = 0;
}

function toggleSidebar() {
  const sidebar = document.getElementById('sidebar');
  const toggleBtn = document.getElementById('toggleBtn');
  const collapsed = sidebar.classList.toggle('collapsed');
  toggleBtn.innerHTML = collapsed ? '&#x2192;' : '&#x2190;';
  toggleBtn.title = collapsed ? 'Show lessons' : 'Hide lessons';
}

// Init — default to grade 3
renderGrades();
selectGrade('3');
</script>
