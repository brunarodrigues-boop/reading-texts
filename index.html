nScared, the servants quickly corrected their mistake. It was a difficult task to drive the heavy pole into the ground. It was made from a large trunk of a tree that had all the branches removed.\nTired and sweaty, the servants stood back. Under Albrecht's orders, one of the servants climbed the pole and placed the ruler’s hat on the top.\nOnce the hat was in place, Albrecht made his servants gather the entire town around the pole. \"As your lord and master, you must always bow and pay respect to my hat whenever you pass by this pole.\"\nThe people did not like the new law, but they could not fight it. Every day as people passed the hat, they would bow. Even if it was raining, they got drenched by the rain as they bowed to the hat. If they did not bow, they risked being punished.\n\nChapter 3\nWilliam Tell was not like everyone else. He would not pay his respects to such a cruel leader. William refused to bow to the hat.\nAt first he simply avoided going near the hat. It was easy to devise a new path to almost anywhere in the town.\nOne day William and his son had to go to the palace, which meant he had to go past the hat. William had to make a choice.\nAs William's son began to bow at the hat, William held him up.\n\"But we must bow,\" his son exclaimed.\n\"No, it is wrong to follow the orders of such a cruel leader. I will not willingly do what is wrong,\" William pronounced loudly.\nThey continued walking to the castle. The news of William's defiance reached the castle before William and his son. William and Walter were met with hostility at the castle. Both were thrown into prison. Albrecht was furious. William had not only defied his law, but he had also done so very publicly.\n\nChapter 4\nThe next morning, William was brought before Albrecht. \"Why do you defy the law?\" Albrecht asked.\nWilliam answered very simply, \"I have chosen to defy the law because it is wrong.\"\nAlbrecht began shaking because he was so angry. He wanted to get even with William and devised a plan to embarrass him publicly. \"If you will not bow to the hat, then you must complete a public challenge, or else both you and your son will face execution.\"\n\"You must prove your skill as a marksman. You must shoot an apple that sits on the top of your son's head. You have one shot.\"\nAlbrecht and his court went to the field in front of the castle. William and Walter had a few moments together. William explained to Walter what was about to happen. \"I believe in you, Father,\" Walter said bravely. \"I will be safe.\"\nWalter was then taken to a tree. An apple was placed on his head. William took a deep breath. He removed an arrow from the quiver and focused on the apple. Clearing his mind, William shot the arrow. The arrow sliced the apple, but did not harm Walter. William ran toward Walter and gave him a hug.\nWilliam was happy that he had stood up to the evil ruler.", "Text 1:\nThe Ape and the Firefly\nA Filipino Folktale\n\nOne evening the firefly was on his way to visit a friend. As he passed the ape's house, the ape called out, \"Mr. Firefly, why do you carry a light?\"\n\"Because I am afraid of the mosquitoes,\" the firefly replied.\n\"What a coward you are!\" said the ape. The ape was so amused that he laughed loudly. The next day he told all his neighbors that the firefly carried a light at night because he was a coward.\nThe firefly heard what the ape had said and was very angry. Though it was night, he hurried to the ape's house. He found his enemy asleep, but he flashed his light in the ape's face and wakened him suddenly.\n\"Who's there?\" called out the ape.\n\"It is I,\" said the firefly. \"Why did you tell every one that I was a coward? I will fight you on the plaza tomorrow evening, and I will show you who is braver.\"\nThe ape laughed at the idea of such a little creature presuming to fight him alone. \"You had better bring someone to help you,\" replied the ape, \"for I shall bring my whole company, about a thousand apes, each as big as myself.\" He said this to frighten the little insect, who seemed to him to have lost his senses.\nBut the firefly replied, \"I shall not need any companions. I shall come alone.\"\nThe ape then called together his whole company of apes and told them of the fight. The next evening, just before six o'clock, they all assembled on the plaza and found the firefly already waiting for them.\nHe gave the signal that he was ready. The ape drew his company up in line, with himself at the head. Suddenly the firefly landed on the ape's nose.\nThe ape, next in line, struck at the firefly. He missed the insect, but dealt his captain such a blow on the nose that the leader fell senseless to the ground.\nThe firefly, when he saw the blow coming, jumped on the nose of the next ape. The third ape struck at the firefly on the second ape's nose, but missed the insect and dealt his companion such a blow on the nose that he, too, fell senseless on the ground. The firefly, meanwhile, had flown to the nose of the third ape. But the third ape met the same fate as the others. And so on down the line, until not one ape was left standing.\nThe firefly flew triumphantly over them. \"Spare our lives!\" they pleaded, as they threw down their clubs.\n\"Who now can say that the firefly is a coward?\" the firefly asked.\nThe apes all hung their heads in shame. The firefly graciously spared their lives. But from that day forward, the firefly became the mortal enemy of the ape.\n\nText 2:\nJackrabbit's Wisdom Spot\nAn African Myth\n\nJackrabbit was a very wise fellow, but he wanted to be wiser. So he went to the animal wizard, Muzimu, and begged for more wisdom. \"Great wizard of the woods, please make me wiser,\" said he.\n“You are wise already, little fellow,\" replied Muzimu.\n\"But not wise enough, great one,\" said the rabbit.\n\"Then bring me a live snake and I will see what I can do for you.\"\nThe rabbit picked up a long stick and went to the house of the snake. There he found that crawling creature coiled upon a log. \"Good day, friend snake,\" said the rabbit.\n\"Good day, little one, what have you there?\"\n\"A stick which is longer than you are.\"\n\"Nonsense, boy.\"\n\"Let us measure and see,\" said the cunning rabbit. The snake stretched himself along the log. The rabbit put his stick near the snake, as if to measure him. Then, quick as a wink, he slipped a string round the snake's neck and held him fast to the end of the stick.\nThe rabbit ran quickly with him to Muzimu. The wizard could not believe his eyes when he saw the wiggling snake on the end of the rabbit's stick. \"How did you catch him alive?\" he exclaimed. The rabbit smiled, but said not a word.\n\"Little fellow,\" said Muzimu, \"since you are clever enough to fool the snake, you have all the sense you need.\"\n\"No, no, mighty Muzimu, give me more sense.\"\n\"Go, then, and bring me a swarm of bees, and then I will give you all the sense you want.\"\nThe little rabbit ran off and found a big gourd. He cut a hole in the bottom and cleaned it out. Then he put some honey in it and tied the gourd to a long pole. He found a bee's nest and left the gourd nearby. The bees soon smelled the honey and flew around the opening. Then they crawled into the gourd to taste the sweet food. When the gourd was full, the rabbit slipped up, covered the hole, and carried the gourd to Muzimu.\nAgain was the animal wizard surprised. \"Brother Rabbit, you are indeed a wise little creature, and you shall become wiser every day, because you use your wits.\" As he said this, he touched the rabbit's head between the ears and the hair became white. \"You shall always wear this white spot,\" he continued, \"as a mark of your wisdom.\" And to this day, all jackrabbits wear this white wisdom spot between the ears."]}, {"unit": "Comprehension Skills", "topic": "Messages, Lessons, and Morals", "lesson": "Identify and differentiate between topics and themes", "texts": ["A Breath of Fresh Air\n\nMiguel closed his laptop and flopped down on the couch. The numbers just were not working, and if the numbers were not working, neither would the rockets. Sure, he was only one part of the team programming the whole system, but his part was the only part that was failing.\nHis roommate Dwayne rolled his eyes at him. \"What has you acting so dramatic?\"\n\"The numbers,\" Miguel answered, still on his back. \"I just can't make them do what they need to.\"\n\"Oh, you'll figure it out. You've always found numbers pretty easy,\" said Dwayne. \"After all, it's not rocket science.\"\n\"It is rocket science!\" Miguel snapped. \"I just have to quit. I cannot keep up with the challenges of this job.\"\n\"Do yourself a favor: Take a walk, and leave your phone behind. Then, get a nap. You have to get away from the numbers for a little.\"\nHow desperately Miguel wanted to stay at his computer and force those numbers into place! Nothing he did was working, though. Maybe Dwayne was right. Reluctantly, Miguel rose and walked out the door, abandoning all electronic devices. Immediately, the sun cheered his heart, and the fresh air filled him with a sense of peace. It felt as though he had been in a dark prison and had finally burst out into joyful freedom. The trees' leaves fluttered gentle hellos to him. He walked around the block twice.\nWhen he got back inside, he felt less rushed. He went ahead and took a nap. It felt luxurious. After the sun had set, he opened his computer again. As he looked over his work with a new sense of calm, little mistakes jumped out at him. How had he missed them before? Now, he rapidly eliminated the stray errors. Now, the numbers were on his side again.", "An Extra-Curricular Conclusion\n\n\"Wow, Orson, I don't think we will ever find that ball again.\"\n\"Way to go, Phillips! Who knew you could hit like that?\"\n\"Orson, you have got to join the baseball team!\"\nOrson Phillips stood awkwardly on home plate, letting the bat he had just swung drop to his side. He trudged along the bases as the P.E. teacher, Mrs. Glass, cheered him on. When he finally made it back around, he was swarmed by his classmates.\n\"Who taught you to hit like that?\" Barry Simpson asked.\n\"My grandpa. He played baseball in college,\" Orson said.\n\"So why aren't you on the team already?\" Mike DeShaw demanded.\nOrson shrugged. \"I just don't really like playing baseball,\" he said.\n\"But you're so good!\" Kenny Banks gushed.\nOrson took a drink of water to avoid the conversation. It was true that Orson was a good hitter. His grandpa had taught him how to swing a bat when he was four years old. Orson had even played Little League for a year or two when he was younger. Still, he had never found much joy in the game.\n\"They're right, you know,\" Mrs. Glass, who had just walked over, said. \"You'd be a great addition to our school team. Plus, who doesn't love doing the things they're best at?\"\nLuckily for Orson, the bell rang at that moment, saving him from being pestered any further. As he walked back into school, he thought about what Mrs. Glass had said. It was true that there were some things that Orson enjoyed doing that he was good at, like reading chapter books and drawing. But he also enjoyed being challenged, like in his computer programming class. He couldn't even count the number of times his code had been incomplete or he had gotten worse grades than his neighbor. In fact, one of his failed websites was an ongoing joke in class. However, that just made him want to try harder.\nA week later, Kenny Banks found Orson in the hallway and waved a flyer in his face. \"Baseball tryouts start next week!\" Kenny said, breathlessly. \"Mrs. Glass is the coach, you know, and she basically said you had a spot on the team!\"\nOrson pretended to be interested in the flyer and said he would let Kenny know later. But as Kenny ran off to class, Orson dropped the baseball flyer in the recycling bin. As he looked up at the bulletin board hanging over the bin, he saw another flyer, one for a new school coding club. He read that the club's first meeting was next Monday, the same day as baseball tryouts. Orson put the coding club flyer in his bag before going to class.\nAs he sat down at his desk, Orson pulled out his math notebook, and the coding club flyer came with it. Kenny Banks, who sat nearby, saw the flyer and laughed. \"Are you thinking about doing coding club instead of baseball?\" he smirked. \"Why waste your time? Why not do something you'll actually be good at?\"\n\"I just don't like baseball very much,\" Orson mumbled, but their teacher, Ms. Jones, began her lesson before Kenny could respond.\nThe next Monday, Orson was careful to avoid Kenny and the other baseball team hopefuls in the hallways. As the school day ended, he watched Kenny, Barry, and Mike make their way to the locker room before tryouts. When they had disappeared behind the locker room door, Orson walked in the opposite direction, toward the computer lab, clutching the coding club flyer in his hand."]}, {"unit": "Comprehension Skills", "topic": "Prereading Strategies", "lesson": "Make, confirm, and revise predictions", "texts": []}, {"unit": "Comprehension Skills", "topic": "Determining the Meaning of Unknown Words", "lesson": "Use context clues to determine the meaning of unknown words", "texts": []}, {"unit": "Comprehension Skills", "topic": "Determining the Meaning of Unknown Words", "lesson": "Identify prefixes, suffixes, and root words", "texts": []}, {"unit": "Comprehension Skills", "topic": "Determining the Meaning of Unknown Words", "lesson": "Use prefixes to determine word meaning", "texts": []}, {"unit": "Comprehension Skills", "topic": "Determining the Meaning of Unknown Words", "lesson": "Use suffixes to determine word meaning", "texts": []}], "4": [{"unit": "Comprehension Skills", "topic": "Setting a Purpose and Asking Questions", "lesson": "Establish a purpose for reading a text", "texts": []}, {"unit": "Comprehension Skills", "topic": "Setting a Purpose and Asking Questions", "lesson": "Asking questions while you read", "texts": []}, {"unit": "Comprehension Skills", "topic": "Key Details", "lesson": "Use details from the text to answer questions", "texts": []}, {"unit": "Comprehension Skills", "topic": "Key Details", "lesson": "Use details from the text to infer answers", "texts": []}, {"unit": "Comprehension Skills", "topic": "Key Details", "lesson": "Understand the difference between what is explicit and implicit information", "texts": []}, {"unit": "Comprehension Skills", "topic": "Key Details", "lesson": "Use details to support conclusions about a text", "texts": []}, {"unit": "Comprehension Skills", "topic": "Making Predictions and Asking Questions", "lesson": "Ask questions about key details", "texts": []}, {"unit": "Comprehension Skills", "topic": "Making Predictions and Asking Questions", "lesson": "Make predictions by using text features, characteristics of genres, and structures", "texts": []}, {"unit": "Comprehension Skills", "topic": "Using Details and Examples", "lesson": "Use details and examples to explain what a text says", "texts": ["Read the following passage.\n\nOld Greek Stories\nBy James Baldwin\n\nJupiter had two brothers, both of them terrible fellows, but not nearly so great as himself. The name of one of them was Neptune, or Poseidon, and he was the king of the sea. He had a glittering, golden palace far down in the deep sea-caves where the fishes live and the red coral grows. Whenever he was angry the waves would rise mountain high, and the storm-winds would howl fearfully, and the sea would try to break over the land. Men called him the Shaker of the Earth.\nThe other brother of Jupiter was a sad pale-faced being, whose kingdom was underneath the earth, where the sun never shone and where there was darkness and weeping and sorrow all the time. His name was Pluto, or Aidoneus, and his country was called the Lower World, or the Land of Shadows, or Hades. Men said that whenever anyone died, Pluto would send his messenger, or Shadow Leader, to carry that one down into his cheerless kingdom. For that reason, they never spoke well of him, but thought of him only as the enemy of life.", "Read the following passage.\n\nOld Greek Stories\nBy James Baldwin\n\nA great number of other Mighty Beings lived with Jupiter amid the clouds on the mountain top, so many that I can name a very few only. There was Venus, the queen of love and beauty, who was fairer by far than any woman that you or I have ever seen. There was Athena, or Minerva, the queen of the air, who gave people wisdom and taught them how to do very many useful things. There was Juno, the queen of earth and sky, who sat at the right hand of Jupiter and gave him all kinds of advice. There was Mars, the great warrior, whose delight was in the rush of battle. There was Mercury, the swift messenger, who had wings on his cap and shoes, and who flew from place to place like the summer clouds when they are driven before the wind. There was Vulcan, a skillful blacksmith, who had his forge in a burning mountain and wrought many wonderful things of iron and copper and gold.\nAnd besides these, there were many others about whom you will learn by and by, and about whom men told strange and beautiful stories. They lived in glittering, golden mansions, high up among the clouds, so high indeed that the eyes of men could never see them. But they could look down and see what men were doing, and oftentimes they were said to leave their lofty homes and wander unknown across the land or over the sea."]}, {"unit": "Comprehension Skills", "topic": "Using Details and Examples", "lesson": "Make inferences about a text", "texts": []}, {"unit": "Comprehension Skills", "topic": "Using Details and Examples", "lesson": "Identify details to support inferences", "texts": []}, {"unit": "Comprehension Skills", "topic": "Using Details and Examples", "lesson": "Identify explicit and implicit information", "texts": []}, {"unit": "Comprehension Skills", "topic": "Using Details and Examples", "lesson": "Identify main events", "texts": ["An except from Sanctuary\nWritten by Joy Kita\n\nChapter 3: Following the River\n\nDeer and Beaver had met on the riverbank. They were going to find fresh berries when they saw their friend Moose. Moose wanted to go find berries, too.\n“Be careful where you step, though, Moose,” Deer said. “I saw a hunter's trap near my home. Just the thought of it is spoiling my day.”\nBeaver nodded sadly. “I've heard the voices of men carrying through these woods more and more often.”\nMoose sighed. “And I've seen their fires flicker in the distance at night. No place is completely safe anymore, is it?” he said slowly. “Why don't we all swim together instead of walking?”\nDeer nodded, and he and Moose carefully waded into the current.\nFarther down the river, they saw Loon. The beautiful black and white bird turned its long neck in their direction.\n\"Hello, fellows. What brings you this far down the river?\"\n\"Fresh berries still on the vine!\" Deer shouted.\nLoon’s head suddenly ducked underwater, his bottom feathers pointing to the sky. He popped up a moment later with a small fish in his mouth.\n\"I’ll join you,\" he said between mouthfuls of fish. \"Berries don't interest me, but I'd love to spend time with my friends. I've been feeling a little sad today, and some company sounds nice.\"\nAs they swam, Deer tried to enjoy the sounds of the early morning and the peace he usually felt surrounded by such beauty. Bull frogs croaked and called to them as they swam. Jewel colored dragonflies zipped past them.\nBut he could not shake the feeling that something was not right.", "An excerpt from Sanctuary\n\nChapter 4: The Scent of Danger\n\nSomething floating in the water caught Deer's eye, and he kicked his legs harder and swam forward, leaving his friends behind. There was a piece of plastic on the surface. It was clear and had lots of holes in it. Stuck in one of the holes was a mallard duck.\nDeer used his mouth to tear the plastic. A moment later, he managed to set Duck free.\n\"Thank you so much,\" Duck said weakly. \"I’ve been stuck for so long that I’m not sure I can fly.\"\n“Why not come with us until you feel stronger?” Beaver suggested. “We're going to find fresh berries. In fact, we're nearly there.”\nDuck agreed, and a few minutes later, the friends were climbing out onto the riverbank. To their delight, a large clump of bushes grew nearby. It was packed with plump blackberries!\nDeer was extremely happy to see the berries, but he still couldn’t shake the feeling that danger still lingered. They carefully approached the bush and began enjoying the juicy treat. But their moment of peace was soon interrupted.\nA crack, like the sound of thunder, echoed across the sky, startling all of them.\n\"I know that sound,\" Moose said, his deep voice laced with regret. \"We should not be out in the open. Be safe, my friends. Our sanctuary has been breached.\"\nDeer watched as his friends departed and made their way to safety. Their day of rest and fun was ruined.\nDeer headed home through the forest, using the trees as cover. It was hard to shake the feeling of danger. Will I ever know the peace of the river again? he wondered. He knew that from then on he would have to be much more careful. His life might never be the same."]}, {"unit": "Comprehension Skills", "topic": "Main Idea and Summary", "lesson": "Determine the main topic of a text", "texts": []}, {"unit": "Comprehension Skills", "topic": "Main Idea and Summary", "lesson": "Determine the main idea of paragraphs", "texts": []}, {"unit": "Comprehension Skills", "topic": "Main Idea and Summary", "lesson": "Identify supporting ideas in texts", "texts": []}, {"unit": "Comprehension Skills", "topic": "Main Idea and Summary", "lesson": "Identify supporting details in paragraphs", "texts": []}, {"unit": "Comprehension Skills", "topic": "Main Idea and Summary", "lesson": "Explain how paragraphs support main topic", "texts": []}, {"unit": "Comprehension Skills", "topic": "Main Idea and Summary", "lesson": "Summarize informational texts", "texts": []}, {"unit": "Comprehension Skills", "topic": "Summary and Main Events", "lesson": "Identify key details", "texts": ["An excerpt from Sanctuary\nWritten by Joy Kita\n\nChapter 2: Friends\n\nA ripple in the water by the bank caught Deer’s attention. He walked over to the pile of sticks artfully placed on top of each other.\n“Deer,” Beaver called to him, poking his head out from the edge of his dam. “Nice to see you! Are you going up river?”\nDeer nodded. “I’m on my way to the mouth of the river where I hear the berries are still on the vine. Want to come with me?”\nDeer knew that while beaver enjoyed swamp wood, water plants, and root vegetables, he also enjoyed fruit. Plus, Deer wanted to spend time with his friends.\nWithout a word, Beaver ducked his head underwater. A second later, he was by Deer’s side, his eyes bright. “Let’s go!” With a slap of his waffled tail against the water, Beaver swam away.\nThey heard a loud thrashing coming from the trees and swam to the side knowing just who it was. “The old fellow could never sneak up on anyone, could he?” Beaver asked as he climbed onto a mossy rock.\n“Hello, Moose!” Deer and Beaver shouted in unison.\nStartled, Moose’s enormous rack of antlers jerked upward. When he saw who it was that greeted him, he relaxed and continued forward to the water’s edge.\n“Hello, Deer. Hello, Beaver,” he said in a deep vibrating voice that suited his size. “What’s the news?”\n“Deer and I are headed to the river’s mouth where the berries are still on the vine. Why don’t you come along, too?”\n“I would enjoy such a treat this late in the season,” Moose said.\n\nChapter 3: Following the River\n\n“Be careful where you step, though, Moose,” Deer said. “I saw a hunter's trap near my home. Just the thought of it is spoiling my day.”\nBeaver nodded sadly. “I've heard the voices of men carrying through these woods more and more often.”\nMoose sighed. “And I've seen their fires flicker in the distance at night. No place is completely safe anymore, is it?” he asked slowly. “Why don't we all swim together instead of walking?”\nDeer nodded, and he and Moose carefully waded into the current.", "An excerpt from Sanctuary\nWritten by Joy Kita\n\nChapter 3: Following the River (Continued)\n\nFarther down the river, they saw Loon. The beautiful black and white bird turned its long neck in their direction.\n\"Hello, fellows. What brings you this far down the river?\"\n\"Fresh berries still on the vine!\" Deer shouted.\nLoon’s head suddenly ducked underwater, his bottom feathers pointing to the sky. He popped up a moment later with a small fish in his mouth.\n\"I’ll join you,\" he said between mouthfuls of fish. \"Berries don't interest me, but I'd love to spend time with my friends. I've been feeling a little sad today, and some company sounds nice.\"\nAs they swam, Deer tried to enjoy the sounds of the early morning and the peace he usually felt surrounded by such beauty. Bull frogs croaked and called to them as they swam. Jewel-colored dragonflies zipped past them.\nBut he could not shake the feeling that something was not right.\n\nChapter 4: The Scent of Danger\n\nSomething floating in the water caught Deer's eye, and he kicked his legs harder and swam forward, leaving his friends behind. There was a piece of plastic on the surface. It was clear and had lots of holes in it. Stuck in one of the holes was a mallard duck.\nDeer used his mouth to tear the plastic. A moment later, he managed to set Duck free.\n\"Thank you so much,\" Duck said weakly. \"I’ve been stuck for so long that I’m not sure I can fly.\"\n“Why not come with us until you feel stronger?” Beaver suggested. “We're going to find fresh berries. In fact, we're nearly there.”\nDuck agreed, and a few minutes later, the friends were climbing out onto the riverbank. To their delight, a large clump of bushes grew nearby—packed with plump blackberries!\nDeer was extremely happy to see the berries, but he still couldn’t shake the feeling that danger still lingered. They carefully approached the bush and began enjoying the juicy treat. But their moment of peace was soon interrupted.\nA crack, like the sound of thunder, echoed across the sky, startling all of them.\n\"I know that sound,\" Moose said, his deep voice laced with regret. \"We should not be out in the open. Be safe, my friends. Our sanctuary has been breached.\"\nDeer watched as his friends departed and made their way to safety. Their day of rest and fun was ruined.\nDeer headed home through the forest, using the trees as cover. It was hard to shake the feeling of danger. Will I ever know the peace of the river again? he wondered. He knew that from then on he would have to be much more careful. His life might never be the same."]}, {"unit": "Comprehension Skills", "topic": "Summary and Main Events", "lesson": "Summarize texts", "texts": ["Dennis Doormouse's Magnificent Moustache\nWritten by Katie Thompson\n\nChapter 2\n\nWhen Dennis awoke, he felt nothing but skin where a magnificent moustache should have been. He searched everywhere for Grizzly Wump: in every kitchen drawer, under every rug and pillow. His wife searched the garden and called out to the neighbors, but Grizz was gone. And the Mega Moustache Contest was in thirty-three hours.\nGrizzly Wump had made it all the way to New York City. He wrapped himself around a giant bundle of cotton candy and rode the roller coaster so many times that all of his hairs were sticking straight up. He went swimming in the ocean and ran on the beach. He had sand and cotton candy sticking on him everywhere.\nHe jumped onto a nearby baby in a stroller for a ride to a different part of the city. People were everywhere, but they were all too busy to notice the large moustache on the tiny child. The baby giggled as Grizzly’s hairs tickled him. After a while, the baby started to pull on Grizzly’s hair and chew on his tips. The baby was having fun, but this was not fun for Grizzly.\nHe flew off the baby and landed on the face of a fat trombone player standing on the street corner. The trombone player, Mr. Q, didn’t feel a thing, and Grizzly liked the jazzy sounds his new face was playing. He went home with Mr. Q that night, and both slept peacefully.\nThe next morning, Mr. Q had quite the scare when he stood in front of the bathroom mirror to brush his teeth. Grizzly jumped up in shock, too. He forgot he wasn't on Dennis’s face anymore. He had never seen himself on another face before!\n“Well! What do we have here?” Mr. Q said to his reflection. Grizzly wanted to say something, but of course, moustaches can’t talk. Mr. Q set out to the city to show off his new moustache. All day, he got many compliments from many strangers, but Grizzly felt out of place in this giant city.\nWhen Mr. Q stopped at a store, Grizzly snuck off into the chilly night to try to make it back home to Dennis. The wind carried him into a swirling draft of sticks and leaves and candy wrappers. Grizzly flapped about, barely able to stand up. A spark of lightning cracked open the sky. The rain was icy and cold. Grizzly was soaked and extremely uncomfortable. For the first time in a very long time, he wished he could be dry and warm and only on Dennis Doormouse’s lip.", "Dennis Doormouse's Magnificent Moustache\nWritten by Katie Thompson\n\nChapter 3\n\nBack at Dennis’s house, he and his wife sat by the fire. They were much colder without Grizzly there with them. Sometimes, Dennis walked around like a zombie, with a moustache he drew on his face with a marker.\nOther days, he made jokes about losing his hair. He may have fooled some of his friends, but Peach Twit knew he only missed Grizzly Wump, and wondered if there was something she could do to get him back.\nJust then, there was a knock on the door. Peach opened it to find a neatly-wrapped package on the welcome mat outside. Inside the package, she found a flawless moustache. It looked exactly like Grizzly Wump, except it hadn’t been taken care of for days. She combed through the hairs and fixed it up. When she was done, she could hardly resist the urge to try it on herself.\nAs she brought it closer to her face, her fingers began to tingle. The moustache took on a life of its own. It turned its tips into all kinds of shapes as the moustache twisted towards the sky. A warm smile crept across Peach’s face.\nShe let the moustache sit there for a few seconds longer, and it did. It stuck to her face as it tickled her nose, until she remembered who the moustache had really returned for. She took it off and brushed it again, restoring Grizzly Wump to his former glory, just in time for him and Dennis to win the Mega Moustache Contest once again."]}, {"unit": "Comprehension Skills", "topic": "Theme", "lesson": "Identify theme in stories", "texts": ["What Do You Do With A Lost Unicorn?\nWritten by Katie Thompson\n\nChapter 2\n\nI decide that I should at least get the unicorn out of the garage before trying harder to wake it up. Luckily, it had fallen asleep on the corner of an old dropcloth. I figure that if I can get most of its body onto the plastic sheet, I might be able to pull it out onto the driveway.\nBut the thing weighs about a thousand pounds, even though it's much smaller than I'd have guessed a unicorn would be. It takes me at least 15 minutes to pull and shimmy the corners of the drop cloth under its wide flank. I’m seriously sweating when I hear someone cough behind me. I turn around, hoping it’s not my old neighbor, Gertrude, who never has anything better to do than bother me. It’s not. It’s Joe. My stomach drops.\n“I was worried about you. I thought I’d stop by before heading to school. What…what are you doing?” he asks.\nI can't believe he is here. I fumble with the dropcloth and feel embarrassed. “Trying to get this stupid thing out of the garage? How is that not obvious to you?”\n“And…Then what?”\nNow I just feel stupid. “I don’t know. Hope that it wakes up and runs off.” I start fiddling with the dropcloth again, purposefully turning my back to Joe. “Did you look at it?” I ask, after some silence.\nHe cranes his neck to get a glimpse. “I bet it’s just a pony, Anna. At best, it’s one of those weird small horses. Like the kind at state fairs. Maybe it was just tired of being held in some tiny barn and winning pointless awards, so it just walked off.”\n“A pony. In Los Angeles. Right, Joe. Like that would ever happen. That's an even worse idea than a unicorn.”\nHe looks at me and his eyebrows knit together in way that tells me he is not very happy with me. “I'm just trying to make this make sense. I'm just trying to help. You don't have to be a jerk,” he says.\nBut I feel like I don't know how to act around him, so I say, “It has a horn, dude. Can you see the horn? It’s right in the middle of his head. Sticking up. In the air. Like horns do. Especially when they’re on unicorns.”\nHe raises his eyebrows and I start to feel a little ashamed. I sort of crumple, standing back up to face him. “I'm sorry. It's just…weird to see you. Talking to you on the phone felt so normal. But seeing you in person makes me feel weird! Or afraid. Or just like I missed you a lot, and now I have no idea how to be a decent person to you.”\nHe walks over to me and puts his arms around me. Even this feels uncomfortably normal.\n“You're so weird,” he says, still hugging me. “If you missed me so much, don't be mean when I try to help you.” He pauses and looks at the unicorn. “I mean, I missed you too,” he says.\nThis startles me and I still don't know what to say. I rumpled the dropcloth with my shoe. I know I should thank him for checking on me or something, but I can't come up with the words. Why didn't I realize seeing him would be really hard? Finally I look at the unicorn, too. “Can you just…Can you just help me try to move this thing?”", "What Do You Do With A Lost Unicorn?\nWritten by Katie Thompson\n\nChapter 3\n\nBy the time we have managed to pull the now snoring unicorn out onto the driveway, the color in Joe’s face completely gone. “How…Where…Did this thing come from?” he asks, panting.\n“What, afraid it’s real after all?” I ask.\nHe looks up at me and offers a half-smile. “Who wants unicorns to be real if they look like that?”\nI hide a laugh. “Well…Now we just have to figure out how to wake it up.” I poke it a few times with my foot, trying to keep some distance. It just keeps snoring.\nJoe shrugs and bends down next to its ugly face and starts jiggling its shoulder, like he’s trying to wake up a very old uncle.\nSuddenly its eyes open wide, and with an unbelievable grace, it stands upright. Joe jumps away to give it space, and I just keep staring at it. It walks over to the desert-style landscaping of my neighbor’s side yard and being perusing for its breakfast.\n“That thing’s a lot more agile than I imagined it would be,” Joe says. We both stare at it as it saunters around, pulling up the grassy weeds from between the rock mulch. “So…that’s a unicorn.”\nI look up at Joe and he's got this silly grin on his face. It's just so 'Joe' that I giggle. “Do you believe that's what it is yet?” I ask.\n“I could if I wanted to,” he replied.\nI looked up at him, questioning.\n“That thing,” he points to the unicorn. “I could believe it was if I wanted to.”\nThe unicorn seems to have decided that it isn’t going to find anything worth eating here and starts to walk down the sloping back yard to the next street. It looks almost like it belongs there, like a stray deer who often grazes around this part of town when no person is awake or watching. When it disappears from our sight, I feel like a ton of responsibility has been lifted from me.\nThe whole morning seems almost trivial. “Well,” I say, “I guess that is that?”\nJoe shrugs, checks his watch, and motions toward the bus stop. “We should get going,” he says. I grab my bag, and we walk down the driveway.\n“I don't know if that thing was a unicorn or not,” he says, looking up into the sky like he might see a dragon flying around to confirm my claim. “But I'm glad you called me this morning.”\n“Sorry I was…not very nice,” I say, hesitating.\nHe laughs a little but keeps looking around. Then with a huge gulp of air, “Do you believe we could be friends again? Like, real friends again? Because I gotta say, I really do miss you, Anna.”\nI smile, remembering what he said earlier and reply, “I believe we could if we wanted to.”\nThis time he looks over at me. “…And?”\n“And I really hope we want to.”"]}, {"unit": "Comprehension Skills", "topic": "Theme", "lesson": "Identify theme in dramas", "texts": ["Are We There Yet?\nBy Katie Thompson\n\n\nACT II\nScene I\n\nTime: five minutes later\nPlace: inside the minivan on the freeway\n\nCharacters\nJAMIE\nDAD\nMOM\n\nJAMIE [whining again]: I just wanted to know how long it would be until we got there.\n\nDAD [sighs]: About two hours.\n\nJAMIE: You said that an hour ago. Two hours seems like a lot longer in this car. Two hours seems like an entire day. A really, really long day.\n\nMOM: Can't you play a game or something to pass the time?\n\nDAD: [to himself] Yeah, like the quiet game.\n\n[MOM raises her eyebrows at DAD]\n\nJAMIE: [crosses his arms and frowns]: This trip is zero fun.\n\n[DAD shrugs at MOM]\n\nJAMIE [suddenly]: Hey! Look at that little old lady walking in the field. And a bunch of other little old ladies behind her. That one over on the side is wearing a funny sweater. And eating grass.\n\nMOM [slightly worried]: JAMIE, those are sheep.\n\nJAMIE: Old ladies! [throws his head back in laughter]\n\nDAD [playing along]: That one seems angry. I wonder if she got in a fight with the one in the front.\n\nJAMIE [smiling] Yeah! The old lady in front knows they all have to go to the grocery store. But that one eating grass really wanted to play bingo. Grocery shopping is so boring.\n\n[MOM turns her head towards JAMIE in the backseat and smiles for the first time in a while]\n\nDAD: Those old ladies probably wish they had a car to ride in.\n\nJAMIE [laughing]: Yeah, they'd probably be a lot happier if they didn't have to walk everywhere! They probably get really bored walking.\n\nMOM [still smiling]: They probably don't know how to have any fun at all. They just argue with each other all day to stay busy!", "Are We There Yet?\nBy Katie Thompson\n\nACT III\nScene I\n\nTime: an hour later\nPlace: inside the minivan on the freeway\n\nCharacters\nJAMIE\nDAD\nMOM\n\n[JAMIE is still giggling in the backseat as he points at three cows in a nearby field.]\n\nJAMIE: And the one with the big black spot on its side is so tired of the brown cow talking about chocolate milk. He’s trying to find a way to leave the group but he doesn’t know how.\n\nDAD: I bet the black-spotted cow has bigger dreams.\n\nJAMIE: Yeah, he wants to get into acting. Or be the first cow in outer space! But he’s never going to get discovered just standing in a dumb field.\n\n[MOM sighs. DAD looks over to her.]\n\nDAD: What now?\n\nMOM [startled]: What? [realizing she had been sighing] Oh I’m just… [shakes her head].\n\nDAD [smirking]: Don’t tell me you're the bored one now.\n\nMOM [trying to stretch in the front seat]: I’m just tired of sitting in this car.\n\nDAD: Should we make a quick stop?\n\nMOM: No, we’re almost there… [more to herself] I just wish we were there.\n\nDAD [quietly, to MOM]: Maybe we’ve been going about this vacation the wrong way.\n\nJAMIE [not hearing his parents talking, points to a black car with tinted windows in the lane next to them]: And this guy! Totally a spy.\n\nDAD [to MOM]: You oughta take a leaf out of Jamie’s book, my dear.\n\nJAMIE [still looking at the black car]: Do you think he’s following us? Do you think he knows something we don't?\n\nMOM [looks at DAD and take a deep breath before turning around to JAMIE, excitedly]: We couldn't tell you this before, Jaim, but this trip is also. . . a top secret mission!\n\nDAD [to MOM]: That’s more like it! And she’s right, Jamie, [pretends to turn the wheel into the field of cows, laughing] We’re on a top secret mission… to get that cow into outer space!"]}, {"unit": "Comprehension Skills", "topic": "Theme", "lesson": "Identify theme in poems", "texts": ["I Saw In Louisiana A Live Oak Growing\nby Walt Whitman\n\nI saw in Louisiana a live-oak growing,\nAll alone stood it, and the moss hung down from the branches;\nWithout any companion it grew there, uttering joyous leaves of dark green,\nAnd its look, rude, unbending, made me think of myself;\nBut I wonder'd how it could utter joyous leaves, standing alone there, without its friend, its lover near - for I knew I could not;\nAnd I broke off a twig with a certain number of leaves upon it, and twined around it a little moss,\nAnd brought it away - and I have placed it in sight in my room;\nIt is not needed to remind me as of my own dear friends,\n(For I believe lately I think of little else than of them;)\nYet it remains to me a curious token - it makes me think of love;\nFor all that, and though the live-oak glistens there in Louisiana, solitary, in a wide flat space,\nUttering joyous leaves all its life, without a friend, a lover, near,\nI know very well I could not.", "If I Can Stop One Heart From Breaking\nby Emily Dickinson\n\nIf I can stop one heart from breaking,\nI shall not live in vain;\nIf I can ease one life the aching,\nOr cool one pain,\nOr help one fainting robin\nUnto his nest again,\nI shall not live in vain."]}, {"unit": "Comprehension Skills", "topic": "Describing Characters, Settings, and Events in Stories and Dramas", "lesson": "Describe characters in stories based on narrator descriptions", "texts": ["The Monster in Apartment 2B\nBy Joy Kita\n\nChapter 1\n\nThe banging started late one night when I was sleeping. Not being able to sleep when I had to take a gigantic math test the next morning was not fun. The pillow over my head did nothing to quiet the noise. My ear plugs weren’t working either. I could still hear the commotion coming from the apartment upstairs.\nMy door opened, and a head popped into my sight.\n“Melanie, do you hear that?” my brother asked me. His eyes were still droopy with sleep. “It’s coming from Old Man Tucker’s apartment.”\nOld Man Tucker was the meanest man that lived in our building. He never spoke or smiled, and he once tried to hit us with his cane.\nA violent crash and a piercing shriek had me out of bed and scrambling for my polka-dotted fairy slippers. Something had to be done. For all we knew, Old Man Tucker was fighting burglars. Our Granny was watching us for the week while our parents were out of town. She would know what to do.\nWe tried to wake up Granny, but her hearing aid was unplugged and her snores almost drowned out all of the other sounds.\n“Let’s go see for ourselves what all the commotion is,” my brother said. He was already at the door. He was younger than me, but he had loads of courage while I was known for being intelligent.\n“We can’t go over there without Granny,” I said.\nIt was no use trying to wake her up. No matter what we did to Granny, she snored on. I agreed to follow James upstairs out of concern for Old Man Tucker. Something terrible must have been happening to him.\n“Maybe criminals broke in and are hiding from the police. Or there might be jewel thieves looking for a stash.” I pondered out loud.\n“Looking for a stash of what?” James rolled his eyes. “Maybe there are pirates looking for treasure.”\n\nChapter 2\n\nBy the time we made it to Apartment 2B, the noise had stopped. James thought we should go back to bed. I wanted to make sure the old guy was still breathing.\n“Mr. Tucker, it’s Melanie from downstairs. Are you okay?” I spoke loudly so that he could hear me through the thick apartment door.\nThere was another loud crash, followed by silence, and then the sound of heavy footsteps.\n“Go away!” he shouted.\n“It sounds like he is okay. Let’s leave now,” James said nervously.\n“We have to be sure,” I whispered.\nThis time when I knocked, the door opened a little.\n“What do you want?” a craggy voice demanded.\nOld Man Tucker’s normally smooth gray hair was sticking up everywhere. His face was red and blotchy.\n“We heard the noise and wanted to make sure you were okay.”\n“I’m fine,” he grumbled.\nThe door slammed in our faces. More crashes could be heard from inside.\n\nChapter 3\n\nI pounded on the door once more.\n“It’s really late. You kids ought to be in bed,” Mr. Tucker growled through pursed lips.\nI stuck out my leg over the threshold of the door and said, “We only want to make sure everything is okay.”\nWhen the door slammed, it bounced off my foot like both were made of rubber.\nA piercing shriek mixed with the sound of shattering glass.\nMr. Tucker sighed and did not fight me when I pushed the door open and barged into his apartment. It was even messier than my apartment was after a slumber party.\n“I am going to be evicted from the only place I have ever lived,” Mr. Tucker said with a sullen glare in my direction.\nI did not answer. I could not answer. My mouth was busy arguing with my brain over what I was looking at. A mess of glowing green tentacles waved back and forth like a shredded flag on a windy day.\n“Mr. Tucker, you own a monster?” my brother managed to say. “I’m pretty sure there is a ‘no pet’ policy in the building.”\nWhen I could no longer stand looking at the monster, my eyes wandered to the remains of the apartment. I would not have been surprised to learn a tornado had been through apartment 2B.\nEverything was torn apart. Stuffing from the couch was strewn everywhere, broken chair pieces littered the floor, and dishes, still randomly flying through the air, shattered on every surface.\n“There’s a monster living in Apartment 2B,” I muttered.\n\nChapter 4\n\nMr. Tucker shut the door and motioned toward the couch. “Sit down if you insist on staying. It doesn’t like to be stared at.”\nI glanced dubiously at the glowing, green monster that looked like it had just crawled out of a sewer on another planet. All ten of its eyes stared back at me. When its drooling mouth opened, I thought maybe it was going to smile.\nGaping jaws snapped and spewed goo all over us.\n“Gross,” James said shaking off as much as he could.\n“Mr. Tucker, is it normal for your pet to act like this?” I dabbed at the mess on my face with a couch pillow.\n“This foul creature is no pet of mine. I have been trying to get rid of it all night,” Mr. Tucker tried to explain.\nJames and I shared a horrified look.\n“If this thing doesn’t belong to you, then where did it come from?”\nMr. Tucker stood and wordlessly walked into another room.\nWe followed, keeping careful distance from the temperamental monster.\nThe bathroom was crowded with all of us standing inside. It was messy, too. Green and red slime covered everything as if a watermelon had exploded.\n“Did you have an accident in here, Mr. Tucker?” I asked.\nHe pointed at the toilet. I reached over and gingerly lifted up the seat.\n“Ah,” James said.\n“Hmm,” I remarked.\n“Exactly,” Mr. Tucker bemoaned.\n\nChapter 5\nWe conferred in the kitchen, away from the contaminated toilet seat and the alien monster, and we reassured Mr. Tucker that we would keep his secret.\n“I do not want anyone to think I had something to do with this,” he explained.\n“It is your toilet,” James said.\nI frowned at him. “James, how could Mr. Tucker know his bathroom was a portal to another planet? No one can prepare for that.”\nNight was wearing on, and we still had not figured out a plan. We discussed adoption, tossed around the idea of contacting the government, we even thought about waking Granny, but in the end we all thought it best to do nothing at all.\n“It looks rather peaceful,” I said.\n“It has stopped tearing the place up,” James noticed.\n“It does look friendly when there is no goo erupting from its mouth,” Mr. Tucker agreed.\nJames and I promised to come back the next day and make sure Mr. Tucker survived the night.\n“I can’t believe there is a monster living in Apartment 2B,” said James, scratching his red hair.\n“At least now we have something to do after school.”", "Captain Four Fingers and the Twelve Thieves\nBy Joy Kita\n\nChapter One: Captain Four Fingers\n\nCaptain Four Fingers was a dangerous man. He sailed the seven seas with a crew of men so terrible, so unsavory, and so unscrupulous that there was not a single man in the entire known world who would stand against him. This was a problem for the British Navy. They wanted the captain captured and put on trial for all his crimes.\nCaptain Four Fingers managed to escape his pursuers at every turn. He had help. The officers in the Navy and the King himself may have wanted Four Fingers out of the water and behind bars, but the pleasant commoners did not. They loved the captain. At each city port the pirate vessel visited, the captain and crew showered the commoners with money from the ship’s coffers. Businesses thrived, the poor were given coins and everyone had a good time. Whenever the Navy was close to finding the captain, people would hide him and his crew, until the threat was gone. In the minds of the people, Captain Four Fingers was a hero.\n“Where to now, Jenkins?” the captain asked his first mate.\nHe adjusted the red striped cloth over his hand with the missing finger and stared out at the vast blue water.\n“Well now, it has been forever and a day since we visited Portia. I would like to trade some of our gold for some of their spices.”\nJenkins was not dressed in his pirate garb. The only time he ever did was when they had an impression to make. He used to be a butler for a fine English gentleman, until the salty sea air made him turn in his silver tea tray.\nCaptain Four Fingers gave the order, and they set course for Portia, the tiny town north of the Cluster Islands. They were only gone a day when they saw something floating in the water, drifting on the lolling waves.\n“By gosh, Captain, there’s someone out there,” shouted a crew member. He skipped to the top of the rail and shielded his eyes from the midday sun.\nJohnny, the most talented swimmer among them, didn’t hesitate. He jumped over the rail in a straight dive downward, cutting through the choppy surface with ease. He swam over to the jagged piece of shipboard.\n“It’s a kid, Captain. He looks half dead!” Johnny used one strong arm to swim and the other to hold up the boy as he brought him aboard.\n\nChapter Two: Survivor\n\nThe pirates stood around the dripping body with a shared feeling of unease. The boy was breathing, but he had yet to wake up. It was against the pirate code to have a child aboard, but it was also against the pirate code to hurt a child.\n“We’re in a real fix here,” said Jenkins. He pulled out his silk hanky and mopped the sweat collecting in his dark black hair.\n“Not so much,” the captain said. “We rescue the boy, care for him, and take him to Portia. While there, we will leave him with the first kind woman we see.”\n“There ain’t no kind women in Portia,” one of the crew members shouted.\nJenkins strode to the man and shook his fist in his face. “We do not say ‘ain’t.’ We may be pirates, but we can have some decorum.”\n“Take the boy to my quarters, and we’ll see him well again,” the captain shouted.\nHe was in no mood to tolerate the childish squabbles of his crew. He knew well the rules he was breaking by taking on the boy, but he’d go overboard before he would leave the small child. Looking at him made him think of his sister’s wee son back home.\n“Jenkins, be sure he’s not disturbed.”\nThe captain took the time to glare at each member of his crew. They were a seedy bunch, and he wouldn’t put it past them to do something to the boy and claim it accidental.\nIt was not until the next day that the boy opened his eyes. It happened to be the captain who was by his side when he awoke.\n“Do not harm me. I have no secrets, none that you would want,” the boy said.\nHe scrambled far away from Four Fingers.\nThe captain was not surprised. He wore his hair in long, choppy braids. His face was covered by a thick beard and jagged scars. Truth be told, he enjoyed his foul appearance and the fear it put into the hearts of men and children alike. He was hardly the scoundrel he appeared, but it did no harm to keep up the image.\n“Relax, boy. I’m not going to do anything to you. Where did you come from?”\nThe young child looked the captain over, saw something akin to kindness in his eyes and relaxed. He knew this man would not hurt him.\n“I’m the eyes, ears, and fingers for the Twelve Thieves.”\nThe captain let out a breath of air in a violent swoosh and rocked backward in his chair. If this wasn’t a pretty pickle they’d gotten into, he didn’t know what was. The Twelve Thieves were many times worse than the men of his crew. They were not known as outlaw heroes, but monsters that would sell a baby for less than a half dollar.\nThe captain decided not to ask any more questions for the time being. He was not sure he wanted to know more. How the boy came to be dying on the open water was anybody’s guess. Perhaps the Twelve got tired of looking at him.\nCaptain called Johnny to his quarters and told him to keep an eye on the lad.\n“I don’t want to be changing any nappies,” Johnny grumbled. He obeyed his Captain, however, and went to sit with the child.\n\nChapter Three: The New Crew Member\n\n“What is your name, boy?” Johnny stared at him, trying to look as mean as possible.\nThe boy stared back and then broke into a wide grin.\n“You pirates ain’t nothing compared to the Twelve. Why you’re almost nice!”\nJohnny shot to his feet, fueled by emotion. The Twelve Thieves were nothing short of a horror. That the kid thought Johnny to be nice, was a disaster.\n“It ain’t proper to say ‘ain’t,’ ” Johnny said.\nThe boy, who refused to tell his name, worked alongside the crew for weeks as they sailed to Portia. He learned how to work the ropes, swab the deck, and play dice. The men treated him indifferently. They did not dare insult him, in case he was still favorably affiliated with the Twelve.\nA day or so before they were due to reach Portia, Johnny called from the lookout tower, “We got visitors.”\nThe men flew into action. They loaded their cleaned guns, sorted themselves into battle ready positions, and shoved the last of their stale biscuits in their mouths. The captain called the boy to his side and told him to go below the deck.\n“No,” the boy said. His words stammered and shook, but he remained steadfast and defiant.\nThe captain was not used to being disobeyed. He grabbed the boy’s collar, but stopped when he saw the fear in his eyes.\n“What is it?”\nThe captain knelt to be eye to eye with the child.\n“The Twelve, they kept me in the scullery locked up. I ran from them. I can’t be put down there again.”\n\nChapter Four: The Twelve Thieves\n\nThe captain knew that what he really had on his ship was far more trouble than he first realized. A lost body was one thing. A runaway was something entirely different.\n“You know who that is, don’t you?”\nThe captain pointed to the approaching vessel.\nThe boy nodded, tears filling his eyes. “It’s them, coming after me. I’ll go if you want me to, but I’ve never been happier than here with you.”\nThe captain wasn’t sure what to do, he felt like a small oar boat being battered by a hurricane, so scattered were his thoughts.\nThe captain’s order was to hold fire. None of his crew liked it very much. They grumbled and moaned about going soft, but they did as they were told. When the other ship was close, its owner was obvious. A flag, with the number twelve painted on it in dripping black paint, was hoisted high for everyone to see. They did not use the typical black of a pirate’s mast. Instead, theirs was an insidious red.\n“We’re looking for a boy or perhaps a corpse.”\nJohnny looked to his Captain for permission then shouted, “Be on your way fellows. We have not seen anything but the glorious sea.”\n“I’d like to come on board and see for myself,” the man said.\n“You are not welcome on this ship,” the captain said in an even tone. He hoped the boy would stay hidden in the covered oar boat behind him. All his men fingered their weapons, eager to fight. The Twelve Thieves drew their guns and pointed them at the crew.\n“Fight us if you will, but know we never lose.”\nThe captain had not worked hard to gain his violent reputation for nothing. He might be facing the Twelve Thieves, but he was Captain Four Fingers.\nThe other ship sailed without arguing. Most of the crew was disappointed the encounter had not resulted in some fighting, but the captain was relieved. He could no more give the boy up than his own son.\n“Meet the newest member of our crew!” Captain Four Fingers drew the boy close as everyone cheered."]}, {"unit": "Comprehension Skills", "topic": "Describing Characters, Settings, and Events in Stories and Dramas", "lesson": "Describe characters in dramas based on their words and actions", "texts": []}, {"unit": "Comprehension Skills", "topic": "Describing Characters, Settings, and Events in Stories and Dramas", "lesson": "Analyze changes within a character", "texts": ["Prince Owen\nPrince Owen and his brothers walked behind their guards. In the road ahead, a woman was kneeling down. Owen looked at her thoughtfully. She seemed to be gathering clothes that had tumbled from a basket. People walking along were casually stepping on the clothes with their dirty shoes. Owen started to speed his pace up, wanting to help her. Owen's oldest brother, Kennicot, touched his arm.\n\"Owen, just stay with the group,\" Kennicot whispered gently. \"It's not appropriate to step away.\" Kennicot always knew what his brother was thinking.\nThen, Owen saw one of the royal guards approach the woman. The guard began pushing her out of the way of the princes. After a glance at Kennicot, Owen bowed his head and stared down. As his group continued walking, he found himself stepping on the clothing she had dropped. He looked to the side and saw the woman standing by the road, staring sorrowfully at her trampled laundry.\nOwen's heart broke with that glance. What were they doing? That woman was one of his people. He and his family were responsible for her.\nThat evening, Owen could not fall asleep. As he stared at the dark ceiling, he remembered the feeling of the clothing under his feet. He remembered the woman's face. Minute by minute, the night hours filled him with guilt. However, as the day dawned, a new, beautiful thought bloomed in Owen's mind. He knew that he would never trample on the needs of his people again, no matter what Kennicot or Father said. He simply would not do it.", "Science Fair Lesson\nRebecca never missed a beat. She prided herself on that fact. Lately, she had been working day and night on her science project, an enormous collection of insects with descriptive labels. The pinned bugs and their tags were fixed to an upright cardboard stand. It was a thing of beauty, and she was proud of her work. Always the perfectionist, Rebecca had carefully considered every detail. After all, what could be more important than doing good work?\nAs she set up her board in the auditorium where the science fair would be held, she smiled broadly. This was some of her finest work. She noticed that one label's corner had gotten folded over, and she reached out to press it down. All of a sudden, something smacked the back of her leg. Rebecca tumbled into her board, which tumbled to the floor. Immediately, she knew her delicate project could not have survived the crash. This was the worst thing that could possibly happen.\nRebecca felt a hand on her back and turned to see Benji. His face was pale, and he looked near tears. \"I'm so sorry,\" he said. Benji had broken his leg in a car accident a week before, and he was still getting used to the crutches he needed. Just now, one of them had bumped her by mistake.\nFor Rebecca, it was as though time froze. Suddenly, all of her effort didn't matter to her. Right in front of her was a person who had suffered. Time started again. Rebecca clapped her hand on Benji's back and said, \"I didn't know you hated bugs that much!\" She laughed at her own bad joke to show there were no hard feelings. Benji's relief was so powerful that Rebecca could see it filling up his body. She thought to herself, Maybe there are some things more important than good work."]}, {"unit": "Comprehension Skills", "topic": "Describing Characters, Settings, and Events in Stories and Dramas", "lesson": "Describe settings in stories", "texts": ["Text 1:\nAn excerpt from Finding the Rainbow\nBy Joy Kita\n\nThe day was warm. The air was filled with the wonderful sounds of chirping birds. The wind blew gently, making the leaves in the trees shiver and sway like they were dancing. I was sitting under a large oak tree and enjoying my peanut butter cookie when I noticed something in the rose bushes. I was not the kind of child who scared easily, and I enjoyed a good adventure.\n\nText 2:\nAn excerpt from Alien Hunters: The Library\nBy Joy Kita\n\nChapter 1: Aliens in the Basement\nMy name is Gerry Jones, and I am an alien hunter. I also happen to be a preteen girl, and sometimes the two do not go hand-in-hand. My mom reminds me all the time that this gig is our duty, our birthright. As far as I am concerned, when I want to hang with my friends, a birthright obligation can be a real annoyance. This weekend I was supposed to attend one of my friend’s school productions, but instead I was stuck chasing down aliens.\nI hurried across town and arrived at the library just as the sun was going down. Let’s just say it doesn’t get much spookier than an ancient, dusty library dungeon. Add some human-hungry aliens and you’ve got the perfect storm of scary.\nI shivered. The library was freezing, so I wrapped my sweater tighter. I checked my watch. My mom was late. It wasn’t like her to not have my back in alien land.\n“Did you find what you’re looking for?” the elderly librarian asked as she shuffled toward me, a kind smile on her face.\nShe smelled clean, no alien stink on her. I have the gift of odor deduction. “Not really. I’m looking for the history records of this building.”\nHer smile turned to a small frown. “What would a young girl like you need with history records?”\n“I think you might be harboring an alien species right here in the library, and it would help me understand why they would choose the town of St. Clairon.” I used my most charming smile on her when she started backing away from me.", "The Red Pen: Fire! Fire!\nBy Joy Kita\n\nChapter 1: A New Adventure\nMary tightly held the red pen her grandmother had given her. She sat on her bed, staring down at the empty page in her journal. Her hand trembled, and the plume of the crimson feather on the end of the pen shivered in response. Did she dare put the pen to the paper?\nThe last time Mary had used the pen, she had been transported back in time to England. She had witnessed the coronation of Queen Elizabeth I. Mary had been enchanted by her visit and could not believe her good fortune. However, her grandmother’s warning had been explicit. The pen would take you to the most wonderful and horrible places in history. Mary could not choose the destination. She was merely along for the ride.\nNot knowing where her journey back in time would take her was thrilling and terrifying. The pen hovered above the paper before she forced it down. What sort of adventure would she have this time?\n\nChapter 2: Where There is Smoke\nBy its own accord, the pen began to etch out a date. The black ink marred the pristine white paper, like coal on a bed of snow. As the room around her began to blur and fade away, Mary felt a deep foreboding. She knew even before she arrived that something was very wrong. There was a lulling of time and space. A flash of brilliant white light anchored her to a new reality.\n\nSeptember 2, 1666\n\nSmoke hung in the air like a heavy wool blanket. Each time she took a breath, she felt suffocated. The sky was black and the moon glowed brightly. The green leaves still clung to the trees, not yet touched by fall weather. It was still, which surprised Mary. She expected noise and people and activity. Instead there was a silence, a quiet before the storm. She did not know what kind of storm it would be, but she suspected the smoke choking her lungs had something to do with it.\nWhere was everyone? Mary looked around to determine where the pen had taken her. A sign posted nearby read “Pudding Lane,” but the name meant nothing to her. For all she knew, she could be on the other side of the world. Hoping it might give her some kind of clue, she ventured forward to the source of the smoke.\n“Help! Help! My bakery is on fire. Someone, please do something.”\nMary could hardly make out the man running toward her. The smoke was too thick. He fell at her feet, coughing and mumbling something she could not understand.\n“I’m sorry, sir. I do not know what you are saying. Please calm down.” She knelt at his side and tried to comfort him.\nA flame burst out from the tiled roof, shooting upward like a thousand fireworks set off in unison. People began to gather and a sense of chaos built up to a fever pitch.\n“The bakery is on fire,” someone cried out.\nMary tried to help the old man to his feet, but he refused to stand. He lay there clinging to her ankles.\n“Wake the Lord Mayor, so that he might see the destruction and lend a helping hand.”\n\nChapter 3: The Lord Mayor\nMary had to ask several people where she was before anyone answered. London, England, a kindly faced gentleman told her in between shouting orders for onlookers to gather buckets for water.\nThe pen had brought Mary to England once before under a considerably different circumstance. She was brought the first time to celebrate Queen Elizabeth, and now here she was, to witness the Great Fire of London.\nMary was pointed in the direction of the Mayor’s house. She ran until her sides ached and her breath came in ragged stitches of gasped air. The house was an imposing structure, made of brick and mortar. This was much different from the wooden frames of the commoners’ houses. Knowing there was little time to waste, Mary approached the door quickly.\nA woman in a black dress with a white lace apron opened the door. She took one look at Mary and shut it again.\n“How rude,” Mary said, banging the brass knocker even harder.\n“Common folk must enter at the back door,” the maid told her when she opened the door a small crack.\n“But,” Mary started to say when the door slammed shut once more. “Oh for goodness’ sake!”\nShe raced to the back of the house and was greeted this time by an intimidating man in a black suit.\n“May I help you?” his voice was stern and disapproving.\n“The bakery is on fire, and we thought the mayor ought to know.”\nThe servant left Mary on the doorstep and went to wake his employer. It was clear by the expression on the Mayor’s pinched face that he did not appreciate the message. He grabbed his coat and headed toward the fire. During the ride, he allowed Mary to ride up front with the driver while he sat in his cozy, plush coach.\nBy the time they reached Pudding Lane, Mary was dismayed that the villagers had not been able to put out the fire. Her feelings made little sense to her. She knew the history, knew that the fire would blaze on for three more days. Reading about it and living it were very different experiences.\nThe Lord Mayor stalked out from his coach. He ignored the frantic cries of the people and inspected the fires. He had no comforting words for those working to put out the fire. He walked right past the baker, who was begging him to help. Then the mayor waved a disdainful hand at the wreckage.\n“A small child could put that fire out,” he said before stepping back into his carriage. He ordered the coach to return him to his bed.\nMary worked alongside the others, hauling bucket after bucket down the line only to watch the flames grow higher and higher. The small amount of water angered the blaze, infuriating it to burn faster and harder.\n“To the church!” someone cried out.\nChildren and belongings were gathered and taken to the church. Everyone hoped the stone walls would protect them from the hungry flame consuming everything in its path. Mary stayed with the others, fighting the fire as best as they could despite the mounting odds against them. The wind blew, enticing the flames higher. The dry houses fell like axed trees. No one was safe.\n\nChapter 4: The Great Fire of London\n“The fire will reach the ship builder’s home soon,” the baker told her in a flat, defeated voice. “When that happens, all of London is doomed.”\nMary remembered this part. She wanted to comfort him and reassure him that all would be well, but she knew that it would not be. The fire would reach the ship yard. Barrels of tar would explode, sending fire bombs to houses dozens of yards away.\n“Three days,” she murmured to him. In the distance, Mary heard a clock chime twelve times. Her surroundings faded away, and the air became light, free of smoke, and empty.\nShe was nowhere, suspended in time and space for a moment, before a shock of light exploded in her eyes. She was home again. At her desk, red pen in hand, her journal page was full of all she had experienced.\nMary had never been more relieved to be in her bedroom. She could hear the sound of her dad snoring in the next room. The comfort of familiarity soothed her.\nShe reached for the telephone.\n“Granny,” she said at the warm greeting, “how many people died in the Great Fire of London?”\nMary listened with a heavy heart as her grandmother told her the story. By the time the citizens fighting it were able to slow it down, thousands and thousands of people had died. Shops, churches, and innumerable houses did not survive the blaze.\n“The pen took me to a horrible time in history, Granny. Why would it do that?” Mary was sure she never wanted to use the pen again.\n“Our history is all we have to ensure we do not make the same mistakes. It is a part of who we are today, dearest. We take the good with the bad.”\nWhen Mary hung up the phone, she put the pen away carefully in her desk drawer. She sat for a moment considering her grandmother’s wise words and wondering where her pen might take her next."]}, {"unit": "Comprehension Skills", "topic": "Describing Characters, Settings, and Events in Stories and Dramas", "lesson": "Describe settings in dramas", "texts": ["Text 1:\nTHE VAIN JACKDAW\nBy Augusta Stevenson\n\nTIME: last summer\nPLACE: a public park\n\nCharacters\nVAIN JACKDAW\nOLD JACKDAW\nYOUNG JACKDAW\nOTHER JACKDAWS\n\n[The JACKDAWS are seen in the park.]\n\nOLD JACKDAW: Come, jackdaws! We must have our breakfast. Come!\n\n[The Vain Jackdaw stops to look at something on the ground.]\n\n(To Vain Jackdaw.)\n\nCome, no one should stop to look at anything! Come!\n\nYOUNG JACKDAW: Just look at him. He takes up feathers!\n\nVAIN JACKDAW (to himself): How fine I would look in these peacock feathers!\n\nANOTHER JACKDAW: See how he sticks the feathers in among his own!\n\nYOUNG JACKDAW: See how he struts about in them!\n\nOLD JACKDAW: My son, take off those feathers!\n\nVAIN JACKDAW: It pleases me to wear them.\n\nOLD JACKDAW: Take them off, I say!\n\nVAIN JACKDAW: I will not take them off!\n\nOLD JACKDAW: Then you cannot stay with us.\n\nVAIN JACKDAW: I do not wish to stay with jackdaws. I will not walk with jackdaws. I will not talk with jackdaws. I think myself too fine for jackdaws.\n\nOLD JACKDAW: Then, jackdaws, we will think no more about him. Come, now, to find our breakfast! Come!\n\nText 2:\nThe Selfish Woman\nBy Augusta Stevenson\n\nTIME: yesterday\nPLACE: the village\n\nCharacters\nWOMAN\nBEGGAR\n\n[The SELFISH WOMAN is taking cakes from her oven. There is a knock at the door.]\n\nWOMAN: Enter!\n\n[The BEGGAR enters. She wears a long cloak.]\n\nBEGGAR: I am hungry, good woman. Will you give me a cake?\n\nWOMAN: The cakes are too large to give away. I will make a cake for you.\n\n[She makes a very small cake and puts it in the oven.]\n\nBEGGAR: I thank you, good woman.\n\n[The woman takes the cake from the oven.]\n\nWOMAN: This cake is too large to give away. I will make another cake for you.\n\n[She makes a very, very small cake and puts it in the oven.]\n\nBEGGAR: I thank you, good woman.\n\n[The woman takes the cake from the oven.]\n\nWOMAN: This cake is too large to give away. I will give you a slice of bread.\n\n[She cuts a slice from a loaf of bread.]\n\nBEGGAR: I thank you—\n\nWOMAN: A slice is too much to give away. Here is a crust for you.\n\n[The beggar shakes her head.]\n\nBEGGAR: May you never taste cake again! May the very cake in your mouth seem to be crust! If you will not give, you shall not have!", "Text1: \nTHE WISE CROW\nBy Augusta Stevenson\n\n\nTIME: last summer\nPLACE: a meadow\n\nCharacters\nTHE CROW\nTHE SPARROW\n\n[The CROW and the SPARROW meet at a spring.]\n\nSPARROW: Ah me, the spring is dry!\n\nCROW: All the springs are dry!\n\nSPARROW: There may be water in the brook.\n\nCROW: No, the brook is dry.\n\nSPARROW: What shall we do?\n\nCROW: There may be water in this pitcher. I will see. Aha! Here is water! Come and drink.\n\nText 2:\nTHE PROUD RING-FINGER\nBy Augusta Stevenson\n\nTIME: this morning\nPLACE: Mary's bedroom\n\nMARY\nMOTHER\nFATHER\nBROTHER\nSISTER\n\n[MARY lies in bed asleep. Her FATHER, MOTHER, BROTHER, and SISTER enter softly. They carry birthday presents for Mary.]\n\nMOTHER: Shh! We must not wake her!\n\nFATHER: I will put the gold pen on the table.\n\nBROTHER: I will lay the apple by the pen.\n\nSISTER: I will place the rose by the apple.\n\nFATHER: How pretty they look!\n\nMOTHER: What shall I do with the ring?\n\nFATHER: Why not put it on her finger?\n\nMOTHER: I will do that. I will put it on her ring-finger. There! See how pretty it looks!\n\nSISTER: How pretty it makes her finger look!\n\nMOTHER: Now come. We must not wake her. Shh! Shh!"]}, {"unit": "Comprehension Skills", "topic": "Describing Characters, Settings, and Events in Stories and Dramas", "lesson": "Analyze how setting contributes to plot", "texts": ["Text 1:\nfrom The Wonderful Wizard of Oz\nby L. Frank Baum\nDorothy lived in the midst of the great Kansas prairies, with Uncle Henry, who was a farmer, and Aunt Em, who was the farmer’s wife. Their house was small, for the lumber to build it had to be carried by wagon many miles. There were four walls, a floor and a roof, which made one room; and this room contained a rusty looking cookstove, a cupboard for the dishes, a table, three or four chairs, and the beds. Uncle Henry and Aunt Em had a big bed in one corner, and Dorothy a little bed in another corner. There was no garret at all, and no cellar—except a small hole dug in the ground, called a cyclone cellar, where the family could go in case one of those great whirlwinds arose, mighty enough to crush any building in its path. It was reached by a trap door in the middle of the floor, from which a ladder led down into the small, dark hole.\nWhen Dorothy stood in the doorway and looked around, she could see nothing but the great gray prairie on every side. Not a tree nor a house broke the broad sweep of flat country that reached to the edge of the sky in all directions. The sun had baked the plowed land into a gray mass, with little cracks running through it. Even the grass was not green, for the sun had burned the tops of the long blades until they were the same gray color to be seen everywhere. Once the house had been painted, but the sun blistered the paint and the rains washed it away, and now the house was as dull and gray as everything else.\n\ntext 2:\nadapted from The Wonderful Wizard of Oz\nby L. Frank Baum\nThis passage takes place after a cyclone comes through Dorothy's home in Kansas and carries her and her house away.\nThe cyclone had set the house down very gently—for a cyclone—in the midst of a country of marvelous beauty. There were lovely patches of green grass all about, with stately trees bearing rich and luscious fruits. Banks of gorgeous flowers were on every hand, and birds with rare and brilliant plumage sang and fluttered in the trees and bushes. A little way off was a small brook, rushing and sparkling along between green banks, and murmuring in a voice very wonderful to a little girl who had lived so long on the dry, gray prairies.", "Text1: \nThe Lost Prince\nby Frances Hodgson Burnett\nThere are many dreary and dingy rows of ugly houses in certain parts of London, but there certainly could not be any row more ugly or dingier than Philibert Place.\nThere were stories that it had once been more attractive, but that had been so long ago that no one remembered the time. It stood back in its gloomy, narrow strips of uncared-for, smoky gardens, whose broken iron railings were supposed to protect it from the surging traffic of a road which was always roaring with the rattle of busses, cabs, drays, and vans, and the passing of people who were shabbily dressed and looked as if they were either going to hard work or coming from it, or hurrying to see if they could find some of it to do to keep themselves from going hungry. The brick fronts of the houses were blackened with smoke, their windows were nearly all dirty and hung with dingy curtains, or had no curtains at all. The strips of ground, which had once been intended to grow flowers in, had been trodden down into bare earth in which even weeds had forgotten to grow.\nThe insides of the houses were as gloomy as the outside. They were all exactly alike. In each a dark entrance passage led to narrow stairs going up to bedrooms, and to narrow steps going down to a basement kitchen. The back bedroom looked out on small, sooty, flagged yards, where thin cats quarreled. The front rooms looked over the noisy road, and through their windows came the roar and rattle of it. It was shabby and cheerless on the brightest days, and on foggy or rainy ones it was the most forlorn place in London.\n\nText 2: \nadapted from Yankee Boys in Japan\nby Henry Harrison Lewis\nIt was early in the afternoon of a July day. A warm sun beaming down with almost tropical strength glinted through the open windows of an office in the foreign settlement of Yokohama, Japan. The room, a large one, furnished with desks and chairs, and the various equipment of such an apartment, contained a single occupant.\nA stranger entering from the teeming street would have noted something amiss in this office. He would have seen that the half-dozen desks, with the exception of that being used by the single occupant, were thickly covered with dust.\nA delicate lace of cobwebs held in its bondage the majority of the chairs. There were others decorating the row of books and pasteboard files upon a number of shelves lining the walls. Over in one corner was an open fireplace, looking grim and rusted, and above a lacquered side table swung a parrot cage, desolate and empty. It was a scene of disuse, and it had its meaning.\nIt was the counting-room of John Manning, \"Importer and Trader,\" as a tarnished gilt sign over the outer door informed the passerby. But the master of it, and of the huge warehouse back on the bay, had gone to his last rest many months before."]}, {"unit": "Comprehension Skills", "topic": "Describing Characters, Settings, and Events in Stories and Dramas", "lesson": "Describe events in stories", "texts": ["The Cleansing Storm\nWritten by Kelly Weaver\n\nChapter 1: Olga’s Problem\n\nOlga flew down the path to her grandmother's house almost blind from the tears in her eyes. She reached the gate, but once inside she tripped and fell down on the steps. The girl screamed when sh
