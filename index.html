let currentGrade = null;
let currentIdx   = null;

// A passage only has a title if its first line actually looks like one. Some
// readings open straight into prose, or with an instruction ("Read the story
// below, taking note of..."), and taking that first line as the title set a
// 700-character paragraph as a heading and left the body empty — the reading
// was displayed entirely as its own title. 90 characters is comfortably above
// every real title in the data and below every one of the 32 offenders.
const TITLE_MAX = 90;
function looksLikeTitle(line) {
  const t = (line || '').trim();
  return !!t && t.length <= TITLE_MAX;
}

// A task instruction the lesson puts above the passage: "Read the passage and
// answer the questions that follow." It is not the story's name, and shown as
// the heading it displaced the real one — 84 of the 85 readings that opened
// this way have their actual title on the very next line ("Old Greek Stories",
// "Tanisha's Shoe"). Both halves are required: the imperative opener, and the
// closing full stop or colon that a title would not carry. That keeps real
// titles such as "Reading's the Worst!" and "Use Your Words" out of it.
const INSTRUCTION_RE = /^(re-?read|read|review|look|listen|choose|select|write|complete|drag|click|use)\b.*[.:]$|^(the following|you have already read|first,? re-?read|first,? read)\b.*[.:]$/i;
// Two copies of the same grade 3 stories carry a leading double quote that has
// no partner -- a paste artifact, not part of the name -- which made them read
// as different stories from their twins elsewhere in the data.
function cleanTitle(line) {
  let t = (line || '').trim();
  if (t.length > 1 && t[0] === '"' && t[t.length - 1] === '"') t = t.slice(1, -1).trim();
  else if (t[0] === '"' && !t.includes('"', 1)) t = t.slice(1).trim();
  return t;
}

function looksLikeInstruction(line) {
  const t = (line || '').trim();
  return !!t && INSTRUCTION_RE.test(t);
}

function parseText(raw) {
  const lines = raw.split('\n');
  let i = 0;
  let textLabel = '', title = '', subtitle = '', author = '', instruction = '';

  // Optional "Text N:" label (for compare-contrast lessons)
  if (lines[i] && /^Text \d+:?\s*$/i.test(lines[i].trim())) {
    textLabel = lines[i++].trim().replace(/:$/, '');
  }

  // A leading task instruction is kept, but as guidance above the passage
  // rather than as its heading.
  const preamble = [];
  while (i < lines.length) {
    while (i < lines.length && !lines[i].trim()) i++;
    if (i < lines.length && looksLikeInstruction(lines[i])) preamble.push(lines[i++].trim());
    else break;
  }
  instruction = preamble.join(' ');

  // Title — only when the line is plausibly one. Otherwise the reading has no
  // title and every line, including this one, is body.
  while (i < lines.length && !lines[i].trim()) i++;
  if (i < lines.length && looksLikeTitle(lines[i])) title = cleanTitle(lines[i++]);

  // Subtitle and author only mean anything UNDER a title. Without one there is
  // no title block, so nothing here is a byline — it is the opening of the
  // passage. Running this regardless is what put a 700-character paragraph in
  // the author slot, in italics, once the title guard stopped it being the
  // heading: the fault moved rather than went away.
  if (title) {
    // Subtitle/series — a non-author line immediately before the author line or a blank line
    if (i < lines.length && lines[i].trim() && !/^(written by|by )\s/i.test(lines[i].trim())) {
      const next = lines[i + 1] || '';
      if (/^(written by|by )\s/i.test(next.trim()) || !next.trim()) {
        subtitle = lines[i++];
      }
    }

    // Author: handles "Written by", "Written By", "By "
    if (i < lines.length && /^(written by|by )\s/i.test(lines[i].trim())) {
      author = lines[i++];
    }

    // Combine subtitle into author display
    if (subtitle) author = subtitle + (author ? ' \u2014 ' + author : '');
  }

  // Skip blank lines before body
  while (i < lines.length && !lines[i].trim()) i++;

  let body = lines.slice(i).join('\n').trim();

  // Several untitled excerpts close with their source instead of opening with
  // it: "\u2014 adapted from Gulliver's Travels by Jonathan Swift". That is a
  // byline, so it is shown as one rather than left to read as a final
  // paragraph of the story.
  if (!author) {
    const bl = body.split('\n');
    const last = (bl[bl.length - 1] || '').trim();
    if (bl.length > 1 && /^[\u2013\u2014-]\s*\S/.test(last) && last.length <= 120) {
      author = last.replace(/^[\u2013\u2014-]\s*/, '').trim();
      body = bl.slice(0, -1).join('\n').trim();
    }
  }

  return { textLabel, title, author, body, instruction };
}

function renderGrades() {
  const bar = document.getElementById('gradeBar');
  bar.innerHTML = '';
  const grades = Object.keys(DATA);
  grades.forEach(g => {
    const hasText = DATA[g].some(l => l.texts.length > 0);
    const btn = document.createElement('button');
    btn.className = 'grade-btn' + (g === currentGrade ? ' active' : '');
    btn.textContent = 'Grade ' + g;
    btn.disabled = !hasText;
    btn.onclick = () => selectGrade(g);
    bar.appendChild(btn);
  });
}

function selectGrade(g) {
  currentGrade = g;
  currentIdx   = null;
  // Choosing a grade means "show me this grade", so a live search is dropped
  // rather than silently ignored while the list keeps showing other grades.
  if (searchQuery.trim()) {
    searchQuery = '';
    const box = document.getElementById('searchInput');
    if (box) box.value = '';
    const clr = document.getElementById('searchClear');
    if (clr) clr.style.display = 'none';
  }
  renderGrades();
  renderList();
  document.getElementById('reader').innerHTML = `
    <div class="reader-empty">
      <svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="#f97316" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity=".4">
        <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
      </svg>
      <p>Pick a story from the list!</p>
    </div>`;
}

// Split a cell that holds more than one reading into separate readings.
//
// The marker is written inconsistently in the source sheet — "Text 1:",
// "Text1:", "Text1 :", "text 2;:", and "Text 2" with no colon at all — and the
// story title sometimes follows on the same line and sometimes on the next.
// Matching only "\n\nText 2:" missed 7 of the 25 dual-text cells, which then
// rendered as one run-on entry. The marker is stripped from the returned text
// so it never leaks into a story title.
// "tex[t]?" because one cell is typed "Tex 1:". The optional t costs nothing
// and "Texas 1" style false positives cannot match — a digit 1 or 2 must follow.
const TEXT_MARKER = /^[ \t]*tex[t]?[ \t]*([12])[ \t]*[;:.]*[ \t]*/gim;

function splitRawTexts(raw) {
  if (!raw) return [];
  const re = new RegExp(TEXT_MARKER.source, 'gim');
  const marks = [];
  let m;
  while ((m = re.exec(raw)) !== null) {
    const after = raw.slice(m.index + m[0].length);
    const nl = after.indexOf('\n');
    const restOfLine = nl < 0 ? after : after.slice(0, nl);
    // Accept the label alone on its line, or punctuated with the title beside
    // it. Anything else is prose that happens to begin "Text 2 …".
    if (restOfLine.trim() === '' || /[;:.]/.test(m[0])) {
      marks.push({ start: m.index, end: m.index + m[0].length, n: m[1] });
    }
    if (re.lastIndex === m.index) re.lastIndex++;
  }
  if (!marks.length) return raw.trim() ? [raw.trim()] : [];

  const preamble = raw.slice(0, marks[0].start).trim();
  const parts = [];
  // Text before the first marker is an instruction belonging to reading 1
  // ("Read the two stories.") — unless the first marker is Text 2, in which
  // case reading 1 simply was not labelled and the preamble *is* that reading.
  const preambleIsOwnReading = preamble && marks[0].n === '2';
  if (preambleIsOwnReading) parts.push(preamble);
  marks.forEach((mk, i) => {
    const end = i + 1 < marks.length ? marks[i + 1].start : raw.length;
    let seg = raw.slice(mk.end, end).trim();
    if (i === 0 && preamble && !preambleIsOwnReading) seg = preamble + '\n\n' + seg;
    if (seg) parts.push(seg);
  });
  return parts.length ? parts : [raw.trim()];
}

// Every reading a lesson holds, flattened: both problem-set cells, each of
// which may itself contain two readings.
function lessonReadings(l) {
  const out = [];
  (l.texts || []).forEach(raw => splitRawTexts(raw).forEach(t => out.push(t)));
  return out;
}

// Extract the main story title from a raw text entry
function getStoryTitle(raw) {
  if (!raw) return '';
  const lines = raw.split('\n');
  // Skip "Text N:" label line if present
  let i = /^Text \d+:?\s*$/i.test(lines[0] ? lines[0].trim() : '') ? 1 : 0;
  while (i < lines.length && !lines[i].trim()) i++;
  // Skip the same leading instruction parseText skips, so the sidebar and the
  // search results name the story rather than repeating the task.
  while (i < lines.length && looksLikeInstruction(lines[i])) {
    i++;
    while (i < lines.length && !lines[i].trim()) i++;
  }
  const titleLine = cleanTitle((lines[i] || '').replace(/^Text \d+:\s*/i, ''));
  // Same rule as parseText: a paragraph is not a title. Returning '' lets the
  // caller fall back to the lesson name rather than putting a wall of prose in
  // the sidebar or a search result.
  return looksLikeTitle(titleLine) ? titleLine : '';
}

// Build flat item list for the sidebar — dual-text lessons become two entries
const AB_LETTERS = 'ABCDEFGH';

function buildItems(grade) {
  const items = [];
  let lessonNum = 0;
  DATA[grade].forEach((l, li) => {
    lessonNum++;
    const readings = lessonReadings(l);
    if (readings.length > 1) {
      // One sidebar entry per reading, so Text 2 sits beside Text 1 rather
      // than being buried inside the same entry.
      readings.forEach((raw, ri) => items.push({
        lesson: l, li, ri, raw, grade,
        ab: 'Lesson ' + AB_LETTERS[ri],
        num: lessonNum + AB_LETTERS[ri],
        storyTitle: getStoryTitle(raw),
      }));
    } else {
      const raw = readings[0] || null;
      items.push({ lesson: l, li, ri: 0, raw, grade, ab: null, num: lessonNum,
        storyTitle: raw ? getStoryTitle(raw) : '' });
    }
  });
  return items;
}

let currentItems = [];
let searchQuery = '';

// buildItems re-splits every cell, so cache per grade: the search runs over all
// six grades on each keystroke and there is no reason to redo that work.
const _itemCache = {};
function itemsFor(grade) {
  if (!_itemCache[grade]) _itemCache[grade] = buildItems(grade);
  return _itemCache[grade];
}

function esc(t) {
  return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// Search spans every grade, not just the one selected. Someone looking for a
// story usually remembers the story, not which grade it sits in — and half the
// readings live under a lesson name that never mentions them.
function searchResults(q) {
  const needle = q.trim().toLowerCase();
  if (!needle) return [];
  const out = [];
  Object.keys(DATA).forEach(g => {
    itemsFor(g).forEach(item => {
      if (!item.raw) return;               // nothing to read, nothing to find
      const hay = [item.storyTitle, item.lesson.lesson, item.lesson.topic, item.raw]
        .filter(Boolean).join(' \n ').toLowerCase();
      if (hay.includes(needle)) out.push({ ...item, grade: g });
    });
  });
  return out;
}

function onSearch(v) {
  searchQuery = v;
  document.getElementById('searchClear').style.display = v.trim() ? '' : 'none';
  currentIdx = null;
  renderList();
}

function clearSearch() {
  const box = document.getElementById('searchInput');
  box.value = '';
  onSearch('');
  box.focus();
}

function renderList() {
  const list = document.getElementById('lessonList');
  list.innerHTML = '';
  const searching = !!searchQuery.trim();
  if (!searching && !currentGrade) return;

  if (searching) {
    currentItems = searchResults(searchQuery);
    const n = currentItems.length;
    const count = document.createElement('div');
    count.className = 'search-count';
    count.textContent = n === 1 ? '1 story found' : `${n} stories found`;
    list.appendChild(count);
    if (!n) {
      const none = document.createElement('div');
      none.className = 'search-none';
      none.textContent = 'No story matches that. Try part of a title, an author, or a few words from the text.';
      list.appendChild(none);
      return;
    }
  } else {
    currentItems = itemsFor(currentGrade);
  }

  let lastTopic = null;
  currentItems.forEach((item, flatIdx) => {
    const l = item.lesson;
    // Topic headings only make sense in grade order; a result list is not
    // grouped that way, so each row carries its own grade badge instead.
    if (!searching && l.topic !== lastTopic) {
      const tl = document.createElement('div');
      tl.className = 'topic-label';
      tl.textContent = l.topic;
      list.appendChild(tl);
      lastTopic = l.topic;
    }
    const el = document.createElement('div');
    const hasText = !!item.raw;
    el.className = 'lesson-item' + (hasText ? '' : ' no-text') + (flatIdx === currentIdx ? ' active' : '') + (item.ab && !searching ? ' sub-item' : '');
    el.innerHTML = searching
      ? `<span class="lesson-num">${esc(item.num)}</span>
         <div style="min-width:0">
           <div class="lesson-title">${esc(item.storyTitle || l.lesson)}</div>
           <div class="lesson-skill">${esc(l.lesson)}</div>
           <span class="result-grade">Grade ${esc(item.grade)}</span>
         </div>`
      : `<span class="lesson-num">${item.num}</span>
         <div style="min-width:0">
           <div class="lesson-title">${l.lesson}</div>
           ${item.ab ? `<span class="ab-tag">${item.ab}</span>` : (!hasText ? '<div class="lesson-skill">coming soon</div>' : '')}
         </div>`;
    if (hasText) el.onclick = () => selectLesson(flatIdx);
    list.appendChild(el);
  });
}

// ── Underlining ─────────────────────────────────────────────────────────
//
// Marks are stored as character offsets into each paragraph's plain text, not
// as wrapped DOM nodes. That is what makes them survive a reload, print
// correctly, and stay correct when two marks overlap — wrapping nodes as the
// reader selects would nest spans and fall apart on the second pass.
let underlineOn = false;
let marks = [];          // {b: block, p: paragraph, s: start, e: end}
let marksKey = '';
let currentParas = [];   // plain text of every paragraph, per block

function markKeyFor(item) {
  return 'rt-ul:' + [item.grade, item.lesson.topic, item.lesson.lesson,
                     item.ab || ''].join('|');
}

function loadMarks(key) {
  try { return JSON.parse(localStorage.getItem(key)) || []; } catch (e) { return []; }
}

function saveMarks() {
  try { localStorage.setItem(marksKey, JSON.stringify(marks)); } catch (e) { /* cheio ou bloqueado */ }
}

// Overlapping marks become one, so re-underlining a phrase cannot stack spans.
function mergedFor(b, p) {
  const r = marks.filter(m => m.b === b && m.p === p)
                 .map(m => [m.s, m.e]).sort((x, y) => x[0] - y[0]);
  const out = [];
  for (const [s, e] of r) {
    if (out.length && s <= out[out.length - 1][1]) {
      out[out.length - 1][1] = Math.max(out[out.length - 1][1], e);
    } else out.push([s, e]);
  }
  return out;
}

function paraHTML(text, ranges) {
  let out = '', pos = 0;
  for (const [s, e] of ranges) {
    out += esc(text.slice(pos, s));
    out += '<span class="ul">' + esc(text.slice(s, e)) + '</span>';
    pos = e;
  }
  return out + esc(text.slice(pos));
}

function paintMarks() {
  document.querySelectorAll('.text-body').forEach((body, b) => {
    const paras = currentParas[b] || [];
    body.innerHTML = paras.map((t, i) =>
      '<p data-b="' + b + '" data-p="' + i + '">' + paraHTML(t, mergedFor(b, i)) + '</p>'
    ).join('');
  });
}

// Character offset of a point inside a paragraph, counting only text.
function offsetIn(para, node, offset) {
  const walker = document.createTreeWalker(para, NodeFilter.SHOW_TEXT);
  let n = 0, cur;
  while ((cur = walker.nextNode())) {
    if (cur === node) return n + offset;
    n += cur.nodeValue.length;
  }
  return n;
}

function toggleUnderline() {
  underlineOn = !underlineOn;
  document.getElementById('reader').classList.toggle('marking', underlineOn);
  const b = document.getElementById('ulBtn');
  if (b) b.classList.toggle('on', underlineOn);
  const h = document.getElementById('ulHint');
  if (h) h.style.display = underlineOn ? '' : 'none';
}

function eraseMarks() {
  if (!marks.length) return;
  marks = [];
  saveMarks();
  paintMarks();
}

// Selecting while underlining turns the selection into marks, one per
// paragraph it touches, so a selection spanning three paragraphs underlines
// all three and nothing in between.
function onReaderMouseUp() {
  if (!underlineOn) return;
  const sel = window.getSelection();
  if (!sel || sel.isCollapsed || !sel.rangeCount) return;
  const range = sel.getRangeAt(0);
  let added = false;
  document.querySelectorAll('.text-body p[data-p]').forEach(para => {
    if (!range.intersectsNode(para)) return;
    const txt = para.textContent;
    let s = 0, e = txt.length;
    if (para.contains(range.startContainer)) s = offsetIn(para, range.startContainer, range.startOffset);
    if (para.contains(range.endContainer)) e = offsetIn(para, range.endContainer, range.endOffset);
    if (e > s) {
      marks.push({ b: +para.dataset.b, p: +para.dataset.p, s: s, e: e });
      added = true;
    }
  });
  if (added) { sel.removeAllRanges(); saveMarks(); paintMarks(); }
}

// Clicking an underline removes it — no separate eraser mode to get stuck in.
function onReaderClick(ev) {
  if (!underlineOn || !ev.target.closest) return;
  const span = ev.target.closest('.ul');
  if (!span) return;
  const para = span.closest('p[data-p]');
  if (!para) return;
  const b = +para.dataset.b, pi = +para.dataset.p;
  const start = offsetIn(para, span.firstChild, 0);
  const end = start + span.textContent.length;
  marks = marks.filter(m => !(m.b === b && m.p === pi && m.s < end && m.e > start));
  saveMarks();
  paintMarks();
}

function renderTextBlock(raw, blockLabel) {
  const { title, author, body, instruction } = parseText(raw);
  return `
    <div class="text-section">
      <div class="text-label">${blockLabel}</div>
      ${instruction ? `<div class="text-instruction">${esc(instruction)}</div>` : ''}
      ${title ? `<div class="text-title">${title}</div>` : ''}
      ${author ? `<div class="text-author">${author}</div>` : ''}
      <div class="text-body">${(() => {
        const paras = body.split('\n').map(l => l.trim()).filter(Boolean);
        currentParas.push(paras);
        const b = currentParas.length - 1;
        return paras.map((t, i) => `<p data-b="${b}" data-p="${i}">${esc(t)}</p>`).join('');
      })()}</div>
    </div>`;
}

function selectLesson(flatIdx) {
  currentIdx = flatIdx;
  renderList();
  const item = currentItems[flatIdx];
  const { lesson: l, ab, raw } = item;
  const reader = document.getElementById('reader');

  const hasText = !!raw;
  let html = `
    <div class="lesson-header">
      <div class="lesson-header-main">
        <div class="topic-tag">${l.topic}</div>
        <h2>${l.lesson}</h2>
        ${ab ? `<div class="ab-header-tag">${ab}</div>` : ''}
      </div>
      ${hasText ? `<button class="tool-btn" id="ulBtn" onclick="toggleUnderline()"
        title="Underline as you read">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 3v7a6 6 0 0 0 12 0V3"/><line x1="4" y1="21" x2="20" y2="21"/>
        </svg>Underline</button>
      <button class="tool-btn" onclick="eraseMarks()" title="Remove every underline">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 21h18"/><path d="M15.5 4.5l4 4L9 19H5v-4z"/>
        </svg>Erase</button>
      <button class="print-btn" onclick="printLesson()" title="Print this story">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 6 2 18 2 18 9"/>
          <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
          <rect x="6" y="14" width="12" height="8"/>
        </svg>Print</button>` : ''}
    </div>`;

  if (!hasText) {
    html += `<p class="no-text-msg">No reading text available for this lesson yet.</p>`;
  } else {
    html += `<div class="mark-hint" id="ulHint"${underlineOn ? '' : ' style="display:none"'}>` +
            'Select any words to underline them. Tap an underline to take it away. ' +
            'Your marks are saved on this computer.</div>';
    currentParas = [];
    marksKey = markKeyFor(item);
    marks = loadMarks(marksKey);
    html += renderTextBlock(raw, ab ? ab : 'Reading');
  }

  reader.innerHTML = html;
  reader.classList.toggle('marking', underlineOn);
  const ulb = document.getElementById('ulBtn');
  if (ulb) ulb.classList.toggle('on', underlineOn);
  if (hasText) paintMarks();
  reader.scrollTop = 0;
}

// Print the open story. The document title becomes the story name first, because
// that is what the browser stamps in the page header and offers as the filename
// when the teacher chooses "Save as PDF" — "Reading Lessons" for every story is
// useless once a few are saved in a folder.
function printLesson() {
  const item = currentItems[currentIdx];
  if (!item) { window.print(); return; }
  const original = document.title;
  const name = item.storyTitle || item.lesson.lesson || 'Reading';
  document.title = item.ab ? `${name} (${item.ab})` : name;
  const restore = () => { document.title = original; };
  window.addEventListener('afterprint', restore, { once: true });
  // Safari does not always fire afterprint; restore on a timer as well.
  setTimeout(restore, 8000);
  window.print();
}

function toggleSidebar() {
  const sidebar = document.getElementById('sidebar');
  const toggleBtn = document.getElementById('toggleBtn');
  const collapsed = sidebar.classList.toggle('collapsed');
  toggleBtn.innerHTML = collapsed ? '&#x2192;' : '&#x2190;';
  toggleBtn.title = collapsed ? 'Show lessons' : 'Hide lessons';
}

const _reader = document.getElementById('reader');
_reader.addEventListener('mouseup', onReaderMouseUp);
_reader.addEventListener('touchend', onReaderMouseUp);
_reader.addEventListener('click', onReaderClick);

// Init — default to grade 3
renderGrades();
selectGrade('3');
</script>
