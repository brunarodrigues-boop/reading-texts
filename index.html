 biking. There is also a lot of different wildlife. They have to watch out for mountain lions and coyotes while playing!\nUnlike in cities, there is not a lot of light and noise in the country. At night, it is very dark, and you can see thousands of stars. Imagine lying in an open field and looking up at the beautiful night sky. It is also very quiet. There are no cars whizzing by or horns honking. Sometimes you can even hear owls hooting or wolves howling!\nWould you ever like to live in the country?", "What is a Snail?\nWritten by Joy Kita\n\nSnails are from the animal group called mollusks. They often get confused with slugs. Snails are not slugs. They have a hard shell, and slugs do not.\nThere are many snails in the world. Each snail can lay over 100 eggs at a time. They can also lay eggs as often as once a month. That means a snail can have over 1,000 babies in one year! That is very different than humans. They usually have one baby at a time.\nSnails are very good at surviving. They use their shells to blend into their surroundings. This helps keep them safe from predators. Snails can also change their diet to what is available in an area. This trait allows them to survive almost anywhere. They are remarkable creatures!\nSnails use slime to help them get around. They leave a trail of the slime behind them when they move. Snails can get around rocks and across dirt easily because of their slime. The slime is sticky. This makes it possible for the snail to climb anything. They can even hang upside down. I bet they would be good on the monkey bars!\nSnails eat lots of different things. They enjoy plants and fruit. They will even eat dirt if they have to. Snails need calcium to keep their shell strong, just like you and I need calcium to keep our bones strong. We get calcium through things like milk. They get it through plants, and even egg shells.\nEven though they are good at surviving, snails have many predators. Beetles and leeches eat snails. Caterpillars and frogs also eat snails. Sometimes, even people eat snails! Would you eat a snail?"]}, {"unit": "Comprehension Skills", "topic": "Comparing and Contrasting Main Ideas and Supporting Details", "lesson": "Compare and contrast main ideas", "texts": ["Text 1:\nThe Storyteller\nWritten by Elizabeth Baker\n\nFairy tales come from many different sources. Some are stories that have been told orally for hundreds of years. Other stories come from a writer's imagination. Hans Christian Andersen was one such storyteller. He wrote some of the most beloved fairy tales of all time.\nAs a child, Andersen went to a special school. He was there to learn a trade, or a skilled job, but that did not stop him from beginning to write stories. Even when he was young, he loved writing stories for people of all ages. He wanted to be a famous author.\nAnderson wrote many stories that people sill read today. Some of Andersen's best works include \"The Little Mermaid,\" \"The Princess and the Pea,\" and \"The Ugly Duckling.\" Many of these fairy tales can be read as magical adventures. Yet they had a basis in reality—they were often inspired by stories from his own life.\nLike the Ugly Duckling, Andersen was born into a humble life. By the time he died in 1875, he was celebrated throughout the world as a great storyteller. Even the king of Denmark loved his tales. He paid Andersen to write stories for the rest of his life.\nHe traveled the world and wrote about the interesting people he met along the way. In the end, Andersen will be remembered in the same way as his fairy tales—he will be cherished forever.\n\nText 2: The King of Fairy Tales\nWritten by Daniel Roberts\n\nHave you ever heard of Hans Christian Anderson? Even if you haven’t heard of this name, I bet you know some of his work. Anderson was a famous author and storyteller. No collection of fairy tales would be complete without his stories!\nAs a child, Anderson and his family lived a fairy tale-like life. Anderson lived with his family in a one-room house. His father worked as a shoemaker, and his mother was a washerwoman. They had little money for books or lessons.\nWhen Anderson was 14, he moved to the capital city of Denmark, Copenhagen. He wanted to become an actor, but he had little success. Instead, he went to college at Copenhagen University. After his schooling, Anderson traveled around the world writing poems, books, and plays.\nAt age 30, Anderson began writing fairy tales. He put many pieces of his own life into his stories. He wrote “The Ugly Duckling” based on his own life. In this story, he points out that the very things that make you different and lonely can also make you special. He wrote “Little Match Girl” because of his mother’s experiences begging on the streets early in her life. Each fairy tale he wrote holds special meaning.\nThe next time you read “The Princess and the Pea” or watch “The Little Mermaid,” think about Hans Christian Anderson, the man that made these fairy tales come to life.", "Text 1: Neon Rainbow\nWritten by Eric Hwang\n\nAs night falls, the city skyline becomes a neon rainbow. It is like stepping into a movie. The future lives in Shanghai.\nTwenty-three million people call Shanghai home, making it the largest city in China and in the world. Although the city has been around for over a hundred years, most of the skyscrapers and dazzling lights were built in the last twenty years.\nIn any other country, this would be extraordinary. However, this happens all over China. Over a billion people live in China. That's the most people living in one country in the entire world.\nThe people in Shanghai have many different types of jobs. Some people work in factories making cars, computers, and cell phones. Some people work as teachers or sales people. Other people even make steel products and build ships! Each and every day, the residents of Shanghai work hard to make a living, just like people in the United States.\nWhile the world marvels at Shanghai and China, the city’s beauty and wealth have cost China a lot. Look at the sky during the day. You see no bright lights; in fact, you don’t see much of anything. A blanket of smoky air, called smog, covers the city.\nSmog is a dangerous form of pollution. It's not just ugly—smog kills. In 2010, 1.2 million people died in China because of pollution. Many of those deaths were caused by people breathing smog. Even scarier, pollution has become the number one killer in the world.\nFactories and trade have created jobs for millions of poor people. So while many people want an end to pollution, they do not want to return to a poor life. The future Shanghai promises is quickly becoming real all over the world. We have a choice. Will our neon rainbow come from a cloud of smog?\n\nText 2:\nBig City, Endless Possibilities\nWritten by Jenn Lamping\n\nHave you ever heard of the city of Shanghai? It is not in the United States. It is far across the world in the country of China.\nTwenty-three million people live in Shanghai. That is more than the entire state of New York! It is the largest city in China and in the entire world. Over the past few years, many skyscrapers, structures, and mesmerizing lights have been built in Shanghai. The city has been growing very quickly, leading to endless possibilities for the residents.\nSince Shanghai is so large, people always have something to do! There are many parks where people can get away from the bustle of the city to exercise, read a book, or simply relax. People also enjoy visiting museums and theaters, as the city is rich with culture. There are even professional sports teams to watch, including soccer and basketball.\nShanghai’s size and growth do not, however, come without a cost. If you look at the sky during the daytime, you will have a hard time seeing much of anything. The air is thick with a blanket of smog.\nSmog is a type of pollution with many different causes. Factories in the city have created many jobs, but they pollute the air with smoke and soot. The large number of people using cars and electricity also contribute the dangerous pollution.\nThere are benefits and drawbacks to living in a massive city such as Shanghai. Would you like to live in a big city?"]}, {"unit": "Comprehension Skills", "topic": "Comparing and Contrasting Main Ideas and Supporting Details", "lesson": "Compare and contrast supporting details", "texts": ["Text 1:\nNaturally Sweet: Maple Syrup\nWritten by Elizabeth Baker\n\nMaple syrup is something that many people love. We pour it on pancakes. We drizzle it on French toast. We shower our waffles in it. We eat maple flavored candy, too.\nBut what is maple syrup? Where does it come from?\nMaple syrup comes from the sugar maple tree. A sugar maple tree must be healthy. It must be at least ten inches around in thickness.\nIt is made only during a few weeks in early spring. When the weather warms up and the snow begins to melt, the farmer knows it is time for sap. Sap flows when the days are warm but the nights are cold.\nThe sugar maple tree is tapped to collect the sap. A small tree can hold one tap. A very large maple tree can have three or four taps at one time. During the maple season, each tap will produce about ten gallons of sap.\nThe sap gets boiled. When the sap is boiled down, it turns into maple syrup. It takes about 40 gallons of sap to make one gallon of maple syrup!\nThe pioneers tapped maple trees as a source of sugar. Maple syrup and maple sugar were used to sweeten food. White sugar was hard to find, and it was expensive. Today we use maple syrup in many of the same ways the pioneers did. Our pancakes are definitely better off thanks to maple syrup!\n\nText 2:\nSuper Sticky, Very Sweet\nWritten by Geoffry King\n\nYou it eat it at breakfast time. It is super sticky and very sweet. What is it? Maple syrup!\nThe weather has to be just right in order for the magic of maple syrup to take place. In fact, it is only possible to produce this delicious sweet treat in the northern part of North America! In the United States, Vermont, New York, and Maine produce the most maple syrup.\nMaple syrup comes from a certain type of tree called a sugar maple. It is made by tapping the tree, which means putting a tube in the tree in order to get out a substance called sap. Sap actually looks a lot like water. In fact, it tastes a lot like water too, with just a touch of sweetness.\nMaking maple syrup is a long process. It takes around five and a half days to collect forty gallons of sap—and that is only enough to make one gallon of maple syrup! After the sap is collected, it is boiled down, filtered, and packed. Then, it is ready to be shipped to the store.", "Text 1:\nHomelessness in the United States\nWritten by Alison Zeller\n\nMany people in the United States are homeless. They don't have a permanent place to live. Every night, there are more than 630,000 people with nowhere to go.\nSome homeless people have to sleep on the sidewalk. Sometimes, they will find shelter under a bridge. They might be able to stay at a friend's house.\nMany cities also have special homeless shelters. These shelters are like temporary apartments. They give homeless people a safe and comfortable place to sleep for a few nights. The shelter may also help them find food or get a job. Only some homeless people stay in homeless shelters. Unfortunately, there is not enough room for everybody.\nPeople are homeless for many reasons. Some homeless people have lost their jobs. They may not have enough money to pay their rent. They may be trying to escape abuse at home. Sometimes, homeless people have a disability that makes it hard to stay in a house. If they are addicted to drugs or alcohol, they may be too sick to keep paying the rent.\nSome people are homeless for a long time. However, some people are only homeless for a night or two. They are able to get help and find a place to live.\nIf you would like to help the homeless, there are a few things you can do. You could donate food, clothing, or money to a homeless shelter. You could donate toys or books for homeless children. You could also volunteer to help at a shelter.\n\nText 2:\nLife on the Streets\nWritten by Lily Grant\n\nDo you know what it means to be homeless? It means that you don’t have a permanent place to live. Each and every night, men, women, and children throughout the United States do not have a place to call home.\nPeople who are homeless sleep in different places. Sometimes, they sleep on the sidewalk. Other times, they sleep in a park, a public space, or even under a bridge. Occasionally, a homeless person might be able to find a friend’s house to stay at.\nSome cities and towns also have homeless shelters. A homeless shelter is a building where homeless people can come for shelter, food, and other help. Unfortunately, not everyone can stay in a homeless shelter because there is not enough food or space for everyone.\nMany people that help out at shelters are volunteers. Volunteers are people who work without getting paid. If you want to help out people who are homeless, you can volunteer to serve food or clean at your local shelter. You can help out people who are homeless in other ways, too. You can donate food, clothing, or money. You can also donate toys to children who cannot afford them.\nKeep in mind that people become homeless for many reasons. A person might lose their job and be unable to pay rent. They might also have an injury or illness that makes them too sick to work. The next time you see someone that lives on the street, think about what their life might be like and what you can do to help!"]}, {"unit": "Comprehension Skills", "topic": "Comparing and Contrasting Main Ideas and Supporting Details", "lesson": "Compare and contrast texts using a Venn diagram", "texts": ["Text 1: The Ancient Super Food\nWritten by Elizabeth Baker\n\nQuinoa is an ancient crop. It may seem to be a new food as it is now popular in modern recipes. However, quinoa has been farmed and eaten by humans for nearly 5,000 years. The Incas called quinoa the \"mother of all grains.\"\nQuinoa is often used like grains. It can be ground into flour. Technically, quinoa is not a grain. It is a seed. It is from a leafy plant that is related to beets and spinach.\nQuinoa is very good for you! It is rich in vitamins and minerals. Quinoa is a very good source of fiber and is easily digested.\nQuinoa grows best in old soil, dry air, and high altitudes. It is native to the Andes mountains, though it grows well almost anywhere in South America.\nQuinoa has a unique texture. The seeds are smooth and creamy. The tail of the seed is crunchy. Together, you have a smooth and crunchy meal that is good for you! It is truly the breakfast, lunch, or dinner of champions!\n\nText 2:\nHealthy Quinoa\nWritten by Molly Anderson\n\nQuinoa (pronounced “KEEN-WHAH”) is a type of food. It has been around a very long time, although it recently became popular in the United States. It is known as “the gold of the Incas” because of its nutritional value.\nAlthough it is often used as a grain, like brown rice, it is actually a seed! It comes from a leafy plant. Quinoa is very healthy. It is a great source of protein, which we need in order to have energy. It also has important vitamins and minerals.\nNot only is quinoa good for you, many people also consider it to be very delicious. It has a delicate, nutty taste. It also soaks up the flavor of any sauce or spices that you add to it.\nA quinoa seed is flat. It has a pointed oval shape. The seeds can be found in several different colors. You may see quinoa seeds that are colored yellow, red, brown, or black.\nThe next time you are at the grocery store, ask your parents if you can pick up some healthy, tasty quinoa!", "Text 1:\nThe Escape Artists\nWritten by Krista Garver\n\nHamsters are unique creatures. They are small rodents, like rats and mice. They live in the wild in Asia, Europe, and Africa. Since they are cute and rarely bite, they are also popular pets.\nWhen hamsters are born, they are very tiny. There are usually five to ten hamsters in each litter. Baby hamsters are called pups. Even grown hamsters are pretty small. They only reach five or six inches long and weigh about four ounces. That is about as much as a small apple weighs. Their lifespan is about two and a half to three years.\nLike other rodents, hamsters are nocturnal. They sleep during the day and are awake at night. When they are awake, boy, are they active! Hamsters can run up to six miles in a single night! How's that for exercise?\nIn the wild, hamsters eat mostly greens, seeds, and fruits. Sometimes they eat insects. They hoard their food. They have special pouches in their cheeks that go all the way to their shoulders. They pack these pouches full of food and carry it back to their burrow to store or share. Like all rodents, their teeth grow constantly. To prevent their teeth from getting too long, hamsters chew on wood and other surfaces.\nThese furry creatures are also excellent escape artists. They can run very fast and fit into tiny holes. If you have a pet hamster, keep a good eye on it!\n\nText 2:\nAll About Hamsters\nWritten by Lily Grant\n\nHamsters are very interesting creatures! They are a type of animal called rodents. They can live out in the wild, or be kept as pets.\nAll hamsters are born naked. This means that they have no fur when they are first born. They also are blind and have no teeth when they are newborns. Hamsters do, however, grow very quickly! By the time they are only three weeks old they resemble, or look like, miniature adults.\nWild hamsters are omnivores. This means that they eat plants and meat. They most often eat fruits, vegetables, seeds, and nuts. Sometimes, they go hunting to find insects to eat. Pet hamsters eat similar foods. Their owners often give them fruits, vegetables, or special food from the pet store!\nLike all rodents, hamsters’ teeth are constantly growing. To prevent them from getting too long, hamsters chew on wood and other hard objects.\nHamsters also have very poor eyesight. They are colorblind and can only see about six inches in front of them. To avoid predators in the wild, they burrow underground in the daylight. Some hamster burrows are as deep as six feet.\nHamsters normally live alone. These usually gentle creatures can become very territorial. They will bite other hamsters that come into their territory.\nAs you can see, hamsters are very unique animals. Would you want a pet hamster?"]}, {"unit": "Comprehension Skills", "topic": "Characters, Setting, and Plot", "lesson": "Describe characters based on their traits and feelings", "texts": ["Reading’s the Worst!\nWritten by: Jessica Tyner\n\nChapter 1: Mikala’s Big Decision\n\n“I’ve made a decision,” Mikala said, dropping her backpack onto the floor. “I’m never going to read again.”\nHer sister rolled her eyes. “Yeah, right,” she said. “You have to read. It’s part of getting an education.”\n“I don’t care. I totally despise reading!” responded Mikala.\nIt was true. Mikala had never cared for books, not even the ones about wizards or princesses. Tales of faraway dynasties did nothing for her, and not even the promise of an adventure made her want to pick up a book.\nOnce, her sister had given her a book of gruesome ghost stories, and even that didn’t work!\n“You just wait and see,” her sister warned her. “I’ll bet that you’ll be reading first thing in class tomorrow!” She was three years older than Mikala and in the seventh grade, so she thought she was so grown up and knew everything.\n“You wait and see,” Mikala retorted.\n\nChapter 2: The Classroom Showdown\n\nHer sister was almost right, but Mikala was just as stubborn as her sister was obnoxious.\n“Okay, class,” her teacher, Mrs. Thornton, said the next day, “let’s open our history books to page ninety-seven.”\nMikala sat at her desk, hands clasped together firmly, while her book remained tucked away in her backpack.\n“Page ninety-seven,” Mrs. Thornton repeated gently. “Mikala.”\n“I’m sorry, ma’am,” Mikala said, “but I’m afraid I’ve given up books.”\n“You’ve what?” Mrs. Thornton asked with a look of astonishment.\n“I suspect that I’m allergic to books, and I don’t want to break out in hives,” Mikala offered.\nThe class laughed loudly, but they knew that Mikala was in serious trouble.\n“You have two options,” Mrs. Thornton said, with a small smile. “Open your book and participate, or I am afraid something will have to be done. Reading is very important.”\n“I’d much prefer to do something, really anything, than touch a book,” Mikala replied.\nMrs. Thornton sighed. “Class, read the first two paragraphs independently,” Mrs. Thornton said calmly. “Mikala and I need to have a discussion.”\nMikala had never been in trouble at school before. She’d never even had a warning. Butterflies started dancing the rumba in her stomach.\n“What’s the problem, Mikala?” Mrs. Thornton asked as they sat down on the bench in the hallway. “You’ve never had an issue participating.”\n“I just don’t like to read anymore,” she said, kicking her toe against the linoleum floor.\n“Did something happen? Are you upset about something?” Mrs. Thornton asked kindly.\n“I just hate reading!” Mikala yelled loudly.\n“Well, we can’t only do the things that we like,” Mrs. Thornton said. “A lot of people don’t like flossing their teeth, waking up early, or eating broccoli, but these things are important. It’s also important to practice your reading.”\n“I doubt it,” Mikala replied with a scowl.\n\nChapter 3: Trouble Heats Up\n\nMikala found out what the principal’s office looked like very quickly. It was smaller than she expected, and the principal’s desk was drowning in a sea of papers. She would have been grounded if her room was ever that cluttered.\nA bookshelf in the corner was literally overflowing with books.\nThe principal didn’t smile or talk to her in a friendly voice like Mrs. Thornton had.\n“Read this,” he said gruffly, dropping a book in front of her with a bang.\nIt was a little kid’s book, probably from the Kindergarten class. She recognized the picture on the front and hoped that she could remember the story.\nMikala began to recite from memory, “Once, there was a happy chick,” she began. “The chick was peppy because...” She hesitated for a moment and then she couldn’t remember the rest. Tears began to sting her eyes, but she wasn’t going to let them fall.\n“Mikala,” the principal said, leaning over her, “are you actually reading, or are you guessing?”\nShe was about to get caught.\n“Well?” the principal asked sternly.\n“I’m trying to remember the words,” she muttered, looking down at her feet.\n“What’s this word?” the principal demanded, pointing at a blur.\nThis word’s letters moved around less than the others. She figured that there was only one possible option. “That word is, the,’” she said.\n“And what is this word?” he asked, holding his finger over another one.\nThis one was tougher, but it was either miles or slime. “That word is, ‘slime,’” she guessed, hoping for an easy victory.\n“Actually that word is ‘miles,’” he said. “We seem to have a problem.”\n\nChapter 4: The Secret’s Out\n\nShe was busted, and her sister was completely right.\n“It’s not that you can’t read, Mikala, you can,” he began.\nShe was confused. Didn’t I just get that super simple word wrong? she thought. “How can I read if I get simple words wrong?”\n“Do the letters move when you look at them?” he asked. Was he asking a trick question?\n“Sometimes the words move,” she admitted, her face turning red.\n“Do certain letters look the same, even when people tell you they’re different?” he continued. “Maybe some of the words look like they are upside down?” he asked.\n“Every once in a while the words are upside down,” Mikala said.\n“Mikala, I’m not a doctor, but I think you could have dyslexia,” he said, putting a hand on her shoulder.\n“What kind of weird disease is that?” she said. She was close to crying again. “Am I dying?”\nHe laughed, and his guffaw echoed like thunder. “No, you’re perfectly fine,” he said. “That term just means you don’t see letters and words the way other people do.”\n“So,” she started carefully, “I’m not stupid?”\n“Not at all, and actually, you’re very intelligent,” he said.“If you have dyslexia, we’ll help you learn in special ways.\"\n“Do I still have to read?” she asked.\n“You’ll still have to read.” He said, “but Mrs. Thornton, your parents, and I will work together to make learning easier and even more enjoyable for you.”\n\n“Well?” her sister asked when she got home from school.\nMikala grinned at her sister. She knew she had been defeated.\n“I told you so!” said her sister with a wink.", "No More Lies\nWritten by: Courtney Courtnage\n\nChapter 1: Bored\n\n“Oh man! This is so boring!” said Billy to himself. He was lying on the bed staring at his ceiling, and he desperately wanted some excitement. He rolled off the bed and wandered into his little sister Crystal’s room. Billy watched Crystal playing with her toy bear and he got an idea.\n“Hey, Crystal, did you hear about the raccoon that is on the loose?” he asked her.\n“I don’t like raccoons. They are scary,” said Crystal.\n“This one is extra terrifying. It’s so scary that we all have to stay inside,” said Billy. “Be sure all the doors and windows are latched—we wouldn’t want it in the house!”\n“Okay, Billy,” said Crystal. She seemed unaffected by his warning and went back to playing with her bear.\n\nBilly rummaged and rooted until he found an old scarf that looked like a tail, and then he waited. Crystal left her room and Billy positioned the scarf so it peeked out from under Crystal’s bed.\n\nCrystal came back to her room and played quietly.\nThen Billy started to yell, “It’s in the house. Run for your lives.” He then pulled Crystal’s door closed. “It’s in your room and I can’t get the door open!”\n“Look under your bed!” he yelled, trying hard not to laugh.\nHe could hear his sister crying as she pounded on the door.\nWhen he finally let it open, Crystal fled. She ran right out into the yard and told their mother what had happened.\n\n“I didn’t do it!” said Billy to his mom.\n“You shouldn’t tell lies Billy. If you tell lies, people will stop believing what you have to say. So even when you tell the truth, no one will believe you.”\n“I am telling the truth,” said Billy.\n\nBilly hopped on his bike and coasted around for a bit. “Borrrrring,” he sang aloud. As Billy was putting his bike back in the garage, he accidentally made a huge scrape on the side of his dad’s car.\n\nJust then, Billy heard his dad call out, “I’m going to the store to get some grapefruit juice.” Billy heard the jingle of car keys and started to panic. He knew he would be in big trouble for scratching the car. He ran up to his room and pretended to read a book.\n“BILLY!” screamed his dad.\n“I’m in my room reading,” Billy called back.\n\nDad came into the room and asked, “Billy, did you scratch my car?”\n“No, Dad, I swear it wasn’t me,” Billy said.\n“The paint that was left on the car is the same color as your bike,” said Dad. “You shouldn’t lie, Billy. If you ever do tell the truth, no one is going to believe you.”\n\nChapter 2: Snicker\n\nDad left with heavy footsteps and Billy just sat there. Suddenly, outside his window a spinning disc covered in colorful lights appeared. Billy opened his window to get a better look. The disc flew in and landed on his desk. As it landed, Billy realized it wasn’t just a disc, it was a spaceship. Billy saw a little green creature walk out of the ship.\n\n“Hi, my name is Snicker,” said the creature. “I traveled here from Jupiter to find some excitement.”\nBilly ran and hid in his closet. Snicker giggled, then tore up Billy’s homework, and threw the paper all over Billy’s bedroom.\n\nBilly watched as Snicker flew his ship around the room. The ship hit the walls and knocked over the lamp. Then it whizzed out of his bedroom. The little saucer zipped all over Billy’s house and created a giant mess. Finally, Snicker stopped and got out of the ship.\n\n“Why did you do that?” cried Billy.\n“Why not?” said Snicker with a shrug. “That was awesome.”\n“Look at the mess you made!” yelled Billy.\n“No look at the mess YOU made,” Snicker replied with a laugh.\n“I didn’t do this. Don’t lie!” Billy yelled even louder.\n“I’m not lying,” retorted Snicker.\n“If you lie, no one will ever believe you,” Billy said. “Whoa, I sound just like my parents.”\n\nChapter 3: Trouble\n\nSnicker got into his ship and soared off. When his mom came through the door, Billy froze.\n“I know how this looks!” said Billy.\n“YOU ARE GROUNDED!” his mom screamed.\n“I really didn’t—” Billy started.\n\n“Billy, I have had enough,” his mom said. “You need to stop lying.”\nBilly told his mom the truth about Crystal and about Dad’s car. “But I didn’t make this mess,” he finished.\nBilly spent the rest of the day cleaning up. He hung up every picture and he even wiped the scuff marks off the walls, but Billy could not fix his homework and had no time to redo it.\n\nChapter 4: School\n\nThe next day the teacher asked, “Billy, where is your homework?”\nBilly told his teacher the story about Snicker.\n“Really? Last week you said your homework was taken by goblins and before that you were sparring with ninjas for it. If you keep lying, no one will believe you when you are being truthful,” said his frustrated teacher.\n\nBilly sat in detention during his entire lunch hour. The window was ajar and in flew Snicker’s flying saucer.\n“You got me in trouble!” shrieked Billy. “Get out of here!”\n\nSnicker sat down and crossed his legs. “They got mad at me back home, too,” he said. “I did things I knew were bad. Then I lied about them, so I would not get in trouble.”\n\n“Is that why you are here?” Billy asked softly.\n“I had to leave to find my dad. When I told the others that my dad had run out of gas in his ship, nobody believed me. Now I’m on my own because the others think my dad is okay,” Snicker said, holding back tears.\n\n“That’s a sad story,” Billy said. “I hope you find your dad.”\n“I’m sorry for causing trouble,” replied Snicker. Then he got in his ship and left for good\n\nAt home that night, Billy hugged his mom and dad. “I promise to never lie again!” he said to them."]}, {"unit": "Comprehension Skills", "topic": "Characters, Setting, and Plot", "lesson": "Explain relationships among major and minor characters", "texts": ["An Extra-Curricular Conclusion\n\n\"Wow, Orson, I don't think we will ever find that ball again.\"\n\"Way to go, Phillips! Who knew you could hit like that?\"\n\"Orson, you have got to join the baseball team!\"\nOrson Phillips stood awkwardly on home plate, letting the bat he had just swung drop to his side. He trudged along the bases as the P.E. teacher, Mrs. Glass, cheered him on. When he finally made it back around, he was swarmed by his classmates.\n\"Who taught you to hit like that?\" Barry Simpson asked.\n\"My grandpa. He played baseball in college,\" Orson said.\n\"So why aren't you on the team already?\" Mike DeShaw demanded.\nOrson shrugged. \"I just don't really like playing baseball,\" he said.\n\"But you're so good!\" Kenny Banks gushed.\nOrson took a drink of water to avoid the conversation. It was true that Orson was a good hitter. His grandpa had taught him how to swing a bat when he was four years old. Orson had even played Little League for a year or two when he was younger. Still, he had never found much joy in the game.\n\"They're right, you know,\" Mrs. Glass, who had just walked over, said. \"You'd be a great addition to our school team. Plus, who doesn't love doing the things they're best at?\"\nLuckily for Orson, the bell rang at that moment, saving him from being pestered any further. As he walked back into school, he thought about what Mrs. Glass had said. It was true that there were some things that Orson enjoyed doing that he was good at, like reading chapter books and drawing. But he also enjoyed being challenged, like in his computer programming class. He couldn't even count the number of times his code had been incomplete or he had gotten worse grades than his neighbor. In fact, one of his failed websites was an ongoing joke in class. However, that just made him want to try harder.\nA week later, Kenny Banks found Orson in the hallway and waved a flyer in his face. \"Baseball tryouts start next week!\" Kenny said, breathlessly. \"Mrs. Glass is the coach, you know, and she basically said you had a spot on the team!\"\nOrson pretended to be interested in the flyer and said he would let Kenny know later. But as Kenny ran off to class, Orson dropped the baseball flyer in the recycling bin. As he looked up at the bulletin board hanging over the bin, he saw another flyer, one for a new school coding club. He read that the club's first meeting was next Monday, the same day as baseball tryouts. Orson put the coding club flyer in his bag before going to class.\nAs he sat down at his desk, Orson pulled out his math notebook, and the coding club flyer came with it. Kenny Banks, who sat nearby, saw the flyer and laughed. \"Are you thinking about doing coding club instead of baseball?\" he smirked. \"Why waste your time? Why not do something you'll actually be good at?\"\n\"I just don't like baseball very much,\" Orson mumbled, but their teacher, Ms. Jones, began her lesson before Kenny could respond.\nThe next Monday, Orson was careful to avoid Kenny and the other baseball team hopefuls in the hallways. As the school day ended, he watched Kenny, Barry, and Mike make their way to the locker room before tryouts. When they had disappeared behind the locker room door, Orson walked in the opposite direction, toward the computer lab, clutching the coding club flyer in his hand."]}, {"unit": "Comprehension Skills", "topic": "Characters, Setting, and Plot", "lesson": "Identify the sequence of events in a story", "texts": ["Bored Enough to Work\nBy Vanessa Richie\n\nChapter 1\n\nSkyler loved to be outside. He loved running outside. He loved exploring outside. He loved anything that involved being outdoors. He hated rainy days because there was nothing to do inside the house.\nRainy days are the worst thing that could happen to me, he thought one rainy day.\nSkyler’s parents were going to run a couple of errands. Skyler was going to stay home all by himself.\n“Skyler, remember to behave yourself while we are out,” Mom reminded him.\n“Of course, I will behave, Mom,” Skyler replied.\n“I’m so sorry that your game got rained out today. You have practiced so hard all week,” Father said to Skyler as he grabbed his coat.\n“Yeah, but it’s okay. Once it stops raining, I’ll go outside and practice my kicking some more.”\nSkyler’s father looked at him. “Are you sure you will be alright?” he asked with concern.\nSkyler laughed. “Of course, I’ll be alright, Dad. I’m almost a teenager.”\nHis mother arched her eyebrow. “You still have a bit of time before that happens.”\n“Don’t worry, Mom. I will be just fine. You two had better get going before the stores close.”\nSkyler’s father gently took his mother’s arm. “He’s right, dear. The bank won’t be open much longer.”\n\nChapter 2\n\nSkyler started playing a couple of video games, but he wasn’t interested in any of them for long.\nMaybe there’s something interesting on the TV, Skyler thought.\nHe spent most of his time flipping through the different channels and checking out the TV Guide. There is nothing worth watching, he thought.\nHis mother had mentioned some chores she needed done, and Skyler was just bored enough to do them.\nHe headed downstairs to empty out the dishwasher, fill it up with more dirty dishes, and clean the countertops.\nSkyler decided to start a load of laundry because he was running low on shirts.\nIt couldn’t hurt to get them washed and dried, he thought, before heading upstairs.\nHe went into his room and grabbed his hamper. Then he collected the towels from his bathroom.\nThinking about what to do with the rest of the day, Skyler started the water, poured in the detergent, and put his clothes in the wash.\nStill unsure what to do with himself, Skyler decided to vacuum.\nAs he vacuumed, Skyler made patterns on the floor; it reminded him of the soccer field.\n\nChapter 3\n\nWhen Skyler finished vacuuming, he looked out the window.\n“Aw, man! It’s still raining,” he muttered at the window.\nUsually it didn’t rain this long. What was he supposed to do now? Skyler was beginning to get desperately bored. So bored that he had resorted to doing chores!\nI might as well do my homework if I can’t go outside, Skyler thought.\nWith a huff, he headed to the desk. He pulled his book bag out from under the desk and took out his binder.\nMath only took him a couple of minutes to finish, but English was going to take a little longer. He had to read a passage and then summarize it.\nAs Skyler finished typing up his summary, he took a look at the clock. He had been home alone for two hours. The time had flown by!\nHe then took a quick look at the widow. The rain had let up, but not enough for practicing.\nWith a sigh, Skyler took out his science homework.\nThis year he had to come up with an experiment, use the scientific method, and write about it.\nSkyler thought this assignment was one of the worst tortures ever.\nSlowly, Skyler began looking up different topics. He briefly thought about a volcano, but that wouldn’t be interesting at all. They had been doing those in class since he was in kindergarten.\n\nChapter 4\n\nSkyler found a website about science experiments that were easy to do and wouldn’t cost much. Several ideas really caught his interest.\nAn entire hour went past before Skyler even realized that he was hooked on the possibilities.\nHow can I choose just one of these? he thought as he flipped through his favorite experiments.\n“We’re home!” his mother said, poking her head in the room.\nSkyler nearly knocked his chair over.\n“Wow, I didn’t even hear you guys come in.” Skyler was getting settled back into his seat.\n“Sorry about sneaking up on you. Thanks for all of the work you did. It looks like you accomplished a lot! We thought you would be going out of your mind with boredom—looks like we were wrong.”\nHis mother ruffled his hair and walked out of the room.\nSkyler laughed and looked at the window, but this time it didn’t make him feel so bummed.\nIf it rained all day, he was all right with that. He might even get to try out some of the experiments. There was always tomorrow to practice sports.", "Colin’s Closet\nBy Merridith Townsend\n\nChapter 1: The Day That Started It All\n\nColin’s terrible day started when he couldn’t wear his favorite shirt because it was in the laundry. It continued when there was no syrup, and he had to eat a dry waffle for breakfast. When he was walking to school, the neighbor’s car drove through a puddle and splashed him. When he walked home, he was splashed again by the same car.\n“What’s for dinner?” he grumbled as he walked in the door. A good dinner full of his favorite foods would have made his day all better.\n“For dinner we are having vegetables and quinoa,” his mother replied cheerfully.\nThat was too much for Colin. He started yelling. He knew he was acting like a baby, but he didn’t care.\n“I don’t even know what quinoa is, but I hate it!” he shouted. “I hate this shirt, and I hate puddles.” Then he said the worst possible thing.\nHe was so full of anger that he couldn’t stop himself. “I hate you, too.”\nHis mom’s eyes narrowed. There was silence.\n“Go to your room,” she hissed, “and don’t come out until you’ve gotten rid of all that hate.” Colin burst into tears and ran all the way up the stairs, slamming the door behind him.\n\nChapter 2: Wishing His Life Away\n\nLying in his bed, Colin tried to stop hating, but he couldn’t. He closed his eyes and he wished that he lived somewhere where there wasn’t any school. He wished that he was in a world without any parents or anyone telling him what to do.\nHe wished so hard that he didn’t notice that a light under his closet door had started to glow. It wasn’t until his closet door started to rattle that Colin noticed. Had his wishes created this magic light? Colin got up and made his way to the closet.\n\nChapter 3: Behind the Closet Door\n\nWhen he opened it, he couldn’t believe his eyes. Inside was an exact copy of his bedroom, but it was so much better. It was filled with everything he had ever asked for, but never received.\nThere was the action figure he had begged for when he was four years old. He even saw the army tank his mother refused to buy. There was even a new video game system. Breathless, he stepped into the room. He never wanted to leave.\nIn fact, he was so excited by all of the forbidden treasures that he didn’t even notice that the door had disappeared behind him. Hours passed as Colin played with every toy and every game in his new room. He played until his head started to spin. He tried to close his eyes to take a break, but that only made him dizzier. He tried to take a deep breath, but his stomach felt sour. He needed to get out of the room.\nWhen Colin turned to leave, his heart started to pound. The door was gone. What was he going to do? He shut his eyes and tried wishing. After all, wishing had worked the first time.\n\nChapter 4: The Bogey Lady\n\nHe opened his eyes. The door had returned, but there was a strange woman standing in front of it.\n“What’s wrong, sweetie?” the woman asked.\n“Who are you?” Colin backed up against the far wall.\n“You must be starving,” she continued.\n“No, I’m not hungry. I just want to go home,” he told her.\nShe frowned, but it didn’t look like a real frown to Colin. It looked like she was making fun of him.\n“But I thought that you hated your home. You will be happy here because you have everything that you’ve ever wanted. You can stay here with us,” she said.\n“What do you mean? Who is us?” Colin grew more and more afraid as she spoke.\n“Where do you think monsters in the closet come from?” she said. “We were all once kids like you. We hated everything, too.” Her face was changing with every step she took. “Sure, some of us were a little mad when we first realized we were stuck here. But don’t you worry; we still get out at night.”\nShe had gotten very close, and Colin saw that she wasn’t a woman at all. She was a monster with a mouth full of the sharpest teeth he had ever seen.\n“I’ll never stay here,” Colin said. He could see the darkness of his room through the open door. He made a quick decision, ducked past the beastly woman, and ran out. When he slammed the door behind him, it silenced the disappointed roar of the monster in the closet.\n“Colin?” his mother called from the hallway. Colin had never been happier to see her. “What are you doing? Why are you standing against the wall?”\n“It’s not the wall, it’s the—” Colin blinked and spun around. There was no door behind him. “It’s gone!” he cried in astonishment.\n“What’s gone, sweetheart?” his mother asked.\n“The door, my closet door. . .it’s gone!” he tried to explain.\nHis mother turned on the light. His room was lit up, and Colin remembered that he didn’t have a closet. This room had never had one. He ran to his mother’s arms with such force that she gasped and then laughed.\n“Oh honey,” she said, kissing his head, “you really did have a bad day didn’t you?”\n\nThey sat together in the dining room and ate dinner. Colin apologized and told his mother that he didn’t hate her. She assured him that she knew that all along.\n“Things get rough sometimes,” she said, spooning some quinoa onto his plate. It was actually much tastier than he imagined. “Things get rough, even for grown-ups. But if things weren’t hard, we wouldn’t know how to appreciate the good things that we have. ”\n“Be careful what you wish for, right?” Colin said, chewing on a big mouthful of his quinoa.\n“You’re right about that, son,” she said. “After dinner, make sure to put your jacket and your bag away in the closet. You dropped them on the floor when you came in.” Colin’s stomach dropped.\n“How about I do the dishes instead?” he suggested.\nShe raised an eyebrow and shrugged. “Alright, you got a deal,” she said with a smile."]}, {"unit": "Comprehension Skills", "topic": "Characters, Setting, and Plot", "lesson": "Understand characters' motivations for their actions", "texts": ["The Princess and the Pea\nBy Hans Christian Andersen\n\nOnce upon a time, there was a prince who wanted to marry a princess. But he was a picky and proud man, so he would only consider a real princess. He traveled all over the world to find one, but nowhere could he get what he wanted.\nThere were many princesses, but it was difficult to find out whether they were real ones. There was always something about them that was not as it should be. So he came home again and was sad, for he would have liked very much to have a real princess.\nOne evening, a terrible storm came on. There was thunder and lightning, and the rain poured down in torrents. A poor princess ran quickly to the city gate as she couldn't handle the weather any longer. Inside the castle, a knocking was suddenly heard, and the old king went to open it.\nIn front of the gate stood the princess. But, good gracious! What a sight the rain and the wind had made her look!\nThe water ran down from her hair and clothes; it ran down into the toes of her shoes and out again at the heels. And yet she said that she was a real princess.\nWell, we'll soon find that out, the old queen thought. But she said nothing, went into the bedroom, took all the bedding off the bedstead, and laid a pea on the bottom.\nThen she took twenty mattresses and laid them on the pea, and then twenty eiderdown beds on top of the mattresses.\nOn this contraption, the princess had to lie all night. In the morning, they asked her how she had slept.\n\"Oh, very badly!\" she exclaimed. \"I have scarcely closed my eyes all night. Heaven only knows what was in the bed, but I was lying on something hard, so that I am black and blue all over my body. It's horrible!\"\nNow they knew that she was a real princess because she had felt the pea right through the twenty mattresses and the twenty eiderdown beds.\nNobody but a real princess could be as sensitive as that.\nSo the prince took her for his wife, for now he knew that he had a real princess; and the pea was put in the museum, where it may still be seen, if no one has stolen it.\nThere, that is a true story.", "Kelly and the Shelter\nBy Courtney Courtnage\n\nChapter 1: The Puppy\n\nWhen she awoke in the morning, Kelly stretched out her arms toward the ceiling. Then she went into the kitchen for some breakfast.\n“Good morning, Mom,” said Kelly.\nHer mom pulled her into a big hug. “Good morning, Kelly. Hurry and eat your pancakes, or you will be late for school,” said Mom with a smile.\n“Ugh, I don’t eat pancakes!” said Kelly. She slid into a chair next to her father, who was reading the newspaper.\n“Some people aren’t fortunate enough to be so picky. They would be happy just to have something to eat,” said her dad. “One day you will learn not to act so spoiled.”\nOn her way to school, Kelly looked in the windows of the shops. She stopped to look at the toys in the toy store. The cutest toy puppy sat in the display. Big pink letters on the box said the dog would bark when squeezed.\n“I have to have that!” Kelly said to herself.\nKelly sat in class thinking about the toy dog. She didn’t even hear the recess bell. Kelly couldn’t wait to get home to ask Mom and Dad for money to buy the toy.\nFinally, the bell rang. Kelly ran home faster than she’d ever run before.\nShe burst into the house and yelled, “Mommy, can I get a puppy?”\n“You already have a cat,” called Mom from upstairs.\n“Not a real one,” said Kelly, “a toy puppy that I saw at the store on my way to school. I need it!”\n\nChapter 2: Helping Out\n\n“Well,” said Mom, “if you clean your room and then fold the laundry, you can earn the money to buy the toy.”\n“Ugh, I hate doing chores!” Kelly said, but she got right to work cleaning and folding laundry.\nBy bedtime, she had finished her jobs. Mom put some money on Kelly’s desk. Kelly could hardly sleep. She was so excited.\nThe next morning Kelly bounced out of bed, kissed her mom and dad, and then ran to the store.\n\nChapter 3: Nicky\n\nAs Kelly got closer, she saw a boy about her age was staring into the window. He was looking at Kelly’s puppy.\n“Hi, my name is Kelly.”\nThe boy looked at Kelly and smiled. His clothes looked worn.\n“I am going to buy that,” said Kelly with a nod towards the toy dog. The boy smiled but he looked sad.\nKelly stood for a moment before she bought the toy dog. The little boy was still there, but now an older girl stood next to him. He was crying.\n“Why is he so sad?” Kelly asked the girl.\n“I am Anita, and this is my brother Nicky,” the girl said. “He’s been talking about that toy puppy all night.”\n“So why didn’t he buy it if he wants it so much?” Kelly asked, clutching the toy tightly.\n“We don’t have money to spend on toys,” said Anita.\n“Oh.” Who doesn’t have money for toys? Kelly wondered.\nAs Kelly walked home, she didn’t feel as happy as she thought she would. All she could think about was how sad Nicky had been when she bought the puppy.\n\"Too bad for him,” Kelly said to herself. “This is my dog.\"\n\nChapter 4: The Shelter\n\nThat evening Kelly’s mother announced, “We are going to donate some time at the homeless shelter this Saturday.”\n“Homeless shelter, what's that?” asked Kelly.\n“The shelter is a place for people who don’t have a home and food,” replied Mom. “We are going to help give them a hot meal.”\n“I would rather play with my friends and my new puppy dog,” Kelly said.\n“Well you can play with your friends afterward,” Mom said sternly. “It’s nice to help others, Kelly.”\n\nOn Saturday, Kelly’s family went to the shelter.\nA woman at the shelter asked Kelly to clean up the dirty dishes. Kelly pushed the dirty plates into a plastic bin. When she looked up, she saw the little boy from the other day. He and his sister, Anita, had just sat down to eat.\n“What are you doing here?” Kelly asked Anita.\n“We’ve lived here since our parents lost their jobs,” Anita replied.\nNicky stared down at his food and quietly pushed peas around his plate.\nKelly went back to cleaning the dishes, but she kept watching Nicky.\n“Mom, do the kids here have toys? I mean…they don’t have homes, but they have toys, right?”\n“People here do not have very much. That is why we give away your clothes and toys to the shelter when you outgrow them,” said Mom.\n“Can I walk home for a minute, Mom?” asked Kelly.\n“Sure, but hurry back.”\nKelly returned to the shelter with a big box. The young kids came closer to Kelly. They wondered what she had in the box.\n“These toys are for you,” Kelly said to the children, as she held something behind her back.\n“Nicky, I want you to have this one.” Kelly grinned as she pulled the toy dog from behind her.\nNicky’s eyes glistened, and he gave Kelly a hug.\n\"You will enjoy this more than I will,” said Kelly.\n“That was very nice of you!” Mom said as they drove home.\nKelly snuggled into her bed feeling very grateful, and smiled as she drifted off to sleep."]}, {"unit": "Comprehension Skills", "topic": "Characters, Setting, and Plot", "lesson": "Describe the interaction of characters, including relationships and how they change", "texts": ["Are We There Yet?\nBy Katie Thompson\n\n\nACT II\nScene I\n\nTime: five minutes later\nPlace: inside the minivan, on the freeway\n\nCharacters:\nJAMIE\nDAD\nMOM\n\nJAMIE [whining again]: I just wanted to know how long it would be until we got there.\n\nDAD [sighs]: About two hours.\n\nJAMIE: You said that an hour ago. Two hours seems like a lot longer in this car. Two hours seems like an entire day. A really, really long day.\n\nMOM: Can't you play a game or something to pass the time?\n\nDAD [to himself]: Yeah, like the quiet game.\n\n[MOM raises her eyebrows at DAD.]\n\nJAMIE [crosses his arms and frowns]: This trip is zero fun.\n\n[DAD shrugs at MOM.]\n\nJAMIE [suddenly]: Hey! Look at that little old lady walking in the field. And a bunch of other little old ladies behind her. That one over on the side is wearing a funny sweater. And eating grass.\n\nMOM [slightly worried]: Jamie, those are sheep.\n\nJAMIE: Old ladies! [throws his head back in laughter]\n\nDAD [playing along]: That one seems angry. I wonder if she got in a fight with the one in the front.\n\nJAMIE [smiling]: Yeah! The old lady in front knows they all have to go to the grocery store. But that one eating grass really wanted to play bingo. Grocery shopping is so boring.\n\n[MOM turns her head towards JAMIE in the backseat and smiles for the first time in a while.]\n\nDAD: Those old ladies probably wish they had a car to ride in.\n\nJAMIE [laughing]: Yeah, they'd probably be a lot happier if they didn't have to walk everywhere! They probably get really bored walking.\n\nMOM [still smiling]: They probably don't know how to have any fun at all. They just argue with each other all day to stay busy!"]}, {"unit": "Comprehension Skills", "topic": "Characters, Setting, and Plot", "lesson": "Identify and analyze setting", "texts": ["First set of questions\nadapted from The Wind in the Willows\nby Kenneth Grahame\nThe Mole had been working very hard all the morning, spring-cleaning his little home. First with brooms, then with dusters; then on ladders and steps and chairs, with a brush and a pail of whitewash; till he had dust in his throat and eyes, and splashes of whitewash all over his black fur, and a pained back and tired arms.\nSpring was moving in the air above and in the earth below and around him, penetrating even his dark and humble little house, which was filled with a spirit of sadness and longing. It was hardly surprising, then, that he suddenly threw down his brush on the floor, said, \"Bother!\" and also \"Forget spring-cleaning!\" and bolted out of the house without even waiting to put on his coat.\n\n2nd set of questions\nThis passage continues immediately after the earlier passage from The Wind in the Willows.\nAt last, pop! his snout came out into the sunlight and he found himself rolling in the warm grass of a great meadow.\n\"This is fine!\" he said to himself. \"This is better than spring-cleaning!\" The sunshine struck hot on his fur, soft breezes touched his heated forehead, and—after the closeness of the underground he had lived in so long—the carol of happy birds fell on his dulled hearing almost like a shout. Jumping off all his four legs at once, in the joy of living and the delight of spring without its cleaning, he pursued his way across the meadow.", "First set of questions\nadapted from \"Miss Sally's Company\"\nby L. M. Montgomery\n\"How beautiful!\" said Mary Seymour delightedly, as they got off their bikes at the top of the hill. \"Ida, who could have supposed that such a view would be our reward for climbing that long, difficult hill with its pits and stones? Don't you feel repaid?\"\n\"Yes, but I am terribly thirsty,\" said Ida, who was always practical and never as enthusiastic over anything as Mary was. Yet she, too, felt a deep pleasure in the beauty of the scene before them. Almost at their feet lay the sea, shimmering in the mellow sunshine. Beyond, on either hand, stretched rugged brown cliffs and rocks, here running out to sea in misty purple headlands, there curving into bays and coves that seemed filled up with sunlight and glamour and pearly hazes; a beautiful shore and, seemingly, a lonely one.\nThe only house visible from where the girls stood was a tiny grey one, with odd, low eaves and big chimneys, that stood down in the little valley on their right, where the cliffs broke away to let a brook run out to sea and formed a small cove, on whose sandy shore the waves lapped and crooned within a stone's throw of the house. On either side of the cove a headland made out to sea, curving around to enclose the sparkling water as in a cup.\n\"What a beautiful spot!\" said Mary.\n\"But what a lonely one!\" protested Ida. \"Why, there isn't another house in sight. I wonder who lives in it. Anyway, I'm going down to ask them for a drink of water.\"\n\"I'd like to ask for a square meal, too,\" said Mary, laughing. \"I am discovering that I am hungry. Fine scenery is very satisfying to the soul, to be sure, but it doesn't still the cravings of the inner girl. And we've biked ten miles this afternoon. I'm getting hungrier every minute.\"\n\n2nd set of questions:\nThis passage continues immediately after the earlier passage from \"Miss Sally's Company.\"\nThey reached the little grey house by way of a sloping, grassy lane. Everything about it was very neat and trim. In front a white-washed fence shut in the garden which, sheltered as it was by the house, was ablaze with poppies and hollyhocks and geraniums. A path, bordered by big white clam shells, led through it to the front door, whose steps were slabs of smooth red sandstone from the beach.\n\"No children here, certainly,\" whispered Ida. \"Every one of those clam shells is placed just so. And this walk is swept every day. No, we shall never dare to ask for anything to eat here. They would be afraid of our scattering crumbs.\"\nIda lifted her hand to knock, but before she could do so, the door was thrown open and a breathless little lady appeared on the threshold."]}, {"unit": "Comprehension Skills", "topic": "Characters, Setting, and Plot", "lesson": "Explain the influence of setting on plot", "texts": ["Hiking Dreams\n\nJake loved stories about mountaineers. Even the frightening accounts of mountain climbers were inspiring. Recently, Jake had started daydreaming about trekking to the peak of a mountain like Mount Everest. The problem was that he had never been hiking before! He knew he had to start small and build up strength and endurance, so he found some hiking trails at a local hill. It was the closest thing his town had to a mountain, and Jake thought it would be a great place to start.\nJake's parents decided to hike with him. At the trailhead, they read safety information and looked at the trail map before they began. \"At least there are no bears here,\" his dad joked as they started to hike. His mom noted that it would take two hours to get to the top, which caused his dad to go back to the car and grab some trail mix in case they got hungry.\nFor the first ten minutes, Jake was huffing and puffing, putting one foot heavily in front of the other. Eventually, though, his feet fell into a happy rhythm. A gentle breeze ruffled Jake's hair, and he enjoyed the fresh scent of warm pine trees as he hiked on. Two miles later, however, his legs were getting sore. \"How about we take a break?\" his mom suggested, pointing to a few smooth rocks that would make perfect seats. Jake began to protest because he wanted to make it to the top without resting. But when his parents sat down, he decided to join them. He felt instant relief in his legs and feet. He took a few sips from his water bottle, and his dad passed around the trail mix.\nThey watched chipmunks scurry around tree roots, and his mom pointed out a hawk circling in the sky. Jake giggled as the chipmunks packed their cheeks with acorns, and he looked up in awe at the hawk's precise flight. He knew that the chipmunks might become a meal for the hawk later, but he chose not to think about it as he packed his own cheeks with almonds and raisins. \"Good thinking on the trail mix, Dad!\" he said hungrily.\nA few minutes later, Jake and his parents stood up, stretched, and began the rest of the hike. Their short break had renewed Jake's energy. They marched up the dirt pathway, listening to a chorus of birds. However, after some time, Jake noticed that he was running out of steam again. Luckily, he spotted a bench a few yards away, which marked the end of the trail. As Jake sat down and looked out over his town, the hill did not seem so high, despite how tired it had made him. Jake knew that he would have to hike a lot more before Mount Everest would be possible. \"Mom, Dad?\" Jake asked as they began to hike back down. \"Can we find an even taller hill to climb next week?\""]}, {"unit": "Comprehension Skills", "topic": "Messages, Lessons, and Morals", "lesson": "Identify the problem and solution", "texts": ["The Ball Game\nBy Juliana Sartor\n\nDarius woke up early one Saturday morning. His heart was already pumping quickly—He'd been looking forward to this day for a long time. Not only was it his birthday, but it was also opening day for his favorite baseball team, the Riders. His mom and Gran had bought him tickets weeks ago. Nothing could spoil today!\nBut as he walked downstairs, he noticed the greyness of the sky. “It'll clear up,” he told himself.\nIn the kitchen, Mom was making french toast, which was Darius's favorite. “Happy birthday, pumpkin!” she squealed, hugging him tight. Gran was sipping coffee at the table and held her arms out to Darius. He hugged her, too, and then she gave him a small package wrapped in silver paper.\n“The big day!” Gran said, smiling.\nDarius carefully pulled the tape off the present and unwrapped it. It was a Riders jersey! His name and the number 10 were embroidered on the back!\n“Wow, Gran!” he said.\n“Number 10 for the ten blessed years I've gotten to spend with you,” she replied.\nDarius laughed and pulled the jersey over his head.\nBut right then, there was a crack of thunder outside.\nA pit formed in Darius's stomach. What if they were rained out?\nMom flipped on the TV for an update about the game. Darius was beginning to feel hopeless. The game couldn't be canceled. It just couldn't!\nAn hour later, the rain poured down in sheets. Darius was curled up on the couch. Mom came and sat by him. “I know you're disappointed, honey,” she said. “But we'll be able to go to the game when it is rescheduled.”\n“But I wanted my birthday to be special,” Darius said. “I wanted to see a ball game.”\nMom hugged him. “I'll see what I can do,” she said.\nDarius watched a few cartoons before he heard his name being called from the basement. Curious, he walked over to the stairs and went down them.\nIn the basement, Gran was wearing an old baseball cap and a Stone High baseball t-shirt. Mom was wearing an apron with a pillow stuffed under it, holding an old glove, standing behind a placemat. Darius laughed out loud. He saw a plastic bat near Mom's feet.\nShe said, “Now, up to bat, the best, the baddest, the most rockin' ball player you've ever seen, Darius Johns!”\nGran motioned for him to step up the plate—which was the placemat—and she got ready to pitch the bean bag that was the ball.\nDarius grabbed the plastic bat and swung. The bean bag flew behind the couch, and Darius began to run around the room.\n“He's hit it out of the park, folks!” Mom yelled. “He's running through first—through second—He's on his way to third—And here we go—It's a home run! Darius wins the game! I've never seen anything like it!”\nDarius ran into his mom's arms, and she hugged him tightly. “How's that for a ball game?” she asked.\nDarius laughed. “It was the best game I've ever seen. Thanks, Mom. Thanks, Gran.”", "Anna Wants A Puppy\nBy Juliana Sartor\n\nAnna came running into her kitchen. “Jessie's dog had puppies!” she bellowed at her father.\nHe looked up from his newspaper and nodded.\n“Dad, can we please have one? Please!”\nDad raised an eyebrow at her. “No. Way,” he said. “Do not even think about it.”\n“But Dad—” Anna began.\n“Nope. No buts. No nothing. No puppies. End of story.” Dad raised the newspaper in front of his face.\nAnna knew that was the end of the discussion. But what did Dad know? He hadn't seen the puppies. They were so adorable. They were so wiggly and soft and irresistible! But Anna knew that Dad would never visit the puppies, so... so what if she brought one home, just to show him? He would have to say yes!\nShe went back out the door and the few houses down to Jessie's. There were a few other neighbors around, excitedly talking about the new litter of pups.\nThere were 8 puppies total, each dark brown with droopy ears and a pattern of white spots on their backs and faces. Some of them had names—those ones were easy to tell apart by their spots. But some of them looked the same. Those ones would be missed the least, Anna thought, since it'd take longer to tell if they were missing. She'd just slip one of them out the door when no one was looking!\nShe casually picked up one of the puppies, but the way outside was blocked. She looked at the puppy in her arms. It squealed and squirmed and wanted to get back to its mom.\nAnna sighed. She put the puppy down. Stealing it, even just for a few minutes, was no way to prove to Dad that she could take care of a puppy. Jessie's mom said it'd be at least two months before the puppies could leave their mom, anyway. Two months was enough time to prove to Dad that a puppy wasn't the worst idea, wasn't it?\nAnna went home and got to work. She made a chart of all her chores and the days she needed to do them. She tried her hardest to do her homework before she played on the computer. She did her best to stop complaining when it was time to go to bed. She put away clean dishes and helped her mom cook dinner. She even put her clothes in the laundry before they took over her bedroom! But, hardest of all, she didn't ask Dad about puppies again. If he knew why she had shaped up, he might not believe she would stay responsible once she got what she wanted.\nEight weeks went by, and aside from a few mess ups, Anna had become helpful, responsible, and considerate. Dad and Mom must have noticed, but they didn't really say anything. One night, after Anna had swept the kitchen floor, she sat down on the couch and sighed. Maybe she should have tried to bargain with her parents. Maybe she did all this work for nothing. She felt like crying.\nBut then the back door opened. Her dad came through, and there was something in his arms. A wiggly, soft, irresistible something. It whined and barked and ran toward Anna as her dad set it down.\n“You've really shown us how responsible you can be these last couple months,” Dad said. “I just hope you're ready to keep it up!”"]}, {"unit": "Comprehension Skills", "topic": "Messages, Lessons, and Morals", "lesson": "Determine the central message", "texts": ["Learning To Lose\nWritten by Juliana Sartor\n\nChapter 1\nJana and Tim were playing checkers in the living room. Tim was feeling frustrated. Of the last six games, Jana had won them all.\n\"Uncle Don taught me when I was 5,\" Jana explained.\n\"I hate this game. There's no way I will ever win!\" Tim said.\nJana giggled. \"That's okay,\" she said. Then she stood up and walked toward the kitchen. \"I'll get us a snack while you take your turn.\"\nWhile Jana was gone, Tim looked at the checker board. If only some of Jana's pieces could switch places with his! He looked down the hall. Jana was busy in front of the fridge. She would never know if he switched them, would she?\n\nChapter 2\nJana came back with a bowl of celery and peanut butter. \"Thanks,\" Tim said. Then he added, \"Looks like I might win after all.\"\nJana frowned as Tim jumped three of her pieces. \"Wow,\" she said. \"How did that happen?\"\nTim shrugged. \"I guess I'm better than I thought I was.\"\nJana still frowned. \"Tim,\" she said. \"Did you move some of my pieces when I was gone?\"\nTim looked uncomfortable. \"I was just so sick of losing!\" he said.\nJana nodded. \"Well, practice is the only thing that will help you win. When you cheat, it doesn't count!\"\n\"Especially not if you get caught,\" Tim said. \"I guess cheating feels even worse than losing.\"", "Help Me Out!\nWritten by Juliana Sartor\n\nJason was having a party for the Superbowl. He had a lot to do to get ready, so he asked his sister Jo for help. \"Jo,\" he said, \"can you put these snacks in bowls?\" Jo shrugged and kept playing her video game.\nLater, Jason asked Jo for more help. \"Jo,\" he said, \"can you put all your shoes away? They're all over the living room.\" Jo shrugged and ate some of the snacks Jason had put out.\nWhen Jason's friends came, he asked Jo for help again. \"Jo, can you get the soda from the garage?\" Jo shrugged and kicked some of the shoes by the door.\nAt the end of the night, Jason's friends left. Everyone had fun. Their team had won! Jason was really excited.\nThe next day, Jo was doing a project for school. \"Jason,\" she said, \"can you get me the red paint?\" Jason shrugged and kept reading his book. \"Jason,\" she said again. \"I need the red paint. Can you get it?\"\nJason shrugged. \"I don't know,\" he said. \"Could you put snacks in bowls? Or move your shoes? Or get me the soda yesterday?\"\nJo frowned. \"I guess I wasn't very helpful yesterday, was I?\" she asked.\n\"No,\" Jason said. \"So next time I ask you for help, you should remember that it won't be long until you will need help from me.\""]}, {"unit": "Comprehension Skills", "topic": "Messages, Lessons, and Morals", "lesson": "Support the central message using key details", "texts": ["The Contest\nWritten by Juliana Sartor\n\nChapter 1: The Contest\nDean looked down at his desk. Mr. Marcus had left a letter on it. The letter asked Dean to join the school poetry contest. Under the letter was a copy of a poem. Dean wrote it last week. He didn't think it was very good, even if Mr. Marcus thought it was.\n\"What's that?\" Jenny asked when she sat down.\n\"Mr. Marcus wants me to put my poem in the poetry contest,\" he said.\n\"Wow!\" Jenny said. \"That's great, Dean! Are you going to?\"\nDean shrugged. \"I don't know. Probably not. What if I lose?\"\n\"Who cares?\" Jenny said. \"Your poem is still better than mine!\"\nDean smiled. Maybe Jenny was right.\n\nChapter 2: The Results\nA few weeks later, Dean found another letter on his desk. \"Jenny,\" he said, \"here are the results of the poetry contest!\"\nJenny grinned. Dean was nervous. He slowly opened the envelope. He pulled out the paper inside.\n\"Fourth place,\" he said. He felt a little sad. But there was a note at the bottom of the letter. It was from Principal Tate. \"But Mr. Tate says he is really proud I tried,\" Dean said.\nJenny smiled. \"You should be proud, too!\" she said.\nDean smiled, too. \"You're right,\" he said. \"I'm glad I tried. After all, I wrote the fourth best poem in the school!\"", "A Gift for Grams\nWritten by Juliana Sartor\n\nChapter 1: Going to Grams' House\nAngus and Pam were going to see Grandma. Pam was excited. Grandma always gave them gifts. But Angus was upset. \"Grandma always gives you better gifts,\" he told Pam.\nThey got to Grandma's house. They walked inside. Grandma was on the couch. \"Hi Grams,\" they said. They bent down to hug her. She didn't look so well.\n\"How are you doing?\" Angus asked.\nGrandma chuckled. \"I've been better,\" she said. Then she looked sad. \"I don't even have any presents for you kids.\"\nAngus looked at Pam and frowned. \"It's okay, Grandma,\" he said. \"We don't need any gifts.\"\n\nChapter 2: Giving Back\nLater, they were coloring at the kitchen table. Angus had an idea. He took a piece of paper and folded it in half. He spent 20 minutes drawing and coloring it.\nThen, he walked up to Grams. \"I know you usually give us gifts,\" he said, \"But now it's your turn. It's not much but...\" He handed her the card he had made.\n\"To the best grandma in the world,\" Gram read, \"We love you very much.\" Gram looked up. She had tears in her eyes. \"Thank you, darling,\" she said.\nThen she hugged Angus. It was better than any gift she could have bought him."]}, {"unit": "Comprehension Skills", "topic": "Messages, Lessons, and Morals", "lesson": "Recognize folktales, fables, and myths", "texts": []}, {"unit": "Comprehension Skills", "topic": "Messages, Lessons, and Morals", "lesson": "Determine central messages in folktales, fables, and myths", "texts": ["Text 1: \nThe Chipmunk's Black Stripes\nA Haudenosaunee (Native American) Myth\n\nThe porcupine was chosen head chief of all the animals. That was when the animals had chiefs and tribes like the Indians. He was made head chief because nothing could hurt him.\nOne day, when he was roaming through the forest, he heard the animals roaring and growling. He stopped to hear what they were saying.\n\"Always night! Always night!\" growled some of the animals.\n\"Let us have daylight all the time, daylight all the time!\" roared the others.\n\"How can I settle the matter?\" he said to himself. \"I know what I will do. I will call a council of all the animals and let them decide.\"\nSo that night, he called a council of all the animals. From the north, south, east, and west they came. They built a blazing fire in the forest and seated themselves in a ring around it. Some were stern and serious, while others looked fierce and threatening. The porcupine seemed very worried as he rose to address them.\n\"I cannot decide,\" said he, \"whether we shall have daylight all the time or darkness all the time.\"\nThere was great commotion. All the animals talked at once. They roared and growled so that no one could hear what they were saying. But above them all the bear's big deep voice rumbled out. Rocking to and fro on his hind legs, he growled, \"Always night! Always night! Always night for me!\"\nJust outside the ring, a little chipmunk squeaked out, \"The light will come! The light will come!\" The other animals paid no attention to the little creature, but kept on roaring and growling. The little chipmunk laughed to himself and danced around and around, shrieking, \"The light will come! The light will come!\"\nSuddenly a faint light spread over the eastern sky and the round disk of the sun rose above the horizon. Daylight had come. Silence fell on the astonished group. Could it be possible that daylight would come whether they wanted it or not?\n\"What did I tell you?\" squeaked the little chipmunk, as he darted away into the forest. The angry bear ran after him, but the little creature was too quick. The chipmunk ran to his home in the hollow tree, but, just as he entered the hole, the clumsy bear struck him with his paw. His sharp claws made black stripes on the chipmunk's back, and there they are to this day.\n\nText 2:\nWilliam Tell\nAn American Folktale\n\nChapter 1\nLong ago, there was a man named William Tell. He lived a peaceful life with his son, Walter, but William also knew how to fight.\nWilliam was strong and capable with a sword as well as a skilled marksman.\nMarksmen were known as the best archers. William Tell was the best in the land. His reputation was well-known. William never missed a shot with his bow and arrow. William was a good man who only used his skills for good things. He always tried to do what he thought was right.\nUnfortunately, the man who ruled the land was not like William. The ruler, Albrecht Gessler, was greedy and cruel. He was also known for having very little skill as a marksman.\nThe king had granted Albrecht Gessler the right to rule over the territory. Albrecht was too enchanted with his own power to be a good ruler. His biggest desire was to be obeyed by all of the people in the territory.\n\nChapter 2\nOne morning, Albrecht decided the people should treat him as more than just a ruler. He wanted them to show respect, even when he wasn't present. He went into the center of the town with his servants. \"Put a pole up in the middle of the square,\" the cruel man commanded.\nHis servants did not want to defy him. They rolled the pole to the middle of the square.\n\"No, you fools! Put the pole upright with one end in the ground.\" His anger was obvious. Spittle flew from his mouth as he yelled.\nScared, the servants quickly corrected their mistake. It was a difficult task to drive the heavy pole into the ground. It was made from a large trunk of a tree that had all the branches removed.\nTired and sweaty, the servants stood back. Under Albrecht's orders, one of the servants climbed the pole and placed the ruler’s hat on the top.\nOnce the hat was in place, Albrecht made his servants gather the entire town around the pole. \"As your lord and master, you must always bow and pay respect to my hat whenever you pass by this pole.\"\nThe people did not like the new law, but they could not fight it. Every day as people passed the hat, they would bow. Even if it was raining, they got drenched by the rain as they bowed to the hat. If they did not bow, they risked being punished.\n\nChapter 3\nWilliam Tell was not like everyone else. He would not pay his respects to such a cruel leader. William refused to bow to the hat.\nAt first he simply avoided going near the hat. It was easy to devise a new path to almost anywhere in the town.\nOne day William and his son had to go to the palace, which meant he had to go past the hat. William had to make a choice.\nAs William's son began to bow at the hat, William held him up.\n\"But we must bow,\" his son exclaimed.\n\"No, it is wrong to follow the orders of such a cruel leader. I will not willingly do what is wrong,\" William pronounced loudly.\nThey continued walking to the castle. The news of William's defiance reached the castle before William and his son. William and Walter were met with hostility at the castle. Both were thrown into prison. Albrecht was furious. William had not only defied his law, but he had also done so very publicly.\n\nChapter 4\nThe next morning, William was brought before Albrecht. \"Why do you defy the law?\" Albrecht asked.\nWilliam answered very simply, \"I have chosen to defy the law because it is wrong.\"\nAlbrecht began shaking because he was so angry. He wanted to get even with William and devised a plan to embarrass him publicly. \"If you will not bow to the hat, then you must complete a public challenge, or else both you and your son will face execution.\"\n\"You must prove your skill as a marksman. You must shoot an apple that sits on the top of your son's head. You have one shot.\"\nAlbrecht and his court went to the field in front of the castle. William and Walter had a few moments together. William explained to Walter what was about to happen. \"I believe in you, Father,\" Walter said bravely. \"I will be safe.\"\nWalter was then taken to a tree. An apple was placed on his head. William took a deep breath. He removed an arrow from the quiver and focused on the apple. Clearing his mind, William shot the arrow. The arrow sliced the apple, but did not harm Walter. William ran toward Walter and gave him a hug.\nWilliam was happy that he had stood up to the evil ruler.", "Text 1:\nThe Ape and the Firefly\nA Filipino Folktale\n\nOne evening the firefly was on his way to visit a friend. As he passed the ape's house, the ape called out, \"Mr. Firefly, why do you carry a light?\"\n\"Because I am afraid of the mosquitoes,\" the firefly replied.\n\"What a coward you are!\" said the ape. The ape was so amused that he laughed loudly. The next day he told all his neighbors that the firefly carried a light at night because he was a coward.\nThe firefly heard what the ape had said and was very angry. Though it was night, he hurried to the ape's house. He found his enemy asleep, but he flashed his light in the ape's face and wakened him suddenly.\n\"Who's there?\" called out the ape.\n\"It is I,\" said the firefly. \"Why did you tell every one that I was a coward? I will fight you on the plaza tomorrow evening, and I will show you who is braver.\"\nThe ape laughed at the idea of such a little creature presuming to fight him alone. \"You had better bring someone to help you,\" replied the ape, \"for I shall bring my whole company, about a thousand apes, each as bi
