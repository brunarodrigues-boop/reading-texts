ng out of your mouth! [He snatches the cigar, and throws it to the floor; continues obsequiously.] What am I going to do with you, sir? Why, really, I haven't the slightest idea. Er—can't you suggest something?\n\nTHE CUSTOMER: [Quickly and earnestly] Listen to me. I must be at that meeting at once! I can't spare another minute. If I am not there before three-fifteen I will be ruined—do you understand me?—ruined!\n\nTHE BARBER: You needn't raise your voice, sir. My hearing is excellent. [He lathers again, keeping the razor near THE CUSTOMER's throat.]\n\nTHE CUSTOMER: [Piteously] Can't I convince you? I—\n\nTHE BARBER: Oh, I believe you. Don't let that trouble you. In fact, I know all about the meeting. There's going to be an auction, and unless you bid, it will be all up with you.\n\nTHE CUSTOMER: Then you'll let me go there?\n\nTHE BARBER: I'm afraid I won't, sir.\n\nTHE CUSTOMER: But—\n\nTHE BARBER: If I may use your own words, sir, I don't care one bit about your meeting.\n\nTHE CUSTOMER: [Angrily] Who the devil do you think—\n\nTHE BARBER: [Interrupting him by running the lather brush into his mouth] Oh, shut up! [There is a pause.]\n\nTHE CUSTOMER: I'll-I'll give you ten dollars to let me go.\n\nTHE BARBER: [Acting as if he did not hear] Beg pardon, sir?\n\nTHE CUSTOMER: [Taking the scarf-pin from the edge of his vest.] This scarf-pin—it's worth five hundred dollars—I'll give—\n\nTHE BARBER: [Raises his hand to his ear, knocking the pin out of THE CUSTOMER's hand] I don't hear well on this side. Try the other.\n\nTHE CUSTOMER: A thousand dollars! I'll give you a thousand dollars!\n\nTHE BARBER: I'm afraid it won't do, sir. You see, the young lady who runs the news stand up-stairs says—you won't interrupt me this time will you?—she says it's important to keep customers in sight. There's nothing so bad for trade as an empty shop.\n\nTHE CUSTOMER: Oh, have you no heart? It's almost too late now! Every second is worth a dollar to me!\n\nTHE BARBER: Well, sir, it will console you to know that my time is worth very little.\n\nTHE CUSTOMER. Please let me up! If I wait two minutes longer, I might as well shoot myself.\n\nTHE BARBER: I shan't object, sir.\n\nTHE CUSTOMER: Oh! Oh! Oh!\n\nTHE BARBER: So you are beginning to feel some regrets? I'm glad to see it. I always thought you'd regret sooner or later. [Shaving.] By the way, sir, haven't you recognized me yet?\n\nTHE CUSTOMER: Recognized you?\n\nTHE BARBER: Oh, I see. You thought I was just a lunatic. Well, I'm not. Look at me. Look at me closely.\n\nTHE CUSTOMER: I don't know you!\n\nTHE BARBER: No? Well, just say to yourself, \"Twelve years ago this man's hair was not so gray. Twelve years ago this man's face didn't show so many lines of care. Twelve years ago this man lived—well, in a little town near Savannah, and—\"\n\nTHE CUSTOMER: [Beginning to recognize him] You-you can't be—\n\nTHE BARBER: Say it.\n\nTHE CUSTOMER: Kilburn!\n\nTHE BARBER: Yes, Kilburn!\n\nTHE CUSTOMER: [Hoarsely] And you followed me about!\n\nTHE BARBER: For twelve years!\n\nTHE CUSTOMER: From town to town!\n\nTHE BARBER: I was never more than a week behind you.\n\nTHE CUSTOMER: [With unutterable horror] Good God!\n\nTHE BARBER: Yes, God. I used to think of Him a great deal, John. I used to ask Him why He never brought you into my shop.\n\nTHE CUSTOMER: Oh! Oh!\n\nTHE BARBER: But He brought you here at last, John! He brought you here at last! [He pauses.] For twelve mortal years I've been hoping for this day! Once, in Muscatine, you came in, but there was another man in the chair, and you wouldn't wait. Once, in Louisville, you crossed my threshold, looked at your watch, and walked out again. But sooner or later, John, I knew you'd walk into my shop, and sit down in my chair! That day has come! [He looks into his eyes.] You and I, John, the two of us, have a long account to settle, haven't we? I've been one of your creditors, too! And this is the reckoning, John! You're going to pay me—pay me in full—and you're going to pay me now!\n\nTHE CUSTOMER: What are you going to do?\n\nTHE BARBER: That's a hard question, John. I'd be justified in cutting your throat, wouldn't I?\n\nTHE CUSTOMER: It would be murder!\n\nTHE BARBER: Ugly word, isn't it?\n\nTHE CUSTOMER: Murder in the first degree!\n\nTHE BARBER: Oh, of course!\n\nTHE CUSTOMER: They'd get you as sure as fate!\n\nTHE BARBER: I wouldn't run away.\n\nTHE CUSTOMER: But, Kilburn, think what you are doing!\n\nTHE BARBER: I've been thinking about it for twelve years, John.\n\nTHE CUSTOMER: I'm on my back, helpless!\n\nTHE BARBER: You'd run if I let you up.\n\nTHE CUSTOMER: But give me a chance! Kilburn, give me—\n\nTHE BARBER: [Interrupting] No, John, you get no chance. You gave Jennie none. [He pauses.] She was just eighteen when you came to our town. She was only a child, John, only a child. Her mother was dead. I was all she had—and she was all I had. And I was trying to bring her up right—to make her the same kind of a woman her mother had been, if you know what that means.\n\nTHE CUSTOMER: I didn't—\n\nTHE BARBER: Don't tell me what you did and what you didn't! She loved you—and—and I trusted you. You were going to get married. You took her away with you. You didn't care about me, and you didn't care about her. She was a toy that you flung into the gutter! She depended on you. It makes me sick to think of it! [He goes on more quietly.] She came home six months later. How she got back all the way from where you'd taken her, I don't know—and I don't like to guess. And then-then—\n\nTHE CUSTOMER: I'll marry her now, Kilburn.\n\nTHE BARBER: You'll have to ask her about that.\n\nTHE CUSTOMER: [Eagerly] Well?\n\nTHE BARBER: In two minutes you'll be able to ask her.\n\nTHE CUSTOMER: What do you mean?\n\nTHE BARBER: She's dead, John—dead.\n\n[THE CUSTOMER groans. Then, suddenly, he tries to rise. THE BARBER places his hand over his forehead and eyes, and forces him back into the chair.]\n\nTHE BARBER: Thirty seconds for your prayers, John!\n\nTHE CUSTOMER: Don't kill me, man! Don't kill me! I'm not fit to die! I'm not ready! A minute! Two minutes! I'm too young! Don't kill—\n\n[THE BARBER, still with his hand upon the other man's eyes, suddenly seizes a wet towel and strikes him across the throat with it. THE CUSTOMER faints. THE BARBER looks at him contemptuously; abruptly raises the chair to a sitting position; puts away the razor.]\n\nTHE BARBER: So your nerve gave way, John? Your nerve gave way? [He spreads the towel over THE CUSTOMER's face and roughly wipes away the lather.]\n\nTHE CUSTOMER: [Beginning to come to; faintly] Where am I?\n\nTHE BARBER: You ought to be in hell, but I guess you're still on the good earth.\n\nTHE CUSTOMER: [Putting his hand to his throat] You—you didn't kill me?\n\nTHE BARBER: No. I didn't.\n\nTHE CUSTOMER: [Standing up] And you could have!\n\nTHE BARBER: John, when you're just about to cross the river, when your eyes are beginning to glaze and your heart's about to stop beating, you won't be nearer death than you were a minute ago!\n\nTHE CUSTOMER: Why didn't you kill me?\n\nTHE BARBER: It wouldn't bring back Jennie, would it?\n\nTHE CUSTOMER: [With a sneer] Were you afraid?\n\nTHE BARBER: After I had been looking forward to it for twelve years? No.\n\nTHE CUSTOMER: Then why—\n\nTHE BARBER: [Grimly] You'll remember why! [He helps him on with his coat.] John, tell me: are fellows who seem so self-important always so cowardly when it comes down to it? Or, [breaking off, speaking slowly], or, perhaps, was it on account of that meeting?\n\nTHE CUSTOMER. That meeting? Oh! That meeting!\n\nTHE BARBER: Yes, the meeting.\n\nTHE CUSTOMER: [Looking at the clock] Twenty-five minutes past! I'm ruined! I'm ruined!\n\nTHE BARBER: [Half to himself] I didn't kill you, no! I left you your life, but I made it worthless! I broke you! I broke you!\n\nTHE CUSTOMER: [Has crossed stealthily to the door] Kilburn!\n\nTHE BARBER: [Startled at the sudden change in his voice] Yes?\n\nTHE CUSTOMER: [Hysterically] Thought I was a fool, did you? Thought I'd tell you the real time of the meeting?\n\nTHE BARBER: What do you mean?\n\nTHE CUSTOMER: [Shrieking] You idiot! The meeting doesn't begin till three-thirty!\n\nTHE BARBER: [Calmly] Is that all? Well, the clock [pointing to it] is half an hour slow.\n\nCURTAIN", "Read the excerpt and answer the questions that follow.\n\nAn Excerpt Adapted from\nThe Picture of Dorian Gray\nBy Oscar Wilde\n\nHe turned to Hallward and said, \"My dear fellow, I have just remembered.\"\n\"Remembered what, Harry?\"\n\"Where I heard the name of Dorian Gray.\"\n\"Where was it?\" asked Hallward, with a slight frown.\n\"Don't look so angry, Basil. It was at my aunt, Lady Agatha's. She told me she had discovered a wonderful young man who was going to help her in the East End, and that his name was Dorian Gray. I am bound to state that she never told me he was good-looking. Women have no appreciation of good looks; at least, good women have not. She said that he was very earnest and had a beautiful nature. I at once pictured to myself a creature with spectacles and lank hair, horribly freckled, and tramping about on huge feet. I wish I had known it was your friend.\"\n\"I am very glad you didn't, Harry.\"\n\"Why?\"\n\"I don't want you to meet him.\"\n\"You don't want me to meet him?\"\n\"No.\"\n\"Mr. Dorian Gray is in the studio, sir,\" said the butler, coming into the garden.\n\"You must introduce me now,\" cried Lord Henry, laughing.\nThe painter turned to his servant, who stood blinking in the sunlight. \"Ask Mr. Gray to wait, Parker: I shall be in in a few moments.\" The man bowed and went up the walk.\nThen he looked at Lord Henry. \"Dorian Gray is my dearest friend,\" he said. \"He has a simple and a beautiful nature. Your aunt was quite right in what she said of him. Don't spoil him. Don't try to influence him. Your influence would be bad. The world is wide, and has many marvelous people in it. Don't take away from me the one person who gives to my art whatever charm it possesses: my life as an artist depends on him. Mind, Harry, I trust you.\" He spoke very slowly, and the words seemed wrung out of him almost against his will.\n\"What nonsense you talk!\" said Lord Henry, smiling, and taking Hallward by the arm, he almost led him into the house.\nAs they entered they saw Dorian Gray. He was seated at the piano, with his back to them, turning over the pages of a volume of Schumann's \"Forest Scenes.\" \"You must lend me these, Basil,\" he cried. \"I want to learn them. They are perfectly charming.\"\n\"That entirely depends on how you sit to-day, Dorian.\"\n\"Oh, I am tired of sitting, and I don't want a life-sized portrait of myself,\" answered the lad, swinging round on the music-stool in a wilful, petulant manner. When he caught sight of Lord Henry, a faint blush coloured his cheeks for a moment, and he started up. \"I beg your pardon, Basil, but I didn't know you had any one with you.\"\n\"This is Lord Henry Wotton, Dorian, an old Oxford friend of mine. I have just been telling him what a capital sitter you were, and now you have spoiled everything.\"\n\"You have not spoiled my pleasure in meeting you, Mr. Gray,\" said Lord Henry, stepping forward and extending his hand. \"My aunt has often spoken to me about you. You are one of her favourites, and, I am afraid, one of her victims also.\"\n\"I am in Lady Agatha's black books at present,\" answered Dorian with a funny look of penitence. \"I promised to go to a club in Whitechapel with her last Tuesday, and I really forgot all about it. We were to have played a duet together—three duets, I believe. I don't know what she will say to me. I am far too frightened to call.\"\n\"Oh, I will make your peace with my aunt. She is quite devoted to you. And I don't think it really matters about your not being there. The audience probably thought it was a duet. When Aunt Agatha sits down to the piano, she makes quite enough noise for two people.\"\n\"That is very horrid to her, and not very nice to me,\" answered Dorian, laughing.\nLord Henry looked at him. Yes, he was certainly wonderfully handsome, with his finely curved scarlet lips, his frank blue eyes, his crisp gold hair. There was something in his face that made one trust him at once. All the candour of youth was there, as well as all youth's passionate purity. One felt that he had kept himself unspotted from the world. No wonder Basil Hallward worshipped him.\n\"You are too charming to go in for philanthropy, Mr. Gray—far too charming.\" And Lord Henry flung himself down on the divan and opened his cigarette-case.\nThe painter had been busy mixing his colours and getting his brushes ready. He was looking worried, and when he heard Lord Henry's last remark, he glanced at him, hesitated for a moment, and then said, \"Harry, I want to finish this picture today. Would you think it awfully rude of me if I asked you to go away?\"\nLord Henry smiled and looked at Dorian Gray. \"Am I to go, Mr. Gray?\" he asked.\n\"Oh, please don't, Lord Henry. I see that Basil is in one of his sulky moods, and I can't bear him when he sulks. Besides, I want you to tell me why I should not go in for philanthropy.\"\n\"I don't know that I shall tell you that, Mr. Gray. It is so tedious a subject that one would have to talk seriously about it. But I certainly shall not run away, now that you have asked me to stop. You don't really mind, Basil, do you? You have often told me that you liked your sitters to have some one to chat to.\"\nHallward bit his lip. \"If Dorian wishes it, of course you must stay. Dorian's whims are laws to everybody, except himself.\"\nLord Henry took up his hat and gloves. \"You are very pressing, Basil, but I am afraid I must go. I have promised to meet a man at the Orleans. Good-bye, Mr. Gray. Come and see me some afternoon in Curzon Street. I am nearly always at home at five o'clock. Write to me when you are coming. I should be sorry to miss you.\"\n\"Basil,\" cried Dorian Gray, \"if Lord Henry Wotton goes, I shall go, too. You never open your lips while you are painting, and it is horribly dull standing on a platform and trying to look pleasant. Ask him to stay. I insist upon it.\"\n\"Stay, Harry, to oblige Dorian, and to oblige me,\" said Hallward, gazing intently at his picture. \"It is quite true, I never talk when I am working, and never listen either, and it must be dreadfully tedious for my unfortunate sitters. I beg you to stay.\"\n\"But what about my man at the Orleans?\"\nThe painter laughed. \"I don't think there will be any difficulty about that. Sit down again, Harry. And now, Dorian, get up on the platform, and don't move about too much, or pay any attention to what Lord Henry says. He has a very bad influence over all his friends, with the single exception of myself.\"\nDorian Gray stepped up on the dais with the air of a young Greek martyr, and made a little pout of discontent to Lord Henry, to whom he had rather taken a fancy. He was so unlike Basil. They made a delightful contrast. And he had such a beautiful voice. After a few moments he said to him, \"Have you really a very bad influence, Lord Henry? As bad as Basil says?\"\n\"There is no such thing as a good influence, Mr. Gray. All influence is immoral—immoral from the scientific point of view.\"\n\"Why?\"\n\"Because to influence a person is to give him one's own soul. He does not think his natural thoughts, or burn with his natural passions. He becomes an echo of some one else's music, an actor of a part that has not been written for him. The aim of life is self-development. To realize one's nature perfectly—that is what each of us is here for. People are afraid of themselves, nowadays. They have forgotten the highest of all duties, the duty that one owes to one's self. Of course, they are charitable. They feed the hungry and clothe the beggar. But their own souls starve, and are naked. Courage has gone out of our race. Perhaps we never really had it. And yet—\"\n\"Just turn your head a little more to the right, Dorian, like a good boy,\" said the painter, deep in his work and conscious only that a look had come into the lad's face that he had never seen there before.\n\"And yet,\" continued Lord Henry, in his low, musical voice, and with that graceful wave of the hand that was always so characteristic of him, \"I believe that if one man were to live out his life fully and completely, were to give form to every feeling, expression to every thought, reality to every dream—I believe that the world would gain such a fresh impulse of joy, but the bravest man amongst us is afraid of himself. Every impulse that we strive to strangle broods in the mind and poisons us. The only way to get rid of a temptation is to yield to it. Resist it, and your soul grows sick with longing for the things it has forbidden to itself, with desire for what its monstrous laws have made monstrous and unlawful. It has been said that the great events of the world take place in the brain. It is in the brain, and the brain only, that the great sins of the world take place also. You, Mr. Gray, you yourself, with your rose-red youth and your rose-white boyhood, you have had passions that have made you afraid, thoughts that have filled you with terror, day-dreams and sleeping dreams whose mere memory might stain your cheek with shame—\"\n\"Stop!\" faltered Dorian Gray, \"Stop! you bewilder me. I don't know what to say. There is some answer to you, but I cannot find it. Don't speak. Let me think. Or, rather, let me try not to think.\"\nFor nearly ten minutes he stood there, motionless, with parted lips and eyes strangely bright. He was dimly conscious that entirely fresh influences were at work within him. Yet they seemed to him to have come really from himself. The few words that Basil's friend had said to him—words spoken by chance, no doubt, and with wilful paradox in them—had touched some secret chord that had never been touched before, but that he felt was now vibrating and throbbing to curious pulses.\nMusic had stirred him like that. Music had troubled him many times. But music was not articulate. It was not a new world, but rather another chaos, that it created in us. Words! Mere words! How terrible they were! How clear, and vivid, and cruel! One could not escape from them. And yet what a subtle magic there was in them! They seemed to be able to give a physical form to formless things, and to have a music of their own as sweet as that of viol or of lute. Mere words! Was there anything so real as words?\nYes; there had been things in his boyhood that he had not understood. He understood them now. Life suddenly became fiery-coloured to him. It seemed to him that he had been walking in fire. Why had he not known it?"]}, {"unit": "Comprehension Skills", "topic": "Dialogue and Incidents as Driving Forces of Plot and Characterization", "lesson": "Analyze how incidents can change the pace of a story or drama", "texts": []}, {"unit": "Comprehension Skills", "topic": "Dialogue and Incidents as Driving Forces of Plot and Characterization", "lesson": "Analyze how dialogue can reveal details about characters", "texts": ["Read the play, paying particular attention to how the dialogue reveals details about both characters.\n\nA Ghost Story\nBy Mark Twain\n\nI took a large room, far up Broadway, in a huge old building whose upper stories had been wholly unoccupied for years until I came. The place had long been given up to dust and cobwebs, to solitude and silence. I seemed groping among the tombs and invading the privacy of the dead, that first night I climbed up to my quarters. For the first time in my life a superstitious dread came over me; and as I turned a dark angle of the stairway and an invisible cobweb swung into my face and clung there, I shuddered as one who had encountered a phantom.\nI was glad enough when I reached my room and locked out the mold and the darkness. A cheery fire was burning in the grate, and I sat down before it with a comforting sense of relief. For two hours I sat there, thinking of bygone times; recalling old scenes, and summoning half-forgotten faces out of the mists of the past; listening, in fancy, to voices that long ago grew silent for all time, and to once familiar songs that nobody sings now. And as my reverie softened down to a sadder and sadder pathos, the shrieking of the winds outside softened to a wail, the angry beating of the rain against the panes diminished to a tranquil patter, and one by one the noises in the street subsided, until the hurrying footsteps of the last belated straggler died away in the distance and left no sound behind.\nThe fire had burned low. A sense of loneliness crept over me. I arose and undressed, moving on tiptoe about the room, doing stealthily what I had to do, as if I were environed by sleeping enemies whose slumbers it would be fatal to break. I covered up in bed, and lay listening to the rain and wind and the faint creaking of distant shutters, till they lulled me to sleep.\nI slept profoundly, but how long I do not know. All at once I found myself awake, and filled with a shuddering expectancy. All was still. All but my own heart—I could hear it beat. Presently the bedclothes began to slip away slowly toward the foot of the bed, as if some one were pulling them! I could not stir; I could not speak. Still the blankets slipped deliberately away, till my chest was uncovered. Then with a great effort I seized them and drew them over my head. I waited, listened, waited. Once more that steady pull began, and once more I lay torpid a century of dragging seconds till my chest was naked again. At last I roused my energies and snatched the covers back to their place and held them with a strong grip. I waited. By and by I felt a faint tug, and took a fresh grip. The tug strengthened to a steady strain—it grew stronger and stronger. My hold parted, and for the third time the blankets slid away. I groaned. An answering groan came from the foot of the bed! Beaded drops of sweat stood upon my forehead. I was more dead than alive. Presently I heard a heavy footstep in my room—the step of an elephant, it seemed to me—it was not like anything human. But it was moving from me—there was relief in that. I heard it approach the door —pass out without moving bolt or lock—and wander away among the dismal corridors, straining the floors and joists till they creaked again as it passed—and then silence reigned once more.\nWhen my excitement had calmed, I said to myself, \"This is a dream—simply a hideous dream.\" And so I lay thinking it over until I convinced myself that it was a dream, and then a comforting laugh relaxed my lips and I was happy again. I got up and struck a light; and when I found that the locks and bolts were just as I had left them, another soothing laugh welled in my heart and rippled from my lips. I took my pipe and lit it, and was just sitting down before the fire, when-down went the pipe out of my nerveless fingers, the blood forsook my cheeks, and my placid breathing was cut short with a gasp! In the ashes on the hearth, side by side with my own bare footprint, was another, so vast that in comparison mine was but an infant's! Then I had had a visitor, and the elephant tread was explained.\nI put out the light and returned to bed, palsied with fear. I lay a long time, peering into the darkness, and listening.—Then I heard a grating noise overhead, like the dragging of a heavy body across the floor; then the throwing down of the body, and the shaking of my windows in response to the concussion. In distant parts of the building I heard the muffled slamming of doors. I heard, at intervals, stealthy footsteps creeping in and out among the corridors, and up and down the stairs. Sometimes these noises approached my door, hesitated, and went away again. I heard the clanking of chains faintly, in remote passages, and listened while the clanking grew nearer—while it wearily climbed the stairways, marking each move by the loose surplus of chain that fell with an accented rattle upon each succeeding step as the goblin that bore it advanced. I heard muttered sentences; half-uttered screams that seemed smothered violently; and the swish of invisible garments, the rush of invisible wings. Then I became conscious that my chamber was invaded—that I was not alone. I heard sighs and breathings about my bed, and mysterious whisperings. Three little spheres of soft phosphorescent light appeared on the ceiling directly over my head, clung and glowed there a moment, and then dropped —two of them upon my face and one upon the pillow. They, spattered, liquidly, and felt warm. Intuition told me they had—turned to gouts of blood as they fell—I needed no light to satisfy myself of that. Then I saw pallid faces, dimly luminous, and white uplifted hands, floating bodiless in the air—floating a moment and then disappearing. The whispering ceased, and the voices and the sounds, and a solemn stillness followed. I waited and listened. I felt that I must have light or die. I was weak with fear. I slowly raised myself toward a sitting posture, and my face came in contact with a clammy hand! All strength went from me apparently, and I fell back like a stricken invalid. Then I heard the rustle of a garment it seemed to pass to the door and go out.\nWhen everything was still once more, I crept out of bed, sick and feeble, and lit the gas with a hand that trembled as if it were aged with a hundred years. The light brought some little cheer to my spirits. I sat down and fell into a dreamy contemplation of that great footprint in the ashes. By and by its outlines began to waver and grow dim. I glanced up and the broad gas-flame was slowly wilting away. In the same moment I heard that elephantine tread again. I noted its approach, nearer and nearer, along the musty halls, and dimmer and dimmer the light waned. The tread reached my very door and paused—the light had dwindled to a sickly blue, and all things about me lay in a spectral twilight. The door did not open, and yet I felt a faint gust of air fan my cheek, and presently was conscious of a huge, cloudy presence before me. I watched it with fascinated eyes. A pale glow stole over the Thing; gradually its cloudy folds took shape—an arm appeared, then legs, then a body, and last a great sad face looked out of the vapor. The majestic Cardiff Giant loomed above me!\nAll my misery vanished—for a child might know that no harm could come with that benignant countenance. My cheerful spirits returned at once, and in sympathy with them the gas flamed up brightly again. Never a lonely outcast was so glad to welcome company as I was to greet the friendly giant. I said:\n\"Why, is it nobody but you? Do you know, I have been scared to death for the last two or three hours? I am most honestly glad to see you. I wish I had a chair—Here, here, don't try to sit down in that thing—\"\nBut it was too late. He was in it before I could stop him and down he went—I never saw a chair shivered so in my life.\n\"Stop, stop, you'll ruin ev—\"\nToo late again. There was another crash, and another chair was resolved into its original elements.\n\"Confound it, haven't you got any judgment at' all? Do you want to ruin all the furniture on the place? Here, here, you petrified fool—\"\nBut it was no use. Before I could arrest him he had sat down on the bed, and it was a melancholy ruin.\n\"Now what sort of a way is that to do? First you come lumbering about the place bringing a legion of vagabond goblins along with you to worry me to death and then you repay me by wrecking all the furniture you can find to sit down on. And why will you? You damage yourself as much as you do me. You have broken off the end of your spinal column, and littered up the floor with chips of your hams till the place looks like a marble yard. You ought to be ashamed of yourself—you are big enough to know better.\"\n\"Well, I will not break any more furniture. But what am I to do? I have not had a chance to sit down for a century.\" And the tears came into his eyes.\n\"Poor devil,\" I said, \"I should not have been so harsh with you. And you are an orphan, too, no doubt. But sit down on the floor here—nothing else can stand your weight—and besides, we cannot be sociable with you away up there above me; I want you down where I can perch on this high counting-house stool and gossip with you face to face.\" So he sat down on the floor, and lit a pipe which I gave him, threw one of my red blankets over his shoulders, inverted my sitz-bath on his head, helmet fashion, and made himself picturesque and comfortable. Then he crossed his ankles, while I renewed the fire. We talked along for half an hour, and then I noticed that he looked tired, and spoke of it.\n\"Tired?\" he said. \"Well, I should think so. And now I will tell you all about it, since you have treated me so well. I am the spirit of the Petrified Man that lies across the street there in the museum. I am the ghost of the Cardiff Giant. I can have no rest, no peace, till they have given that poor body burial again. Now what was the most natural thing for me to do, to make men satisfy this wish? Terrify them into it! haunt the place where the body lay! So I haunted the museum night after night. I even got other spirits to help me. But it did no good, for nobody ever came to the museum at midnight. Then it occurred to me to come over the way and haunt this place a little. I felt that if I ever got a hearing I must succeed, for I had the most efficient company that perdition could furnish. Night after night we have shivered around through these mildewed halls, dragging chains, groaning, whispering, tramping up and down stairs, till, to tell you the truth, I am almost worn out. But when I saw a light in your room to-night I roused my energies again and went at it with a deal of the old freshness. But I am tired out—entirely exhausted. Give me, I beseech you, give me some hope!\" I lit off my perch in a burst of excitement, and exclaimed:\n\"This transcends everything! everything that ever did occur! Why you poor blundering old fossil, you have had all your trouble for nothing—you have been haunting a plaster cast of yourself—the real Cardiff Giant is in Albany!—[A fact. The original fraud was ingeniously and fraudfully duplicated, and exhibited in New York as the \"only genuine\" Cardiff Giant (to the unspeakable disgust of the owners of the real colossus) at the very same time that the latter was drawing crowds at a museum is Albany,]—Confound it, don't you know your own remains?\"\nI never saw such an eloquent look of shame, of pitiable humiliation, overspread a countenance before.\nThe Petrified Man rose slowly to his feet, and said:\n\"Honestly, is that true?\"\n\"As true as I am sitting here.\"\nHe took the pipe from his mouth and laid it on the mantel, then stood irresolute a moment (unconsciously, from old habit, thrusting his hands where his pantaloons pockets should have been, and meditatively dropping his chin on his chest); and finally said:\n\"Well—I never felt so absurd before. The Petrified Man has sold everybody else, and now the mean fraud has ended by selling its own ghost! My son, if there is any charity left in your heart for a poor friendless phantom like me, don't let this get out. Think how you would feel if you had made such a fool of yourself.\"\nI heard his stately tramp die away, step by step down the stairs and out into the deserted street, and felt sorry that he was gone, poor fellow —and sorrier still that he had carried off my red blanket and my bath-tub.", "Read the play, paying particular attention to how the dialogue reveals details about both characters.\n\nA Medieval Romance\nChapter 1: The Secret Revealed\nBy Mark Twain\n\nIt was night. Stillness reigned in the grand old feudal castle of Klugenstein. The year 1222 was drawing to a close. Far away up in the tallest of the castle's towers a single light glimmered. A secret council was being held there. The stern old lord of Klugenstein sat in a chair of state meditating. Presently he, said, with a tender accent:\n\"My daughter!\"\nA young man of noble presence, clad from head to heel in knightly mail, answered:\n\"Speak, father!\"\n\"My daughter, the time is come for the revealing of the mystery that hath puzzled all your young life. Know, then, that it had its birth in the matters which I shall now unfold. My brother Ulrich is the great Duke of Brandenburgh. Our father, on his deathbed, decreed that if no son were born to Ulrich, the succession should pass to my house, provided a son were born to me. And further, in case no son, were born to either, but only daughters, then the succession should pass to Ulrich's daughter, if she proved stainless; if she did not, my daughter should succeed, if she retained a blameless name. And so I, and my old wife here, prayed fervently for the good boon of a son, but the prayer was vain. You were born to us. I was in despair. I saw the mighty prize slipping from my grasp, the splendid dream vanishing away. And I had been so hopeful! Five years had Ulrich lived in wedlock, and yet his wife had borne no heir of either sex.\n\"'But hold,' I said, 'all is not lost.' A saving scheme had shot athwart my brain. You were born at midnight. Only the leech, the nurse, and six waiting-women knew your sex. I hanged them every one before an hour had sped. Next morning all the barony went mad with rejoicing over the proclamation that a son was born to Klugenstein, an heir to mighty Brandenburgh! And well the secret has been kept. Your mother's own sister nursed your infancy, and from that time forward we feared nothing.\n\"When you were ten years old, a daughter was born to Ulrich. We grieved, but hoped for good results from measles, or physicians, or other natural enemies of infancy, but were always disappointed. She lived, she throve —Heaven's malison upon her! But it is nothing. We are safe. For, Ha-ha! have we not a son? And is not our son the future Duke? Our well-beloved Conrad, is it not so?—for, woman of eight-and-twenty years —as you are, my child, none other name than that hath ever fallen to you!\n\"Now it hath come to pass that age hath laid its hand upon my brother, and he waxes feeble. The cares of state do tax him sore. Therefore he wills that you shall come to him and be already Duke—in act, though not yet in name. Your servitors are ready—you journey forth to-night.\n\"Now listen well. Remember every word I say. There is a law as old as Germany that if any woman sit for a single instant in the great ducal chair before she hath been absolutely crowned in presence of the people, SHE SHALL DIE! So heed my words. Pretend humility. Pronounce your judgments from the Premier's chair, which stands at the foot of the throne. Do this until you are crowned and safe. It is not likely that your sex will ever be discovered; but still it is the part of wisdom to make all things as safe as may be in this treacherous earthly life.\"\n\"Oh, my father, is it for this my life hath been a lie! Was it that I might cheat my unoffending cousin of her rights? Spare me, father, spare your child!\"\n\"What, huzzy! Is this my reward for the august fortune my brain has wrought for thee? By the bones of my father, this puling sentiment of thine but ill accords with my humor. Betake thee to the Duke, instantly! And beware how thou meddlest with my purpose!\"\nLet this suffice, of the conversation. It is enough for us to know that the prayers, the entreaties and the tears of the gentle-natured girl availed nothing. They nor anything could move the stout old lord of Klugenstein. And so, at last, with a heavy heart, the daughter saw the castle gates close behind her, and found herself riding away in the darkness surrounded by a knightly array of armed, vassals and a brave following of servants.\nThe old baron sat silent for many minutes after his daughter's departure, and then he turned to his sad wife and said:\n\"Dame, our matters seem speeding fairly. It is full three months since I sent the shrewd and handsome Count Detzin on his devilish mission to my brother's daughter Constance. If he fail, we are not wholly safe; but if he do succeed, no power can bar our girl from being Duchess e'en though ill-fortune should decree she never should be Duke!\"\n\"My heart is full of bodings, yet all may still be well.\"\n\"Tush, woman! Leave the owls to croak. To bed with ye, and dream of Brandenburgh and grandeur!\""]}, {"unit": "Comprehension Skills", "topic": "Dialogue and Incidents as Driving Forces of Plot and Characterization", "lesson": "Analyze how incidents can reveal details about characters", "texts": ["Read the story, paying particular attention to how incidents reveal details about the characters.\n\nTwo Friends\nBy Guy de Maupassant\n\nBesieged Paris was in the throes of famine. Even the sparrows on the roofs and the rats in the sewers were growing scarce. People were eating anything they could get.\nAs Monsieur Morissot, watchmaker by profession and idler for the nonce, was strolling along the boulevard one bright January morning, his hands in his trousers pockets and stomach empty, he suddenly came face to face with an acquaintance—Monsieur Sauvage, a fishing chum.\nBefore the war broke out Morissot had been in the habit, every Sunday morning, of setting forth with a bamboo rod in his hand and a tin box on his back. He took the Argenteuil train, got out at Colombes, and walked thence to the Ile Marante. The moment he arrived at this place of his dreams he began fishing, and fished till nightfall.\nEvery Sunday he met in this very spot Monsieur Sauvage, a stout, jolly, little man, a draper in the Rue Notre Dame de Lorette, and also an ardent fisherman. They often spent half the day side by side, rod in hand and feet dangling over the water, and a warm friendship had sprung up between the two. Some days they did not speak; at other times they chatted; but they understood each other perfectly without the aid of words, having similar tastes and feelings.\nIn the spring, about ten o'clock in the morning, when the early sun caused a light mist to float on the water and gently warmed the backs of the two enthusiastic anglers, Morissot would occasionally remark to his neighbor: \"My, but it's pleasant here.\"\nTo which the other would reply: \"I can't imagine anything better!\"\nAnd these few words sufficed to make them understand and appreciate each other.\nIn the autumn, toward the close of day, when the setting sun shed a blood-red glow over the western sky, and the reflection of the crimson clouds tinged the whole river with red, brought a glow to the faces of the two friends, and gilded the trees, whose leaves were already turning at the first chill touch of winter, Monsieur Sauvage would sometimes smile at Morissot, and say: \"What a glorious spectacle!\"\nAnd Morissot would answer, without taking his eyes from his float: \"This is much better than the boulevard, isn't it?\"\nThis time, as soon as they recognized each other on the boulevard, they shook hands cordially, affected at the thought of meeting under such changed circumstances of war.\nMonsieur Sauvage, with a sigh, murmured: \"These are sad times!\"\nMorissot shook his head mournfully. \"And such weather! This is the first fine day of the year.\"\nThe sky was, in fact, of a bright, cloudless blue.\nThey walked along, side by side, reflective and sad.\n\"And to think of the fishing!\" said Morissot. \"What good times we used to have!\"\n\"When shall we be able to fish again?\" asked Monsieur Sauvage.\nThey entered a small cafe and had a drink together, then resumed their walk along the pavement.\nIt was a fine, mild day, and a gentle breeze fanned their faces. Monsieur Sauvage stopped suddenly, saying: \"Suppose we go there?\"\n\"Where?\"\n\"Fishing.\"\n\"But where?\"\n\"Why, to the old place. The French outposts are close to Colombes. I know Colonel Dumoulin, and we shall easily get leave to pass.\"\nMorissot trembled with desire.\n\"Very well. I agree.\"\nAnd they separated, to fetch their rods and lines.\nAn hour later they were walking side by side on the-highroad. Presently they reached the villa occupied by the colonel. He smiled at their request, and granted it. They resumed their walk, furnished with a password.\nSoon they left the outposts behind them, made their way through deserted Colombes, and found themselves on the outskirts of the small vineyards which border the Seine. It was about eleven o'clock.\nBefore them lay the village of Argenteuil, apparently lifeless. The heights of Orgement and Sannois dominated the landscape. The great plain, extending as far as Nanterre, was empty, quite empty-a waste of dun-colored soil and bare cherry trees.\nMonsieur Sauvage, pointing to the heights, murmured: \"The Prussians are up yonder!\"\nAnd the sight of the deserted country filled the two friends with vague misgivings.\nThe Prussians! They had never seen them as yet, but they had felt their presence in the neighborhood of Paris for months past—ruining France, pillaging, massacring, starving them. And a kind of superstitious terror mingled with the hatred they already felt toward this unknown, victorious nation.\n\"Suppose we were to meet any of them?\" said Morissot.\n\"We'd offer them some fish,\" replied Monsieur Sauvage, with that Parisian light-heartedness which nothing can wholly quench.\nStill, they hesitated to show themselves in the open country, overawed by the utter silence which reigned around them.\nAt last Monsieur Sauvage said boldly:\n\"Come, we'll make a start; only let us be careful!\"\nAnd they made their way through one of the vineyards, bent double, creeping along beneath the cover afforded by the vines, with eye and ear alert.\nA strip of bare ground remained to be crossed before they could gain the river bank. They ran across this, and, as soon as they were at the water's edge, concealed themselves among the dry reeds.\nMorissot placed his ear to the ground, to ascertain, if possible, whether footsteps were coming their way. He heard nothing. They seemed to be utterly alone.\nTheir confidence was restored, and they began to fish.\nBefore them the deserted Ile Marante hid them from the farther shore. The little restaurant was closed, and looked as if it had been deserted for years.\nMonsieur Sauvage caught the first gudgeon, Monsieur Morissot the second, and almost every moment one or other raised his line with a little, glittering, silvery fish wriggling at the end; they were having excellent sport.\nThey slipped their catch gently into a close-meshed bag lying at their feet; they were filled with joy—the joy of once more indulging in a pastime of which they had long been deprived.\nThe sun poured its rays on their backs; they no longer heard anything or thought of anything. They ignored the rest of the world; they were fishing.\nBut suddenly a rumbling sound, which seemed to come from the bowels of the earth, shook the ground beneath them: the cannon were resuming their thunder.\nMorissot turned his head and could see toward the left, beyond the banks of the river, the formidable outline of Mont-Valerien, from whose summit arose a white puff of smoke.\nThe next instant a second puff followed the first, and in a few moments a fresh detonation made the earth tremble.\nOthers followed, and minute by minute the mountain gave forth its deadly breath and a white puff of smoke, which rose slowly into the peaceful heaven and floated above the summit of the cliff.\nMonsieur Sauvage shrugged his shoulders. \"They are at it again!\" he said.\nMorissot, who was anxiously watching his float bobbing up and down, was suddenly seized with the angry impatience of a peaceful man toward the madmen who were firing thus, and remarked indignantly: \"What fools they are to kill one another like that!\"\n\"They're worse than animals,\" replied Monsieur Sauvage.\nAnd Morissot, who had just caught a bleak, declared: \"And to think that it will be just the same so long as there are governments!\"\n\"The Republic would not have declared war,\" interposed Monsieur Sauvage.\nMorissot interrupted him: \"Under a king we have foreign wars; under a republic we have civil war.\"\nAnd the two began placidly discussing political problems with the sound common sense of peaceful, matter-of-fact citizens—agreeing on one point: that they would never be free. And Mont-Valerien thundered ceaselessly, demolishing the houses of the French with its cannon balls, grinding lives of men to powder, destroying many a dream, many a cherished hope, many a prospective happiness; ruthlessly causing endless woe and suffering in the hearts of wives, of daughters, of mothers, in other lands.\n\"Such is life!\" declared Monsieur Sauvage.\n\"Say, rather, such is death!\" replied Morissot, laughing.\nBut they suddenly trembled with alarm at the sound of footsteps behind them, and, turning round, they perceived close at hand four tall, bearded men, dressed after the manner of livery servants and wearing flat caps on their heads. They were covering the two anglers with their rifles.\nThe rods slipped from their owners' grasp and floated away down the river.\nIn the space of a few seconds they were seized, bound, thrown into a boat, and taken across to the Ile Marante.\nAnd behind the house they had thought deserted were about a score of German soldiers.\nA shaggy-looking giant, who was bestriding a chair and smoking a long clay pipe, addressed them in excellent French with the words: \"Well, gentlemen, have you had good luck with your fishing?\"\nThen a soldier deposited at the officer's feet the bag full of fish, which he had taken care to bring away. The Prussian smiled. \"Not bad, I see. But we have something else to talk about. Listen to me, and don't be alarmed: You must know that, in my eyes, you are two spies sent to reconnoiter me and my movements. Naturally, I capture you and I shoot you. You pretended to be fishing, the better to disguise your real errand. You have fallen into my hands, and must take the consequences. Such is war. But as you came here through the outposts you must have a password for your return. Tell me that password and I will let you go.\"\nThe two friends, pale as death, stood silently side by side, a slight fluttering of the hands alone betraying their emotion.\n\"No one will ever know,\" continued the officer. \"You will return peacefully to your homes, and the secret will disappear with you. If you refuse, it means death—instant death. Choose!\"\nThey stood motionless, and did not open their lips.\nThe Prussian, perfectly calm, went on, with hand outstretched toward the river: \"Just think that in five minutes you will be at the bottom of that water. In five minutes! You have relations, I presume?\"\nMont-Valerien still thundered.\nThe two fishermen remained silent. The German turned and gave an order in his own language. Then he moved his chair a little way off, that he might not be so near the prisoners, and a dozen men stepped forward, rifle in hand, and took up a position, twenty paces off.\n\"I give you one minute,\" said the officer; \"not a second longer.\"\nThen he rose quickly, went over to the two Frenchmen, took Morissot by the arm, led him a short distance off, and said in a low voice: \"Quick! the password! Your friend will know nothing. I will pretend to relent.\"\nMorissot answered not a word.\nThen the Prussian took Monsieur Sauvage aside in like manner, and made him the same proposal.\nMonsieur Sauvage made no reply.\nAgain they stood side by side.\nThe officer issued his orders; the soldiers raised their rifles.\nThen by chance Morissot's eyes fell on the bag full of gudgeon lying in the grass a few feet from him.\nA ray of sunlight made the still quivering fish glisten like silver. And Morissot's heart sank. Despite his efforts at self-control his eyes filled with tears.\n\"Good-by, Monsieur Sauvage,\" he faltered.\n\"Good-by, Monsieur Morissot,\" replied Sauvage.\nThey shook hands, trembling from head to foot with a dread beyond their mastery.\nThe officer cried: \"Fire!\"\nThe twelve shots were as one.\nMonsieur Sauvage fell forward instantaneously. Morissot, being the taller, swayed slightly and fell across his friend with face turned skyward and blood oozing from a rent in the breast of his coat.\nThe German issued fresh orders.\nHis men dispersed, and presently returned with ropes and large stones, which they attached to the feet of the two friends; then they carried them to the river bank.\nMont-Valerien, its summit now enshrouded in smoke, still continued to thunder.\nTwo soldiers took Morissot by the head and the feet; two others did the same with Sauvage. The bodies, swung lustily by strong hands, were cast to a distance, and, describing a curve, fell feet foremost into the stream.\nThe water splashed high, foamed, eddied, then grew calm; tiny waves lapped the shore.\nA few streaks of blood flecked the surface of the river.\nThe officer, calm throughout, remarked, with grim humor: \"It's the fishes' turn now!\"\nThen he retraced his way to the house.\nSuddenly he caught sight of the net full of gudgeons, lying forgotten in the grass. He picked it up, examined it, smiled, and called: \"Wilhelm!\"\nA white-aproned soldier responded to the summons, and the Prussian, tossing him the catch of the two murdered men, said: \"Have these fish fried for me at once, while they are still alive; they'll make a tasty dish.\"\nThen he resumed his pipe.", "Read the story, paying particular attention to how incidents reveal details about the characters.\n\nThe Nightingale and the Rose\nBy Oscar Wilde\n\n\"She said that she would dance with me if I brought her red roses,\" cried the young Student; \"but in all my garden there is no red rose.\"\nFrom her nest in the holm-oak tree the Nightingale heard him, and she looked out through the leaves, and wondered.\n\"No red rose in all my garden!\" he cried, and his beautiful eyes filled with tears. \"Ah, on what little things does happiness depend! I have read all that the wise men have written, and all the secrets of philosophy are mine, yet for want of a red rose is my life made wretched.\"\n\"Here at last is a true lover,\" said the Nightingale. \"Night after night have I sung of him, though I knew him not: night after night have I told his story to the stars, and now I see him. His hair is dark as the hyacinth-blossom, and his lips are red as the rose of his desire; but passion has made his face like pale ivory, and sorrow has set her seal upon his brow.\"\n\"The Prince gives a ball to-morrow night,\" murmured the young Student, \"and my love will be of the company. If I bring her a red rose she will dance with me till dawn. If I bring her a red rose, I shall hold her in my arms, and she will lean her head upon my shoulder, and her hand will be clasped in mine. But there is no red rose in my garden, so I shall sit lonely, and she will pass me by. She will have no heed of me, and my heart will break.\"\n\"Here indeed is the true lover,\" said the Nightingale. \"What I sing of, he suffers—what is joy to me, to him is pain. Surely Love is a wonderful thing. It is more precious than emeralds, and dearer than fine opals. Pearls and pomegranates cannot buy it, nor is it set forth in the marketplace. It may not be purchased of the merchants, nor can it be weighed out in the balance for gold.\"\n\"The musicians will sit in their gallery,\" said the young Student, \"and play upon their stringed instruments, and my love will dance to the sound of the harp and the violin. She will dance so lightly that her feet will not touch the floor, and the courtiers in their gay dresses will throng round her. But with me she will not dance, for I have no red rose to give her\"; and he flung himself down on the grass, and buried his face in his hands, and wept.\n\"Why is he weeping?\" asked a little Green Lizard, as he ran past him with his tail in the air.\n\"Why, indeed?\" said a Butterfly, who was fluttering about after a sunbeam.\n\"Why, indeed?\" whispered a Daisy to his neighbour, in a soft, low voice.\n\"He is weeping for a red rose,\" said the Nightingale.\n\"For a red rose?\" they cried; \"how very ridiculous!\" and the little Lizard, who was something of a cynic, laughed outright.\nBut the Nightingale understood the secret of the Student's sorrow, and she sat silent in the oak-tree, and thought about the mystery of Love.\nSuddenly she spread her brown wings for flight, and soared into the air. She passed through the grove like a shadow, and like a shadow she sailed across the garden.\nIn the centre of the grass-plot was standing a beautiful Rose-tree, and when she saw it she flew over to it, and lit upon a spray.\n\"Give me a red rose,\" she cried, \"and I will sing you my sweetest song.\"\nBut the Tree shook its head.\n\"My roses are white,\" it answered; \"as white as the foam of the sea, and whiter than the snow upon the mountain. But go to my brother who grows round the old sun-dial, and perhaps he will give you what you want.\"\nSo the Nightingale flew over to the Rose-tree that was growing round the old sun-dial.\n\"Give me a red rose,\" she cried, \"and I will sing you my sweetest song.\"\nBut the Tree shook its head.\n\"My roses are yellow,\" it answered; \"as yellow as the hair of the mermaiden who sits upon an amber throne, and yellower than the daffodil that blooms in the meadow before the mower comes with his scythe. But go to my brother who grows beneath the Student’s window, and perhaps he will give you what you want.\"\nSo the Nightingale flew over to the Rose-tree that was growing beneath the Student's window.\n\"Give me a red rose,\" she cried, \"and I will sing you my sweetest song.\"\nBut the Tree shook its head.\n\"My roses are red,\" it answered, \"as red as the feet of the dove, and redder than the great fans of coral that wave and wave in the ocean-cavern. But the winter has chilled my veins, and the frost has nipped my buds, and the storm has broken my branches, and I shall have no roses at all this year.\"\n\"One red rose is all I want,\" cried the Nightingale, \"only one red rose! Is there no way by which I can get it?\"\n\"There is a way,\" answered the Tree; \"but it is so terrible that I dare not tell it to you.\"\n\"Tell it to me,\" said the Nightingale, \"I am not afraid.\"\n\"If you want a red rose,\" said the Tree, \"you must build it out of music by moonlight, and stain it with your own heart’s-blood. You must sing to me with your breast against a thorn. All night long you must sing to me, and the thorn must pierce your heart, and your life-blood must flow into my veins, and become mine.\"\n\"Death is a great price to pay for a red rose,\" cried the Nightingale, \"and Life is very dear to all. It is pleasant to sit in the green wood, and to watch the Sun in his chariot of gold, and the Moon in her chariot of pearl. Sweet is the scent of the hawthorn, and sweet are the bluebells that hide in the valley, and the heather that blows on the hill. Yet Love is better than Life, and what is the heart of a bird compared to the heart of a man?\"\nSo she spread her brown wings for flight, and soared into the air. She swept over the garden like a shadow, and like a shadow she sailed through the grove.\nThe young Student was still lying on the grass, where she had left him, and the tears were not yet dry in his beautiful eyes.\n\"Be happy,\" cried the Nightingale, \"be happy; you shall have your red rose. I will build it out of music by moonlight, and stain it with my own heart's-blood. All that I ask of you in return is that you will be a true lover, for Love is wiser than Philosophy, though she is wise, and mightier than Power, though he is mighty. Flame-coloured are his wings, and coloured like flame is his body. His lips are sweet as honey, and his breath is like frankincense.\"\nThe Student looked up from the grass, and listened, but he could not understand what the Nightingale was saying to him, for he only knew the things that are written down in books.\nBut the Oak-tree understood, and felt sad, for he was very fond of the little Nightingale who had built her nest in his branches.\n\"Sing me one last song,\" he whispered; \"I shall feel very lonely when you are gone.\"\nSo the Nightingale sang to the Oak-tree, and her voice was like water bubbling from a silver jar.\nWhen she had finished her song the Student got up, and pulled a note-book and a lead-pencil out of his pocket.\n\"She has form,\" he said to himself, as he walked away through the grove—\"that cannot be denied to her; but has she got feeling? I am afraid not. In fact, she is like most artists; she is all style, without any sincerity. She would not sacrifice herself for others. She thinks merely of music, and everybody knows that the arts are selfish. Still, it must be admitted that she has some beautiful notes in her voice. What a pity it is that they do not mean anything, or do any practical good.\" And he went into his room, and lay down on his little pallet-bed, and began to think of his love; and, after a time, he fell asleep.\nAnd when the Moon shone in the heavens the Nightingale flew to the Rose-tree, and set her breast against the thorn. All night long she sang with her breast against the thorn, and the cold crystal Moon leaned down and listened. All night long she sang, and the thorn went deeper and deeper into her breast, and her life-blood ebbed away from her.\nShe sang first of the birth of love in the heart of a boy and a girl. And on the top-most spray of the Rose-tree there blossomed a marvellous rose, petal following petal, as song followed song. Pale was it, at first, as the mist that hangs over the river—pale as the feet of the morning, and silver as the wings of the dawn. As the shadow of a rose in a mirror of silver, as the shadow of a rose in a water-pool, so was the rose that blossomed on the topmost spray of the Tree.\nBut the Tree cried to the Nightingale to press closer against the thorn. \"Press closer, little Nightingale,\" cried the Tree, \"or the Day will come before the rose is finished.\"\nSo the Nightingale pressed closer against the thorn, and louder and louder grew her song, for she sang of the birth of passion in the soul of a man and a maid.\nAnd a delicate flush of pink came into the leaves of the rose, like the flush in the face of the bridegroom when he kisses the lips of the bride. But the thorn had not yet reached her heart, so the rose's heart remained white, for only a Nightingale’s heart’s-blood can crimson the heart of a rose.\nAnd the Tree cried to the Nightingale to press closer against the thorn. \"Press closer, little Nightingale,\" cried the Tree, \"or the Day will come before the rose is finished.\"\nSo the Nightingale pressed closer against the thorn, and the thorn touched her heart, and a fierce pang of pain shot through her. Bitter, bitter was the pain, and wilder and wilder grew her song, for she sang of the Love that is perfected by Death, of the Love that dies not in the tomb.\nAnd the marvellous rose became crimson, like the rose of the eastern sky. Crimson was the girdle of petals, and crimson as a ruby was the heart.\nBut the Nightingale's voice grew fainter, and her little wings began to beat, and a film came over her eyes. Fainter and fainter grew her song, and she felt something choking her in her throat.\nThen she gave one last burst of music. The white Moon heard it, and she forgot the dawn, and lingered on in the sky. The red rose heard it, and it trembled all over with ecstasy, and opened its petals to the cold morning air. Echo bore it to her purple cavern in the hills, and woke the sleeping shepherds from their dreams. It floated through the reeds of the river, and they carried its message to the sea.\n\"Look, look!\" cried the Tree, \"the rose is finished now\"; but the Nightingale made no answer, for she was lying dead in the long grass, with the thorn in her heart.\nAnd at noon the Student opened his window and looked out.\n\"Why, what a wonderful piece of luck!\" he cried; \"here is a red rose! I have never seen any rose like it in all my life. It is so beautiful that I am sure it has a long Latin name\"; and he leaned down and plucked it.\nThen he put on his hat, and ran up to the Professor's house with the rose in his hand.\nThe daughter of the Professor was sitting in the doorway winding blue silk on a reel, and her little dog was lying at her feet.\n\"You said that you would dance with me if I brought you a red rose,\" cried the Student. \"Here is the reddest rose in all the world. You will wear it to-night next your heart, and as we dance together it will tell you how I love you.\"\nBut the girl frowned.\n\"I am afraid it will not go with my dress,\" she answered; \"and, besides, the Chamberlain’s nephew has sent me some real jewels, and everybody knows that jewels cost far more than flowers.\"\n\"Well, upon my word, you are very ungrateful,\" said the Student angrily; and he threw the rose into the street, where it fell into the gutter, and a cart-wheel went over it.\n\"Ungrateful!\" said the girl. \"I tell you what, you are very rude; and, after all, who are you? Only a Student. Why, I don’t believe you have even got silver buckles to your shoes as the Chamberlain’s nephew has\"; and she got up from her chair and went into the house.\n\"What I a silly thing Love is,\" said the Student as he walked away. \"It is not half as useful as Logic, for it does not prove anything, and it is always telling one of things that are not going to happen, and making one believe things that are not true. In fact, it is quite unpractical, and, as in this age to be practical is everything, I shall go back to Philosophy and study Metaphysics.\"\nSo he returned to his room and pulled out a great dusty book, and began to read."]}, {"unit": "Comprehension Skills", "topic": "Dialogue and Incidents as Driving Forces of Plot and Characterization", "lesson": "Analyze how dialogue can cause an action or decision", "texts": ["In this excerpt, a young girl named Rose is discussing a decision with her uncle.\n\nAdapted from\nEight Cousins\nBy Louisa May Alcott\n\n\"Phebe ought to have a holiday like the rest of us. It's too bad to leave her out,\" thought Rose.\nThis thought came back to Rose several times that evening, for Phebe would have added much to the little concert they had in the moonlight, would have enjoyed the stories told, been quick at guessing the conundrums, and laughed with all her heart at the fun. The merry going to bed would have been the best of all, for Rose wanted someone to whisper and giggle and tell secrets, as girls delight to do. Alas, Phebe was a maid, and she was needed for work at the big house.\nLong after the rest were asleep, Rose lay wide awake, excited by the novelty of all about her, and a thought that had come into her mind. Maybe she could take Phebe's place for a day? Rose left her tent to enjoy the evening air and ponder this idea.\nFortunately, Uncle Alec saw her before she had time to catch cold, for coming out to tie back the door-flap of his tent for more air, he beheld the small figure perched in the moonlight. Having no fear of ghosts, he quietly approached, and, seeing that she was wide awake, said, with a hand on her shining hair,\n\"What is my girl doing here?\"\n\"Having a good time,\" answered Rose, not at all startled.\n\"I wonder what she was thinking about with such a sober look.\"\n\"The story you told of the brave sailor who gave up his place on the raft to the woman, and the last drop of water to the poor baby. People who make sacrifices are very much loved and admired, aren't they?\" she asked, earnestly.\n\"If the sacrifice is a true one. But many of the bravest never are known, and get no praise. That does not lessen their beauty, though perhaps it makes them harder, for we all like sympathy,\" and Uncle Alec sighed a patient sort of sigh.\nRose pondered over the saying as if it pleased her, and then said, with a clear, bright look,\n\"A real sacrifice is giving up something you want or enjoy very much, isn't it?\"\n\"Yes.\"\n\"Doing it one's own self because one loves another person very much and wants her to be happy?\"\n\"Yes.\"\n\"And doing it pleasantly, and being glad about it, and not minding the praise if it doesn't come?\"\n\"Yes, dear, that is the true spirit of self-sacrifice; you seem to understand it, and I dare say you will have many chances in your life to try the real thing. I hope they won't be very hard ones.\"", "Adapted from\nThe Amateur\nBy Richard Harding Davis\n\nAustin Ford was on his way to England to act as the London correspondent of the New York Republic. For three years on that most sensational of the New York dailies he had been the star man, the chief muckraker, the chief sleuth. His interest was in crime. The murderer, the burglar, the strong-arm men who, in side streets, waylay respectable citizens did not appeal to him. The man he studied, pursued, and exposed was the cashier who evolved a new method of covering up his speculations, the dishonest president of an insurance company, the confidence man who used no concealed weapon other than his wit. Toward the criminals he pursued young Ford felt no personal animosity. He harassed them as he would have shot a hawk killing chickens. Not because he disliked the hawk, but because the battle was unequal, and because he felt sorry for the chickens.\nNow his managing editor was sending him to dig up new stories in England. The ship was scheduled to arrive in London in two days.\nRight now, Ford waited for his friend, the ship's doctor, to join him for dinner. The doctor was late, having been called to the widow's room earlier.\nWhen
