 the chance to become a squire, a knight in training.”\nThe crowd made a collective gasp and began to murmur among themselves. The king, while known to be eccentric and half mad, had never done anything so outside royal precedent before.\n“As you know, this is not something that occurs every day. Think carefully before you decide to participate, for anyone who chooses to participate and does not succeed will be banished to the Black Realm forever.”\nThis announcement caused an uproar so loud that not even the royal guards could quiet it. Finally, after the King himself stomped his feet and shouted for order, all noise ceased.\n\nChapter Two: The Quest\n\nSo excited to have heard this news, Jarius could scarcely breathe. Train as a squire to become a knight? How could he refuse? The Black Realm held no fear for him; he already felt banished from all human existence. Who but Theodore knew that he existed?\nJairus squeezed past the crammed, sweaty bodies blocking him from his destiny. He was almost at the gate when a heavy hand swatted him upside the head and knocked him to the ground.\n“I told you to stay behind. You disobeyed my direct orders.” Theodore raised his hand to strike Jairus again when a cold voice stopped him.\n“You, sir, disobeyed mine. The decree was sent out for everyone. How dare you overstep your boundaries and assume you know better than I!”\nTheodore bowed low to the king, who now stood directly in front of him. “Sire, you do not understand! This boy is nothing, mere garbage from the street that I took in and gave shelter to.”\nThe king ignored Theodore and knelt beside Jairus. “Boy, do you wish to join the quest and see if you have what it takes to be my knight?”\nHis eyes averted, Jairus wiped the trickle of blood off his chin and nodded.\n“You risk banishment?”\n“I fear nothing but a life of never trying to be more,” Jairus said and lifted his chin, still staring straight ahead.\nA weathered looking guard with scars upon his face stared down the ragtag group of would-be warriors. The guard unrolled the parchment in his hands and read, “Retrieve the golden horn the dragon protects.”\n“That’s it?” asked a giant man with bulging muscles. “All we have to do is slay the dragon?”\nJairus wasn’t so confident. He had heard stories of the dragon that lived in the forest, but he assumed that they were mere myths for children.\n“That’s it,” the guard said. “Good luck, men and child.” The guard offered Jarius a crooked grin before disappearing behind the stone wall.\nThere was a battle cry of sorts between the men and then everyone dispersed. Jairus was left behind.\n“Psst,” a voice said. “Boy, come here.”\n\nChapter Three: Finding the Dragon\n\nJairus darted his eyes all around. He had never been behind the castle walls before. When his eyes rested on an apple cart, he could see the bent woman beckoning him.\n“What is it?” he asked impatiently. He did not care to be short tempered, but he was in a hurry.\n“Dragon’s blood or dragon’s tears be ever your greatest fear. Do for him that which was never done for you, and live a life renewed,” the woman chanted. She handed him a bunch of wild mint, a bright yellow flower, and a strip of dried meat. She winked at him and pushed her cart away. Jairus then left more confused than before she had spoken.\nJairus knew where the dragon lived; everyone did. The Diamond Forest was an enchanted property that belonged to the fairies of old. They once ruled the lands before giving it back the people. The legend stated that the Diamond Forest was the only place that the fairies asked the humans never to enter.\nJairus stood at the entrance to the Diamond Forest. The path was wide and clear from brush, and wild flowers grew along its border. Nothing had ever looked so welcoming, yet great fear stewed inside of him. He gripped the satchel tied to his waist and thought about the items inside. Mint, flower, and meat . . . he supposed he would just know what to do with them.\n“Dragon’s blood or dragon’s tears, be ever your greatest fear. Do for him that which was never done for you and live a life renewed.” He whispered the words and held out the piece of meat. No one had ever befriended Jairus before. He did not wish to draw blood or cause tears. He would give the dragon what he never had—a gesture of friendship.\n“Stand aside, boy, before you get trampled.”\nA man dressed in animal hides and layered with weapons gave him a shove. Jarius barely caught himself before he fell headlong into the Diamond Forest.\nHe watched as man after man jogged into the forest before deciding to take the risk himself. So far, no rogue fairy had taken anyone out yet. Perhaps it was safe. He ran down the path and soon came upon the other men who had gone before him. Some had fallen and lay gasping for breath on the ground, while others were only beginning to shake and twist.\nIt was as if a voice spoke directly into his ear and told him what to do. Jairus opened his satchel and pulled out the mint leaves. Holding them up to his nose, he continued running. Some of the men reached out to him, but he continued on without stopping. They all had murderous looks in their eyes that frightened Jairus and pushed him faster down the path. He breathed in the spicy scent of mint and didn’t think of what was poisoning the others.\nThe landscape changed as Jairus rounded a corner. Instead of the tall warrior-like trees that guarded the entrance, these trees were wide and blocked out the sky. Jairus heard a loud buzz and saw a cloud of insects flying his way. The bright yellow jackets stood out against the dark backdrop of the Diamond Forest. He wasn’t sure what to do, wasn’t sure what they would do, so he stood and waited. The insects stopped in front of him and formed a barrier, a formidable wall that appeared impenetrable.\n\nChapter Four: Meeting of the Minds\n\nJairus remembered the flower in his bag. He pulled it out and threw it over his shoulder. The insects zoomed away after the morsel and left the path free and clear. He wondered at this strange quest, wondered at the king’s motives, and wondered why the old woman was helping him. Before Jairus could think on these questions any more, he heard a ragged roar filled with rage. All around him the trees were blackened, scorched by fire.\nThe dragon was close.\nJairus had no weapon to defend himself, but he did not need one. He knew what to do. He crawled into the center of the circle of burnt trees and whistled. The dragon flew down from the tops of the trees and landed with a thundering crash. Everything about him was fierce looking. The green scales, the red eyes, and the dagger-sharp tail all terrified Jairus, but he remained confident.\n“Dragon’s blood or dragon’s tears be ever your greatest fear. Do for him that which was never done for you and live a life renewed.” He whispered the words and held out the piece of meat. No one had ever befriended Jairus before. He did not wish to draw blood or cause tears. He would give the dragon what he never had—a gesture of friendship.\nThe dragon took the meat with a tentative bite. His massive teeth grazed Jairus’s hand.The beast shuddered and snorted and fell on his back in front of him. With a trembling hand, Jairus reached out and stroked the soft underbelly of the incredible creature. Glinting beside the dragon was the golden horn. Jairus took the golden horn to the king and became apprenticed as a squire. He learned the ways of the knights and became the most feared warrior in all the land. Everyone knew of Jairus, the friend of dragons.", "Adapted from \"How the Whale Got His Throat\"\nby Rudyard Kipling\n\nIn the sea, once upon a time, O my Best Beloved, there was a Whale, and he ate fishes. He ate the starfish and the garfish, and the crab and the dab, and the plaice and the dace, and the skate and his mate, and the mackereel and the pickereel, and the really truly twirly-whirly eel. All the fishes he could find in all the sea he ate with his mouth—so! Till at last there was only one small fish left in all the sea. He was a small ‘Stute Fish.\nHe swam a little behind the Whale’s right ear, so as to be out of harm’s way.\nThen the Whale stood up on his tail and said, “I’m hungry.”\nAnd the small ‘Stute Fish said in a small ’stute voice, “Noble and generous Cetacean, have you ever tasted Man?”\n“No,” said the Whale. “What is it like?”\n“Nice,” said the small ‘Stute Fish. “Nice, but nubbly.”\n“Then fetch me some,” said the Whale, and he made the sea froth up with his tail.\n“One at a time is enough,” said the ’Stute Fish. “If you swim to latitude Fifty North, longitude Forty West (that is magic), you will find, sitting on a raft, in the middle of the sea, with nothing on but a pair of blue canvas breeches, a pair of suspenders (you must not forget the suspenders, Best Beloved), and a jack-knife, one shipwrecked Mariner, who, it is only fair to tell you, is a man of infinite resource and sagacity.”\nSo the Whale swam and swam to latitude Fifty North, longitude Forty West, as fast as he could swim, and on a raft, in the middle of the sea, with nothing to wear except a pair of blue canvas breeches, a pair of suspenders (you must particularly remember the suspenders, Best Beloved), and a jack-knife, he found one single, solitary shipwrecked Mariner, trailing his toes in the water. (He had his mummy’s leave to paddle, or else he would never have done it, because he was a man of infinite-resource-and-sagacity.)\nThen the Whale opened his mouth back and back and back till it nearly touched his tail, and he swallowed the shipwrecked Mariner, and the raft he was sitting on, and his blue canvas breeches, and the suspenders (which you must not forget), and the jack-knife.\nHe swallowed them all down into his warm, dark, inside cup-boards, and then he smacked his lips—so, and turned round three times on his tail. But as soon as the Mariner, who was a man of infinite resource and sagacity, found himself truly inside the Whale’s warm, dark, inside cupboards, he stumped and he jumped and he thumped and he bumped, and he pranced and he danced, and he banged and he clanged, and he hit and he bit, and he leaped and he creeped, and he prowled and he howled, and he hopped and he dropped, and he cried and he sighed, and he crawled and he bawled, and he stepped and he leapt, and he danced hornpipes where he shouldn’t, and the Whale felt most unhappy indeed. (Have you forgotten the suspenders?)\nSo he said to the ‘Stute Fish, “This man is very nubbly, and besides he is making me hiccough. What shall I do?”\n“Tell him to come out,” said the ’Stute Fish.\nSo the Whale called down his own throat to the shipwrecked Mariner, “Come out and behave yourself. I’ve got the hiccoughs.”\n“Nay, nay!” said the Mariner. “Not so, but far otherwise. Take me to my natal shore and the white cliffs of Albion, and I’ll think about it.” And he began to dance more than ever.\n“You had better take him home,” said the ‘Stute Fish to the Whale. “I ought to have warned you that he is a man of infinite-resource-and-sagacity.”\nSo the Whale swam and swam and swam, with both flippers and his tail, as hard as he could for the hiccoughs, and at last he saw the Mariner’s natal shore and the white cliffs of Albion, and he rushed halfway up the beach, and opened his mouth wide and wide and wide, and said, “Change here for Winchester, Ashuelot, Nashua, Keene, and stations on the Fitchburg Road,” and just as he said “Fitch” the Mariner walked out of his mouth.\nBut while the Whale had been swimming, the Mariner, who was indeed a person of infinite-resource-and-sagacity, had taken his jack-knife and cut up the raft into a little square grating all running criss-cross, and he had tied it firm with his suspenders (now, you know why you were not to forget the suspenders!), and he dragged that grating good and tight into the Whale's throat, and there it stuck! Then he recited the following Sloka, which, as you have not heard it, I will now proceed to relate—\n“By means of a grating I have stopped your ating.”\nFor the Mariner he was also an Hi-ber-ni-an. And he stepped out on the shingle, and went home to his mother, who had given him leave to trail his toes in the water, and he married and lived happily ever afterward. So did the Whale. But from that day on, the grating in his throat, which he could neither cough up nor swallow down, prevented him eating anything except very, very small fish, and that is the reason why whales nowadays never eat men or boys or little girls.\nThe small ‘Stute Fish went and hid himself in the mud under the Doorsills of the Equator. He was afraid that the Whale might be angry with him. The Sailor took the jack-knife home. He was wearing the blue canvas breeches when he walked out on the shingle. The suspenders were left behind, you see, to tie the grating with; and that is the end of that tale."]}, {"unit": "Comprehension Skills", "topic": "Characters, Settings, and Main Events", "lesson": "Compare and contrast events", "texts": ["Read the passage below and answer the questions that follow.\n\nAn Excerpt from \"Time Jumper\"\nby Kimberly Myers\n\n\nCHAPTER 1\nIf I'd known that it was going to be the last day that I spent in Haverford (well, the Haverford of 2013), I might have spent it a little differently.\nBy the time I woke up, both Mom and Dad were at work. There wasn't a whole lot going on yet that summer, so I took my time making breakfast and thought about what I could get into that day. If I remember correctly, I met up with Beth around noon and we went down to the diner on Main Street. Later that night, it was dinner with the family, as usual. I don't think I said anything particularly worthwhile. I mostly gave roundabout or one word answers to my parents' questions about what was new with me. I eventually said goodnight and went upstairs to my room. It all only stands out in my memory so much now because of what happened next.\nCHAPTER 2\nThe next morning, I woke with a start. It felt like I'd only been asleep for a minute, but light was already streaming in through the window. I should have realized that something was off—the light was cold and gray, nothing like the bright beams that should have been there telling me that a summer day was beckoning me outside.\nI swung my legs over the side of the bed and slid my feet to the floor. Instantly, I was wide awake. The thick carpet that normally squished underfoot was gone. I was standing on wide, rough-hewn boards. My eyes darted around the room. Yes, the dimensions were right, but nothing else about my room was. I flew down the stairs, looking for someone in my family who could explain how the house had undergone such a remodel—and a poor one, at that—while I slept. I didn't find anyone.\n\"I have to get out of here. I feel like I'm going crazy,\" I thought. \"I just need to get outside. Wait, what if I'm dreaming?\"\nWalking outside left me feeling like I'd been punched in the stomach. I expected to see the street filled with the normal taxis and cars and lined with businesses opening up for the day. Instead, I saw a tree-lined street, and three buildings. In the place of cars, I saw a horse drawing a wagon.\nIf I was dreaming that morning, I'm still dreaming over a year later.", "Read the story and answer the questions that follow.\n\nThe Alaskan Adventure\nby Kimberly Myers\n\nHow do the people here live like this? Owen wondered as he pulled the blanket over his head and tried to block out the sunlight. The so-called \"black out curtains\" over the bedroom windows weren't living up to their name.\nThe Alaskan wilderness and near-constant daylight wasn't quite what Owen had imagined when school let out for the summer a month before. He closed his eyes and tried to imagine what he would be doing if he was back home. Baseball, swimming, hanging out with friends—it all sounded better than trekking around in the middle of nowhere helping his dad with field research. Who really needed to know about the nesting habits of the Arctic loon anyway? Owen finally drifted to sleep.\nA few minutes later, Owen was roused by his dad's insistent whisper, \"Owen, come over here very slowly.\" Owen sighed and got to his feet, moving slowly over to the clump of grass that his dad was crouched behind. They were out in the field again, collecting data.\nI wonder if he knows how ridiculous he looks, Owen thought. \"What is it, Dad?\" he whispered.\n\"Just look at this. The mother loon is carrying her chicks on her back as she swims. I want to watch them and find out the percentage of time that the chicks spend on their parents' backs versus swimming as they mature.\"\n\"Hm, cool, Dad,\" Owen replied unenthusiastically.\nLater that afternoon, Owen was stretched out in the grass, finally catching up on some sleep when he woke to his father hissing his name from down by the lake. \"Owen! Owen!\" Owen tried to ignore him, but his father continued, \"Come look at this!\"\nOwen jumped to his feet. Instead of obliging his dad, he yelled, \"Dad! I don't care about the stupid loons!\" With that, he turned and stomped back to the jeep.\nThe next few weeks continued almost as usual, but Owen noticed that his dad rarely called him over to come watch the clumsy loon chicks or to take photographs of the nesting pairs. He felt almost sorry about his outburst, but just decided to let things smooth over without saying anything.\nAs the days went on, the hours of daylight gradually shortened and fall approached. One afternoon, by one of the lakes, Owen's dad packed up his equipment and just lay back quietly on the bank, his head pillowed in his interlocked hands behind his neck. Owen moved over and settled down next to him.\n\"What's going on, Dad?\"\n\"Most of the birds are getting ready to migrate now.\"\n\"You mean they're leaving for good?\" Owen asked.\n\"Well, many of them will return next summer, but they are leaving for now,\" his dad answered.\nOwen was surprised at the wave of sadness that washed over him. \"You know, I think I'm going to miss this,\" he admitted slowly.\nHis dad just smiled and then said, \"Well, we'll be migrating soon, too. I'm sure you'll be glad to be home.\"\nThe pair sat outside long after the sun sunk in the sky, listening to the wails and calls of the remaining loons. On the horizon, Owen could just see a hint of the green trailing light that would become more visible throughout the winter. He'd always wanted to see the Northern Lights.\n\"Dad,\" Owen started slowly, \"do you think we could come back next summer?\"\nHis dad's face registered surprise for a moment and then broke into a small smile that Owen knew held more happiness than it let on. \"I think we can manage that, Owen.\""]}, {"unit": "Comprehension Skills", "topic": "Making Predictions and Asking Questions", "lesson": "Ask questions about key details", "texts": []}, {"unit": "Comprehension Skills", "topic": "Making Predictions and Asking Questions", "lesson": "Make predictions by using text features, characteristics of genres, and structures", "texts": []}, {"unit": "Comprehension Skills", "topic": "Print and Digital Sources", "lesson": "Locate information in a variety of sources", "texts": []}, {"unit": "Comprehension Skills", "topic": "Print and Digital Sources", "lesson": "Evaluate the reliability of different sources", "texts": []}, {"unit": "Comprehension Skills", "topic": "Print and Digital Sources", "lesson": "Use multiple sources to answer a question or solve a problem", "texts": []}, {"unit": "Comprehension Skills", "topic": "Multiple Sources", "lesson": "Determine key ideas from several sources on the same topic", "texts": []}, {"unit": "Comprehension Skills", "topic": "Multiple Sources", "lesson": "Synthesize information from multiple sources", "texts": []}, {"unit": "Comprehension Skills", "topic": "Multiple Sources", "lesson": "Organize key ideas from several sources in a logical way", "texts": []}, {"unit": "Comprehension Skills", "topic": "Multiple Sources", "lesson": "Use information from several sources to write about a topic", "texts": []}], "6": [{"unit": "Comprehension Skills", "topic": "Setting a Purpose and Asking Questions", "lesson": "Establish a purpose for reading a text", "texts": []}, {"unit": "Comprehension Skills", "topic": "Setting a Purpose and Asking Questions", "lesson": "Generate questions about texts to deepen understanding", "texts": []}, {"unit": "Comprehension Skills", "topic": "Citing Textual Evidence", "lesson": "Cite evidence from a text to support a claim", "texts": []}, {"unit": "Comprehension Skills", "topic": "Citing Textual Evidence", "lesson": "Make inferences about a text", "texts": []}, {"unit": "Comprehension Skills", "topic": "Citing Textual Evidence", "lesson": "Cite evidence from a text to support an inference", "texts": []}, {"unit": "Comprehension Skills", "topic": "Themes", "lesson": "Understand the difference between theme and main idea", "texts": []}, {"unit": "Comprehension Skills", "topic": "Themes", "lesson": "Compare stated and unstated theme", "texts": []}, {"unit": "Comprehension Skills", "topic": "Themes", "lesson": "Identify theme through character changes", "texts": ["Read the story. Then, answer the questions that follow.\n\nThe Selfish Giant\nBy Oscar Wilde\n\nEvery day, as they were coming from school, the children used to go and play in the Giant's garden. It was a large lovely garden, with soft green grass. Here and there over the grass stood beautiful flowers like stars, and there were twelve peach-trees that in the spring-time broke out into delicate blossoms of pink and pearl, and in the autumn bore rich fruit.\nOne day the Giant came back. He had been to visit his friend the Cornish ogre, and had stayed with him for seven years. When he arrived he saw the children playing in the garden. \"What are you doing here?\" he cried in a very gruff voice, and the children ran away.\"My own garden is my own garden,\" said the Giant; \"any one can understand that, and I will allow nobody to play in it but myself.\" So he built a high wall all round it, and put up a notice-board: TRESPASSERS WILL BE PROSECUTED.\nThe poor children had now nowhere to play. They tried to play on the road, but the road was very dusty and full of hard stones. They used to wander round the high wall when their lessons were over, and talk about the beautiful garden inside. \"How happy we were there,\" they said.\nThen the Spring came, and all over the country there were little blossoms and little birds. Only in the garden of the Selfish Giant it was still winter. The birds did not care to sing in it as there were no children, and the trees forgot to blossom. Once a beautiful flower put its head out from the grass, but when it saw the notice-board it was so sorry for the children that it slipped back into the ground again, and went off to sleep. The only people who were pleased were the Snow and the Frost. \"Spring has forgotten this garden,\" they cried, \"so we will live here all the year round.\" The Snow covered up the grass with her great white cloak, and the Frost painted all the trees silver.\n\"I cannot understand why the Spring is so late in coming,\" said the Selfish Giant, as he sat at the window and looked out at his cold white garden; \"I hope there will be a change in the weather.\" But the Spring never came, nor the Summer, Nor the Autumn.\nOne morning the Giant was lying awake in bed when he heard some lovely music. It sounded so sweet to his ears that he thought it must be the King's musicians passing by. It was really only a little bird singing outside his window, but it seemed the most beautiful music in the world. Then the Hail stopped dancing, and the North Wind ceased roaring.\n\"I believe the Spring has come at last,\" said the Giant; and he looked out and saw a most wonderful sight. The children had crept in through a little hole in the wall, and they were sitting in the branches of the trees. And the trees were so glad to have the children back again that they had covered themselves with blossoms. The birds were flying and twittering with delight, and the flowers were looking up through the green grass.\nThe Giant's heart melted as he looked out. \"How selfish I have been!\" he said; \"now I know why the Spring would not come here. I will knock down the wall, and my garden shall be the children's playground for ever and ever.\" So he crept downstairs and opened the front door quite softly, and went out into the garden.\n\"It is your garden now, little children,\" said the Giant, and he took a great axe and knocked down the wall. And when the people were going to market at twelve o'clock they found the Giant playing with the children in the most beautiful garden they had ever seen.", "Read the text below, adapted from The Life and Adventures of Nicholas by L. Frank Baum. Then, answer the questions that follow.\n\nThe Life and Adventures of Nicholas\nBy L. Frank Baum\n\nOne day, as the Toymaker sat before his door to enjoy the sunshine while he busily carved the head and horns of a toy deer, he looked up and discovered a glittering gang of horsemen approaching through the Valley.\nWhen they drew nearer he saw that the band consisted of a score of men-at-arms, clad in bright armor and bearing in their hands spears and battle-axes. In front of these rode little Bessie Blithesome, the pretty daughter of that proud Lord of Lerd who had once driven the kind Toymaker from his palace. Her horse was pure white, its bridle was covered with glittering gems, and its saddle draped with a rich cloth of gold. The soldiers were sent to protect her from harm while she journeyed.\nThe Toymaker was surprised, but he continued to whittle and to sing until the cavalcade drew up before him. Then the little girl leaned over the neck of her horse and said: “Please, Mr. Toymaker, I want a toy!”\nHer voice was so pleading that the Toymaker jumped up at once and stood beside her. But he was puzzled how to answer her request.\n“You are a rich lord’s daughter,” said he, “and have all that you desire.”\n“Except toys,” Bessie said. “There are no toys in the world but yours.”\n“And I make them for the poor children, who have nothing else to amuse them,” continued the Toymaker.\n“Do poor children love to play with toys more than rich ones?” asked Bessie.\n“I suppose not,” said the Toymaker, thoughtfully.\n“Am I to blame because my father is a lord? Must I be denied the toys I long for because other children are poorer?” she inquired earnestly.\n“I’m afraid you must, dear,” he answered; “for the poor have nothing else with which to amuse themselves. You have your pony to ride, your servants to wait on you, and every comfort that money can procure.”\n“But I want toys!” cried Bessie, wiping away the tears that forced themselves into her eyes. “If I cannot have them, I shall be unhappy.”\nThe Toymaker was troubled, for her grief recalled to him the thought that his desire was to make all children happy, without regard to their condition in life. Yet, while so many poor children were clamoring for his toys he could not bear to give one to them to Bessie Blithesome, who had so much already to make her happy.\n“Listen, my child,” said he, gently; “all the toys I am now making are promised to others. But the next shall be yours, since your heart so longs for it. Come to me again in two days and it shall be ready for you.”\nBessie gave a cry of delight, and kissed the Toymaker upon his forehead, then rode gaily away, leaving him to his work.\n“If I am to supply the rich children as well as the poor ones,” he thought, “I shall not have a spare moment in the whole year! But is it right I should give to the rich? Surely I must go to Necile and talk with her about this matter.”\nSo when he had finished the toy deer, he walked into Burzee and made his way to the bower of the beautiful Nymph Necile, who had been his foster mother. She greeted him tenderly and lovingly, listening with interest to his story of the visit of Bessie Blithesome.\n“And now tell me,” said he, “shall I give toys to rich children?”\n“We of the Forest know nothing of riches,” she replied. “It seems to me that one child is like another child, since they are all made of the same clay, and that riches are like a gown, which may be put on or taken away, leaving the child unchanged. But the Fairies are guardians of mankind, and know mortal children better. Let us call the Fairy Queen.”\nThis was done, and the Queen of the Fairies sat beside them and heard the magical Toymaker relate his reasons for thinking the rich children could get along without his toys, and also what the Nymph had said.\n“Necile is right,” declared the Queen; “for, whether it be rich or poor, a child’s longings for pretty playthings are but natural. Rich Bessie’s heart may suffer as much grief as poor Mayrie’s; she can be just as lonely and discontented, and just as happy. I think, friend, it is your duty to make all little ones glad, whether they chance to live in palaces or in cottages.”\n“Your words are wise, fair Queen,” replied the Toymaker, “and my heart tells me they are as just as they are wise. Hereafter all children may claim my services.”\nThen he bowed before the gracious Fairy, kissed his mother on the cheek, and went back into his Valley."]}, {"unit": "Comprehension Skills", "topic": "Themes", "lesson": "Compare internal and external conflict", "texts": ["Read the excerpt below, paying attention to the conflict of the story.\nExcerpt from\nThe Mad Scientist\nby Joy Kita\n\nMatt shook his head, thinking there must be cotton in his ears. He looked at his fellow guinea pigs who all wore similar horrified expressions and knew he had heard correctly.\n“What are we testing?” he asked.\nThe scientist laughed and rubbed his hands together. “If I tell you that, it will ruin the surprise, and I won’t have genuine reactions for the camera.” They followed his finger and saw the small blinking camera in the corner. “I have them installed everywhere, so I can catch every moment.”\n“Our parents wouldn’t just leave us with a madman,” Maddie cried out. She now had a hold of Grace’s hand.\nThe scientist looked down at the clipboard he was carrying.\n“Maddie? Yes, well your parents didn’t leave you with a madman. They left you with a world renowned behavioral scientist, studying the reactions and methods of gifted children in extreme emotional situations. I might have left out the part of the robotic monsters, but that was a mere oversight.”\n“You’ll have thirty seconds before number one is unleashed. I call him Extreme Bumble.” He left us staring after him, completely unable to move or even react.\n“This has to be a joke, right? Our parents wouldn’t have fallen for this.” Grace looked back and forth at us.\nBefore anyone could agree or disagree, there was a loud rumble. A cross between a motorcycle engine and rabid dog came from the hallway.\n“Hide,” Jay screamed.", "Read the excerpt below, paying attention to the conflict of the story.\nExcerpt from\nKidnapped in Outer Space\nby Joy Kita\n\n“You’ve come to our home. State your business. The Maasuu Muusaa does not tolerate uninvited guests.” It waved one hand and the branches moved away enough we could speak. Then it reached up to tenderly stroke one of limbs.\n“We want our parents back. You took them and the professor, and we’ve come to take them back.” Nathan’s voice shook a little, but I was proud of him regardless.\n“Ah, yes the humans. They are valuable to us, so valuable I’m afraid I can’t give them back just yet.” The orange body jiggled when it laughed, causing more goop than usual to stream from its open pores.\n“What do you want from them?” I asked, trying to keep the tears as far from the brink of no return as I could.\n“We requested the growth formula the professor has designed, but they refused to give it to us.”\n“Can you even eat corn?”\n“Not the point,” it snapped. “We want humans to come to our planet as well, and if we can grow similar plants, they will.”\nThe trees released us completely with another wave from one arm. “You’ll have to come with me.” The alien sighed as though this was a great imposition to him.\nI didn’t want to know and was afraid to ask, but the question burned inside of me. “Why do you want people to come here?”\nIt turned its large overripe melon head and said, “We are hungry.”"]}, {"unit": "Comprehension Skills", "topic": "Themes", "lesson": "Identify theme by analyzing conflict", "texts": ["Text 1: Read the excerpt below, paying close attention to the main conflict of the passage.\n\nThe Great Outdoors\nBy Joy Kita\n\nMarybeth had never been camping before. Her parents were more of the hotel and breakfast-in-bed types. They feared insects as much as they did bears. While others fought to protect the environment, they worked against it: They both worked for the same corporation that made plastics and other environmental dangers.\nWhen Marybeth came home from school and said she wanted to go on a camping trip with the outdoor club, she expected them to laugh or flat out refuse to give her permission. She was right.\n“You are not a part of the outdoor club, dear. You will end your membership immediately,” her mother had said.\n“We do not enjoy the outdoors,” her father insisted.\nBut Marybeth explained that Lisa, her best friend, was going. She also told them that she did not know if she enjoyed the outdoors because she’d never experienced it before. Her parents reluctantly agreed. They cautioned her to not become too invested in something as fickle as the environment.\n“Plastics will outlast the jungle,” her dad told her with pride.\nShe asked if they wanted to come and chaperone, but they just laughed and helped her pack. Her parents insisted she bring a kettle for hot chocolate and an air mattress. Marybeth told them that she would be sleeping only on a blanket and that there would be no electricity.\n“Camping is for barbarians,” her mother responded.\nIt took a lot of reassuring to convince her parents that Marybeth would not be taken captive by a wild bear. She also had to explain that she wouldn’t contract a deadly disease from the fresh air. Finally her parents let her leave the house.\nWhen the fifteen passenger van pulled through the gates to the Canadian provincial park, all Marybeth could see was the incredible spread of beautiful landscape. She knew this trip was worth the effort.\n\nText2:\nRead the excerpt below, paying attention to the main conflict of the story.\n\nThe Great Outdoors\nBy Joy Kita\n\nMarybeth shrugged and headed off down a new path, which they hadn’t investigated the day before. She left behind the other kids reading, sleeping or playing games.\nA soft rustling in the leaves startled her. She stopped her hike and bent down to see what it might be. On the path to her right making its way toward the overgrown foliage was a thick snake, brown with yellow markings. Seeing a snake and not screaming was the first thing that amazed Marybeth about her situation. She was also amazed when she noticed a mouse stuffed inside the snake’s mouth. The tail of a mouse protruded from the reptile. Marybeth jumped back in a mixture of fear and disgust, and the snake made a quick getaway.\nShe wasn’t sure how far she had walked when the sun light disappeared behind sudden gray and black clouds. Marybeth knew she had to head back to camp, but, when she turned around, there was more than one path. She could not remember which one she should take to get back to the campsite.\nRain poured from the sky suddenly as though a switch had been flipped. She ran for cover. She ran off the path to one of the rocks with an overhang. It wasn’t much, but it kept her dry enough so that she didn’t feel the cold and the wind.\nThere was a dazzling, terrifying show of lightning coupled with a rocking harmony of thunder. Waiting out the storm, Marybeth huddled under her rock roof and wondered if the others were worried about her. A shocking boom of thunder sounded right above her, and then she felt the air around her charge with electricity. There was a flash of brilliant light, and then the tree in front of her exploded.\nWhen the storm was over, Marybeth left her shelter shaking and tearful. The tree was still on fire, branches, and smoldering leaves scattered on the ground. She picked her way through the carnage and chose a path she thought might be right and began jogging back to camp. She crossed a clearing she did not recognize, a marsh was in the middle with long grasses and milkweed. Standing knee deep in the water was a Bull Moose looking straight at her. His antlers were as wide as her mother’s car.\n“Wow!” she exclaimed.\nIn all her life she’d never seen anything so wonderful. The sun was beginning to peek out from behind the clouds, black birds shrieked from above, and the moose turned and left quietly. A low croak from an endangered bull frog made her smile.\nBy the time she found the camp, she had a lot of apologizing to do for wandering off without her buddy. Mr. Wilcot especially was upset with her. He made her tell him all the reasons it was dangerous to wander off before he was satisfied.\n“I saw a Bull Moose,” she told him later.\n“Ah, you’ll be back then.” He nodded and gave her a knowing smile.\nYes, she would be back.", "Text1:Read the excerpt from the story The Wonderful Pump below, paying attention to the main conflict of the story.\n\nIn this story, a hard-working farmer's wife saves the life of a magical beetle. In return, he rewards she and her husband with a pump that pumps gold coins rather than water. They are soon very wealthy.\n\nSo they at once took a number of the gold pieces and went to the town to purchase provisions and clothing and many things of which they had long stood in need; but so proud were they of their newly acquired wealth that they took no pains to conceal it. They wanted everyone to know they had money, and so it was no wonder that when some of the wicked men in the village saw the gold they longed to possess it themselves.\n\"If they spend this money so freely,\" whispered one to another, \"there must be a great store of gold at their home.\"\n\"That is true,\" was the answer. \"Let us hasten there before they return and ransack the house.\"\nSo they left the village and hurried away to the farm on the hill, where they broke down the door and turned everything topsy turvy until they had discovered the gold in the wood-box and the teapot. It did not take them long to make this into bundles, which they slung upon their backs and carried off, and it was probably because they were in a great hurry that they did not stop to put the house in order again.\nPresently the good woman and her husband came up the hill from the village with their arms full of bundles and followed by a crowd of small boys who had been hired to help carry the purchases. Then followed others, youngsters and country louts, attracted by the wealth and prodigality of the pair, who, from simple curiosity, trailed along behind like the tail of a comet and helped swell the concourse into a triumphal procession. Last of all came Guggins, the shopkeeper, carrying with much tenderness a new silk dress which was to be paid for when they reached the house, all the money they had taken to the village having been lavishly expended.\nThe farmer, who had formerly been a modest man, was now so swelled with pride that he tipped the rim of his hat over his left ear and smoked a big cigar that was fast making him ill. His wife strutted along beside him like a peacock, enjoying to the full the homage and respect her wealth had won from those who formerly deigned not to notice her, and glancing from time to time at the admiring procession in the rear.\nBut, alas for their new-born pride! when they reached the farmhouse they found the door broken in, the furniture strewn in all directions and their treasure stolen to the very last gold piece.\nThe crowd grinned and made slighting remarks of a personal nature, and Guggins, the shopkeeper, demanded in a loud voice the money for the silk dress he had brought.\nThen the woman whispered to her husband to run and pump some more gold while she kept the crowd quiet, and he obeyed quickly. But after a few moments he returned with a white face to tell her the pump was dry, and not a gold piece could now be coaxed from the spout.\nThe procession marched back to the village laughing and jeering at the farmer and his wife, who had pretended to be so rich; and some of the boys were naughty enough to throw stones at the house from the top of the hill. Mr. Guggins carried away his dress after severely scolding the woman for deceiving him, and when the couple at last found themselves alone their pride had turned to humiliation and their joy to bitter grief.\nJust before sundown the woman dried her eyes and, having resumed her ordinary attire, went to the brook for water. When she came to the flat stone she saw the King Beetle sitting upon it.\n\"The well is dry!\" she cried out, angrily.\n\"Yes,\" answered the beetle, calmly, \"you have pumped from it all the gold my people could find.\"\n\"But we are now ruined,\" said the woman, sitting down in the path beginning to weep; \"for robbers have stolen from us every penny we possessed.\"\n\"I'm sorry,\" returned the beetle; \"but it is your own fault. Had you not made so great a show of your wealth no one would have suspected you possessed a treasure, or thought to rob you. As it is, you have merely lost the gold which others have lost before you. It will probably be lost many times more before the world comes to an end.\"\n\"But what are we to do now?\" she asked.\n\"What did you do before I gave you the money?\"\n\"We worked from morning 'til night,\" said she.\n\"Then work still remains for you,\" remarked the beetle, composedly; \"no one will ever try to rob you of that, you may be sure!\" And he slid from the stone and disappeared for the last time.\n\nText 2:\nRead the story. Then, answer the questions that follow.\n\nThe Boy, the Bear, and the Eagle\n\nOne day, many moons ago when animals and men understood each other, a little Native American boy was left in the woods. An old mother bear found the little boy and felt sorry for him. She took him home to her nice wigwam in the hollow of a big tree. Though she had two cubs of her own, she took the little papoose, hugged him close, and fed him as her own. The boy grew strong. He was very happy with his family, and played with his cub brothers from sundown to sunset.\nOne day, Mother Bear watched her three children as they wrestled joyfully in the forest leaves. But on this day, Mother Bear's heart was heavy. She had heard that the big bear hunters were coming. Their dogs were never known to miss a bear tree. Mother Bear thought she might be able to save herself and her cubs. But what would become of the boy? She loved him too much to let the bear hunters kill him.\nJust then the porcupine, the Chief of the animals, passed by the bear tree. Mother Bear saw him. She put her head out the bear-tree window and called to him.\nHe sat, listening to Mother Bear's story of her fears for the boy. When she had finished, Chief Porcupine said he would call a council of the animals. As soon as the Chief raised his big voice, even the animals away on the longest trails heard. They ran at once and gathered under the council tree. Chief Porcupine told them about the fears of Mother Bear, and of the danger to the boy. \"Now,\" said the Chief, \"which one of you will take the boy and save him from the bear hunters?\"\nBut some of the animals were jealous of man. The beaver, the fox, the wolf, the panther, and deer felt that he was becoming too powerful and had secretly planned to do away with him. So when Chief asked who would take the boy and care for him, each of these animals volunteered.\nMother Bear sat by and listened as each offered to care for the boy. At last she spoke. To the beaver she said, \"You cannot take the boy; you will drown him.\" To the fox she said, \"You cannot take him; you would teach him to cheat and steal. Neither can the wolf or the panther have him, for they are counting on having something good to eat. You, deer, lost your upper teeth from biting humans. And you, raccoon, I cannot trust, for you would coax him to climb so high that he would fall and die. None of you can have the boy.\"\nNow a great bird that lives in the sky had flown into the council tree. When Mother Bear had spoken, this wise old eagle flew down, and said, \"Give the boy to me, Mother Bear. No bird is so swift and strong as the eagle. On my great wings I will bear him far away from the bear hunters and take him to the wigwam of a friend, where a little boy is wanted.\"\nMother Bear looked into the eagle's keen eyes. She saw that he could see far. Then she said, \"Take him, eagle, I trust him to you. I know you will protect the boy.\" The eagle spread wide his great wings. Mother Bear placed the boy on his back, and away they soared, far from the council woods. The eagle left the boy, as he had promised, at the door of a wigwam where a little boy was wanted. This was the first American to be saved by an American eagle.\nThe boy grew to be a noble chief and a great hunter. But never was he known to cut down a bear tree, or to kill a bear, or an eagle for that matter. However, many were the beaver, fox, wolf, panther, and deerskins that hung in his lodge."]}, {"unit": "Comprehension Skills", "topic": "Themes", "lesson": "Identify directly communicated themes in poetry", "texts": []}, {"unit": "Comprehension Skills", "topic": "Themes", "lesson": "Identify the theme of a poem using tone, figurative language, imagery and symbolism", "texts": []}, {"unit": "Comprehension Skills", "topic": "Themes", "lesson": "Identify theme through situational irony", "texts": ["Read the poem below, taking note of what the characters want, what happens to the characters, and what the characters get instead.\n\nAdapted from\nKate Ketchem\nBy Phoebe Cary\n\nKate Ketchem on a winter's night\nWent to a party dressed in white.\nHer chignon in a net of gold,\nWas about as large as they ever sold.\nGayly she went, because her pap\nWas supposed to be a rich old chap.\n\nTom Fudge came slowly through the throng,\nWith chestnut hair, worn pretty long.\nHe saw Kate Ketchem in the crowd,\nAnd knowing her slightly, stopped and bowed;\nThen asked her to give him a single flower,\nSaying he'd think it a priceless dower.\n\nOut from those with which she was decked,\nShe took the poorest she could select.\nAnd blushed as she gave it, looking down\nTo call attention to her gown.\n\"Thanks,\" said Fudge, and he thought how dear\nFlowers must be at that time of year.\n\nKate Ketchem smiled, and said, \"You bet.\nI'll catch that Fudge and his money yet.\nHe's rich enough to keep me in clothes,\nAnd I think I could manage him as I chose.\nHe could aid my father as well as not,\nAnd buy my brother a splendid yacht.\nMy mother for money should never fret,\nAnd all it cried for the baby should get;\nAnd after that, with what he could spare,\nI'd make a show at a charity fair.\"\n\nTom Fudge looked back as he crossed the sill,\nAnd saw Kate Ketchem standing still.\n\"A girl more suited to my mind\nIt isn't an easy thing to find;\nAnd every thing that she has to wear\nProves her as rich as she is fair.\nWould she were mine, and I to-day\nHad the old man's cash my debts to pay!\nNo creditors with a long account,\nNo tradesmen wanting 'that little amount';\nBut all my debts paid up with care\nBy a father-in-law with gold to spare!\n\nSo Tom married Kate for her father's dues\nAn she married him for his wealth too,\nBut as to paying his debts, do you know,\nThe father couldn't see it so;\nAnd at hints for help, Kate's hazel eyes\nLooked out in their innocent surprise.\nAnd when Tom thought of the way he had wed\nHe longed for a single life instead,\nAnd closed his eyes in a sulky mood,\nRegretting the days of his bachelorhood;\nAnd said, in a sort of reckless vein,\n\"I'd like to see her catch me again,\nIf I were free, as on that night\nWhen I saw Kate Ketchem dressed in white!\"\n\nShe wedded him to be rich and gay;\nBut husband and children didn't pay,\nHe wasn't the prize she hoped to draw,\nAnd wouldn't live with his mother-in-law.\nAnd oft when she had to coax and pout\nIn order to get him to take her out,\nShe thought how very attentive and bright\nHe seemed at the party that winter's night;\nOf his laugh, as soft as a breeze of the south,\n('Twas now on the other side of his mouth);\nHow he praised her dress and gems in his talk,\nAs he took a careful account of stock.\n\nSometimes she hated the very walls—\nHated her friends, her dinners, and calls;\nTill her weak affection, to hatred turned,\nLike a dying tallow-candle burned.\nAnd for him who sat there, her peace to mar,\nSmoking his everlasting cigar—\nHe wasn't the man she thought she saw,\nAnd grief was duty, and hate was law.\nSo she took up her burden with a groan,\nSaying only, \"I might have known!\"\n\nAlas for Kate! and alas for Fudge!\nThough I do not owe them any grudge;\nAnd alas for any who find to their shame\nThat two can play at their little game!", "Read the story below, taking note of what the characters want, what happens to the characters, and what the characters get instead.\n\nCasey at the Bat\nBy Phineas Thayer\n\nIt looked extremely rocky for the Mudville nine that day;\nThe score stood two to four with but an inning left to play;\nSo, when Cooney died at second, and Burrows did the same,\nA pallor wreathed the features of the patrons of the game.\n\nA straggling few got up to go, leaving there the rest,\nWith that hope which springs eternal within the human breast,\nFor they thought: \"If only Casey could get a whack at that,\"\nThey'd put up even money now, with Casey at the bat.\n\nBut Flynn preceded Casey, and likewise so did Blake,\nAnd the former was a puddin', and the latter was a fake;\nSo on that stricken multitude a deathlike silence sat.\nFor there seemed but little chance of Casey's getting to the bat,\n\nBut Flynn let drive a \"single,\" to the wonderment of all,\nAnd the much-despised Blakey \"tore the cover off the ball\";\nAnd when the dust had lifted and they saw what had occurred,\nThere was Blakey safe at second, and Flynn a-huggin' third.\n\nThen, from the gladdened multitude went up a joyous yell,\nIt rumbled in the mountain-tops, it rattled in the dell;\nIt struck upon the hillside and rebounded on the flat;\nFor Casey, mighty Casey, was advancing to the bat.\n\nThere was ease in Casey's manner as he stepped into his place,\nThere was pride in Casey's bearing, and a smile on Casey's face.\nAnd when, responding to the cheers, he lightly doffed his hat,\nNo stranger in the crowd could doubt 'twas Casey at the bat.\n\nTen thousand eyes were on him as he rubbed his hands with dirt,\nFive thousand tongues applauded when he wiped them on his shirt;\nThen while the New York pitcher ground the ball into his hip,\nDefiance gleamed in Casey's eye, a sneer curled Casey's lip.\n\nAnd now the leather-covered sphere came hurtling through the air,\nAnd Casey stood a-watching it in haughty grandeur there.\nClose by the sturdy batsman the ball unheeded sped—\n\"That ain't my style,' said Casey. \"Strike one,\" the umpire said.\n\nFrom the benches, black with people, there went up a muffled roar,\nLike the beating of great storm waves on a stern and distant shore.\n\"Kill him! Kill the umpire!\" shouted someone on the stand.\nAnd it's likely they'd have killed him had not Casey raised a hand.\n\nWith a smile of Christian charity great Casey's visage shone;\nHe stilled the rising tumult; he bade the game go on;\nHe signaled to Sir Timothy, once more the spheroid flew;\nBut Casey still ignored it, and the umpire said, \"Strike two.\"\n\n\"Fraud,\" cried the maddened thousands, and echo answered \"Fraud!\"\nBut one scornful look from Casey and the audience was awed.\nThey saw his face grow stern and cold, they saw his muscles strain,\nAnd they knew that Casey wouldn't let that ball go by again.\n\nThe sneer is gone from Casey's lip, his teeth are clenched in hate;\nHe pounds with cruel violence his bat upon the plate;\nAnd now the pitcher holds the ball, and now he lets it go,\nAnd now the air is shattered by the force of Casey's blow.\n\nOh, somewhere in this favored land the sun is shining bright;\nThe band is playing somewhere, and somewhere hearts are light;\nAnd somewhere men are laughing, and somewhere children shout:\nBut there is no joy in Mudville—mighty Casey has struck out."]}, {"unit": "Comprehension Skills", "topic": "Themes", "lesson": "Identify multiple themes in one or more story", "texts": ["Text 1:The Foundling\nMateo leaned his head against the back doorpost of his parents' cottage. The sunset over the village was absolutely beautiful, and he let out a great sigh. When it came to the setting sun, a peasant was as rich as a king.\n\"Come in, Mateo!\" he heard his mother call. \"There's a traveler here with some questions.\" Mateo went into the cottage.\n\"I am Sir Diego,\" said the traveler. \"I'm seeking information about a child who was lost in this area many years ago.\"\n\"Oh!\" cried Mateo's mother. \"Our son, Mateo, is a foundling. We discovered him as a little boy playing in the forest.\"\n\"When?\" asked Sir Diego with a surge of eagerness.\n\"Well, fourteen years ago come December,\" answered Mateo's father. He put a protective arm around the boy. \"What's this about, sir?\"\n\"The king lost a son when the boy slipped through the castle gate into the woods. One of his trusted advisors told him that he had found the body. However, the king just learned that the advisor was a traitor. The boy was never found at all. It is likely that someone took him in and raised him.\"\nMateo could not have been more shocked. He leaned against the table to steady himself. A prince? Could he really be a prince?\nSir Diego said, \"But there are many foundlings every year. The prince had an almond-shaped birthmark in the center of his back.\"\nMateo, never having seen the center of his back, looked at his mother. She shook her head, \"He has no birthmark at all.\"\nAfter a few more questions, they said goodbye to the traveler and settled down to their supper. They were all strangely silent.\n\"What an odd evening,\" Mateo's father murmured with a great sigh. \"I hope it doesn't disappoint you too much, son. For a moment there, we all thought… But you'll always have a home here.\"\nMateo nodded. \"I'd never really wondered where I came from before,\" he thought aloud. \"I've always just been happy here. Now, I wonder if my birthparents miss me.\"\n\"We searched around,\" said his mother. \"A group of travelers came through the town close to that time. We thought you must have wandered from their group, but there was no way to find them or contact them.\"\n\"I wonder if anyone remembers anything about them?\" he asked. \"I mean, you will always be my family, but I can't help thinking there's a whole part of me that's been lost. I'd like to find it.\"\n\nText2:\nRead the two stories.\nUnder the Bed\nTherese cried and threw her arms around her mother's shoulders. \"I don't want you to turn off the light!\" the little girl howled. \"There's a monster under my bed! I'll never be able to fall asleep!\"\n\"There's no such thing,\" her mother assured her. She tried to keep her tone even, but she was at her wit's end. Suddenly, her older daughter Amelie appeared at the door.\n\"Hey, Therese,\" Amelie asked. \"Do you want me to camp on the floor of your room with you?\" Therese shot into her sister's arms with a big hug. Soon, Mom turned the lights out, and the two lay there in the darkness.\n\"Thanks, Amelie,\" Therese said.\n\"I'm your sister. That's what I'm here for. There's nothing to be afraid of,\" Amelie said.\n\"You don't believe me about the monster either,\" Therese said, matter-of-factly.\n\"Oh, no—I know about the monster. I used to sleep in that bed when I was your age.\"\nTherese sat up and stared at her sister. At the same time, a furry purple creature slunk out from under the mattress. It was the size of a cat and had huge paws and a flat tail.\n\"Hi, Jordie,\" said Amelie. The creature sat beside her.\n\"Hi, Amelie,\" it replied politely. \"How have you been? It's been a long time! There's someone new in your bed. I've been trying to scare her out of it for you.\"\nAmelie shook her head, \"That's not necessary. This is my sister Therese. She's very nice, but she thinks you're a monster.\"\nJordie was appalled, \"She's stolen your bed, and she thinks I'm the monster!\"\nTherese finally jumped in, \"You've been scaring me every night!\"\nAmelie knew that Jordie could be defensive, so she put a finger to his lips. \"We're not going to argue about this. Therese is my sister, and she didn't steal this bed. I gave it to her. Now, I expect you to make friends with my little sister and treat her nicely.\"\nJordie agreed heartily. The three had a nice chat for several minutes before Jordie excused himself back to his home.\nAs the sisters resettled themselves for sleep, Amelie said, \"I know things can seem scary when we don't understand them, but I hope you can see that Jordie won't ever hurt you.\"\nTherese didn't answer. She had already fallen asleep.\n\nA Visit to Grandma\nAbram reached for his mother's hand as they entered the retirement home. It smelled of cleaning products and stale flowers, and the lighting was eerily bright. Scary was probably the wrong word, but it was what kept coming to Abram's mind. His heart was racing. He passed by people with thin hair, purple hair, no hair.\nUnaware of his terror, his mother said, \"Your grandmother is so excited to see you. It's been years since we last made it to Florida, and she misses you.\"\nHe remembered their last visit, but Grandma had still had her house then. They hadn't had to pass through all of these creepy hallways to see her back then.\nFinally, his mother said, \"Room 312. Here she is!\" They knocked on the door. Abram's heart sank. What would his grandma be like now that she lived in a place like this? What would she be like now that she couldn't walk on her own? He suddenly realized that he wasn't as afraid of the place as he was of what it might be doing to Grandma.\nThe door opened, and the two went inside. Abram's mother leaned over to hug Grandma in her chair. Abram sheepishly hugged his grandmother. She pulled him into a tight hug.\nThe older woman poured out her words without a pause for breath, \"Abram! I can't believe how big you've gotten! I've been so excited for our visit. I hear that you've been into airplanes lately, so I have a surprise for you.\"\nShe led them down a hall and out onto a patio. A beautiful garden surrounded them. Half a dozen people waited there to greet them. She explained, \"These are all former pilots—they've flown everything, from World War II into the 1990s! I think you'll really enjoy their stories.\"\nHours later, Abram and his mother had taken Grandma out for dinner. While they waited for the meal, Abram retold the most exciting stories he had heard that afternoon.\nThe next day, Abram dragged his mother eagerly down the halls of the retirement home and back to room 312.", "Text 1: Everybody's Feelings\nAngie smoothed out her beach towel and lay down in the shade of the umbrella. It was a quiet place, and she was glad. She had just finished performing an international concert tour, and she was so ready to rest.\n\"You must be exhausted,\" her mother said. \"You've never done so many shows in a single tour.\"\n\"It was pretty awful,\" Angie muttered. They were both a little surprised to hear her say it.\n\"What was awful?\" asked her mother with concern in her voice.\n\"I didn't mean to say that,\" Angie dodged. She sat up and looked out over the ocean. \"I mean, it's great. Everybody wants to be famous, right? Everybody wants loads of admiring fans.\"\n\"Well, you're not everybody, honey.\"\nAngie said, \"I'm sorry—I didn't mean to say that the tour was awful. I know I should be so grateful for everything I get to do. It's silly for me to describe it as awful.\"\nHer mother looked at her seriously. \"You keep saying how you think you should feel. How do you really feel, though?\"\nAngie had never really let herself think about how she felt about being a famous musician. \"I guess I feel tired. I'm tired of photographers and busy schedules. I'm tired of travelling all of the time. I miss way back when I was just a girl with a guitar who went to school like everybody else.\"\nHer mother gave her a hug. \"Why didn't you tell us you felt this way?\"\n\"I never realized it,\" she answered. \"I guess I always felt like I shouldn't feel that way, so I didn't let myself.\"\n\"Well, that's done,\" her mother said. \"Let's call your agent and tell her you're retiring. You didn't make any commitments past the concert tour. I think it's time you got to know your own feelings instead of everybody else's.\"\n\nText 2\n\nRead the two stories.\nRocket Car\nMarquis's mom helped him into the backseat and gave her son a hug. \"I know you don't want to go to a new school, and the rocket car is different, but it's all going to be for the best. Be brave, honey.\" To the car, she said, \"He's a little nervous. Be friendly.\"\n\"Hello, Marquis,\" said the car. \"It's nice to meet you. I'll be driving you to school today.\" Marquis just folded his arms across his chest. \"I think you'll really enjoy the ride,\" the car announced. \"In just thirty minutes, we'll arrive at Neil Armstrong Academy on Neptune.\"\n\"I don't care. My friends won't be there,\" he said. \"And I have to travel thirty minutes to and from school every day. It's such a waste of time!\"\n\"Well, interplanetary travel is a bit of a big deal. I mean, a few generations ago—\"\n\"I don't care about that!\" Marquis snapped. \"I don't care that you're an expensive car and this is a great opportunity and I'll make new friends! I want to have a chance to choose something. Anything!\"\n\"Okay,\" the car said. A long pause hung in the air. \"I have an idea. What if you get to choose what you wear? I can prepare an outfit for you.\"\n\"That's impossible,\" he said.\n\"I know you don't care,\" the car said, \"But I'm an incredibly cool car. So, try me. Describe the clothing you would like to wear.\"\nMarquis held onto his silence for a moment, but the idea was too enticing. Finally, he described the clothing he wanted. A special device along one wall of the car started to hum.\n\"Are you serious?\" Marquis said. \"That's cool. Really cool. Hey, what should I call you?\"\nThe car sounded encouraged as it said, \"Wow—I don't know. What do you want to call me?\"\n\"How about Rocky?\" Marquis said.\n\"Rocky. I love it,\" Rocky said proudly. The device beside Marquis beeped. \"Your clothes are ready! You can just open that little black door and pull them out.\"\nMarquis opened the door eagerly and pulled out a miniature set of hard plastic clothing. He smiled to himself. \"Thanks, Rocky,\" he said.\n\"Oops,\" said the car. \"Well, that didn't go as well as planned.\"\nMarquis shook his head. \"It's cool. Don't worry about it. Thanks.\"\n\nThe New Dog\n\"Now, it's not a real dog,\" Talibah's mother said, \"But robot dogs have become so advanced lately, we thought it would almost be as good. Your father won't be allergic to it.\"\nTalibah reached down past the wrapping paper and lifted the soft, wiggly creature out of the box. It certainly felt heavier than a real puppy, but it was otherwise incredibly lifelike. It nuzzled her hand with the top of its nose.\nShe hugged the robot close, and then hugged her parents. \"Thank you! He's perfect. I'll call him Lucky.\" Lifting the dog up, she looked into his chocolate-brown eyes, \"I can tell that this is the beginning of a beautiful friendship.\"\nTalibah took her new responsibility seriously. She read the puppy's manual from cover to cover. The designers had made it as realistic as possible. They had even surveyed thousands of pet owners and programed each robot dog with a unique personality based on a real dog. Her puppy had the personality of some dog named Heorot.\nOver the coming weeks, Talibah enjoyed her new life as a dog owner. She fed him a sort of food and gave him oil to drink. He never needed to go outside, but she took him out to play.\nOnce day, she took Lucky to the dog park. He sniffed around and tumbled gleefully with other dogs. Talibah breathed in the fresh air, delighted by her new life as a dog owner. She sat on a bench to watch him romp. There was an older woman sitting there already.\n\"Is the brown and white puppy yours?\" the lady asked.\nTalibah answered, \"Yes, I just got him for my birthday. His name is Lucky.\" Talibah called her dog over and introduced him to the lady. He nuzzled her hand with the top of his nose in the way he always did.\n\"Oh, how sweet. My old retriever Heorot used to do the exact same thing.\" A smile spread through her wrinkles to cover her entire face. \"What a good dog.\""]}, {"unit": "Comprehension Skills", "topic": "Central Ideas and Summaries", "lesson": "Identify the central idea of a passage", "texts": []}, {"unit": "Comprehension Skills", "topic": "Central Ideas and Summaries", "lesson": "Identify supporting details", "texts": []}, {"unit": "Comprehension Skills", "topic": "Central Ideas and Summaries", "lesson": "Create a reverse graphic organizer from the text", "texts": []}, {"unit": "Comprehension Skills", "topic": "Central Ideas and Summaries", "lesson": "Use a variety of transition words to convey relationships between ideas", "texts": []}, {"unit": "Comprehension Skills", "topic": "Central Ideas and Summaries", "lesson": "Identify an effective summary", "texts": []}, {"unit": "Comprehension Skills", "topic": "Central Ideas and Summaries", "lesson": "Identify an objective summary", "texts": []}, {"unit": "Comprehension Skills", "topic": "Central Ideas and Summaries", "lesson": "Construct the best summary of a text", "texts": []}, {"unit": "Comprehension Skills", "topic": "Summaries", "lesson": "Identify key ideas using the 5 Ws and an H", "texts": ["Read this story, paying close attention to the characters, setting, and events.\n\nThe Wonderful Pump\nBy L. Frank Baum\n\nNot many years ago there lived on a stony, barren New England farm a man and his wife. They were sober, honest people, working hard from early morning until dark to enable them to secure a scanty living from their poor land.\nTheir house, a small, one-storied building, stood upon the side of a steep hill, and the stones lay so thickly about it that scarcely anything green could grow from the ground. At the foot of the hill, a quarter of a mile from the house by the winding path, was a small brook, and the woman was obliged to go there for water and to carry it up the hill to the house. This was a tedious task, and with the other hard work that fell to her had made her gaunt and bent and lean.\nYet she never complained, but meekly and faithfully performed her duties, doing the housework, carrying the water and helping her husband hoe the scanty crop that grew upon the best part of their land.\nOne day, as she walked down the path to the brook, her big shoes scattering the pebbles right and left, she noticed a large beetle lying upon its back and struggling hard with its little legs to turn over, that its feet might again touch the ground. But this it could not accomplish; so the woman, who had a kind heart, reached down and gently turned the beetle with her finger. At once it scampered from the path and she went on to the brook.\nThe next day, as she came for water, she was surprised to see the beetle again lying upon its back and struggling helplessly to turn. Once more the woman stopped and set him upon his feet; and then, as she stooped over the tiny creature, she heard a small voice say: \"Oh, thank you! Thank you so much for saving me!\"\nHalf frightened at hearing a beetle speak in her own language, the woman started back and exclaimed: \"Oo wee! Surely you can't talk like humans!\"\nThen, recovering from her alarm, she again bent over the beetle, who answered her: \"Why shouldn't I talk, if I have anything to say?\n\"'Cause you're a bug,\" replied the woman.\n\"That is true; and you saved my life—saved me from my enemies, the sparrows. And this is the second time you have come to my assistance, so I owe you a debt of gratitude. Bugs value their lives as much as human beings, and I am a more important creature than you, in your ignorance, may suppose. But, tell me, why do you come each day to the brook?\"\n\"For water,\" she answered, staring stupidly down at the talking beetle.\n\"Isn't it hard work?\" the creature inquired.\n\"Yes; but there's no water on the hill,\" said she.\n\"Then dig a well and put a pump in it,\" replied the beetle.\nShe shook her head. \"My man tried it once; but there was no water,\" she said, sadly.\n\"Try it again,\" commanded the beetle; \"and in return for your kindness to me I will make this promise: if you do not get water from the well you will get that which is more precious to you. I must go now. Do not forget. Dig a well.\"\nAnd then, without pausing to say good-by, it ran swiftly away and was lost among the stones.\nThe woman returned to the house much perplexed by what the beetle had said, and when her husband came in from his work she told him the whole story.\nThe poor man thought deeply for a time, and then declared: \"Wife, there may be truth in what the bug told you. There must be magic in the world yet, if a beetle can speak; and if there is such a thing as magic we may get water from the well. The pump I bought to use in the well which proved to be dry is now lying in the barn, and the only expense in following the talking bug's advice will be the labor of digging the hole. Labor I am used to; so I will dig the well.\"\nThe next day he set about it, and dug so far down in the ground that he could hardly reach the top to climb out again; but not a drop of water was found.\n\"Perhaps you did not dig deep enough,\" his wife said, when he told her of his failure.\nSo the following day he made a long ladder, which he put into the hole; and then he dug, and dug, and dug, until the top of the ladder barely reached the top of the hole. But still there was no water.\nWhen the woman next went to the brook with her pail she saw the beetle sitting upon a stone beside her path. So she stopped and said: \"My husband has dug the well; but there is no water.\"\n\"Did he put the pump in the well?\" asked the beetle.\n\"No,\" she answered.\n\"Then do as I commanded; put in the pump, and if you do not get water I promise you something still more precious.\"\nSaying which, the beetle swiftly slid from the stone and disappeared. The woman went back to the house and told her husband what the bug had said.\n\"Well,\" replied the simple fellow, \"there can be no harm in trying.\"\nSo he got the pump from the barn and placed it in the well, and then he took hold of the handle and began to pump, while his wife stood by to watch what would happen.\nNo water came, but after a few moments a gold piece dropped from the spout of the pump, and then another, and another, until several handfuls of gold lay in a little heap upon the ground.\nThe man stopped pumping then and ran to help his wife gather the gold pieces into her apron; but their hands trembled so greatly through excitement and joy that they could scarcely pick up the sparkling coins.\nAt last she gathered them close to her bosom and together they ran to the house, where they emptied the precious gold upon the table and counted the pieces.\nAll were stamped with the design of the United States mint and were worth five dollars each. Some were worn and somewhat discolored from use, while others seemed bright and new, as if they had not been much handled. When the value of the pieces was added together they were found to be worth three hundred dollars.\nSo they at once took a number of the gold pieces and went to the town to purchase provisions and clothing and many things of which they had long stood in need; but so proud were they of their newly acquired wealth that they took no pains to conceal it. They wanted everyone to know they had money, and so it was no wonder that when some of the wicked men in the village saw the gold they longed to possess it themselves.\n\"If they spend this money so freely,\" whispered one to another, \"there must be a great store of gold at their home.\"\n\"That is true,\" was the answer. \"Let us hasten there before they return and ransack the house.\"\nSo they left the village and hurried away to the farm on the hill, where they broke down the door and turned everything topsy turvy until they had discovered the gold in the wood-box and the teapot. It did not take them long to make this into bundles, which they slung upon their backs and carried off, and it was probably because they were in a great hurry that they did not stop to put the house in order again.\nPresently the good woman and her husband came up the hill from the village with their arms full of bundles and followed by a crowd of small boys who had been hired to help carry the purchases. Then followed others, youngsters and country louts, attracted by the wealth and prodigality of the pair, who, from simple curiosity, trailed along behind like the tail of a comet and helped swell the concourse into a triumphal procession. Last of all came Guggins, the shopkeeper, carrying with much tenderness a new silk dress which was to be paid for when they reached the house, all the money they had taken to the village having been lavishly expended.\nThe farmer, who had formerly been a modest man, was now so swelled with pride that he tipped the rim of his hat over his left ear and smoked a big cigar that was fast making him ill. His wife strutted along beside him like a peacock, enjoying to the full the homage and respect her wealth had won from those who formerly deigned not to notice her, and glancing from time to time at the admiring procession in the rear.\nBut, alas for their newborn pride! When they reached the farmhouse they found the door broken in, the furniture strewn in all directions and their treasure stolen to the very last gold piece.\nThe crowd grinned and made slighting remarks of a personal nature, and Guggins, the shopkeeper, demanded in a loud voice the money for the silk dress he had brought.\nThen the woman whispered to her husband to run and pump some more gold while she kept the crowd quiet, and he obeyed quickly. But after a few moments he returned with a white face to tell her the pump was dry, and not a gold piece could now be coaxed from the spout.\nThe procession marched back to the village laughing and jeering at the farmer and his wife, who had pretended to be so rich; and some of the boys were naughty enough to throw stones at the house from the top of the hill. Mr. Guggins carried away his dress after severely scolding the woman for deceiving him, and when the couple at last found themselves alone their pride had turned to humiliation and their joy to bitter grief.\nJust before sundown the woman dried her eyes and, having resumed her ordinary attire, went to the brook for water. When she came to the flat stone she saw the King Beetle sitting upon it.\n\"The well is dry!\" she cried out, angrily.\n\"Yes,\" answered the beetle, calmly, \"you have pumped from it all the gold my people could find.\"\n\"But we are now ruined,\" said the woman, sitting down in the path beginning to weep; \"for robbers have stolen from us every penny we possessed.\"\n\"I'm sorry,\" returned the beetle; \"but it is your own fault. Had you not made so great a show of your wealth no one would have suspected you possessed a treasure, or thought to rob you. As it is, you have merely lost the gold which others have lost before you. It will probably be lost many times more before the world comes to an end.\"\n\"But what are we to do now?\" she asked.\n\"What did you do before I gave you the money?\"\n\"We worked from morning 'til night,\" said she.\n\"Then work still remains for you,\" remarked the beetle, composedly; \"no one will ever try to rob you of that, you may be sure!\" And he slid from the stone and disappeared for the last time.\nThis story should teach us to accept good fortune with humble hearts and to use it with moderation. For, had the farmer and his wife resisted the temptation to display their wealth ostentatiously, they might have retained it to this very day.", "Read the excerpt below from The Lost Princess of Oz by L. Frank Baum, paying close attention to key ideas in the text.\n\nChapter 13: The Truth Pond\n\nFrogman and Cayke left the Yip Country in search of the diamond-studded dishpan which had been mysteriously stolen from the Emerald City. One day during their journey, Cayke and the Frogman awoke in a grove in which they had passed the night sleeping on beds of leaves. There were plenty of farmhouses in the neighborhood, but no one seemed to welcome the puffy, haughty Frogman or the little dried-up Cayke, and so they slept comfortably enough underneath the trees of the grove. The Frogman wakened first on this morning, and after going to the tree where Cayke slept and finding her still wrapped in slumber, he decided to take a little walk and seek some breakfast. Coming to the edge of the grove, he observed half a mile away a pretty yellow house that was surrounded by a yellow picket fence, so he walked toward this house and on entering the yard found a Winkie woman picking up sticks with which to build a fire to cook her morning meal.\n\"For goodness sake!\" she exclaimed on seeing the Frogman. \"What are you doing out of your frog-pond?\"\n\"I am traveling in search of a jeweled gold dishpan, my good woman,\" he replied with an air of great dignity.\n\"You won't find it here, then,\" said she. \"Our dishpans are tin, and they're good enough for anybody. So go back to your pond and leave me alone.\" She spoke rather crossly and with a lack of respect that greatly annoyed the Frogman.\n\"Allow me to tell you, madam,\" said he, \"that although I am a frog, I am the Greatest and Wisest Frog in all the world. I may add that I possess much more wisdom than any Winkie—man or woman—in this land. Wherever I go, people fall on their knees before me and render homage to the Great Frogman! No one else knows so much as I; no one else is so grand, so magnificent!\"\n\"If you know so much,\" she retorted, \"why don't you know where your dishpan is instead of chasing around the country after it?\"\n\"Presently,\" he answered, \"I am going where it is, but just now I am traveling and have had no breakfast. Therefore I honor you by asking you for something to eat.\"\n\"Oho! The Great Frogman is hungry as any tramp, is he? Then pick up these sticks and help me to build the fire,\" said the woman contemptuously.\n\"Me! The Great Frogman pick up sticks?\" he exclaimed in horror. \"In the Yip Country where I am more honored and powerful than any King could be, people weep with joy when I ask them to feed me.\"\n\"Then that's the place to go for your breakfast,\" declared the woman.\n\"I fear you do not realize my importance,\" urged the Frogman. \"Exceeding wisdom renders me superior to menial duties.\"\n\"It's a great wonder to me,\" remarked the woman, carrying her sticks to the house, \"that your wisdom doesn't inform you that you'll get no breakfast here.\" And she went in and slammed the door behind her.\nThe Frogman felt he had been insulted, so he gave a loud croak of indignation and turn
